name: Hermes Agent
description: |
  Führt Hermes Agent als Ersatz für anthropics/claude-code-action aus.
  Unterstützt Anthropic-kompatible APIs (Claude, z.ai, OpenRouter, etc.) und native Hermes-Funktionen.

  Verwendet Docker für deterministische Ausführung in GitHub Actions.

  Voraussetzungen (Repo-Secrets):
  - HERMES_API_KEY (für API-Server-Modus)
  - ODER provider-spezifische Keys (z. B. ANTHROPIC_API_KEY, GLM_API_KEY)

inputs:
  hermes_args:
    description: 'Argumente für hermes chat (z. B. --provider --model --allowedTools)'
    required: true
    type: string
  github_token:
    description: 'GitHub Token für gh-Befehle'
    required: true
    type: string
  hermes_api_key:
    description: 'API-Key für Hermes API-Server (optional, falls API_SERVER_ENABLED=true)'
    required: false
    type: string
  # Provider-Keys als INPUTS (nicht via secrets-Context — der ist in Composite-Actions nicht
  # verfügbar; der Aufrufer-Workflow reicht die Secrets durch). Alle optional/leer per Default.
  openrouter_api_key:
    description: 'OpenRouter-API-Key (Secret OPENROUTER_API_KEY), Pflicht für ai_backend=openrouter.'
    required: false
    default: ''
  zai_api_key:
    description: 'z.ai-API-Key (Secret ZAI_API_KEY), nur falls z.ai über Hermes geroutet wird.'
    required: false
    default: ''
  claude_code_oauth_token:
    description: 'Claude-Code-OAuth-Token (Secret CLAUDE_CODE_OAUTH_TOKEN), nur für den Anthropic-Default über Hermes.'
    required: false
    default: ''
  ai_backend:
    description: 'KI-Backend (anthropic|zai|hermes|openrouter)'
    required: false
    type: string
    default: 'anthropic'
  provider:
    description: 'Provider für Hermes (z. B. anthropic, zai, openrouter)'
    required: false
    type: string
    default: ''
  model:
    description: 'Modell (z. B. claude-sonnet-4-6, glm-4.7)'
    required: false
    type: string
    default: ''
  resume_arg:
    description: 'Session-Resume Argument (z. B. --resume session-id)'
    required: false
    type: string
    default: ''

outputs:
  session_id:
    description: 'Hermes Session-ID (für Resume)'
    value: ${{ steps.run-hermes.outputs.session_id }}
  execution_file:
    description: 'Ausführungsdatei (für Kosten-Zusammenfassung)'
    value: ${{ steps.run-hermes.outputs.execution_file }}
  outcome:
    description: 'Ergebnis (success|cancelled|failure)'
    value: ${{ steps.run-hermes.outputs.outcome }}

runs:
  using: composite
  steps:
    # Umgebungsvariablen für Docker vorbereiten
    - name: Umgebungsvariablen konfigurieren
      id: configure-env
      shell: bash
      run: |
        # Setze Provider-spezifische Variablen basierend auf ai_backend
        case "${{ inputs.ai_backend }}" in
          zai)
            echo "HERMES_PROVIDER=zai" >> "$GITHUB_ENV"
            echo "HERMES_MODEL=${{ inputs.model || 'glm-4.7' }}" >> "$GITHUB_ENV"
            echo "ANTHROPIC_BASE_URL=https://api.z.ai/api/anthropic" >> "$GITHUB_ENV"
            echo "ANTHROPIC_API_KEY=${{ inputs.zai_api_key }}" >> "$GITHUB_ENV"
            ;;
          openrouter)
            # OpenRouter-Modell-IDs sind provider-präfixiert (z. B. anthropic/…, deepseek/…).
            # TODO: Default-ID gegen den realen OpenRouter-Katalog verifizieren/anpassen.
            echo "HERMES_PROVIDER=openrouter" >> "$GITHUB_ENV"
            echo "HERMES_MODEL=${{ inputs.model || 'anthropic/claude-sonnet-4.5' }}" >> "$GITHUB_ENV"
            echo "OPENROUTER_API_KEY=${{ inputs.openrouter_api_key }}" >> "$GITHUB_ENV"
            ;;
          hermes)
            echo "HERMES_PROVIDER=custom" >> "$GITHUB_ENV"
            echo "HERMES_MODEL=${{ inputs.model || 'hermes-agent' }}" >> "$GITHUB_ENV"
            echo "HERMES_API_SERVER_ENABLED=true" >> "$GITHUB_ENV"
            echo "HERMES_API_SERVER_KEY=${{ inputs.hermes_api_key }}" >> "$GITHUB_ENV"
            echo "ANTHROPIC_BASE_URL=http://localhost:8642/v1" >> "$GITHUB_ENV"
            echo "ANTHROPIC_API_KEY=${{ inputs.hermes_api_key }}" >> "$GITHUB_ENV"
            ;;
          *)
            # Default: Anthropic
            echo "HERMES_PROVIDER=anthropic" >> "$GITHUB_ENV"
            echo "HERMES_MODEL=${{ inputs.model || 'claude-sonnet-4-6' }}" >> "$GITHUB_ENV"
            echo "CLAUDE_CODE_OAUTH_TOKEN=${{ inputs.claude_code_oauth_token }}" >> "$GITHUB_ENV"
            ;;
        esac

        # Übernehme explizite Provider/Model-Inputs falls gesetzt
        if [ -n "${{ inputs.provider }}" ]; then
          echo "HERMES_PROVIDER=${{ inputs.provider }}" >> "$GITHUB_ENV"
        fi
        if [ -n "${{ inputs.model }}" ]; then
          echo "HERMES_MODEL=${{ inputs.model }}" >> "$GITHUB_ENV"
        fi

    # Hermes in Docker ausführen
    - name: Hermes Agent ausführen
      id: run-hermes
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        # Args via env (NICHT direkt in die Shell interpoliert — GitHub-Actions-Injection-Schutz).
        HERMES_ARGS: ${{ inputs.hermes_args }}
        RESUME_ARG: ${{ inputs.resume_arg }}
        # Performance-Optimierungen (wie bei Claude Code)
        HERMES_DISABLE_TELEMETRY: '1'
        BASH_MAX_OUTPUT_LENGTH: '20000'
        HERMES_HIDE_BANNER: '1'
        API_TIMEOUT_MS: '3000000'
      run: |
        # Baue Docker-Befehl
        DOCKER_ARGS=()
        DOCKER_ARGS+=("-e" "GH_TOKEN=$GH_TOKEN")
        DOCKER_ARGS+=("-e" "HERMES_PROVIDER=$HERMES_PROVIDER")
        DOCKER_ARGS+=("-e" "HERMES_MODEL=$HERMES_MODEL")
        DOCKER_ARGS+=("-e" "HERMES_DISABLE_TELEMETRY=$HERMES_DISABLE_TELEMETRY")
        DOCKER_ARGS+=("-e" "BASH_MAX_OUTPUT_LENGTH=$BASH_MAX_OUTPUT_LENGTH")
        DOCKER_ARGS+=("-e" "HERMES_HIDE_BANNER=$HERMES_HIDE_BANNER")
        DOCKER_ARGS+=("-e" "API_TIMEOUT_MS=$API_TIMEOUT_MS")

        # Provider-spezifische Keys
        if [ -n "$ANTHROPIC_BASE_URL" ]; then
          DOCKER_ARGS+=("-e" "ANTHROPIC_BASE_URL=$ANTHROPIC_BASE_URL")
        fi
        if [ -n "$ANTHROPIC_API_KEY" ]; then
          DOCKER_ARGS+=("-e" "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY")
        fi
        if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
          DOCKER_ARGS+=("-e" "CLAUDE_CODE_OAUTH_TOKEN=$CLAUDE_CODE_OAUTH_TOKEN")
        fi
        if [ -n "$OPENROUTER_API_KEY" ]; then
          DOCKER_ARGS+=("-e" "OPENROUTER_API_KEY=$OPENROUTER_API_KEY")
        fi
        if [ -n "$ZAI_API_KEY" ]; then
          DOCKER_ARGS+=("-e" "ZAI_API_KEY=$ZAI_API_KEY")
          DOCKER_ARGS+=("-e" "GLM_API_KEY=$ZAI_API_KEY")
        fi
        if [ -n "$HERMES_API_SERVER_ENABLED" ]; then
          DOCKER_ARGS+=("-e" "API_SERVER_ENABLED=$HERMES_API_SERVER_ENABLED")
          DOCKER_ARGS+=("-e" "API_SERVER_KEY=$HERMES_API_SERVER_KEY")
          DOCKER_ARGS+=("-e" "API_SERVER_HOST=0.0.0.0")
          DOCKER_ARGS+=("-e" "API_SERVER_PORT=8642")
        fi

        # Hermes-Args (statisch im Workflow definiert) in ein Array zerlegen, das eingebettete Quotes
        # EHRT: `--allowedTools "Bash(gh issue:*),…"` und `--append-system-prompt "…"` bleiben je EIN
        # Argument. Unquoted `$COMBINED_ARGS` würde word-splitten + globben und die Quotes zerreißen.
        # xargs interpretiert Quotes/Whitespace, aber KEINE Backticks/$()/Globs — die Prompts enthalten
        # literale Backticks (`date +%s`) und `*`; deshalb bewusst NICHT `eval`.
        ARG_ARRAY=()
        while IFS= read -r _arg; do ARG_ARRAY+=("$_arg"); done \
          < <(printf '%s' "$HERMES_ARGS $RESUME_ARG" | xargs -n1 printf '%s\n')

        echo "Starte Hermes mit ${#ARG_ARRAY[@]} Argumenten"

        # Docker run mit den gesetzten Variablen. errexit temporär aus, damit ein Docker-Fehler
        # NICHT das Skript vor der Outcome-Erfassung abbricht; Docker-Exit via PIPESTATUS[0]
        # (nicht $? nach der tee-Pipe / nachfolgenden echos — das war der alte Bug).
        # TODO(H2): Image auf einen Digest pinnen, sobald ghcr.io/nousresearch/hermes-agent verifiziert
        # ist (`:latest` ist mutabel und widerspricht der SHA-Pin-Konvention des Repos).
        set +e
        docker run \
          --rm \
          -v "$PWD:/workspace" \
          -w "/workspace" \
          "${DOCKER_ARGS[@]}" \
          ghcr.io/nousresearch/hermes-agent:latest \
          hermes chat \
            --bare \
            --provider "$HERMES_PROVIDER" \
            --model "$HERMES_MODEL" \
            "${ARG_ARRAY[@]}" \
            2>&1 | tee hermes-execution.log
        DOCKER_RC=${PIPESTATUS[0]}
        set -e

        # Extrahiere Session-ID aus der Ausführung (Hermes gibt diese in Logs aus)
        # Falls nicht verfügbar, generiere eine Dummy-ID für Kompatibilität
        SESSION_ID=$(grep -oP 'session-[a-f0-9-]{36}' hermes-execution.log | head -1 || echo "session-$(date +%s)")
        echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
        echo "execution_file=hermes-execution.log" >> "$GITHUB_OUTPUT"

        # Outcome anhand des ECHTEN Docker-Exit-Codes bestimmen. Der Schritt bleibt bewusst GRÜN
        # (kein `exit $DOCKER_RC`) — die gesamte nachgelagerte Pipeline ist outcome-getrieben (if:
        # always() liest steps.agent-output.outputs.outcome) und entspricht so dem Claude-Pfad, dessen
        # Agent-Schritt bei Fehlern ebenfalls nicht hart abbricht, sondern das Ergebnis als Output trägt.
        if [ "$DOCKER_RC" -eq 0 ]; then
          echo "outcome=success" >> "$GITHUB_OUTPUT"
        else
          echo "outcome=failure" >> "$GITHUB_OUTPUT"
        fi
