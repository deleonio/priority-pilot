name: 'Issue-Memory Save'
description: 'Issue-Storage sichern (ADR 0007): Phasen-Notizen als Fetch-then-Commit auf den Harness-Branch ai/harness/{N} — derselbe Branch, auf dem Spec/Impl arbeiten und der per PR nach main gemergt wird. NACH dem claude-Step aufrufen — origin trägt bereits das App-Token aus setup-claude.'

inputs:
  issue-number:
    description: 'Issue-Nummer = Storage-Key (bei PRs ohne Closing-Issue die PR-Nummer, gleiche Auflösung wie setup-claude).'
    required: true
  phase:
    description: 'Phasen-Name (triage|ux|spec|implement|fixup|review|documenter) für die Commit-Message.'
    required: true

outputs:
  new-notes:
    description: 'Anzahl NEUER/geänderter Phasen-Notizen (Blob-Diff gegen den Branch-Stand; ohne Branch = alles neu). Bereits committete Notizen zählen NICHT.'
    value: ${{ steps.save.outputs.new-notes }}

runs:
  using: composite
  steps:
    - name: Harness-Branch ai/harness/{N} fortschreiben
      id: save
      shell: bash
      env:
        ISSUE_NR: ${{ inputs.issue-number }}
        PHASE: ${{ inputs.phase }}
        RUN_ID: ${{ github.run_id }}
        HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        GIT_AUTHOR_NAME: deleonio
        GIT_AUTHOR_EMAIL: 6279703+deleonio@users.noreply.github.com
        GIT_COMMITTER_NAME: deleonio
        GIT_COMMITTER_EMAIL: 6279703+deleonio@users.noreply.github.com
      run: |
        set -uo pipefail
        BRANCH="ai/harness/${ISSUE_NR}"

        # Commit über einen TEMP-INDEX bauen: Workspace und sein Index bleiben unberührt —
        # die Speicher-Phasen (Triage/UX/Review) committieren selbst nichts, ihr HEAD ist
        # main bzw. der PR-Checkout. WICHTIG: GIT_INDEX_FILE wird erst NACH dem Fetch
        # exportiert und auf einen PFAD gesetzt, der noch nicht existiert — eine 0-Byte-
        # Index-Datei ist für Git ein ungültiger Index und lässt selbst `git fetch` still
        # scheitern (belegt per lokalem Smoke-Test, #1009-Vorgeschichte).
        idx="$(mktemp -d)/index"
        parents=()
        has_base=0
        declare -A old_hash=()
        if git fetch --quiet origin "$BRANCH" 2>/dev/null && git rev-parse --verify -q FETCH_HEAD >/dev/null; then
          parents=(-p FETCH_HEAD)
          export GIT_INDEX_FILE="$idx"
          git read-tree "FETCH_HEAD^{tree}" # Fortschreiben: alter Branch-Stand ist die Basis
          # Diff-Basis für die notes-Zählung (#1010): Blob-Hashes des Branch-Stands.
          # ls-tree-Format: "<mode> <typ> <hash>\t<pfad>" → Hash als letztes Token vor dem Tab.
          has_base=1
          while IFS=$'\t' read -r meta path; do
            [ -n "$path" ] || continue
            old_hash["$path"]="${meta##* }"
          done < <(git ls-tree FETCH_HEAD -- .ai-memory 2>/dev/null)
        else
          # Erst-Anlage: Basis ist origin/main (KEIN orphan mehr, ADR 0007) — der Branch
          # wird ab Spec zum Arbeits-/PR-Branch und muss auf main aufsetzen. Fehlt auch
          # main (Pathologiefall), fällt der Commit auf den leeren Baum zurück.
          if git fetch --quiet origin main 2>/dev/null && git rev-parse --verify -q FETCH_HEAD >/dev/null; then
            parents=(-p FETCH_HEAD)
            export GIT_INDEX_FILE="$idx"
            git read-tree "FETCH_HEAD^{tree}"
          else
            export GIT_INDEX_FILE="$idx"
            git read-tree --empty
          fi
        fi

        # MEMORY.md bewusst NICHT gestaged: eingechecktes Dauergedächtnis, reist in den
        # normalen Phasen-Commits — ein alter Stand aus dem Storage dürfte es nie
        # überschreiben. state.json entfällt mit ADR 0007 (kein Konsument; sein Inhalt
        # wäre beim Merge des Harness-Branches als Ticket-Manifest in main gelandet).
        #
        # notes wird GETRENNT von staged gezählt. Ein reines "gesichert (1 Datei)" hieße
        # in Wahrheit "die Phase hat KEINEN Checkpoint geschrieben" — genau diese
        # Formulierung hat den toten Memory eine Woche lang als Erfolg getarnt.
        # #1010 AK1: notes zählt nur NEUE/geänderte Notizen (Blob-Diff gegen den
        # Branch-Stand, ohne Branch = alles neu). Ab Spec committet der Agent seine
        # Notiz selbst mit (nicht mehr gitignored) — der Blob-Diff hält den Save-Step
        # idempotent: schon committete Notizen erzeugen keinen zweiten Commit.
        staged=0
        notes=0
        # Nur echte Phasen-Notizen committen (triage|ux|spec|implement|fixup|review|documenter)
        # — NICHT die Body-/PR-Roundtrip-Fragmente (issue-{N}-body.md, -block.md, -pr-body*.md),
        # die Phasen als Write-Workaround nebenbei anlegen (SKILL-Hinweis Triage/Spec). Sie
        # bleiben lokal im Workspace und verfallen mit dem Runner (Kreuzverhör-Finding zum
        # ersten ADR-0007-Commit: sonst reisten Arbeitsfragmente bis nach main).
        while IFS= read -r f; do
          [ -f "$f" ] || continue
          blob="$(git hash-object -w "$f")"
          git update-index --add --cacheinfo "100644,${blob},$f"
          staged=$((staged + 1))
          if [ "$has_base" -eq 0 ] || [ "${old_hash[$f]:-}" != "$blob" ]; then
            notes=$((notes + 1))
          fi
        done < <(find .ai-memory -maxdepth 1 -type f -name 'issue-*.md' 2>/dev/null \
                   | grep -E '/issue-[0-9]+-(triage|ux|spec|implement|fixup|review|documenter)\.md$' || true)
        echo "new-notes=${notes}" >> "$GITHUB_OUTPUT"

        if [ "$staged" -eq 0 ] && [ "$has_base" -eq 1 ]; then
          echo "::notice title=🗄️ Issue-Storage leer::Keine Phasen-Notiz vorhanden — $BRANCH unberührt."
          exit 0
        fi

        # Erst-Anlage OHNE Notiz (ADR 0007: der Branch existiert garantiert ab Phase 1 —
        # auch wenn der Agent crashte oder keine Notiz schrieb). Leerer Init-Commit auf
        # main-Basis; die Notiz folgt mit dieser oder der nächsten Phase.
        if [ "$staged" -eq 0 ] && [ "$notes" -eq 0 ]; then
          tree="$(git write-tree)"
          unset GIT_INDEX_FILE
          msg="memory: init (${PHASE}, run ${RUN_ID}, branch ${HEAD_BRANCH}) — Branch angelegt, Notiz folgt"
          commit="$(git commit-tree "$tree" ${parents[@]+"${parents[@]}"} -m "$msg")"
          if git push --quiet origin "${commit}:refs/heads/${BRANCH}"; then
            echo "::notice title=🗄️ Harness-Branch angelegt::${BRANCH} auf main-Basis (ohne Phasen-Notiz — keine geschrieben oder Lauf vor Notiz abgebrochen)."
            exit 0
          fi
          echo "::error title=❌ Init-Push fehlgeschlagen::${BRANCH} konnte nicht angelegt werden."
          exit 1
        fi

        if [ "$notes" -eq 0 ]; then
          # Warnung nur, wenn die PHASEN-EIGENE Notiz fehlt. Ab Spec committet der Agent
          # seine Notiz selbst mit — dann ist notes=0 der idempotente Normalfall. Fehlt
          # dagegen issue-{N}-{phase}.md komplett, hat die Phase KEINEN Checkpoint
          # geschrieben: genau dieser Fall hat den toten Memory eine Woche lang als
          # Erfolg getarnt (→ Warning, damit er in grünen Läufen sichtbar bleibt).
          own=".ai-memory/issue-${ISSUE_NR}-${PHASE}.md"
          if [ -f "$own" ]; then
            echo "::notice title=🗄️ Issue-Storage aktuell::Alle Phasen-Notizen sind bereits committet (Agent hat sie mitgenommen) — kein zusätzlicher Commit nötig."
          else
            echo "::warning title=⚠️ Keine Phasen-Notiz::${PHASE} hat keinen Checkpoint nach .ai-memory/ geschrieben — die Folgephase startet ohne Resume-Kontext."
          fi
          exit 0
        fi

        tree="$(git write-tree)"
        unset GIT_INDEX_FILE # ab hier nur noch Plumbing ohne Index; Fetch im Retry braucht ihn nicht
        msg="memory: ${PHASE} (run ${RUN_ID}, branch ${HEAD_BRANCH})"
        commit="$(git commit-tree "$tree" ${parents[@]+"${parents[@]}"} -m "$msg")"

        # Push mit Retry: non-FF (remote zwischenzeitlich bewegt, z. B. versetzter
        # Continue-Sweep oder Agenten-Push) → frisch fetchen, Baum auf den neuen HEAD
        # re-parenten, nochmal. Der Baum ist autoritativ — Re-Parenten verliert nichts.
        for attempt in 1 2 3; do
          if git push --quiet origin "${commit}:refs/heads/${BRANCH}"; then
            echo "::notice title=🗄️ Issue-Storage gesichert::${BRANCH} ← ${msg} (${notes} neue Notiz(en))."
            exit 0
          fi
          if git fetch --quiet origin "$BRANCH" 2>/dev/null && git rev-parse --verify -q FETCH_HEAD >/dev/null; then
            commit="$(git commit-tree "$tree" -p FETCH_HEAD -m "$msg")"
          fi
        done
        echo "::error title=❌ Issue-Storage Push fehlgeschlagen::${BRANCH} nach 3 Versuchen nicht aktualisiert — die Folge-Phase restored einen älteren Stand."
        exit 1
