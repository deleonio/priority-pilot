name: 'Issue-Memory Save'
description: 'Issue-Storage sichern (ADR 0010): Phasen-Notizen als Workflow-Artefakt ai-memory-issue-<N>-<phase>-<run> hochladen — kein Commit, kein Branch. NACH dem Agenten-Step aufrufen. Der Restore (neuestes Artefakt je Issue) passiert in setup-agent; der Load-Step legt unter $RUNNER_TEMP eine Baseline (sha256 je Notiz), an der new-notes hier ansetzt.'

inputs:
  issue-number:
    description: 'Issue-Nummer = Storage-Key (bei PRs ohne Closing-Issue die PR-Nummer, gleiche Auflösung wie setup-agent).'
    required: true
  phase:
    description: 'Phasen-Name (triage|ux|spec|implement|fixup|review|documenter) für den Artefakt-Namen.'
    required: true

outputs:
  new-notes:
    description: 'Anzahl NEUER/geänderter Phasen-Notizen (sha256-Diff gegen die Load-Baseline; ohne Baseline = alles neu). Unveränderte restaurierte Notizen zählen NICHT.'
    value: ${{ steps.check.outputs.new-notes }}

runs:
  using: composite
  steps:
    - name: Notizen prüfen (Baseline-Diff, eigene Notiz vorhanden?)
      id: check
      shell: bash
      env:
        ISSUE_NR: ${{ inputs.issue-number }}
        PHASE: ${{ inputs.phase }}
      run: |
        set -uo pipefail
        BASELINE="$RUNNER_TEMP/ai-memory-baseline.sha"
        # Nur echte Phasen-Notizen — NICHT die Body-/PR-Roundtrip-Fragmente
        # (issue-{N}-body.md, -block.md, -pr-body*.md), die Phasen als Write-Workaround
        # anlegen. Sie bleiben lokal im Workspace und verfallen mit dem Runner.
        notes=0
        files=0
        while IFS= read -r f; do
          [ -f "$f" ] || continue
          files=$((files + 1))
          key="$(basename "$f"):$(sha256sum "$f" | cut -d' ' -f1)"
          if ! grep -qxF "$key" "$BASELINE" 2>/dev/null; then
            notes=$((notes + 1))
          fi
        done < <(find .ai-memory -maxdepth 1 -type f -name 'issue-*.md' 2>/dev/null \
                   | grep -E '/issue-[0-9]+-(triage|ux|spec|implement|fixup|review|documenter)\.md$' || true)
        echo "new-notes=${notes}" >> "$GITHUB_OUTPUT"
        echo "has-files=${files}" >> "$GITHUB_OUTPUT"

        if [ "$files" -eq 0 ]; then
          echo "::notice title=🗄️ Issue-Storage leer::Keine Phasen-Notiz im Workspace — nichts hochzuladen."
          exit 0
        fi

        own=".ai-memory/issue-${ISSUE_NR}-${PHASE}.md"
        if [ ! -f "$own" ]; then
          echo "::warning title=⚠️ Keine Phasen-Notiz::${PHASE} hat keinen Checkpoint nach .ai-memory/ geschrieben — der Resume-Kontext dieser Phase fehlt."
        elif [ "$notes" -eq 0 ]; then
          echo "::notice title=🗄️ Issue-Storage unverändert::Alle Phasen-Notizen entsprechen dem geladenen Stand — die eigene Notiz ist bereits gesichert."
        fi

    - name: Artefakt hochladen (volle .ai-memory-Notizen, letzter Stand gewinnt)
      if: steps.check.outputs.has-files != '0' && steps.check.outputs.has-files != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        # Name je Phase+Run eindeutig; der Restore (setup-agent) nimmt das NEUESTE
        # Artefakt mit Prefix ai-memory-issue-<N>- — letzter Stand gewinnt, wie beim
        # Branch-Blob zuvor. Volle Notizenmenge (restauriert + eigene neue): das
        # neueste Artefakt ist damit in sich vollständig, kein Merge nötig.
        name: ai-memory-issue-${{ inputs.issue-number }}-${{ inputs.phase }}-${{ github.run_id }}
        path: .ai-memory/issue-*.md
        if-no-files-found: warn
