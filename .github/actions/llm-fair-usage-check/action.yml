name: 'Z.AI Fair-Usage-Check (1313)'
description: >-
  Durchsucht die Claude-Rohausgabe (/tmp/claude-output.log) nach dem z.ai-Fehler
  1313 (Fair Usage Policy / „Account geteilt"-Flagging) und schreibt das Ergebnis
  als Annotation + Job-Summary — pro Lauf sichtbar, ob das Limit zuschlägt.
runs:
  using: composite
  steps:
    - name: Rohausgabe auf 1313/Fair-Usage durchsuchen
      shell: bash
      run: |
        # Lief der Claude-Step nicht (Skip-Guard, früherer Fehler), gibt es nichts zu prüfen.
        [ -f /tmp/claude-output.log ] || exit 0
        # `|| true` ist PFLICHT, nicht Kosmetik: GitHub führt `shell: bash` mit `-eo pipefail`
        # aus. Findet grep nichts (= der Normalfall, kein Fair-Usage-Problem), liefert es exit 1,
        # pipefail reicht das durch die Pipe, und `-e` bricht den Step ab. Der Check schlug
        # dadurch GENAU DANN fehl, wenn alles in Ordnung war — invertierte Logik. Folge: Der
        # Review-Job wurde rot, das Merge-Gate zählte "4/6 Review" als fail und degradierte
        # saubere PRs zu ai:needs-changes (Fixup-Loop). Dieser Step ist rein informativ und darf
        # den Job NIEMALS scheitern lassen.
        FAIR_LINE="$(grep -E '\[1313\]|Fair Usage Policy' /tmp/claude-output.log | head -1 | cut -c1-400 || true)"
        if [ -n "$FAIR_LINE" ]; then
          echo "::error title=🚫 Z.AI Fair-Usage-Limit (1313)::${FAIR_LINE}"
          echo "🚫 **Z.AI Fair-Usage-Limit (1313):** \`${FAIR_LINE}\`" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "::notice title=✅ Kein Z.AI Fair-Usage-Fehler (1313)::LLM-Aufruf ohne Fair-Usage-Beschränkung"
          echo "- ✅ Z.AI Fair-Usage-Check (1313): kein Treffer" >> "$GITHUB_STEP_SUMMARY"
        fi
