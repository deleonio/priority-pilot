name: 'Setup Hermes/Claude Code Agent'
description: 'Preflight, App-Token, Hermes/Claude-Install + Config (Provider + KoliBri), Session-Restore, Auth, Invoke-Resolution — einheitlich für alle 5 Pipeline-Workflows'

inputs:
  agent:
    description: 'Coding-Agent (hermes | claude), default hermes'
    required: false
    default: 'hermes'
  needs-mcp:
    description: 'Ob KoliBri MCP für diesen Workflow benötigt wird (triage + implement = true)'
    required: false
    default: 'false'
  event-type:
    description: 'github.event_name (issues oder pull_request)'
    required: true
  ticket-ref:
    description: 'Issue- oder PR-Nummer (für Ticket-Auflösung)'
    required: true
  app-id:
    description: 'GitHub App ID (secret)'
    required: true
  app-private-key:
    description: 'GitHub App Private Key (secret)'
    required: true
  llm-provider:
    description: 'LLM Provider Variable (vars.LLM_PROVIDER)'
    required: true
  zai-api-key:
    description: 'ZAI API Key (secret)'
    required: false
    default: ''
  openrouter-api-key:
    description: 'OpenRouter API Key (secret)'
    required: false
    default: ''
  nous-portal-token:
    description: 'Nous Portal Token (secret)'
    required: false
    default: ''
  deepseek-model:
    description: 'DeepSeek-Modell für nicht-zai Provider (z.B. deepseek/deepseek-v4-flash für Implement/Fixup)'
    required: false
    default: 'deepseek/deepseek-v4-pro'
  claude-model:
    description: 'Claude-Modell (glm-5.1 für zai, anthropic/claude-sonnet-4 für openrouter)'
    required: false
    default: 'glm-5.1'

outputs:
  configured:
    description: 'Ob App-Secrets konfiguriert sind'
    value: ${{ steps.preflight.outputs.configured }}
  gh-token:
    description: 'GitHub Token für gh-Befehle (App-Token oder GITHUB_TOKEN)'
    value: ${{ steps.gh-token.outputs.token }}
  issue-number:
    description: 'Aufgelöste Issue-Nummer (für Issue-Events direkt, für PR-Events via closingIssuesReferences)'
    value: ${{ steps.ticket.outputs.issue-number }}
  session-artifact-name:
    description: 'Session-Artifact-Name (immer issue-basiert: hermes-session-issue-<nr>)'
    value: ${{ steps.ticket.outputs.session-artifact-name }}
  resume-flag:
    description: 'Resume-Flag für hermes chat (--resume <id> oder leer)'
    value: ${{ steps.session-restore.outputs.resume-flag }}
  provider-flag:
    description: 'Provider-Flag (--provider zai oder --provider custom) — hermes-Pfad'
    value: ${{ steps.resolve-model.outputs.provider-flag }}
  model:
    description: 'Modell-Name (glm-5.1 oder DeepSeek-Modell) — hermes-Pfad'
    value: ${{ steps.resolve-model.outputs.model }}
  invoke-cmd:
    description: 'Invoke-Befehl: hermes chat -q | claude -p'
    value: ${{ steps.resolve-model.outputs.invoke-cmd }}
  invoke-args:
    description: 'Invoke-Argumente (hermes-Flags oder claude-Flags inkl. --allowedTools)'
    value: ${{ steps.resolve-model.outputs.invoke-args }}

runs:
  using: composite
  steps:
    - name: Voraussetzung prüfen (GitHub-App-Secrets)
      id: preflight
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
      shell: bash
      run: |
        if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
          echo "::warning::GitHub-App-Secrets fehlen — Lauf wird übersprungen."
          echo "configured=false" >> "$GITHUB_OUTPUT"
        else
          echo "configured=true" >> "$GITHUB_OUTPUT"
        fi

    - name: GitHub-App-Token erzeugen
      id: app-token
      if: steps.preflight.outputs.configured == 'true'
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}

    - name: GH_TOKEN-Fallback setzen (App-Token oder GITHUB_TOKEN)
      id: gh-token
      shell: bash
      run: |
        APP_TOK="${{ steps.app-token.outputs.token }}"
        if [ -n "$APP_TOK" ] && [ "$APP_TOK" != "null" ]; then
          echo "token=$APP_TOK" >> "$GITHUB_OUTPUT"
          echo "::notice::Nutze GitHub-App-Token für gh-Befehle."
        else
          echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
          echo "::warning::App-Token nicht verfügbar — nutze GITHUB_TOKEN (Achtung: Label-Wechsel lösen ggf. keine Folge-Workflows aus)."
        fi

    - name: Git-Credentials für Push konfigurieren (App-Token)
      if: steps.preflight.outputs.configured == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.gh-token.outputs.token }}
      run: |
        git config --global "url.https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
        echo "::notice::Git-Credentials für App-Token konfiguriert."

    - name: Ticket-ID auflösen (Issue-Nummer für Session)
      id: ticket
      if: steps.preflight.outputs.configured == 'true'
      env:
        GH_TOKEN: ${{ steps.gh-token.outputs.token }}
        EVENT_TYPE: ${{ inputs.event-type }}
        TICKET_REF: ${{ inputs.ticket-ref }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      shell: bash
      run: |
        if [ "$EVENT_TYPE" = "pull_request" ]; then
          ISSUE_NR=$(gh pr view "$TICKET_REF" --repo "$GITHUB_REPOSITORY" \
            --json closingIssuesReferences \
            --jq '[.closingIssuesReferences[].number] | first' 2>/dev/null || echo "")
          if [ -z "$ISSUE_NR" ] || [ "$ISSUE_NR" = "null" ]; then
            ISSUE_NR="$TICKET_REF"
            echo "::notice::Kein Closing-Issue am PR #$TICKET_REF gefunden — nutze PR-Nummer als Fallback."
          else
            echo "::notice::PR #$TICKET_REF → Issue #$ISSUE_NR (Session-Archiv issue-basiert)."
          fi
        else
          ISSUE_NR="$TICKET_REF"
        fi
        echo "issue-number=$ISSUE_NR" >> "$GITHUB_OUTPUT"
        echo "session-artifact-name=hermes-session-issue-$ISSUE_NR" >> "$GITHUB_OUTPUT"

    # ════════════════════════════════════════════════════════════════════════════
    # HERMES-PATH (agent=hermes) — byte-identisch zu vorher, keine Änderung
    # ════════════════════════════════════════════════════════════════════════════
    - name: Cache-Key für uv berechnen
      id: uv-cache-key
      if: steps.preflight.outputs.configured == 'true' && inputs.agent == 'hermes'
      shell: bash
      run: echo "week=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"

    - name: uv-Paketcache wiederherstellen
      if: steps.preflight.outputs.configured == 'true' && inputs.agent == 'hermes'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cache/uv
          ~/.local/share/uv
        key: uv-hermes-${{ runner.os }}-${{ steps.uv-cache-key.outputs.week }}
        restore-keys: uv-hermes-${{ runner.os }}-

    - name: Hermes installieren
      if: steps.preflight.outputs.configured == 'true' && inputs.agent == 'hermes'
      shell: bash
      run: |
        curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --skip-browser --skip-setup
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Hermes konfigurieren (Provider + KoliBri)
      if: steps.preflight.outputs.configured == 'true' && inputs.agent == 'hermes'
      shell: bash
      env:
        LLM_PROVIDER: ${{ inputs.llm-provider }}
        ZAI_API_KEY: ${{ inputs.zai-api-key }}
        NOUS_PORTAL_TOKEN: ${{ inputs.nous-portal-token }}
      run: |
        if [ "$LLM_PROVIDER" = "zai" ]; then
          hermes config set model.provider zai
          printf 'ZAI_API_KEY=%s\n' "$ZAI_API_KEY" > "$HERMES_HOME/.env"
          echo "::notice::Provider: Z.AI (GLM-5.1)"
        else
          hermes config set model.provider custom
          hermes config set model.base_url https://inference-api.nousresearch.com/v1
          hermes config set model.api_key "$NOUS_PORTAL_TOKEN"
          echo "::notice::Provider: Nous Portal (DeepSeek)"
        fi
        pip install mcp -q
        hermes mcp add kolibri --url https://public-ui-kolibri-mcp.vercel.app/mcp

    # ════════════════════════════════════════════════════════════════════════════
    # CLAUDE CODE-PATH (agent=claude)
    # ════════════════════════════════════════════════════════════════════════════
    - name: Claude Code installieren
      if: steps.preflight.outputs.configured == 'true' && inputs.agent == 'claude'
      shell: bash
      run: |
        npm install -g @anthropic-ai/claude-code
        echo "::notice::Claude Code CLI installiert."

    - name: Claude Code Trust-Dialog für CI-Workspace akzeptieren
      if: steps.preflight.outputs.configured == 'true' && inputs.agent == 'claude'
      shell: bash
      run: |
        mkdir -p "$HOME/.claude"
        CLAUDE_JSON="$HOME/.claude.json"
        WORKSPACE_PATH="${{ github.workspace }}"
        if [ -f "$CLAUDE_JSON" ]; then
          tmp=$(mktemp)
          jq --arg wp "$WORKSPACE_PATH" '.projects[$wp].hasTrustDialogAccepted = true' "$CLAUDE_JSON" > "$tmp" && mv "$tmp" "$CLAUDE_JSON"
        else
          jq -n --arg wp "$WORKSPACE_PATH" '{projects: {($wp): {hasTrustDialogAccepted: true}}}' > "$CLAUDE_JSON"
        fi
        echo "::notice::Claude Code Trust-Dialog für CI-Workspace ($WORKSPACE_PATH) akzeptiert."

    - name: Claude Code konfigurieren (Provider + Env)
      if: steps.preflight.outputs.configured == 'true' && inputs.agent == 'claude'
      shell: bash
      env:
        LLM_PROVIDER: ${{ inputs.llm-provider }}
        ZAI_API_KEY: ${{ inputs.zai-api-key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
      run: |
        if [ "$LLM_PROVIDER" = "openrouter" ]; then
          echo "ANTHROPIC_BASE_URL=https://openrouter.ai/api" >> "$GITHUB_ENV"
          echo "ANTHROPIC_API_KEY=$OPENROUTER_API_KEY" >> "$GITHUB_ENV"
          echo "::notice::Provider: OpenRouter via Claude Code"
        else
          echo "ANTHROPIC_BASE_URL=https://api.z.ai/api/anthropic" >> "$GITHUB_ENV"
          echo "ANTHROPIC_API_KEY=$ZAI_API_KEY" >> "$GITHUB_ENV"
          echo "::notice::Provider: Z.AI (GLM-5.1) via z.ai Anthropic-kompatiblen Endpoint"
        fi

    - name: KoliBri MCP für Claude registrieren (nur triage + implement)
      if: steps.preflight.outputs.configured == 'true' && inputs.agent == 'claude' && inputs.needs-mcp == 'true'
      shell: bash
      run: |
        claude mcp add --transport http kolibri https://public-ui-kolibri-mcp.vercel.app/mcp
        echo "::notice::KoliBri MCP registriert."

    # ════════════════════════════════════════════════════════════════════════════
    # SHARED: Session-Archiv + Restore (Hermes nur; Claude läuft frisch)
    # ════════════════════════════════════════════════════════════════════════════
    - name: Session-Archiv herunterladen
      id: session-dl
      if: steps.preflight.outputs.configured == 'true' && inputs.agent == 'hermes'
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: ${{ steps.ticket.outputs.session-artifact-name }}
        path: /tmp/hermes-session-restore

    - name: Session wiederherstellen
      id: session-restore
      if: steps.preflight.outputs.configured == 'true' && inputs.agent == 'hermes' && steps.session-dl.outcome == 'success'
      shell: bash
      run: |
        if [ -f /tmp/hermes-session-restore/hermes-session.tar.gz ]; then
          mkdir -p "$HERMES_HOME"
          tar -xzf /tmp/hermes-session-restore/hermes-session.tar.gz -C "$HERMES_HOME"
          if [ -f "$HERMES_HOME/session_id.txt" ]; then
            RID=$(cat "$HERMES_HOME/session_id.txt")
            echo "resume-flag=--resume $RID" >> "$GITHUB_OUTPUT"
            echo "::notice::Session #$RID wiederhergestellt"
          fi
        fi

    - name: Resume-Flag für Claude leer setzen (kein Session-Resume)
      if: steps.preflight.outputs.configured == 'true' && inputs.agent == 'claude'
      shell: bash
      run: echo "resume-flag=" >> "$GITHUB_OUTPUT"

    # ════════════════════════════════════════════════════════════════════════════
    # AUTH-CHECK (agent-spezifisch)
    # ════════════════════════════════════════════════════════════════════════════
    - name: Auth prüfen (Hermes — provider-spezifisch)
      if: steps.preflight.outputs.configured == 'true' && inputs.agent == 'hermes'
      shell: bash
      env:
        LLM_PROVIDER: ${{ inputs.llm-provider }}
        ZAI_API_KEY: ${{ inputs.zai-api-key }}
        NOUS_PORTAL_TOKEN: ${{ inputs.nous-portal-token }}
      run: |
        if [ "$LLM_PROVIDER" = "zai" ]; then
          if [ -z "$ZAI_API_KEY" ]; then
            echo "::error title=Auth fehlt::ZAI_API_KEY nicht gesetzt — als Repo-Secret hinterlegen"
            exit 1
          fi
          echo "ZAI_API_KEY vorhanden."
        else
          if [ -z "$NOUS_PORTAL_TOKEN" ]; then
            echo "::error title=Auth fehlt::NOUS_PORTAL_TOKEN nicht gesetzt — als Repo-Secret hinterlegen"
            exit 1
          fi
          echo "NOUS_PORTAL_TOKEN vorhanden."
        fi

    - name: Auth prüfen (Claude — provider-spezifisch)
      if: steps.preflight.outputs.configured == 'true' && inputs.agent == 'claude'
      shell: bash
      env:
        LLM_PROVIDER: ${{ inputs.llm-provider }}
        ZAI_API_KEY: ${{ inputs.zai-api-key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
      run: |
        if [ "$LLM_PROVIDER" = "openrouter" ]; then
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error title=Auth fehlt::OPENROUTER_API_KEY nicht gesetzt — als Repo-Secret hinterlegen (Claude nutzt OpenRouter)"
            exit 1
          fi
          echo "OPENROUTER_API_KEY vorhanden (Claude via OpenRouter)."
        else
          if [ -z "$ZAI_API_KEY" ]; then
            echo "::error title=Auth fehlt::ZAI_API_KEY nicht gesetzt — als Repo-Secret hinterlegen (Claude nutzt z.ai/GLM)"
            exit 1
          fi
          echo "ZAI_API_KEY vorhanden (Claude via z.ai)."
        fi

    # ════════════════════════════════════════════════════════════════════════════
    # INVOKE-RESOLUTION (agent-spezifisch) — setzt invoke-cmd + invoke-args
    # Einzelner Step (keine doppelte Step-ID): if/else im Shell-Body
    # ════════════════════════════════════════════════════════════════════════════
    - name: Provider-Flag + Modell + Invoke auflösen
      id: resolve-model
      if: steps.preflight.outputs.configured == 'true'
      shell: bash
      env:
        AGENT: ${{ inputs.agent }}
        LLM_PROVIDER: ${{ inputs.llm-provider }}
        DEEPSEEK_MODEL: ${{ inputs.deepseek-model }}
        CLAUDE_MODEL: ${{ inputs.claude-model }}
        NEEDS_MCP: ${{ inputs.needs-mcp }}
      run: |
        if [ "$AGENT" = "claude" ]; then
          # ── Claude Code ──────────────────────────────────────────────────
          echo "invoke-cmd=claude -p" >> "$GITHUB_OUTPUT"
          echo "provider-flag=" >> "$GITHUB_OUTPUT"
          echo "model=$CLAUDE_MODEL" >> "$GITHUB_OUTPUT"
          ALLOWED_TOOLS="Bash,Read,Write,Edit,Grep,Glob"
          if [ "$NEEDS_MCP" = "true" ]; then
            ALLOWED_TOOLS="$ALLOWED_TOOLS,mcp__kolibri__search,mcp__kolibri__fetch"
          fi
          echo "invoke-args=--dangerously-skip-permissions --model $CLAUDE_MODEL --allowedTools $ALLOWED_TOOLS" >> "$GITHUB_OUTPUT"
        else
          # ── Hermes (byte-äquivalent) ──────────────────────────────────────
          if [ "$LLM_PROVIDER" = "zai" ]; then
            echo "provider-flag=--provider zai" >> "$GITHUB_OUTPUT"
            echo "model=glm-5.1" >> "$GITHUB_OUTPUT"
            PROVIDER_FLAG="--provider zai"
            MODEL="glm-5.1"
          else
            echo "provider-flag=--provider custom" >> "$GITHUB_OUTPUT"
            echo "model=$DEEPSEEK_MODEL" >> "$GITHUB_OUTPUT"
            PROVIDER_FLAG="--provider custom"
            MODEL="$DEEPSEEK_MODEL"
          fi
          echo "invoke-cmd=hermes chat -q" >> "$GITHUB_OUTPUT"
          echo "invoke-args=-Q --yolo $PROVIDER_FLAG -m $MODEL -t terminal,file --accept-hooks" >> "$GITHUB_OUTPUT"
        fi
