name: 'Setup Claude Code Agent'
description: 'Preflight, App-Token, Claude-Code-Install + Auth (Provider-Switch zai/claude), Ticket-Auflösung, Invoke-Resolution — einheitlich für alle 5 Pipeline-Workflows'

inputs:
  needs-mcp:
    description: 'Ob KoliBri MCP für diesen Workflow benötigt wird (triage + implement = true). Steuert nur die allowedTools; registriert ist der Server in .claude/settings.json.'
    required: false
    default: 'false'
  event-type:
    description: 'github.event_name (issues oder pull_request)'
    required: true
  ticket-ref:
    description: 'Issue- oder PR-Nummer (für Ticket-Auflösung)'
    required: true
  app-id:
    description: 'GitHub App ID (secret)'
    required: true
  app-private-key:
    description: 'GitHub App Private Key (secret)'
    required: true
  llm-provider:
    description: 'LLM-Provider für diesen Lauf: "claude" (Anthropic nativ, Default), "zai" (z.ai/GLM) oder "openrouter" (OpenRouter). Aus vars.LLM_PROVIDER; leer = claude.'
    required: false
    default: 'claude'
  zai-api-key:
    description: 'API-Key für z.ai (secret, secrets.ZAI_API_KEY). Nur bei llm-provider=zai erforderlich.'
    required: false
  claude-api-key:
    description: 'API-Key für Anthropic (secret, secrets.CLAUDE_API_KEY). Nur bei llm-provider=claude erforderlich.'
    required: false
  openrouter-api-key:
    description: 'API-Key für OpenRouter (secret, secrets.OPENROUTER_API_KEY). Nur bei llm-provider=openrouter erforderlich.'
    required: false
  # Variable-Namen für settings.local.json (Model-Config aus GitHub Variables, nicht hardcoded)
  zai-settings-var:
    description: 'Name der GitHub Variable mit settings.local.json für zai (Default: CLAUDE_CODE_SETTINGS_LOCAL_ZAI)'
    required: false
    default: 'CLAUDE_CODE_SETTINGS_LOCAL_ZAI'
  openrouter-settings-var:
    description: 'Name der GitHub Variable mit settings.local.json für openrouter (Default: CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER)'
    required: false
    default: 'CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER'

outputs:
  configured:
    description: 'Ob App-Secrets konfiguriert sind'
    value: ${{ steps.preflight.outputs.configured }}
  gh-token:
    description: 'GitHub Token für gh-Befehle (App-Token oder GITHUB_TOKEN)'
    value: ${{ steps.gh-token.outputs.token }}
  issue-number:
    description: 'Aufgelöste Issue-Nummer (für Issue-Events direkt, für PR-Events via closingIssuesReferences)'
    value: ${{ steps.ticket.outputs.issue-number }}
  invoke-cmd:
    description: 'Invoke-Befehl (claude -p)'
    value: ${{ steps.resolve-invoke.outputs.invoke-cmd }}
  invoke-args:
    description: 'Invoke-Argumente (Claude-Flags inkl. --allowedTools)'
    value: ${{ steps.resolve-invoke.outputs.invoke-args }}
  llm-provider:
    description: 'Der tatsächlich aufgelöste Provider ("zai" oder "claude")'
    value: ${{ steps.provider.outputs.llm-provider }}

runs:
  using: composite
  steps:
    - name: Voraussetzung prüfen (GitHub-App-Secrets)
      id: preflight
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
      shell: bash
      run: |
        if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
          echo "::warning::GitHub-App-Secrets fehlen — Lauf wird übersprungen."
          echo "configured=false" >> "$GITHUB_OUTPUT"
        else
          echo "configured=true" >> "$GITHUB_OUTPUT"
        fi

    - name: GitHub-App-token erzeugen
      id: app-token
      if: steps.preflight.outputs.configured == 'true'
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}

    - name: GH_TOKEN-Fallback setzen (App-Token oder GITHUB_TOKEN)
      id: gh-token
      shell: bash
      run: |
        APP_TOK="${{ steps.app-token.outputs.token }}"
        if [ -n "$APP_TOK" ] && [ "$APP_TOK" != "null" ]; then
          echo "token=$APP_TOK" >> "$GITHUB_OUTPUT"
          echo "::notice::Nutze GitHub-App-Token für gh-Befehle."
        else
          echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
          echo "::warning::App-Token nicht verfügbar — nutze GITHUB_TOKEN (Achtung: Label-Wechsel lösen ggf. keine Folge-Workflows aus)."
        fi

    - name: Git-Credentials für Push konfigurieren (App-Token)
      if: steps.preflight.outputs.configured == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.gh-token.outputs.token }}
      run: |
        git config --global "url.https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
        echo "::notice::Git-Credentials für App-Token konfiguriert."

    - name: Ticket-ID auflösen (Issue-Nummer)
      id: ticket
      if: steps.preflight.outputs.configured == 'true'
      env:
        GH_TOKEN: ${{ steps.gh-token.outputs.token }}
        EVENT_TYPE: ${{ inputs.event-type }}
        TICKET_REF: ${{ inputs.ticket-ref }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      shell: bash
      run: |
        if [ "$EVENT_TYPE" = "pull_request" ]; then
          ISSUE_NR=$(gh pr view "$TICKET_REF" --repo "$GITHUB_REPOSITORY" \
            --json closingIssuesReferences \
            --jq '[.closingIssuesReferences[].number] | first' 2>/dev/null || echo "")
          if [ -z "$ISSUE_NR" ] || [ "$ISSUE_NR" = "null" ]; then
            ISSUE_NR="$TICKET_REF"
            echo "::notice::Kein Closing-Issue am PR #$TICKET_REF gefunden — nutze PR-Nummer als Fallback."
          else
            echo "::notice::PR #$TICKET_REF → Issue #$ISSUE_NR."
          fi
        else
          ISSUE_NR="$TICKET_REF"
        fi
        echo "issue-number=$ISSUE_NR" >> "$GITHUB_OUTPUT"

    # ════════════════════════════════════════════════════════════════════════════
    # CLAUDE CODE — Install + Provider-Switch + Auth + (optional) KoliBri MCP
    #
    # Provider + Modell-Aliase kommen NICHT aus .claude/settings.json: die Datei ist
    # eingecheckt und wird von lokalen Entwickler-Sessions mitbenutzt — ein dort
    # gesetztes ANTHROPIC_BASE_URL würde jede lokale Session zwangs-umrouten.
    # Deshalb setzt diese Action Endpoint, Modell-Aliase und Key pro Lauf via
    # GITHUB_ENV, gesteuert über vars.LLM_PROVIDER.
    # ════════════════════════════════════════════════════════════════════════════
    - name: Claude Code installieren
      if: steps.preflight.outputs.configured == 'true'
      shell: bash
      run: |
        npm install -g @anthropic-ai/claude-code
        echo "::notice::Claude Code CLI installiert."

    - name: Claude Code Trust-Dialog für CI-Workspace akzeptieren
      if: steps.preflight.outputs.configured == 'true'
      shell: bash
      run: |
        mkdir -p "$HOME/.claude"
        CLAUDE_JSON="$HOME/.claude.json"
        WORKSPACE_PATH="${{ github.workspace }}"
        if [ -f "$CLAUDE_JSON" ]; then
          tmp=$(mktemp)
          jq --arg wp "$WORKSPACE_PATH" '.projects[$wp].hasTrustDialogAccepted = true' "$CLAUDE_JSON" > "$tmp" && mv "$tmp" "$CLAUDE_JSON"
        else
          jq -n --arg wp "$WORKSPACE_PATH" '{projects: {($wp): {hasTrustDialogAccepted: true}}}' > "$CLAUDE_JSON"
        fi
        echo "::notice::Claude Code Trust-Dialog für CI-Workspace ($WORKSPACE_PATH) akzeptiert."

    - name: Provider auflösen + Auth setzen
      id: provider
      if: steps.preflight.outputs.configured == 'true'
      shell: bash
      env:
        LLM_PROVIDER: ${{ inputs.llm-provider }}
        ZAI_API_KEY: ${{ inputs.zai-api-key }}
        CLAUDE_API_KEY: ${{ inputs.claude-api-key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        ZAI_SETTINGS_VAR: ${{ inputs.zai-settings-var }}
        OPENROUTER_SETTINGS_VAR: ${{ inputs.openrouter-settings-var }}
        # Variable-Werte werden zur Laufzeit per shell gelesen
      run: |
        PROVIDER="${LLM_PROVIDER:-claude}"

        # Secrets strippen (Whitespace/Newlines)
        CLAUDE_API_KEY="$(printf '%s' "$CLAUDE_API_KEY" | tr -d '[:space:]')"
        ZAI_API_KEY="$(printf '%s' "$ZAI_API_KEY" | tr -d '[:space:]')"
        OPENROUTER_API_KEY="$(printf '%s' "$OPENROUTER_API_KEY" | tr -d '[:space:]')"

        # Variable-Werte aus GitHub holen (für zai/openrouter settings.local.json)
        # Nutzen gh api um Variable zu lesen - falls nicht gesetzt, leerer String
        ZAI_SETTINGS_JSON=""
        OPENROUTER_SETTINGS_JSON=""
        if [ "$PROVIDER" = "zai" ] || [ "$PROVIDER" = "openrouter" ]; then
          # Variables sind in GitHub Context nicht direkt verfügbar, nutzen gh variable
          if command -v gh >/dev/null 2>&1; then
            ZAI_SETTINGS_JSON="$(gh variable get "$ZAI_SETTINGS_VAR" 2>/dev/null || true)"
            OPENROUTER_SETTINGS_JSON="$(gh variable get "$OPENROUTER_SETTINGS_VAR" 2>/dev/null || true)"
          fi
        fi

        case "$PROVIDER" in
          claude)
            if [ -z "$CLAUDE_API_KEY" ]; then
              echo "::error title=Auth fehlt::vars.LLM_PROVIDER=claude, aber Secret CLAUDE_API_KEY ist leer."
              exit 1
            fi
            # Anthropic kennt ZWEI Token-Typen:
            #   sk-ant-api…  klassischer API-Key   → ANTHROPIC_API_KEY
            #   sk-ant-oat…  OAuth-Token aus `claude setup-token` → CLAUDE_CODE_OAUTH_TOKEN
            case "$CLAUDE_API_KEY" in
              sk-ant-oat*)
                echo "CLAUDE_CODE_OAUTH_TOKEN=$CLAUDE_API_KEY" >> "$GITHUB_ENV"
                echo "::notice::Provider=claude — OAuth-Token erkannt (sk-ant-oat…) → CLAUDE_CODE_OAUTH_TOKEN."
                ;;
              sk-ant-*)
                echo "ANTHROPIC_API_KEY=$CLAUDE_API_KEY" >> "$GITHUB_ENV"
                echo "::notice::Provider=claude — API-Key erkannt (sk-ant-…) → ANTHROPIC_API_KEY."
                ;;
              *)
                echo "ANTHROPIC_API_KEY=$CLAUDE_API_KEY" >> "$GITHUB_ENV"
                echo "::warning title=Unerwartetes Token-Format::CLAUDE_API_KEY beginnt nicht mit 'sk-ant-'. Versuche als ANTHROPIC_API_KEY."
                ;;
            esac
            ;;
          zai)
            if [ -z "$ZAI_API_KEY" ]; then
              echo "::error title=Auth fehlt::vars.LLM_PROVIDER=zai, aber Secret ZAI_API_KEY ist leer."
              exit 1
            fi
            # settings.local.json aus Variable bauen
            if [ -n "$ZAI_SETTINGS_JSON" ]; then
              echo "$ZAI_SETTINGS_JSON" > .claude/settings.local.json
              echo "::notice::settings.local.json aus Variable $ZAI_SETTINGS_VAR geschrieben."
            else
              echo "::warning::Variable $ZAI_SETTINGS_VAR nicht gesetzt — keine settings.local.json für zai."
            fi
            # Auth Token setzen (z.ai nutzt ANTHROPIC_AUTH_TOKEN als Bearer)
            echo "ANTHROPIC_AUTH_TOKEN=$ZAI_API_KEY" >> "$GITHUB_ENV"
            ;;
          openrouter)
            if [ -z "$OPENROUTER_API_KEY" ]; then
              echo "::error title=Auth fehlt::vars.LLM_PROVIDER=openrouter, aber Secret OPENROUTER_API_KEY ist leer."
              exit 1
            fi
            # settings.local.json aus Variable bauen
            if [ -n "$OPENROUTER_SETTINGS_JSON" ]; then
              echo "$OPENROUTER_SETTINGS_JSON" > .claude/settings.local.json
              echo "::notice::settings.local.json aus Variable $OPENROUTER_SETTINGS_VAR geschrieben."
            else
              echo "::warning::Variable $OPENROUTER_SETTINGS_VAR nicht gesetzt — keine settings.local.json für openrouter."
            fi
            # Auth Token setzen (OpenRouter nutzt ANTHROPIC_AUTH_TOKEN als Bearer)
            echo "ANTHROPIC_AUTH_TOKEN=$OPENROUTER_API_KEY" >> "$GITHUB_ENV"
            ;;
          *)
            echo "::error title=Unbekannter Provider::vars.LLM_PROVIDER='$PROVIDER' — erlaubt sind 'claude', 'zai' oder 'openrouter'."
            exit 1
            ;;
        esac

        echo "llm-provider=$PROVIDER" >> "$GITHUB_OUTPUT"

    # ════════════════════════════════════════════════════════════════════════════
    # INVOKE-RESOLUTION — setzt invoke-cmd + invoke-args
    # Kein --model: das Modell wird über "model" in .claude/settings.json gewählt
    # und pro Provider über die Alias-Variablen oben aufgelöst.
    # ════════════════════════════════════════════════════════════════════════════
    - name: Invoke auflösen
      id: resolve-invoke
      if: steps.preflight.outputs.configured == 'true'
      shell: bash
      env:
        NEEDS_MCP: ${{ inputs.needs-mcp }}
      run: |
        echo "invoke-cmd=claude -p" >> "$GITHUB_OUTPUT"
        ALLOWED_TOOLS="Bash,Read,Write,Edit,Grep,Glob"
        if [ "$NEEDS_MCP" = "true" ]; then
          ALLOWED_TOOLS="$ALLOWED_TOOLS,mcp__kolibri__search,mcp__kolibri__fetch"
        fi
        echo "invoke-args=--dangerously-skip-permissions --allowedTools $ALLOWED_TOOLS" >> "$GITHUB_OUTPUT"
