name: 'Setup Claude Code Agent'
description: 'Preflight, App-Token, Claude-Code-Install + Auth (Provider-Switch zai/claude), Ticket-Auflösung, Invoke-Resolution, Memory-Load (Issue-Storage via State-Branch) – einheitlich für alle Pipeline-Workflows'

inputs:
  needs-mcp:
    description: 'Ob KoliBri MCP für diesen Workflow benötigt wird. Steuert nur die allowedTools; registriert ist der Server in .claude/settings.json. Gilt für alle Phasen außer Documenter (07).'
    required: false
    default: 'false'
  browser-mcp:
    description: 'Ob Playwright-MCP (Browser-Tools) für diesen Workflow benötigt wird. Bei true werden mcp__playwright__* Tools zur Allowlist aller Tiers hinzugefügt. Nur für Phasen mit UI-Inspektion (02 UX, 04 Umsetzung, 06 Fixup).'
    required: false
    default: 'false'
  tools-tier:
    description: 'Permission-Tier für diesen Lauf. "restricted" = nur lesender GitHub-Zugriff via gh/git, kein Bypass (Triage). "review" = Vollzugriff minus Write/Edit. "full" = vollautonom mit Bypass (Default; Spec/Implement/Fixup). Steuert --allowedTools / --dangerously-skip-permissions / --disallowedTools. Der globale deny-Layer in .claude/settings.json greift in JEDEM Tier (auch unter bypass).'
    required: false
    default: 'full'
  event-type:
    description: 'github.event_name (issues oder pull_request)'
    required: true
  ticket-ref:
    description: 'Issue- oder PR-Nummer (für Ticket-Auflösung)'
    required: true
  app-id:
    description: 'GitHub App ID (secret)'
    required: true
  app-private-key:
    description: 'GitHub App Private Key (secret)'
    required: true
  llm-provider:
    description: 'LLM-Provider für diesen Lauf: "claude" (Anthropic nativ, Default), "zai" (z.ai/GLM) oder "openrouter" (OpenRouter). Aus vars.LLM_PROVIDER; leer = claude.'
    required: false
    default: 'claude'
  zai-api-key:
    description: 'API-Key für z.ai (secret, secrets.ZAI_API_KEY). Nur bei llm-provider=zai erforderlich.'
    required: false
  claude-api-key:
    description: 'API-Key für Anthropic (secret, secrets.CLAUDE_API_KEY). Nur bei llm-provider=claude erforderlich.'
    required: false
  openrouter-api-key:
    description: 'API-Key für OpenRouter (secret, secrets.OPENROUTER_API_KEY). Nur bei llm-provider=openrouter erforderlich.'
    required: false
  # Settings-JSON direkt als Input (aus GitHub Variables) – vermeidet gh CLI Auth-Probleme
  zai-settings-json:
    description: 'settings.local.json für zai als JSON-String (aus vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI)'
    required: false
    default: ''
  openrouter-settings-json:
    description: 'settings.local.json für openrouter als JSON-String (aus vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER)'
    required: false
    default: ''
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # KONTEXT-Compaction: --autocompact an Claude Code CLI übergeben.
  #
  # Claude Code im -p-Modus läuft als agentische Schleife: Jedes Tool-Ergebnis wächst
  # den Kontext. --autocompact <auto|tokens> fasst den ältesten Teil automatisch
  # zusammen, wenn die Schwelle überschreitet — das Gegenstück zur Pi-/compact-Compaction,
  # hier als zentraler Guard gegen Kontext-Explosion innerhalb eines einzelnen Laufs.
  #
  # Leer = disabled (bisheriges Verhalten, kein Breaking-Change für Helper-Workflows).
  # "auto" = Claude entscheidet selbst über die Schwelle.
  # "80k".."1M" = expliziter Token-Schwellwert (nur Zahlen + k/M-Suffix).
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  compact-tokens:
    description: 'Auto-compact threshold für Claude Code (z.B. "80k", "100k", "auto"). Leer = disabled.'
    required: false
    default: ''
  # Memory-Funktionen für pro-Issue Persistenz (dateibasiert via STATE-BRANCH, ADR 0006).
  #
  # WARUM STATE-BRANCH STATT CACHE/ARTEFAKT: Der Actions-Cache ist für diese Pipeline
  # schreib-tot — GitHubs Richtlinie vom 2026-06-26 ("Read-only Actions cache for untrusted
  # triggers") vergibt für Issue-/Label-/PR-getriggerte Läufe UND für die daraus kaskadierten
  # workflow_run-Läufe nur lese-only Cache-Token (belegt in den Persist-Runs 31891908903 …,
  # 31904169169; der frühere Begleitworkflow scheiterte in JEDEM Lauf still mit "cache write
  # denied"). Der Scope hängt am Trust-Level des Triggers, NICHT an den Permissions.
  # Artefakte als Zwischenlösung sind seit 2026-08-23 durch den State-Branch ersetzt: unbefristet
  # (keine Retention-Abwägung), versioniert (git log = Phasen-Protokoll) und ohne API-Suche nach
  # dem jüngsten Exemplar. ci.yml/deploy.yml triggern nur auf push:[main] — der Branch feuert
  # nichts und wird nie gemergt.
  #
  # Memory-Save passiert NICHT hier (die Action läuft nur pre-claude), sondern als
  # issue-state-save-Step (.github/actions/issue-state-save) im Workflow nach dem claude-Step.
  # Claude liest/schreibt seinen Memory NATIV nach .claude/memory (autoMemoryDirectory in
  # .claude/settings.json) — Isolierung pro Issue erfolgt NICHT über einen Subdir, sondern
  # rein über den Branch-Namen ai/state/issue-{N}: jeder Lauf restored/saved den zum Issue
  # passenden Stand in denselben flachen Pfad.
  memory-load:
    description: 'Memory-Load zu Beginn des Workflows (true = restauriert dateibasierte Memory für ticket-ref aus dem State-Branch ai/state/issue-{N}). Alle 6 Phasen-Workflows laden (auch Triage: Erst-Triage startet leer, Re-Triage nutzt den bisherigen Stand); false nur für bewusst stateless Helper-Workflows.'
    required: false
    default: 'false'
  expect-memory:
    description: 'Erwartet die Phase vorherige Phasen-Notizen (Restore)? true ab Phase 2. Bei leerem Restore → Warning (Resume-Kontext fehlt); false (Phase 1) → leeres Memory ist normal, keine Warning.'
    required: false
    default: 'false'
  model:
    description: 'Claude-Modell für diesen Lauf als Alias (fable|opus|sonnet|haiku); leer = kein --model (Default aus .claude/settings.json). Der Alias wird providerspezifisch aufgelöst (claude nativ via --model, zai/openrouter via settings.local.json); ein ungültiger Alias bricht laut ab (kein stiller Fallback).'
    required: false
    default: ''
  subagent-model:
    description: >-
      Modell für Subagents als Alias, oder 'inherit' (Default). Wird als
      CLAUDE_CODE_SUBAGENT_MODEL gesetzt.

      BEWUSST GESETZT, NICHT UNGESETZT GELASSEN: Die Variable überschreibt das Modell für
      ALLE Subagents und hat Vorrang vor deren model-Frontmatter. Bliebe sie unbestimmt,
      liefe ein Subagent-Fan-out einer fable-Phase potenziell ebenfalls auf fable — und
      genau das kehrte die Kostenlogik um, die die Phasen-Modellwahl herstellt.
      'inherit' = ausdrücklich das Phasenmodell (bisheriges Verhalten, kein Override).
    required: false
    default: 'inherit'
  # Tailscale-Exit-Node: optional. Verbindet den Runner VOR dem claude-Step mit dem Exit Node,
  # sodass der gesamte LLM-Traffic über eine konsistente IP egressiert (verhindert z.ai/
  # OpenRouter "Account geteilt"-Flagging durch wechselnde Azure-Runner-IPs). Kill-Switch:
  # leerer tailscale-exit-node (vars.TAILSCALE_EXIT_NODE nicht gesetzt) deaktiviert das Routing
  # komplett → exakt heutiges Verhalten. Fail-closed: bei gesetztem Exit-Node + fehlendem/schlech-
  # tem Key scheitert der Connect laut → claude-Step wird übersprungen (kein direkter Azure-Egress).
  tailscale-authkey:
    description: 'Tailscale Auth-Key (secret, secrets.TAILSCALE_AUTH_KEY; reusable + ephemeral + tag:ci). Zusammen mit tailscale-exit-node aktiv; sonst ignoriert.'
    required: false
    default: ''
  tailscale-exit-node:
    description: 'Tailscale-Exit-Node (Name oder 100.x.y.z, aus vars.TAILSCALE_EXIT_NODE). LEER = Routing deaktiviert (Kill-Switch). Vorhanden = aktiv, Connect fail-closed.'
    required: false
    default: ''

outputs:
  configured:
    description: 'Ob App-Secrets konfiguriert sind'
    value: ${{ steps.preflight.outputs.configured }}
  gh-token:
    description: 'GitHub Token für gh-Befehle (App-Token oder GITHUB_TOKEN)'
    value: ${{ steps.gh-token.outputs.token }}
  issue-number:
    description: 'Aufgelöste Issue-Nummer (für Issue-Events direkt, für PR-Events via closingIssuesReferences)'
    value: ${{ steps.ticket.outputs.issue-number }}
  compact-tokens:
    description: 'Der tatsächlich aufgelöste Auto-Compact-Threshold (leer = disabled)'
    value: ${{ inputs.compact-tokens }}
  invoke-cmd:
    description: 'Invoke-Befehl (claude -p)'
    value: ${{ steps.resolve-invoke.outputs.invoke-cmd }}
  invoke-args:
    description: 'Invoke-Argumente (Claude-Flags inkl. --allowedTools)'
    value: ${{ steps.resolve-invoke.outputs.invoke-args }}
  llm-provider:
    description: 'Der tatsächlich aufgelöste Provider ("zai" oder "claude")'
    value: ${{ steps.provider.outputs.llm-provider }}
  memory-loaded:
    description: 'Ob pro-Issue Memory aus einer Vor-Phase geladen wurde (State-Branch gefunden UND restauriert)'
    value: ${{ steps.memory-load.outputs.found }}
  memory-restored:
    description: 'Ob tatsächlich Memory-Dateien restauriert wurden (State-Branch geladen UND Dateianzahl > 0).'
    value: ${{ steps.memory-verify.outputs.restored }}
  memory-file-count:
    description: 'Anzahl restaurierter Memory-Dateien in .claude/memory/.'
    value: ${{ steps.memory-verify.outputs.file-count }}
  memory-status-text:
    description: 'Sed-sicherer Restore-Status für den Prompt-Platzhalter #MEMORY_STATUS ("vorhanden" | "leer").'
    value: ${{ steps.memory-verify.outputs.status-text }}

runs:
  using: composite
  steps:
    - name: Voraussetzung prüfen (GitHub-App-Secrets)
      id: preflight
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_PRIVATE_KEY: ${{ inputs.app-private-key }}
      shell: bash
      run: |
        if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
          echo "::warning::GitHub-App-Secrets fehlen – Lauf wird übersprungen."
          echo "configured=false" >> "$GITHUB_OUTPUT"
        else
          echo "configured=true" >> "$GITHUB_OUTPUT"
        fi

    - name: GitHub-App-token erzeugen
      id: app-token
      if: steps.preflight.outputs.configured == 'true'
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}

    - name: App-Token durchreichen (App-only — kein GITHUB_TOKEN-Fallback)
      id: gh-token
      shell: bash
      run: |
        APP_TOK="${{ steps.app-token.outputs.token }}"
        if [ -n "$APP_TOK" ] && [ "$APP_TOK" != "null" ]; then
          echo "token=$APP_TOK" >> "$GITHUB_OUTPUT"
          echo "::notice::Nutze GitHub-App-Token für gh-Befehle."
        else
          # App-only-Pipeline: ohne App-Token kann weder gepusht (Contents:Write) noch ein
          # Folge-Workflow getriggert werden (GITHUB_TOKEN-Events lösen keine Runs aus). Ein
          # stiller GITHUB_TOKEN-Fallback endet grün, pusht nicht und loopt — deshalb LAUT
          # abbrechen statt degradieren.
          echo "::error::App-Token nicht verfügbar – Pipeline ist App-only. Abbruch statt GITHUB_TOKEN-Fallback (Push braucht Contents:Write, Label-Wechsel müssen Folge-Workflows triggern). Secrets APP_ID/APP_PRIVATE_KEY oder die App-Installation prüfen."
          exit 1
        fi

    - name: Git-Remote origin auf App-Token umstellen (wie deploy.yml)
      if: steps.preflight.outputs.configured == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.gh-token.outputs.token }}
      run: |
        # App-Token DIREKT in die origin-URL einbetten — exakt wie deploy.yml. Der frühere
        # insteadOf-Rewrite wurde vom per `persist-credentials` (Default true) von checkout
        # hinterlegten GITHUB_TOKEN überstimmt, sodass der Agent als github-actions[bot]
        # (contents:read) statt als App (Contents:Write) pushte → 403. Mit persist-credentials:false
        # an allen Claude-Checkouts gibt es keine konkurrierende Credential mehr; origin trägt
        # als einzige das App-Token.
        git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        echo "::notice::origin-Remote auf App-Token umgestellt (Contents:Write für Push)."

    - name: Ticket-ID auflösen (Issue-Nummer)
      id: ticket
      if: steps.preflight.outputs.configured == 'true'
      env:
        GH_TOKEN: ${{ steps.gh-token.outputs.token }}
        EVENT_TYPE: ${{ inputs.event-type }}
        TICKET_REF: ${{ inputs.ticket-ref }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      shell: bash
      run: |
        if [ "$EVENT_TYPE" = "pull_request" ]; then
          ISSUE_NR=$(gh pr view "$TICKET_REF" --repo "$GITHUB_REPOSITORY" \
            --json closingIssuesReferences \
            --jq '[.closingIssuesReferences[].number] | first' 2>/dev/null || echo "")
          if [ -z "$ISSUE_NR" ] || [ "$ISSUE_NR" = "null" ]; then
            ISSUE_NR="$TICKET_REF"
            echo "::notice::Kein Closing-Issue am PR #$TICKET_REF gefunden – nutze PR-Nummer als Fallback."
          else
            echo "::notice::PR #$TICKET_REF → Issue #$ISSUE_NR."
          fi
        else
          ISSUE_NR="$TICKET_REF"
        fi
        echo "issue-number=$ISSUE_NR" >> "$GITHUB_OUTPUT"

    - name: Memory-Load (pro Issue, State-Branch ai/state/issue-{N})
      # ADR 0006: Der Issue-Storage ist ein State-Branch — nie gemergt, triggert kein CI/Deploy
      # (beide hören nur auf push:[main]). Hier: fetchen und die Storage-Pfade in den Workspace
      # restoren. git restore OHNE --staged lässt den Index unberührt — die Storage-Dateien
      # können so nie in ein Phasen-Commit des Agenten rutschen (zustätzlich hält .gitignore
      # .claude/state.json zurück). MEMORY.md wird via :(exclude) ausgespart: es ist einge-
      # checkt und reist in den Phasen-Commits — ein alter Stand aus dem Storage dürfte es nie
      # überschreiben. Fehlt der Branch (Erst-Triage/Erst-Phase) → found=false, Phase startet
      # mit leerem Memory (fail-open, wie früher beim Artefakt-Miss).
      id: memory-load
      if: steps.preflight.outputs.configured == 'true' && inputs.memory-load == 'true'
      shell: bash
      env:
        ISSUE_NR: ${{ steps.ticket.outputs.issue-number }}
      run: |
        set -uo pipefail
        mkdir -p .claude/memory
        found="false"
        STATE="ai/state/issue-${ISSUE_NR}"
        if git fetch --quiet origin "$STATE" 2>/dev/null \
           && git rev-parse --verify -q FETCH_HEAD >/dev/null 2>&1 \
           && git restore --source=FETCH_HEAD --worktree -- .claude ':(exclude).claude/memory/MEMORY.md'; then
          found="true"
          echo "::notice title=🧠 Memory geladen::$STATE → .claude/ (worktree, Index unberührt)."
        else
          echo "::notice title=🧠 Memory leer (kein State-Branch)::$STATE existiert (noch) nicht — erste Phase dieses Tickets oder Storage zwischenzeitlich abgeräumt."
        fi
        echo "found=$found" >> "$GITHUB_OUTPUT"

    - name: Memory-Verzeichnis sicherstellen (Claude-Schreibzugriff auch bei Miss / memory-load=false)
      # Entkoppelt von memory-load: auch bei Restore-Miss (Erst-Triage) oder memory-load=false
      # (stateless Helper) MUSS geschrieben werden dürfen → Verzeichnis immer anlegen.
      if: steps.preflight.outputs.configured == 'true'
      shell: bash
      run: mkdir -p ".claude/memory"

    - name: Memory-Restore verifizieren (ab Phase 2)
      # Prüft, OB wirklich Memory restauriert wurde (Artefakt geladen + Dateianzahl > 0). Phase 1
      # (memory-load=false) überspringt diesen Schritt — leeres Memory ist dort der Normalfall.
      # Ab Phase 2 (expect-memory=true) warnt ein leerer Restore: entweder hat die Vor-Phase
      # nichts geschrieben, ODER der Artefakt-Upload/-Download schlug fehl.
      id: memory-verify
      if: steps.preflight.outputs.configured == 'true' && inputs.memory-load == 'true'
      shell: bash
      env:
        EXPECT_MEMORY: ${{ inputs.expect-memory }}
        ISSUE_NR: ${{ steps.ticket.outputs.issue-number }}
        ARTIFACT_FOUND: ${{ steps.memory-load.outputs.found }}
      run: |
        # Nur die Phasen-Notizen zählen. Das eingecheckte Dauergedächtnis .claude/memory/MEMORY.md
        # liegt IMMER im Checkout — ungefiltert wäre der Zähler dauerhaft >= 1 und die
        # expect-memory-Warnung („Restore leer") könnte nie mehr feuern.
        count=$(find .claude/memory -type f -name 'issue-*.md' 2>/dev/null | wc -l | tr -d ' ')
        restored="false"
        if [ "${ARTIFACT_FOUND}" = "true" ] && [ "${count:-0}" -gt 0 ]; then restored="true"; fi
        echo "file-count=${count:-0}" >> "$GITHUB_OUTPUT"
        echo "restored=$restored" >> "$GITHUB_OUTPUT"
        if [ "$restored" = "true" ]; then
          echo "status-text=vorhanden" >> "$GITHUB_OUTPUT"
          echo "::notice title=🧠 Memory-Restore OK::Issue #${ISSUE_NR} — ${count} Memory-Datei(en) geladen."
        else
          echo "status-text=leer" >> "$GITHUB_OUTPUT"
          if [ "${EXPECT_MEMORY}" = "true" ]; then
            echo "::warning title=⚠️ Memory-Restore leer::Issue #${ISSUE_NR} — keine Phasen-Notizen geladen (vorherige Phase schrieb nichts ODER Persistierung fehlgeschlagen). Resume-Kontext fehlt."
          else
            echo "::notice title=🧠 Memory leer (erwartet)::Issue #${ISSUE_NR} — erste Phase, kein Vor-Kontext."
          fi
        fi

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # ZAI TIME-WINDOW CHECK – ZAI in z.ai-Peak-Zeiten (3× Quota) auf Claude fallen
    #
    # Issue #893: z.ai berechnet den 3×-Peak-Tarif nur Mo–Fr 14:00–18:00 Asia/Singapore
    # (= 08:00–12:00 MESZ bzw. 07:00–11:00 MEZ); am Wochenende gilt ganztägig Off-Peak.
    # Abo-Realität: Nur glm-4.7/glm-5-turbo/glm-5.3 gebucht; der 2×/3×-Tarif trifft im Abo
    # einzig glm-5-turbo (CLAUDE_CODE_SUBAGENT_MODEL) — der Fallback bleibt bewusst pauschal.
    # Die Prüfung läuft in Singapore-Zeit (UTC+8, kein DST) — dadurch verschiebt sich das
    # Berliner Fenster mit der Sommerzeit automatisch korrekt (die frühere harte
    # Berlin-Stunde 08–11 lag im Winter daneben).
    # Nur ZAI wird überschrieben; claude/openrouter bleiben unangetastet.
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: ZAI Zeitfenster-Check (Mo–Fr 14:00–18:00 Asia/Singapore → Claude Fallback)
      id: time-window-check
      if: steps.preflight.outputs.configured == 'true'
      shell: bash
      env:
        LLM_PROVIDER: ${{ inputs.llm-provider }}
      run: |
        PROVIDER="${LLM_PROVIDER:-claude}"

        # Nur bei ZAI prüfen, ob wir im Peak-Fenster sind
        if [ "$PROVIDER" != "zai" ]; then
          echo "original-llm-provider=$PROVIDER" >> "$GITHUB_OUTPUT"
          echo "time-window-override=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Zeitfenster-Check übersprungen (Provider=$PROVIDER, nur zai wird geprüft)."
          exit 0
        fi

        # Peak-Fenster in Singapore-Zeit (UTC+8, kein DST): Mo–Fr 14:00–17:59
        SGT_HOUR=$(TZ='Asia/Singapore' date +%H)
        SGT_DOW=$(TZ='Asia/Singapore' date +%u) # 1=Mo … 7=So
        echo "Singapore-Zeit: Wochentag ${SGT_DOW}, ${SGT_HOUR}:xx (Asia/Singapore)."

        if [ "$SGT_DOW" -le 5 ] && [ "$SGT_HOUR" -ge 14 ] && [ "$SGT_HOUR" -le 17 ]; then
          echo "original-llm-provider=zai" >> "$GITHUB_OUTPUT"
          echo "time-window-override=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=🕐 ZAI Peak-Zeit aktiv::Mo–Fr 14:00–18:00 Asia/Singapore (3× Quota) — ZAI wird auf Claude gefallback (SGT Wochentag ${SGT_DOW}, ${SGT_HOUR}:xx)."
        else
          echo "original-llm-provider=$PROVIDER" >> "$GITHUB_OUTPUT"
          echo "time-window-override=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Zeitfenster inaktiv (SGT Wochentag ${SGT_DOW}, ${SGT_HOUR}:xx — Wochenende oder außerhalb Mo–Fr 14:00–18:00 SGT) — ZAI wird verwendet."
        fi

    # Claude Code CLI cachen — ohne Cache kostet npm install -g auf jedem kalten
    # Runner 30–60s. Der Cache-Key ist statisch pro OS; bei Eviction (>7 Tage
    # ungenutzt oder 10 GB Repo-Limit) reinstalliert ein Lauf frisch und
    # schreibt den Cache neu. Cache-Bust bei Bedarf über Suffix (v2, v3, …).
    - name: Claude Code CLI sichern
      id: cache-claude
      if: steps.preflight.outputs.configured == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          /usr/local/lib/node_modules/@anthropic-ai
          /usr/local/bin/claude
        key: claude-code-cli-${{ runner.os }}-v4

    # VERIFIZIEREN STATT VERTRAUEN: Die Bedingung lautete lange „installiere nur, wenn der
    # Cache NICHT griff". Ein Cache-Treffer beweist aber nur, dass Dateien da sind — nicht,
    # dass die CLI startet. Die plattform-native Binary kommt über ein Postinstall
    # (`install.cjs`) bzw. eine optionale Abhängigkeit; fehlt sie im gecachten Stand, endet
    # jeder Lauf mit „claude native binary not installed", und zwar dauerhaft: Der statische
    # Key invalidiert nie, und der Install-Step wurde bei Treffer übersprungen. Ein
    # Key-Bust heilt das genau einmal — die Prüfung unten dauerhaft.
    #
    # Zweiter Gewinn: Der Abbruch passiert HIER statt im Phasen-Step. Vorher lief die Phase
    # erst 5–10 Minuten (Setup, pnpm, Chromium, Server-Build) und starb dann im
    # claude-Aufruf, wo die Ursache im Log untergeht und wie ein Provider-/Modellfehler
    # aussieht.
    - name: Claude Code bereitstellen und prüfen
      if: steps.preflight.outputs.configured == 'true'
      shell: bash
      run: |
        set -uo pipefail

        cli_ok() { claude --version >/dev/null 2>&1; }

        if cli_ok; then
          echo "::notice title=Claude CLI::Lauffähig ($(claude --version 2>/dev/null))."
          exit 0
        fi

        if [ "${{ steps.cache-claude.outputs.cache-hit }}" = "true" ]; then
          echo "::warning title=Claude CLI unvollständig::Cache-Treffer, aber die CLI startet nicht — wird neu installiert. Passiert das in JEDEM Lauf, liegt die native Binary außerhalb der gecachten Pfade: dann die path-Liste oben erweitern."
        fi

        npm install -g @anthropic-ai/claude-code

        # Postinstall notfalls von Hand: Manche npm-/pnpm-Konfigurationen überspringen
        # Scripts (--ignore-scripts) oder optionale Abhängigkeiten (--omit=optional) —
        # genau dann fehlt die native Binary. Der Fehlertext der CLI nennt diesen Weg
        # selbst als Abhilfe. `npm root -g` statt hartem Pfad (aus PR #923), mit
        # Rückfall auf den Standardpfad, falls npm den Root nicht liefert.
        if ! cli_ok; then
          NPM_ROOT="$(npm root -g 2>/dev/null || echo /usr/local/lib/node_modules)"
          PKG="${NPM_ROOT}/@anthropic-ai/claude-code"
          if [ -f "$PKG/install.cjs" ]; then
            echo "::notice title=Claude CLI::Postinstall wird manuell nachgeholt ($PKG/install.cjs)."
            node "$PKG/install.cjs" || true
          else
            echo "::warning title=Claude CLI::install.cjs nicht gefunden unter $PKG — Paketlayout abweichend?"
          fi
        fi

        if ! cli_ok; then
          echo "::error title=Claude CLI nicht lauffähig::'claude --version' startet auch nach Neuinstallation nicht. Der Lauf wird hier beendet, statt später im LLM-Aufruf zu scheitern."
          exit 1
        fi
        echo "::notice title=Claude CLI::Neu installiert und lauffähig ($(claude --version 2>/dev/null))."

    - name: Claude Code Trust-Dialog für CI-Workspace akzeptieren
      if: steps.preflight.outputs.configured == 'true'
      shell: bash
      run: |
        mkdir -p "$HOME/.claude"
        CLAUDE_JSON="$HOME/.claude.json"
        WORKSPACE_PATH="${{ github.workspace }}"
        if [ -f "$CLAUDE_JSON" ]; then
          tmp=$(mktemp)
          jq --arg wp "$WORKSPACE_PATH" '.projects[$wp].hasTrustDialogAccepted = true' "$CLAUDE_JSON" > "$tmp" && mv "$tmp" "$CLAUDE_JSON"
        else
          jq -n --arg wp "$WORKSPACE_PATH" '{projects: {($wp): {hasTrustDialogAccepted: true}}}' > "$CLAUDE_JSON"
        fi
        echo "::notice::Claude Code Trust-Dialog für CI-Workspace ($WORKSPACE_PATH) akzeptiert."

    - name: Provider auflösen + Auth setzen
      id: provider
      if: steps.preflight.outputs.configured == 'true'
      shell: bash
      env:
        LLM_PROVIDER: ${{ inputs.llm-provider }}
        TIME_WINDOW_OVERRIDE: ${{ steps.time-window-check.outputs.time-window-override }}
        ORIGINAL_PROVIDER: ${{ steps.time-window-check.outputs.original-llm-provider }}
        ZAI_API_KEY: ${{ inputs.zai-api-key }}
        CLAUDE_API_KEY: ${{ inputs.claude-api-key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        ZAI_SETTINGS_JSON: ${{ inputs.zai-settings-json }}
        OPENROUTER_SETTINGS_JSON: ${{ inputs.openrouter-settings-json }}
        CLAUDE_MODEL: ${{ inputs.model }}
        SUBAGENT_MODEL: ${{ inputs.subagent-model }}
      run: |
        PROVIDER="${LLM_PROVIDER:-claude}"

        # Zeitfenster-Override: Wenn aktiv, ZAI durch Claude ersetzen
        if [ "$TIME_WINDOW_OVERRIDE" = "true" ]; then
          echo "::notice title=🔄 Provider-Override::Original=$ORIGINAL_PROVIDER → Fallback=claude (z.ai-Peak-Zeit Mo–Fr 14:00–18:00 Asia/Singapore aktiv)."
          PROVIDER="claude"
        fi

        # Secrets strippen (Whitespace/Newlines)
        CLAUDE_API_KEY="$(printf '%s' "$CLAUDE_API_KEY" | tr -d '[:space:]')"
        ZAI_API_KEY="$(printf '%s' "$ZAI_API_KEY" | tr -d '[:space:]')"
        OPENROUTER_API_KEY="$(printf '%s' "$OPENROUTER_API_KEY" | tr -d '[:space:]')"

        # Zeitfenster-Logik (Issue #893) lebt ausschließlich im Step "ZAI Zeitfenster-Check"
        # (Single Source); dieser Step konsumiert deren Output über TIME_WINDOW_OVERRIDE oben.

        case "$PROVIDER" in
          claude)
            if [ -z "$CLAUDE_API_KEY" ]; then
              echo "::error title=Auth fehlt::vars.LLM_PROVIDER=claude, aber Secret CLAUDE_API_KEY ist leer."
              exit 1
            fi
            # Anthropic kennt ZWEI Token-Typen:
            #   sk-ant-api…  klassischer API-Key   → ANTHROPIC_API_KEY
            #   sk-ant-oat…  OAuth-Token aus `claude setup-token` → CLAUDE_CODE_OAUTH_TOKEN
            case "$CLAUDE_API_KEY" in
              sk-ant-oat*)
                echo "CLAUDE_CODE_OAUTH_TOKEN=$CLAUDE_API_KEY" >> "$GITHUB_ENV"
                echo "::notice::Provider=claude – OAuth-Token erkannt (sk-ant-oat…) → CLAUDE_CODE_OAUTH_TOKEN."
                ;;
              sk-ant-*)
                echo "ANTHROPIC_API_KEY=$CLAUDE_API_KEY" >> "$GITHUB_ENV"
                echo "::notice::Provider=claude – API-Key erkannt (sk-ant-…) → ANTHROPIC_API_KEY."
                ;;
              *)
                echo "ANTHROPIC_API_KEY=$CLAUDE_API_KEY" >> "$GITHUB_ENV"
                echo "::warning title=Unerwartetes Token-Format::CLAUDE_API_KEY beginnt nicht mit 'sk-ant-'. Versuche als ANTHROPIC_API_KEY."
                ;;
            esac
            ;;
          zai)
            if [ -z "$ZAI_API_KEY" ]; then
              echo "::error title=Auth fehlt::vars.LLM_PROVIDER=zai, aber Secret ZAI_API_KEY ist leer."
              exit 1
            fi
            # settings.local.json aus Input bauen
            if [ -n "$ZAI_SETTINGS_JSON" ]; then
              echo "$ZAI_SETTINGS_JSON" > .claude/settings.local.json
              echo "::notice::settings.local.json aus Input zai-settings-json geschrieben."
            else
              echo "::warning::Input zai-settings-json leer – keine settings.local.json für zai."
            fi
            # Auth Token setzen (z.ai nutzt ANTHROPIC_AUTH_TOKEN als Bearer)
            echo "ANTHROPIC_AUTH_TOKEN=$ZAI_API_KEY" >> "$GITHUB_ENV"
            ;;
          openrouter)
            if [ -z "$OPENROUTER_API_KEY" ]; then
              echo "::error title=Auth fehlt::vars.LLM_PROVIDER=openrouter, aber Secret OPENROUTER_API_KEY ist leer."
              exit 1
            fi
            # settings.local.json aus Input bauen
            if [ -n "$OPENROUTER_SETTINGS_JSON" ]; then
              echo "$OPENROUTER_SETTINGS_JSON" > .claude/settings.local.json
              echo "::notice::settings.local.json aus Input openrouter-settings-json geschrieben."
            else
              echo "::warning::Input openrouter-settings-json leer – keine settings.local.json für openrouter."
            fi
            # Auth Token setzen (OpenRouter nutzt ANTHROPIC_AUTH_TOKEN als Bearer)
            echo "ANTHROPIC_AUTH_TOKEN=$OPENROUTER_API_KEY" >> "$GITHUB_ENV"
            # Unbekannte Modelle erlauben (CI-Cache kann ältere CLI-Version haben als lokal)
            echo "CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_WINDOW_ENFORCEMENT=1" >> "$GITHUB_ENV"
            echo "::notice::OpenRouter: CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_WINDOW_ENFORCEMENT=1 gesetzt (unbekannte Modelle erlaubt)."
            ;;
          *)
            echo "::error title=Unbekannter Provider::vars.LLM_PROVIDER='$PROVIDER' – erlaubt sind 'claude', 'zai' oder 'openrouter'."
            exit 1
            ;;
        esac

        echo "llm-provider=$PROVIDER" >> "$GITHUB_OUTPUT"

        # Phasen-Modell (#511): Alias fable|opus|sonnet|haiku providerspezifisch aufloesen.
        # claude (nativ) erhaelt die konkrete Modell-ID via --model (resolve-invoke); zai/
        # openrouter loesen den Alias im settings.local.json-Kontext auf (Modell-Feld setzen).
        case "$CLAUDE_MODEL" in
          fable)  RESOLVED_MODEL_ID="claude-fable-5" ;;
          opus)   RESOLVED_MODEL_ID="claude-opus-5" ;;
          sonnet) RESOLVED_MODEL_ID="claude-sonnet-5" ;;
          haiku)  RESOLVED_MODEL_ID="claude-haiku-4-5-20251001" ;;
          "")
            RESOLVED_MODEL_ID=""
            ;;
          *)
            echo "::error title=Ungueltiger Modell-Alias::inputs.model='$CLAUDE_MODEL' — erlaubt: fable | opus | sonnet | haiku (oder leer fuer settings.json-Default). Kein stiller Fallback auf einen falsches Modell."
            exit 1
            ;;
        esac

        if [ -n "$RESOLVED_MODEL_ID" ]; then
          case "$PROVIDER" in
            zai|openrouter)
              # WICHTIG: Hier den ALIAS ($CLAUDE_MODEL, z.B. "opus") schreiben, NICHT die
              # aufgeloeste native Anthropic-Modell-ID ($RESOLVED_MODEL_ID, z.B. "claude-opus-5").
              # Die native ID existiert bei zai/openrouter nicht ("model not found") — der Alias
              # greift stattdessen ueber den bereits aus vars.CLAUDE_CODE_SETTINGS_LOCAL_{ZAI,
              # OPENROUTER} geladenen ANTHROPIC_DEFAULT_{OPUS,SONNET,HAIKU,FABLE}_MODEL-Mechanismus
              # (exakt wie das checked-in .claude/settings.json es fuer den Default-Fall tut).
              if [ -f .claude/settings.local.json ]; then
                tmp_model=$(mktemp)
                jq --arg m "$CLAUDE_MODEL" '.model = $m' .claude/settings.local.json > "$tmp_model" && mv "$tmp_model" .claude/settings.local.json
                echo "::notice title=Modell::Alias '$CLAUDE_MODEL' (Provider $PROVIDER) via settings.local.json gesetzt — Aufloesung ueber ANTHROPIC_DEFAULT_*_MODEL."
              else
                echo "::warning title=Modell::Phasen-Modell-Alias '$CLAUDE_MODEL' konnte nicht in settings.local.json geschrieben werden — Datei fehlt (Provider $PROVIDER ohne settings-json). Modell bleibt unaufgeloest."
              fi
              echo "resolved-model=" >> "$GITHUB_OUTPUT"
              ;;
            claude)
              echo "::notice title=Modell::$RESOLVED_MODEL_ID (Alias '$CLAUDE_MODEL') via --model."
              echo "resolved-model=$RESOLVED_MODEL_ID" >> "$GITHUB_OUTPUT"
              ;;
          esac
        else
          echo "::notice title=Modell::Kein Phasen-Modell gesetzt — Default aus .claude/settings.json."
          echo "resolved-model=" >> "$GITHUB_OUTPUT"
        fi

        # Subagent-Modell: CLAUDE_CODE_SUBAGENT_MODEL überschreibt das Modell ALLER
        # Subagents und schlägt deren model-Frontmatter. Deshalb wird es hier bewusst
        # gesetzt statt dem Zufall überlassen — 'inherit' bedeutet ausdrücklich
        # „kein Override, Subagents laufen auf dem Phasenmodell".
        # Dieselbe Alias-Tabelle wie oben; ein unbekannter Alias bricht laut ab, damit
        # ein Tippfehler nicht still das teuerste Modell für den Fan-out wählt.
        case "$SUBAGENT_MODEL" in
          inherit|"")
            echo "::notice title=Subagent-Modell::inherit — Subagents laufen auf dem Phasenmodell (kein Override)."
            ;;
          fable)  SUB_ID="claude-fable-5" ;;
          opus)   SUB_ID="claude-opus-5" ;;
          sonnet) SUB_ID="claude-sonnet-5" ;;
          haiku)  SUB_ID="claude-haiku-4-5-20251001" ;;
          *)
            echo "::error title=Ungueltiger Subagent-Alias::subagent-model='$SUBAGENT_MODEL' — erlaubt: inherit | fable | opus | sonnet | haiku."
            exit 1
            ;;
        esac
        if [ -n "${SUB_ID:-}" ]; then
          echo "CLAUDE_CODE_SUBAGENT_MODEL=$SUB_ID" >> "$GITHUB_ENV"
          echo "::notice title=Subagent-Modell::$SUB_ID (Alias '$SUBAGENT_MODEL') für alle Subagents."
        fi
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # TAILSCALE EXIT-NODE – nur für Provider 'zai' (z.ai blockt Azure-IPs).
    # claude (Anthropic nativ) und openrouter vertrennen Azure-IPs problemlos.
    # Läuft NACH der Provider-Auflösung, damit der finale Provider (inkl.
    # Zeitfenster-Override) bekannt ist. Kill-Switch: tailscale-exit-node leer → deaktiviert.
    # Fail-closed: Exit-Node gesetzt + Provider=zai, aber Key fehlt/
    # Connect scheitert → setup-claude rot → claude-Step wird übersprungen.
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: Tailscale-Preflight (Auth-Key ist Pflicht bei aktivem Exit-Node für zai)
      if: steps.preflight.outputs.configured == 'true' && inputs.tailscale-exit-node != '' && steps.provider.outputs.llm-provider == 'zai'
      shell: bash
      env:
        TAILSCALE_AUTHKEY: ${{ inputs.tailscale-authkey }}
      run: |
        if [ -z "$TAILSCALE_AUTHKEY" ]; then
          echo "::error::TAILSCALE_EXIT_NODE ist gesetzt, aber TAILSCALE_AUTH_KEY fehlt — fail-closed (kein LLM-Egress von der Azure-IP)."
          exit 1
        fi

    - name: Tailscale-Exit-Node verbinden (LLM-Egress über feste IP, für zai)
      if: steps.preflight.outputs.configured == 'true' && inputs.tailscale-exit-node != '' && steps.provider.outputs.llm-provider == 'zai'
      uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
      with:
        authkey: ${{ inputs.tailscale-authkey }}
        args: --exit-node=${{ inputs.tailscale-exit-node }} --exit-node-allow-lan-access=true

    - name: ✅ Tailscale-Verbindung bestätigen (für zai)
      if: steps.preflight.outputs.configured == 'true' && inputs.tailscale-exit-node != '' && steps.provider.outputs.llm-provider == 'zai'
      shell: bash
      run: |
        sleep 2  # tailscaled kurz Zeit geben, Status zu aktualisieren
        if tailscale status >/dev/null 2>&1; then
          SELF_IP=$(tailscale ip -4 2>/dev/null | head -1)
          echo "::notice title=✅ Tailscale Exit-Node verbunden::Tailscale aktiv (Runner-IP: ${SELF_IP:-?}). LLM-Traffic routet über Nürnberg."
          echo "Tailscale-Status: verbunden, Runner-Tailscale-IP: ${SELF_IP:-unbekannt}"
        else
          echo "::warning::tailscale status nicht verfügbar — Exit-Node evtl. nicht aktiv."
        fi

    - name: DNS fixen + Egress-IP protokollieren (für zai)
      if: steps.preflight.outputs.configured == 'true' && inputs.tailscale-exit-node != '' && steps.provider.outputs.llm-provider == 'zai'
      shell: bash
      run: |
        sudo systemctl stop systemd-resolved 2>/dev/null || true
        sudo rm -f /etc/resolv.conf
        echo "nameserver 1.1.1.1" | sudo tee /etc/resolv.conf >/dev/null
        echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf >/dev/null
        if getent hosts api.anthropic.com >/dev/null 2>&1; then
          EGRESS=$(curl -s --max-time 5 https://ipinfo.io/json 2>/dev/null || echo "")
          if [ -n "$EGRESS" ]; then
            IP=$(printf '%s' "$EGRESS" | jq -r '.ip // "?"')
            CITY=$(printf '%s' "$EGRESS" | jq -r '.city // "?"')
            COUNTRY=$(printf '%s' "$EGRESS" | jq -r '.country // "?"')
            echo "::notice title=🌐 LLM-Egress über Tailscale::Exit-Node aktiv — IP ${IP} (${CITY}, ${COUNTRY})."
            echo "Egress-IP: ${IP} (${CITY}, ${COUNTRY})"
          else
            echo "::notice::Tailscale-Exit-Node aktiv + DNS via 1.1.1.1/8.8.8.8 (Egress-IP nicht abrufbar)."
          fi
        else
          echo "::error::DNS-Auflösung schlägt trotz Resolver-Wechsel fehl — Exit-Node/Forwarding prüfen."
          exit 1
        fi

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # INVOKE-RESOLUTION – setzt invoke-cmd + invoke-args
    # --model nur bei gesetztem Phasen-Modell (steps.provider.outputs.resolved-model);
    # leerer Wert belässt das Modell in .claude/settings.json (aktueller Zustand).
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: Invoke auflösen
      id: resolve-invoke
      if: steps.preflight.outputs.configured == 'true'
      shell: bash
      env:
        NEEDS_MCP: ${{ inputs.needs-mcp }}
        BROWSER_MCP: ${{ inputs.browser-mcp }}
        TOOLS_TIER: ${{ inputs.tools-tier }}
        CLAUDE_MODEL: ${{ inputs.model }}
        RESOLVED_MODEL: ${{ steps.provider.outputs.resolved-model }}
        COMPACT_TOKENS: ${{ inputs.compact-tokens }}
      run: |
        echo "invoke-cmd=claude -p" >> "$GITHUB_OUTPUT"

        # Phasen-Modell (nur bei gesetztem Alias) als --model an claude weiterreichen.
        # Leerer Wert (kein Phasen-Modell oder Nicht-claude-Provider) -> kein --model,
        # das Modell kommt aus .claude/settings.json (bisheriges Verhalten).
        MODEL_FLAG=""
        if [ -n "$RESOLVED_MODEL" ]; then
          MODEL_FLAG="--model $RESOLVED_MODEL"
        fi

        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        # KONTEXT-Compaction: --autocompact an die Invoke-Args anhängen.
        #
        # Claude Code fasst den ältesten Kontext automatisch zusammen, wenn die
        # angegebene Schwelle überschreitet — verhindert Kontext-Explosion innerhalb
        # eines Laufs (insbesondere bei langen Fixup- und Review-Läufen mit CI-Logs).
        # Leerer compact-tokens = disabled (kein Breaking-Change für Helper-Workflows).
        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        COMPACT_FLAG=""
        if [ -n "$COMPACT_TOKENS" ]; then
          COMPACT_FLAG="--autocompact $COMPACT_TOKENS"
          echo "::notice::Auto-Compaction aktiviert bei $COMPACT_TOKENS Tokens."
        fi

        # MCP-Server-Name spiegelt .mcp.json (kolibri-mcp); aktiv nur bei needs-mcp.
        # Playwright-MCP bei browser-mcp=true.
        MCP_TOOLS="mcp__kolibri-mcp__*"
        BROWSER_TOOLS="mcp__playwright__*"
        [ "$BROWSER_MCP" = "true" ] && MCP_TOOLS="$MCP_TOOLS,$BROWSER_TOOLS"
        VOLLES_TOOLSET="Read,Glob,Grep,Bash,Write,Edit"

        case "${TOOLS_TIER:-full}" in
          restricted)
            # Tier 1 — nur lesender GitHub-Zugriff, KEIN Bypass (Triage arbeitet nur via gh).
            # Bash(gh *)/Bash(git *) bleiben eng, Write/Edit bewusst nicht erlaubt — einzige
            # Ausnahme: Edit auf den nativen Memory (autoMemoryDirectory = .claude/memory), damit
            # Claude seine Phasen-Notizen schreiben kann. Zwei Globs defensiv: /* deckt Wurzeldateien
            # (MEMORY.md + Notizen — das flache auto-memory Layout), /** verschachtelte Pfade falls
            # auto-memory Subdirs anlegt (allein ** matcht Wurzeldateien nicht zuverlässig).
            # Claude Code wertet für Datei-Schreibzugriffe NUR Edit(path)-Regeln aus — Write(path)
            # wird ignoriert (Edit deckt alle file-editing-Tools inkl. Write ab).
            # Task (Subagents) ist hier bewusst dabei: Die Analyse ist die einzige Phase auf
            # dem starken Modell und muss den Code breit lesen. Ohne Fan-out landet dieses
            # Lesen vollstaendig im teuren Elternkontext; mit Subagent kommt nur die
            # Schlussfolgerung zurueck. Das Subagent-Modell setzt der Aufrufer ueber
            # subagent-model (CLAUDE_CODE_SUBAGENT_MODEL) — sonst liefe der Fan-out auf
            # demselben teuren Modell und der Spareffekt kehrte sich um.
            # Die Schreibrechte bleiben unveraendert eng (nur .claude/memory).
            ALLOWED_TOOLS="Read,Glob,Grep,Task,Bash(gh *),Bash(git *),Edit(.claude/memory/*),Edit(.claude/memory/**)"
            [ "$NEEDS_MCP" = "true" ] && ALLOWED_TOOLS="$ALLOWED_TOOLS,$MCP_TOOLS"
            # — !WICHTIG! —
            # Zwingendes Single-Quoting des Wertes nach --allowedTools (und --disallowedTools):
            # die Tool-Spezifizierer enthalten '(' und '*' (z.B. 'Bash(gh *)'). GitHub Actions
            # substituiert ${{ steps.setup.outputs.invoke-args }} WÖRTLICH in den run:-Block,
            # OHNE Quoting-Layer. Ungequotet parst bash '(' als Subshell-Start → Syntaxfehler
            # (exit 2, "syntax error near unexpected token `('"). Das betrifft das restricted-
            # und review-Tier (Edit(path)-Globs), full nutzt weiter das klammerfreie
            # VOLLES_TOOLSET — wir quoten konsistent in allen drei Zweigen, damit ein späteres
            # Tool mit '(' in full nicht denselben Crash auslöst.
            echo "invoke-args=$COMPACT_FLAG --allowedTools '$ALLOWED_TOOLS' $MODEL_FLAG" >> "$GITHUB_OUTPUT"
            ;;
          review)
            # Vollzugriff auf Lesen/Ausführen, schreibgeschützt für Code — Review liest
            # untrusted Diffs und ändert keinen Code. EINZIGE Schreiböffnung: der Issue-Memory
            # (.claude/memory) über dieselbe Edit(path)-Allowlist-Mechanik wie im restricted-
            # Tier. Bewusst KEIN Bypass+disallowTools mehr: einer globalen 'Edit'-Disallow
            # könnte keine Allow-Regel den Memory-Pfad wieder öffnen (Disallow gewinnt) —
            # die Allowlist hält Code schreibgeschützt UND Memory schreibbar zugleich.
            ALLOWED_TOOLS="Read,Glob,Grep,Bash,Edit(.claude/memory/*),Edit(.claude/memory/**)"
            [ "$NEEDS_MCP" = "true" ] && ALLOWED_TOOLS="$ALLOWED_TOOLS,$MCP_TOOLS"
            echo "invoke-args=$COMPACT_FLAG --allowedTools '$ALLOWED_TOOLS' $MODEL_FLAG" >> "$GITHUB_OUTPUT"
            ;;
          full)
            # Tier 2 — vollautonom (Bypass + volles Toolset inkl. Write/Edit).
            ALLOWED_TOOLS="$VOLLES_TOOLSET"
            [ "$NEEDS_MCP" = "true" ] && ALLOWED_TOOLS="$ALLOWED_TOOLS,$MCP_TOOLS"
            echo "invoke-args=$COMPACT_FLAG --dangerously-skip-permissions --allowedTools '$ALLOWED_TOOLS' $MODEL_FLAG" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error title=Ungueltiges tools-tier::tools-tier='$TOOLS_TIER' — erlaubt: restricted | review | full"
            exit 1
            ;;
        esac

    # Memory-Save findet sich NICHT hier (die Action läuft ausschließlich pre-claude).
    # Phasen (01..05) sichern nach dem claude-Step den Issue-Storage über die Composite-Action
    # issue-state-save als Fetch-then-Commit auf ai/state/issue-{N} (ADR 0006) — der Branch IST
    # der Speicher, es folgt kein Artefakt-/Cache-Transport mehr (Cache-Writes sind für diese
    # Trigger platform-seitig gesperrt, s. Kopf-Kommentar).
