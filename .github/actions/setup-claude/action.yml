name: 'Setup Claude Code Runtime'
description: 'Claude-Code-spezifischer Teil eines Agenten-Laufs: CLI-Install + Auth (Provider-Switch claude/zai/openrouter), Modell-Aliase, Invoke-Resolution. Wird ausschließlich von setup-agent aufgerufen.'

# ROLLE DIESER ACTION (seit Issue #1184): Sie enthält NUR noch Claude-Code-Spezifisches.
# Alles Runtime-Neutrale — App-Token, Git-Remote/Identität, Ticket-Auflösung, Memory-Load,
# ZAI-Zeitfenster, Provider-Auflösung, Tailscale — liegt in ../setup-agent und läuft dort VOR
# dieser Action. Workflows rufen deshalb `./.github/actions/setup-agent` auf, nicht diese Datei.
#
# WARUM DER SCHNITT SO LIEGT: WELCHER Provider gilt, ist für Claude Code und pi dieselbe Frage
# (→ setup-agent). WIE er authentifiziert und wie das Modell aufgelöst wird, ist es nicht:
# Claude Code arbeitet mit ANTHROPIC_*-Env plus einer settings.local.json, pi mit
# providereigenen Variablen plus models.json. Deshalb kommt `llm-provider` hier bereits
# AUFGELÖST an (inkl. Zeitfenster-Override) und wird nur noch umgesetzt.
#
# WARUM MEMORY NACH .ai-memory UND NICHT NACH .claude/memory (Kontext für die Tool-Allowlist
# weiter unten): Claude Code sperrt alles unterhalb von .claude/ als "sensitive file", BEVOR die
# --allowedTools-Allowlist ausgewertet wird. Eine Allow-Regel kann diese Sperre nicht wieder
# öffnen. Folge im alten Layout: die Phasen mit tools-tier restricted/review (Triage, UX,
# Review, Documenter) konnten ihre Phasen-Notiz NIE schreiben — Write-Tool UND Bash-Heredoc
# wurden beide abgelehnt (belegt in Run 32747085777, Review an PR #989, und Run 32741816829,
# Triage an #934). Nur die full-Phasen kamen durch, weil --dangerously-skip-permissions die
# Prüfung komplett überspringt. Ein gewöhnlicher Repo-Pfad ausserhalb .claude/ plus
# Edit(path)-Allowlist löst das für alle Tiers.

inputs:
  llm-provider:
    description: 'BEREITS AUFGELÖSTER LLM-Provider ("claude", "zai" oder "openrouter") aus setup-agent — inklusive ZAI-Zeitfenster-Override. Wird hier nicht erneut validiert.'
    required: true
  needs-mcp:
    description: 'Ob KoliBri MCP für diesen Workflow benötigt wird. Steuert nur die allowedTools; registriert ist der Server in .claude/settings.json. Gilt für alle Phasen außer Documenter (07).'
    required: false
    default: 'false'
  browser-mcp:
    description: 'Ob Playwright-MCP (Browser-Tools) für diesen Workflow benötigt wird. Bei true werden mcp__playwright__* Tools zur Allowlist aller Tiers hinzugefügt. Nur für Phasen mit UI-Inspektion (02 UX, 04 Umsetzung, 06 Fixup).'
    required: false
    default: 'false'
  tools-tier:
    description: 'Permission-Tier für diesen Lauf. "restricted" = nur lesender GitHub-Zugriff via gh/git, kein Bypass (Triage). "review" = Vollzugriff minus Write/Edit. "full" = vollautonom mit Bypass (Default; Spec/Implement/Fixup). Steuert --allowedTools / --dangerously-skip-permissions / --disallowedTools. Der globale deny-Layer in .claude/settings.json greift in JEDEM Tier (auch unter bypass).'
    required: false
    default: 'full'
  zai-api-key:
    description: 'API-Key für z.ai (secret, secrets.ZAI_API_KEY). Nur bei llm-provider=zai erforderlich.'
    required: false
  claude-api-key:
    description: 'API-Key für Anthropic (secret, secrets.CLAUDE_API_KEY). Nur bei llm-provider=claude erforderlich.'
    required: false
  openrouter-api-key:
    description: 'API-Key für OpenRouter (secret, secrets.OPENROUTER_API_KEY). Nur bei llm-provider=openrouter erforderlich.'
    required: false
  # Settings-JSON direkt als Input (aus GitHub Variables) – vermeidet gh CLI Auth-Probleme
  zai-settings-json:
    description: 'settings.local.json für zai als JSON-String (aus vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI)'
    required: false
    default: ''
  openrouter-settings-json:
    description: 'settings.local.json für openrouter als JSON-String (aus vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER)'
    required: false
    default: ''
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # KONTEXT-Compaction: --autocompact an Claude Code CLI übergeben.
  #
  # Claude Code im -p-Modus läuft als agentische Schleife: Jedes Tool-Ergebnis wächst
  # den Kontext. --autocompact <auto|tokens> fasst den ältesten Teil automatisch
  # zusammen, wenn die Schwelle überschreitet — das Gegenstück zur Pi-/compact-Compaction,
  # hier als zentraler Guard gegen Kontext-Explosion innerhalb eines einzelnen Laufs.
  #
  # Leer = Default aus .claude/settings.json (auto, threshold 0.65).
  # "auto" = Claude entscheidet selbst über die Schwelle.
  # "80k".."1M" = expliziter Token-Schwellwert (nur Zahlen + k/M-Suffix).
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  compact-tokens:
    description: 'Auto-compact threshold für Claude Code (z.B. "80k", "100k", "auto"). Leer = Default aus .claude/settings.json.'
    required: false
    default: ''
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # EFFORT-LEVEL (Thinking-Budget): --effort an Claude Code CLI übergeben.
  #
  # Extended Thinking zaehlt als OUTPUT-Preis ($75/M) und dominiert damit die
  # Phasen-Kosten (~79% bei Triage-Runs). alwaysThinkingEnabled=true in
  # .claude/settings.json gilt GLOBAL — der mechanische Documenter denkt
  # genauso viel wie die Recherche-Triage. --effort stuft ab:
  #   low    = triviale/mechanische Laeufe (Documenter, UX-Regelcheck)
  #   medium = Handwerk mit klarem Weg (Spec, Fixup)
  #   high   = Recherche/Urteil (Triage, Implement, Review)
  # Leer = kein Flag (bisheriges Verhalten, settings.json-Default gilt).
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  effort:
    description: 'Effort-Level (Thinking-Budget) für diesen Lauf: low | medium | high | xhigh | max. Leer = kein Flag.'
    required: false
    default: ''
  model:
    description: 'Claude-Modell für diesen Lauf als Alias (fable|opus|sonnet|haiku); leer = kein --model (Default aus .claude/settings.json). Der Alias wird providerspezifisch aufgelöst (claude nativ via --model, zai/openrouter via settings.local.json); ein ungültiger Alias bricht laut ab (kein stiller Fallback).'
    required: false
    default: ''
  subagent-model:
    description: >-
      Modell für Subagents als Alias, oder 'inherit' (Default). Wird als
      CLAUDE_CODE_SUBAGENT_MODEL gesetzt.

      BEWUSST GESETZT, NICHT UNGESETZT GELASSEN: Die Variable überschreibt das Modell für
      ALLE Subagents und hat Vorrang vor deren model-Frontmatter. Bliebe sie unbestimmt,
      liefe ein Subagent-Fan-out einer fable-Phase potenziell ebenfalls auf fable — und
      genau das kehrte die Kostenlogik um, die die Phasen-Modellwahl herstellt.
      'inherit' = ausdrücklich das Phasenmodell (bisheriges Verhalten, kein Override).
    required: false
    default: 'inherit'

outputs:
  invoke-cmd:
    description: 'Invoke-Befehl (claude -p)'
    value: ${{ steps.resolve-invoke.outputs.invoke-cmd }}
  invoke-args:
    description: 'Invoke-Argumente (Claude-Flags inkl. --allowedTools)'
    value: ${{ steps.resolve-invoke.outputs.invoke-args }}

runs:
  using: composite
  steps:
    # Claude Code CLI cachen — ohne Cache kostet npm install -g auf jedem kalten
    # Runner 30–60s. Der Cache-Key ist statisch pro OS; bei Eviction (>7 Tage
    # ungenutzt oder 10 GB Repo-Limit) reinstalliert ein Lauf frisch und
    # schreibt den Cache neu. Cache-Bust bei Bedarf über Suffix (v2, v3, …).
    - name: Claude Code CLI sichern
      id: cache-claude
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          /usr/local/lib/node_modules/@anthropic-ai
          /usr/local/bin/claude
        key: claude-code-cli-${{ runner.os }}-v4

    # VERIFIZIEREN STATT VERTRAUEN: Die Bedingung lautete lange „installiere nur, wenn der
    # Cache NICHT griff". Ein Cache-Treffer beweist aber nur, dass Dateien da sind — nicht,
    # dass die CLI startet. Die plattform-native Binary kommt über ein Postinstall
    # (`install.cjs`) bzw. eine optionale Abhängigkeit; fehlt sie im gecachten Stand, endet
    # jeder Lauf mit „claude native binary not installed", und zwar dauerhaft: Der statische
    # Key invalidiert nie, und der Install-Step wurde bei Treffer übersprungen. Ein
    # Key-Bust heilt das genau einmal — die Prüfung unten dauerhaft.
    #
    # Zweiter Gewinn: Der Abbruch passiert HIER statt im Phasen-Step. Vorher lief die Phase
    # erst 5–10 Minuten (Setup, pnpm, Chromium, Server-Build) und starb dann im
    # claude-Aufruf, wo die Ursache im Log untergeht und wie ein Provider-/Modellfehler
    # aussieht.
    - name: Claude Code bereitstellen und prüfen
      shell: bash
      run: |
        set -uo pipefail

        cli_ok() { claude --version >/dev/null 2>&1; }

        if cli_ok; then
          echo "::notice title=Claude CLI::Lauffähig ($(claude --version 2>/dev/null))."
          exit 0
        fi

        if [ "${{ steps.cache-claude.outputs.cache-hit }}" = "true" ]; then
          echo "::warning title=Claude CLI unvollständig::Cache-Treffer, aber die CLI startet nicht — wird neu installiert. Passiert das in JEDEM Lauf, liegt die native Binary außerhalb der gecachten Pfade: dann die path-Liste oben erweitern."
        fi

        npm install -g @anthropic-ai/claude-code

        # Postinstall notfalls von Hand: Manche npm-/pnpm-Konfigurationen überspringen
        # Scripts (--ignore-scripts) oder optionale Abhängigkeiten (--omit=optional) —
        # genau dann fehlt die native Binary. Der Fehlertext der CLI nennt diesen Weg
        # selbst als Abhilfe. `npm root -g` statt hartem Pfad (aus PR #923), mit
        # Rückfall auf den Standardpfad, falls npm den Root nicht liefert.
        if ! cli_ok; then
          NPM_ROOT="$(npm root -g 2>/dev/null || echo /usr/local/lib/node_modules)"
          PKG="${NPM_ROOT}/@anthropic-ai/claude-code"
          if [ -f "$PKG/install.cjs" ]; then
            echo "::notice title=Claude CLI::Postinstall wird manuell nachgeholt ($PKG/install.cjs)."
            node "$PKG/install.cjs" || true
          else
            echo "::warning title=Claude CLI::install.cjs nicht gefunden unter $PKG — Paketlayout abweichend?"
          fi
        fi

        if ! cli_ok; then
          echo "::error title=Claude CLI nicht lauffähig::'claude --version' startet auch nach Neuinstallation nicht. Der Lauf wird hier beendet, statt später im LLM-Aufruf zu scheitern."
          exit 1
        fi
        echo "::notice title=Claude CLI::Neu installiert und lauffähig ($(claude --version 2>/dev/null))."

    - name: Claude Code Trust-Dialog für CI-Workspace akzeptieren
      shell: bash
      run: |
        mkdir -p "$HOME/.claude"
        CLAUDE_JSON="$HOME/.claude.json"
        WORKSPACE_PATH="${{ github.workspace }}"
        if [ -f "$CLAUDE_JSON" ]; then
          tmp=$(mktemp)
          jq --arg wp "$WORKSPACE_PATH" '.projects[$wp].hasTrustDialogAccepted = true' "$CLAUDE_JSON" > "$tmp" && mv "$tmp" "$CLAUDE_JSON"
        else
          jq -n --arg wp "$WORKSPACE_PATH" '{projects: {($wp): {hasTrustDialogAccepted: true}}}' > "$CLAUDE_JSON"
        fi
        echo "::notice::Claude Code Trust-Dialog für CI-Workspace ($WORKSPACE_PATH) akzeptiert."

    - name: Auth setzen + Modell auflösen
      id: provider
      shell: bash
      env:
        LLM_PROVIDER: ${{ inputs.llm-provider }}
        ZAI_API_KEY: ${{ inputs.zai-api-key }}
        CLAUDE_API_KEY: ${{ inputs.claude-api-key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        ZAI_SETTINGS_JSON: ${{ inputs.zai-settings-json }}
        OPENROUTER_SETTINGS_JSON: ${{ inputs.openrouter-settings-json }}
        CLAUDE_MODEL: ${{ inputs.model }}
        SUBAGENT_MODEL: ${{ inputs.subagent-model }}
      run: |
        # Der Provider kommt bereits aufgelöst und validiert aus setup-agent (inkl.
        # ZAI-Zeitfenster-Override) — hier wird er nur noch umgesetzt.
        PROVIDER="$LLM_PROVIDER"

        # Secrets strippen (Whitespace/Newlines)
        CLAUDE_API_KEY="$(printf '%s' "$CLAUDE_API_KEY" | tr -d '[:space:]')"
        ZAI_API_KEY="$(printf '%s' "$ZAI_API_KEY" | tr -d '[:space:]')"
        OPENROUTER_API_KEY="$(printf '%s' "$OPENROUTER_API_KEY" | tr -d '[:space:]')"

        case "$PROVIDER" in
          claude)
            if [ -z "$CLAUDE_API_KEY" ]; then
              echo "::error title=Auth fehlt::vars.LLM_PROVIDER=claude, aber Secret CLAUDE_API_KEY ist leer."
              exit 1
            fi
            # Anthropic kennt ZWEI Token-Typen:
            #   sk-ant-api…  klassischer API-Key   → ANTHROPIC_API_KEY
            #   sk-ant-oat…  OAuth-Token aus `claude setup-token` → CLAUDE_CODE_OAUTH_TOKEN
            case "$CLAUDE_API_KEY" in
              sk-ant-oat*)
                echo "CLAUDE_CODE_OAUTH_TOKEN=$CLAUDE_API_KEY" >> "$GITHUB_ENV"
                echo "::notice::Provider=claude – OAuth-Token erkannt (sk-ant-oat…) → CLAUDE_CODE_OAUTH_TOKEN."
                ;;
              sk-ant-*)
                echo "ANTHROPIC_API_KEY=$CLAUDE_API_KEY" >> "$GITHUB_ENV"
                echo "::notice::Provider=claude – API-Key erkannt (sk-ant-…) → ANTHROPIC_API_KEY."
                ;;
              *)
                echo "ANTHROPIC_API_KEY=$CLAUDE_API_KEY" >> "$GITHUB_ENV"
                echo "::warning title=Unerwartetes Token-Format::CLAUDE_API_KEY beginnt nicht mit 'sk-ant-'. Versuche als ANTHROPIC_API_KEY."
                ;;
            esac
            ;;
          zai)
            if [ -z "$ZAI_API_KEY" ]; then
              echo "::error title=Auth fehlt::vars.LLM_PROVIDER=zai, aber Secret ZAI_API_KEY ist leer."
              exit 1
            fi
            # settings.local.json aus Input bauen
            if [ -n "$ZAI_SETTINGS_JSON" ]; then
              echo "$ZAI_SETTINGS_JSON" > .claude/settings.local.json
              echo "::notice::settings.local.json aus Input zai-settings-json geschrieben."
            else
              echo "::warning::Input zai-settings-json leer – keine settings.local.json für zai."
            fi
            # Auth Token setzen (z.ai nutzt ANTHROPIC_AUTH_TOKEN als Bearer)
            echo "ANTHROPIC_AUTH_TOKEN=$ZAI_API_KEY" >> "$GITHUB_ENV"
            ;;
          openrouter)
            if [ -z "$OPENROUTER_API_KEY" ]; then
              echo "::error title=Auth fehlt::vars.LLM_PROVIDER=openrouter, aber Secret OPENROUTER_API_KEY ist leer."
              exit 1
            fi
            # settings.local.json aus Input bauen
            if [ -n "$OPENROUTER_SETTINGS_JSON" ]; then
              echo "$OPENROUTER_SETTINGS_JSON" > .claude/settings.local.json
              echo "::notice::settings.local.json aus Input openrouter-settings-json geschrieben."
            else
              echo "::warning::Input openrouter-settings-json leer – keine settings.local.json für openrouter."
            fi
            # Auth Token setzen (OpenRouter nutzt ANTHROPIC_AUTH_TOKEN als Bearer)
            echo "ANTHROPIC_AUTH_TOKEN=$OPENROUTER_API_KEY" >> "$GITHUB_ENV"
            # Unbekannte Modelle erlauben (CI-Cache kann ältere CLI-Version haben als lokal)
            echo "CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_WINDOW_ENFORCEMENT=1" >> "$GITHUB_ENV"
            echo "::notice::OpenRouter: CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_WINDOW_ENFORCEMENT=1 gesetzt (unbekannte Modelle erlaubt)."
            ;;
        esac

        # Phasen-Modell (#511): Alias fable|opus|sonnet|haiku providerspezifisch aufloesen.
        # claude (nativ) erhaelt die konkrete Modell-ID via --model (resolve-invoke); zai/
        # openrouter loesen den Alias im settings.local.json-Kontext auf (Modell-Feld setzen).
        case "$CLAUDE_MODEL" in
          fable)  RESOLVED_MODEL_ID="claude-fable-5" ;;
          opus)   RESOLVED_MODEL_ID="claude-opus-5" ;;
          sonnet) RESOLVED_MODEL_ID="claude-sonnet-5" ;;
          haiku)  RESOLVED_MODEL_ID="claude-haiku-4-5-20251001" ;;
          "")
            RESOLVED_MODEL_ID=""
            ;;
          *)
            echo "::error title=Ungueltiger Modell-Alias::inputs.model='$CLAUDE_MODEL' — erlaubt: fable | opus | sonnet | haiku (oder leer fuer settings.json-Default). Kein stiller Fallback auf einen falsches Modell."
            exit 1
            ;;
        esac

        if [ -n "$RESOLVED_MODEL_ID" ]; then
          case "$PROVIDER" in
            zai|openrouter)
              # WICHTIG: Hier den ALIAS ($CLAUDE_MODEL, z.B. "opus") schreiben, NICHT die
              # aufgeloeste native Anthropic-Modell-ID ($RESOLVED_MODEL_ID, z.B. "claude-opus-5").
              # Die native ID existiert bei zai/openrouter nicht ("model not found") — der Alias
              # greift stattdessen ueber den bereits aus vars.CLAUDE_CODE_SETTINGS_LOCAL_{ZAI,
              # OPENROUTER} geladenen ANTHROPIC_DEFAULT_{OPUS,SONNET,HAIKU,FABLE}_MODEL-Mechanismus
              # (exakt wie das checked-in .claude/settings.json es fuer den Default-Fall tut).
              if [ -f .claude/settings.local.json ]; then
                tmp_model=$(mktemp)
                jq --arg m "$CLAUDE_MODEL" '.model = $m' .claude/settings.local.json > "$tmp_model" && mv "$tmp_model" .claude/settings.local.json
                echo "::notice title=Modell::Alias '$CLAUDE_MODEL' (Provider $PROVIDER) via settings.local.json gesetzt — Aufloesung ueber ANTHROPIC_DEFAULT_*_MODEL."
              else
                echo "::warning title=Modell::Phasen-Modell-Alias '$CLAUDE_MODEL' konnte nicht in settings.local.json geschrieben werden — Datei fehlt (Provider $PROVIDER ohne settings-json). Modell bleibt unaufgeloest."
              fi
              echo "resolved-model=" >> "$GITHUB_OUTPUT"
              ;;
            claude)
              echo "::notice title=Modell::$RESOLVED_MODEL_ID (Alias '$CLAUDE_MODEL') via --model."
              echo "resolved-model=$RESOLVED_MODEL_ID" >> "$GITHUB_OUTPUT"
              ;;
          esac
        else
          echo "::notice title=Modell::Kein Phasen-Modell gesetzt — Default aus .claude/settings.json."
          echo "resolved-model=" >> "$GITHUB_OUTPUT"
        fi

        # Subagent-Modell: CLAUDE_CODE_SUBAGENT_MODEL überschreibt das Modell ALLER
        # Subagents und schlägt deren model-Frontmatter. Deshalb wird es hier bewusst
        # gesetzt statt dem Zufall überlassen — 'inherit' bedeutet ausdrücklich
        # „kein Override, Subagents laufen auf dem Phasenmodell".
        # Dieselbe Alias-Tabelle wie oben; ein unbekannter Alias bricht laut ab, damit
        # ein Tippfehler nicht still das teuerste Modell für den Fan-out wählt.
        case "$SUBAGENT_MODEL" in
          inherit|"")
            echo "::notice title=Subagent-Modell::inherit — Subagents laufen auf dem Phasenmodell (kein Override)."
            ;;
          fable)  SUB_ID="claude-fable-5" ;;
          opus)   SUB_ID="claude-opus-5" ;;
          sonnet) SUB_ID="claude-sonnet-5" ;;
          haiku)  SUB_ID="claude-haiku-4-5-20251001" ;;
          *)
            echo "::error title=Ungueltiger Subagent-Alias::subagent-model='$SUBAGENT_MODEL' — erlaubt: inherit | fable | opus | sonnet | haiku."
            exit 1
            ;;
        esac
        if [ -n "${SUB_ID:-}" ]; then
          echo "CLAUDE_CODE_SUBAGENT_MODEL=$SUB_ID" >> "$GITHUB_ENV"
          echo "::notice title=Subagent-Modell::$SUB_ID (Alias '$SUBAGENT_MODEL') für alle Subagents."
        fi

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # INVOKE-RESOLUTION – setzt invoke-cmd + invoke-args
    # --model nur bei gesetztem Phasen-Modell (steps.provider.outputs.resolved-model);
    # leerer Wert belässt das Modell in .claude/settings.json (aktueller Zustand).
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - name: Invoke auflösen
      id: resolve-invoke
      shell: bash
      env:
        NEEDS_MCP: ${{ inputs.needs-mcp }}
        BROWSER_MCP: ${{ inputs.browser-mcp }}
        TOOLS_TIER: ${{ inputs.tools-tier }}
        CLAUDE_MODEL: ${{ inputs.model }}
        RESOLVED_MODEL: ${{ steps.provider.outputs.resolved-model }}
        COMPACT_TOKENS: ${{ inputs.compact-tokens }}
        EFFORT_LEVEL: ${{ inputs.effort }}
      run: |
        echo "invoke-cmd=claude -p" >> "$GITHUB_OUTPUT"

        # Phasen-Modell (nur bei gesetztem Alias) als --model an claude weiterreichen.
        # Leerer Wert (kein Phasen-Modell oder Nicht-claude-Provider) -> kein --model,
        # das Modell kommt aus .claude/settings.json (bisheriges Verhalten).
        MODEL_FLAG=""
        if [ -n "$RESOLVED_MODEL" ]; then
          MODEL_FLAG="--model $RESOLVED_MODEL"
        fi

        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        # KONTEXT-Compaction: --autocompact an die Invoke-Args anhängen.
        #
        # Claude Code fasst den ältesten Kontext automatisch zusammen, wenn die
        # angegebene Schwelle überschreitet — verhindert Kontext-Explosion innerhalb
        # eines Laufs (insbesondere bei langen Fixup- und Review-Läufen mit CI-Logs).
        # Leerer compact-tokens = --autocompact auto (nutzt .claude/settings.json Default).
        # Expliziter Wert (z.B. "80k") überschreibt den Default.
        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        COMPACT_FLAG="--autocompact auto"
        if [ -n "$COMPACT_TOKENS" ]; then
          COMPACT_FLAG="--autocompact $COMPACT_TOKENS"
          echo "::notice::Auto-Compaction explizit auf $COMPACT_TOKENS Tokens (override settings.json)."
        else
          echo "::notice::Auto-Compaction aktiviert (nutzt .claude/settings.json Default: auto, threshold 0.65)."
        fi

        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        # EFFORT-LEVEL (Thinking-Budget): --effort an die Invoke-Args anhaengen.
        # Extended Thinking zaehlt als Output-Preis — ohne Abstufung denkt der
        # mechanische Documenter auf demselben Niveau wie die Recherche-Triage.
        # Leer = kein Flag (settings.json-Default gilt). Ungueltiger Wert = laut
        # Abbruch (kein stiller Fallback).
        # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        EFFORT_FLAG=""
        if [ -n "$EFFORT_LEVEL" ]; then
          case "$EFFORT_LEVEL" in
            low|medium|high|xhigh|max)
              EFFORT_FLAG="--effort $EFFORT_LEVEL"
              echo "::notice::Effort-Level: $EFFORT_LEVEL (Thinking-Budget)."
              ;;
            *)
              echo "::error title=Ungueltiges effort::effort='$EFFORT_LEVEL' — erlaubt: low | medium | high | xhigh | max"
              exit 1
              ;;
          esac
        fi

        # MCP-Server-Name spiegelt .mcp.json (kolibri-mcp); aktiv nur bei needs-mcp.
        # Playwright-MCP bei browser-mcp=true.
        MCP_TOOLS="mcp__kolibri-mcp__*"
        BROWSER_TOOLS="mcp__playwright__*"
        [ "$BROWSER_MCP" = "true" ] && MCP_TOOLS="$MCP_TOOLS,$BROWSER_TOOLS"

        case "${TOOLS_TIER:-full}" in
          restricted)
            # Tier 1 — nur lesender GitHub-Zugriff, KEIN Bypass (Triage arbeitet nur via gh).
            # Bash(gh *)/Bash(git *) bleiben eng, Write/Edit bewusst nicht erlaubt — einzige
            # Ausnahme: Edit auf den nativen Memory (autoMemoryDirectory = .ai-memory), damit
            # Claude seine Phasen-Notizen schreiben kann. Zwei Globs defensiv: /* deckt Wurzeldateien
            # (MEMORY.md + Notizen — das flache auto-memory Layout), /** verschachtelte Pfade falls
            # auto-memory Subdirs anlegt (allein ** matcht Wurzeldateien nicht zuverlässig).
            # Claude Code wertet für Datei-Schreibzugriffe NUR Edit(path)-Regeln aus — Write(path)
            # wird ignoriert (Edit deckt alle file-editing-Tools inkl. Write ab).
            # DER PFAD MUSS AUSSERHALB VON .claude/ LIEGEN: dort greift eine Sensitive-File-Sperre
            # VOR der Allowlist, die keine Allow-Regel aufhebt (siehe Kopf-Kommentar).
            # Task (Subagents) ist hier bewusst dabei: Die Analyse ist die einzige Phase auf
            # dem starken Modell und muss den Code breit lesen. Ohne Fan-out landet dieses
            # Lesen vollstaendig im teuren Elternkontext; mit Subagent kommt nur die
            # Schlussfolgerung zurueck. Das Subagent-Modell setzt der Aufrufer ueber
            # subagent-model (CLAUDE_CODE_SUBAGENT_MODEL) — sonst liefe der Fan-out auf
            # demselben teuren Modell und der Spareffekt kehrte sich um.
            # Die Schreibrechte bleiben unveraendert eng (nur .ai-memory).
            ALLOWED_TOOLS="Read,Glob,Grep,Task,Bash(gh *),Bash(git *),Edit(.ai-memory/*),Edit(.ai-memory/**)"
            [ "$NEEDS_MCP" = "true" ] && ALLOWED_TOOLS="$ALLOWED_TOOLS,$MCP_TOOLS"
            # — !WICHTIG! —
            # Zwingendes Single-Quoting des Wertes nach --allowedTools (und --disallowedTools):
            # die Tool-Spezifizierer enthalten '(' und '*' (z.B. 'Bash(gh *)'). GitHub Actions
            # substituiert ${{ steps.setup.outputs.invoke-args }} WÖRTLICH in den run:-Block,
            # OHNE Quoting-Layer. Ungequotet parst bash '(' als Subshell-Start → Syntaxfehler
            # (exit 2, "syntax error near unexpected token `('"). Das betrifft das restricted-
            # und review-Tier (Edit(path)-Globs), full nutzt weiter das klammerfreie
            # VOLLES_TOOLSET — wir quoten konsistent in allen drei Zweigen, damit ein späteres
            # Tool mit '(' in full nicht denselben Crash auslöst.
            echo "invoke-args=$COMPACT_FLAG $EFFORT_FLAG --allowedTools '$ALLOWED_TOOLS' $MODEL_FLAG" >> "$GITHUB_OUTPUT"
            ;;
          review)
            # Vollzugriff auf Lesen/Ausführen, schreibgeschützt für Code — Review liest
            # untrusted Diffs und ändert keinen Code. EINZIGE Schreiböffnung: der Issue-Memory
            # (.ai-memory) über dieselbe Edit(path)-Allowlist-Mechanik wie im restricted-
            # Tier. Bewusst KEIN Bypass+disallowTools mehr: einer globalen 'Edit'-Disallow
            # könnte keine Allow-Regel den Memory-Pfad wieder öffnen (Disallow gewinnt) —
            # die Allowlist hält Code schreibgeschützt UND Memory schreibbar zugleich.
            # Task (Subagents) wie im restricted-Tier: Umfeldrecherche zum Diff (Aufrufer,
            # Testabdeckung) ist leseintensiv und liefert ein kurzes Fazit — der Fan-out
            # läuft auf dem Subagent-Modell (subagent-model), nicht auf dem Phasenmodell.
            # Das Review-Urteil selbst bleibt im Parent: der Diff wird nie delegiert.
            ALLOWED_TOOLS="Read,Glob,Grep,Task,Bash,Edit(.ai-memory/*),Edit(.ai-memory/**)"
            [ "$NEEDS_MCP" = "true" ] && ALLOWED_TOOLS="$ALLOWED_TOOLS,$MCP_TOOLS"
            echo "invoke-args=$COMPACT_FLAG $EFFORT_FLAG --allowedTools '$ALLOWED_TOOLS' $MODEL_FLAG" >> "$GITHUB_OUTPUT"
            ;;
          full)
            # Tier 2 — vollautonom (Bypass + volles Toolset inkl. Write/Edit).
            # Task bewusst explizit dabei (unter dem Bypass ohnehin erlaubt): Gate-Ketten
            # und Suchfragen gehen an haiku-Rollen (ADR 0008) — die Allowlist soll die
            # Absicht abbilden, nicht auf dem Bypass-Verhalten ruhen.
            ALLOWED_TOOLS="Read,Glob,Grep,Task,Bash,Write,Edit"
            [ "$NEEDS_MCP" = "true" ] && ALLOWED_TOOLS="$ALLOWED_TOOLS,$MCP_TOOLS"
            echo "invoke-args=$COMPACT_FLAG $EFFORT_FLAG --dangerously-skip-permissions --allowedTools '$ALLOWED_TOOLS' $MODEL_FLAG" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "::error title=Ungueltiges tools-tier::tools-tier='$TOOLS_TIER' — erlaubt: restricted | review | full"
            exit 1
            ;;
        esac
