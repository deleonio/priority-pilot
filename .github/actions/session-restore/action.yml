name: Session-Archiv wiederherstellen
description: >-
  Laedt das archivierte Claude-Code-Sitzungsarchiv fuer ein Issue/PR (juengstes Workflow-Artefakt
  der jeweiligen Phase, falls vorhanden) und liefert ein fertiges --resume-Argument fuer die
  benannte Phase. Artefakte statt Actions-Cache seit 2026-07-10: GitHub vergibt fuer untrusted
  Trigger (issues/issue_comment/pull_request_target) nur noch read-only Cache-Tokens (Changelog
  2026-06-26) -- Hintergrund in session-save/action.yml. Fail-open: jeder Fehler (kein Artefakt,
  korruptes Archiv, fehlende Dateien) fuehrt zu leeren Outputs -- nie zu einem Abbruch des
  aufrufenden Workflows.

inputs:
  issue:
    description: Issue- ODER PR-Nummer, die das Archiv adressiert (s. `id-type`)
    required: true
  phase:
    description: Phasenname der Session (analyse, spec, impl, review, fix)
    required: true
  id-type:
    description: >-
      "issue" (Standard) oder "pr" -- bestimmt den Artefakt-Namensraum
      (claude-session-issue-<N>-<phase> bzw. claude-session-pr-<N>-<phase>). PR-basierte Phasen
      (review/fix) uebergeben "pr", da im Event nur die PR-Nummer verfuegbar ist.
    required: false
    default: issue
  fallback-phase:
    description: >-
      Optional: Vorgaenger-Phase, deren Session als FALLBACK wiederhergestellt wird, wenn die
      eigene Phase (`phase`) noch keine eigene gespeicherte Session hat (erster Lauf). Nur im
      issue-Namensraum (spec->analyse, impl->spec). Leer (Default) = kein Fallback (Verhalten wie
      bisher). Review bleibt bewusst OHNE Fallback (Kreuzverhoer-Unabhaengigkeit).
    required: false
    default: ''
  gh-token:
    description: >-
      Token fuer Artefakt-Suche und -Download (`gh api`, braucht `actions: read` -- anders als
      der fruehere Cache-Restore, der ueber das Runtime-Token lief). Default ist das
      GITHUB_TOKEN des aufrufenden Workflows.
    required: false
    default: ${{ github.token }}

outputs:
  resume-arg:
    description: "Leer ODER '--resume <session-id>', fertig in claude_args spleissbar"
    value: ${{ steps.restore.outputs.resume-arg }}
  session-id:
    description: Session-ID der wiederhergestellten Phase (leer bei Miss)
    value: ${{ steps.restore.outputs.session-id }}
  restored:
    description: "'true', wenn eine vorhandene Session wiederhergestellt wurde, sonst 'false'"
    value: ${{ steps.restore.outputs.restored }}
  restored-from:
    description: 'Phasenname, aus dem tatsaechlich wiederhergestellt wurde (eigene ODER fallback-phase); leer bei Miss'
    value: ${{ steps.restore.outputs.restored-from }}

runs:
  using: composite
  steps:
    - name: Session aus Artefakt einspielen
      id: restore
      shell: bash
      env:
        ISSUE: ${{ inputs.issue }}
        PHASE: ${{ inputs.phase }}
        ID_TYPE: ${{ inputs.id-type }}
        FALLBACK_PHASE: ${{ inputs.fallback-phase }}
        GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        source "${{ github.action_path }}/../session-lib.sh"
        archive_dir="$(archive_dir_for "$ID_TYPE" "$ISSUE")"

        # Jeder Fehlerpfad muendet hier -- niemals in einem non-zero Exit der Action.
        miss() {
          echo "::notice title=Session-Archiv::${ID_TYPE} #$ISSUE Phase $PHASE -- kein Archiv gefunden, frischer Start."
          {
            echo "resume-arg="
            echo "session-id="
            echo "restored=false"
            echo "restored-from="
          } >> "$GITHUB_OUTPUT"
          exit 0
        }

        # Laedt das JUENGSTE, nicht abgelaufene Artefakt der Phase nach $archive_dir/<phase>/.
        # Gleichnamige Artefakte aus verschiedenen Laeufen koexistieren (jeder Save erzeugt ein
        # neues); "latest wins" ersetzt den frueheren Ein-Slot-Cache-Key samt Loesch-Tanz.
        # Return 0 bei Erfolg, 1 bei Miss/Fehler (Aufrufer behandelt beides als Phase-Miss).
        fetch_phase_artifact() {
          local target_phase="$1"
          local dest="$archive_dir/$target_phase"
          local name artifact_id zip_file
          name="$(artifact_name_for "$ID_TYPE" "$ISSUE" "$target_phase")"
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty' 2>/dev/null)" || return 1
          [ -n "$artifact_id" ] || return 1
          zip_file="${RUNNER_TEMP:-/tmp}/$name.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$zip_file" 2>/dev/null || { rm -f "$zip_file"; return 1; }
          mkdir -p "$dest" 2>/dev/null || { rm -f "$zip_file"; return 1; }
          if ! unzip -q -o "$zip_file" -d "$dest" 2>/dev/null; then
            rm -f "$zip_file"
            rm -rf "$dest"
            return 1
          fi
          rm -f "$zip_file"
        }

        # Hilfsfunktion: versucht eine Phase wiederherzustellen (Artefakt laden + validieren).
        # Return 0 bei Erfolg, 1 bei Miss (setzt keine Outputs, nur interne Variablen)
        try_phase() {
          local target_phase="$1"
          fetch_phase_artifact "$target_phase" || return 1

          # sessions.json liegt im Phasen-Ordner (Schema unveraendert: {phase: {session_id, ...}})
          local sessions_file="$archive_dir/$target_phase/sessions.json"
          [ -f "$sessions_file" ] || return 1
          local target_id
          target_id="$(jq -er --arg phase "$target_phase" '.[$phase].session_id // empty' "$sessions_file" 2>/dev/null)" || return 1
          [ -n "$target_id" ] || return 1
          # UUID-Validierung
          [[ "$target_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || return 1

          local target_file="$archive_dir/$target_phase/$target_id.jsonl"
          [ -s "$target_file" ] || return 1

          # Erfolg: setze interne Variablen
          RESOLVED_PHASE="$target_phase"
          RESOLVED_ID="$target_id"
          RESOLVED_FILE="$target_file"
          return 0
        }

        # Zwei-Versuch-Logik: zuerst eigene Phase, dann Fallback
        RESOLVED_PHASE=""
        RESOLVED_ID=""
        RESOLVED_FILE=""

        # 1. Versuche eigene Phase
        if try_phase "$PHASE"; then
          echo "::notice title=Session-Archiv::${ID_TYPE} #$ISSUE Phase $PHASE -- Session $RESOLVED_ID wiederhergestellt (--resume)."
        elif [ -n "$FALLBACK_PHASE" ] && try_phase "$FALLBACK_PHASE"; then
          echo "::notice title=Session-Archiv::${ID_TYPE} #$ISSUE Phase $PHASE -- Fallback auf Vorgaenger-Phase '$FALLBACK_PHASE' mit Session $RESOLVED_ID wiederhergestellt (--resume)."
        else
          miss
        fi

        project_dir="$(claude_project_dir)"
        mkdir -p "$project_dir" 2>/dev/null || miss
        cp "$RESOLVED_FILE" "$project_dir/$RESOLVED_ID.jsonl" 2>/dev/null || miss
        if [ -d "$archive_dir/$RESOLVED_PHASE/$RESOLVED_ID" ]; then
          cp -r "$archive_dir/$RESOLVED_PHASE/$RESOLVED_ID" "$project_dir/$RESOLVED_ID" 2>/dev/null || true
        fi

        {
          echo "resume-arg=--resume $RESOLVED_ID"
          echo "session-id=$RESOLVED_ID"
          echo "restored=true"
          echo "restored-from=$RESOLVED_PHASE"
        } >> "$GITHUB_OUTPUT"
