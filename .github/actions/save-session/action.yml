name: 'Save Hermes Session'
description: 'Session-ID aus Hermes-Output erfassen, packen, hochladen — einheitlich für alle 5 Pipeline-Workflows'

inputs:
  session-artifact-name:
    description: 'Artifact-Name (Output von setup-hermes: hermes-session-issue-<nr>)'
    required: true
  configured:
    description: 'Ob Setup konfiguriert war (Output von setup-hermes)'
    required: true

runs:
  using: composite
  steps:
    - name: Hermes-Session-ID erfassen
      id: session
      shell: bash
      run: |
        if [ -f /tmp/hermes-output.log ]; then
          sid="$(grep '^session_id:' /tmp/hermes-output.log | head -1 | sed 's/^session_id:[[:space:]]*//')"
          if [ -n "$sid" ]; then
            echo "session_id=$sid" >> "$GITHUB_OUTPUT"
            echo "::notice::Hermes Session-ID: $sid"
          fi
        fi

    - name: Session-Archiv packen
      if: ${{ inputs.configured == 'true' && steps.session.outputs.session_id != '' }}
      continue-on-error: true
      shell: bash
      run: |
        SID="${{ steps.session.outputs.session_id }}"
        if [ -n "$SID" ] && [ -d "$HERMES_HOME" ]; then
          echo "$SID" > "$HERMES_HOME/session_id.txt"
          tar -czf /tmp/hermes-session.tar.gz -C "$HERMES_HOME" sessions session_id.txt 2>/dev/null || \
          tar -czf /tmp/hermes-session.tar.gz -C "$HERMES_HOME" session_id.txt
          echo "::notice::Session #$SID gepackt"
        fi

    - name: Session hochladen
      if: ${{ inputs.configured == 'true' && steps.session.outputs.session_id != '' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.session-artifact-name }}
        path: /tmp/hermes-session.tar.gz
        retention-days: 30
        overwrite: true
