name: 🎫 Ticket
description: Aufgabe oder Fehler — strukturiert, damit die KI-Pipeline direkt arbeiten kann
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Kurz und konkret

        Ein Satz pro Feld, ein Punkt pro Zeile. Beschreib was du **siehst** — keine Lösungen,
        keine Hintergrundgeschichten. Die KI ergänzt Kontext selbst.

        **Beispiel für den Unterschied zwischen den Feldern:**

        | Feld | Beispiel |
        |------|----------|
        Was ist das Problem? | Der Speichern-Button im Formular ist auf dem Smartphone so schmal, dass man ihn kaum trifft. |
        Wie soll es sein? | Der Button soll auf Mobilgeräten gut erreichbar sein — über die volle Breite, mindestens 44px hoch. |
        Wo tritt es auf? | Formular „Neue Aufgabe“ auf Android/Chrome |
        Woran messen wir das? | - Bei 375px Breite ist der Button 44px hoch und füllt die Formularbreite<br>- Der Button ist per Tastatur bedienbar (Tab-Index) |

  - type: textarea
    id: problem
    attributes:
      label: Was ist das Problem?
      description: Beobachtetes Verhalten in einem Satz. Was passiert, wo, für wen?
      placeholder: Auf dem Smartphone ist der Speichern-Button im Formular X so schmal, dass man ihn kaum trifft.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Wo tritt es auf?
      description: Ein Ort pro Zeile — Seite, Komponente, Datei oder Endpunkt, sofern bekannt.
      placeholder: |
        frontend/src/components/TicketForm.tsx
        Einstellungen → Push-Benachrichtigungen
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Wie soll es sein?
      description: Erwartetes Verhalten — beschreibend, vom außen beobachtbar, nicht als technische Lösung.
      placeholder: Der Button ist auf Mobil mindestens 44px hoch und über die volle Breite erreichbar.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Thema (optional)
      description: Welcher Bereich? Hilft der KI-Pipeline bei der Einordnung.
      options:
        - UX/UI
        - Feature
        - Test
        - Logik
        - Performance
        - Security
        - Documentation
        - Infrastructure
        - Other
    validations:
      required: false

  - type: dropdown
    id: complexity
    attributes:
      label: Komplexität (optional)
      description: Schätzung — hilft der Pipeline bei der Planung. Nur wenn du einschätzen kannst.
      options:
        - Einfach (klar definiert, isolierte Änderung)
        - Mittel (benötigt etwas Analyse oder mehrere Dateien)
        - Komplex (viele betroffene Dateien oder unsicheres Gebiet)
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Wo tritt es auf?
      description: Ein Ort pro Zeile — Seite, Komponente, Datei oder Endpunkt, sofern bekannt.
      placeholder: |
        frontend/src/components/TicketForm.tsx
        Einstellungen → Push-Benachrichtigungen
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Woran messen wir das?
      description: Mindestens ein prüfbarer Punkt pro Zeile (mit Bindestrich `-` beginnen). Was ist nach dem Fix **konkret anders**?
      placeholder: |
        - Bei 375px Breite ist der Button 44px hoch
        - Der Button füllt die Formularbreite aus
        - Der Button ist per Tastatur bedienbar (Tab-Index)
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Screenshots / weitere Hinweise (optional)
      description: Was immer hilft — optional, gern leer lassen.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Screenshots / weitere Hinweise (optional)
      description: Was immer hilft — optional, gern leer lassen.
    validations:
      required: false
