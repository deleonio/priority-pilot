name: Track Costs

# Sammelt die Kosten-Artefakte EINES Tickets ein und schreibt sie als eine Tabelle in die
# Job-Summary.
#
# WARUM ES DIESEN WORKFLOW BRAUCHT: `.github/actions/record-cost` schreibt bewusst NICHT nach
# `.costs/` im Repo — sechs Phasen × parallele Tickets, die alle auf denselben Ordner
# committen, erzeugen Konflikte auf main. Jeder Phasen-Lauf lädt seinen Datensatz stattdessen
# als eigenes Artefakt hoch. Die Zahlen sind damit vollständig, aber über N Artefakte
# verstreut, und die Job-Summary eines Laufs zeigt nur ihre eigene Phase. Für die Baseline aus
# ADR-0004 („erst messen, dann umbauen") braucht es die Zusammenschau — genau die liefert
# dieser Lauf, ohne den Default-Branch anzufassen. Der Kopf von record-cost verweist auf
# diesen Weg („wer dauerhaft sammeln will, aggregiert die Artefakte bewusst in einem eigenen
# Lauf").
#
# WARUM ÜBER DIE API STATT `actions/download-artifact`: Diese Action lädt nur Artefakte des
# EIGENEN Laufs. Die Kosten-Artefakte liegen aber in den Phasen-Läufen, also repository-weit —
# dafür gibt es keinen Action-Weg, nur die Artefakt-API.
#
# NUR MANUELL: Es gibt keinen sinnvollen automatischen Auslöser. Ein Ticket ist erst nach dem
# Merge fertig gemessen, und wann jemand die Zahlen braucht, weiss nur der Mensch. Ein
# schedule würde bloss Läufe verbrennen.
#
# NUR LESEND: Der Workflow schreibt nichts nach GitHub — kein Label, kein Kommentar, kein
# Commit. Deshalb genügt das GITHUB_TOKEN mit `actions: read`; ein App-Token ist nicht nötig
# (und wäre hier zusätzliche Angriffsfläche ohne Gegenwert).

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Ticket-Nummer, deren Kosten zusammengefasst werden sollen (z. B. 912)'
        required: true
        type: string

concurrency:
  group: cost-baseline-${{ github.event.inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: read # Skript auschecken
  actions: read # Artefakte der Phasen-Läufe lesen

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Ticket-Nummer prüfen
        id: input
        env:
          ISSUE: ${{ github.event.inputs.issue }}
        run: |
          set -euo pipefail
          # Der Wert fliesst in einen Artefaktnamen-Filter und in Dateipfade. Auf Ziffern
          # begrenzen, damit weder Filter noch Pfad manipulierbar sind.
          if ! printf '%s' "$ISSUE" | grep -Eq '^[0-9]+$'; then
            echo "::error title=Ungültige Ticket-Nummer::'${ISSUE}' ist keine reine Zahl."
            exit 1
          fi
          echo "issue=${ISSUE}" >> "$GITHUB_OUTPUT"

      - name: Kosten-Artefakte des Tickets holen
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.input.outputs.issue }}
        run: |
          set -uo pipefail
          # Gemeinsamer Helfer mit seal-costs.sh (eine Schleife, eine Fehlerbehandlung).
          # Ein fehlgeschlagener Listen-Abruf (Exit 3) ist ein FEHLER dieses Jobs, keine
          # Aussage über das Ticket — vorher ging er als „Keine Artefakte" grün durch und
          # war von „nie gemessen" nicht zu unterscheiden.
          if ! FETCH="$(.github/scripts/fetch-cost-artifacts.sh --repo "$REPO" --issue "$ISSUE" --dest /tmp/costs)"; then
            printf '%s\n' "$FETCH"
            echo "::error title=Artefakt-Liste::Abruf für Ticket #${ISSUE} fehlgeschlagen — Bericht nicht möglich."
            exit 1
          fi
          printf '%s\n' "$FETCH"
          count="$(printf '%s' "$FETCH" | sed -n 's/^count=\([0-9]*\).*/\1/p' | tail -1)"
          failed="$(printf '%s' "$FETCH" | sed -n 's/.*failed=\([0-9]*\)$/\1/p' | tail -1)"
          if [ "${count:-0}" = "0" ] && [ "${failed:-0}" = "0" ]; then
            # Kein Fehler, sondern eine AUSSAGE über das Ticket: nie gemessen, oder die
            # Artefakte sind älter als ihre 90 Tage. Der Bericht sagt das gleich im Klartext;
            # ein roter Job würde nur verschleiern, dass die Frage beantwortet ist.
            echo "::notice title=Keine Artefakte::Für Ticket #${ISSUE} wurden keine Kosten-Artefakte gefunden."
            exit 0
          fi
          echo "::notice title=Artefakte geladen::${count} Kosten-Artefakt(e) für Ticket #${ISSUE} (${failed} übersprungen)."

      - name: Bericht bauen
        env:
          ISSUE: ${{ steps.input.outputs.issue }}
        run: |
          set -uo pipefail
          # Bewusst `node` statt `pnpm exec tsx`: Dieser Job richtet kein pnpm ein, und das
          # Skript nutzt ausschliesslich löschbare TypeScript-Syntax (gleiche Begründung wie
          # in record-cost).
          node .github/scripts/cost-aggregate.ts --issue "$ISSUE" --dir /tmp/costs \
            | tee -a "$GITHUB_STEP_SUMMARY"
