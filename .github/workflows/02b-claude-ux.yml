name: 2b/6 UX-Review

# UX/UI-Review als automatisierte Phase ZWISCHEN Spec (2a) und Umsetzung (3): der Spec-Branch mit
# den roten Tests existiert bereits, die Umsetzung hat noch nicht begonnen — genau hier kostet eine
# UX-Anforderung am wenigsten.
#
# Führt Prompt ux.md aus: schreibt prüfbare UX-Anforderungen zwischen <!-- KI-UX:START --> und
# <!-- KI-UX:END --> in den Issue-Body UND erweitert den ausführbaren Vertrag im Spec-Branch
# (rote e2e-Tests bei 375px, Fixes gegen die Design-Sprache .ai-knowledge/ux-design.md).
# Setzt Label ai:ready nach Verdict-Verifikation und gibt damit die Umsetzung frei.
#
# CONCURRENCY: Statische Gruppe pro Phase (globale Serialisierung, FIFO).

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue-Nummer'
        required: true
        type: string

concurrency:
  group: claude-ux
  cancel-in-progress: false
  queue: max

jobs:
  precheck:
    # Bei workflow_dispatch immer laufen, sonst nur bei Label ux:ready (von der Spec-Phase gesetzt).
    # Vorher triggerte diese Phase auf ai:spec-ready und lief damit PARALLEL zur Spec — der Reviewer
    # sah die roten Tests nie, die er ergänzen soll.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'ux:ready' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      issue_number: ${{ steps.issue.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Issue-Nummer ermitteln
        id: issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Label-Pre-Check (ux:ready muss vorhanden sein)
        id: check
        if: ${{ github.event_name == 'issues' }}
        uses: ./.github/actions/check-phase-label
        with:
          phase: ux
          ticket: ${{ steps.issue.outputs.number }}

      - name: Für workflow_dispatch immer proceed=true
        id: check-dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "proceed=true" >> "$GITHUB_OUTPUT"

  ux:
    needs: precheck
    if: >-
      ${{ always()
          && (needs.precheck.outputs.proceed == 'true' || needs.precheck.result == 'failure') }}
    runs-on: ubuntu-latest
    # 40 statt 30 Minuten: die Phase schreibt jetzt auch Tests und Fixes, nicht nur Text.
    timeout-minutes: 40
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    permissions:
      # contents: write — der Reviewer committet e2e-Tests und Fixes in den Spec-Branch.
      # pull-requests: write — Kommentar/Body-Pflege am Spec-PR.
      contents: write
      pull-requests: write
      id-token: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Startzeit merken
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          # 1800s (30 min) statt 840s: die Phase schreibt jetzt Tests und Fixes; 10 min Rest bleiben
          # innerhalb von timeout-minutes: 40 für Label-Assertion und Zusammenfassung.
          echo "soft_deadline_epoch=$((now + 1800))" >> "$GITHUB_OUTPUT"

      - name: Setup Claude Code (mit Memory-Load)
        id: setup
        uses: ./.github/actions/setup-claude
        with:
          # true: der KoliBri-Berater braucht mcp__kolibri-mcp__* für die Komponentenwahl.
          needs-mcp: true
          tools-tier: full
          event-type: ${{ github.event_name }}
          ticket-ref: ${{ needs.precheck.outputs.issue_number }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          # CLAUDE_MODEL_UX ist in docs/ci-architecture.md als Variable dieser Phase dokumentiert;
          # der Workflow griff bisher auf die Spec-Variable zu.
          model: ${{ vars.CLAUDE_MODEL_UX || 'sonnet' }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          zai-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}
          openrouter-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          tailscale-exit-node: ${{ vars.TAILSCALE_EXIT_NODE }}
          memory-load: 'true'
          expect-memory: 'false'

      - name: pnpm einrichten
        if: steps.setup.outputs.configured == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Node.js einrichten
        if: steps.setup.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Abhängigkeiten installieren
        if: steps.setup.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Git-Hooks installieren (lefthook)
        if: steps.setup.outputs.configured == 'true'
        run: pnpm exec lefthook install

      - name: UX-Review via Claude
        id: claude
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ needs.precheck.outputs.issue_number }}
        run: |
          # Zwei Ausdrücke: erst die "#ISSUE_NR"-Form, dann die nackte "ISSUE_NR"-Form (in
          # Befehlszeilen wie `gh issue view ISSUE_NR`). Ohne den zweiten blieb der Platzhalter
          # dort wörtlich stehen.
          sed -e "s/#ISSUE_NR/${{ needs.precheck.outputs.issue_number }}/g" \
              -e "s/ISSUE_NR/${{ needs.precheck.outputs.issue_number }}/g" \
              -e "s/SOFT_DEADLINE/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" \
              .github/prompts/ux.md > /tmp/claude-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Memory-Upload
        if: always() && steps.setup.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.setup.outputs.memory-save-key }}
          path: ${{ steps.setup.outputs.memory-path }}
          retention-days: 14
          if-no-files-found: ignore

      - name: Label-Post-Assertion (VERDICT parsen, ai:ready setzen)
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ needs.precheck.outputs.issue_number }}
        run: |
          verdict=""
          if [ -f /tmp/claude-output.log ]; then
            verdict="$(grep 'VERDICT:' /tmp/claude-output.log | tail -1 | sed -E 's/^.*VERDICT:[[:space:]]*//' | tr -d -c 'A-Za-z0-9-' || true)"
          fi
          echo "Claude-Verdict aus Output: '${verdict:-keins}'"

          gh label create "ai:ready" --repo "$GITHUB_REPOSITORY" --color 0E8A16 2>/dev/null || true
          gh label create "ux:failed" --repo "$GITHUB_REPOSITORY" --color d73a49 2>/dev/null || true

          # ux:ready bleibt STEHEN: das Laufzeit-Gate der Umsetzung (check-phase-label.sh, Phase
          # implement) verlangt ai:ready + ai:analyzed + ux:ready. Ein Entfernen würde die
          # Umsetzung sofort wieder blockieren.
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:spec-ready" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ux:failed" 2>/dev/null || true

          if [ "$verdict" = "ux-ready" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:ready"
            echo "::notice::Label gesetzt: ai:ready (UX-Review durch, Umsetzung freigegeben)"
          elif [ "$verdict" = "ux-not-ready" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ux:failed"
            echo "::notice::Label gesetzt: ux:failed (Umsetzung bleibt blockiert)"
          else
            echo "::warning::Kein VERDICT im Output – kein Label gesetzt"
          fi

      - name: Ergebnis zusammenfassen
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ needs.precheck.outputs.issue_number }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ UX-Review erfolgreich::Issue #${ISSUE}"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ UX-Review abgebrochen"
          else
            echo "::error title=❌ UX-Review fehlgeschlagen"
          fi
          {
            echo "### UX-Review #${ISSUE} – fertig"
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Labels: ${labels:-keine}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🩺 Z.AI Fair-Usage-Check (1313)
        if: always()
        uses: ./.github/actions/llm-fair-usage-check
