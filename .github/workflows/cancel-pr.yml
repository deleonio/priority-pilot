name: Cancel PR

# Bricht laufende UND wartende Kreuzverhoer-Review- und Fixup-Laeufe eines PRs ab, sobald er
# gemergt oder geschlossen wird. Noetig, weil die Concurrency-Gruppen (statisch pro Phase:
# claude-pr-review bzw. claude-pr-fixup, cancel-in-progress: false) die Laeufe nur serialisieren
# (warten statt abbrechen) und beim Schliessen/Mergen kein neuer Lauf startet, der etwas
# abbrechen koennte — ein gerade laufender oder eingereihter Review/Fixup wuerde sonst sinnlos
# weiterlaufen (und ggf. auf einen gemergten PR posten). Mit der globalen Serialisierung wird
# dieses Cancel wichtiger, nicht weniger: eingereihte Laeufe anderer PRs duerfen nicht durch
# einen geschlossenen PR verbraucht werden.
#
# Reiner gh-Aufruf (kein KI-Agent), nutzt den GitHub-App-Token (alle Claude-Workflows nutzen
# konsistent den App-Token statt des Standard-GITHUB_TOKEN).

on:
  pull_request:
    types: [closed]

permissions:
  actions: write # laufende Workflow-Runs abbrechen

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Voraussetzung prüfen (GitHub-App-Secrets)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::GitHub-App-Secrets fehlen — Lauf wird übersprungen. GitHub App anlegen (Actions = Read and write), aufs Repo installieren und beide Werte als Repo-Secrets (APP_ID + APP_PRIVATE_KEY) hinterlegen."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: GH_TOKEN-Fallback setzen (App-Token oder GITHUB_TOKEN)
        id: gh-token
        run: |
          APP_TOK="${{ steps.app-token.outputs.token }}"
          if [ -n "$APP_TOK" ] && [ "$APP_TOK" != "null" ]; then
            echo "token=$APP_TOK" >> "$GITHUB_OUTPUT"
            echo "::notice::Nutze GitHub-App-Token für gh-Befehle."
          else
            echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
            echo "::warning::App-Token nicht verfügbar — nutze GITHUB_TOKEN (Achtung: Label-Wechsel lösen ggf. keine Folge-Workflows aus)."
          fi

      - name: Laufende Review-/Fixup-Runs des PR-Branches abbrechen
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # 04-claude-implement.yml bedient seit ADR-0005 auch die Nacharbeit am PR
          # (früher 06-claude-pr-fixup.yml). Der Branch-Filter trennt die beiden Eingänge
          # zuverlässig: Läufe des Issue-Eingangs hängen am Default-Branch, nie am
          # PR-Head-Branch — es werden also weiterhin nur PR-Läufe abgebrochen.
          for wf in 05-review.yml 04-implement.yml; do
            gh run list --repo "$REPO" --workflow "$wf" --branch "$HEAD_REF" \
              --json databaseId,status \
              --jq '.[] | select(.status=="in_progress" or .status=="queued") | .databaseId' \
              | while read -r id; do
                  echo "Breche Run $id ($wf) ab"
                  gh run cancel --repo "$REPO" "$id" || true
                done
          done
