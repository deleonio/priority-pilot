name: Spec-Sync (nightly)

# Nächtlicher LLM-Job (wie die Phasen 01–06 über setup-claude, aber KEINE Pipeline-Phase):
# Verifiziert die Specs in docs/spec/ (user-journeys.md + issue-*.md) gegen die tatsächliche
# Implementation (frontend/src, server/src, openapi.yml) und hält sie auf IST-STAND —
# die Implementation ist die Wahrheit, die Spec spiegelt sie nur. Leitlinie arc42-Prinzip:
# so viel wie nötig, so wenig wie möglich — nur langfristig relevantes Verhalten bleibt Spec:
#   - korrigieren (Impl hat sich geändert → Spec folgt),
#   - entsorgen (einzelne Aussagen wie ganze Dateien: überholte/transitorische Soll-Aussagen
#     wie „X soll entfernt sein“ sind langfristig keine Spec-Information; ganze Dateien ohne
#     langfristigen Spec-Wert — Test-Protokolle, Validierungs-Platzhalter, vollständig
#     redundant abgebildete Journeys — werden gelöscht),
#   - ergänzen (implementiertes, un-spezifiziertes Verhalten bekommt neue Journeys).
#
# DELIVERY: pro geänderter Spec-Datei EIN PR (Non-Draft) vom Branch chore/spec-sync/<datei-stem>
# mit direktem ai:needs-review-Label per App-Token → Kreuzverhör-Review (04) startet automatisch.
# Der Agent arbeitet lokal auf chore/spec-sync-work (nie gepusht); die Mechanik überträgt je
# geänderter Datei den finalen Stand auf einen eigenen Branch — unabhängig davon, wie der
# Agent committet hat (Diff-basiert, nicht Commit-basiert). Das Label wird direkt nach PR-Create
# per App-Token gesetzt (Autolabeler greift bei Bots nicht) → labeled-Event feuert → 04-Review
# und Fixup-Loop (05) übernehmen Prüfung und Nacharbeit automatisch. Für eine Datei mit bereits
# offenem Sync-PR wird kein zweiter erzeugt (Skip mit Notice) — neue Drift derselben Datei
# folgt nach dessen Merge.
#
# STATELESS: kein pro-Issue-Memory (memory-load/expect false, kein Artefakt-Upload). Die
# offenen Draft-PRs sind der einzige Zustand; jede Nacht wird frisch verifiziert.
#
# KEINE Nummer im Dateinamen: Nummern (01–06) sind lastend (Workflow-Name-Matching), dieser
# Job ist ein Helper wie cache-cleanup und hängt nicht in der Label-Kette.

on:
  schedule:
    - cron: '37 3 * * *' # täglich 03:37 UTC, versetzt zu Cache-Aufräumen (03:17) und Renovate (Mo 04:00)
  workflow_dispatch:
    inputs:
      force:
        description: 'Skip-Guard ignorieren (Lauf erzwingen, auch wenn main unverändert ist)'
        type: boolean
        default: false

concurrency:
  group: claude-spec-sync
  cancel-in-progress: false

permissions:
  contents: write # Branch-Pushes chore/spec-sync/*
  pull-requests: write # Draft-PRs anlegen
  id-token: write # App-Token (setup-claude)
  actions: read # Skip-Guard: letzte erfolgreiche Run-Historie lesen

jobs:
  spec-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Skip-Guard (main unverändert seit letztem erfolgreichen Sync)
        # LLM-Budget sparen: Hat main seit dem letzten erfolgreichen Lauf dieses Workflows
        # denselben SHA, ist das Verifikationsergebnis deterministisch dasselbe → kein Lauf.
        # Fail-open bei API-Fehlern (leerer last_sha → Lauf): ein vergessener Sync ist
        # billiger als ein stumm übersprungener. workflow_dispatch mit force=true umgeht
        # den Guard (Re-Sync ohne Code-Änderung, z. B. nach Prompt-Anpassung).
        id: guard
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force == true) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last_sha="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow claude-spec-sync.yml \
            --status success --limit 1 --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)"
          if [ -n "$last_sha" ] && [ "$last_sha" = "$GITHUB_SHA" ]; then
            echo "::notice title=⏭️ Spec-Sync übersprungen::Main unverändert ($GITHUB_SHA) seit letztem erfolgreichen Sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Startzeit merken (für weiches Zeitlimit)
        id: starttime
        if: steps.guard.outputs.skip != 'true'
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          # 20 min weich (Ziel: ALLE Spec-Dateien schaffen) vs. 30 min hart — Restpuffer für Post-Steps.
          echo "soft_deadline_epoch=$((now + 1200))" >> "$GITHUB_OUTPUT"

      - name: Setup Claude Code
        id: setup
        if: steps.guard.outputs.skip != 'true'
        uses: ./.github/actions/setup-claude
        with:
          needs-mcp: false
          tools-tier: full # Write/Edit auf docs/spec + git commit nötig; Push/PR macht der Workflow
          event-type: ${{ github.event_name }}
          # ticket-ref ist Pflicht-Input, dieser Job hat kein Ticket: '0' fließt NUR in den
          # ungenutzten Memory-Key (claude-memory-issue-0) — Memory ist komplett aus.
          ticket-ref: '0'
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          model: ${{ vars.CLAUDE_MODEL_SPEC_SYNC || 'sonnet' }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          zai-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}
          openrouter-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          tailscale-exit-node: ${{ vars.TAILSCALE_EXIT_NODE }}
          memory-load: 'false'
          expect-memory: 'false'

      - name: Arbeits-Branch frisch aufsetzen (Basis = origin/main, wird NIE gepusht) + Git-Identität
        # Lokale Werkbank des Agenten; die Delivery-Branches chore/spec-sync/<stem> entstehen
        # erst im Post-Step diff-basiert daraus. Git-Identität aus dem App-Slug (Muster
        # deploy.yml) — deterministische Attribution der Agent-Commits statt runner-abhängiger
        # Default-Identität.
        if: steps.guard.outputs.skip != 'true' && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
        run: |
          git branch -D chore/spec-sync-work 2>/dev/null || true
          git switch -C chore/spec-sync-work origin/main
          slug="$(gh api app --jq .slug 2>/dev/null || true)"
          user="${slug:-app}[bot]"
          id="$(gh api "users/${user}%5Bbot%5D" --jq .id 2>/dev/null || true)"
          email="${user}@users.noreply.github.com"
          [ -n "$id" ] && email="${id}+${user}@users.noreply.github.com"
          git config user.name "$user"
          git config user.email "$email"

      - name: Spec-Sync via Claude
        id: claude
        if: steps.guard.outputs.skip != 'true' && steps.setup.outputs.configured == 'true'
        run: |
          cat > /tmp/claude-prompt.txt << 'CLAUDE_EOF'
          FOKUS: Spec-Sync docs/spec/ gegen die Implementation. DIE IMPLEMENTATION IST DIE WAHRHEIT — die Spec beschreibt NUR den Ist-Zustand. KEINE Abstecher, KEINE Code-Änderungen. Token sparen: kurz, präzise, direkt.

          LEITLINIE (arc42-Prinzip): SO VIEL WIE NÖTIG, SO WENIG WIE MÖGLICH. Specs halten nur langfristig relevantes, von außen sichtbares Verhalten fest — alles andere (Transitorisches, Erledigtes, Redundantes) ist Ballast und fliegt raus. Ein Datensatz, eine Wahrheit.

          QUELLEN (liest selbst, nicht im Prompt wiederholen):
            - Specs: alle Dateien unter docs/spec/ (user-journeys.md + issue-*.md)
            - Ist-Zustand: frontend/src/** (UI-Verhalten, Dialoge, Meldungstexte), server/src/** + openapi.yml (API, Validierung, Fehlermeldungen)

          ABLAUF (STRIKT):
            1. SOFORT starten. Alle Dateien unter docs/spec/ vollständig lesen.
            2. DATEI-TRIAGE (billig zuerst): JEDE Datei auf langfristigen Spec-Wert prüfen. GANZE DATEI ENTFERNEN, wenn
               a) sie per Art kein Spec-Wert ist (manuelle Test-Protokolle, Validierungs-Platzhalter, Soll-/Arbeits-Stände zu abgeschlossenen Tickets), oder
               b) ihr Inhalt vollständig in anderen Spec-Dateien abgebildet ist → Redundanz an EINER Stelle halten (dort konsolidieren, Rest löschen).
            3. JEDE verhaltensrelevante Aussage (Journey-Schritte, erwartete Ergebnisse, Randfall-Tabellen, Meldungstexte) der verbleibenden Dateien gegen den Code verifizieren. ZIEL: ALLE Dateien schaffen.
            4. NUR bei belegtem Befund die Spec anpassen — jede Operation gilt für Textpassagen UND, wo zutreffend, ganze Dateien:
               a) AKTUALISIEREN: Passage (oder ganze Datei) auf den neuen Ist-Zustand umformulieren.
               b) ENTFERNEN: Passage ohne langfristigen Spec-Wert streichen — insb. transitorische Soll-Aussagen („X soll entfernt werden“, Ankündigungen, Absichten, Ticket-Historie). Ganze Dateien: siehe DATEI-TRIAGE.
               c) ERGÄNZEN: implementiertes Verhalten, das in KEINER Spec steht → neue Journey in der passenden Datei; nur bei eigenständig abgrenzbarem Verhaltenbereich eine NEUE DATEI (Format wie user-journeys.md: Ziel/Vorbedingung/Schritte/Erwartetes Ergebnis; implementierungsagnostisch, nur von außen beobachtbares Verhalten).
            5. Je geänderter/neuer Datei: „**Stand:**“-Datum auf SYNC_DATE setzen + eine Versionszeile ergänzen (vX.Y (SYNC_DATE): Nightly-Sync — <Kurzbegründung>).
            6. ALLE Änderungen lokal committen (ein Commit genügt): git add docs/spec && git commit -m "docs(spec): Ist-Stand-Sync SYNC_DATE"
               NICHT pushen, KEINE PRs anlegen — das macht der Workflow nach dir (pro Datei ein PR mit ai:needs-review).
            7. Report schreiben nach /tmp/spec-sync-report.md (Markdown), STRENG nach Datei gegliedert — der Workflow baut daraus die PR-Beschreibungen:
               - Pro betroffener Datei ein Abschnitt mit Überschrift „## <dateiname>“ (exakt der Dateiname, z. B. „## user-journeys.md“): darunter je Fund (Abschnitt, Befund, Korrektur — auch entfernte Dateien mit Begründung).
               - Am Ende ein Abschnitt „## Nicht verifiziert“: Dateien, die du nicht mehr geschafft hast (leer lassen, wenn alle geschafft).
               - Danach ein Abschnitt „## Offene Unklarheiten“: nicht aus Code Ableitbares — NICHT geändert, nur gelistet.

          CONSTRAINTS:
            - NUR innerhalb docs/spec/ Dateien ändern oder LÖSCHEN — kein Code, keine anderen Dateien.
            - Konsolidieren/Umbenennen nur bei belegter Redundanz, sonst keine Umstrukturierung.
            - KEINE Spekulation: nur belegbares, im Code sichtbares Verhalten spezifizieren.
            - KEINE Soll-/Absichts-Formulierungen in der Spec — nur Ist.

          VERDICT: GANZ AM ENDE GENAU EINE Zeile:
            - VERDICT: synced (keine Drift gefunden, kein Commit)
            - VERDICT: updated (Spec-Korrekturen committed)

          EHRLICHKEITS-REGEL: VERDICT: updated NUR ausgeben, wenn der Commit existiert (git log verifizieren). VERDICT: synced NUR ohne lokale Commits.

          ZEITLIMIT: Soft-Deadline = SOFT_DEADLINE. Vor jedem Schritt: [ $(date +%s) -ge SOFT_DEADLINE ]. Bei OVER: committen was vorliegt, Report schreiben, Turn beenden.
          CLAUDE_EOF

          sed -i "s/SYNC_DATE/$(date -u +%F)/g" /tmp/claude-prompt.txt
          sed -i "s/SOFT_DEADLINE/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/claude-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Post-Assertion (VERDICT ↔ Commits ↔ Scope) + Per-Datei-PRs mit Label
        id: deliver
        # Ehrlichkeits-Kreuzcheck nach dem VERDICT-Muster der Phasen-Workflows: Der Agent
        # behauptet synced/updated — die Mechanik verifiziert Commits und Datei-Scope und
        # baut daraus deterministisch EINEN DRAFT-PR PRO geänderter Spec-Datei (Push/PR ist
        # bewusst KEINE Agent-Aufgabe). Diff-basiert vom finalen Datei-Stand des Agent-Branches,
        # unabhängig von dessen Commit-Aufteilung. Bereits offener Sync-PR zur selben Datei
        # → Skip (keine Duplikate); Freigabe + Pipeline-Review übernimmt der Mensch per
        # „Ready for review“ (pr-needs-review-label.yml → 04/05-Loop).
        if: >-
          ${{ always()
              && steps.guard.outputs.skip != 'true'
              && steps.setup.outputs.configured == 'true'
              && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          # Portables VERDICT-Parsen wie in 01 (BSD/GNU-grep-sicher, Markdown-Dekoration strippen).
          verdict=""
          if [ -f /tmp/claude-output.log ]; then
            verdict="$(grep 'VERDICT:' /tmp/claude-output.log | tail -1 | sed -E 's/^.*VERDICT:[[:space:]]*//' | tr -d -c 'A-Za-z0-9-' || true)"
          fi
          echo "Claude-Verdict aus Output: '${verdict:-keins}'"

          if [ "$OUTCOME" != "success" ]; then
            echo "::error title=❌ Spec-Sync fehlgeschlagen::Claude-Lauf nicht erfolgreich — kein stiller „synced“."
            exit 1
          fi
          if [ "$verdict" != "synced" ] && [ "$verdict" != "updated" ]; then
            echo "::error title=❌ Spec-Sync ohne Verdict::Weder „synced“ noch „updated“ — Lauf wiederholen."
            exit 1
          fi

          count="$(git rev-list --count origin/main..HEAD)"
          echo "Commits seit origin/main: $count"

          # Scope-Guard: nur docs/spec/ ist erlaubt.
          bad="$(git diff --name-only origin/main..HEAD | grep -v '^docs/spec/' || true)"
          if [ -n "$bad" ]; then
            echo "::error title=❌ Scope verletzt::Änderungen außerhalb docs/spec/: ${bad}"
            exit 1
          fi

          # Verdict ↔ Commits konsistent?
          if [ "$verdict" = "updated" ] && [ "$count" -eq 0 ]; then
            echo "::error title=❌ Verdict ohne Commits::VERDICT updated, aber kein Commit vorhanden."
            exit 1
          fi
          if [ "$verdict" = "synced" ] && [ "$count" -gt 0 ]; then
            echo "::error title=❌ Commits ohne Verdict::VERDICT synced, aber Commits vorhanden."
            exit 1
          fi

          if [ "$count" -eq 0 ]; then
            echo "::notice title=✅ Spec am Ist-Stand::Keine Drift gefunden — kein Push, kein PR."
            exit 0
          fi

          # Report Fallback: fehlt/leer der Agent-Report, ersetzt git log die Fund-Abschnitte
          # (laut Warning; die Per-Datei-Bodys fallen dann auf den Kopfhinweis zurück).
          if [ ! -s /tmp/spec-sync-report.md ]; then
            echo "::warning title=⚠️ Report fehlt::/tmp/spec-sync-report.md fehlt — Fallback aus git log."
            {
              echo "## Spec-Sync $(date -u +%F)"
              echo ""
              echo "_Agent-Report fehlt — Fallback aus der Commit-Historie._"
              echo ""
              git log origin/main..HEAD --oneline --stat
            } > /tmp/spec-sync-report.md
          fi

          # Label-Create-Guard: einmalig vor der Schleife, da gh bei fehlendem Label hart crasht
          gh label create "ai:needs-review" --color 1D76DB --description "PR wartet auf KI-Review" || true

          # Per-Datei-PRs: finaler Datei-Stand vom Agent-Branch auf eigene Branches + Non-Draft-PR mit Label.
          sync_date="$(date -u +%F)"
          created=0
          skipped=0
          for f in $(git diff --name-only origin/main..chore/spec-sync-work); do
            stem="$(basename "$f" .md)"
            branch="chore/spec-sync/$stem"
            existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open \
              --json number --jq '.[0].number // empty' 2>/dev/null || true)"
            if [ -n "$existing" ]; then
              echo "::notice title=⏭️ Sync-PR offen::#$existing für $f — Datei übersprungen (neue Drift folgt nach Merge)."
              skipped=$((skipped + 1))
              continue
            fi

            git switch -C "$branch" origin/main
            if git cat-file -e "chore/spec-sync-work:$f" 2>/dev/null; then
              git restore --source=chore/spec-sync-work -- "$f"
              git add "$f"
              title="docs(spec): $stem — Ist-Stand-Sync $sync_date"
            else
              git rm -q "$f"
              title="docs(spec): $stem entfernen — Ist-Stand-Sync $sync_date"
            fi
            git commit -m "$title"
            git push --force origin "$branch"

            # PR-Body: „## <dateiname>“-Abschnitt aus dem Agent-Report, Fallback = Kopfhinweis.
            {
              echo "Nächtlicher Spec-Sync ($sync_date) — betrifft nur \`$f\`."
              echo ""
              echo "**Pipeline:** Kreuzverhör-Review (04) und Fixup (05) laufen automatisch nach diesem PR."
              echo ""
              awk -v file="## $f" 'found && /^## /{exit} $0==file{found=1;next} found' /tmp/spec-sync-report.md
            } > /tmp/spec-sync-pr-body.md

            # PR-Create (ohne --draft) → PR-Nummer aus der URL (wie Guide-Sync; gh pr create kennt kein --json)
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base main \
              --title "$title" --body-file /tmp/spec-sync-pr-body.md)"
            pr_number="$(printf '%s\n' "$pr_url" | sed -nE 's#.*/pull/([0-9]+).*#\1#p' | tail -1)"

            # Label-Setzen mit Retry (3 Versuche) → bei endgültigem Fehlschlag laut Error + Exit
            if [ -n "$pr_number" ]; then
              retry=0
              while [ $retry -lt 3 ]; do
                if gh pr edit "$pr_number" --add-label "ai:needs-review" 2>/dev/null; then
                  break
                else
                  retry=$((retry + 1))
                  if [ $retry -ge 3 ]; then
                    echo "::error title=❌ Label-Setzen fehlgeschlagen::PR #$pr_number erstellt, aber ai:needs-review konnte nicht gesetzt werden."
                    exit 1
                  fi
                  sleep 1
                fi
              done
            else
              echo "::error title=❌ PR-Create fehlgeschlagen::PR konnte nicht erstellt werden."
              exit 1
            fi
            created=$((created + 1))
            git switch chore/spec-sync-work
          done
          echo "::notice title=✅ Sync-PRs::${created} erstellt, ${skipped} übersprungen (offene PRs)."
          echo "created=$created" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"

      - name: Ergebnis zusammenfassen
        if: ${{ always() && steps.guard.outputs.skip != 'true' && steps.setup.outputs.configured == 'true' }}
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          OUTCOME: ${{ steps.claude.outcome }}
          CREATED: ${{ steps.deliver.outputs.created }}
          SKIPPED: ${{ steps.deliver.outputs.skipped }}
        run: |
          count="$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)"
          sync_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("chore/spec-sync/")) | .number] | join(", ")' 2>/dev/null || true)"
          {
            echo "### Spec-Sync – fertig"
            echo ""
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Agent-Commits: ${count}"
            echo "- PRs erstellt: \`${CREATED:-0}\`, übersprungen: \`${SKIPPED:-0}\`"
            echo "- Offene Sync-PRs: ${sync_prs:-keine}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🩺 Z.AI Fair-Usage-Check (1313)
        # Rohausgabe des Claude-Laufs auf z.ai-Fehler 1313 (Fair Usage) durchsuchen
        # und Ergebnis als Annotation + Job-Summary sichtbar machen.
        if: always()
        uses: ./.github/actions/llm-fair-usage-check
