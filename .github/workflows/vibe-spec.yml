name: Mistral Vibe Spec (ai:spec-ready)

# Schreibt die ROTEN Tests (ausführbarer Vertrag) für ein Issue, sobald es
# das Label "ai:spec-ready" erhält UND bereits "ai:analyzed" trägt UND "ai:use-mistral".
#
# Setzt Mistral Vibe Coding Agent über die Mistral API ein.
# Voraussetzung: Repo-Secret MISTRAL_API_KEY (https://console.mistral.ai/)

on:
  issues:
    types: [labeled]

concurrency:
  group: vibe-spec-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  spec:
    if: >-
      ${{ github.event.label.name == 'ai:spec-ready'
          && contains(github.event.issue.labels.*.name, 'ai:analyzed')
          && contains(github.event.issue.labels.*.name, 'ai:use-mistral')
          && github.event.issue.state == 'open' }}
    runs-on: ubuntu-latest
    env:
      VIBE_HOME: /tmp/vibe-ci
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: write
      issues: write
    steps:
      - name: Startzeit merken (für Timeout-Erkennung + weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 840))" >> "$GITHUB_OUTPUT"

      - name: Voraussetzung prüfen (GitHub-App-Secrets)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::GitHub-App-Secrets fehlen — Lauf wird übersprungen. GitHub App anlegen (Contents/Issues/Pull requests = Read and write), aufs Repo installieren und beide Werte als Repo-Secrets hinterlegen."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: GH_TOKEN-Fallback setzen (App-Token oder GITHUB_TOKEN)
        id: gh-token
        run: |
          APP_TOK="${{ steps.app-token.outputs.token }}"
          if [ -n "$APP_TOK" ] && [ "$APP_TOK" != "null" ]; then
            echo "token=$APP_TOK" >> "$GITHUB_OUTPUT"
            echo "::notice::Nutze GitHub-App-Token für gh-Befehle."
          else
            echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
            echo "::warning::App-Token nicht verfügbar — nutze GITHUB_TOKEN (Achtung: Label-Wechsel lösen ggf. keine Folge-Workflows aus)."
          fi

      - name: Checkout
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.gh-token.outputs.token }}

      - name: Mistral Vibe installieren
        if: steps.preflight.outputs.configured == 'true'
        run: |
          curl -fsSL https://vibe.mistral.ai/install.sh | bash -s -- --skip-browser --skip-setup
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Mistral Vibe konfigurieren
        if: steps.preflight.outputs.configured == 'true'
        run: |
          vibe config set model.provider mistral
          vibe config set model.base_url https://api.mistral.ai/v1
          vibe config set agent.max_turns 90

      - name: API-Key prüfen (MISTRAL_API_KEY)
        if: steps.preflight.outputs.configured == 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ -z "$MISTRAL_API_KEY" ]; then
            echo "::error title=API-Key fehlt::MISTRAL_API_KEY nicht gesetzt"
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:spec-ready" 2>/dev/null || true
            exit 1
          fi

      - name: Doppel-Run-Guard (existierender PR mit Closes #N)
        id: doppel-guard
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if ! existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,isDraft,closingIssuesReferences \
            --jq "[.[] | select((.closingIssuesReferences // []) | any(.number == ${ISSUE}))] | length" 2>/dev/null)"; then
            echo "::warning::Doppel-Run-Guard: gh-API nicht erreichbar — fail-open."
            existing=0
          fi
          if [ "${existing:-0}" -gt 0 ]; then
            echo "::notice::Spec übersprungen — PR existiert bereits für Issue #$ISSUE."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: pnpm einrichten
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Node.js einrichten
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Abhängigkeiten installieren
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Git-Hooks installieren (lefthook)
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm exec lefthook install

      - name: Spec via Mistral Vibe
        id: vibe
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
        run: |
          cat > /tmp/vibe-prompt.txt << 'VIBE_EOF'
          Das Label `ai:spec-ready` wurde an Issue #ISSUE_NR gesetzt — schreibe jetzt die ROTEN Tests (den Vertrag) für dieses Issue.

          Folge dem Spec-Workflow .ai-knowledge/ticket-spec.md:
            1. Branch anlegen: git switch -c feat/issue-ISSUE_NR-<kurzname>. Den Akzeptanzkriterien-Block primär aus dem BODY-Block des Issues entnehmen (gh issue view ISSUE_NR --json body -q .body, Abschnitt zwischen <!-- KI-ANALYSE:START stand=... --> und <!-- KI-ANALYSE:END -->).
            2. ROTE Tests schreiben — je Akzeptanzkriterium echte, ausführbare Tests (server/src/**/*.test.ts, frontend/src/**/*.test.ts, frontend/e2e/*.spec.ts). Sie prüfen echtes Soll-Verhalten und werden grün, sobald der Code existiert. KEINEN Produktivcode schreiben.
            3. Rote Tests als ERSTEN Commit (test: rote Spec-Tests fuer #ISSUE_NR), Branch pushen, git push -u origin HEAD. DRAFT-PR erstellen (gh pr create --draft) mit Closes #ISSUE_NR im Body. KEIN ai:needs-review setzen (PR ist Draft).
            4. ÜBERGABE (ALLERLETZTER Schritt, NIE davor): am Issue ai:ready setzen und ai:spec-ready entfernen (gh issue edit ISSUE_NR --add-label ai:ready --remove-label ai:spec-ready). Fehlende Labels vorher mit gh label create anlegen.

          WERKZEUGE:
            Du hast Bash (für gh, git, pnpm), Datei-Tools. Nutze gh issue, gh pr, git, pnpm, read_file, write_file. GH_TOKEN authentifiziert gh-Befehle.

          WEICHES ZEITLIMIT (Soft-Abort):
            Prüfe VOR jedem größeren Teilschritt mit date +%s gegen SOFT_DEADLINE. Ist das Limit erreicht: Zwischenstand committen + pushen (Branch/Draft-PR mit TODO-Notiz). ai:ready NICHT setzen. Stattdessen ai:spec-ready entfernen+sofort wieder setzen (Selbst-Retrigger). Dann Turn beenden.

          WICHTIG:
            - Bearbeite ausschließlich dieses eine Issue.
            - Weise dich NICHT selbst zu (@me wäre der Bot).
            - Keine interaktive Bestätigung nötig — Label ai:spec-ready autorisiert den Lauf.
          VIBE_EOF

          sed -i "s/#ISSUE_NR/${{ github.event.issue.number }}/g" /tmp/vibe-prompt.txt
          sed -i "s/SOFT_DEADLINE/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/vibe-prompt.txt

          vibe chat -q "$(cat /tmp/vibe-prompt.txt)" \
            -Q --yolo --provider mistral \
            -m "mistral-large-latest" \
            -t "terminal,file" \
            --max-turns 90 \
            --accept-hooks \
            2>&1 | tee /tmp/vibe-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Mistral Vibe Session-ID erfassen
        if: always()
        id: session
        run: |
          if [ -f /tmp/vibe-output.log ]; then
            sid="$(grep '^session_id:' /tmp/vibe-output.log | head -1 | sed 's/^session_id:[[:space:]]*//')"
            if [ -n "$sid" ]; then
              echo "session_id=$sid" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Bei Timeout als zu gross markieren (ai:to-big-issue)
        if: always() && steps.preflight.outputs.configured == 'true' && steps.vibe.outcome == 'cancelled'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_START: ${{ steps.starttime.outputs.epoch }}
        run: |
          elapsed=$(( $(date +%s) - ${RUN_START:-0} ))
          if [ "${RUN_START:-0}" -eq 0 ] || [ "$elapsed" -lt 1080 ]; then exit 0; fi
          gh label create "ai:to-big-issue" --repo "$GITHUB_REPOSITORY" --color B60205 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:spec-ready" 2>/dev/null || true

      - name: Ergebnis zusammenfassen
        if: always() && steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.vibe.outcome }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Spec erfolgreich::Issue #${ISSUE} — Rote Tests geschrieben"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Spec abgebrochen"
          else
            echo "::error title=❌ Spec fehlgeschlagen"
          fi
          {
            echo "### Spec #${ISSUE} — fertig"
            echo "- Mistral Vibe Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Labels: ${labels:-keine}"
            if [ -n "$SESSION_ID" ]; then echo "- Session-ID: \`${SESSION_ID}\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"
