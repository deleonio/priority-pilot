name: Claude Triage (Analyse)

# Stoesst die KI-Analyse (Triage) eines Issues automatisch an, sobald
#  - ein neues Issue ANGELEGT wird (issues: opened) ODER
#  - an einem Issue das Label "ai:analyzed" ENTFERNT wird (issues: unlabeled) ODER
#  - an einem Issue das Label "ai:to-big-issue" ENTFERNT wird (issues: unlabeled).
# Damit wird ein Issue ohne manuelles Zutun analysiert; das Entfernen von
# "ai:analyzed" erzwingt bewusst eine Neu-Analyse (z. B. nach geaenderter Beschreibung).
# Das Entfernen von "ai:to-big-issue" signalisiert, dass das Issue nun (wieder) analysiert
# werden soll — typischerweise nach dem Aufteilen oder nach Beheben eines Secret-Problems.
# Setzt den Ticket-Triage-Ablauf fuer genau dieses eine Issue um.
# Ablauf/Hintergrund: .ai-knowledge/ticket-triage.md und .claude/commands/triage-ticket.md
#
# Re-Triage per @claude-Kommentar bleibt in claude-retriage.yml; dieser Workflow deckt
# nur die ereignisgesteuerten Faelle (Anlegen / Label-Entfernen) ab.
#
# Voraussetzung: Repository-Secret CLAUDE_CODE_OAUTH_TOKEN (per `claude setup-token`).

on:
  issues:
    # opened: neu angelegtes Issue; unlabeled: ein Label wurde entfernt
    # (gefiltert auf "ai:analyzed" oder "ai:to-big-issue" im if des Jobs).
    types: [opened, unlabeled]

# Pro Issue nur ein Lauf gleichzeitig. cancel-in-progress: true -> eine neue Aenderung
# (z. B. erneutes Entfernen/Setzen) am selben Issue bricht den noch laufenden Triage-Lauf
# ab, damit immer nur die juengste Analyse durchlaeuft. Ein abgebrochener Teil-Lauf ist
# unkritisch: der naechste Lauf fuehrt die Triage vollstaendig neu aus.
concurrency:
  group: claude-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    # Nur ausloesen, wenn ALLE Bedingungen zutreffen:
    #  - das Issue ist offen,
    #  - UND einer der beiden Ausloeser greift:
    #      * opened: neues Issue, das von jemandem mit Schreibzugriff stammt
    #        (OWNER/MEMBER/COLLABORATOR) — verhindert, dass Aussenstehende den Lauf (und das
    #        OAuth-Token) per neuem Issue ausloesen; die Action prueft den Zugriff zusaetzlich selbst.
    #        Zusaetzlich: kein Doppellauf wenn das Issue bereits "ai:analyzed" traegt
    #        (github.event.issue.labels zeigt beim opened-Event den aktuellen Stand).
    #      * unlabeled: das Label "ai:analyzed" ODER "ai:to-big-issue" wurde entfernt.
    #        Label entfernen setzt bereits Schreibzugriff voraus -> keine zusaetzliche Autorenpruefung.
    #        WICHTIG: Der ai:analyzed-Guard gilt beim unlabeled-Event NICHT global — beim Entfernen
    #        von ai:to-big-issue kann ai:analyzed noch am Issue haengen (Timeout-Szenario), der Lauf
    #        soll dennoch starten.
    if: >-
      ${{ github.event.issue.state == 'open'
          && (
               (github.event.action == 'opened'
                 && !contains(github.event.issue.labels.*.name, 'ai:analyzed')
                 && (github.event.issue.author_association == 'OWNER'
                     || github.event.issue.author_association == 'MEMBER'
                     || github.event.issue.author_association == 'COLLABORATOR'))
               || (github.event.action == 'unlabeled'
                   && (github.event.label.name == 'ai:analyzed'
                       || github.event.label.name == 'ai:to-big-issue'))
             ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Repo auschecken (Slash-Command + Wissensbasis lesen)
      issues: write # Beschreibung lektorieren + Analyse-Body-Block schreiben, Ping-Kommentar posten, Labels setzen
      id-token: write # OIDC-Token der Action; ohne diese Permission fehlt ACTIONS_ID_TOKEN_REQUEST_URL
    steps:
      # Startzeit fuer die Timeout-Erkennung (siehe Zeit-Guard im Label-Schritt unten).
      - name: Startzeit merken (fuer Timeout-Erkennung)
        id: starttime
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # GitHub-App-Token (optional): Setzt die Triage `ai:spec-ready` als App-Bot, loest das den
      # Spec-Workflow (claude-spec.yml) aus. Mit dem Standard-GITHUB_TOKEN gesetzte Labels triggern
      # KEINE Folge-Workflows. Fehlen die App-Secrets, faellt GH_TOKEN auf github.token zurueck
      # (Triage laeuft normal, nur der Spec-Auto-Trigger entfaellt dann).
      - name: Voraussetzung pruefen (GitHub-App-Secrets, optional)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::notice::GitHub-App-Secrets fehlen — Triage laeuft mit GITHUB_TOKEN; der Auto-Trigger der Spec-Stufe (ai:spec-ready -> claude-spec.yml) entfaellt. Fuer den Trigger eine GitHub App (Issues/Contents/Pull requests = Read and write) als APP_ID + APP_PRIVATE_KEY hinterlegen."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Deterministischer Agent-Secret-Check (Haerten S2): das Opt-in fuer GLM/Mistral (und die
      # OAuth-Token-Voraussetzung fuer Claude) darf NICHT still skippen — fehlt das zum aktiven
      # AI_AGENT-Pfad gehoerige Secret, bricht der Lauf hier deterministisch mit einem klaren
      # ::error:: ab (statt erst spaet in der claude-code-action/vibe-Action kryptisch zu sterben).
      # Ai:to-big-issue markiert das Issue als "Mensch muss handeln", damit es nicht still stale steht
      # (das Label triggert bewusst KEINEN Folge-Workflow, gesetzt mit github.token wie die Timeouts).
      - name: Agent-Secret prüfen (kein stiller Skip)
        env:
          AI_AGENT: ${{ vars.AI_AGENT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          missing=""
          # Haerten C2-Nachtrag: GitHub-Actions-`==` (die if:-Bedingungen der Agent-Schritte)
          # vergleicht Strings case-insensitiv, Bashs `case` NICHT. Ohne `,,`-Lowering wuerde
          # z. B. AI_AGENT=GLM zum GLM-Schritt routen, aber hier in den `*)`-Default-Zweig fallen
          # (CLAUDE_CODE_OAUTH_TOKEN statt ZAI_API_KEY geprueft) — der S2-Stille-Skip waere ueber
          # Gross-/Kleinschreibung wieder offen.
          case "${AI_AGENT,,}" in
            glm)     [ -z "$ZAI_API_KEY" ] && missing="ZAI_API_KEY" ;;
            mistral) [ -z "$MISTRAL_API_KEY" ] && missing="MISTRAL_API_KEY" ;;
            *)       [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && missing="CLAUDE_CODE_OAUTH_TOKEN" ;;
          esac
          if [ -n "$missing" ]; then
            echo "::error title=Agent-Secret fehlt::AI_AGENT='${AI_AGENT:-claude}' benoetigt Secret '$missing' — fehlt es, darf der Lauf nicht still skippen (AGENTS.md: bewusstes Opt-in). Secret als Repo-Secret hinterlegen."
            gh label create "ai:to-big-issue" --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "KI-Job lief rot (Konfiguration/Secret) — bitte pruefen" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue" 2>/dev/null || true
            exit 1
          fi
          echo "Agent-Secret fuer AI_AGENT='${AI_AGENT:-claude}' vorhanden."

      # Standard-Pfad (Claude): laeuft, solange die Repo-Variable AI_AGENT NICHT auf "mistral"
      # oder "glm" steht (also auch ungesetzt -> Claude bleibt Default). Umschalten:
      # `gh variable set AI_AGENT --body glm` (Z.ai GLM) oder
      # `gh variable set AI_AGENT --body mistral` (Mistral Vibe);
      # zurueck: `gh variable set AI_AGENT --body claude`.
      - name: Triage via Claude Code
        id: claude
        if: vars.AI_AGENT != 'mistral' && vars.AI_AGENT != 'glm'
        uses: anthropics/claude-code-action@a92e7c70a4da9793dc164451d829089dc057a464 # v1.0.159
        env:
          # gh nutzt das App-Token (falls vorhanden) -> das gesetzte ai:spec-ready loest den
          # Spec-Workflow aus; ohne App-Secrets Fallback auf github.token.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          # Erlaubt NUR, dass claude-issue-unblock.yml per App-Bot "ai:analyzed" entfernen und
          # damit die Re-Analyse eines freigegebenen Nachfolge-Issues anstossen darf (siehe
          # .ai-knowledge/ticket-triage.md, Schritt 3) — sonst blockt checkHumanActor genau
          # diesen einen, dokumentierten Trigger. Alle uebrigen Trigger (opened/unlabeled)
          # bleiben unveraendert ueber die Job-if-Bedingung auf Schreibzugriff bzw. die zwei
          # konkreten Labels beschraenkt; Fremd-Bots faellt das nicht zu.
          allowed_bots: 'claude[bot],my-github-action-bot'
          # Triage fuer genau dieses eine Issue. Bewusst natuerlichsprachig formuliert
          # (nicht als Slash-Command), da die Action keine garantierte Slash-Command-
          # Ausfuehrung im prompt zusichert; verweist aber auf den verbindlichen Ablauf.
          prompt: |
            Issue #${{ github.event.issue.number }} wurde soeben angelegt bzw. das Label
            "ai:analyzed" wurde entfernt und damit eine (Neu-)Analyse (Triage) angefordert.

            Fuehre fuer GENAU DIESES EINE Issue (#${{ github.event.issue.number }}) den
            Ticket-Triage-Workflow aus der Wissensbasis aus — verbindlicher Ablauf:
            .ai-knowledge/ticket-triage.md (entspricht dem Slash-Command
            `/triage-ticket ${{ github.event.issue.number }}`).

            Trifft bereits eine fruehere KI-Analyse im Body-Block zu
            (`<!-- KI-ANALYSE:START stand=... -->` ... `<!-- KI-ANALYSE:END -->`, Re-Triage), diese
            nicht unveraendert uebernehmen: den `stand`-Timestamp aus dem Block auslesen und NUR die
            Delta-Kommentare seit `stand` lesen (gh issue view <nr> --json comments
            -q '.comments[] | select(.createdAt > "<stand>")'), NICHT den ganzen Thread; dann auf
            Passung und Vollstaendigkeit pruefen und bei Bedarf aktualisieren/ergaenzen. Fehlt der
            Body-Block (Alt-Issue), neu anlegen. Dann wie im Ablauf: Beschreibung lektorieren (Inhalt
            unveraendert), am Ende den Titel auf Konsistenz zur Beschreibung/zum Ziel pruefen und
            bei Inkonsistenz inhaltlich treu optimieren (kein Edit pro forma, keine Titel-Drift),
            die Analyse auf Deutsch mit Umsetzbarkeits-Ampel (gruen/gelb/rot) am Anfang in die
            Beschreibung schreiben — als Block zwischen den Markern
            `<!-- KI-ANALYSE:START stand=... -->` und `<!-- KI-ANALYSE:END -->`
            (stand = `date -u +%Y-%m-%dT%H:%M:%SZ`, bei jedem Schreiben neu) via
            `gh issue edit <nr> --body-file -`; bei Re-Triage NUR den Block zwischen den Markern
            in-place ersetzen, die Original-Beschreibung oberhalb des START-Markers NICHT
            ueberschreiben. KEINE Vollanalyse mehr als Kommentar. Danach genau EINEN kurzen
            Ping-Kommentar posten (`gh issue comment`: Hinweis, dass die Analyse in der Beschreibung
            steht; nur bei offenen Fragen zusaetzlich @<issue-author> + die offenen Fragen).

            ALLERLETZTER Schritt, NIE davor: Labels gemaess Ampel setzen (`ai:analyzed`; bei gruen
            zusaetzlich `ai:spec-ready` (Output der Spec-Stufe; NICHT `ai:ready`), bei gelb/rot
            keines von beiden). Setze Labels ERST, NACHDEM die Beschreibung (Body-Block) UND der
            Ping-Kommentar bereits geschrieben/gepostet sind — das Setzen von `ai:spec-ready`
            startet SOFORT die naechste Pipeline-Stufe (claude-spec.yml), die die Beschreibung
            unmittelbar danach liest. Ist sie zu diesem Zeitpunkt noch nicht aktualisiert, arbeitet
            die Spec-Stufe mit veraltetem Issue-Inhalt.

            HARTES Zeitlimit (Haerten L1): Dieser Lauf wird nach 20 Minuten hart abgebrochen. Merkst
            du, dass es eng wird, sichere SPAETESTENS nach ~18 Minuten den Zwischenstand: schreibe die
            bisherige Analyse (auch wenn unvollstaendig) als Body-Block in die Beschreibung, aber setze
            KEIN Label und poste KEINEN Ping-Kommentar — so bleibt das Issue fuer einen saubereren
            Folgelauf offen, statt dass der Timeout den gesamten Fortschritt verwirft.

            Bearbeite ausschliesslich dieses eine Issue (kein Batch). Committe keinen Produktivcode.
          # Nur die im Triage-Ablauf benoetigten Tools zulassen (headless, keine interaktive
          # Freigabe) und die in der Wissensbasis geforderte Bestaetigung als durch den
          # Ereignis-Ausloeser (Anlegen / Label-Entfernen durch eine schreibberechtigte Person)
          # erteilt behandeln.
          claude_args: >-
            --model claude-opus-4-8 --effort max
            --allowedTools "Bash(gh issue:*),Bash(gh api:*),Bash(gh label:*),Read,Grep,Glob,Task"
            --append-system-prompt "Automatisierter, durch das Anlegen des Issues bzw. das Entfernen des ai:analyzed-Labels autorisierter Triage-Lauf in GitHub Actions (headless, keine interaktive Rueckfrage moeglich). Die in der Wissensbasis geforderte Bestaetigung vor dem oeffentlichen Posten gilt durch diesen Ausloeser als erteilt: Schreibe Lektorat und Analyse-Body-Block, poste einen kurzen Ping-Kommentar und setze die Labels ALS ALLERLETZTEN Schritt (NIE davor — sonst startet die naechste Pipeline-Stufe mit veraltetem Issue-Inhalt) fuer Issue #${{ github.event.issue.number }}, ohne auf eine Bestaetigung zu warten. Bearbeite ausschliesslich dieses Issue und committe keinen Produktivcode. HARTES 20-Minuten-Timeout: sichere bei drohendem Limit (~18 Min) die bisherige Analyse als Body-Block (kein Label, kein Ping-Kommentar), statt einen vollen Durchlauf zu erzwingen. Modell-Strategie: Du laeufst fest auf Opus (claude-opus-4-8, --effort max) — fuer die Triage-Analyse ist bewusst das staerkste Modell verdrahtet, damit die Analyse optimal ausfaellt. Fuehre die Analyse vollstaendig selbst durch (keine Eskalation an heavy noetig — du BIST bereits das staerkste Modell); allenfalls triviale mechanische Nebenschritte darfst du per Agent-Tool an light (Haiku) delegieren."

      # Mistral-Pfad (AI_AGENT == 'mistral'): Vibe laeuft headless OHNE Approval-Callback — ohne
      # erzwungenes Auto-Approve wuerde jedes genehmigungspflichtige Tool (gh/git/pnpm/Datei-Writes)
      # als "Tool execution not permitted" uebersprungen. default_agent=auto-approve setzt
      # bypass_tool_permissions=true; ~/.vibe/config.toml ist der Default-Konfig-Ort (VIBE_HOME).
      - name: Vibe-Konfig (Headless Auto-Approve)
        if: vars.AI_AGENT == 'mistral'
        run: |
          mkdir -p "$HOME/.vibe"
          cat > "$HOME/.vibe/config.toml" <<'EOF'
          default_agent = "auto-approve"
          bypass_tool_permissions = true
          EOF

      # Spiegelt den Claude-Schritt: gleicher Ablauf, anderer Agent. Die Vibe-Action reicht KEINE
      # Extra-Flags durch (kein --model/--allowedTools/--append-system-prompt) — daher werden die
      # System-Prompt-Regeln als fuehrender [KONTEXT]-Block in den prompt gefaltet; eine
      # Tool-Restriktion wie bei Claude ist hier nicht erzwingbar (Auto-Approve gibt alle Tools frei).
      - name: Triage via Mistral Vibe
        id: mistral
        if: vars.AI_AGENT == 'mistral'
        uses: mistralai/mistral-vibe@e607ccbb0046c9f68c8d49a85d4dab7c28239f08 # v2.18.0
        env:
          # gh nutzt das App-Token (falls vorhanden) -> ai:spec-ready loest den Spec-Workflow aus;
          # ohne App-Secrets Fallback auf github.token.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        with:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          args: --trust
          prompt: |
            [KONTEXT/REGELN] Automatisierter, durch das Anlegen des Issues bzw. das Entfernen des
            ai:analyzed-Labels autorisierter Triage-Lauf in GitHub Actions (headless, keine
            interaktive Rueckfrage moeglich). Die in der Wissensbasis geforderte Bestaetigung vor
            dem oeffentlichen Posten gilt durch diesen Ausloeser als erteilt. Nutze fuer
            GitHub-Operationen ausschliesslich die `gh`-CLI; committe keinen Produktivcode und
            bearbeite ausschliesslich Issue #${{ github.event.issue.number }}.

            Issue #${{ github.event.issue.number }} wurde soeben angelegt bzw. das Label
            "ai:analyzed" wurde entfernt und damit eine (Neu-)Analyse (Triage) angefordert.

            Fuehre fuer GENAU DIESES EINE Issue (#${{ github.event.issue.number }}) den
            Ticket-Triage-Workflow aus der Wissensbasis aus — verbindlicher Ablauf:
            .ai-knowledge/ticket-triage.md (entspricht dem Slash-Command
            `/triage-ticket ${{ github.event.issue.number }}`).

            Trifft bereits eine fruehere KI-Analyse im Body-Block zu
            (`<!-- KI-ANALYSE:START stand=... -->` ... `<!-- KI-ANALYSE:END -->`, Re-Triage), diese
            nicht unveraendert uebernehmen: den `stand`-Timestamp aus dem Block auslesen und NUR die
            Delta-Kommentare seit `stand` lesen (gh issue view <nr> --json comments
            -q '.comments[] | select(.createdAt > "<stand>")'), NICHT den ganzen Thread; dann auf
            Passung und Vollstaendigkeit pruefen und bei Bedarf aktualisieren/ergaenzen. Fehlt der
            Body-Block (Alt-Issue), neu anlegen. Dann wie im Ablauf: Beschreibung lektorieren (Inhalt
            unveraendert), am Ende den Titel auf Konsistenz zur Beschreibung/zum Ziel pruefen und
            bei Inkonsistenz inhaltlich treu optimieren (kein Edit pro forma, keine Titel-Drift),
            die Analyse auf Deutsch mit Umsetzbarkeits-Ampel (gruen/gelb/rot) am Anfang in die
            Beschreibung schreiben — als Block zwischen den Markern
            `<!-- KI-ANALYSE:START stand=... -->` und `<!-- KI-ANALYSE:END -->`
            (stand = `date -u +%Y-%m-%dT%H:%M:%SZ`, bei jedem Schreiben neu) via
            `gh issue edit <nr> --body-file -`; bei Re-Triage NUR den Block zwischen den Markern
            in-place ersetzen, die Original-Beschreibung oberhalb des START-Markers NICHT
            ueberschreiben. KEINE Vollanalyse mehr als Kommentar. Danach genau EINEN kurzen
            Ping-Kommentar posten (`gh issue comment`: Hinweis, dass die Analyse in der Beschreibung
            steht; nur bei offenen Fragen zusaetzlich @<issue-author> + die offenen Fragen).

            ALLERLETZTER Schritt, NIE davor: Labels gemaess Ampel setzen (`ai:analyzed`; bei gruen
            zusaetzlich `ai:spec-ready` (Output der Spec-Stufe; NICHT `ai:ready`), bei gelb/rot
            keines von beiden). Setze Labels ERST, NACHDEM die Beschreibung (Body-Block) UND der
            Ping-Kommentar bereits geschrieben/gepostet sind — das Setzen von `ai:spec-ready`
            startet SOFORT die naechste Pipeline-Stufe (claude-spec.yml), die die Beschreibung
            unmittelbar danach liest. Ist sie zu diesem Zeitpunkt noch nicht aktualisiert, arbeitet
            die Spec-Stufe mit veraltetem Issue-Inhalt.

            HARTES Zeitlimit (Haerten L1): Dieser Lauf wird nach 20 Minuten hart abgebrochen. Merkst
            du, dass es eng wird, sichere SPAETESTENS nach ~18 Minuten den Zwischenstand: schreibe die
            bisherige Analyse (auch wenn unvollstaendig) als Body-Block in die Beschreibung, aber setze
            KEIN Label und poste KEINEN Ping-Kommentar — so bleibt das Issue fuer einen saubereren
            Folgelauf offen, statt dass der Timeout den gesamten Fortschritt verwirft.

            Bearbeite ausschliesslich dieses eine Issue (kein Batch). Committe keinen Produktivcode.

      # GLM-Pfad (AI_AGENT == 'glm'): verwendet die claude-code-action mit dem Z.ai-Anthropic-
      # kompatiblen Endpoint statt Anthropic. Authentifizierung ueber ZAI_API_KEY
      # (anthropic_api_key); Z.ai mappt Claude-Modellnamen automatisch auf GLM-Modelle.
      - name: Triage via GLM (Z.ai)
        id: glm
        if: vars.AI_AGENT == 'glm'
        uses: anthropics/claude-code-action@a92e7c70a4da9793dc164451d829089dc057a464 # v1.0.159
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          API_TIMEOUT_MS: '3000000'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        with:
          anthropic_api_key: ${{ secrets.ZAI_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          # Erlaubt NUR, dass claude-issue-unblock.yml per App-Bot "ai:analyzed" entfernen und
          # damit die Re-Analyse eines freigegebenen Nachfolge-Issues anstossen darf (siehe
          # .ai-knowledge/ticket-triage.md, Schritt 3) — sonst blockt checkHumanActor genau
          # diesen einen, dokumentierten Trigger. Alle uebrigen Trigger (opened/unlabeled)
          # bleiben unveraendert ueber die Job-if-Bedingung auf Schreibzugriff bzw. die zwei
          # konkreten Labels beschraenkt; Fremd-Bots faellt das nicht zu.
          allowed_bots: 'claude[bot],my-github-action-bot'
          prompt: |
            Issue #${{ github.event.issue.number }} wurde soeben angelegt bzw. das Label
            "ai:analyzed" wurde entfernt und damit eine (Neu-)Analyse (Triage) angefordert.

            Fuehre fuer GENAU DIESES EINE Issue (#${{ github.event.issue.number }}) den
            Ticket-Triage-Workflow aus der Wissensbasis aus — verbindlicher Ablauf:
            .ai-knowledge/ticket-triage.md (entspricht dem Slash-Command
            `/triage-ticket ${{ github.event.issue.number }}`).

            Trifft bereits eine fruehere KI-Analyse im Body-Block zu
            (`<!-- KI-ANALYSE:START stand=... -->` ... `<!-- KI-ANALYSE:END -->`, Re-Triage), diese
            nicht unveraendert uebernehmen: den `stand`-Timestamp aus dem Block auslesen und NUR die
            Delta-Kommentare seit `stand` lesen (gh issue view <nr> --json comments
            -q '.comments[] | select(.createdAt > "<stand>")'), NICHT den ganzen Thread; dann auf
            Passung und Vollstaendigkeit pruefen und bei Bedarf aktualisieren/ergaenzen. Fehlt der
            Body-Block (Alt-Issue), neu anlegen. Dann wie im Ablauf: Beschreibung lektorieren (Inhalt
            unveraendert), am Ende den Titel auf Konsistenz zur Beschreibung/zum Ziel pruefen und
            bei Inkonsistenz inhaltlich treu optimieren (kein Edit pro forma, keine Titel-Drift),
            die Analyse auf Deutsch mit Umsetzbarkeits-Ampel (gruen/gelb/rot) am Anfang in die
            Beschreibung schreiben — als Block zwischen den Markern
            `<!-- KI-ANALYSE:START stand=... -->` und `<!-- KI-ANALYSE:END -->`
            (stand = `date -u +%Y-%m-%dT%H:%M:%SZ`, bei jedem Schreiben neu) via
            `gh issue edit <nr> --body-file -`; bei Re-Triage NUR den Block zwischen den Markern
            in-place ersetzen, die Original-Beschreibung oberhalb des START-Markers NICHT
            ueberschreiben. KEINE Vollanalyse mehr als Kommentar. Danach genau EINEN kurzen
            Ping-Kommentar posten (`gh issue comment`: Hinweis, dass die Analyse in der Beschreibung
            steht; nur bei offenen Fragen zusaetzlich @<issue-author> + die offenen Fragen).

            ALLERLETZTER Schritt, NIE davor: Labels gemaess Ampel setzen (`ai:analyzed`; bei gruen
            zusaetzlich `ai:spec-ready` (Output der Spec-Stufe; NICHT `ai:ready`), bei gelb/rot
            keines von beiden). Setze Labels ERST, NACHDEM die Beschreibung (Body-Block) UND der
            Ping-Kommentar bereits geschrieben/gepostet sind — das Setzen von `ai:spec-ready`
            startet SOFORT die naechste Pipeline-Stufe (claude-spec.yml), die die Beschreibung
            unmittelbar danach liest. Ist sie zu diesem Zeitpunkt noch nicht aktualisiert, arbeitet
            die Spec-Stufe mit veraltetem Issue-Inhalt.

            HARTES Zeitlimit (Haerten L1): Dieser Lauf wird nach 20 Minuten hart abgebrochen. Merkst
            du, dass es eng wird, sichere SPAETESTENS nach ~18 Minuten den Zwischenstand: schreibe die
            bisherige Analyse (auch wenn unvollstaendig) als Body-Block in die Beschreibung, aber setze
            KEIN Label und poste KEINEN Ping-Kommentar — so bleibt das Issue fuer einen saubereren
            Folgelauf offen, statt dass der Timeout den gesamten Fortschritt verwirft.

            Bearbeite ausschliesslich dieses eine Issue (kein Batch). Committe keinen Produktivcode.
          claude_args: >-
            --model claude-opus-4-8 --effort max
            --allowedTools "Bash(gh issue:*),Bash(gh api:*),Bash(gh label:*),Read,Grep,Glob,Task"
            --append-system-prompt "Automatisierter, durch das Anlegen des Issues bzw. das Entfernen des ai:analyzed-Labels autorisierter Triage-Lauf in GitHub Actions (headless, keine interaktive Rueckfrage moeglich). Die in der Wissensbasis geforderte Bestaetigung vor dem oeffentlichen Posten gilt durch diesen Ausloeser als erteilt: Schreibe Lektorat und Analyse-Body-Block, poste einen kurzen Ping-Kommentar und setze die Labels ALS ALLERLETZTEN Schritt (NIE davor — sonst startet die naechste Pipeline-Stufe mit veraltetem Issue-Inhalt) fuer Issue #${{ github.event.issue.number }}, ohne auf eine Bestaetigung zu warten. Bearbeite ausschliesslich dieses Issue und committe keinen Produktivcode. HARTES 20-Minuten-Timeout: sichere bei drohendem Limit (~18 Min) die bisherige Analyse als Body-Block (kein Label, kein Ping-Kommentar), statt einen vollen Durchlauf zu erzwingen. Modell-Strategie: Du laeufst fest auf Opus (claude-opus-4-8, --effort max) — fuer die Triage-Analyse ist bewusst das staerkste Modell verdrahtet, damit die Analyse optimal ausfaellt. Fuehre die Analyse vollstaendig selbst durch (keine Eskalation an heavy noetig — du BIST bereits das staerkste Modell); allenfalls triviale mechanische Nebenschritte darfst du per Agent-Tool an light (Haiku) delegieren."

      # Bei hartem Timeout (Agent-Schritt cancelled) ist das Issue zu gross, um es in einem Lauf zu
      # analysieren: mit "ai:to-big-issue" markieren (Kandidat zum Aufteilen) und ein evtl.
      # vorhandenes "ai:ready" entfernen. Laeuft im Cancellation-Grace-Fenster (if: always(), ~5 Min).
      # Zeit-Guard (WICHTIG bei cancel-in-progress: true): nur labeln, wenn der Lauf das 20-Min-Limit
      # nahezu ausgeschoepft hat (>= 18 Min). Ein durch ein neueres Issue-Event verdraengter Lauf
      # (Concurrency-Supersede) erzeugt ebenfalls outcome=cancelled, passiert aber frueher und faellt
      # so heraus — sonst wuerde ein nur ueberholtes Issue faelschlich als "zu gross" markiert.
      - name: Bei Timeout als zu gross markieren (ai:to-big-issue)
        if: always() && (steps.claude.outcome == 'cancelled' || steps.glm.outcome == 'cancelled' || steps.mistral.outcome == 'cancelled')
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_START: ${{ steps.starttime.outputs.epoch }}
        run: |
          elapsed=$(( $(date +%s) - ${RUN_START:-0} ))
          if [ "${RUN_START:-0}" -eq 0 ] || [ "$elapsed" -lt 1080 ]; then
            echo "::notice title=Kein Timeout::Lauf nach ${elapsed}s abgebrochen (< 18 Min) — vermutlich Supersede/Cancel, kein ai:to-big-issue."
            exit 0
          fi
          gh label create "ai:to-big-issue" --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "KI-Job lief in den Timeout — Issue zu gross, bitte aufteilen" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:spec-ready" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:ready" 2>/dev/null || true
          echo "::warning title=Issue #${ISSUE} zu gross::20-Min-Timeout erreicht (${elapsed}s) — Label ai:to-big-issue gesetzt; bitte Issue aufteilen."

      # Deterministisches Abschluss-Signal (unabhaengig von der LLM-Ausgabe): laeuft auch bei
      # Abbruch/Timeout (if: always()) und macht im Log/Job-Summary klar sichtbar, DASS und mit
      # welchem Ergebnis der Lauf fertig ist. outcome=cancelled signalisiert das 20-Min-Timeout.
      - name: Ergebnis zusammenfassen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          AGENT: ${{ vars.AI_AGENT == 'mistral' && 'Mistral' || (vars.AI_AGENT == 'glm' && 'GLM (Z.ai)' || 'Claude') }}
          # Outcome des tatsaechlich gelaufenen Agent-Schritts (die anderen sind 'skipped').
          OUTCOME: ${{ steps.claude.outcome != 'skipped' && steps.claude.outcome || (steps.glm.outcome != 'skipped' && steps.glm.outcome || steps.mistral.outcome) }}
          SESSION_ID: ${{ steps.claude.outputs.session_id || steps.glm.outputs.session_id }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          {
            echo "### Triage #${ISSUE} — fertig"
            echo ""
            echo "- ${AGENT}-Schritt: \`${OUTCOME:-unbekannt}\` (cancelled = 20-Min-Timeout erreicht)"
            echo "- Aktuelle Labels: ${labels:-keine}"
            if [ -n "$SESSION_ID" ]; then echo "- Session-ID: \`${SESSION_ID}\` (\`--resume\` zum Nachschauen)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Triage #${ISSUE} fertig::${AGENT}-Schritt ${OUTCOME:-unbekannt}; Labels: ${labels:-keine}"
