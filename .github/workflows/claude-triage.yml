name: Claude Triage (Analyse)

# Stoesst die KI-Analyse (Triage) eines Issues automatisch an, sobald
#  - ein neues Issue ANGELEGT wird (issues: opened) ODER
#  - an einem Issue das Label "ai:analyzed" ENTFERNT wird (issues: unlabeled) ODER
#  - an einem Issue das Label "ai:to-big-issue" ENTFERNT wird (issues: unlabeled) ODER
#  - jemand mit Schreibzugriff einen Issue-Kommentar mit dem Stichwort "@claude" hinterlaesst
#    (Event `issue_comment`, Typ `created`) — Re-Triage auf Zuruf.
# Damit wird ein Issue ohne manuelles Zutun (neu) analysiert; das Entfernen von "ai:analyzed"
# erzwingt bewusst eine Neu-Analyse (z. B. nach geaenderter Beschreibung).
# Das Entfernen von "ai:to-big-issue" signalisiert, dass das Issue nun (wieder) analysiert
# werden soll — typischerweise nach dem Aufteilen oder nach Beheben eines Secret-Problems.
# Setzt den Ticket-Triage-Ablauf fuer genau dieses eine Issue um — Triage ODER Re-Triage, beide
# Trigger fuehren denselben Ablauf aus .ai-knowledge/ticket-triage.md aus.
# Ablauf/Hintergrund: .ai-knowledge/ticket-triage.md und .claude/commands/triage-ticket.md
#
# Zusammengefuehrt aus den vormals getrennten claude-triage.yml + claude-retriage.yml (M8,
# 2026-07-08): beide Workflows waren zu ~95% identisch (gleiches Modell/Tools/Prompt-Kern, gleiche
# App-Token-Praeflight-Logik) — der Split war organisatorisch, nicht technisch. Ein Workflow mit
# zwei Triggern reduziert die Pflegeflaeche (Prompt/Modell/max-turns nur noch an einer Stelle).
#
# Voraussetzung: Repository-Secret CLAUDE_CODE_OAUTH_TOKEN (per `claude setup-token`).

on:
  issues:
    # opened: neu angelegtes Issue; unlabeled: ein Label wurde entfernt
    # (gefiltert auf "ai:analyzed" oder "ai:to-big-issue" im if des Jobs).
    types: [opened, unlabeled]
  issue_comment:
    # Nur `created` (neuer Kommentar) — NICHT `edited`: das nachtraegliche Einfuegen von "@claude"
    # in einen (ggf. Jahre alten) Kommentar waere ein Spam-/Missbrauchsvektor, weil dabei kein
    # sichtbarer neuer Kommentar in der UI entsteht. Wer eine Re-Triage will, schreibt einen neuen
    # @claude-Kommentar (created feuert zuverlaessig).
    types: [created]

# Pro Issue nur ein Lauf gleichzeitig, ueber BEIDE Trigger hinweg (dieselbe Gruppe fuer issues- UND
# issue_comment-Events desselben Issues). cancel-in-progress: true -> eine neue Aenderung (weiteres
# Label-Entfernen ODER ein neuer @claude-Kommentar) am selben Issue bricht einen noch laufenden
# Triage-/Re-Triage-Lauf ab, damit immer nur die juengste Analyse durchlaeuft. Ein abgebrochener
# Teil-Lauf ist unkritisch: der naechste Lauf fuehrt die (Re-)Triage vollstaendig neu aus.
concurrency:
  group: claude-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    # Nur ausloesen, wenn ALLE Bedingungen zutreffen (verzweigt nach Trigger-Event):
    #  issues-Event:
    #   - das Issue ist offen,
    #   - UND einer der beiden Ausloeser greift:
    #      * opened: neues Issue, das von jemandem mit Schreibzugriff stammt
    #        (OWNER/MEMBER/COLLABORATOR) — verhindert, dass Aussenstehende den Lauf (und das
    #        OAuth-Token) per neuem Issue ausloesen; die Action prueft den Zugriff zusaetzlich selbst.
    #        Zusaetzlich: kein Doppellauf wenn das Issue bereits "ai:analyzed" traegt
    #        (github.event.issue.labels zeigt beim opened-Event den aktuellen Stand).
    #      * unlabeled: das Label "ai:analyzed" ODER "ai:to-big-issue" wurde entfernt.
    #        Label entfernen setzt bereits Schreibzugriff voraus -> keine zusaetzliche Autorenpruefung.
    #        WICHTIG: Der ai:analyzed-Guard gilt beim unlabeled-Event NICHT global — beim Entfernen
    #        von ai:to-big-issue kann ai:analyzed noch am Issue haengen (Timeout-Szenario), der Lauf
    #        soll dennoch starten. Dieser Pfad kann BOT-ausgeloest sein (claude-issue-unblock.yml
    #        entfernt ai:analyzed per App-Token) — daher `allowed_bots` unten am Claude-Schritt.
    #  issue_comment-Event (Re-Triage per Zuruf):
    #   - echtes Issue, kein PR (issue_comment feuert auch fuer PRs -> pull_request == null)
    #   - der Kommentar enthaelt das Stichwort @claude
    #   - der Kommentar stammt von jemandem mit Schreibzugriff (OWNER/MEMBER/COLLABORATOR),
    #     damit Aussenstehende den Lauf (und das OAuth-Token) nicht ausloesen koennen. Dieser Pfad
    #     ist IMMER menschlich ausgeloest (kein Bot postet @claude-Kommentare).
    #     Die Action prueft den Schreibzugriff zwar zusaetzlich selbst, dies ist die
    #     vorgeschaltete, billige Absicherung (kein Runner-Start fuer Fremde).
    if: >-
      ${{ (github.event_name == 'issues'
            && github.event.issue.state == 'open'
            && (
                 (github.event.action == 'opened'
                   && !contains(github.event.issue.labels.*.name, 'ai:analyzed')
                   && (github.event.issue.author_association == 'OWNER'
                       || github.event.issue.author_association == 'MEMBER'
                       || github.event.issue.author_association == 'COLLABORATOR'))
                 || (github.event.action == 'unlabeled'
                     && (github.event.label.name == 'ai:analyzed'
                         || github.event.label.name == 'ai:to-big-issue'))
               ))
          || (github.event_name == 'issue_comment'
              && github.event.issue.pull_request == null
              && contains(github.event.comment.body, '@claude')
              && (github.event.comment.author_association == 'OWNER'
                  || github.event.comment.author_association == 'MEMBER'
                  || github.event.comment.author_association == 'COLLABORATOR')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      BASH_MAX_OUTPUT_LENGTH: '20000'
      CLAUDE_HIDE_BANNER: '1'
      API_TIMEOUT_MS: '3000000'
    permissions:
      contents: read # Repo auschecken (Slash-Command + Wissensbasis lesen)
      issues: write # Beschreibung lektorieren + Analyse-Body-Block schreiben, Ping-Kommentar posten, Labels setzen
      id-token: write # OIDC-Token der Action; ohne diese Permission fehlt ACTIONS_ID_TOKEN_REQUEST_URL
      actions: read # Artefakt-Suche/-Download (`gh api`) im Session-Archiv-Wiederherstellen-Schritt
    steps:
      # Startzeit fuer die Timeout-Erkennung (siehe Zeit-Guard im Label-Schritt unten) UND fuer das
      # weiche Zeitlimit (Soft-Abort, 2026-07-08): soft_deadline_epoch = jetzt + 840s (14 Min) --
      # 6 Min Puffer bis zum harten 20-Min-Kill, damit Claude den Zwischenstand in Ruhe sichern
      # kann. Der Epoch-Wert wird unten als literale Zahl in den Prompt gerendert (kein
      # Env-Var-Zugriff durchs Bash-Tool noetig, da GitHub Actions den Ausdruck beim Rendern des
      # Prompt-Textes direkt einsetzt).
      - name: Startzeit merken (fuer Timeout-Erkennung + weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 840))" >> "$GITHUB_OUTPUT"

      # GitHub-App-Token (optional): Setzt die (Re-)Triage `ai:spec-ready` als App-Bot, loest das den
      # Spec-Workflow (claude-spec.yml) aus. Mit dem Standard-GITHUB_TOKEN gesetzte Labels triggern
      # KEINE Folge-Workflows. Fehlen die App-Secrets, faellt GH_TOKEN auf github.token zurueck
      # ((Re-)Triage laeuft normal, nur der Spec-Auto-Trigger entfaellt dann).
      - name: Voraussetzung pruefen (GitHub-App-Secrets, optional)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::notice::GitHub-App-Secrets fehlen — (Re-)Triage laeuft mit GITHUB_TOKEN; der Auto-Trigger der Spec-Stufe (ai:spec-ready -> claude-spec.yml) entfaellt. Fuer den Trigger eine GitHub App (Issues/Contents/Pull requests = Read and write) als APP_ID + APP_PRIVATE_KEY hinterlegen."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # KI-Backend (Issue #403): Label `ai:use-zai` am Issue waehlt pro Lauf z.ai statt Anthropic
      # (Default). Schreibt AI_BACKEND=anthropic|zai nach $GITHUB_ENV; bei zai kommen Endpoint +
      # ANTHROPIC_AUTH_TOKEN (Secret ZAI_API_KEY) dazu. Muss VOR Preflight + claude-code-action.
      - name: KI-Backend konfigurieren
        uses: ./.github/actions/configure-ai-backend
        with:
          entity-type: issue
          entity-number: ${{ github.event.issue.number }}
          gh-token: ${{ steps.app-token.outputs.token || github.token }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}

      # Deterministischer Agent-Secret-Check (Haerten S2): die OAuth-Token-Voraussetzung fuer
      # Claude darf NICHT still skippen — fehlt CLAUDE_CODE_OAUTH_TOKEN, bricht der Lauf hier
      # deterministisch mit einem klaren ::error:: ab (statt erst spaet in der claude-code-action
      # kryptisch zu sterben). Ai:to-big-issue markiert das Issue als "Mensch muss handeln", damit
      # es nicht still stale steht (das Label triggert bewusst KEINEN Folge-Workflow, gesetzt mit
      # github.token wie die Timeouts).
      - name: Agent-Secret prüfen (kein stiller Skip)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AI_BACKEND: ${{ env.AI_BACKEND }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ "${AI_BACKEND:-}" = "zai" ] || [ "${AI_BACKEND:-}" = "openrouter" ]; then
            echo "KI-Backend=${AI_BACKEND} — Auth via API-Key (in configure-ai-backend validiert). OAuth-Preflight entfaellt."
            exit 0
          fi
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error title=Agent-Secret fehlt::CLAUDE_CODE_OAUTH_TOKEN fehlt — fehlt es, darf der Lauf nicht still skippen (AGENTS.md: bewusstes Opt-in). Secret als Repo-Secret hinterlegen."
            gh label create "ai:to-big-issue" --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "KI-Job lief rot (Konfiguration/Secret) — bitte pruefen" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue" 2>/dev/null || true
            exit 1
          fi
          echo "Agent-Secret (CLAUDE_CODE_OAUTH_TOKEN) vorhanden."

      # Named Session Resume (Phase "analyse"): laedt ein evtl. archiviertes Sitzungsarchiv dieses
      # Issues (juengstes Workflow-Artefakt der Phase; Artefakte statt Actions-Cache seit
      # 2026-07-10, GitHubs Read-only-Cache fuer untrusted Trigger) und liefert bei Treffer ein
      # fertiges --resume-Argument, damit eine Re-Triage (Label entfernt / @claude-Kommentar) den
      # Konversationskontext der letzten Analyse fortsetzt statt kontextlos neu zu beginnen.
      # Fail-open: kein Artefakt/korruptes Archiv -> leere Outputs, frischer Start wie bisher.
      - name: Session-Archiv wiederherstellen (Phase analyse)
        id: session-restore
        # continue-on-error: die interne Fail-open-Logik der Action faengt bekannte Fehlerfaelle
        # (Cache-Miss, korruptes Archiv) selbst ab -- diese Flag ist das Netz fuer UNBEKANNTE
        # Fehler (z. B. `source` schlaegt fehl), die den Composite-Step sonst non-zero beenden und
        # damit den nachfolgenden Claude-Schritt (kein `if: always()`) komplett ueberspringen wuerden
        # -- das Gegenteil von fail-open (Kreuzverhoer-Finding 2026-07-08).
        continue-on-error: true
        uses: ./.github/actions/session-restore
        with:
          issue: ${{ github.event.issue.number }}
          phase: analyse

      # Kein manueller Supersede-Check: issue-getriggerte Läufe tragen head_branch=main und sind
      # über die Runs-API NICHT auf das konkrete Issue scopebar. Die native concurrency-Gruppe
      # (claude-triage-<issue-nr>, cancel-in-progress: true) cancelt einen älteren Lauf desselben
      # Issues bei einem neuen Trigger bereits nativ -> ein manueller Supersede-Check ist redundant.
      - name: Triage via Claude Code
        id: claude
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1.0.165
        env:
          # gh nutzt das App-Token (falls vorhanden) -> das gesetzte ai:spec-ready loest den
          # Spec-Workflow aus; ohne App-Secrets Fallback auf github.token.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        with:
          claude_code_oauth_token: ${{ env.AI_BACKEND != 'zai' && env.AI_BACKEND != 'openrouter' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          # Erlaubt NUR, dass claude-issue-unblock.yml per App-Bot "ai:analyzed" entfernen und
          # damit die Re-Analyse eines freigegebenen Nachfolge-Issues anstossen darf (siehe
          # .ai-knowledge/ticket-triage.md, Schritt 3) — sonst blockt checkHumanActor genau
          # diesen einen, dokumentierten Trigger (nur der issues/unlabeled-Pfad kann bot-ausgeloest
          # sein; der issue_comment-Pfad ist immer menschlich, braucht diese Erlaubnis aber nicht
          # separat, da sie ihm nicht schadet). Alle uebrigen Trigger (opened/unlabeled) bleiben
          # unveraendert ueber die Job-if-Bedingung auf Schreibzugriff bzw. die zwei konkreten
          # Labels beschraenkt; Fremd-Bots faellt das nicht zu.
          allowed_bots: 'claude[bot],my-github-action-bot'
          # (Re-)Triage fuer genau dieses eine Issue. Bewusst natuerlichsprachig formuliert
          # (nicht als Slash-Command), da die Action keine garantierte Slash-Command-
          # Ausfuehrung im prompt zusichert; verweist aber auf den verbindlichen Ablauf.
          prompt: |
            Für Issue #${{ github.event.issue.number }} wurde eine (Neu-)Analyse (Triage bzw.
            Re-Triage) angefordert — durch Anlegen des Issues, Entfernen des Labels
            "ai:analyzed"/"ai:to-big-issue", oder einen @claude-Kommentar einer Person mit
            Schreibzugriff.

            Fuehre fuer GENAU DIESES EINE Issue (#${{ github.event.issue.number }}) den
            Ticket-Triage-Workflow aus der Wissensbasis aus — verbindlicher Ablauf:
            .ai-knowledge/ticket-triage.md (entspricht dem Slash-Command
            `/triage-ticket ${{ github.event.issue.number }}`).

            Trifft bereits eine fruehere KI-Analyse im Body-Block zu
            (`<!-- KI-ANALYSE:START stand=... -->` ... `<!-- KI-ANALYSE:END -->`, Re-Triage-Fall),
            diese nicht unveraendert uebernehmen: den `stand`-Timestamp aus dem Block auslesen und
            NUR die Delta-Kommentare seit `stand` lesen (gh issue view <nr> --json comments
            -q '.comments[] | select(.createdAt > "<stand>")'), NICHT den ganzen Thread; dann auf
            Passung und Vollstaendigkeit zur (ggf. geaenderten) Aufgabenstellung pruefen,
            beantwortete offene Fragen einarbeiten/entfernen und bei Bedarf aktualisieren/ergaenzen.
            Fehlt der Body-Block (Alt-Issue oder Erstanalyse), neu anlegen. Wurde diese Session per
            `--resume` fortgesetzt (derselbe Konversationskontext wie die letzte (Re-)Triage dieses
            Issues), nutze diesen Kontext zusaetzlich zum Delta seit `stand` -- der Body-Block
            bleibt aber so oder so die massgebliche, persistierte Wahrheitsquelle, das Delta-Vorgehen
            oben gilt unveraendert (kein Widerspruch, nur zusaetzlicher Kontext bei Resume). Dann wie im Ablauf:
            Beschreibung lektorieren (Inhalt unveraendert), am Ende den Titel auf Konsistenz zur
            Beschreibung/zum Ziel pruefen und bei Inkonsistenz inhaltlich treu optimieren (kein
            Edit pro forma, keine Titel-Drift), die Analyse auf Deutsch mit Umsetzbarkeits-Ampel
            (gruen/gelb/rot) am Anfang in die Beschreibung schreiben — als Block zwischen den
            Markern `<!-- KI-ANALYSE:START stand=... -->` und `<!-- KI-ANALYSE:END -->`
            (stand = `date -u +%Y-%m-%dT%H:%M:%SZ`, bei jedem Schreiben neu) via
            `gh issue edit <nr> --body-file -`; existiert bereits ein Block, NUR den Block zwischen
            den Markern in-place ersetzen, die Original-Beschreibung oberhalb des START-Markers
            NICHT ueberschreiben. KEINE Vollanalyse mehr als Kommentar. Danach genau EINEN kurzen
            Ping-Kommentar posten (`gh issue comment`: Hinweis, dass die Analyse in der Beschreibung
            steht bzw. aktualisiert wurde; nur bei offenen Fragen zusaetzlich @<issue-author> + die
            offenen Fragen).

            ALLERLETZTER Schritt, NIE davor: Labels gemaess Ampel setzen (`ai:analyzed`; bei gruen
            zusaetzlich `ai:spec-ready` (Output der Spec-Stufe; NICHT `ai:ready`), bei gelb/rot ein
            evtl. vorhandenes `ai:spec-ready`/`ai:ready` entfernen). Setze Labels ERST, NACHDEM die
            Beschreibung (Body-Block) UND der Ping-Kommentar bereits geschrieben/gepostet sind — das
            Setzen von `ai:spec-ready` startet SOFORT die naechste Pipeline-Stufe (claude-spec.yml),
            die die Beschreibung unmittelbar danach liest. Ist sie zu diesem Zeitpunkt noch nicht
            aktualisiert, arbeitet die Spec-Stufe mit veraltetem Issue-Inhalt.

            Weiches Zeitlimit (Soft-Abort): Dieser Lauf wird nach 20 Minuten HART abgebrochen (kein
            SIGTERM-Handling moeglich). Pruefe daher VOR jedem groesseren Teilschritt (neue
            Analyse-Runde, laengere Recherche) mit `test "$(date +%s)" -ge ${{ steps.starttime.outputs.soft_deadline_epoch }}`,
            ob das weiche Limit (14 Min nach Start, 6 Min Puffer) erreicht ist. Ist das der Fall,
            STOPPE SOFORT den aktuellen Teilschritt kontrolliert und fuehre NUR noch dies aus:
            schreibe die bisherige Analyse (auch wenn unvollstaendig) als Body-Block in die
            Beschreibung, aber setze KEIN Label und poste KEINEN Ping-Kommentar — so bleibt das
            Issue fuer einen saubereren Folgelauf offen, statt dass der harte Timeout den gesamten
            Fortschritt verwirft. Danach den Turn beenden (keine weiteren Schritte mehr versuchen).

            Bearbeite ausschliesslich dieses eine Issue (kein Batch). Committe keinen Produktivcode.
          # Nur die im Triage-Ablauf benoetigten Tools zulassen (headless, keine interaktive
          # Freigabe) und die in der Wissensbasis geforderte Bestaetigung als durch den
          # jeweiligen Ereignis-Ausloeser (Anlegen/Label-Entfernen/@claude-Kommentar durch eine
          # schreibberechtigte Person) erteilt behandeln.
          claude_args: >-
            --bare --model claude-opus-4-8 --effort ${{ github.event_name == 'issue_comment' && 'high' || 'max' }}
            ${{ steps.session-restore.outputs.resume-arg }}
            --allowedTools "Bash(gh issue:*),Bash(gh api:*),Bash(gh label:*),Read,Grep,Glob,Task"
            --append-system-prompt "Automatisierter, durch das Anlegen des Issues, das Entfernen des ai:analyzed-/ai:to-big-issue-Labels ODER einen @claude-Kommentar autorisierter Triage-Lauf in GitHub Actions (headless, keine interaktive Rueckfrage moeglich). Die in der Wissensbasis geforderte Bestaetigung vor dem oeffentlichen Posten gilt durch den jeweiligen Ausloeser als erteilt: Schreibe Lektorat und Analyse-Body-Block, poste einen kurzen Ping-Kommentar und setze die Labels ALS ALLERLETZTEN Schritt (NIE davor — sonst startet die naechste Pipeline-Stufe mit veraltetem Issue-Inhalt) fuer Issue #${{ github.event.issue.number }}, ohne auf eine Bestaetigung zu warten. Bearbeite ausschliesslich dieses Issue und committe keinen Produktivcode. HARTES 20-Minuten-Timeout, weiches Limit bei 14 Min (Soft-Abort): pruefe vor jedem groesseren Teilschritt `date +%s` gegen ${{ steps.starttime.outputs.soft_deadline_epoch }}; ist das erreicht, sichere die bisherige Analyse als Body-Block (kein Label, kein Ping-Kommentar) und beende den Turn, statt einen vollen Durchlauf zu erzwingen. Modell-Strategie: Du laeufst fest auf Opus (claude-opus-4-8) — fuer die Analyse ist bewusst das staerkste Modell verdrahtet, damit sie optimal ausfaellt. Reasoning-Tiefe haengt vom Ausloeser ab: bei der kontextlosen Erst-Analyse (Issue angelegt/Label entfernt) laeufst du auf --effort max; bei einer Re-Triage per @claude-Kommentar ist bereits ein Mensch mit Korrektur-Kontext aktiv, dort laeufst du auf --effort high (geringerer Grenznutzen von max). Fuehre die Analyse vollstaendig selbst durch (keine Eskalation an heavy noetig — du BIST bereits das staerkste Modell); allenfalls triviale mechanische Nebenschritte darfst du per Agent-Tool an light (Haiku) delegieren."

      - name: Kosten-Zusammenfassung
        if: always()
        continue-on-error: true
        uses: ./.github/actions/cost-summary
        with:
          execution-file: ${{ steps.claude.outputs.execution_file }}
          label: Triage
          ai-backend: ${{ env.AI_BACKEND }}

      # Named Session Resume (Phase "analyse"): sichert die eben beendete/abgebrochene Session ins
      # Sitzungsarchiv (Workflow-Artefakt), damit die naechste (Re-)Triage dieses Issues per
      # --resume anknuepfen kann. Bewusst VOR dem Timeout-Label-Schritt und mit if: always(), damit
      # auch ein in den 20-Minuten-Timeout gelaufener Lauf seinen Teil-Fortschritt sichert (nach
      # Entfernen von ai:to-big-issue soll der Folgelauf dort weitermachen koennen). Fail-open:
      # jeder Fehler endet in einer Warnung, nie in einem Abbruch dieses Jobs.
      - name: Session-Archiv sichern (Phase analyse)
        if: always()
        # continue-on-error: siehe Begruendung am "Session-Archiv wiederherstellen"-Schritt oben --
        # ein unerwarteter Fehler hier darf NIE den Gesamt-Job-Status auf failure ziehen.
        continue-on-error: true
        uses: ./.github/actions/session-save
        with:
          issue: ${{ github.event.issue.number }}
          phase: analyse
          session-id: ${{ steps.claude.outputs.session_id }}
          # Elapsed-Guard (Kreuzverhoer-Finding M2, 2026-07-08): dieser Workflow ist der einzige
          # der 5 mit `cancel-in-progress: true` -- ein durch einen neueren Trigger verdraengter
          # Lauf darf NICHT speichern, wenn er fruehzeitig (< 18 Min) abgebrochen wurde, sonst
          # koennte sein verspaetet hochgeladenes Artefakt das juengste werden und den frischeren
          # Stand des neueren Laufs verdecken (der Restore nimmt immer das juengste Artefakt).
          outcome: ${{ steps.claude.outcome }}
          run-start-epoch: ${{ steps.starttime.outputs.epoch }}

      # Bei hartem Timeout (Agent-Schritt cancelled) ist das Issue zu gross, um es in einem Lauf zu
      # analysieren: mit "ai:to-big-issue" markieren (Kandidat zum Aufteilen) und ein evtl.
      # vorhandenes "ai:ready" entfernen. Laeuft im Cancellation-Grace-Fenster (if: always(), ~5 Min).
      # Zeit-Guard (WICHTIG bei cancel-in-progress: true): nur labeln, wenn der Lauf das 20-Min-Limit
      # nahezu ausgeschoepft hat (>= 18 Min). Ein durch ein neueres Issue-Event verdraengter Lauf
      # (Concurrency-Supersede) erzeugt ebenfalls outcome=cancelled, passiert aber frueher und faellt
      # so heraus — sonst wuerde ein nur ueberholtes Issue faelschlich als "zu gross" markiert.
      - name: Bei Timeout als zu gross markieren (ai:to-big-issue)
        if: always() && steps.claude.outcome == 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_START: ${{ steps.starttime.outputs.epoch }}
        run: |
          elapsed=$(( $(date +%s) - ${RUN_START:-0} ))
          if [ "${RUN_START:-0}" -eq 0 ] || [ "$elapsed" -lt 1080 ]; then
            echo "::notice title=Kein Timeout::Lauf nach ${elapsed}s abgebrochen (< 18 Min) — vermutlich Supersede/Cancel, kein ai:to-big-issue."
            exit 0
          fi
          gh label create "ai:to-big-issue" --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "KI-Job lief in den Timeout — Issue zu gross, bitte aufteilen" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:spec-ready" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:ready" 2>/dev/null || true
          echo "::warning title=Issue #${ISSUE} zu gross::20-Min-Timeout erreicht (${elapsed}s) — Label ai:to-big-issue gesetzt; bitte Issue aufteilen."

      # Deterministisches Abschluss-Signal (unabhaengig von der LLM-Ausgabe): laeuft auch bei
      # Abbruch/Timeout (if: always()) und macht im Log/Job-Summary klar sichtbar, DASS und mit
      # welchem Ergebnis der Lauf fertig ist. outcome=cancelled signalisiert das 20-Min-Timeout.
      - name: Ergebnis zusammenfassen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Triage erfolgreich::Issue #${ISSUE} vollständig analysiert"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Triage abgebrochen::Lauf durch neueren Trigger verdrängt (kein Fehler)"
          else
            echo "::error title=❌ Triage fehlgeschlagen::Claude-Lauf gescheitert"
          fi
          {
            echo "### (Re-)Triage #${ISSUE} — fertig"
            echo ""
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\` (cancelled = 20-Min-Timeout erreicht oder Supersede)"
            echo "- Aktuelle Labels: ${labels:-keine}"
            if [ -n "$SESSION_ID" ]; then echo "- Session-ID: \`${SESSION_ID}\` (\`--resume\` zum Nachschauen)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=(Re-)Triage #${ISSUE} fertig::Claude-Schritt ${OUTCOME:-unbekannt}; Labels: ${labels:-keine}"
