name: Optimize Images

# Einmaliger, manuell ausgelöster Nachzieh-Sweep für den Bild-Entfernungs-Job aus
# 06-claude-pr-documenter.yml (.github/scripts/pr-image-strip.sh, Issue #1021): dieser
# lief bisher nur automatisch beim MERGE eines PRs bzw. einzeln per workflow_dispatch-
# Catch-up. Historische PRs/Issues (vor Einführung des Sweeps) blieben unbereinigt.
#
# Dieser Workflow zieht den Sweep einmalig über den gesamten Altbestand nach
# (.github/scripts/image-strip-backfill.sh):
#   - alle geschlossenen PRs (Body + Konversations-/Inline-Kommentare + Closing-Issues)
#   - alle geschlossenen Issues direkt (Body + Kommentare), auch ohne verlinkten PR
#
# Best-effort + idempotent wie der Basis-Sweep: ein erneuter Lauf schreibt nur dort,
# wo noch unbereinigte Bild-Referenzen stehen. Kein LLM-Lauf — reine Regel-Logik.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        # Default TRUE mit Absicht: der Lauf PATCHt Bodies und Kommentare des gesamten
        # Repo-Verlaufs und ist nicht rückgängig zu machen. Der Trockenlauf zeigt in den
        # Job-Logs, was er anfassen würde — erst ein bewusstes Umschalten auf false
        # schreibt (Review-Finding PR #1043 F5).
        description: 'Nur protokollieren, nichts schreiben (erst nach Sichtprüfung auf false stellen)'
        type: boolean
        default: true

concurrency:
  group: image-strip-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    # Grosszügig bemessen: mehrere hundert PRs/Issues, je mehrere gh-API-Calls
    # (Body + Kommentar-Liste + Einzel-Patches) inkl. Retries und Rate-Limit-Wartezeiten.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: App-Token holen (höheres Rate-Limit für Massen-Edits)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 🧼 Bild-Backfill über gesamten Altbestand
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice title=Trockenlauf::dry_run=true — es wird NICHTS geschrieben. Für den echten Lauf erneut mit dry_run=false starten."
            bash .github/scripts/image-strip-backfill.sh "${{ github.repository }}" --dry-run
          else
            echo "::warning title=Schreibender Lauf::dry_run=false — Bodies und Kommentare werden tatsächlich geändert."
            bash .github/scripts/image-strip-backfill.sh "${{ github.repository }}"
          fi
