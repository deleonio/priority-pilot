name: Hermes Spec (ai:spec-ready)

# Schreibt die ROTEN Tests (ausführbarer Vertrag) für ein Issue, sobald es
# das Label "ai:spec-ready" erhält UND bereits "ai:analyzed" trägt.
#
# Setzt Hermes Agent (Nous Research) — Provider wählbar per Issue-Label:
#   Default: DeepSeek via Nous Portal (NOUS_PORTAL_TOKEN)
# Provider: Nous Portal + DeepSeek (provider=custom)
#
# Voraussetzungen: NOUS_PORTAL_TOKEN

on:
  issues:
    types: [labeled]

concurrency:
  group: hermes-spec-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  spec:
    if: >-
      ${{ github.event.label.name == 'ai:spec-ready'
          && contains(github.event.issue.labels.*.name, 'ai:analyzed')
          && github.event.issue.state == 'open' }}
    runs-on: ubuntu-latest
    # Backstop (weit über der Soft-Deadline von 14 Min) — fängt einen hängenden Agent
    # ab (Prompt-Deadline ignoriert, API-Call hängt), ohne das graceful Save
    # (Session-Archiv) bei der Soft-Deadline zu stören.
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      HERMES_HOME: /tmp/hermes-ci
    permissions:
      contents: read
      id-token: write
      actions: write # Cache-Speicher (actions/cache Post-Step)
      pull-requests: write
      issues: write
    steps:
      - name: Startzeit merken (für Timeout-Erkennung + weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 840))" >> "$GITHUB_OUTPUT"  # 14 min (Puffer vor 20-Min-GitHub-Timeout)

      - name: Voraussetzung prüfen (GitHub-App-Secrets)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::GitHub-App-Secrets fehlen — Lauf wird übersprungen. GitHub App anlegen (Contents/Issues/Pull requests = Read and write), aufs Repo installieren und beide Werte als Repo-Secrets hinterlegen."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: GH_TOKEN-Fallback setzen (App-Token oder GITHUB_TOKEN)
        id: gh-token
        run: |
          APP_TOK="${{ steps.app-token.outputs.token }}"
          if [ -n "$APP_TOK" ] && [ "$APP_TOK" != "null" ]; then
            echo "token=$APP_TOK" >> "$GITHUB_OUTPUT"
            echo "::notice::Nutze GitHub-App-Token für gh-Befehle."
          else
            echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
            echo "::warning::App-Token nicht verfügbar — nutze GITHUB_TOKEN (Achtung: Label-Wechsel lösen ggf. keine Folge-Workflows aus)."
          fi

      - name: Checkout
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.gh-token.outputs.token }}

      - name: Cache-Key für uv berechnen
        id: uv-cache-key
        if: steps.preflight.outputs.configured == 'true'
        run: echo "week=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: uv-Paketcache wiederherstellen
        id: uv-cache
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
          key: uv-hermes-${{ runner.os }}-${{ steps.uv-cache-key.outputs.week }}
          restore-keys: uv-hermes-${{ runner.os }}-

      - name: Hermes installieren
        if: steps.preflight.outputs.configured == 'true'
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --skip-browser --skip-setup
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Hermes konfigurieren (Provider per Variable)
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          if [ "$LLM_PROVIDER" = "zai" ]; then
            hermes config set model.provider zai
            printf 'ZAI_API_KEY=%s\n' "$ZAI_API_KEY" > "$HERMES_HOME/.env"
            echo "::notice::Provider: Z.AI (GLM-5.1)"
          else
            hermes config set model.provider custom
            hermes config set model.base_url https://inference-api.nousresearch.com/v1
            hermes config set model.api_key "${{ secrets.NOUS_PORTAL_TOKEN }}"
            echo "::notice::Provider: Nous Portal (DeepSeek)"
          fi
          pip install mcp -q
          hermes mcp add kolibri --url https://public-ui-kolibri-mcp.vercel.app/mcp
      - name: Session-Archiv herunterladen (Phase spec)
        id: session-dl
        if: steps.preflight.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hermes-session-issue-${{ github.event.issue.number }}-spec
          path: /tmp/hermes-session-restore

      - name: Session wiederherstellen
        id: session-restore
        if: steps.preflight.outputs.configured == 'true' && steps.session-dl.outcome == 'success'
        run: |
          if [ -f /tmp/hermes-session-restore/hermes-session.tar.gz ]; then
            mkdir -p "$HERMES_HOME"
            tar -xzf /tmp/hermes-session-restore/hermes-session.tar.gz -C "$HERMES_HOME"
            if [ -f "$HERMES_HOME/session_id.txt" ]; then
              RID=$(cat "$HERMES_HOME/session_id.txt")
              echo "resume_arg=$RID" >> "$GITHUB_OUTPUT"
              echo "::notice::Session #$RID wiederhergestellt"
            fi
          fi

      - name: Auth prüfen (provider-spezifisch)
        if: steps.preflight.outputs.configured == 'true'
        env:
          NOUS_PORTAL_TOKEN: ${{ secrets.NOUS_PORTAL_TOKEN }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
        run: |
          if [ "$LLM_PROVIDER" = "zai" ]; then
            if [ -z "$ZAI_API_KEY" ]; then
              echo "::error title=Auth fehlt::ZAI_API_KEY nicht gesetzt — als Repo-Secret hinterlegen"
              exit 1
            fi
            echo "ZAI_API_KEY vorhanden."
          else
            if [ -z "$NOUS_PORTAL_TOKEN" ]; then
              echo "::error title=Auth fehlt::NOUS_PORTAL_TOKEN nicht gesetzt — als Repo-Secret hinterlegen"
              exit 1
            fi
            echo "NOUS_PORTAL_TOKEN vorhanden."
          fi
      - name: Doppel-Run-Guard (existierender PR mit Closes #N)
        id: doppel-guard
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if ! existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,isDraft,closingIssuesReferences \
            --jq "[.[] | select((.closingIssuesReferences // []) | any(.number == ${ISSUE}))] | length" 2>/dev/null)"; then
            echo "::warning::Doppel-Run-Guard: gh-API nicht erreichbar — fail-open."
            existing=0
          fi
          if [ "${existing:-0}" -gt 0 ]; then
            echo "::notice::Spec übersprungen — PR existiert bereits für Issue #$ISSUE."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: pnpm einrichten
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Node.js einrichten
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Abhängigkeiten installieren
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Git-Hooks installieren (lefthook)
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm exec lefthook install

      - name: Spec via Hermes
        id: hermes
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        env:
          NOUS_PORTAL_TOKEN: ${{ secrets.NOUS_PORTAL_TOKEN }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
        run: |
          if [ "$LLM_PROVIDER" = "zai" ]; then
            PROVIDER_FLAG="--provider zai"
            MODEL="glm-5.1"
          else
            PROVIDER_FLAG="--provider custom"
            MODEL="deepseek/deepseek-v4-pro"
            hermes config set model.api_key "$NOUS_PORTAL_TOKEN"
          fi

          cat > /tmp/hermes-prompt.txt << 'HERMES_EOF'
          Das Label `ai:spec-ready` wurde an Issue #ISSUE_NR gesetzt — schreibe jetzt die ROTEN Tests (den Vertrag) für dieses Issue.

          Folge dem Spec-Workflow .ai-knowledge/ticket-spec.md:
            1. Beginne SOFORT mit der Arbeit — keine Wartezeit!
            2. Branch anlegen: git switch -c feat/issue-ISSUE_NR-<kurzname>. Den Akzeptanzkriterien-Block primär aus dem BODY-Block des Issues entnehmen (gh issue view ISSUE_NR --json body -q .body, Abschnitt zwischen <!-- KI-ANALYSE:START stand=... --> und <!-- KI-ANALYSE:END -->).
            3. ROTE Tests schreiben — je Akzeptanzkriterium echte, ausführbare Tests (server/src/**/*.test.ts, frontend/src/**/*.test.ts, frontend/e2e/*.spec.ts). Sie prüfen echtes Soll-Verhalten und werden grün, sobald der Code existiert. KEINEN Produktivcode schreiben.
            4. Rote Tests als ERSTEN Commit (test: rote Spec-Tests für #ISSUE_NR), Branch pushen, git push -u origin HEAD. DRAFT-PR erstellen (gh pr create --draft) mit Closes #ISSUE_NR im Body. KEIN ai:needs-review setzen (PR ist Draft).
            5. GIB VERDICT AUS — KEINE LABELS SELBST SETZEN!

          ⚠️ LABELS: Du darfst KEINE Labels setzen oder entfernen (`gh issue edit --add-label` / `--remove-label`)! Der Workflow übernimmt den Label-Wechsel automatisch anhand deines VERDICT-Markers — mit dem korrekten App-Token, das Folgeworkflows triggert.

          VERDICT-MARKER: Gib GANZ AM ENDE deiner letzten Antwort GENAU EINE Zeile aus:
            - `VERDICT: ready` (rote Tests geschrieben + Draft-PR erstellt → gibt Issue zur Umsetzung frei)
            - `VERDICT: spec-ready` (Partial — Tests unvollständig, braucht Folgelauf)
          Der Workflow parst diese Zeile und setzt die Labels.

          WERKZEUGE:
            Du hast Bash (für gh, git, pnpm), Datei-Tools sowie KoliBri-MCP-Tools (mcp_kolibri_search, mcp_kolibri_fetch für KoliBri-Komponenten). Nutze gh issue, gh pr, git, pnpm, read_file, write_file. GH_TOKEN authentifiziert gh-Befehle.

          WEICHES ZEITLIMIT (Soft-Abort) — SOFORT STOPPEN, NICHT AUFRÄUMEN:
            Beginne SOFORT mit der Arbeit. Deine Soft-Deadline ist SOFT_DEADLINE (Unix-Epoch).
            Prüfe VOR JEDEM Tool-Aufruf: Ist `[ $(date +%s) -ge SOFT_DEADLINE ] && echo OVER`?
            Wenn OVER: **BRICH AUF DER STELLE AB** — nicht den aktuellen Schritt zuende führen,
            nicht aufräumen, nicht zusammenfassen. Commite+pushe den aktuellen Stand (auch
            unvollständig) als Branch/Draft-PR mit TODO-Notiz. Setze KEIN ai:ready. Beende den
            Turn sofort.

          WICHTIG:
            - Bearbeite ausschließlich dieses eine Issue.
            - Weise dich NICHT selbst zu (@me wäre der Bot).
            - Keine interaktive Bestätigung nötig — Label ai:spec-ready autorisiert den Lauf.
          HERMES_EOF

          sed -i "s/#ISSUE_NR/${{ github.event.issue.number }}/g" /tmp/hermes-prompt.txt
          sed -i "s/SOFT_DEADLINE/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/hermes-prompt.txt

          RESUME_ARG=""
          if [ -n "${{ steps.session-restore.outputs.resume_arg }}" ]; then
            RESUME_ARG="--resume ${{ steps.session-restore.outputs.resume_arg }}"
          fi

          hermes chat -q "$(cat /tmp/hermes-prompt.txt)" \
            $RESUME_ARG \
            -Q --yolo $PROVIDER_FLAG \
            -m "$MODEL" \
            -t "terminal,file" \
            --accept-hooks \
            2>&1 | tee /tmp/hermes-output.log
          # PIPESTATUS: Exit-Code von hermes chat durch pipe propagieren
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Hermes-Session-ID erfassen
        if: always()
        id: session
        run: |
          if [ -f /tmp/hermes-output.log ]; then
            sid="$(grep '^session_id:' /tmp/hermes-output.log | head -1 | sed 's/^session_id:[[:space:]]*//')"
            if [ -n "$sid" ]; then
              echo "session_id=$sid" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Session-Archiv packen
        if: always() && steps.session.outputs.session_id != ''
        continue-on-error: true
        run: |
          SID="${{ steps.session.outputs.session_id }}"
          if [ -n "$SID" ] && [ -d "$HERMES_HOME" ]; then
            echo "$SID" > "$HERMES_HOME/session_id.txt"
            # Nur sessions/ + session_id.txt archivieren (keine Config, Caches, MCP-Daten).
            tar -czf /tmp/hermes-session.tar.gz -C "$HERMES_HOME" sessions session_id.txt 2>/dev/null || \
            tar -czf /tmp/hermes-session.tar.gz -C "$HERMES_HOME" session_id.txt
            echo "::notice::Session #$SID gepackt"
          fi

      - name: Session hochladen
        if: always() && steps.session.outputs.session_id != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-session-issue-${{ github.event.issue.number }}-spec
          path: /tmp/hermes-session.tar.gz
          retention-days: 30
          overwrite: true

      - name: Label-Post-Assertion (VERDICT parsen, Labels via App-Token force-setzen)
        if: always() && steps.preflight.outputs.configured == 'true' && (steps.hermes.outcome == 'success' || steps.hermes.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          # VERDICT aus Hermes-Output parsen
          verdict=""
          if [ -f /tmp/hermes-output.log ]; then
            verdict="$(grep -oP 'VERDICT:\s*\K.*' /tmp/hermes-output.log | tail -1 | tr -d '[:space:]' || true)"
          fi
          echo "Hermes-Verdict aus Output: '${verdict:-keins}'"

          # Safe-Default bei fehlendem VERDICT
          if [ "$verdict" != "ready" ] && [ "$verdict" != "spec-ready" ]; then
            echo "::warning::Kein gültiger VERDICT — Safe-Default: spec-ready (Partial)"
            verdict="spec-ready"
          fi

          # Labels sicherstellen
          gh label create "ai:ready" --repo "$GITHUB_REPOSITORY" --color 0E8A16 2>/dev/null || true
          gh label create "ai:spec-ready" --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true

          # FORCE-SET via App-Token
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:spec-ready" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:ready" 2>/dev/null || true

          if [ "$verdict" = "ready" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:ready"
            echo "::notice::Label gesetzt (App-Token): ai:ready (Issue zur Umsetzung freigegeben)"
          else
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:spec-ready"
            echo "::notice::Label gesetzt (App-Token): ai:spec-ready (Partial — Folgelauf nötig)"
          fi

      - name: Ergebnis zusammenfassen
        if: always() && steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.hermes.outcome }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Spec erfolgreich::Issue #${ISSUE} — Rote Tests geschrieben"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Spec abgebrochen"
          else
            echo "::error title=❌ Spec fehlgeschlagen"
          fi
          {
            echo "### Spec #${ISSUE} — fertig"
            echo "- Hermes-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Labels: ${labels:-keine}"
            if [ -n "$SESSION_ID" ]; then echo "- Session-ID: \`${SESSION_ID}\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"
