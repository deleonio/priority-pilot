name: Hermes PR Fixup (Findings umsetzen)

# Reagiert auf das Label "ai:needs-changes" (vom Review gesetzt) und setzt die
# zutreffenden Findings um.
# Setzt Hermes **oder Claude Code** — wählbar per `vars.AGENT` (default: hermes).
#   review → ai:needs-changes → fixup → ai:needs-review → review → ... bis 🟢

on:
  pull_request:
    types: [labeled]

concurrency:
  group: hermes-pr-fixup-${{ github.event.pull_request.number }}-${{ github.event.label.name == 'ai:needs-changes' }}
  cancel-in-progress: true

jobs:
  fixup:
    if: >-
      ${{ github.event.label.name == 'ai:needs-changes'
          && github.event.pull_request.draft == false
          && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      HERMES_HOME: /tmp/hermes-ci
    permissions:
      contents: read
      id-token: write
      actions: write
      pull-requests: write
    steps:
      - name: Startzeit merken (für weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 600))" >> "$GITHUB_OUTPUT"

      - name: Checkout (PR-Head-Branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Hermes/Claude Code
        id: setup
        uses: ./.github/actions/setup-hermes
        with:
          agent: ${{ vars.AGENT }}
          needs-mcp: false
          event-type: ${{ github.event_name }}
          ticket-ref: ${{ github.event.pull_request.number }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          claude-model: ${{ vars.LLM_PROVIDER == 'openrouter' && 'poolside/laguna-s-2.1:free' || 'glm-5.1' }}
          nous-portal-token: ${{ secrets.NOUS_PORTAL_TOKEN }}
          deepseek-model: deepseek/deepseek-v4-flash

      - name: pnpm einrichten
        if: steps.setup.outputs.configured == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Node.js einrichten
        if: steps.setup.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Abhängigkeiten installieren
        if: steps.setup.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Git-Hooks installieren (lefthook)
        if: steps.setup.outputs.configured == 'true'
        run: pnpm exec lefthook install

      # Merge-Konflikte erkennen und automatisch auflösen (VOR dem LLM-Schritt)
      - name: Merge-Konflikte prüfen und auflösen
        id: resolve-conflicts
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if ! state_json="$(gh pr view "$PR" --repo "$REPO" --json mergeable,mergeStateStatus 2>/dev/null)"; then
            echo "conflict=unknown" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mergeable="$(echo "$state_json" | jq -r '.mergeable')"
          merge_state="$(echo "$state_json" | jq -r '.mergeStateStatus')"
          if [ "$mergeable" = "MERGEABLE" ]; then echo "conflict=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$mergeable" = "UNKNOWN" ] || [ "$mergeable" = "null" ]; then
            sleep 5
            state_json="$(gh pr view "$PR" --repo "$REPO" --json mergeable,mergeStateStatus 2>/dev/null || true)"
            mergeable="$(echo "$state_json" | jq -r '.mergeable' 2>/dev/null || echo 'UNKNOWN')"
          fi
          if [ "$mergeable" = "UNKNOWN" ]; then echo "conflict=unknown" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$merge_state" = "DIRTY" ] || [ "$mergeable" = "CONFLICTING" ]; then
            git fetch origin "$TARGET_BRANCH" --depth=1 --no-tags
            if git merge origin/"$TARGET_BRANCH" --no-ff --no-edit -m "Auto-merge: resolve conflicts for PR #$PR" 2>/dev/null; then
              git push origin HEAD:"$HEAD_BRANCH"
              echo "conflict=resolved" >> "$GITHUB_OUTPUT"
            else
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "conflict=needs_resolution" >> "$GITHUB_OUTPUT"
              else
                git merge --abort 2>/dev/null || true
                echo "conflict=aborted" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

      # Stop-Guard: > 10 PR-Commits → Loop stoppen
      - name: Stop-Guard (> 10 PR-Commits)
        id: stop-guard
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if ! commits="$(gh pr view "$PR" --repo "$REPO" --json commits --jq '.commits | length' 2>/dev/null)"; then
            echo "stop=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR" --repo "$REPO" --body "🛑 Stop-Guard: gh-API nicht erreichbar — fail-closed." 2>/dev/null || true
            exit 0
          fi
          if [ "${commits:-0}" -gt 10 ]; then
            echo "stop=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR" --repo "$REPO" --body "🛑 **Stop-Guard: Fixup-Loop gestoppt** (${commits} Commits > 10). Bitte manuell prüfen." 2>/dev/null || true
            exit 0
          fi
          echo "stop=false" >> "$GITHUB_OUTPUT"

      - name: Supersede-Check
        id: supersede-check
        if: steps.setup.outputs.configured == 'true' && steps.stop-guard.outputs.stop != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          running=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs \
            --jq '.workflow_runs[] | select(.name == "Hermes PR Fixup (Findings umsetzen)" and (.status == "queued" or .status == "in_progress") and .head_branch == $ENV.HEAD_BRANCH and .id != ${{ github.run_id }}) | .id' 2>/dev/null | head -1)
          if [ -n "$running" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Findings umsetzen via Hermes
        id: hermes
        if: steps.setup.outputs.configured == 'true' && steps.stop-guard.outputs.stop != 'true' && steps.supersede-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          cat > /tmp/hermes-prompt.txt << 'HERMES_EOF'
          Auf Pull Request #PR_NR hat der Review das Label `ai:needs-changes` gesetzt. Arbeite die offenen Kreuzverhör-Findings ab.

          Vorgehen:
            0. KONFLIKTAUFLÖSUNG (falls nötig): Prüfe mit git status und git diff --name-only --diff-filter=U auf Merge-Konflikte. Bei Konflikten: analysieren, eindeutig auflösen, git add, git commit, git push. Erst DANN mit Findings weitermachen.
            1. Beginne SOFORT mit der Arbeit — keine Wartezeit!
            2. Findings lesen: gh pr view, gh pr diff, Review-Threads (gh api .../pulls/PR_NR/comments) und CI (gh pr checks).
            3. Zutreffende, EINDEUTIGE Findings fixen: Code ändern, vor jedem Commit lokale Checks: pnpm format && pnpm exec prettier --check . && pnpm lint && pnpm knip. Erst wenn alle grün, committen und pushen. Im jeweiligen Thread antworten und auflösen. Mehrdeutige/große Punkte dem Menschen überlassen.
            4. CI-CHECKS BEHANDELN (falls rot): gh pr checks --json name,bucket,workflow zeigt alle CI-Checks. Für jeden roten Check:
               a) FLAKY-TEST ERKENNEN: Ist der Fehler ein Timeout, eine Timing-Instabilität, ein Transient? UND der Test berührt thematisch keine Logik aus diesem PR-Diff? → FLAKY: einmalig via gh run rerun <failed-run-id> --failed neu starten. Danach 60s warten, dann gh pr checks erneut prüfen.
               b) ECHTER CI-FEHLER: Den fehlschlagenden Job-Log lesen, Root Cause identifizieren, Code ändern, lokale Checks ausführen, committen und pushen.
               c) UNRELATED CI-FEHLER: In PR-Kommentar dokumentieren. Nicht fixen.
            5. ABSCHLUSS (ALLERLETZTER Schritt): Gib eine Zeile aus: `VERDICT: fixup-complete` (alle Findings behoben) oder `VERDICT: needs-changes` (noch offene Findings).

          ⚠️ LABELS: Du darfst KEINE Labels setzen oder entfernen! Der Workflow übernimmt das automatisch.

          ZEITLIMIT: Deine Soft-Deadline ist SOFT_DEADLINE (Unix-Epoch). Prüfe `[ $(date +%s) -ge SOFT_DEADLINE ]` vor jedem größeren Schritt. Bei OVER: aktuellen Stand committen+pushen, Turn sofort beenden.

          Stop-Guard: Ein Workflow-Step zählt die PR-Commits und stoppt bei > 10.
          HERMES_EOF

          sed -i "s/#PR_NR/${{ github.event.pull_request.number }}/g" /tmp/hermes-prompt.txt
          sed -i "s/SOFT_DEADLINE/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/hermes-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/hermes-prompt.txt)" \
            ${{ steps.setup.outputs.resume-flag }} \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/hermes-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Save Session
        if: always() && steps.setup.outputs.configured == 'true'
        uses: ./.github/actions/save-session
        with:
          session-artifact-name: ${{ steps.setup.outputs.session-artifact-name }}
          configured: ${{ steps.setup.outputs.configured }}

      - name: Label-Post-Assertion (Labels via App-Token force-setzen)
        if: always() && steps.setup.outputs.configured == 'true' && steps.hermes.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          verdict=""
          if [ -f /tmp/hermes-output.log ]; then
            verdict="$(grep -oP 'VERDICT:\s*\K.*' /tmp/hermes-output.log | tail -1 | tr -d '[:space:]' || true)"
          fi
          echo "Hermes-Verdict aus Output: '${verdict:-keins}'"

          PR_COMMITS="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json commits \
            --jq '.commits | length' 2>/dev/null || echo "0")"
          REVIEW_TS="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments \
            --jq '[.comments[] | select(.body | test("<!-- ai-review -->"))] | last | .createdAt' 2>/dev/null || echo "")"
          if [ -n "$REVIEW_TS" ] && [ "$REVIEW_TS" != "null" ]; then
            COMMITS_SINCE_REVIEW="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/commits" \
              --jq "[.[] | select(.commit.committer.date > \"${REVIEW_TS}\")] | length" 2>/dev/null || echo "0")"
          else
            COMMITS_SINCE_REVIEW="$PR_COMMITS"
          fi
          ARTIFACTS_OK="false"
          if [ "${COMMITS_SINCE_REVIEW:-0}" -gt 0 ]; then
            ARTIFACTS_OK="true"
          fi

          if [ "$verdict" = "fixup-complete" ]; then
            if [ "$ARTIFACTS_OK" != "true" ]; then
              echo "::error title=❌ Keine Fixup-Commits::VERDICT fixup-complete, aber 0 Commits seit Review."
              exit 1
            fi
            final="fixup-complete"
          elif [ "$verdict" = "needs-changes" ]; then
            if [ "$ARTIFACTS_OK" = "true" ]; then
              final="fixup-complete"
            else
              final="needs-changes"
            fi
          else
            if [ "$ARTIFACTS_OK" = "true" ]; then
              final="fixup-complete"
            else
              final="needs-changes"
            fi
          fi

          gh label create "ai:needs-review" --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true
          gh label create "ai:needs-changes" --repo "$GITHUB_REPOSITORY" --color D93F0B 2>/dev/null || true

          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai:needs-changes 2>/dev/null || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai:needs-review 2>/dev/null || true

          if [ "$final" = "fixup-complete" ]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ai:needs-review
            echo "::notice::Label gesetzt: ai:needs-review"
          else
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ai:needs-changes
            echo "::notice::Label gesetzt: ai:needs-changes"
          fi

      - name: Soft-Abort-Fortsetzung erkennen und begrenzen (ai:continued)
        if: always() && steps.setup.outputs.configured == 'true' && steps.hermes.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          has_continued="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "ai:continued")' 2>/dev/null || echo false)"
          if [ "${has_continued:-false}" != "true" ]; then exit 0; fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "🛑 Fixup-Fortsetzungs-Obergrenze erreicht — bitte manuell prüfen." 2>/dev/null || true

      - name: Ergebnis zusammenfassen
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.hermes.outcome }}
        run: |
          labels="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Fixup erfolgreich::PR #${PR}"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Fixup abgebrochen"
          else
            echo "::error title=❌ Fixup fehlgeschlagen"
          fi
          {
            echo "### Fixup #${PR}"
            echo "- Hermes-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Labels: ${labels:-keine}"
          } >> "$GITHUB_STEP_SUMMARY"
