name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.4.0
          cache: pnpm
      # install loest ueber den client-prepare-Hook die Vertragstypen aus (openapi-typescript, kein Java).
      - name: Install
        run: pnpm install --frozen-lockfile
      # Playwright-Browser cachen, damit nicht jeder Lauf Chromium neu herunterladen muss.
      # Schluessel an den pnpm-Lockfile gekoppelt (Cache-Bust bei Playwright-Upgrade).
      - name: Playwright-Browser-Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      # Nur Chromium installieren — playwright.config.ts definiert ausschliesslich das chromium-Projekt.
      # --with-deps zieht die System-Abhaengigkeiten nach (liegen ausserhalb des Cache-Pfads).
      - name: Playwright-Browser installieren
        run: pnpm --filter frontend exec playwright install --with-deps chromium
      - name: Format-Check
        run: pnpm exec prettier --check .
      - name: Lint
        run: pnpm lint
      # Build regeneriert die Vertragstypen frisch aus openapi.yml und type-checkt dagegen —
      # damit kann eine veraltete/inkonsistente Analyse oder API-Drift nicht nach main gelangen.
      - name: Build
        run: pnpm -r build
      # Nur Frontend hier — die Server-Suite (priority-pilot) läuft ausschließlich über das
      # Coverage-Gate unten, sonst würde sie pro CI-Lauf doppelt ausgeführt (Review #115).
      - name: Test (frontend)
        run: pnpm --filter frontend test
      # Coverage-Gate (gezielt, nicht repo-weit): node:test misst die Abdeckung der reinen
      # Logik-Schicht (server/src/logics) und bricht unter den Schwellen ab. Deckt zugleich die
      # komplette Server-Suite ab. Frontend-lib-Coverage ist vorbereitet (vitest.config.ts), aber
      # erst nach `pnpm add -D @vitest/coverage-v8` aktiv.
      - name: Coverage-Gate (server/src/logics)
        run: pnpm --filter priority-pilot test:coverage
      # Workflow-/CI-Vertraege (statische YAML-Asserts via node:test ueber tsx, AUSSERHALB der
      # pnpm-Workspaces). Deckt alle `.github/workflows/*.test.ts` ab: den Deploy-Vertrag auf
      # release.yml (#152, main-Trigger + Build + rsync, kein Tag/Release/SSH-Forced-Command) und den
      # Modell-Delegations-Vertrag (model-delegation.test.ts: Sonnet-Start + Subagent-Delegation statt
      # des entfernten JS-Routers). Ob die headless Action das Subagent-Modell-Override real honoriert,
      # wird per Workflow-Lauf an einem Scratch-Issue verifiziert (CI-Konfig-Ebene).
      - name: Test (Workflow-/CI-Vertraege)
        run: npx -y tsx@4.22.4 --test ".github/workflows/"*.test.ts
      # E2E: Playwright startet Backend (frische In-Memory-DB) + Vite selbst (siehe playwright.config.ts) —
      # kein separater Server-Start in der Pipeline noetig.
      - name: E2E
        run: pnpm --filter frontend test:e2e
      # Bei Fehlschlag den Playwright-Report als Artefakt sichern, damit Regressionen
      # nachvollziehbar bleiben, ohne den Lauf lokal reproduzieren zu muessen.
      - name: Playwright-Report sichern
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
