name: CI

on:
  push:
    branches: [main]
    # Reine Doku-/Wissens-Commits (oft Auto-Commit direkt auf main) veraendern kein dist und
    # brauchen kein CI. Greift nur, wenn ALLE geaenderten Pfade passen — gemischte Commits
    # (Code + Doku) laufen weiterhin voll. .github/** bewusst NICHT ausgenommen (Workflow-
    # Aenderungen muessen die Contract-Tests neu fahren). Nur auf push, NICHT auf pull_request,
    # damit Doku-PRs ihren CI-Check (Gate-/Auto-Merge-Vorbedingung) behalten.
    paths-ignore:
      - '**/*.md'
      - '.ai-knowledge/**'
      - 'AGENTS.md'
      - 'LICENSE'
  # ready_for_review ergaenzt die Default-Typen (opened/synchronize/reopened), damit CI beim
  # Draft->Ready-Uebergang startet — der Moment, in dem implement den Spec-Draft review-bereit
  # macht. Ohne diesen Typ liefe CI erst beim naechsten Push nach dem Ready-Schalten an.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Pro Branch/PR serialisieren und stale Laeufe IMMER abbrechen: ein neuer CI-Lauf im selben
# Branch macht den vorherigen obsolet (nur der jeweils letzte Commit zaehlt). Das verhindert,
# dass schnelle Fixup-Pushes (synchronize) oder Auto-Commits auf main mehrere schwere E2E-Laeufe
# stapeln, deren Abschluss jeweils Gate/Auto-Merge weckt. main-Push-CI laeuft in eigener Gruppe
# (ci-refs/heads/main), PR-CI je PR-Nummer — beide brechen ihren eigenen Vorlauf ab. Deploy ist
# entkoppelt (eigener push-Trigger + eigene concurrency), ein Cancel hier gefaehrdet ihn nicht.
# Gilt Workflow-weit: bricht ALLE Jobs (verify + alle e2e-Shards) eines stale Laufs gemeinsam ab.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# GATE-KONTRAKT (nicht brechen): Gate/Auto-Merge (claude-pr-gate-merge.yml) keyt auf den Workflow-
# NAMEN `CI` (`select(.workflow == "CI")`, `any(.[]; .workflow == "CI")`), NICHT auf einen Job-Namen.
# Solange dieser Workflow `name: CI` heisst, zaehlen ALLE Job-Checks (verify + e2e-Shards) als „CI":
# ein roter -> Gate setzt ai:needs-fixup; alle gruen -> mergebar. `workflow_run` feuert pro Run
# (nicht pro Job), das Fan-out bleibt also EIN Gate-Trigger. Jobs duerfen frei aufgeteilt/umbenannt
# werden — der Workflow-Name `CI` aber nicht.
jobs:
  # Nicht-E2E-Halbzeit: Format/Lint/Build/Unit/Coverage/Contracts. Laeuft PARALLEL zu den e2e-Shards
  # (frueher seriell VOR E2E). Der build-Step regeneriert die Vertragstypen frisch aus openapi.yml
  # und type-checkt dagegen — so kann API-Drift nicht nach main gelangen (E2E braucht ihn nicht, s. u.).
  verify:
    # Kein CI auf Draft-PRs: der Spec-Draft traegt per Design ROTE Tests, ein voller Lauf (inkl. E2E)
    # waere Verschwendung + rotes Rauschen. CI startet erst, wenn implement den PR ready markiert
    # (ready_for_review). push-Events (main) haben kein pull_request-Objekt -> laufen immer.
    # Spiegelt das Muster aus pr-needs-review-label.yml (draft == false).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    services:
      # Nur hier: die Server-Coverage-Suite (session.test.ts AK-5) verlangt eine laufende Redis-Instanz
      # unter redis://localhost:6379. Der E2E-Job braucht Redis NICHT — das E2E-Backend setzt
      # SESSION_STORE nicht und nutzt daher den Non-Redis-Store (siehe server/src/express/session.ts).
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc # zentrale Node-Version (gleicher Stand wie implement/fixup/deploy)
          cache: pnpm
      # install loest ueber den client-prepare-Hook die Vertragstypen aus (openapi-typescript, kein Java).
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format-Check
        run: pnpm exec prettier --check .
      - name: Lint
        run: pnpm lint
      # Schema-Validierung ALLER Workflows und Composite-Actions gegen die offiziellen
      # GitHub-Schemas (@action-validator). Faengt genau die Klasse Fehler, die sonst erst
      # beim Ausfuehren auffaellt — falsch geschriebene Keys, fehlende Pflichtfelder, kaputtes
      # YAML — und die im Pipeline-Kontext teuer ist: ein defekter Phasen-Workflow bleibt bis
      # zum naechsten Trigger unsichtbar. Bewusst VOR dem Build (billig, ~1s, schnelles Signal).
      # `paths`-Globs werden nicht mitgeprueft (das WASM-Modul kann es nicht, es warnt selbst).
      - name: GitHub-Actions-Schema
        run: pnpm lint:actions
      # Fixtures fuer .github/scripts/*.ts (node:test + tsx). Sichert die riskanteste Logik des
      # Validators ab: die eng gefasste Ausnahme fuer `concurrency.queue` darf GENAU diesen
      # Befund schlucken — ein zu weiter Filter faerbt das Gate still gruen.
      - name: Test (.github/scripts)
        run: pnpm test:scripts
      # Build regeneriert die Vertragstypen frisch aus openapi.yml und type-checkt dagegen —
      # damit kann eine veraltete/inkonsistente Analyse oder API-Drift nicht nach main gelangen.
      - name: Build
        run: pnpm -r build
      # Nur Frontend hier — die Server-Suite (server) läuft ausschließlich über das
      # Coverage-Gate unten, sonst würde sie pro CI-Lauf doppelt ausgeführt (Review #115).
      - name: Test (frontend)
        run: pnpm --filter frontend test
      # Coverage-Gate (gezielt, nicht repo-weit): node:test misst die Abdeckung der reinen
      # Logik-Schicht (server/src/logics) und bricht unter den Schwellen ab. Deckt zugleich die
      # komplette Server-Suite ab. Frontend-lib-Coverage ist vorbereitet (vitest.config.ts), aber
      # erst nach `pnpm add -D @vitest/coverage-v8` aktiv.
      - name: Coverage-Gate (server/src/logics)
        run: pnpm --filter server test:coverage

  # E2E gesharded ueber eine Matrix: jeder Shard ist eine EIGENE Runner-VM mit eigenem localhost —
  # dadurch kollidieren die festen Ports (Backend 3000 / Vite 4173) NICHT zwischen den Shards, und
  # `workers: 1` / `fullyParallel: false` in playwright.config.ts bleiben unangetastet (jeder Shard
  # ist fuer sich deterministisch, teilt weiterhin eine In-Memory-DB pro Backend-Prozess).
  # Playwright startet Backend + Vite selbst (playwright.config.ts webServer) — daher KEIN separater
  # Pipeline-Build-Step: das Backend baut sich beim Start selbst (server/nodemon.json exec:
  # `pnpm build && node dist/index.js`, inkl. build:api), das Frontend laeuft ueber `vite dev`. Deshalb
  # muessen die devDependencies installiert bleiben. KEIN Redis (E2E-Backend nutzt den MemoryStore,
  # da SESSION_STORE/NODE_ENV ungesetzt — siehe server/src/express/session.ts). Skaliert linear: neue
  # Specs verteilen sich auf die Shards, statt die Pipeline seriell zu verlaengern (E2E war ~58%).
  # ACHTUNG: Wird `shard: [...]` geaendert, MUSS der Nenner in `--shard=…/N` mitgezogen werden —
  # sonst verteilen sich die Specs falsch (frueher rot via workflow-consistency.test.ts, entfernt).
  e2e:
    # Kein CI auf Draft-PRs (identisch zu verify) — sonst liefen die teuren E2E-Shards auf dem
    # noch roten Spec-Draft. Startet erst ab ready_for_review; push-Events laufen immer.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Playwright-Image: Browser + System-Dependencies sind vorinstalliert (/ms-playwright via
    # PLAYWRIGHT_BROWSERS_PATH) — kein Browser-Install- und kein apt-Lauf (`--with-deps`) mehr.
    # ACHTUNG: Tag-Version MUSS bei Playwright-Upgrades mit @playwright/test in
    # frontend/package.json mitgezogen werden (bildet die fruehere Cache-Key-Kopplung ab).
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    strategy:
      # Einen roten Shard NICHT die anderen abbrechen lassen — volles Fehlersignal ueber alle Shards.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # git fehlt im Playwright-Image, actions/checkout braucht es (guarded: No-op falls doch vorhanden).
      # safe.directory: Container-Jobs mounten den Workspace mit fremdem UID-Owner — checkout fängt
      # das intern ab, aber lefthooks `prepare` (git rev-parse) stirbt sonst an dubious ownership.
      - name: git fuer checkout bereitstellen
        run: |
          command -v git >/dev/null || (apt-get update && apt-get install -y --no-install-recommends git)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc # zentrale Node-Version (gleicher Stand wie verify/implement/fixup/deploy)
          cache: pnpm
      # install loest ueber den client-prepare-Hook die Vertragstypen aus (openapi-typescript, kein Java).
      - name: Install
        run: pnpm install --frozen-lockfile
      # `exec playwright test --shard` (NICHT `test:e2e -- --shard`): pnpm reicht `--` sonst literal
      # ans Skript durch (bekannte Falle) — `exec` startet das Bin direkt. Nenner /4 == Matrix-Groesse
      # (Contract-Test E1). Playwrights Shard-Zuteilung ist deterministisch (stabile Test-Sortierung),
      # sichert reproduzierbare Verteilung ueber Wiederholungslaeufe.
      - name: E2E (shard ${{ matrix.shard }}/4)
        run: pnpm --filter frontend exec playwright test --shard=${{ matrix.shard }}/4
      # Bei Fehlschlag den Playwright-Report als Artefakt sichern, damit Regressionen nachvollziehbar
      # bleiben. Name je Shard eindeutig — actions/upload-artifact@v4 bricht bei doppelten Namen ab.
      - name: Playwright-Report sichern
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
