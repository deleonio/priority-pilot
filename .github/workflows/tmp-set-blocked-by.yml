name: tmp-set-blocked-by

# Einmal-Workflow: setzt die nativen Blocked-by-Relationen des Epics #1664.
# Laeuft nur auf diesem Wegwerf-Branch, der danach geloescht wird.

on:
  push:
    branches: [claude/set-blocked-by-1664]

permissions:
  issues: write

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Blocked-by fuer Epic 1664 setzen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          fail=0
          for B in 1666 1667 1668 1669 1670 1671 1672; do
            id="$(gh api "repos/$REPO/issues/1665" --jq .id)"
            if gh api -X POST "repos/$REPO/issues/$B/dependencies/blocked_by" -F issue_id="$id" >/dev/null; then
              echo "ok: #$B blocked by #1665"
            else
              echo "::error::#$B blocked by #1665 fehlgeschlagen"
              fail=1
            fi
            gh issue view "$B" --repo "$REPO" --json body --jq .body > body.md
            if grep -q 'Teil von #1664\. Keine Blocker\.' body.md; then
              sed -i 's/Teil von #1664\. Keine Blocker\./Teil von #1664. Blockiert durch #1665./' body.md
              gh issue edit "$B" --repo "$REPO" --body-file body.md >/dev/null && echo "ok: Text #$B angepasst"
            else
              echo "::error::#$B Blocker-Zeile nicht gefunden"
              fail=1
            fi
          done
          echo "--- Kontrolle: Anzahl Blocker je Issue"
          for N in $(seq 1665 1697); do
            echo "#$N: $(gh api "repos/$REPO/issues/$N/dependencies/blocked_by" --jq 'length')"
          done
          exit $fail
