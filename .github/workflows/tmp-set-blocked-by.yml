name: tmp-set-blocked-by

# Einmal-Workflow: setzt die nativen Blocked-by-Relationen des Epics #1664.
# Laeuft nur auf diesem Wegwerf-Branch, der danach geloescht wird.

on:
  push:
    branches: [claude/set-blocked-by-1664]

permissions:
  issues: write

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Blocked-by fuer Epic 1664 setzen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          fail=0
          while read -r B KS; do
            for K in $KS; do
              id="$(gh api "repos/$REPO/issues/$K" --jq .id)"
              if gh api -X POST "repos/$REPO/issues/$B/dependencies/blocked_by" -F issue_id="$id" >/dev/null; then
                echo "ok: #$B blocked by #$K"
              else
                echo "::error::#$B blocked by #$K fehlgeschlagen"
                fail=1
              fi
            done
          done <<'EOF'
          1673 1665
          1674 1667
          1675 1670
          1676 1671
          1677 1665
          1678 1673 1666 1667 1669
          1679 1673 1667 1675
          1680 1673 1667
          1681 1676
          1682 1673
          1683 1677
          1684 1677
          1685 1677
          1686 1682
          1687 1683 1684 1685
          1688 1686
          1689 1687
          1690 1668 1687
          1691 1686 1684
          1692 1673 1674 1687
          1693 1674 1668 1678 1679 1680 1672 1681 1688
          1694 1689
          1695 1692 1690
          1696 1694 1692
          1697 1693 1690 1691 1695 1696
          EOF
          echo "--- Kontrolle: Anzahl Blocker je Issue"
          for N in $(seq 1665 1697); do
            echo "#$N: $(gh api "repos/$REPO/issues/$N/dependencies/blocked_by" --jq 'length')"
          done
          exit $fail
