name: Claude PR Review (Kreuzverhoer)

# Reviewt einen Pull Request im Kreuzverhör, sobald er das Label
# "ai:needs-review" trägt.
# Setzt **Claude Code** ein; Provider via `vars.LLM_PROVIDER` (zai|claude), aufgelöst in setup-claude.
#   - Findings → ai:needs-changes (→ Fixup)
#   - sauber 🟢 → ai:ready-to-merge (→ Gate)
# Ändert KEINEN Code.

on:
  pull_request:
    types: [labeled]

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}-${{ github.event.label.name == 'ai:needs-review' }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      ${{ github.event.pull_request.draft == false
          && github.event.pull_request.head.repo.full_name == github.repository
          && contains(github.event.pull_request.labels.*.name, 'ai:needs-review') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    permissions:
      contents: read
      id-token: write
      actions: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Startzeit merken (für weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 600))" >> "$GITHUB_OUTPUT"

      - name: Setup Claude Code (mit Memory-Load)
        id: setup
        uses: ./.github/actions/setup-claude
        with:
          needs-mcp: false
          event-type: ${{ github.event_name }}
          ticket-ref: ${{ github.event.pull_request.number }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          zai-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}
          openrouter-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}
          memory-load: 'true'

      - name: Supersede-Check
        id: supersede-check
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          running=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs \
            --jq '.workflow_runs[] | select(.name == "Claude PR Review (Kreuzverhoer)" and (.status == "queued" or .status == "in_progress") and .head_branch == $ENV.HEAD_BRANCH and .id != ${{ github.run_id }}) | .id' 2>/dev/null | head -1)
          if [ -n "$running" ]; then
            echo "::notice::Review-Lauf läuft bereits – übersprungen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Kreuzverhör-Review via Claude
        id: claude
        if: steps.setup.outputs.configured == 'true' && steps.supersede-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          cat > /tmp/claude-prompt.txt << 'CLAUDE_EOF'
          TICKET-MEMORY: Lies vor Beginn alle Dateien in .claude/ticket-memory/ (falls vorhanden) — ticketspezifisches Gedächtnis aus früheren Phasen. Schreibe am ENDE deine wichtigsten Erkenntnisse (gefundene Findings, Severity, empfohlene Fixes) in .claude/ticket-memory/phase-review.md. Max. ~30 Zeilen, nur Neues.
          FOKUS: NUR PR #PR_NR. NUR den Diff prüfen. KEINE Abstecher. Token sparen: kurz, präzise, direkt.

          Memory ist bereits geladen (ticket-PR_NR).

          ABLAUF (STRIKT):
            1. SOFORT starten.
            2. Vollständigen Diff (gh pr diff) und verknüpftes Ticket lesen.
            3. Adversarial prüfen:
               - Löst der PR das Problem ganz?
               - Edge Cases? Einfachster Weg? Performance/Security?
               - Regression: Macht der PR bestehende Tests/Verhalten AUSSERHALB des Diffs obsolet?
                 **Hinweis:** Obsolete Tests sollten bereits in der Spec-Stufe entfernt worden sein. Falls trotzdem Widerspruch auffällt → als Finding benennen ("Test-Pflege-Bedarf", Datei:Zeile), nicht still hinnehmen.
            4. Code-Qualität: Benennung, Lesbarkeit, Tests (grün + abdeckend).

          ABSCHLUSS:
            - Findings → Review-Kommentare posten (an Datei/Zeile verankert), dann VERDICT: needs-changes
            - PR ist solide (🟢) → KEINE Pseudo-Findings, knappe 🟢-Bestätigung, dann VERDICT: ready-to-merge

          Sammelkommentar konsolidieren: Urteil als GENAU EINEN <!-- ai-review -->-Kommentar pflegen. Vorhandenen suchen und aktualisieren statt neu anzulegen.

          Bei Folge-Review: NUR den Diff SEIT dem letzten Review prüfen.

          ⚠️ LABELS: KEINE Labels setzen! Workflow übernimmt das automatisch.

          VERDICT: GANZ AM ENDE GENAU EINE Zeile:
            - VERDICT: ready-to-merge (bei 🟢)
            - VERDICT: needs-changes (bei Findings)

          ZEITLIMIT: Soft-Deadline = SOFT_DEADLINE. Vor jedem Schritt: [ $(date +%s) -ge SOFT_DEADLINE ]. Bei OVER: Zwischenstand als Sammelkommentar, Turn beenden.

          WICHTIG: Ändere KEINEN Code, committe nichts. Reiner Review.
          CLAUDE_EOF

          sed -i "s/#PR_NR/${{ github.event.pull_request.number }}/g" /tmp/claude-prompt.txt
          sed -i "s/SOFT_DEADLINE/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/claude-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Memory-Save (ticketspezifisch, dateibasiert)
        # Cache nur schreiben, wenn Claude gelaufen ist (s. workflow-invariants-Test: das
        # outcome-Binding hält diesen Step im Guard-Skip-Fall indirekt heraus).
        if: always() && steps.setup.outputs.configured == 'true' && steps.claude.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.memory-path }}
          key: ${{ steps.setup.outputs.memory-save-key }}
          if-no-path-exists: ignore

      - name: Label-Post-Assertion (Labels via App-Token force-setzen)
        if: always() && steps.setup.outputs.configured == 'true' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          verdict=""
          if [ -f /tmp/claude-output.log ]; then
            verdict="$(grep -oP 'VERDICT:\s*\K.*' /tmp/claude-output.log | tail -1 | tr -d '[:space:]' || true)"
          fi
          echo "Claude-Verdict aus Output: '${verdict:-keins}'"

          REVIEW_COMMENT_ID="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments \
            --jq '[.comments[] | select(.body | test("<!-- ai-review -->"))] | first | .id' 2>/dev/null || echo "")"
          ARTIFACTS_OK="false"
          if [ -n "$REVIEW_COMMENT_ID" ] && [ "$REVIEW_COMMENT_ID" != "null" ]; then
            ARTIFACTS_OK="true"
          fi

          if [ "$ARTIFACTS_OK" != "true" ]; then
            echo "::error title=❌ Review-Kommentar fehlt::Kein <!-- ai-review -->-Kommentar am PR."
            exit 1
          fi

          if [ "$verdict" = "ready-to-merge" ]; then
            allow='[]'
            delays=(2 3 5 8)
            for attempt in 1 2 3 4 5; do
              checks="$(gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --json name,bucket,workflow 2>/dev/null || echo '[]')"
              if [ -z "$checks" ]; then checks='[]'; fi
              allow="$(echo "$checks" | jq '[.[] | select(.workflow == "CI" or .workflow == "Claude PR Review (Kreuzverhoer)")]')"
              has_ci="$(echo "$allow" | jq -r 'any(.[]; .workflow == "CI")')"
              has_reviewer="$(echo "$allow" | jq -r 'any(.[]; .workflow == "Claude PR Review (Kreuzverhoer)")')"
              if [ "$has_ci" = "true" ] && [ "$has_reviewer" = "true" ]; then break; fi
              if [ "$attempt" -lt 5 ]; then sleep "${delays[$((attempt - 1))]}"; fi
            done
            any_fail="false"
            if [ "$(echo "$allow" | jq 'length')" -gt 0 ]; then
              any_fail="$(echo "$allow" | jq -r 'any(.[]; .bucket == "fail")')"
            fi
            if [ "$any_fail" = "true" ]; then
              echo "::warning::Allowlist-Check rot → Downgrade zu needs-changes"
              verdict="needs-changes"
            else
              final="ready-to-merge"
            fi
          fi

          if [ "$verdict" != "ready-to-merge" ]; then
            final="needs-changes"
          fi

          gh label create "ai:needs-changes" --repo "$GITHUB_REPOSITORY" --color D93F0B 2>/dev/null || true
          gh label create "ai:ready-to-merge" --repo "$GITHUB_REPOSITORY" --color 0E8A16 2>/dev/null || true
          gh label create "ai:needs-review" --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true

          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai:needs-review 2>/dev/null || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai:needs-changes 2>/dev/null || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai:ready-to-merge 2>/dev/null || true

          if [ "$final" = "ready-to-merge" ]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ai:ready-to-merge
            echo "::notice::Label gesetzt: ai:ready-to-merge"
          else
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ai:needs-changes
            echo "::notice::Label gesetzt: ai:needs-changes"
          fi

      - name: Bei Timeout PR-Kommentar (Alarm)
        if: always() && steps.setup.outputs.configured == 'true' && steps.claude.outcome == 'cancelled'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⚠️ **Review #${PR} – Timeout erreicht** Bitte manuell prüfen." 2>/dev/null || true

      - name: Ergebnis zusammenfassen
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          SKIP_SUPERSEDE: ${{ steps.supersede-check.outputs.skip }}
        run: |
          labels="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          # Eigener Arm fuer den Supersede-Check: ohne ihn faellt der gewollte Skip auf den
          # Fehler-Arm (OUTCOME ist leer, weil der claude-Step nie lief) und meldet ❌.
          if [ "${SKIP_SUPERSEDE:-false}" = "true" ]; then
            echo "::notice title=⏭️ Review übersprungen::PR #${PR} — Lauf bereits aktiv"
          elif [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Review erfolgreich::PR #${PR}"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Review abgebrochen"
          else
            echo "::error title=❌ Review fehlgeschlagen"
          fi
          {
            echo "### Kreuzverhör-Review #${PR}"
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Labels: ${labels:-keine}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Review-Ergebnis prüfen (Label via API verifizieren)
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
          SKIP_SUPERSEDE: ${{ steps.supersede-check.outputs.skip }}
        run: |
          # Beim Supersede-Skip hat dieser Lauf nichts beigetragen — das Ergebnis-Label setzt der
          # laufende Review. Ohne diesen Arm meldet der Step "stecken geblieben" fuer einen
          # gewollten Skip und faerbt einen korrekt arbeitenden Lauf rot.
          if [ "${SKIP_SUPERSEDE:-false}" = "true" ]; then
            echo "::notice title=⏭️ Verifikation übersprungen::PR #${PR} — laufender Review setzt das Label"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            labels_json="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]' 2>/dev/null || echo '[]')"
            needs_changes="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:needs-changes")')"
            ready_to_merge="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:ready-to-merge")')"
            if [ "$needs_changes" = "true" ] || [ "$ready_to_merge" = "true" ]; then break; fi
            if [ "$i" -lt 5 ]; then sleep 3; fi
          done
          echo "Labels verifiziert: needs_changes=${needs_changes:-?} ready_to_merge=${ready_to_merge:-?}"
          if [ "$needs_changes" = "true" ]; then
            echo "::notice title=Review: Änderungen erforderlich::PR #${PR} – ai:needs-changes gesetzt (Fixup läuft an), gültiges Ergebnis."
          elif [ "$ready_to_merge" = "true" ]; then
            echo "::notice title=Review: ready-to-merge::PR #${PR} – ai:ready-to-merge gesetzt."
          else
            echo "::error title=Review stecken geblieben::PR #${PR} – weder ai:needs-changes noch ai:ready-to-merge gesetzt."
            exit 1
          fi
