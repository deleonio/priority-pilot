name: 4/6 Review

# ⚠️ Der `name:` ist lastend: der Supersede-Check (select(.name == "Claude PR Review
#    (Kreuzverhoer)")) UND das workflow_run-Allowlist in claude-pr-gate-merge.yml matchen ihn
#    exakt. Umbenennen schaltet beide lautlos ab → Duplikat-Läufe / stummes Gate. ACHTUNG:
#    es gibt KEINEN Contract-Test für diese Kopplung (ADR #567 — Workflows bleiben ungetestet),
#    ein Rename fällt also lautlos durch — vor jeder `name:`-Änderung beide Guard-Stellen
#    (Supersede-Check hier + Allowlist in gate-merge) manuell mitpflegen.

# Reviewt einen Pull Request im Kreuzverhör, sobald er das Label
# "ai:needs-review" trägt.
# Setzt **Claude Code** ein; Provider via `vars.LLM_PROVIDER` (zai|claude), aufgelöst in setup-claude.
#   - Findings → ai:needs-changes (→ Fixup)
#   - Entscheidungs-Findings ("Mensch entscheidet") → ai:needs-human (→ wartet auf Mensch)
#   - sauber 🟢 → ai:ready-to-merge (→ Gate)
# Ändert KEINEN Code.

on:
  pull_request:
    types: [labeled]

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}-${{ github.event.label.name == 'ai:needs-review' }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      ${{ github.event.label.name == 'ai:needs-review'
          && github.event.pull_request.draft == false
          && github.event.pull_request.head.repo.full_name == github.repository
          && contains(github.event.pull_request.labels.*.name, 'ai:needs-review') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    permissions:
      contents: read
      id-token: write
      actions: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Startzeit merken (für weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 600))" >> "$GITHUB_OUTPUT"

      - name: Setup Claude Code (mit Memory-Load)
        id: setup
        uses: ./.github/actions/setup-claude
        with:
          needs-mcp: false
          tools-tier: review
          event-type: ${{ github.event_name }}
          ticket-ref: ${{ github.event.pull_request.number }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          model: ${{ vars.CLAUDE_MODEL_PR_REVIEW || 'opus' }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          zai-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}
          openrouter-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          tailscale-exit-node: ${{ vars.TAILSCALE_EXIT_NODE }}
          memory-load: 'true'
          expect-memory: 'true'

      - name: Supersede-Check
        id: supersede-check
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          running=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs \
            --jq '.workflow_runs[] | select(.name == "4/6 Review" and (.status == "queued" or .status == "in_progress") and .head_branch == $ENV.HEAD_BRANCH and .id != ${{ github.run_id }}) | .id' 2>/dev/null | head -1)
          if [ -n "$running" ]; then
            echo "::notice::Review-Lauf läuft bereits – übersprungen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Kreuzverhör-Review via Claude
        id: claude
        if: steps.setup.outputs.configured == 'true' && steps.supersede-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          cat > /tmp/claude-prompt.txt << 'CLAUDE_EOF'
          HINWEIS: Review-Tier — du schreibst KEINEN Memory (nur Lesen). Lesedetails siehe Memory-Abschnitt am Prompt-Ende.
          FOKUS: NUR PR #PR_NR. NUR den Diff prüfen. KEINE Abstecher. Token sparen: kurz, präzise, direkt.

          MODUS bestimmen (ALLERERSTER Schritt): Prüfe, ob bereits ein <!-- ai-review -->-Sammelkommentar am PR existiert (gh api repos/{owner}/{repo}/issues/#PR_NR/comments, nach "<!-- ai-review -->" filtern).
            - Marker FEHLT → MODUS = KREUZVERHÖR (Erst-Review: volle adversariale Prüfung des ganzen PR).
            - Marker VORHANDEN → MODUS = FIXUP-NACHWEIS (Folge-Review nach Fixup: KEIN neues Kreuzverhör — nur Kreuzverhör-Ergebnis + Fixup-Runden prüfen).

          MODUS KREUZVERHÖR (Erst-Review) — adversarial, ganzer PR:
            1. Vollständigen Diff (gh pr diff) und verknüpftes Ticket lesen (AK aus Body-Block <!-- KI-ANALYSE:START/END -->).
            2. Adversarial prüfen: Löst der PR das Problem ganz? Edge Cases? Einfachster Weg? Performance/Security?
               Regression: macht der PR bestehende Tests/Verhalten AUSSERHALB des Diffs obsolet? (Obsolete Tests sollten schon in der Spec entfernt sein; falls Widerspruch → Finding "Test-Pflege-Bedarf", Datei:Zeile.)
            3. Code-Qualität: Benennung, Lesbarkeit, Tests (grün + AK abdeckend).

          MODUS FIXUP-NACHWEIS (Folge-Review) — NUR das Kreuzverhör-Ergebnis + die Fixup-Runden, NICHT erneut der ganze PR:
            1. Bestehenden <!-- ai-review -->-Kommentar laden, seine "Offenen Findings" + updatedAt notieren.
            2. Fixup-Diff seit updatedAt: gh pr view --json commits, committedDate > updatedAt filtern, darauf git diff.
            3. Pro offenem Finding: durch den Fixup behoben (Datei/Zeile verifizieren)? → als behoben markieren, sonst offen lassen — nicht erneut aufrollen.
            4. NUR den Fixup-Diff adversarial auf NEUE Probleme prüfen (hat der Fix neue Bugs/Regressionen eingeführt?).
            5. AK/Ticket-Kontext im Blick behalten (nicht rein diff-lokal urteilen), aber unveränderte Code-Teile NICHT erneut kreuzvernehmen.

          ABSCHLUSS (beide Modi):
            - (Fixbare) Findings → Review-Kommentare an Datei/Zeile, dann VERDICT: needs-changes
            - Architektur-/Produkt-/Design-Finding ("Mensch entscheidet") → Kommentar mit Handlungsoptionen, dann VERDICT: needs-human
            - solide (🟢) → KEINE Pseudo-Findings, knappe 🟢-Bestätigung, dann VERDICT: ready-to-merge

          Sammelkommentar: Urteil als GENAU EINEN <!-- ai-review -->-Kommentar pflegen (vorhandenen suchen + fortschreiben, nicht neu anlegen). Zwei Abschnitte: "Offene Findings" (aktuelle Runde) und "Behobene Anmerkungen" (History-Tabelle — erledigte Findings wandern dorthin).

          ⚠️ LABELS: KEINE Labels setzen! Workflow übernimmt das automatisch.

          ZEITLIMIT: Soft-Deadline = SOFT_DEADLINE. Vor jedem Schritt: [ $(date +%s) -ge SOFT_DEADLINE ]. Bei OVER: Zwischenstand als Sammelkommentar, Turn beenden.

          WICHTIG: Ändere KEINEN Code, committe nichts. Reiner Review.

          VERDICT (DEINE LETZTE OUTPUT-ZEILE, vom Workflow geparsed — ohne sie bleibt der PR stecken): exakt EINE Zeile am Ende, einer der Werte:
            - VERDICT: ready-to-merge (bei 🟢)
            - VERDICT: needs-changes (bei fixbaren Findings)
            - VERDICT: needs-human (bei Entscheidungs-Findungen, die ein Mensch treffen muss)
          CLAUDE_EOF

          # Memory-Read-Snippet anhängen (Phase 4 = Review: nur Lesen, kein Schreiben)
          cat .github/prompts/memory-read.md >> /tmp/claude-prompt.txt

          sed -i "s/#PR_NR/${{ github.event.pull_request.number }}/g" /tmp/claude-prompt.txt
          sed -i "s/#MEMORY_STATUS/${{ steps.setup.outputs.memory-status-text }}/g" /tmp/claude-prompt.txt
          sed -i "s/SOFT_DEADLINE/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/claude-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Memory-Upload (Artefakt für workflow_run-Persistierung)
        # Issue-/Label-Trigger bekommen seit der GitHub-Richtlinie 2026-06-26 nur lese-only
        # Cache-Token → ein direkter Save wäre ein No-Op ("token has no writable scopes"). Phasen
        # laden via Restore (read-only OK) und übergeben das Memory als Artefakt an den vertrauens-
        # würdigen workflow_run-Begleitworkflow (claude-memory-save.yml), der den Schreibzugriff hat.
        # Artefakt-Name = Cache-Key = claude-memory-issue-{N} (steps.setup.outputs.memory-save-key).
        if: always() && steps.setup.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.setup.outputs.memory-save-key }}
          path: ${{ steps.setup.outputs.memory-path }}
          retention-days: 1
          if-no-files-found: ignore

      - name: Label-Post-Assertion (Labels via App-Token force-setzen)
        if: always() && steps.setup.outputs.configured == 'true' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          verdict=""
          if [ -f /tmp/claude-output.log ]; then
            verdict="$(grep 'VERDICT:' /tmp/claude-output.log | tail -1 | sed -E 's/^.*VERDICT:[[:space:]]*//' | tr -d -c 'A-Za-z0-9-' || true)"
          fi
          echo "Claude-Verdict aus Output: '${verdict:-keins}'"

          # Review-Marker (<!-- ai-review -->) nachsehen — MIT Retry: unmittelbar nach Claudes Post
          # liefert die GitHub-API den Kommentar (Replikationsverzögerung) gelegentlich noch nicht.
          # Ohne Retry endete der Review hier fälschlich ❌, obwohl Claude Verdict + Kommentar
          # geliefert hatte (PR #524: Review↔Fixup-Loop).
          ARTIFACTS_OK="false"
          for attempt in 1 2 3 4; do
            REVIEW_COMMENT_ID="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments \
              --jq '[.comments[] | select(.body | test("<!-- ai-review -->"))] | first | .id' 2>/dev/null || echo "")"
            if [ -n "$REVIEW_COMMENT_ID" ] && [ "$REVIEW_COMMENT_ID" != "null" ]; then
              ARTIFACTS_OK="true"
              break
            fi
            [ "$attempt" -lt 4 ] && sleep "$attempt"
          done

          if [ "$ARTIFACTS_OK" != "true" ]; then
            # Marker auch nach Retry nicht gefunden. Nur ein harter Fehler, wenn Claude KEIN klares
            # Verdict lieferte (dann fehlt jeder Artefakt-Nachweis — Claude hat vermutlich nicht
            # gearbeitet). Bei klarem Verdict ist der Kommentar ein Hilfssignal, das Verdict primär:
            # wir setzen das Label nach Verdict und warnen nur. Ohne diese Unterscheidung würde ein
            # fehlender Marker ein klares ready-to-merge zu needs-changes degradieren und einen
            # Fixup-Loop auslösen (PR #524: Claude postete teils keinen Marker-Kommentar).
            case "$verdict" in
              ready-to-merge|needs-changes|needs-human)
                echo "::warning title=Review-Kommentar fehlt::Kein <!-- ai-review -->-Kommentar am PR (auch nach Retry). Claude-Verdict '${verdict}' ist klar → Label nach Verdict, kein harter Fehler. Marker wird vom Workflow angelegt."
                # Create-or-Update (#530): Claude postet den Sammelkommentar gelegentlich
                # nicht. Fehlt der Marker (leere REVIEW_COMMENT_ID), legt der Workflow ihn
                # selbst an — existiert er, bleibt er unangetastet: kein Duplikat, kein Überschreiben.
                if [ -z "$REVIEW_COMMENT_ID" ] || [ "$REVIEW_COMMENT_ID" = "null" ]; then
                  gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "<!-- ai-review --> 🧭 Review-Marker vom Workflow gesetzt — Claude-Verdict \`${verdict}\`, aber kein Sammelkommentar gepostet (PR #524/#530)." 2>/dev/null || true
                fi
                ;;
              *)
                echo "::error title=❌ Review ohne Artefakt::Kein <!-- ai-review -->-Kommentar UND kein klares Verdict ('${verdict:-keins}'). Claude hat vermutlich nichts geleistet."
                exit 1
                ;;
            esac
          fi

          if [ "$verdict" = "ready-to-merge" ]; then
            allow='[]'
            delays=(2 3 5 8)
            for attempt in 1 2 3 4 5; do
              checks="$(gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --json name,bucket,workflow 2>/dev/null || echo '[]')"
              if [ -z "$checks" ]; then checks='[]'; fi
              allow="$(echo "$checks" | jq '[.[] | select(.workflow == "CI" or .workflow == "4/6 Review")]')"
              has_ci="$(echo "$allow" | jq -r 'any(.[]; .workflow == "CI")')"
              has_reviewer="$(echo "$allow" | jq -r 'any(.[]; .workflow == "4/6 Review")')"
              if [ "$has_ci" = "true" ] && [ "$has_reviewer" = "true" ]; then break; fi
              if [ "$attempt" -lt 5 ]; then sleep "${delays[$((attempt - 1))]}"; fi
            done
            any_fail="false"
            if [ "$(echo "$allow" | jq 'length')" -gt 0 ]; then
              any_fail="$(echo "$allow" | jq -r 'any(.[]; .bucket == "fail")')"
            fi
            if [ "$any_fail" = "true" ]; then
              echo "::warning::Allowlist-Check rot → Downgrade zu needs-changes"
              verdict="needs-changes"
            else
              final="ready-to-merge"
            fi
          fi

          if [ "$verdict" = "needs-human" ]; then
            final="needs-human"
          elif [ "$verdict" != "ready-to-merge" ]; then
            final="needs-changes"
          fi

          gh label create "ai:needs-changes" --repo "$GITHUB_REPOSITORY" --color D93F0B 2>/dev/null || true
          gh label create "ai:ready-to-merge" --repo "$GITHUB_REPOSITORY" --color 0E8A16 2>/dev/null || true
          gh label create "ai:needs-review" --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true
          gh label create "ai:needs-human" --repo "$GITHUB_REPOSITORY" --color 5319e7 --description "Nicht-automatisierbare Entscheidung — wartet auf Mensch (Fixup greift bewusst nicht)" 2>/dev/null || true

          # Label-Operationen MIT Retry (Issue #613): Exponential Backoff 1s, 2s, 4s (max. 3)
          # Bei persistenten Fehlern → ai:needs-human + Fehlerkommentar
          label_operation_failed="false"
          for attempt in 1 2 3; do
            if gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai:needs-review 2>/dev/null && \
               gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai:needs-changes 2>/dev/null && \
               gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai:ready-to-merge 2>/dev/null && \
               gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai:needs-human 2>/dev/null; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep "$((2 ** (attempt-1)))"; fi
            if [ "$attempt" -eq 3 ]; then label_operation_failed="true"; fi
          done

          if [ "$label_operation_failed" = "true" ]; then
            echo "::error::Label-Entfernen nach 3 Versuchen fehlgeschlagen → ai:needs-human gesetzt"
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⚠️ **Label-Race-Condition (#613)**: Label-Entfernung nach 3 Retries fehlgeschlagen (transienter GitHub-API-Fehler). Bitte manuell prüfen und via \`ai:needs-review\` neu triggern." 2>/dev/null || true
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ai:needs-human 2>/dev/null || true
            exit 1
          fi

          if [ "$final" = "ready-to-merge" ]; then
            for attempt in 1 2 3; do
              if gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ai:ready-to-merge; then
                echo "::notice::Label gesetzt: ai:ready-to-merge"
                break
              fi
              if [ "$attempt" -lt 3 ]; then sleep "$((2 ** (attempt-1)))"; fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::ai:ready-to-merge nach 3 Versuchen fehlgeschlagen → ai:needs-human gesetzt"
                gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⚠️ **Label-Race-Condition (#613)**: ai:ready-to-merge nach 3 Retries fehlgeschlagen. Bitte manuell prüfen." 2>/dev/null || true
                gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ai:needs-human 2>/dev/null || true
                exit 1
              fi
            done
          elif [ "$final" = "needs-human" ]; then
            for attempt in 1 2 3; do
              if gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ai:needs-human; then
                echo "::notice::Label gesetzt: ai:needs-human (wartet auf Mensch)"
                break
              fi
              if [ "$attempt" -lt 3 ]; then sleep "$((2 ** (attempt-1)))"; fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::ai:needs-human nach 3 Versuchen fehlgeschlagen → manuelle Eingriffe erforderlich"
                exit 1
              fi
            done
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⏸️ **Wartet auf menschliche Entscheidung** — nicht-automatisierbares Finding (siehe Review-Kommentar oben). Der Fixup greift hier bewusst nicht. Nach der Entscheidung: Label \`ai:needs-human\` entfernen und via \`ai:needs-review\` neu triggern." 2>/dev/null || true
          else
            for attempt in 1 2 3; do
              if gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ai:needs-changes; then
                echo "::notice::Label gesetzt: ai:needs-changes"
                break
              fi
              if [ "$attempt" -lt 3 ]; then sleep "$((2 ** (attempt-1)))"; fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::ai:needs-changes nach 3 Versuchen fehlgeschlagen → ai:needs-human gesetzt"
                gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⚠️ **Label-Race-Condition (#613)**: ai:needs-changes nach 3 Retries fehlgeschlagen. Bitte manuell prüfen." 2>/dev/null || true
                gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ai:needs-human 2>/dev/null || true
                exit 1
              fi
            done
          fi

      - name: Bei Timeout PR-Kommentar (Alarm)
        if: always() && steps.setup.outputs.configured == 'true' && steps.claude.outcome == 'cancelled'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⚠️ **Review #${PR} – Timeout erreicht** Bitte manuell prüfen." 2>/dev/null || true

      - name: Ergebnis zusammenfassen
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          SKIP_SUPERSEDE: ${{ steps.supersede-check.outputs.skip }}
        run: |
          labels="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          # Eigener Arm fuer den Supersede-Check: ohne ihn faellt der gewollte Skip auf den
          # Fehler-Arm (OUTCOME ist leer, weil der claude-Step nie lief) und meldet ❌.
          if [ "${SKIP_SUPERSEDE:-false}" = "true" ]; then
            echo "::notice title=⏭️ Review übersprungen::PR #${PR} — Lauf bereits aktiv"
          elif [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Review erfolgreich::PR #${PR}"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Review abgebrochen"
          else
            echo "::error title=❌ Review fehlgeschlagen"
          fi
          {
            echo "### Kreuzverhör-Review #${PR}"
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Labels: ${labels:-keine}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🩺 Z.AI Fair-Usage-Check (1313)
        # Rohausgabe des Claude-Laufs auf z.ai-Fehler 1313 (Fair Usage) durchsuchen
        # und Ergebnis als Annotation + Job-Summary sichtbar machen.
        if: always()
        uses: ./.github/actions/llm-fair-usage-check

      - name: Review-Ergebnis prüfen (Label via API verifizieren)
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
          SKIP_SUPERSEDE: ${{ steps.supersede-check.outputs.skip }}
        run: |
          # Beim Supersede-Skip hat dieser Lauf nichts beigetragen — das Ergebnis-Label setzt der
          # laufende Review. Ohne diesen Arm meldet der Step "stecken geblieben" fuer einen
          # gewollten Skip und faerbt einen korrekt arbeitenden Lauf rot.
          if [ "${SKIP_SUPERSEDE:-false}" = "true" ]; then
            echo "::notice title=⏭️ Verifikation übersprungen::PR #${PR} — laufender Review setzt das Label"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            labels_json="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]' 2>/dev/null || echo '[]')"
            needs_changes="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:needs-changes")')"
            ready_to_merge="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:ready-to-merge")')"
            needs_human="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:needs-human")')"
            if [ "$needs_changes" = "true" ] || [ "$ready_to_merge" = "true" ] || [ "$needs_human" = "true" ]; then break; fi
            if [ "$i" -lt 5 ]; then sleep 3; fi
          done
          echo "Labels verifiziert: needs_changes=${needs_changes:-?} ready_to_merge=${ready_to_merge:-?} needs_human=${needs_human:-?}"
          if [ "$needs_changes" = "true" ]; then
            echo "::notice title=Review: Änderungen erforderlich::PR #${PR} – ai:needs-changes gesetzt (Fixup läuft an), gültiges Ergebnis."
          elif [ "$ready_to_merge" = "true" ]; then
            echo "::notice title=Review: ready-to-merge::PR #${PR} – ai:ready-to-merge gesetzt."
          elif [ "$needs_human" = "true" ]; then
            echo "::notice title=Review: Mensch entscheidet::PR #${PR} – ai:needs-human gesetzt, wartet auf menschliche Entscheidung."
          else
            echo "::error title=Review stecken geblieben::PR #${PR} – weder ai:needs-changes noch ai:ready-to-merge noch ai:needs-human gesetzt."
            exit 1
          fi
