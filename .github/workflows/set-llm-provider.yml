name: LLM-Provider

# Manuelles Umschalten der Repository-Variable LLM_PROVIDER (claude | openrouter | zai)
# Löst KEINE Folge-Workflows aus — nur Variable setzen + Verifizieren.
# Nutzt GitHub-App-Token (wie die 5 Pipeline-Workflows), damit variables:write funktioniert.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'LLM-Provider für alle 5 Pipeline-Phasen'
        type: choice
        required: true
        default: 'claude'
        options:
          - claude
          - openrouter
          - zai

jobs:
  set-provider:
    name: Update LLM_PROVIDER
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Für GitHub-App-Token
    steps:
      - name: Checkout (für gh auth)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: GitHub-App-Token erzeugen
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: GH_TOKEN setzen (App-Token)
        id: gh-token
        shell: bash
        run: |
          APP_TOK="${{ steps.app-token.outputs.token }}"
          if [ -n "$APP_TOK" ] && [ "$APP_TOK" != "null" ]; then
            echo "token=$APP_TOK" >> "$GITHUB_OUTPUT"
            echo "::notice::Nutze GitHub-App-Token für gh-Befehle."
          else
            echo "::error::App-Token nicht verfügbar — Secrets APP_ID / APP_PRIVATE_KEY prüfen."
            exit 1
          fi

      - name: Aktuelle Variable anzeigen
        id: current
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
        run: |
          current="$(gh variable get LLM_PROVIDER -R "${GITHUB_REPOSITORY}" 2>/dev/null || echo 'nicht gesetzt')"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "Aktueller Wert: ${current}"

      - name: Validierung (nur erlaubte Werte)
        env:
          TARGET: ${{ inputs.provider }}
        run: |
          case "${TARGET}" in
            claude|openrouter|zai) ;;
            *)
              echo "::error::Ungültiger Provider '${TARGET}' — erlaubt: claude, openrouter, zai"
              exit 1
              ;;
          esac

      - name: Variable setzen
        id: set-var
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          TARGET: ${{ inputs.provider }}
        run: |
          gh variable set LLM_PROVIDER -b "${TARGET}" -R "${GITHUB_REPOSITORY}"
          echo "::notice title=✅ Variable gesetzt::LLM_PROVIDER=${TARGET}"

      - name: Verifizieren
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
        run: |
          sleep 1  # kurze Propagation-Pause
          verified="$(gh variable get LLM_PROVIDER -R "${GITHUB_REPOSITORY}" 2>/dev/null || echo 'FEHLER')"
          echo "Verifizierter Wert: ${verified}"
          if [ "${verified}" != "${{ inputs.provider }}" ]; then
            echo "::error::Verifikation fehlgeschlagen — Variable nicht übernommen"
            exit 1
          fi

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "### LLM Provider Update"
            echo ""
            echo "- **Target Provider:** ${{ inputs.provider }}"
            echo "- **Previous Value:** ${{ steps.current.outputs.current }}"
            echo "- **Status:** ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
