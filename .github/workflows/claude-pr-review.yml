name: Claude PR Review (Kreuzverhoer)

# Reviewt einen Pull Request im Kreuzverhoer, sobald er das Label "ai:needs-review" traegt (vom
# Umsetzungs-Workflow gesetzt, oder manuell zum Opt-in). Die Pipeline wird ueber LABELS gesteuert
# statt ueber Review-/Kommentar-Events -> stabiles Ping-Pong ohne Event-Kaskaden:
#   - zutreffende Findings -> Label "ai:needs-changes" (loest claude-pr-fixup.yml aus)
#   - sauber 🟢            -> Label "ai:ready-to-merge" (terminal; claude-pr-gate-merge.yml mergt automatisch)
# Das ausloesende "ai:needs-review" wird dabei entfernt. Aendert KEINEN Code.
#
# Nutzt ein kurzlebiges GitHub-App-Token, damit die gesetzten Labels die Folge-Workflows ausloesen.
# Voraussetzungen: CLAUDE_CODE_OAUTH_TOKEN sowie eine GitHub App, hinterlegt als APP_ID +
# APP_PRIVATE_KEY (Contents/Issues/Pull requests = Read and write).

on:
  # NUR labeled: Der Job-`if` unten verlangt das Label "ai:needs-review", das der Autolabeler
  # (pr-needs-review-label.yml) erst NACH opened/ready_for_review setzt -> zu dem Zeitpunkt fehlt
  # das Label noch, diese beiden Typen erzeugten hier nur uebersprungene Jobs (kein Token-Verbrauch,
  # aber unnoetiges Job-Rauschen). Das eigentliche opened/ready_for_review wird bereits von
  # pr-needs-review-label.yml abgedeckt, das ai:needs-review setzt und damit DIESES labeled-Event ausloest.
  pull_request:
    types: [labeled]

concurrency:
  # EIGENE Gruppe pro Workflow (Review getrennt von Fixup). Frueher teilten sich Review und Fixup
  # die Gruppe claude-pr-<nr>. Da BEIDE Workflows auf jedes `labeled`-Event triggern (nur der
  # Job-`if` filtert das richtige Label, die Concurrency greift aber VOR dem `if`), landete bei
  # jeder Label-Aenderung je ein Review- UND ein Fixup-Run in derselben Gruppe — auch der, dessen
  # Job ohnehin skippt. GitHub haelt pro Gruppe nur einen laufenden + einen wartenden Run und
  # cancelt den aelteren wartenden; so verdraengte ein No-op-Geschwister-Run (gleiches Event,
  # falsches Label) den echten Run aus dem einzigen Pending-Slot: der Fixup wurde abgebrochen statt
  # zu laufen. Getrennte Gruppen entkoppeln das — serialisiert wird nur noch der jeweils GLEICHE
  # Workflow desselben PRs. cancel-in-progress: false -> laufenden Lauf nie mittendrin verwerfen
  # (der wartende Lauf checkt beim Start ohnehin den juengsten Stand aus).
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    # Nur Pipeline-PRs (Label ai:needs-review vorhanden), nicht-Draft, kein Fork.
    if: >-
      ${{ github.event.pull_request.draft == false
          && github.event.pull_request.head.repo.full_name == github.repository
          && contains(github.event.pull_request.labels.*.name, 'ai:needs-review') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      actions: write # `gh cache delete` + actions/cache im Session-Archiv-Schritt (Soft-Abort, 2026-07-08)
    steps:
      # Startzeit fuer das weiche Zeitlimit (Soft-Abort, 2026-07-08): soft_deadline_epoch = jetzt +
      # 840s (14 Min, 6 Min Puffer bis zum harten 20-Min-Kill). Der Epoch-Wert wird unten als
      # literale Zahl in den Prompt gerendert.
      - name: Startzeit merken (fuer weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "soft_deadline_epoch=$((now + 840))" >> "$GITHUB_OUTPUT"

      - name: Voraussetzung pruefen (GitHub-App-Secrets)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::GitHub-App-Secrets fehlen (APP_ID und/oder APP_PRIVATE_KEY) — Lauf wird uebersprungen (kein Fehler). GitHub App anlegen (Contents/Issues/Pull requests = Read and write), aufs Repo installieren und beide Werte als Repo-Secrets hinterlegen, damit die Pipeline laeuft."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Deterministischer Agent-Secret-Check (Haerten S2): die OAuth-Token-Voraussetzung fuer
      # Claude darf NICHT still skippen — fehlt CLAUDE_CODE_OAUTH_TOKEN, bricht der Lauf hier
      # deterministisch ab (::error::, kein stiller Skip). Der Reviewer-Check wird rot -> Gate
      # setzt ai:needs-changes -> sichtbar. Zusaetzlich ein PR-Kommentar (statt Issue-Label wie
      # bei triage/spec/implement — PR-Workflows vergeben bewusst kein ai:to-big-issue, s.
      # S3/Timeout-Alarm), damit der PR-Autor aktiv erreicht wird statt nur den Checks-Tab
      # pruefen zu muessen.
      - name: Agent-Secret prüfen (kein stiller Skip)
        if: steps.preflight.outputs.configured == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error title=Agent-Secret fehlt::CLAUDE_CODE_OAUTH_TOKEN fehlt — fehlt es, darf der Lauf nicht still skippen (AGENTS.md: bewusstes Opt-in). Secret als Repo-Secret hinterlegen."
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "🛑 **Kreuzverhör-Review #${PR} — Agent-Secret fehlt**

          CLAUDE_CODE_OAUTH_TOKEN ist nicht gesetzt. Der Lauf wurde abgebrochen (kein stiller Skip). Bitte Secret hinterlegen." 2>/dev/null || true
            exit 1
          fi
          echo "Agent-Secret (CLAUDE_CODE_OAUTH_TOKEN) vorhanden."

      # Soft-Abort-Obergrenze (2026-07-08): merkt sich, ob "ai:continued" bereits VOR diesem Lauf
      # gesetzt war. Der Cap-Step nach dem Claude-Schritt liest diesen Wert, um eine zweite
      # Fortsetzung in Folge zu verhindern (siehe dort).
      - name: Fortsetzungs-Stand pruefen (ai:continued)
        id: continued-before
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          already="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels \
            --jq 'any(.labels[]; .name == "ai:continued")' 2>/dev/null || echo false)"
          echo "already=${already:-false}" >> "$GITHUB_OUTPUT"

      # Named Session Resume (Phase "review", Soft-Abort-Rollout 2026-07-08): PRs haben keine
      # Issue-Nummer im Event -- die "issue"-Eingabe der Composite-Action ist nur ein generischer
      # Cache-Key/Ordnername, daher wird hier bewusst die PR-Nummer uebergeben. Fail-open wie in
      # claude-triage.yml.
      - name: Session-Archiv wiederherstellen (Phase review)
        id: session-restore
        if: steps.preflight.outputs.configured == 'true'
        continue-on-error: true
        uses: ./.github/actions/session-restore
        with:
          issue: ${{ github.event.pull_request.number }}
          phase: review

      - name: Kreuzverhoer-Review via Claude Code
        id: claude
        if: steps.preflight.outputs.configured == 'true'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1.0.165
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }} # Labels als App-Token -> loesen Folge-Workflows aus
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # Erlaubte Bot-Ausloeser — das Label wird vom App-Bot (claude[bot]) gesetzt, sonst blockt
          # checkHumanActor diesen Lauf. Absicherung zusaetzlich ueber den Job-`if:`.
          allowed_bots: 'claude[bot],my-github-action-bot'
          prompt: |
            Bewerte zunächst die PR-Komplexität (Diff-Umfang, Architektur-Berührpunkte,
            Sicherheits-/Performance-Aspekte) und delegiere das eigentliche Kreuzverhoer-Review
            via Agent-Tool an den passenden Subagenten: triviale/mechanische PRs an `light`
            (Haiku), komplexe/architektonische PRs an `heavy` (Opus); Standard-Reviews führst
            du selbst auf Sonnet durch (kein Subagenten-Aufruf).

            Reviewe Pull Request #${{ github.event.pull_request.number }} im Kreuzverhör
            (Label `ai:needs-review` ist gesetzt). Die Pipeline koordiniert ausschließlich über
            LABELS — schließe daher GENAU mit einer der beiden Label-Umschaltungen unten ab.

            Folge dem Ablauf .ai-knowledge/pr-review.md (entspricht
            `/kreuzverhoer-review ${{ github.event.pull_request.number }}`): vollständigen Diff
            (`gh pr diff`) und das verknüpfte Ticket lesen, adversarial prüfen (löst der PR das
            Problem ganz? Edge Cases? einfachster Weg? Performance/Security?), Code-Qualität und
            Projekt-Konventionen prüfen.

            Sammelkommentar konsolidieren (kein Duplikat pro Runde): Das zusammenfassende Urteil
            wird als GENAU EIN markierter KI-Kommentar `<!-- ai-review -->` (erste Zeile) pro PR
            gepflegt. Vor dem Posten den bestehenden markierten Kommentar per API suchen
            (`gh api repos/{owner}/{repo}/issues/${{ github.event.pull_request.number }}/comments`,
            nach `<!-- ai-review -->` filtern); ist er vorhanden, ihn per
            `gh api --method PATCH repos/{owner}/{repo}/issues/comments/<id>` AKTUALISIEREN (Comment-ID
            bleibt gleich) statt einen neuen anzulegen — nur einmalig neu anlegen, wenn keiner existiert.
            Der Kommentar trennt „Offene Findings" (aktuelle Runde) von einer History-Tabelle
            „Behobene Anmerkungen" (Runde | Finding | Status ✅). Inline-Findings bleiben unverändert.

            DIFF-SCOPING bei Folge-Review (Kosten-/Zeitersparnis): Existiert bereits ein markierter
            Sammelkommentar, ist dies ein Folge-Review nach einem Fixup-Push — dann NICHT den
            kompletten PR-Diff erneut komplett durchgehen. Stattdessen dessen `updatedAt`-Zeitstempel
            aus der API-Antwort (s. o.) auslesen und NUR die Commits/den Diff SEIT diesem Zeitpunkt
            prüfen (`gh pr view --json commits --jq '.commits[] | select(.committedDate > "<updatedAt>")'`,
            darauf `git diff <ältester-neuer-commit>^..HEAD`) auf neue oder weiterhin bestehende
            Findings prüfen; bereits in „Behobene Anmerkungen" geführte Punkte NICHT erneut aufrollen.
            Ticket-Kontext und Architektur-Berührpunkte dabei weiterhin im Blick behalten (nicht rein
            diff-lokal urteilen). Fehlt der markierte Kommentar (ERSTREVIEW), IMMER den vollständigen
            Diff prüfen.

            Abschluss — GENAU EINEN Weg gehen. Labels sind IMMER der ALLERLETZTE Schritt, NIE davor
            — Fixup/Gate-Merge liest den PR-Stand unmittelbar nach dem zweiten Label-Befehl:
              - Es gibt zutreffende, offene Findings → als EINE Review (`gh pr review --comment`)
                mit an Datei/Zeile verankerten Kommentaren (Was / Warum / Vorschlag) posten, das
                Urteil im konsolidierten Sammelkommentar (s. o.) aktualisieren, ERST DANACH
                die Labels in ZWEI getrennten Befehlen umschalten (nie kombiniert, sonst Doppel-Trigger):
                `gh pr edit ${{ github.event.pull_request.number }} --remove-label ai:needs-review`,
                danach `gh pr edit ${{ github.event.pull_request.number }} --add-label ai:needs-changes`
              - Der PR ist solide (🟢) → KEINE Pseudo-Findings erfinden, nur eine knappe
                🟢-Bestätigung im konsolidierten Sammelkommentar (s. o.), ERST DANACH die Labels in
                ZWEI Befehlen:
                `gh pr edit ${{ github.event.pull_request.number }} --remove-label ai:needs-review`,
                danach `gh pr edit ${{ github.event.pull_request.number }} --add-label ai:ready-to-merge`

            Trägt der PR das Label `ai:continued` (von einem vorherigen Zwischenstopp), entferne es
            in beiden Fällen zusätzlich als letzten Schritt
            (`gh pr edit ${{ github.event.pull_request.number }} --remove-label ai:continued`).

            Fehlt ein Label, vorher anlegen (`gh label create "ai:needs-changes" --color D93F0B`
            bzw. `"ai:ready-to-merge" --color 0E8A16`). Ändere KEINEN Code und committe nichts —
            reiner Review. Bearbeite ausschließlich diesen PR; arbeite ohne interaktive Rückfrage.

            Weiches Zeitlimit (Soft-Abort): Dieser Lauf wird nach 20 Minuten HART abgebrochen (kein
            SIGTERM-Handling möglich). Prüfe daher VOR jedem größeren Prüfaspekt (nächste Datei,
            nächster Architektur-Berührpunkt) mit
            `test "$(date +%s)" -ge ${{ steps.starttime.outputs.soft_deadline_epoch }}`, ob das
            weiche Limit (14 Min nach Start, 6 Min Puffer) erreicht ist. Ist das der Fall, STOPPE
            SOFORT die weitere Prüfung kontrolliert und fuehre NUR noch dies aus: die bisherigen
            Teil-Findings im Sammelkommentar `<!-- ai-review -->` festhalten und deutlich als
            "Review noch nicht vollständig — Fortsetzung folgt" markieren (NICHT als abschließendes
            Urteil), dann `gh pr edit ${{ github.event.pull_request.number }} --add-label
            ai:continued` setzen (Label bei Bedarf vorher `gh label create "ai:continued" --color
            FBCA04` anlegen) UND `ai:needs-review` entfernen+sofort wieder setzen
            (Selbst-Retrigger — NICHT auf `ai:needs-changes`/`ai:ready-to-merge` umschalten, das
            Review ist noch nicht abgeschlossen). Danach den Turn beenden.
          claude_args: >-
            --model claude-sonnet-4-6 --effort medium --max-turns 30
            ${{ steps.session-restore.outputs.resume-arg }}
            --allowedTools "Bash(gh pr:*),Bash(gh issue view:*),Bash(gh label:*),Bash(gh api:*),Bash(git fetch:*),Bash(git diff:*),Read,Grep,Glob,Task"
            --append-system-prompt "Automatisierter, label-gesteuerter Kreuzverhoer-Review in GitHub Actions (headless). Reviewe ausschliesslich PR #${{ github.event.pull_request.number }}, aendere keinen Code. Schliesse IMMER mit der Label-Umschaltung als ALLERLETZTEN Schritt ab (NIE davor — erst nach dem Sammelkommentar, da Fixup/Gate-Merge den PR-Stand unmittelbar danach lesen): Findings -> ai:needs-changes (statt ai:needs-review); sauber -> ai:ready-to-merge. Erfinde keine Findings. HARTES 20-Minuten-Timeout, weiches Limit bei 14 Min (Soft-Abort): pruefe vor jedem groesseren Pruefaspekt `date +%s` gegen ${{ steps.starttime.outputs.soft_deadline_epoch }}; ist das erreicht, halte die Teil-Findings im Sammelkommentar als unvollstaendig fest, setze ai:continued UND entferne+setze ai:needs-review neu (Selbst-Retrigger, der Folgelauf setzt per --resume fort) statt ai:needs-changes/ai:ready-to-merge zu setzen, dann beende den Turn. Arbeite ohne interaktive Rueckfrage. Delegations-Strategie s. Prompt-Anfang (heavy/light je nach PR-Komplexitaet)."

      # Named Session Resume (Phase "review"): sichert die eben beendete/abgebrochene Session ins
      # Sitzungsarchiv, damit ein Selbst-Retrigger-Folgelauf per --resume anknuepfen kann.
      # if: always() -- auch ein in den harten Timeout gelaufener Lauf sichert seinen Teil-Fortschritt.
      - name: Session-Archiv sichern (Phase review)
        if: always() && steps.preflight.outputs.configured == 'true'
        continue-on-error: true
        uses: ./.github/actions/session-save
        with:
          issue: ${{ github.event.pull_request.number }}
          phase: review
          session-id: ${{ steps.claude.outputs.session_id }}
          gh-token: ${{ steps.app-token.outputs.token }}

      # Soft-Abort-Obergrenze (2026-07-08): das Label "ai:continued" wird NUR von Claude selbst
      # gesetzt (expliziter Teil der Stopp-Checkliste) -- eindeutig von einem normal beendeten
      # Review (Findings ODER 🟢) unterscheidbar. Begrenzt automatische Selbst-Fortsetzungen auf
      # genau EINE; bei Erschoepfung wird "ai:needs-review" entfernt (Loop stoppt) OHNE ein
      # automatisches Ergebnis-Label zu setzen (kein Fixup mit erfundenen Findings, kein falsches
      # ai:ready-to-merge) -- reiner Alarm-Kommentar fuer den Menschen. `handled=true` unterdrueckt
      # die nachfolgende Label-Post-Assertion, die sonst den Safe-Default ai:needs-changes erzwingen
      # wuerde.
      - name: Soft-Abort-Fortsetzung erkennen und begrenzen (ai:continued)
        id: soft-abort-cap
        if: always() && steps.preflight.outputs.configured == 'true' && steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          ALREADY_CONTINUED: ${{ steps.continued-before.outputs.already }}
        run: |
          has_continued="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels \
            --jq 'any(.labels[]; .name == "ai:continued")' 2>/dev/null || echo false)"

          if [ "${has_continued:-false}" != "true" ]; then
            echo "handled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${ALREADY_CONTINUED:-false}" = "true" ]; then
            echo "::warning title=PR #${PR} Fortsetzungs-Obergrenze::Zweiter Zwischenstopp in Folge -- automatische Fortsetzung ausgeschoepft."
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "ai:needs-review" 2>/dev/null || true
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "ai:continued" 2>/dev/null || true
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "🛑 **Kreuzverhör-Review #${PR} — Fortsetzungs-Obergrenze erreicht**

          2 Versuche (Original + 1 automatische Fortsetzung) ausgeschöpft, ohne das Review abzuschließen. Kein automatisches Ergebnis-Label gesetzt — bitte manuell reviewen." 2>/dev/null || true
          else
            echo "::notice title=PR #${PR} Soft-Abort::Erster Zwischenstopp -- Folgelauf per Selbst-Retrigger (ai:needs-review) unterwegs."
          fi
          echo "handled=true" >> "$GITHUB_OUTPUT"

      # Deterministisches Abschluss-Signal (unabhaengig von der LLM-Ausgabe): laeuft auch bei
      # Abbruch/Timeout (if: always()) und macht im Log/Job-Summary klar sichtbar, DASS und mit
      # welchem Ergebnis der Lauf fertig ist. outcome=cancelled signalisiert das 20-Min-Timeout.
      - name: Ergebnis zusammenfassen
        if: always() && steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
        run: |
          labels="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          {
            echo "### Kreuzverhoer-Review #${PR} — fertig"
            echo ""
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\` (cancelled = 20-Min-Timeout erreicht)"
            echo "- Aktuelle Pipeline-Labels: ${labels:-keine}"
            if [ -n "$SESSION_ID" ]; then echo "- Session-ID: \`${SESSION_ID}\` (\`--resume\` zum Nachschauen)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Kreuzverhoer-Review #${PR} fertig::Claude-Schritt ${OUTCOME:-unbekannt}; Labels: ${labels:-keine}"

      # Deterministisches Timeout-Signal fuer PR-Workflows (Haerten S3): review/fixup vergeben
      # bewusst KEIN ai:to-big-issue (AGENTS.md) — sonst staute der PR unsichtbar, wenn er in das
      # 20-Min-Timeout laeuft. cancel-in-progress:false bedeutet: outcome=cancelled ist hier ein
      # ECHTES Timeout (kein Supersede wie bei cancel-in-progress:true), daher kein Zeit-Guard
      # noetig. Dieser Schritt postet bei Timeout einen sichtbaren PR-Kommentar als Alarm.
      - name: Bei Timeout PR-Kommentar (Alarm)
        if: always() && steps.preflight.outputs.configured == 'true' && steps.claude.outcome == 'cancelled'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⚠️ **Kreuzverhör-Review #${PR} — 20-Min-Timeout erreicht**

          Der Review-Lauf wurde hart abgebrochen (wahrscheinlich zu großer PR). Bitte PR-Größe reduzieren (aufteilen) oder manuell reviewen." 2>/dev/null || true

      # Deterministische Label-Post-Assertion (Haerten H1/S4): der Gate-Workflow wertet den Reviewer-
      # Check als "gruen", sobald der Review-Job durchlaeuft. Vergisst/halluziniert der Agent die
      # Label-Umschaltung (weder ai:needs-changes noch ai:ready-to-merge), bliebe der PR sonst still
      # auf ai:needs-review stehen (kein Folge-Workflow feuert). Dieser Step setzt deterministisch
      # den Safe-Default ai:needs-changes, sobald nach Agent-Ende kein Ergebnis-Label existiert — so
      # greift der Fixup (sichtbar) statt einer stillen Stalle. Laeuft NICHT bei cancelled (Timeout
      # -> S3 alarmiert) und nicht bei skipped (Preflight).
      - name: Label-Post-Assertion (Safe-Default ai:needs-changes)
        # steps.soft-abort-cap.outputs.handled == 'true' -- der Soft-Abort-Cap-Step hat diesen Lauf
        # bereits als bewussten Zwischenstopp (oder dessen Erschoepfung) behandelt; die Post-
        # Assertion soll dieses Ergebnis NICHT mit dem Safe-Default ai:needs-changes ueberschreiben.
        if: always() && steps.preflight.outputs.configured == 'true' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure') && steps.soft-abort-cap.outputs.handled != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Fallback bei transienter gh-API-Stoerung: die Safe-Default-Assertion greift nur, wenn
          # die Labels lesbar sind (sonst wuerde set -euo pipefail den Step toeten, bevor der Safe-
          # Default greift). In dem Fall: PR bleibt unangetastet (kein false Safe-Default).
          if ! labels_json="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]' 2>/dev/null)"; then
            echo "::warning::Labels nicht lesbar (gh-API) — Label-Post-Assertion übersprungen."
            exit 0
          fi
          has_changes="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:needs-changes")')"
          has_ready="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:ready-to-merge")')"
          has_review="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:needs-review")')"

          # Fall A: kein Ergebnis-Label nach Agent-Ende -> Safe-Default ai:needs-changes
          if [ "$has_changes" != "true" ] && [ "$has_ready" != "true" ]; then
            if [ "$has_review" = "true" ]; then
              gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai:needs-review
            fi
            gh label create "ai:needs-changes" --repo "$GITHUB_REPOSITORY" --color D93F0B 2>/dev/null || true
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ai:needs-changes
            # Alarm-Kommentar (H-2 Mitigation): ein moeglicher 0-Commit-Loop (Review vergisst Label
            # -> Fixup ohne Findings -> Review -> ...) wird so fuer den Menschen sichtbar.
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⚠️ **Review ohne Ergebnis-Label — Safe-Default**

          Der Review-Agent hat weder \`ai:needs-changes\` noch \`ai:ready-to-merge\` gesetzt. Workflow setzt Safe-Default \`ai:needs-changes\`. **Manuelle Prüfung nötig** — falls der Fixup keine Findings findet und der Loop kreist, bitte manuell reviewen/entscheiden." 2>/dev/null || true
            echo "::error title=Review ohne Ergebnis-Label::Agent hat weder ai:needs-changes noch ai:ready-to-merge gesetzt — Safe-Default ai:needs-changes + Alarm-Kommentar (Fixup wird ausgelöst)."
            exit 0
          fi
          # Fall B: Ergebnis-Label gesetzt, aber ai:needs-review nicht entfernt -> nachträglich entfernen
          if [ "$has_review" = "true" ]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai:needs-review
            echo "::notice::ai:needs-review nachträglich entfernt (Agent hatte Ergebnis-Label gesetzt, needs-review aber belassen)."
          fi

      # Deterministisches "Reviewer rot bei Findings": Der Review aendert keinen Code, sondern
      # signalisiert sein Ergebnis ueber Labels. Damit der Gate/Auto-Merge-Workflow (claude-pr-gate-merge.yml) den
      # Reviewer als vollwertigen "roten Check" der Allowlist (CI + Reviewer) lesen kann, beendet
      # dieser Schritt den Job mit Exit != 0, sobald das Ergebnis-Label ai:needs-changes ist —
      # sauber (ai:ready-to-merge) bleibt gruen. Laeuft NACH dem Zusammenfassen, damit das Summary
      # immer geschrieben wird; aendert KEINEN Code (Ticket #87).
      - name: Reviewer rot, wenn Aenderungen erforderlich (ai:needs-changes)
        if: always() && steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels_json="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]' 2>/dev/null || echo '[]')"
          needs_changes="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:needs-changes")')"
          needs_review="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:needs-review")')"
          ready_to_merge="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:ready-to-merge")')"

          if [ "$needs_changes" = "true" ]; then
            echo "::error title=Review: Aenderungen erforderlich::PR #${PR} hat ai:needs-changes — Reviewer-Check laeuft rot, damit das CI-Gate ihn als roten Check erkennt."
            exit 1
          fi
          # Soft-Abort-Obergrenze erschoepft (siehe Cap-Step oben): weder ai:needs-review noch ein
          # Ergebnis-Label vorhanden -- das Review ist stecken geblieben, braucht menschliches
          # Eingreifen. Auch das soll rot laufen statt still gruen zu bleiben.
          if [ "$needs_review" != "true" ] && [ "$ready_to_merge" != "true" ]; then
            echo "::error title=Review stecken geblieben::PR #${PR} hat kein Pipeline-Ergebnis-Label (Fortsetzungs-Obergrenze erreicht) — Reviewer-Check laeuft rot, bis ein Mensch eingreift."
            exit 1
          fi
          echo "Keine offenen Findings (kein ai:needs-changes) — Reviewer-Check bleibt gruen."
