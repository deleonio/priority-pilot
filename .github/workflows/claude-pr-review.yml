name: Claude PR Review (Kreuzverhoer)

# Reviewt einen Pull Request im Kreuzverhoer, sobald er das Label "ai:needs-review" traegt (vom
# Umsetzungs-Workflow gesetzt, oder manuell zum Opt-in). Die Pipeline wird ueber LABELS gesteuert
# statt ueber Review-/Kommentar-Events -> stabiles Ping-Pong ohne Event-Kaskaden:
#   - zutreffende Findings -> Label "ai:needs-changes" (loest claude-pr-fixup.yml aus)
#   - sauber 🟢            -> Label "ai:ready-to-merge" (terminal; claude-pr-gate-merge.yml mergt automatisch)
# Das ausloesende "ai:needs-review" wird dabei entfernt. Aendert KEINEN Code.
#
# Nutzt ein kurzlebiges GitHub-App-Token, damit die gesetzten Labels die Folge-Workflows ausloesen.
# Voraussetzungen: CLAUDE_CODE_OAUTH_TOKEN sowie eine GitHub App, hinterlegt als APP_ID +
# APP_PRIVATE_KEY (Contents/Issues/Pull requests = Read and write).

on:
  pull_request:
    types: [opened, ready_for_review, labeled]

concurrency:
  # EIGENE Gruppe pro Workflow (Review getrennt von Fixup). Frueher teilten sich Review und Fixup
  # die Gruppe claude-pr-<nr>. Da BEIDE Workflows auf jedes `labeled`-Event triggern (nur der
  # Job-`if` filtert das richtige Label, die Concurrency greift aber VOR dem `if`), landete bei
  # jeder Label-Aenderung je ein Review- UND ein Fixup-Run in derselben Gruppe — auch der, dessen
  # Job ohnehin skippt. GitHub haelt pro Gruppe nur einen laufenden + einen wartenden Run und
  # cancelt den aelteren wartenden; so verdraengte ein No-op-Geschwister-Run (gleiches Event,
  # falsches Label) den echten Run aus dem einzigen Pending-Slot: der Fixup wurde abgebrochen statt
  # zu laufen. Getrennte Gruppen entkoppeln das — serialisiert wird nur noch der jeweils GLEICHE
  # Workflow desselben PRs. cancel-in-progress: false -> laufenden Lauf nie mittendrin verwerfen
  # (der wartende Lauf checkt beim Start ohnehin den juengsten Stand aus).
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    # Nur Pipeline-PRs (Label ai:needs-review vorhanden), nicht-Draft, kein Fork.
    if: >-
      ${{ github.event.pull_request.draft == false
          && github.event.pull_request.head.repo.full_name == github.repository
          && contains(github.event.pull_request.labels.*.name, 'ai:needs-review') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Voraussetzung pruefen (GitHub-App-Secrets)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::GitHub-App-Secrets fehlen (APP_ID und/oder APP_PRIVATE_KEY) — Lauf wird uebersprungen (kein Fehler). GitHub App anlegen (Contents/Issues/Pull requests = Read and write), aufs Repo installieren und beide Werte als Repo-Secrets hinterlegen, damit die Pipeline laeuft."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      # Deterministischer Agent-Secret-Check (Haerten S2): das Opt-in fuer GLM/Mistral (und die
      # OAuth-Token-Voraussetzung fuer Claude) darf NICHT still skippen — fehlt das zum aktiven
      # AI_AGENT-Pfad gehoerige Secret, bricht der Lauf hier deterministisch ab (::error::, kein
      # stiller Skip). Der Reviewer-Check wird rot -> Gate setzt ai:needs-changes -> sichtbar.
      # Zusaetzlich ein PR-Kommentar (statt Issue-Label wie bei triage/spec/implement — PR-Workflows
      # vergeben bewusst kein ai:to-big-issue, s. S3/Timeout-Alarm), damit der PR-Autor aktiv erreicht
      # wird statt nur den Checks-Tab pruefen zu muessen.
      - name: Agent-Secret prüfen (kein stiller Skip)
        if: steps.preflight.outputs.configured == 'true'
        env:
          AI_AGENT: ${{ vars.AI_AGENT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          missing=""
          # Haerten C2-Nachtrag: GitHub-Actions-`==` (die if:-Bedingungen der Agent-Schritte)
          # vergleicht Strings case-insensitiv, Bashs `case` NICHT. Ohne `,,`-Lowering wuerde
          # z. B. AI_AGENT=GLM zum GLM-Schritt routen, aber hier in den `*)`-Default-Zweig fallen
          # (CLAUDE_CODE_OAUTH_TOKEN statt ZAI_API_KEY geprueft) — der S2-Stille-Skip waere ueber
          # Gross-/Kleinschreibung wieder offen.
          case "${AI_AGENT,,}" in
            glm)     [ -z "$ZAI_API_KEY" ] && missing="ZAI_API_KEY" ;;
            mistral) [ -z "$MISTRAL_API_KEY" ] && missing="MISTRAL_API_KEY" ;;
            *)       [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && missing="CLAUDE_CODE_OAUTH_TOKEN" ;;
          esac
          if [ -n "$missing" ]; then
            echo "::error title=Agent-Secret fehlt::AI_AGENT='${AI_AGENT:-claude}' benoetigt Secret '$missing' — fehlt es, darf der Lauf nicht still skippen (AGENTS.md: bewusstes Opt-in). Secret als Repo-Secret hinterlegen."
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "🛑 **Kreuzverhör-Review #${PR} — Agent-Secret fehlt**

          AI_AGENT='${AI_AGENT:-claude}' benötigt Secret \`$missing\`, das nicht gesetzt ist. Der Lauf wurde abgebrochen (kein stiller Skip). Bitte Secret hinterlegen oder \`AI_AGENT\` zurücksetzen." 2>/dev/null || true
            exit 1
          fi
          echo "Agent-Secret fuer AI_AGENT='${AI_AGENT:-claude}' vorhanden."

      # Standard-Pfad (Claude): laeuft, solange die Repo-Variable AI_AGENT NICHT auf "mistral"
      # oder "glm" steht (auch ungesetzt -> Claude bleibt Default). Umschalten:
      # `gh variable set AI_AGENT --body glm` (Z.ai GLM) oder
      # `gh variable set AI_AGENT --body mistral` (Mistral Vibe);
      # zurueck: `gh variable set AI_AGENT --body claude`.
      - name: Kreuzverhoer-Review via Claude Code
        id: claude
        if: steps.preflight.outputs.configured == 'true' && vars.AI_AGENT != 'mistral' && vars.AI_AGENT != 'glm'
        uses: anthropics/claude-code-action@a92e7c70a4da9793dc164451d829089dc057a464 # v1.0.159
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }} # Labels als App-Token -> loesen Folge-Workflows aus
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # Erlaubte Bot-Ausloeser — das Label wird vom App-Bot (claude[bot]) gesetzt, sonst blockt
          # checkHumanActor diesen Lauf. Absicherung zusaetzlich ueber den Job-`if:`.
          allowed_bots: 'claude[bot],my-github-action-bot'
          prompt: |
            Bewerte zunächst die PR-Komplexität (Diff-Umfang, Architektur-Berührpunkte,
            Sicherheits-/Performance-Aspekte) und delegiere das eigentliche Kreuzverhoer-Review
            via Agent-Tool an den passenden Subagenten: triviale/mechanische PRs an `light`
            (Haiku), komplexe/architektonische PRs an `heavy` (Opus); Standard-Reviews führst
            du selbst auf Sonnet durch (kein Subagenten-Aufruf).

            Reviewe Pull Request #${{ github.event.pull_request.number }} im Kreuzverhör
            (Label `ai:needs-review` ist gesetzt). Die Pipeline koordiniert ausschließlich über
            LABELS — schließe daher GENAU mit einer der beiden Label-Umschaltungen unten ab.

            Folge dem Ablauf .ai-knowledge/pr-review.md (entspricht
            `/kreuzverhoer-review ${{ github.event.pull_request.number }}`): vollständigen Diff
            (`gh pr diff`) und das verknüpfte Ticket lesen, adversarial prüfen (löst der PR das
            Problem ganz? Edge Cases? einfachster Weg? Performance/Security?), Code-Qualität und
            Projekt-Konventionen prüfen.

            Sammelkommentar konsolidieren (kein Duplikat pro Runde): Das zusammenfassende Urteil
            wird als GENAU EIN markierter KI-Kommentar `<!-- ai-review -->` (erste Zeile) pro PR
            gepflegt. Vor dem Posten den bestehenden markierten Kommentar per API suchen
            (`gh api repos/{owner}/{repo}/issues/${{ github.event.pull_request.number }}/comments`,
            nach `<!-- ai-review -->` filtern); ist er vorhanden, ihn per
            `gh api --method PATCH repos/{owner}/{repo}/issues/comments/<id>` AKTUALISIEREN (Comment-ID
            bleibt gleich) statt einen neuen anzulegen — nur einmalig neu anlegen, wenn keiner existiert.
            Der Kommentar trennt „Offene Findings" (aktuelle Runde) von einer History-Tabelle
            „Behobene Anmerkungen" (Runde | Finding | Status ✅). Inline-Findings bleiben unverändert.

            Abschluss — GENAU EINEN Weg gehen:
              - Es gibt zutreffende, offene Findings → als EINE Review (`gh pr review --comment`)
                mit an Datei/Zeile verankerten Kommentaren (Was / Warum / Vorschlag) posten, das
                Urteil im konsolidierten Sammelkommentar (s. o.) aktualisieren, dann
                die Labels in ZWEI getrennten Befehlen umschalten (nie kombiniert, sonst Doppel-Trigger):
                `gh pr edit ${{ github.event.pull_request.number }} --remove-label ai:needs-review`,
                danach `gh pr edit ${{ github.event.pull_request.number }} --add-label ai:needs-changes`
              - Der PR ist solide (🟢) → KEINE Pseudo-Findings erfinden, nur eine knappe
                🟢-Bestätigung im konsolidierten Sammelkommentar (s. o.), dann die Labels in ZWEI Befehlen:
                `gh pr edit ${{ github.event.pull_request.number }} --remove-label ai:needs-review`,
                danach `gh pr edit ${{ github.event.pull_request.number }} --add-label ai:ready-to-merge`

            Fehlt ein Label, vorher anlegen (`gh label create "ai:needs-changes" --color D93F0B`
            bzw. `"ai:ready-to-merge" --color 0E8A16`). Ändere KEINEN Code und committe nichts —
            reiner Review. Bearbeite ausschließlich diesen PR; arbeite ohne interaktive Rückfrage.
          claude_args: >-
            --model claude-sonnet-4-6 --effort medium
            --allowedTools "Bash(gh pr:*),Bash(gh issue view:*),Bash(gh label:*),Bash(gh api:*),Bash(git fetch:*),Bash(git diff:*),Read,Grep,Glob,Task"
            --append-system-prompt "Automatisierter, label-gesteuerter Kreuzverhoer-Review in GitHub Actions (headless). Reviewe ausschliesslich PR #${{ github.event.pull_request.number }}, aendere keinen Code. Schliesse IMMER mit der Label-Umschaltung ab: Findings -> ai:needs-changes (statt ai:needs-review); sauber -> ai:ready-to-merge. Erfinde keine Findings. Arbeite ohne interaktive Rueckfrage. Modell-Strategie: Du laeufst als Sonnet-Koordinator. Schaetze die Komplexitaet der Aufgabe ein und delegiere die eigentliche Abarbeitung per Agent-Tool an einen Subagenten in derselben Session: heavy (Opus) fuer komplexe/architektonische Aufgaben, light (Haiku) fuer triviale/mechanische Aufgaben; Standard- und Koordinationsarbeit erledigst du selbst auf Sonnet."

      # Mistral-Pfad (AI_AGENT == 'mistral'): Vibe laeuft headless OHNE Approval-Callback — ohne
      # erzwungenes Auto-Approve wuerde jedes genehmigungspflichtige Tool (gh/git) als "Tool
      # execution not permitted" uebersprungen. default_agent=auto-approve setzt
      # bypass_tool_permissions=true; ~/.vibe/config.toml ist der Default-Konfig-Ort (VIBE_HOME).
      - name: Vibe-Konfig (Headless Auto-Approve)
        if: steps.preflight.outputs.configured == 'true' && vars.AI_AGENT == 'mistral'
        run: |
          mkdir -p "$HOME/.vibe"
          cat > "$HOME/.vibe/config.toml" <<'EOF'
          default_agent = "auto-approve"
          bypass_tool_permissions = true
          EOF

      # Spiegelt den Claude-Schritt: gleicher Review-Ablauf, anderer Agent. GH_TOKEN = App-Token,
      # damit die Label-Umschaltungen die Folge-Workflows ausloesen. Die Vibe-Action reicht KEINE
      # Extra-Flags durch (kein allowed_bots/github_token noetig — der Job-`if` gated bereits ueber
      # Labels) — System-Prompt-Regeln als fuehrender [KONTEXT]-Block im prompt.
      - name: Kreuzverhoer-Review via Mistral Vibe
        id: mistral
        if: steps.preflight.outputs.configured == 'true' && vars.AI_AGENT == 'mistral'
        uses: mistralai/mistral-vibe@e607ccbb0046c9f68c8d49a85d4dab7c28239f08 # v2.18.0
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }} # Labels als App-Token -> loesen Folge-Workflows aus
        with:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          args: --trust
          prompt: |
            [KONTEXT/REGELN] Automatisierter, label-gesteuerter Kreuzverhoer-Review in GitHub
            Actions (headless). Reviewe ausschliesslich PR #${{ github.event.pull_request.number }},
            aendere KEINEN Code und committe nichts. Schliesse IMMER mit der Label-Umschaltung ab:
            Findings -> ai:needs-changes (statt ai:needs-review); sauber -> ai:ready-to-merge.
            Erfinde keine Findings. Arbeite ohne interaktive Rueckfrage. Nutze fuer
            GitHub-Operationen die `gh`-CLI (Token ist gesetzt).

            Reviewe Pull Request #${{ github.event.pull_request.number }} im Kreuzverhör
            (Label `ai:needs-review` ist gesetzt). Die Pipeline koordiniert ausschließlich über
            LABELS — schließe daher GENAU mit einer der beiden Label-Umschaltungen unten ab.

            Folge dem Ablauf .ai-knowledge/pr-review.md (entspricht
            `/kreuzverhoer-review ${{ github.event.pull_request.number }}`): vollständigen Diff
            (`gh pr diff`) und das verknüpfte Ticket lesen, adversarial prüfen (löst der PR das
            Problem ganz? Edge Cases? einfachster Weg? Performance/Security?), Code-Qualität und
            Projekt-Konventionen prüfen.

            Sammelkommentar konsolidieren (kein Duplikat pro Runde): Das zusammenfassende Urteil
            wird als GENAU EIN markierter KI-Kommentar `<!-- ai-review -->` (erste Zeile) pro PR
            gepflegt. Vor dem Posten den bestehenden markierten Kommentar per API suchen
            (`gh api repos/{owner}/{repo}/issues/${{ github.event.pull_request.number }}/comments`,
            nach `<!-- ai-review -->` filtern); ist er vorhanden, ihn per
            `gh api --method PATCH repos/{owner}/{repo}/issues/comments/<id>` AKTUALISIEREN (Comment-ID
            bleibt gleich) statt einen neuen anzulegen — nur einmalig neu anlegen, wenn keiner existiert.
            Der Kommentar trennt „Offene Findings" (aktuelle Runde) von einer History-Tabelle
            „Behobene Anmerkungen" (Runde | Finding | Status ✅). Inline-Findings bleiben unverändert.

            Abschluss — GENAU EINEN Weg gehen:
              - Es gibt zutreffende, offene Findings → als EINE Review (`gh pr review --comment`)
                mit an Datei/Zeile verankerten Kommentaren (Was / Warum / Vorschlag) posten, das
                Urteil im konsolidierten Sammelkommentar (s. o.) aktualisieren, dann
                die Labels in ZWEI getrennten Befehlen umschalten (nie kombiniert, sonst Doppel-Trigger):
                `gh pr edit ${{ github.event.pull_request.number }} --remove-label ai:needs-review`,
                danach `gh pr edit ${{ github.event.pull_request.number }} --add-label ai:needs-changes`
              - Der PR ist solide (🟢) → KEINE Pseudo-Findings erfinden, nur eine knappe
                🟢-Bestätigung im konsolidierten Sammelkommentar (s. o.), dann die Labels in ZWEI Befehlen:
                `gh pr edit ${{ github.event.pull_request.number }} --remove-label ai:needs-review`,
                danach `gh pr edit ${{ github.event.pull_request.number }} --add-label ai:ready-to-merge`

            Fehlt ein Label, vorher anlegen (`gh label create "ai:needs-changes" --color D93F0B`
            bzw. `"ai:ready-to-merge" --color 0E8A16`). Ändere KEINEN Code und committe nichts —
            reiner Review. Bearbeite ausschließlich diesen PR; arbeite ohne interaktive Rückfrage.

      # GLM-Pfad (AI_AGENT == 'glm'): verwendet die claude-code-action mit dem Z.ai-Anthropic-
      # kompatiblen Endpoint statt Anthropic. Authentifizierung ueber ZAI_API_KEY
      # (anthropic_api_key); Z.ai mappt Claude-Modellnamen automatisch auf GLM-Modelle.
      - name: Kreuzverhoer-Review via GLM (Z.ai)
        id: glm
        if: steps.preflight.outputs.configured == 'true' && vars.AI_AGENT == 'glm'
        uses: anthropics/claude-code-action@a92e7c70a4da9793dc164451d829089dc057a464 # v1.0.159
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          API_TIMEOUT_MS: '3000000'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        with:
          anthropic_api_key: ${{ secrets.ZAI_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          allowed_bots: 'claude[bot],my-github-action-bot'
          prompt: |
            Bewerte zunächst die PR-Komplexität (Diff-Umfang, Architektur-Berührpunkte,
            Sicherheits-/Performance-Aspekte) und delegiere das eigentliche Kreuzverhoer-Review
            via Agent-Tool an den passenden Subagenten: triviale/mechanische PRs an `light`
            (Haiku), komplexe/architektonische PRs an `heavy` (Opus); Standard-Reviews führst
            du selbst auf Sonnet durch (kein Subagenten-Aufruf).

            Reviewe Pull Request #${{ github.event.pull_request.number }} im Kreuzverhör
            (Label `ai:needs-review` ist gesetzt). Die Pipeline koordiniert ausschließlich über
            LABELS — schließe daher GENAU mit einer der beiden Label-Umschaltungen unten ab.

            Folge dem Ablauf .ai-knowledge/pr-review.md (entspricht
            `/kreuzverhoer-review ${{ github.event.pull_request.number }}`): vollständigen Diff
            (`gh pr diff`) und das verknüpfte Ticket lesen, adversarial prüfen (löst der PR das
            Problem ganz? Edge Cases? einfachster Weg? Performance/Security?), Code-Qualität und
            Projekt-Konventionen prüfen.

            Sammelkommentar konsolidieren (kein Duplikat pro Runde): Das zusammenfassende Urteil
            wird als GENAU EIN markierter KI-Kommentar `<!-- ai-review -->` (erste Zeile) pro PR
            gepflegt. Vor dem Posten den bestehenden markierten Kommentar per API suchen
            (`gh api repos/{owner}/{repo}/issues/${{ github.event.pull_request.number }}/comments`,
            nach `<!-- ai-review -->` filtern); ist er vorhanden, ihn per
            `gh api --method PATCH repos/{owner}/{repo}/issues/comments/<id>` AKTUALISIEREN (Comment-ID
            bleibt gleich) statt einen neuen anzulegen — nur einmalig neu anlegen, wenn keiner existiert.
            Der Kommentar trennt „Offene Findings" (aktuelle Runde) von einer History-Tabelle
            „Behobene Anmerkungen" (Runde | Finding | Status ✅). Inline-Findings bleiben unverändert.

            Abschluss — GENAU EINEN Weg gehen:
              - Es gibt zutreffende, offene Findings → als EINE Review (`gh pr review --comment`)
                mit an Datei/Zeile verankerten Kommentaren (Was / Warum / Vorschlag) posten, das
                Urteil im konsolidierten Sammelkommentar (s. o.) aktualisieren, dann
                die Labels in ZWEI getrennten Befehlen umschalten (nie kombiniert, sonst Doppel-Trigger):
                `gh pr edit ${{ github.event.pull_request.number }} --remove-label ai:needs-review`,
                danach `gh pr edit ${{ github.event.pull_request.number }} --add-label ai:needs-changes`
              - Der PR ist solide (🟢) → KEINE Pseudo-Findings erfinden, nur eine knappe
                🟢-Bestätigung im konsolidierten Sammelkommentar (s. o.), dann die Labels in ZWEI Befehlen:
                `gh pr edit ${{ github.event.pull_request.number }} --remove-label ai:needs-review`,
                danach `gh pr edit ${{ github.event.pull_request.number }} --add-label ai:ready-to-merge`

            Fehlt ein Label, vorher anlegen (`gh label create "ai:needs-changes" --color D93F0B`
            bzw. `"ai:ready-to-merge" --color 0E8A16`). Ändere KEINEN Code und committe nichts —
            reiner Review. Bearbeite ausschließlich diesen PR; arbeite ohne interaktive Rückfrage.
          claude_args: >-
            --model claude-sonnet-4-6 --effort medium
            --allowedTools "Bash(gh pr:*),Bash(gh issue view:*),Bash(gh label:*),Bash(gh api:*),Bash(git fetch:*),Bash(git diff:*),Read,Grep,Glob,Task"
            --append-system-prompt "Automatisierter, label-gesteuerter Kreuzverhoer-Review in GitHub Actions (headless). Reviewe ausschliesslich PR #${{ github.event.pull_request.number }}, aendere keinen Code. Schliesse IMMER mit der Label-Umschaltung ab: Findings -> ai:needs-changes (statt ai:needs-review); sauber -> ai:ready-to-merge. Erfinde keine Findings. Arbeite ohne interaktive Rueckfrage. Modell-Strategie: Du laeufst als Sonnet-Koordinator. Schaetze die Komplexitaet der Aufgabe ein und delegiere die eigentliche Abarbeitung per Agent-Tool an einen Subagenten in derselben Session: heavy (Opus) fuer komplexe/architektonische Aufgaben, light (Haiku) fuer triviale/mechanische Aufgaben; Standard- und Koordinationsarbeit erledigst du selbst auf Sonnet."

      # Deterministisches Abschluss-Signal (unabhaengig von der LLM-Ausgabe): laeuft auch bei
      # Abbruch/Timeout (if: always()) und macht im Log/Job-Summary klar sichtbar, DASS und mit
      # welchem Ergebnis der Lauf fertig ist. outcome=cancelled signalisiert das 20-Min-Timeout.
      - name: Ergebnis zusammenfassen
        if: always() && steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          AGENT: ${{ vars.AI_AGENT == 'mistral' && 'Mistral' || (vars.AI_AGENT == 'glm' && 'GLM (Z.ai)' || 'Claude') }}
          # Outcome des tatsaechlich gelaufenen Agent-Schritts (die anderen sind 'skipped').
          OUTCOME: ${{ steps.claude.outcome != 'skipped' && steps.claude.outcome || (steps.glm.outcome != 'skipped' && steps.glm.outcome || steps.mistral.outcome) }}
          SESSION_ID: ${{ steps.claude.outputs.session_id || steps.glm.outputs.session_id }}
        run: |
          labels="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          {
            echo "### Kreuzverhoer-Review #${PR} — fertig"
            echo ""
            echo "- ${AGENT}-Schritt: \`${OUTCOME:-unbekannt}\` (cancelled = 20-Min-Timeout erreicht)"
            echo "- Aktuelle Pipeline-Labels: ${labels:-keine}"
            if [ -n "$SESSION_ID" ]; then echo "- Session-ID: \`${SESSION_ID}\` (\`--resume\` zum Nachschauen)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Kreuzverhoer-Review #${PR} fertig::${AGENT}-Schritt ${OUTCOME:-unbekannt}; Labels: ${labels:-keine}"

      # Deterministisches Timeout-Signal fuer PR-Workflows (Haerten S3): review/fixup vergeben
      # bewusst KEIN ai:to-big-issue (AGENTS.md) — sonst staute der PR unsichtbar, wenn er in das
      # 20-Min-Timeout laeuft. cancel-in-progress:false bedeutet: outcome=cancelled ist hier ein
      # ECHTES Timeout (kein Supersede wie bei cancel-in-progress:true), daher kein Zeit-Guard
      # noetig. Dieser Schritt postet bei Timeout einen sichtbaren PR-Kommentar als Alarm.
      - name: Bei Timeout PR-Kommentar (Alarm)
        if: always() && steps.preflight.outputs.configured == 'true' && (steps.claude.outcome == 'cancelled' || steps.glm.outcome == 'cancelled' || steps.mistral.outcome == 'cancelled')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⚠️ **Kreuzverhör-Review #${PR} — 20-Min-Timeout erreicht**

          Der Review-Lauf wurde hart abgebrochen (wahrscheinlich zu großer PR). Bitte PR-Größe reduzieren (aufteilen) oder manuell reviewen." 2>/dev/null || true

      # Deterministische Label-Post-Assertion (Haerten H1/S4): der Gate-Workflow wertet den Reviewer-
      # Check als "gruen", sobald der Review-Job durchlaeuft. Vergisst/halluziniert der Agent die
      # Label-Umschaltung (weder ai:needs-changes noch ai:ready-to-merge), bliebe der PR sonst still
      # auf ai:needs-review stehen (kein Folge-Workflow feuert). Dieser Step setzt deterministisch
      # den Safe-Default ai:needs-changes, sobald nach Agent-Ende kein Ergebnis-Label existiert — so
      # greift der Fixup (sichtbar) statt einer stillen Stalle. Laeuft NICHT bei cancelled (Timeout
      # -> S3 alarmiert) und nicht bei skipped (Doppel-Guard/Preflight).
      - name: Label-Post-Assertion (Safe-Default ai:needs-changes)
        if: always() && steps.preflight.outputs.configured == 'true' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure' || steps.glm.outcome == 'success' || steps.glm.outcome == 'failure' || steps.mistral.outcome == 'success' || steps.mistral.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Fallback bei transienter gh-API-Stoerung: die Safe-Default-Assertion greift nur, wenn
          # die Labels lesbar sind (sonst wuerde set -euo pipefail den Step toeten, bevor der Safe-
          # Default greift). In dem Fall: PR bleibt unangetastet (kein false Safe-Default).
          if ! labels_json="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]' 2>/dev/null)"; then
            echo "::warning::Labels nicht lesbar (gh-API) — Label-Post-Assertion übersprungen."
            exit 0
          fi
          has_changes="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:needs-changes")')"
          has_ready="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:ready-to-merge")')"
          has_review="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:needs-review")')"

          # Fall A: kein Ergebnis-Label nach Agent-Ende -> Safe-Default ai:needs-changes
          if [ "$has_changes" != "true" ] && [ "$has_ready" != "true" ]; then
            if [ "$has_review" = "true" ]; then
              gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai:needs-review
            fi
            gh label create "ai:needs-changes" --repo "$GITHUB_REPOSITORY" --color D93F0B 2>/dev/null || true
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ai:needs-changes
            # Alarm-Kommentar (H-2 Mitigation): ein moeglicher 0-Commit-Loop (Review vergisst Label
            # -> Fixup ohne Findings -> Review -> ...) wird so fuer den Menschen sichtbar.
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⚠️ **Review ohne Ergebnis-Label — Safe-Default**

          Der Review-Agent hat weder \`ai:needs-changes\` noch \`ai:ready-to-merge\` gesetzt. Workflow setzt Safe-Default \`ai:needs-changes\`. **Manuelle Prüfung nötig** — falls der Fixup keine Findings findet und der Loop kreist, bitte manuell reviewen/entscheiden." 2>/dev/null || true
            echo "::error title=Review ohne Ergebnis-Label::Agent hat weder ai:needs-changes noch ai:ready-to-merge gesetzt — Safe-Default ai:needs-changes + Alarm-Kommentar (Fixup wird ausgelöst)."
            exit 0
          fi
          # Fall B: Ergebnis-Label gesetzt, aber ai:needs-review nicht entfernt -> nachträglich entfernen
          if [ "$has_review" = "true" ]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai:needs-review
            echo "::notice::ai:needs-review nachträglich entfernt (Agent hatte Ergebnis-Label gesetzt, needs-review aber belassen)."
          fi

      # Deterministisches "Reviewer rot bei Findings": Der Review aendert keinen Code, sondern
      # signalisiert sein Ergebnis ueber Labels. Damit der Gate/Auto-Merge-Workflow (claude-pr-gate-merge.yml) den
      # Reviewer als vollwertigen "roten Check" der Allowlist (CI + Reviewer) lesen kann, beendet
      # dieser Schritt den Job mit Exit != 0, sobald das Ergebnis-Label ai:needs-changes ist —
      # sauber (ai:ready-to-merge) bleibt gruen. Laeuft NACH dem Zusammenfassen, damit das Summary
      # immer geschrieben wird; aendert KEINEN Code (Ticket #87).
      - name: Reviewer rot, wenn Aenderungen erforderlich (ai:needs-changes)
        if: always() && steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          needs_changes="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "ai:needs-changes")' 2>/dev/null || echo false)"
          if [ "$needs_changes" = "true" ]; then
            echo "::error title=Review: Aenderungen erforderlich::PR #${PR} hat ai:needs-changes — Reviewer-Check laeuft rot, damit das CI-Gate ihn als roten Check erkennt."
            exit 1
          fi
          echo "Keine offenen Findings (kein ai:needs-changes) — Reviewer-Check bleibt gruen."
