name: Sync Spec

# Nächtlicher LLM-Job (wie die Phasen 01–06 über setup-claude, aber KEINE Pipeline-Phase):
# Verifiziert die Specs in docs/spec/ (user-journeys.md + issue-*.md) gegen die tatsächliche
# Implementation (frontend/src, server/src, openapi.yml) und hält sie auf IST-STAND —
# die Implementation ist die Wahrheit, die Spec spiegelt sie nur. Leitlinie arc42-Prinzip:
# so viel wie nötig, so wenig wie möglich — nur langfristig relevantes Verhalten bleibt Spec:
#   - korrigieren (Impl hat sich geändert → Spec folgt),
#   - entsorgen (einzelne Aussagen wie ganze Dateien: überholte/transitorische Soll-Aussagen
#     wie „X soll entfernt sein“ sind langfristig keine Spec-Information; ganze Dateien ohne
#     langfristigen Spec-Wert — Test-Protokolle, Validierungs-Platzhalter, vollständig
#     redundant abgebildete Journeys — werden gelöscht),
#   - ergänzen (implementiertes, un-spezifiziertes Verhalten bekommt neue Journeys).
#
# DELIVERY: pro geänderter Spec-Datei EIN PR (Non-Draft) vom Branch chore/spec-sync/<datei-stem>
# mit direktem ai:needs-review-Label per App-Token → Kreuzverhör-Review (04) startet automatisch.
# Der Agent arbeitet lokal auf chore/spec-sync-work (nie gepusht); die Mechanik überträgt je
# geänderter Datei den finalen Stand auf einen eigenen Branch — unabhängig davon, wie der
# Agent committet hat (Diff-basiert, nicht Commit-basiert). Das Label wird direkt nach PR-Create
# per App-Token gesetzt (Autolabeler greift bei Bots nicht) → labeled-Event feuert → 04-Review
# und Fixup-Loop (05) übernehmen Prüfung und Nacharbeit automatisch. Für eine Datei mit bereits
# offenem Sync-PR wird kein zweiter erzeugt (Skip mit Notice) — neue Drift derselben Datei
# folgt nach dessen Merge.
#
# STATELESS: kein pro-Issue-Memory (memory-load/expect false, kein Artefakt-Upload). Die
# offenen Draft-PRs sind der einzige Zustand; jede Nacht wird frisch verifiziert.
#
# KEINE Nummer im Dateinamen: Nummern (01–06) sind lastend (Workflow-Name-Matching), dieser
# Job ist ein Helper wie cache-cleanup und hängt nicht in der Label-Kette.

on:
  schedule:
    - cron: '37 2 * * 0' # sonntags 02:37 UTC, hinter Prompt-Audit (01:17) und vor Guide-Sync (03:07)
  workflow_dispatch:
    inputs:
      force:
        description: 'Skip-Guard ignorieren (Lauf erzwingen, auch wenn main unverändert ist)'
        type: boolean
        default: false

concurrency:
  group: claude-spec-sync
  cancel-in-progress: false

permissions:
  contents: write # Branch-Pushes chore/spec-sync/*
  pull-requests: write # Draft-PRs anlegen
  id-token: write # App-Token (setup-claude)
  actions: read # Skip-Guard: letzte erfolgreiche Run-Historie lesen

jobs:
  spec-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      SYNC_BRANCH: chore/spec-sync-all
    steps:
      - name: Skip-Guard (main unverändert seit letztem erfolgreichen Sync)
        # LLM-Budget sparen: Hat main seit dem letzten erfolgreichen Lauf dieses Workflows
        # denselben SHA, ist das Verifikationsergebnis deterministisch dasselbe → kein Lauf.
        # Fail-open bei API-Fehlern (leerer last_sha → Lauf): ein vergessener Sync ist
        # billiger als ein stumm übersprungener. workflow_dispatch mit force=true umgeht
        # den Guard (Re-Sync ohne Code-Änderung, z. B. nach Prompt-Anpassung).
        id: guard
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force == true) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last_sha="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow cron.sync-spec.yml \
            --status success --limit 1 --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)"
          if [ -n "$last_sha" ] && [ "$last_sha" = "$GITHUB_SHA" ]; then
            echo "::notice title=⏭️ Spec-Sync übersprungen::Main unverändert ($GITHUB_SHA) seit letztem erfolgreichen Sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: In-Flight-Guard (Pipeline arbeitet noch am offenen Sync-PR)
        # Der nächtliche Force-Push ersetzt den Branch komplett. Läuft auf dem offenen Sync-PR
        # nur bei aktiven Pipeline-Labels (ai:needs-review, ai:needs-fixup) aussetzen. ai:reviewed
        # (abgeschlossen) und ai:needs-human (Mensch entscheidet) blocken ebenfalls, statt die
        # Diskussionsgrundlage zu überschreiben.
        # ai:needs-human ist TERMINAL (Review/Fixup haben aufgegeben, ein Mensch schaut drauf):
        # ebenfalls aussetzen, statt die Diskussionsgrundlage zu überschreiben.
        # Fail-open: ist der Label-Abruf nicht möglich, läuft der Sync (wie beim Skip-Guard).
        # force=true umgeht auch diesen Guard NICHT — er schützt fremde Läufe, nicht das Budget.
        id: inflight
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: ${{ env.SYNC_BRANCH }}
        run: |
          blocking="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --state open \
            --json labels \
            --jq '[.[0].labels[]?.name] | map(select(. == "ai:needs-review" or . == "ai:needs-human")) | join(", ")' \
            2>/dev/null || true)"
          if [ -n "$blocking" ] && [ "$blocking" != "null" ]; then
            echo "::notice title=⏸️ Spec-Sync ausgesetzt::Offener Sync-PR ist noch in der Pipeline (${blocking}) — kein Force-Push heute Nacht."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Startzeit merken (für weiches Zeitlimit)
        id: starttime
        if: steps.guard.outputs.skip != 'true' && steps.inflight.outputs.skip != 'true'
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          # 20 min weich (Ziel: ALLE Spec-Dateien schaffen) vs. 30 min hart — Restpuffer für Post-Steps.
          echo "soft_deadline_epoch=$((now + 1200))" >> "$GITHUB_OUTPUT"

      - name: Setup Claude Code
        id: setup
        if: steps.guard.outputs.skip != 'true' && steps.inflight.outputs.skip != 'true'
        uses: ./.github/actions/setup-claude
        with:
          needs-mcp: false
          tools-tier: full # Write/Edit auf docs/spec + git commit nötig; Push/PR macht der Workflow
          event-type: ${{ github.event_name }}
          # ticket-ref ist Pflicht-Input, dieser Job hat kein Ticket: '0' fließt NUR in den
          # ungenutzten Storage-Namen (ai/state/issue-0) — Memory ist komplett aus (memory-load: false).
          ticket-ref: '0'
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          model: ${{ vars.CLAUDE_MODEL_SPEC_SYNC || 'sonnet' }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          zai-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}
          openrouter-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          tailscale-exit-node: ${{ vars.TAILSCALE_EXIT_NODE }}
          memory-load: 'false'
          expect-memory: 'false'

      - name: Arbeits-Branch frisch aufsetzen (Basis = origin/main, wird NIE gepusht)
        # Lokale Werkbank des Agenten; der Delivery-Branch chore/spec-sync-all entsteht
        # erst im Post-Step diff-basiert daraus. Git-Identität stellt setup-claude zentral
        # bereit (Repo-Owner, gültige noreply).
        if: steps.guard.outputs.skip != 'true' && steps.inflight.outputs.skip != 'true' && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          SYNC_BRANCH: ${{ env.SYNC_BRANCH }}
        run: |
          git branch -D "$SYNC_BRANCH" 2>/dev/null || true
          git switch -C "$SYNC_BRANCH" origin/main

      - name: Spec-Sync via Claude
        id: claude
        if: steps.guard.outputs.skip != 'true' && steps.inflight.outputs.skip != 'true' && steps.setup.outputs.configured == 'true'
        run: |
          cp .github/prompts/spec-sync.md /tmp/claude-prompt.txt

          sed -i "s/{{SYNC_DATE}}/$(date -u +%F)/g" /tmp/claude-prompt.txt
          sed -i "s/{{SOFT_DEADLINE}}/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/claude-prompt.txt
          bash .github/scripts/assert-prompt-complete.sh /tmp/claude-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Post-Assertion (VERDICT ↔ Commits ↔ Scope) + Sammel-PR erstellen/aktualisieren
        id: deliver
        # Ehrlichkeits-Kreuzcheck nach dem VERDICT-Muster der Phasen-Workflows: Der Agent
        # behauptet synced/updated — die Mechanik verifiziert Commits und Datei-Scope und
        # baut daraus deterministisch EINEN Sammel-PR (Push/PR ist bewusst KEINE Agent-Aufgabe).
        # Bei offenem Sammel-PR ohne Pipeline-Label → Update (gh pr edit), ansonsten Create.
        # Review wird per Re-Arm-Muster #536 angestoßen (Label-Create + Re-Arm).
        if: >-
          ${{ always()
              && steps.guard.outputs.skip != 'true'
              && steps.setup.outputs.configured == 'true'
              && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          OUTCOME: ${{ steps.claude.outcome }}
          SYNC_BRANCH: ${{ env.SYNC_BRANCH }}
        run: |
          # Portables VERDICT-Parsen wie in 01 (BSD/GNU-grep-sicher): erster bekannter
          # Token gewinnt, Prosa/Markdown nach dem Token ist egal (#1017-Klasse).
          verdict=""
          if [ -f /tmp/claude-output.log ]; then
            verdict="$(grep 'VERDICT:' /tmp/claude-output.log | tail -1 | sed -E 's/^.*VERDICT:[[:space:]]*//' | grep -oE 'updated|synced' | head -1 || true)"
          fi
          echo "Claude-Verdict aus Output: '${verdict:-keins}'"

          if [ "$OUTCOME" != "success" ]; then
            echo "::error title=❌ Spec-Sync fehlgeschlagen::Claude-Lauf nicht erfolgreich — kein stiller „synced“."
            exit 1
          fi
          if [ "$verdict" != "synced" ] && [ "$verdict" != "updated" ]; then
            echo "::error title=❌ Spec-Sync ohne Verdict::Weder „synced“ noch „updated“ — Lauf wiederholen."
            exit 1
          fi

          count="$(git rev-list --count origin/main..HEAD)"
          echo "Commits seit origin/main: $count"

          # Scope-Guard: nur docs/spec/ ist erlaubt.
          bad="$(git diff --name-only origin/main..HEAD | grep -v '^docs/spec/' || true)"
          if [ -n "$bad" ]; then
            echo "::error title=❌ Scope verletzt::Änderungen außerhalb docs/spec/: ${bad}"
            exit 1
          fi

          # Verdict ↔ Commits konsistent?
          if [ "$verdict" = "updated" ] && [ "$count" -eq 0 ]; then
            echo "::error title=❌ Verdict ohne Commits::VERDICT updated, aber kein Commit vorhanden."
            exit 1
          fi
          if [ "$verdict" = "synced" ] && [ "$count" -gt 0 ]; then
            echo "::error title=❌ Commits ohne Verdict::VERDICT synced, aber Commits vorhanden."
            exit 1
          fi

          if [ "$count" -eq 0 ]; then
            echo "::notice title=✅ Spec am Ist-Stand::Keine Drift gefunden — kein Push, kein PR."
            exit 0
          fi

          # Report Fallback: fehlt/leer der Agent-Report, ersetzt git log die Fund-Abschnitte.
          if [ ! -s /tmp/spec-sync-report.md ]; then
            echo "::warning title=⚠️ Report fehlt::/tmp/spec-sync-report.md fehlt — Fallback aus git log."
            {
              echo "## Spec-Sync $(date -u +%F)"
              echo ""
              echo "_Agent-Report fehlt — Fallback aus der Commit-Historie._"
              echo ""
              git log origin/main..HEAD --oneline --stat
            } > /tmp/spec-sync-report.md
          fi

          # Sammel-PR auf chore/spec-sync-all: Push + PR create-oder-edit.
          sync_date="$(date -u +%F)"
          title="docs(spec): Ist-Stand-Sync $sync_date"

          # Push des Sync-Branch (Force-Push = Reset auf neuen Stand).
          git push --force origin "$SYNC_BRANCH"

          # Prüfen, ob bereits ein PR auf diesem Branch existiert.
          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --state open \
            --json number,labels --jq '.[0] | {number: .number, labels: [.[].labels[]?.name]}' 2>/dev/null || true)"
          existing_pr_number="$(printf '%s' "$existing_pr" | jq -r '.number // empty')"
          existing_labels="$(printf '%s' "$existing_pr" | jq -r '.labels // [] | join(", ")')"

          # PR-Body: Kopfzeile + Pipeline-Hinweis + kompletter Agent-Report.
          {
            echo "Nächtlicher Spec-Sync ($sync_date) — alle Änderungen in einem PR."
            echo ""
            echo "**Pipeline:** Dieser PR durchläuft nach dem Review automatisch Fixup und Merge (Workflows 04/05)."
            echo ""
            cat /tmp/spec-sync-report.md
          } > /tmp/spec-sync-pr-body.md

          if [ -n "$existing_pr_number" ]; then
            echo "::notice title=🔄 PR existiert#$existing_pr_number — Aktualisiere Body."
            gh pr edit "$existing_pr_number" --title "$title" --body-file /tmp/spec-sync-pr-body.md
            echo "action=updated" >> "$GITHUB_OUTPUT"
            echo "pr_number=$existing_pr_number" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=✨ PR erstellen — neuer Sammel-PR."
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --base main \
              --title "$title" --body-file /tmp/spec-sync-pr-body.md)"
            pr_number="$(printf '%s\n' "$pr_url" | sed -nE 's#.*/pull/([0-9]+).*#\1#p' | tail -1)"
            if [ -z "$pr_number" ]; then
              echo "::error title=❌ PR-Create fehlgeschlagen::PR konnte nicht erstellt werden."
              exit 1
            fi
            echo "action=created" >> "$GITHUB_OUTPUT"
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          fi

      - name: Review anstoßen (ai:needs-review per App-Token, Re-Arm-Muster #536)
        # Sammel-PR trägt kein Pipeline-Label (In-Flight-Guard greift nicht) → Review triggerbar.
        # ERST entfernen, DANN setzen (#536): klebt ai:needs-review noch vom Vorlauf, wäre ein
        # reines --add-label ein No-op ohne `labeled`-Event → 04-claude-pr-review.yml startet nie.
        # Ergebnis-Labels der Vornacht (needs-changes/ready-to-merge/needs-human) werden mit abgeräumt.
        # Von GITHUB_TOKEN gesetzte Labels triggern KEINE Folge-Workflows → App-Token ist Pflicht.
        if: ${{ steps.guard.outputs.skip != 'true' && steps.inflight.outputs.skip != 'true' && steps.setup.outputs.configured == 'true' && steps.deliver.outputs.pr_number != '' }}
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.deliver.outputs.pr_number }}
        run: |
          set -euo pipefail

          gh label create "ai:needs-review" --repo "$REPO" --color 1D76DB \
            --description "PR wartet auf KI-Review" 2>/dev/null || true

          for label in ai:needs-fixup ai:reviewed ai:needs-human ai:needs-review; do
            gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "$label" 2>/dev/null || true
          done

          for attempt in 1 2 3; do
            if gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label ai:needs-review; then
              echo "::notice title=✅ Review angestoßen::PR #$PR_NUMBER trägt ai:needs-review — Kreuzverhör-Review startet."
              exit 0
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error title=❌ Label-Setzen fehlgeschlagen::PR #$PR_NUMBER erstellt/aktualisiert, aber ai:needs-review konnte nicht gesetzt werden."
              exit 1
            fi
            sleep 1
          done

      - name: Ergebnis zusammenfassen
        if: ${{ always() && steps.guard.outputs.skip != 'true' && steps.inflight.outputs.skip != 'true' && steps.setup.outputs.configured == 'true' }}
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          OUTCOME: ${{ steps.claude.outcome }}
          ACTION: ${{ steps.deliver.outputs.action }}
          PR_NUMBER: ${{ steps.deliver.outputs.pr_number }}
          SYNC_BRANCH: ${{ env.SYNC_BRANCH }}
        run: |
          count="$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)"
          sync_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --state open \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          {
            echo "### Spec-Sync – fertig"
            echo ""
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Agent-Commits: ${count}"
            if [ -n "${ACTION:-}" ]; then
              echo "- Sammel-PR: #${PR_NUMBER} (${ACTION})"
            else
              echo "- Sammel-PR: keiner (VERDICT: synced)"
            fi
            echo "- Offener Sync-PR auf $SYNC_BRANCH: ${sync_pr:-keiner}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🩺 Z.AI Fair-Usage-Check (1313)
        # Rohausgabe des Claude-Laufs auf z.ai-Fehler 1313 (Fair Usage) durchsuchen
        # und Ergebnis als Annotation + Job-Summary sichtbar machen.
        if: always()
        uses: ./.github/actions/llm-fair-usage-check
