name: Trigger Pipeline

# Workflow-Skizze für Issue/PR-Events und Label-Trigger (Issue 659)
# Reagiert auf Issue-Kommentare, PR-Events und Label-Änderungen

on:
  # Kommentare auf Issues
  issue_comment:
    types: [created, edited, deleted]

  # PR-Events (geöffnete, geschlossene, synchronisierte PRs)
  pull_request:
    types: [opened, closed, synchronize, reopened]

  # Issue-Label-Änderungen
  issues:
    types: [labeled, unlabeled]

  # PR-Label-Änderungen
  pull_request_target:
    types: [labeled, unlabeled]
    permissions:
      contents: read

jobs:
  trigger-validation:
    name: Validiere Trigger-Event
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Trigger-Informationen anzeigen
        run: |
          echo "Workflow ausgelöst durch: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event-Details:"
          echo "  - Issue/PR-Nummer: ${{ github.event.issue.number || github.event.pull_request.number }}"
          echo "  - Label (falls zutreffend): ${{ github.event.label.name }}"

      - name: Zusammenfassung im Actions-Tab
        if: always()
        run: |
          {
            echo "### Trigger-Event Validierung"
            echo ""
            echo "- **Event-Type:** \`${{ github.event_name }}\`"
            echo "- **Repository:** ${{ github.repository }}"
            echo "- **Actor:** ${{ github.actor }}"
            echo "- **Status:** ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
