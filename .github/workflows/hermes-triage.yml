name: Hermes Triage (Analyse)

# Stösst die KI-Analyse (Triage) eines Issues automatisch an — ersetzt den
# bisherigen claude-triage.yml Workflow (MIG-001, 2026-07-10).
#
# Triggert bei:
#  - neuem Issue (issues: opened)
#  - Entfernen von Label "ai:analyzed" oder "ai:to-big-issue" (issues: unlabeled)
#  - @claude-Kommentar einer Person mit Schreibzugriff (issue_comment: created)
#
# Setzt Hermes Agent (Nous Research) mit GLM 5.2 über Nous Portal ein
# statt Claude Code.
#
# Voraussetzung: Repo-Secret NOUS_PORTAL_TOKEN (https://portal.nousresearch.com)
#
# Änderungen zu claude-triage.yml:
#  - Kein CLAUDE_CODE_OAUTH_TOKEN mehr (entfällt komplett)
#  - Keine configure-ai-backend Composite Action (Hermes nutzt Nous Portal nativ)
#  - Kein session-restore/session-save (Hermes-Session-Resume folgt in MIG-002)
#  - Kein cost-summary (liest claude execution file — Hermes-cost folgt in MIG-003)
#  - Prompt angepasst: Hermes-spezifisch, keine Claude-Modell-Strategie
#   - Modell: z-ai/glm-5.2 via Nous Portal (präzises Reasoning)

on:
  issues:
    types: [opened, unlabeled]
  issue_comment:
    types: [created]

# Dieselbe Concurrency wie zuvor: Pro Issue nur ein Lauf gleichzeitig.
# cancel-in-progress: true -> ein neuerer Trigger desselben Issues bricht
# einen noch laufenden Lauf ab (immer die aktuellste Analyse).
concurrency:
  group: hermes-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    # Identische Trigger-Bedingungen wie claude-triage.yml — unverändert.
    if: >-
      ${{ (github.event_name == 'issues'
            && github.event.issue.state == 'open'
            && (
                 (github.event.action == 'opened'
                   && !contains(github.event.issue.labels.*.name, 'ai:analyzed')
                   && (github.event.issue.author_association == 'OWNER'
                       || github.event.issue.author_association == 'MEMBER'
                       || github.event.issue.author_association == 'COLLABORATOR'))
                 || (github.event.action == 'unlabeled'
                     && (github.event.label.name == 'ai:analyzed'
                         || github.event.label.name == 'ai:to-big-issue'))
               ))
          || (github.event_name == 'issue_comment'
              && github.event.issue.pull_request == null
              && contains(github.event.comment.body, '@claude')
              && (github.event.comment.author_association == 'OWNER'
                  || github.event.comment.author_association == 'MEMBER'
                  || github.event.comment.author_association == 'COLLABORATOR')) }}
    runs-on: ubuntu-latest
    env:
      # Hermes speichert Config + Sessions in ein RAM-Verzeichnis (nicht ~/.hermes)
      HERMES_HOME: /tmp/hermes-ci
    permissions:
      contents: read
      issues: write
      id-token: write
      pull-requests: write
    steps:
      # ──────────────────────────────────────────────
      # 1. Startzeit (für Timeout-Erkennung + Soft-Abort)
      # ──────────────────────────────────────────────
      - name: Startzeit merken (für Timeout-Erkennung + weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 420))" >> "$GITHUB_OUTPUT"  # 7 min (Kurz-Tier)

      # ──────────────────────────────────────────────
      # 2. GitHub-App-Setup (für Label/Push als Bot)
      # ──────────────────────────────────────────────
      - name: Voraussetzung prüfen (GitHub-App-Secrets)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::GitHub-App-Secrets fehlen — Lauf wird übersprungen. GitHub App anlegen (Issues/Contents/Pull requests = Read and write), aufs Repo installieren und beide Werte als Repo-Secrets (APP_ID + APP_PRIVATE_KEY) hinterlegen."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: GH_TOKEN-Fallback setzen (App-Token oder GITHUB_TOKEN)
        id: gh-token
        run: |
          APP_TOK="${{ steps.app-token.outputs.token }}"
          if [ -n "$APP_TOK" ] && [ "$APP_TOK" != "null" ]; then
            echo "token=$APP_TOK" >> "$GITHUB_OUTPUT"
            echo "::notice::Nutze GitHub-App-Token für gh-Befehle."
          else
            echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
            echo "::warning::App-Token nicht verfügbar — nutze GITHUB_TOKEN (Achtung: Label-Wechsel lösen ggf. keine Folge-Workflows aus)."
          fi

      - name: Checkout
        uses: actions/checkout@v7

      # ──────────────────────────────────────────────
      # 3. uv-Paketcache (beschleunigt Hermes-Installation)
      # ──────────────────────────────────────────────
      - name: Cache-Key für uv berechnen
        id: uv-cache-key
        run: echo "week=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: uv-Paketcache wiederherstellen
        id: uv-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
          key: uv-hermes-${{ runner.os }}-${{ steps.uv-cache-key.outputs.week }}
          restore-keys: uv-hermes-${{ runner.os }}-

      # ──────────────────────────────────────────────
      # 4. Hermes installieren & konfigurieren
      # ──────────────────────────────────────────────
      - name: Hermes installieren
        run: |
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --skip-browser --skip-setup
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Konfiguration wird pro Lauf frisch in $HERMES_HOME geschrieben.
      # Der `hermes chat`-Aufruf unten setzt --provider und -m, daher reicht
      # hier eine minimale Config (Base-URL und max_turns).
      - name: Hermes konfigurieren (Nous Portal + GLM 5.2)
        run: |
          hermes config set model.provider nous
          hermes auth add nous --token "${{ secrets.NOUS_PORTAL_TOKEN }}"
          hermes config set agent.max_turns 90
          pip install mcp -q
          hermes mcp add kolibri --url https://public-ui-kolibri-mcp.vercel.app/mcp

      # ──────────────────────────────────────────────
      # 4. Session-Resume (aus vorherigem Lauf fortsetzen)
      # ──────────────────────────────────────────────
      - name: Session-Archiv herunterladen (Phase triage)
        id: session-dl
        if: steps.preflight.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hermes-session-issue-${{ github.event.issue.number }}-triage
          path: /tmp/hermes-session-restore

      - name: Session wiederherstellen
        id: session-restore
        if: steps.preflight.outputs.configured == 'true' && steps.session-dl.outcome == 'success'
        run: |
          if [ -f /tmp/hermes-session-restore/hermes-session.tar.gz ]; then
            mkdir -p "$HERMES_HOME"
            tar -xzf /tmp/hermes-session-restore/hermes-session.tar.gz -C "$HERMES_HOME"
            if [ -f "$HERMES_HOME/session_id.txt" ]; then
              RID=$(cat "$HERMES_HOME/session_id.txt")
              echo "resume_arg=$RID" >> "$GITHUB_OUTPUT"
              echo "::notice::Session #$RID wiederhergestellt"
            fi
          fi

      # ──────────────────────────────────────────────
      # 5. Token-Prüfung (NOUS_PORTAL_TOKEN)
      # ──────────────────────────────────────────────
      - name: Token prüfen (NOUS_PORTAL_TOKEN)
        if: steps.preflight.outputs.configured == 'true'
        env:
          NOUS_PORTAL_TOKEN: ${{ secrets.NOUS_PORTAL_TOKEN }}
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ -z "$NOUS_PORTAL_TOKEN" ]; then
            echo "::error title=Token fehlt::NOUS_PORTAL_TOKEN nicht gesetzt — als Repo-Secret hinterlegen (https://portal.nousresearch.com). Ohne Token läuft Hermes nicht."
            gh label create "ai:to-big-issue" --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "KI-Job lief rot (Konfiguration/Secret) — bitte prüfen" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue" 2>/dev/null || true
            exit 1
          fi
          echo "NOUS_PORTAL_TOKEN vorhanden."

      # ──────────────────────────────────────────────
      # 5. Triage via Hermes
      # ──────────────────────────────────────────────
      # Der Prompt wird via Heredoc in eine Datei geschrieben (vermeidet
      # Shell-Quoting-Probleme bei langen Texten mit Anführungszeichen).
      # Der eigentliche Aufruf nutzt dann -q "$(cat ...)".
      #
      # Flags im Detail:
      #   -q                       Single-query non-interactive
      #   -Q                       Quiet — keine Banner/Spinner im CI-Log
      #   --yolo                   Keine Gefahren-Bestätigung (CI headless)
      #   --provider nous          API läuft über Nous Portal
      #   -m z-ai/glm-5.2           GLM 5.2 (präzises Reasoning)
      #   -t "terminal,file"       Nur Shell- und Datei-Tools zulassen
      #   --max-turns 90           Obergrenze für Tool-Calls
      #   --accept-hooks           Automatische Freigabe von Shell-Hooks
      #   MCP: KoliBri-Server konfiguriert, Tools: mcp_kolibri_search/fetch
      #
      # GH_TOKEN für gh-Befehle (Issue lesen/schreiben, Labels setzen).
      # NOUS_PORTAL_TOKEN für die LLM-API (via hermes auth).
      - name: Triage via Hermes (GLM 5.2)
        id: hermes
        if: steps.preflight.outputs.configured == 'true'
        env:
          NOUS_PORTAL_TOKEN: ${{ secrets.NOUS_PORTAL_TOKEN }}
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
        run: |
          # Prompt per Heredoc schreiben — 'HERMES_EOF' (single-quoted) verhindert
          # bash-Variable-Expansion innerhalb des Heredocs, während GitHub Actions
          # \${} Expressions VOR der Schritt-Ausführung evaluiert.
          cat > /tmp/hermes-prompt.txt << 'HERMES_EOF'
          Führe für GENAU DIESES EINE Issue (#ISSUE_NR) den Ticket-Triage-Workflow aus der Wissensbasis aus — verbindlicher Ablauf: .ai-knowledge/ticket-triage.md.

          Wichtige Hinweise für den Hermes-Agenten:

          TRIGGER-ERKENNUNG (Re-Triage oder Erst-Triage):
            Die Analyse läuft entweder zum ersten Mal (Erst-Triage) oder als aktualisierte Analyse (Re-Triage). Das erkennst du am Body-Block: existiert bereits <!-- KI-ANALYSE:START stand=... --> ... <!-- KI-ANALYSE:END --> im Issue-Body, ist es eine Re-Triage. Dann den stand-Timestamp auslesen und NUR die Delta-Kommentare seit stand lesen (gh issue view #ISSUE_NR --json comments --jq '.comments[] | select(.createdAt > "<stand>")'), NICHT den ganzen Thread. Fehlt der Body-Block, ist es eine Erst-Analyse.

          ABLAUF:
            1. Lektoriere die Issue-Beschreibung (Form verbessern, Inhalt unverändert, via gh issue edit --body-file -).
            2. Prüfe den Titel auf Konsistenz zur Beschreibung/zum Ziel und optimiere ihn bei Inkonsistenz inhaltlich treu (kein Edit pro forma, keine Titel-Drift, via gh issue edit --title ...).
            3. Zerlege zu große Tickets in verknüpfte Sub-Issues (max. eine Ebene, Rekursionsschutz via Label 'ai:analyzed').
            4. Schreibe die Analyse mit prüfbaren Akzeptanzkriterien + Testfällen und Umsetzbarkeits-Ampel (🟢/🟡/🔴) in einen markierten Block in der Issue-Beschreibung (gh issue edit --body-file -).
            5. Setze genau EINEN kurzen Ping-Kommentar (gh issue comment; bei offenen Fragen mit @author).
            6. Labels als ALLERLETZTEN Schritt — NIE davor (sonst startet die nächste Pipeline-Stufe mit veraltetem Issue-Inhalt).

          BODY-BLOCK-FORMAT:
            Der Analyse-Block muss zwischen diesen Markern stehen:
            <!-- KI-ANALYSE:START stand=<aktuelles Datum in ISO-8601> -->
            ...
            <!-- KI-ANALYSE:END -->
            Bei Re-Triage: existierenden Block zwischen den Markern IN-PLACE ersetzen (per sed im Body-File oder gh issue edit mit vollständigem Body). Die Original-Beschreibung oberhalb des START-Markers NICHT überschreiben.
            Bei Erst-Analyse: Block neu in die Beschreibung einfügen (gh issue view --json body um den aktuellen Body zu holen, dann mit cat/printf den Block anhängen).

          LABEL-SETZEN (immer als ALLERLETZTER Schritt, nach Body-Block UND Ping-Kommentar):
            - Immer 'ai:analyzed' setzen.
            - Bei 🟢 zusätzlich 'ai:spec-ready' (startet die Spec-Stufe).
            - Bei 🟡/🔴: evtl. vorhandenes 'ai:spec-ready'/'ai:ready' entfernen.
            Verwende gh issue edit --add-label/--remove-label dafür. Fehlende Labels vorher mit gh label create anlegen.

          WERKZEUGE:
            Du hast Zugriff auf die Bash (für gh issue/gh api/gh label/gh pr/gh repo), Datei-Lese-Werkzeuge sowie KoliBri-MCP-Tools (mcp_kolibri_search, mcp_kolibri_fetch für KoliBri-Komponenten). Die gh-Befehle sind über GH_TOKEN authentifiziert. Lies die Wissensbasis aus .ai-knowledge/ticket-triage.md für den vollständigen Ablauf. Lese die Issue-Daten via gh issue view und die Wissensbasis via read_file.

          WEICHES ZEITLIMIT (Soft-Abort):
            Dieser Lauf wird nach 12 Minuten von GitHub HART abgebrochen. Prüfe daher VOR jedem größeren Teilschritt (neue Analyse-Runde, längere Recherche), ob das weiche Limit (7 Minuten nach Start) erreicht ist — berechne es mit: date +%s und vergleiche mit SOFT_DEADLINE.
            Ist das Limit erreicht: schreibe die bisherige Analyse (auch unvollständig) als Body-Block in die Beschreibung. Setze KEIN Label und poste KEINEN Ping-Kommentar. Beende den Turn sofort (keine weiteren Schritte). So bleibt das Issue für einen sauberen Folgelauf offen.

          WICHTIG:
            - Bearbeite ausschließlich dieses eine Issue (kein Batch).
            - Committe keinen Produktivcode.
            - Keine interaktive Bestätigung nötig — der Trigger autorisiert den Lauf.
            - Du arbeitest autonom. Schreibe Lektorat, Analyse-Body-Block, Ping-Kommentar und setze die Labels im vorgegebenen Ablauf.
          HERMES_EOF

          # GitHub-Actions-Expressions durch Werte ersetzen (cat + sed)
          sed -i "s/#ISSUE_NR/${{ github.event.issue.number }}/g" /tmp/hermes-prompt.txt
          sed -i "s/SOFT_DEADLINE/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/hermes-prompt.txt

          RESUME_ARG=""
          if [ -n "${{ steps.session-restore.outputs.resume_arg }}" ]; then
            RESUME_ARG="--resume ${{ steps.session-restore.outputs.resume_arg }}"
          fi

          hermes chat -q "$(cat /tmp/hermes-prompt.txt)" \
            $RESUME_ARG \
            -Q --yolo --provider nous \
            -m "z-ai/glm-5.2" \
            -t "terminal,file" \
            --max-turns 90 \
            --accept-hooks \
            2>&1 | tee /tmp/hermes-output.log
          # PIPESTATUS: Exit-Code von hermes chat durch pipe propagieren
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      # ──────────────────────────────────────────────
      # 6. Hermes-Output parsen & Session-ID sichern
      # ──────────────────────────────────────────────
      - name: Hermes-Session-ID erfassen
        if: always()
        id: session
        run: |
          if [ -f /tmp/hermes-output.log ]; then
            sid="$(grep '^session_id:' /tmp/hermes-output.log | head -1 | sed 's/^session_id:[[:space:]]*//')"
            if [ -n "$sid" ]; then
              echo "session_id=$sid" >> "$GITHUB_OUTPUT"
              echo "::notice::Hermes Session-ID: $sid"
            fi
          fi

      # ──────────────────────────────────────────────
      # 7. Session-Archiv für Folgelauf sichern
      # ──────────────────────────────────────────────
      - name: Session-Archiv packen
        if: always() && steps.session.outputs.session_id != ''
        continue-on-error: true
        run: |
          SID="${{ steps.session.outputs.session_id }}"
          if [ -n "$SID" ] && [ -d "$HERMES_HOME" ]; then
            echo "$SID" > "$HERMES_HOME/session_id.txt"
            tar -czf /tmp/hermes-session.tar.gz -C "$HERMES_HOME" .
            echo "::notice::Session #$SID gepackt"
          fi

      - name: Session hochladen
        if: always() && steps.session.outputs.session_id != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hermes-session-issue-${{ github.event.issue.number }}-triage
          path: /tmp/hermes-session.tar.gz
          retention-days: 30
          overwrite: true

      # ──────────────────────────────────────────────
      # 8. Bei hartem Timeout als zu gross markieren
      # ──────────────────────────────────────────────
      - name: Bei Timeout als zu gross markieren (ai:to-big-issue)
        if: always() && steps.preflight.outputs.configured == 'true' && steps.hermes.outcome == 'cancelled'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_START: ${{ steps.starttime.outputs.epoch }}
        run: |
          elapsed=$(( $(date +%s) - ${RUN_START:-0} ))
          if [ "${RUN_START:-0}" -eq 0 ] || [ "$elapsed" -lt 600 ]; then
            echo "::notice title=Kein Timeout::Lauf nach ${elapsed}s abgebrochen (< 10 Min) — vermutlich Supersede/Cancel, kein ai:to-big-issue."
            exit 0
          fi
          gh label create "ai:to-big-issue" --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "KI-Job lief in den Timeout — Issue zu gross, bitte aufteilen" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:spec-ready" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:ready" 2>/dev/null || true
          echo "::warning title=Issue #${ISSUE} zu gross::20-Min-Timeout erreicht (${elapsed}s) — Label ai:to-big-issue gesetzt; bitte Issue aufteilen."

      # ──────────────────────────────────────────────
      # 9. Ergebnis zusammenfassen
      # ──────────────────────────────────────────────
      - name: Ergebnis zusammenfassen
        if: always() && steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.hermes.outcome }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Triage erfolgreich::Issue #${ISSUE} vollständig analysiert"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Triage abgebrochen::Lauf durch neueren Trigger verdrängt oder 20-Min-Timeout (kein Fehler)"
          else
            echo "::error title=❌ Triage fehlgeschlagen::Hermes-Lauf gescheitert (Code ${OUTCOME:-unbekannt})"
          fi
          {
            echo "### (Re-)Triage #${ISSUE} — fertig"
            echo ""
            echo "- Hermes-Schritt: \`${OUTCOME:-unbekannt}\` (cancelled = 20-Min-Timeout erreicht oder Supersede)"
            echo "- Aktuelle Labels: ${labels:-keine}"
            if [ -n "$SESSION_ID" ]; then
              echo "- Hermes Session-ID: \`${SESSION_ID}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=(Re-)Triage #${ISSUE} fertig::Hermes-Schritt ${OUTCOME:-unbekannt}; Labels: ${labels:-keine}"
