name: Test Providers

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider to test (default = claude)'
        required: false
        type: choice
        options:
          - claude
          - zai
          - openrouter
  schedule:
    - cron: '17 4 * * 3' # mittwochs 04:17 UTC (woechentlich)

# Least-Privilege (CodeQL actions/missing-workflow-permissions): nur Lesen noetig.
permissions:
  contents: read

env:
  # Provider aus Input oder Default
  LLM_PROVIDER: ${{ github.event.inputs.provider || 'claude' }}

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Configure Provider Settings
        id: provider
        run: |
          PROVIDER="${{ env.LLM_PROVIDER }}"
          echo "provider=$PROVIDER" >> $GITHUB_OUTPUT

          case $PROVIDER in
            claude)
              echo "Using native Claude (no settings.local)"
              echo "ANTHROPIC_AUTH_TOKEN=${{ secrets.CLAUDE_API_KEY }}" >> $GITHUB_ENV
              ;;
            zai)
              echo "Configuring Z.ai from CLAUDE_CODE_SETTINGS_LOCAL_ZAI variable"
              echo "${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}" > .claude/settings.local.json
              echo "ANTHROPIC_AUTH_TOKEN=${{ secrets.ZAI_API_KEY }}" >> $GITHUB_ENV
              ;;
            openrouter)
              echo "Configuring OpenRouter from CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER variable"
              echo "${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}" > .claude/settings.local.json
              echo "ANTHROPIC_AUTH_TOKEN=${{ secrets.OPENROUTER_API_KEY }}" >> $GITHUB_ENV
              ;;
            *)
              echo "Unknown provider: $PROVIDER" && exit 1
              ;;
          esac

          # Debug: show generated settings.local (without secrets)
          if [ -f .claude/settings.local.json ]; then
            echo "Generated settings.local.json:"
            cat .claude/settings.local.json | sed 's#"ANTHROPIC_AUTH_TOKEN": "[^"]*"#"ANTHROPIC_AUTH_TOKEN": "***"#'
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format-Check
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm lint

      # Spiegel-Stelle zu ci.yml (verify): Schema-Validierung aller Workflows/Composite-Actions.
      # Begruendung dort — hier mitgezogen, damit beide verify-Jobs dieselben Gates fahren.
      - name: GitHub-Actions-Schema
        run: pnpm lint:actions

      - name: Test (.github/scripts)
        run: pnpm test:scripts

      - name: Build
        run: pnpm -r build

      - name: Test (frontend)
        run: pnpm --filter frontend test

      - name: Coverage-Gate (server/src/logics)
        run: pnpm --filter server test:coverage

  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Playwright-Image: Browser + System-Dependencies vorinstalliert — kein Browser-Install-/apt-Lauf
    # mehr. ACHTUNG: Tag-Version MUSS bei Playwright-Upgrades mit @playwright/test in
    # frontend/package.json mitgezogen werden (bildet die fruehere Cache-Key-Kopplung ab).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # git fehlt im Playwright-Image, actions/checkout braucht es (guarded: No-op falls doch vorhanden).
      # safe.directory: Container-Jobs mounten den Workspace mit fremdem UID-Owner — checkout fängt
      # das intern ab, aber lefthooks `prepare` (git rev-parse) stirbt sonst an dubious ownership.
      - name: git fuer checkout bereitstellen
        run: |
          command -v git >/dev/null || (apt-get update && apt-get install -y --no-install-recommends git)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Configure Provider Settings
        run: |
          PROVIDER="${{ env.LLM_PROVIDER }}"

          case $PROVIDER in
            claude)
              echo "ANTHROPIC_AUTH_TOKEN=${{ secrets.CLAUDE_API_KEY }}" >> $GITHUB_ENV
              ;;
            zai)
              echo "${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}" > .claude/settings.local.json
              echo "ANTHROPIC_AUTH_TOKEN=${{ secrets.ZAI_API_KEY }}" >> $GITHUB_ENV
              ;;
            openrouter)
              echo "${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}" > .claude/settings.local.json
              echo "ANTHROPIC_AUTH_TOKEN=${{ secrets.OPENROUTER_API_KEY }}" >> $GITHUB_ENV
              ;;
            *)
              echo "Unknown provider: $PROVIDER" && exit 1
              ;;
          esac

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: E2E (shard ${{ matrix.shard }}/4)
        run: pnpm --filter frontend exec playwright test --shard=${{ matrix.shard }}/4

      - name: Playwright-Report sichern
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ env.LLM_PROVIDER }}-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
