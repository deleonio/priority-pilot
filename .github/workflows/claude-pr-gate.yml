name: Claude PR Gate (CI/Reviewer rot -> Fixup)

# Deterministisches CI-/Reviewer-Gate fuer die label-gesteuerte PR-Pipeline (Ticket #87).
#
# Problem: review <-> fixup wird rein ueber LABELS koordiniert; der CI-Status floss bisher in
# KEINE Entscheidung ein. War ein PR inhaltlich gruen, das CI aber rot, vergab der Review
# ai:ready-to-merge und der Fixup (nur an ai:needs-changes) lief NIE — die roten Gates blieben.
#
# Loesung: ein separater, LLM-freier Job (reiner `gh`-Lauf), der nach Abschluss der Allowlist-
# Workflows "CI" und "Claude PR Review (Kreuzverhoer)" deren Ergebnis prueft. Ist mindestens einer
# der beiden rot, setzt er ai:needs-changes -> loest claude-pr-fixup.yml aus. Sind beide gruen,
# No-op (der Review-Pfad vergibt terminal ai:ready-to-merge).
#
# Nutzt das kurzlebige GitHub-App-Token (APP_ID + APP_PRIVATE_KEY): von GITHUB_TOKEN gesetzte Labels
# loesen KEINE Folge-Workflows aus, vom App-Token gesetzte schon. Gleiches Preflight-Skip-Muster wie
# Review/Fixup, damit der Lauf ohne Secrets sauber uebersprungen wird.
#
# HINWEIS (workflow_run): Dieser Trigger wird ausschliesslich aus dem DEFAULT-BRANCH (main) gelesen.
# Das Gate wird daher erst AKTIV, nachdem diese Datei nach main gemergt ist — es laeuft NICHT auf dem
# eigenen PR dieses Tickets. Eine Validierung ist erst nach dem Merge moeglich (am naechsten PR).

on:
  workflow_run:
    # Allowlist: NUR diese beiden Workflows gaten. Externe Checks (z. B. Renovate) zaehlen bewusst
    # nicht mit. Die Namen muessen exakt den `name:`-Feldern von ci.yml bzw. claude-pr-review.yml
    # entsprechen.
    workflows: ['CI', 'Claude PR Review (Kreuzverhoer)']
    types: [completed]

concurrency:
  # Pro PR serialisieren (head_branch identifiziert den PR auch ueber workflow_run hinweg), damit
  # zwei kurz nacheinander abgeschlossene Allowlist-Laeufe nicht gleichzeitig umlabeln.
  group: claude-pr-gate-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  gate:
    # Nur same-repo-Laeufe (kein Fork -> App-Token verfuegbar). Draft-PRs werden im Skript anhand
    # des aufgeloesten PRs zusaetzlich uebersprungen.
    if: >-
      ${{ github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Voraussetzung pruefen (GitHub-App-Secrets)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::GitHub-App-Secrets fehlen (APP_ID und/oder APP_PRIVATE_KEY) — Lauf wird uebersprungen (kein Fehler). GitHub App anlegen (Contents/Issues/Pull requests = Read and write), aufs Repo installieren und beide Werte als Repo-Secrets hinterlegen, damit die Pipeline laeuft."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Reiner gh-Job (kein Checkout, kein LLM). Liest die Allowlist-Checks des PRs und labelt um,
      # wenn mind. einer rot ist. Alle Vorbedingungen sind defensiv: erst wenn wirklich umzulabeln
      # ist, schreibt der Job nach GitHub.
      - name: Gate auswerten (CI/Reviewer rot -> ai:needs-changes)
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }} # Label als App-Token -> loest Fixup aus
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          # 1) PR ueber den Head-Branch aufloesen (zuverlaessiger als workflow_run.pull_requests,
          #    das fuer manche Laeufe leer bleibt). Push-Laeufe auf main (kein PR) und geschlossene
          #    PRs -> sauberer No-op. Mehrdeutigkeit (mehrere offene PRs mit gleichem Head-Branch,
          #    z. B. gegen verschiedene Base-Branches) -> bewusst KEIN Raten: lieber No-op als evtl.
          #    den falschen PR umzulabeln. Daher kein `--limit 1`, sondern die Anzahl explizit pruefen.
          pr_json="$(gh pr list --repo "$REPO" --state open --head "$HEAD_BRANCH" \
            --json number,isDraft,labels)"
          pr_count="$(echo "$pr_json" | jq 'length')"
          if [ "$pr_count" -eq 0 ]; then
            echo "Kein offener PR fuer Branch '$HEAD_BRANCH' — nichts zu gaten (No-op)."
            exit 0
          fi
          if [ "$pr_count" -gt 1 ]; then
            echo "Mehrere offene PRs fuer Branch '$HEAD_BRANCH' — mehrdeutig, kein Gating (No-op)."
            exit 0
          fi
          pr="$(echo "$pr_json" | jq -r '.[0].number')"
          echo "Gate prueft PR #$pr (Branch '$HEAD_BRANCH')."

          # 2) Draft-PRs nicht gaten.
          if [ "$(echo "$pr_json" | jq -r '.[0].isDraft')" = "true" ]; then
            echo "PR #$pr ist Draft — uebersprungen (No-op)."
            exit 0
          fi

          # 3) Nur PRs gaten, die in der KI-Pipeline sind (tragen ein Pipeline-Label). Schuetzt
          #    fremde/menschliche PRs davor, durch das Gate ungewollt einen Fixup zu triggern.
          labels="$(echo "$pr_json" | jq -r '[.[0].labels[].name]')"
          in_pipeline="$(echo "$labels" | jq -r 'any(.[]; . == "ai:needs-review" or . == "ai:needs-changes" or . == "ai:ready-to-merge")')"
          if [ "$in_pipeline" != "true" ]; then
            echo "PR #$pr traegt kein Pipeline-Label — gehoert nicht zur KI-Pipeline (No-op)."
            exit 0
          fi

          # 4) Oszillationsschutz: Traegt der PR bereits ai:needs-changes, laeuft (oder steht
          #    bewusst) der Fixup-Loop schon. Erneutes Setzen waere ein No-op; wir ruehren den
          #    Zustand NICHT an, um einen bewussten "Stop"-Zustand (> 5 Fixup-Commits) nicht zu
          #    ueberschreiben.
          if [ "$(echo "$labels" | jq -r 'any(.[]; . == "ai:needs-changes")')" = "true" ]; then
            echo "PR #$pr traegt bereits ai:needs-changes — Loop laeuft/steht bewusst (No-op)."
            exit 0
          fi

          # 5) Allowlist-Checks (CI + Reviewer) auswerten. WICHTIG: `gh pr checks` beendet sich
          #    selbst mit Exit != 0, wenn Checks rot (1) oder pending (8) sind — gibt das `--json`
          #    aber trotzdem auf stdout aus. Daher Exit-Code abfangen (|| true), OHNE die Ausgabe zu
          #    verwerfen (ein `|| echo '[]'` wuerde genau im roten Fall die Daten wegwerfen).
          checks="$(gh pr checks "$pr" --repo "$REPO" --json name,bucket,workflow 2>/dev/null)" || true
          if [ -z "$checks" ]; then checks='[]'; fi
          allow="$(echo "$checks" | jq '[.[] | select(.workflow == "CI" or .workflow == "Claude PR Review (Kreuzverhoer)")]')"

          if [ "$(echo "$allow" | jq 'length')" -eq 0 ]; then
            echo "Keine Allowlist-Checks (CI/Reviewer) gefunden — nichts zu gaten (No-op)."
            exit 0
          fi

          # 6) Laeuft noch ein Allowlist-Check (pending) -> abwarten; das naechste workflow_run-Event
          #    weckt das Gate erneut. So gaten wir erst, wenn beide fertig sind.
          if [ "$(echo "$allow" | jq 'any(.[]; .bucket == "pending")')" = "true" ]; then
            echo "Mind. ein Allowlist-Check ist noch pending — warte auf Abschluss (No-op)."
            exit 0
          fi

          # 7) Mind. ein Allowlist-Check rot?
          any_fail="$(echo "$allow" | jq -r 'any(.[]; .bucket == "fail")')"
          if [ "$any_fail" != "true" ]; then
            echo "Alle Allowlist-Checks gruen — kein Gating noetig (No-op; Review vergibt ai:ready-to-merge)."
            exit 0
          fi

          red="$(echo "$allow" | jq -r '[.[] | select(.bucket == "fail") | (.workflow + " / " + .name)] | join(", ")')"
          echo "Rote Allowlist-Checks an PR #$pr: $red — setze ai:needs-changes (loest Fixup aus)."

          # Terminale/abgeschlossene Pipeline-Labels entfernen, dann ai:needs-changes setzen. In
          # GETRENNTEN Befehlen (nie kombiniert), analog Review/Fixup, um Doppel-Trigger zu meiden.
          if [ "$(echo "$labels" | jq -r 'any(.[]; . == "ai:ready-to-merge")')" = "true" ]; then
            gh pr edit "$pr" --repo "$REPO" --remove-label ai:ready-to-merge
          fi
          if [ "$(echo "$labels" | jq -r 'any(.[]; . == "ai:needs-review")')" = "true" ]; then
            gh pr edit "$pr" --repo "$REPO" --remove-label ai:needs-review
          fi
          # Label bei Bedarf anlegen (gleiche Farbe wie im Review-Workflow), dann setzen.
          gh label create "ai:needs-changes" --repo "$REPO" --color D93F0B \
            --description "CI/Reviewer rot oder Findings offen -> Fixup" 2>/dev/null || true
          gh pr edit "$pr" --repo "$REPO" --add-label ai:needs-changes

          {
            echo "### CI-Gate #${pr} — ai:needs-changes gesetzt"
            echo ""
            echo "- Rote Allowlist-Checks: ${red}"
            echo "- Folge: claude-pr-fixup.yml wird ausgeloest."
          } >> "$GITHUB_STEP_SUMMARY"
