name: Kosten-Uebersicht

# Rendert BEIDE Zusammenfassungen ueber die versiegelten Kosten-Datensaetze (.costs/*.json)
# in EINE Job-Summary: die Turn-Uebersicht (turns-report.ts, Abrechnungsmassstab der Abos,
# Issue #1197) OBEN, die Token-/Kosten-Uebersicht (tokens-report.ts, Token/USD-primär) darunter —
# ein Lauf, ein Blick, kein zweiter Runner. Beide Berichte filtern seit 2026-09 auf
# VOLLSTAENDIGE Tickets (Pipeline: implement + documenter; extern: review/fixup vor dem
# Siegel — classifyTicket in tokens-report.ts) und weisen Ticket-Kennzahlen je Herkunft
# aus; Fixup-Beine und abgebrochene Durchläufe stehen nur als Fussnote mit ihrer Summe.
# Wochen-Kennzahlen laufen ueber Kohorten je Abschlusswoche (Median, n, Index gegen
# Baseline, 20-Ticket-Fenster); Interventionen aus docs/kosten-interventionen.json.
#
# WARUM WOCHENTLICHER CRON: das Turn-Budget (ca. 8000 Prompts/Woche) ist 2026-09 erstmals
# gerissen worden, ohne dass es jemand sah — die Uebersicht muss regelmaessig von selbst
# erscheinen, nicht nur auf Klick. Montagfrueh (06:43 UTC, 08:43 MESZ): die Zahlen der
# Vorwoche sind komplett versiegelt, die neue Woche laeuft noch nicht heiss. Der Lauf ist
# read-only und fertig in ~1 min. Der manuelle Dispatch bleibt fuer Zwischendurch-Blicke,
# lokal gehen beide Berichte einzeln:
#   node .github/scripts/turns-report.ts --dir .costs
#   node .github/scripts/tokens-report.ts --dir .costs
#
# NUR LESEND: kein Label, kein Kommentar, kein Commit.
#
# FOKUS-MODUS (Dispatch-Input „issues", z. B. „1752, 1754"): statt der Wochen-Reporte
# rendert tokens-report.ts nur die Läufe der gewählten Tickets und stellt sie je Phase
# den anderen Läufen derselben Phase gegenüber — der Vergleich einzelner Setups
# (z. B. Documenter auf :free-Modell) ohne die GitHub-Summary-Größenlücke.

on:
  schedule:
    - cron: '43 6 * * 1' # montags 06:43 UTC
  workflow_dispatch:
    inputs:
      issues:
        description: 'Fokus-Modus: kommaseparierte Issue-Nummern (z. B. 1752,1754) — leer = voller Wochen-Report'
        required: false
        default: ''

permissions:
  contents: read # .costs/ + Skripte auschecken

env:
  ISSUES: ${{ github.event.inputs.issues || '' }}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Immer der Default-Branch: Der Report ist repo-weit und read-only — ein Dispatch
          # von einem Feature-Branch renderte sonst den veralteten .costs/-Stand des Branches
          # (frisch versiegelte Tickets fehlten still).
          ref: ${{ github.event.repository.default_branch }}

      - name: Turn-Uebersicht (vollstaendige Tickets)
        run: |
          set -euo pipefail
          if [ -n "$ISSUES" ]; then
            echo "Fokus-Modus (${ISSUES}) — Turn-Übersicht übersprungen."
            exit 0
          fi
          # Bewusst `node` statt tsx: kein pnpm-Setup nötig, die Skripte nutzen
          # ausschliesslich löschbare TypeScript-Syntax (gleiche Begründung wie record-cost).
          node .github/scripts/turns-report.ts --dir .costs \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Token- und Kosten-Uebersicht (vollstaendige Tickets)
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$ISSUES" ]; then ARGS+=(--issues "$ISSUES"); fi
          node .github/scripts/tokens-report.ts --dir .costs "${ARGS[@]}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
