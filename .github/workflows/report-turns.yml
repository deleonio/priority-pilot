name: Turn-Übersicht

# Rendert die TURN-primäre Gesamt-Übersicht über ALLE versiegelten Kosten-Datensätze
# (.costs/*.json) in die Job-Summary — das Gegenstück zum Workflow „Kosten-Übersicht", der
# dieselben Daten token-/USD-primär zeigt. Die Abos rechnen nach Prompts/Turns ab, deshalb
# gibt es beide Blickwinkel getrennt (Issue #1197).
#
# WARUM WOCHENTLICHER CRON: das Turn-Budget (ca. 8000 Prompts/Woche) ist 2026-09 erstmals
# gerissen worden, ohne dass es jemand sah — die Übersicht muss regelmäßig von selbst
# erscheinen, nicht nur auf Klick. Montagfrüh (06:43 UTC, 08:43 MESZ): die Zahlen der
# Vorwoche sind komplett versiegelt, die neue Woche läuft noch nicht heiß. Der Lauf ist
# read-only und fertig in ~1 min — das „Runner verbrennen“ des reinen Manuell-Betriebs
# (Issue #1197) wog nur bei täglichem Schedule; weekly ist es Budget-Monitoring.
# Der manuelle Dispatch bleibt für Zwischendurch-Blicke. Lokal geht weiterhin:
#   node .github/scripts/turns-report.ts --dir .costs
#
# NUR LESEND: kein Label, kein Kommentar, kein Commit.

on:
  schedule:
    - cron: '43 6 * * 1' # montags 06:43 UTC
  workflow_dispatch: {}

permissions:
  contents: read # .costs/ + Skript auschecken

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Bericht bauen
        run: |
          set -euo pipefail
          # Bewusst `node` statt tsx: kein pnpm-Setup nötig, das Skript nutzt
          # ausschliesslich löschbare TypeScript-Syntax (gleiche Begründung wie record-cost).
          node .github/scripts/turns-report.ts --dir .costs \
            | tee -a "$GITHUB_STEP_SUMMARY"
