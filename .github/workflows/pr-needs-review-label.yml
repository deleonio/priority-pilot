name: PR Auto-Label (ai:needs-review)

# Setzt beim OEFFNEN eines (Nicht-Draft-)Pull Requests automatisch das Pipeline-Label
# "ai:needs-review" (Ticket #116). Das ist der Einstieg in die label-gesteuerte KI-Review-
# Pipeline: das gesetzte Label weckt den Kreuzverhoer-Review (05-claude-pr-review.yml).
# Wird auch bei jedem Push (synchronize-Event) erneut ausgeloest, wobei alte Ergebnis-
# Labels (ai:needs-fixup, ai:reviewed, ai:needs-human) entfernt werden. Der Reset
# ist wichtig: ein menschlicher Push ist echter Fortschritt und verdient einen frischen
# Review ohne Altlasten. Das Loop-Breaking selbst lebt bewusst NICHT hier, sondern in den
# LLM-Phasen: Fixup misst HEAD-Bewegung (kein neuer Commit -> terminal ai:needs-human) plus
# Stop-Guard (>10 PR-Commits), Review setzt ai:needs-human terminal. Dieser Autolabeler setzt
# den Einstieg, raeumt Ergebnis-Labels weg UND cancelt bei menschlichem Push (synchronize)
# laufende/queued Review-/Fixup-Laeufe des Branches — Supersede-Kompensation dafuer, dass die
# Phasen-Workflows seit der statischen concurrency-Gruppe nicht mehr verdraengen, sondern nur
# noch serialisieren (cancel-in-progress: false).
# sender.type != 'Bot' (job-if) stellt sicher, dass NUR Menschen-Pushes zuruecksetzen,
# nicht die Fixup-Bot-Commits.
#
# WICHTIG (Folge-Workflows): Von GITHUB_TOKEN gesetzte Labels loesen KEINE weiteren Workflows
# aus. Damit das "labeled"-Event den Review wirklich startet, wird hier ein kurzlebiges
# GitHub-App-Token (APP_ID + APP_PRIVATE_KEY) verwendet — gleiches Muster wie in
# claude-pr-gate-merge.yml / 05-claude-pr-review.yml.
#
# Bedingungen:
#   - nur Nicht-Drafts (draft == false): "opened" eines Drafts wird ignoriert, erst
#     "ready_for_review" zieht das Label.
#   - nur same-repo-PRs (kein Fork): Fork-PRs haben kein App-Token und sollen die Pipeline
#     nicht ungefragt anstossen.
#   - re-trigger-sicher (#536, seit PR #890 via atomarer Transition): label-transition.sh
#     ersetzt den gesamten Pipeline-Bestand durch ai:needs-review — alte Ergebnis-Labels
#     sind damit abgebaut (ausser ai:needs-human: Parker-Guard, PR #903),
#     es gibt keinen Zwischenzustand. War der Zielzustand bereits
#     gesetzt (changed=false → PUT feuert kein `labeled`-Event), re-armt ein Remove+
#     Transition-Fallback mit frischem Event (PR #899: labeled-Event im Konflikt-Fenster
#     verloren). Keine Schleife: dieser Workflow triggert nicht auf `labeled`
#     (siehe AK5-Tests).
#   - NUR menschliche Aktoren (sender.type != "Bot"), UND ZWAR FUER ALLE DREI Event-Typen
#     (opened/ready_for_review/synchronize gleichermassen — vormals galt der Bot-Filter nur
#     bei synchronize). Grund: 04-claude-implement.yml macht PRs per App-Bot-Token review-bereit
#     (`gh pr ready` bzw. `gh pr create`) und setzt `ai:needs-review` danach SELBST als
#     expliziten, kontrollierten letzten Schritt (siehe 04-claude-implement.yml) — dieser
#     Workflow darf dem NICHT zuvorkommen, sonst startet der Review auf einem PR, dessen
#     Beschreibung/Testergebnisse implement noch gar nicht fertig geschrieben hat. Fuer echte
#     menschliche PRs (Ticket #116, der eigentliche Zweck dieses Workflows) bleibt das
#     Verhalten unveraendert: opened/ready_for_review/synchronize durch einen Menschen labeln
#     weiterhin sofort.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

concurrency:
  # Pro PR serialisieren, damit zwei kurz aufeinanderfolgende Events nicht doppelt labeln.
  group: pr-needs-review-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    # Nur Nicht-Drafts, nur same-repo (kein Fork) und nur bei MENSCHLICHEN Aktoren — fuer ALLE drei
    # Event-Typen (opened/ready_for_review/synchronize). Bot-Aktoren (implement/spec machen PRs per
    # App-Token review-bereit) werden hier bewusst NICHT gelabelt: implement setzt ai:needs-review
    # fuer seine eigenen PRs SELBST als kontrollierten letzten Schritt (erst NACHDEM Beschreibung/
    # Testergebnisse vollstaendig stehen) — dieser Autolabeler soll dem nicht zuvorkommen.
    #
    # BEWUSST KEIN "!contains(ai:needs-review)"-Gate mehr im job-if: die Idempotenz des Labels
    # steckt im Setz-Schritt (Runtime-Check, No-op wenn schon vorhanden). Haengte die Idempotenz am
    # job-if, wuerde ein Menschen-Push den GESAMTEN Job (inkl. Ergebnis-Label-Reset) ueberspringen,
    # sobald ai:needs-review bereits klebt. Genau das ist im aktiven Review-Loop erreichbar: Fixup
    # reicht per ai:needs-review an den Review zurueck, waehrend ai:needs-review (und ggf.
    # ai:needs-human) schon klebt. Ein lokaler Fix + Push in diesem Fenster muss die Ergebnis-
    # Labels trotzdem zuruecksetzen. Ohne das Gate laeuft der Job, und die atomare
    # Transition (PR #890) ersetzt den ganzen Pipeline-Bestand durch ai:needs-review →
    # genau ein `labeled`-Event feuert, der Review startet zuverlaessig.
    if: >-
      ${{ github.event.pull_request.draft == false
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Schreibzugriff laeuft ueber das App-Token
      pull-requests: write
      issues: write
    steps:
      - name: Voraussetzung pruefen (GitHub-App-Secrets)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::GitHub-App-Secrets fehlen (APP_ID und/oder APP_PRIVATE_KEY) — Lauf wird uebersprungen (kein Fehler). GitHub App anlegen (Contents/Issues/Pull requests = Read and write), aufs Repo installieren und beide Werte als Repo-Secrets hinterlegen, damit die Pipeline laeuft."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: App-Token sicherstellen (kein GITHUB_TOKEN-Fallback)
        id: gh-token
        if: steps.preflight.outputs.configured == 'true'
        env:
          APP_TOK: ${{ steps.app-token.outputs.token }}
        run: |
          # Bewusst KEIN GITHUB_TOKEN-Fallback (G3): unter GITHUB_TOKEN gesetzte Labels feuern
          # kein `labeled`-Event → der Kreuzverhoer-Review startet nie (still). Genau das
          # versagt auch setup-claude/action.yml hard (gleiche App-only-Philosophie). Ein
          # fehlendes App-Token trotz vorhandener Secrets = Konfigurations-/Transient-Fehler
          # → laut abbrechen, nicht still mit GITHUB_TOKEN weiterlaufen.
          if [ -z "$APP_TOK" ] || [ "$APP_TOK" = "null" ]; then
            echo "::error::App-Token nicht verfügbar trotz vorhandener GitHub-App-Secrets — kein GITHUB_TOKEN-Fallback (Labels würden keine Folge-Workflows auslösen)."
            exit 1
          fi
          echo "token=$APP_TOK" >> "$GITHUB_OUTPUT"
          echo "::notice::Nutze GitHub-App-Token für gh-Befehle."

      # SUPERSEDE-Kompensation (nur synchronize — opened/ready_for_review können keine laufenden
      # Reviews haben): Die Phasen-Workflows 05/06 serialisieren seit der statischen
      # concurrency-Gruppe global mit cancel-in-progress: false. Ohne diesen Cancel wuerde ein
      # LAUFENDER Review den frisch gesteckten Trigger konsumieren (entfernt ai:needs-review in
      # seiner Post-Assertion), der queued Folge-Lauf im Label-Pre-Check skippen — und der
      # menschliche Push bliebe unreviewed. Ein menschlicher Push ist echter Fortschritt und
      # VERDRÄNGT deshalb bewusst laufende/queued Review- und Fixup-Läufe des Branches
      # (Muster: claude-pr-cancel.yml). Danach sorgt Entfernen+Neu-Setzen des Labels für einen
      # frischen Review-Lauf, der garantiert den neuen Head sieht.
      - name: Stale Review-/Fixup-Läufe des Branches abbrechen (nur synchronize)
        if: github.event.action == 'synchronize' && steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          for wf in 05-claude-pr-review.yml 06-claude-pr-fixup.yml; do
            gh run list --repo "$REPO" --workflow "$wf" --branch "$HEAD_REF" --limit 100 \
              --json databaseId,status \
              --jq '.[] | select(.status=="in_progress" or .status=="queued") | .databaseId' \
              | while read -r id; do
                  echo "Breche Run $id ($wf) ab — menschlicher Push verdrängt stale Review/Fixup."
                  gh run cancel --repo "$REPO" "$id" || true
                done
          done

      # Checkout NUR fuer label-transition.sh (persist-credentials: false — der Job
      # schreibt nach GitHub ausschliesslich via App-Token).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.preflight.outputs.configured == 'true'
        with:
          persist-credentials: false

      # Reiner gh-Job (kein LLM): EINE atomare Transition zu ai:needs-review — ersetzt
      # den gesamten Pipeline-Bestand, nimmt also alte Ergebnis-Labels (ai:needs-fixup,
      # ai:reviewed, ai:needs-human) immer mit ab. Mit dem App-Token gesetzt, damit das
      # `labeled`-Event den Kreuzverhoer-Review ausloest.
      - name: Label-Transition zu ai:needs-review (Reset + Trigger)
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }} # App-Token -> loest Folge-Workflows aus
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Ein menschlicher Push ist echter Fortschritt und bekommt einen sauberen Review
          # ohne Altlasten. Das Loop-Breaking lebt in den LLM-Phasen (Fixup HEAD-Check/
          # Stop-Guard, Review ai:needs-human), nicht in diesem Autolabeler.
          if ! OUT="$(bash .github/scripts/label-transition.sh \
              --repo "$REPO" --pr "$PR" --set ai:needs-review)"; then
            echo "::error::Label-Transition zu ai:needs-review endgültig fehlgeschlagen (Race-Condition #613)"
            exit 1
          fi
          applied="$(printf '%s\n' "$OUT" | sed -n 's/^applied=//p')"
          state="$(printf '%s\n' "$OUT" | sed -n 's/^state=//p')"
          reason="$(printf '%s\n' "$OUT" | sed -n 's/^reason=//p')"
          changed="$(printf '%s\n' "$OUT" | sed -n 's/^changed=//p')"
          # Auf `state` verzweigen, nicht nur auf `applied` — das war der Fehler (PR #914):
          # label-transition.sh unterscheidet ABSICHTLICHE Ablehnungen (state=ok, u. a. Guard 3
          # „ai:needs-human klebt") von echten Fehlern (read-failed/put-failed). Ein beim
          # Menschen geparkter PR ist ein gewollter Halt und darf den Autolabeler NICHT rot
          # färben — sonst meldet jeder geparkte PR dauerhaft eine fehlgeschlagene Action.
          # gate-merge und conflict-scan machen das seit PR #903 bereits so; dieser Workflow
          # wurde damals übersehen und fiel erst auf, als die Modellwahl anfing,
          # ai:needs-human automatisch zu setzen.
          if [ "$applied" != "true" ] && [ "$state" = "ok" ]; then
            echo "::notice title=⏭️ Kein Review-Trigger::PR #$PR — ${reason:-neuere Entscheidung regiert}."
            exit 0
          fi
          if [ "$applied" != "true" ]; then
            echo "::error::Label-Transition zu ai:needs-review fehlgeschlagen (state=${state:-?}, ${reason:-Guard}) — PR bitte manuell prüfen."
            exit 1
          fi
          # #536-Re-Arm: Klebte ai:needs-review bereits (identischer Zielzustand,
          # changed=false), feuert der PUT kein `labeled`-Event — der Review startet
          # nicht. Moegliche Ursache: das urspruengliche Event ging verloren (z. B.
          # PR waehrend des labeled-Events im Merge-Konflikt — dann laufen pull_request-
          # Workflows gar nicht, PR #899). Fallback: einmal Remove + erneute Transition
          # erzwingt ein frisches Event. Fenster ~1s; ok, denn ohne Fallback wuerde der
          # PR unreviewt haengen bleiben.
          if [ "$changed" = "false" ]; then
            echo "PR #$PR: Zielzustand war bereits gesetzt — Re-Arm (#536): Remove + Transition erzwingt labeled-Event."
            gh pr edit "$PR" --repo "$REPO" --remove-label ai:needs-review
            if ! OUT="$(bash .github/scripts/label-transition.sh \
                --repo "$REPO" --pr "$PR" --set ai:needs-review --expect none)"; then
              echo "::error::Re-Arm-Transition fehlgeschlagen — Label bitte manuell prüfen."
              exit 1
            fi
            rearm_applied="$(printf '%s\n' "$OUT" | sed -n 's/^applied=//p')"
            rearm_state="$(printf '%s\n' "$OUT" | sed -n 's/^state=//p')"
            rearm_reason="$(printf '%s\n' "$OUT" | sed -n 's/^reason=//p')"
            if [ "$rearm_applied" != "true" ]; then
              # Das Remove oben ist bereits passiert — der PR steht jetzt ohne
              # ai:needs-review da. Bei einer absichtlichen Ablehnung (state=ok, z. B. ein
              # zwischenzeitlich gesetztes ai:needs-human) ist genau das richtig: Der PR
              # parkt, ein Review-Trigger wäre falsch. Nur ein echter Fehler ist rot.
              if [ "$rearm_state" = "ok" ]; then
                echo "::notice title=⏭️ Re-Arm verworfen::PR #$PR — ${rearm_reason:-neuere Entscheidung regiert}; ai:needs-review bleibt entfernt."
                exit 0
              fi
              echo "::error::Re-Arm fehlgeschlagen (state=${rearm_state:-?}, ${rearm_reason:-Guard}) — ai:needs-review wurde entfernt, Label bitte manuell prüfen."
              exit 1
            fi
          fi
          echo "PR #$PR: ai:needs-review gesetzt (atomar, inkl. Alt-Label-Abbau) — Kreuzverhoer-Review wird ausgeloest." \
            >> "$GITHUB_STEP_SUMMARY"
