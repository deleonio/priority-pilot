name: 5/6 Fixup

# ⚠️ Der `name:` ist lastend: der Supersede-Check (select(.name == "Claude PR Fixup
#    (Findings umsetzen)")) matcht ihn exakt. Umbenennen schaltet den Guard lautlos ab →
#    Duplikat-Läufe. ACHTUNG: es gibt KEINEN Contract-Test für diese Kopplung (ADR #567 —
#    Workflows bleiben ungetestet), ein Rename fällt also lautlos durch — vor jeder
#    `name:`-Änderung den Supersede-Guard manuell mitpflegen.

# Reagiert auf das Label "ai:needs-changes" (vom Review gesetzt) und setzt die
# zutreffenden Findings um.
# Setzt **Claude Code** ein; Provider via `vars.LLM_PROVIDER` (zai|claude), aufgelöst in setup-claude.
#   review → ai:needs-changes → fixup → ai:needs-review → review → ... bis 🟢

on:
  pull_request:
    types: [labeled]

concurrency:
  group: claude-pr-fixup-${{ github.event.pull_request.number }}-${{ github.event.label.name == 'ai:needs-changes' }}
  cancel-in-progress: true

jobs:
  fixup:
    if: >-
      ${{ github.event.label.name == 'ai:needs-changes'
          && github.event.pull_request.draft == false
          && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    permissions:
      contents: read
      id-token: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Startzeit merken (für weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 600))" >> "$GITHUB_OUTPUT"

      - name: Setup Claude Code (mit Memory-Load)
        id: setup
        uses: ./.github/actions/setup-claude
        with:
          needs-mcp: false
          tools-tier: full
          event-type: ${{ github.event_name }}
          ticket-ref: ${{ github.event.pull_request.number }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          model: ${{ vars.CLAUDE_MODEL_FIXUP || 'sonnet' }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          zai-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}
          openrouter-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}
          memory-load: 'true'

      - name: pnpm einrichten
        if: steps.setup.outputs.configured == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Node.js einrichten
        if: steps.setup.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Abhängigkeiten installieren
        if: steps.setup.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Git-Hooks installieren (lefthook)
        if: steps.setup.outputs.configured == 'true'
        run: pnpm exec lefthook install

      - name: Merge-Konflikte prüfen und auflösen
        id: resolve-conflicts
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if ! state_json="$(gh pr view "$PR" --repo "$REPO" --json mergeable,mergeStateStatus 2>/dev/null)"; then
            echo "conflict=unknown" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mergeable="$(echo "$state_json" | jq -r '.mergeable')"
          merge_state="$(echo "$state_json" | jq -r '.mergeStateStatus')"
          if [ "$mergeable" = "MERGEABLE" ]; then echo "conflict=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$mergeable" = "UNKNOWN" ] || [ "$mergeable" = "null" ]; then
            sleep 5
            state_json="$(gh pr view "$PR" --repo "$REPO" --json mergeable,mergeStateStatus 2>/dev/null || true)"
            mergeable="$(echo "$state_json" | jq -r '.mergeable' 2>/dev/null || echo 'UNKNOWN')"
          fi
          if [ "$mergeable" = "UNKNOWN" ]; then echo "conflict=unknown" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$merge_state" = "DIRTY" ] || [ "$mergeable" = "CONFLICTING" ]; then
            git fetch origin "$TARGET_BRANCH" --depth=1 --no-tags
            if git merge origin/"$TARGET_BRANCH" --no-ff --no-edit -m "Auto-merge: resolve conflicts for PR #$PR" 2>/dev/null; then
              git push origin HEAD:"$HEAD_BRANCH"
              echo "conflict=resolved" >> "$GITHUB_OUTPUT"
            else
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "conflict=needs_resolution" >> "$GITHUB_OUTPUT"
              else
                git merge --abort 2>/dev/null || true
                echo "conflict=aborted" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

      - name: Stop-Guard (> 10 PR-Commits)
        id: stop-guard
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if ! commits="$(gh pr view "$PR" --repo "$REPO" --json commits --jq '.commits | length' 2>/dev/null)"; then
            echo "stop=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR" --repo "$REPO" --body "🛑 Stop-Guard: gh-API nicht erreichbar – fail-closed." 2>/dev/null || true
            exit 0
          fi
          if [ "${commits:-0}" -gt 10 ]; then
            echo "stop=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR" --repo "$REPO" --body "🛑 **Stop-Guard: Fixup-Loop gestoppt** (${commits} Commits > 10). Bitte manuell prüfen." 2>/dev/null || true
            exit 0
          fi
          echo "stop=false" >> "$GITHUB_OUTPUT"

      - name: Supersede-Check
        id: supersede-check
        if: steps.setup.outputs.configured == 'true' && steps.stop-guard.outputs.stop != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          running=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs \
            --jq '.workflow_runs[] | select(.name == "5/6 Fixup" and (.status == "queued" or .status == "in_progress") and .head_branch == $ENV.HEAD_BRANCH and .id != ${{ github.run_id }}) | .id' 2>/dev/null | head -1)
          if [ -n "$running" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: HEAD vor Claude merken (Fortschritts-Baseline)
        id: head-before
        if: steps.setup.outputs.configured == 'true' && steps.stop-guard.outputs.stop != 'true' && steps.supersede-check.outputs.skip != 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Findings umsetzen via Claude
        id: claude
        if: steps.setup.outputs.configured == 'true' && steps.stop-guard.outputs.stop != 'true' && steps.supersede-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          cat > /tmp/claude-prompt.txt << 'CLAUDE_EOF'
          MEMORY: Deine Memory (autoMemoryDirectory, automatisch geladen) sammelt pro Issue alle Phasen-Notizen. Schreibe am ENDE deine wichtigsten neuen Erkenntnisse (behebte Findings, offene Punkte, neue Fallstricke) dort hinein — nur Neues, kurz.
          FOKUS: NUR PR #PR_NR. NUR gemeldete Kritikpunkte beheben. KEINE Abstecher. Token sparen: kurz, präzise, direkt.

          ABLAUF (STRIKT):
            0. KONFLIKTAUFLÖSUNG (falls nötig): Prüfe mit git status und git diff --name-only --diff-filter=U auf Merge-Konflikte. Bei Konflikten: analysieren, eindeutig auflösen, git add, git commit, git push. Erst DANN mit Findings weitermachen.
            1. SOFORT starten.
            2. Findings lesen: gh pr view, gh pr diff, Review-Threads (gh api .../pulls/PR_NR/comments) und CI (gh pr checks).
            3. Zutreffende, EINDEUTIGE Findings fixen:
               - Code ändern, vor jedem Commit lokale Checks: pnpm format && pnpm exec prettier --check . && pnpm lint && pnpm knip.
               - Erst wenn alle grün, committen und pushen.
               - Im jeweiligen Thread antworten und auflösen.
               - Mehrdeutige/große/Entscheidungs-Punkte NICHT fixen → stattdessen am Ende VERDICT: needs-human (der Mensch entscheidet).
            4. CI-CHECKS BEHANDELN (falls rot):
               a) FLAKY-TEST ERKENNEN: Timeout/Timing-Instabilität + thematisch keine Logik aus diesem PR-Diff? → FLAKY: einmalig via gh run rerun <failed-run-id> --failed neu starten. 60s warten, dann gh pr checks erneut prüfen.
               b) ECHTER CI-FEHLER: Job-Log lesen, Root Cause identifizieren, Code ändern, lokale Checks ausführen, committen und pushen.
               c) UNRELATED CI-FEHLER: In PR-Kommentar dokumentieren. Nicht fixen.

          ABSCHLUSS:
            - Committen+pushen ist der ECHTE Fortschritt: das Workflow misst HEAD-Bewegung (neue
              Commits), um zu entscheiden, ob ein erneuter Review nötig ist. Ein "fertig"-Verdict
              ohne Commit bewirkt NICHTS — der Workflow übergibt nur bei gerücktem HEAD an Review.
            - VERDICT: needs-human NUR bei Entscheidungs-Findings (Architektur/Produkt/Design,
              "Mensch entscheidet") — das ist das EINZIG verbindliche Verdict (terminal an Mensch).

          ⚠️ LABELS: KEINE Labels setzen! Workflow übernimmt das automatisch.

          VERDICT: GANZ AM ENDE GENAU EINE Zeile (nur bei Entscheidungs-Findungen):
            - VERDICT: needs-human (offene Entscheidungs-Findings, die ein Mensch treffen muss)
            - sonst: KEIN Verdict nötig — Commits entscheiden über Fortschritt, Review prüft neu.

          ZEITLIMIT: Soft-Deadline = SOFT_DEADLINE. Vor jedem Schritt: [ $(date +%s) -ge SOFT_DEADLINE ]. Bei OVER: aktuellen Stand committen+pushen, Turn beenden.

          Stop-Guard: Ein Workflow-Step zählt die PR-Commits und stoppt bei > 10.
          CLAUDE_EOF

          sed -i "s/#PR_NR/${{ github.event.pull_request.number }}/g" /tmp/claude-prompt.txt
          sed -i "s/SOFT_DEADLINE/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/claude-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Memory-Upload (Artefakt für workflow_run-Persistierung)
        # Issue-/Label-Trigger bekommen seit der GitHub-Richtlinie 2026-06-26 nur lese-only
        # Cache-Token → ein direkter Save wäre ein No-Op ("token has no writable scopes"). Phasen
        # laden via Restore (read-only OK) und übergeben das Memory als Artefakt an den vertrauens-
        # würdigen workflow_run-Begleitworkflow (claude-memory-save.yml), der den Schreibzugriff hat.
        # Artefakt-Name = Cache-Key = claude-memory-issue-{N} (steps.setup.outputs.memory-save-key).
        if: always() && steps.setup.outputs.configured == 'true' && steps.claude.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.setup.outputs.memory-save-key }}
          path: ${{ steps.setup.outputs.memory-path }}
          retention-days: 1
          if-no-files-found: ignore

      - name: Label-Post-Assertion (Labels via App-Token force-setzen)
        id: label-post
        # B1: Label-Transition auch bei Claude failure/cancelled — sonst bleibt der PR bei einem
        # Crash/Timeout dauerhaft auf ai:needs-changes kleben (kein Re-Arm, keine Eskalation).
        # Analog 04-claude-pr-review.yml (dort success|failure; hier zusaetzlich cancelled wg.
        # timeout-minutes-Backstop). Skip-Reasons (stop-guard/supersede) liefern outcome=skipped
        # und fallen hier korrekt raus.
        if: always() && steps.setup.outputs.configured == 'true' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure' || steps.claude.outcome == 'cancelled')
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          verdict=""
          if [ -f /tmp/claude-output.log ]; then
            verdict="$(grep 'VERDICT:' /tmp/claude-output.log | tail -1 | sed -E 's/^.*VERDICT:[[:space:]]*//' | tr -d -c 'A-Za-z0-9-' || true)"
          fi
          echo "Claude-Verdict aus Output: '${verdict:-keins}'"

          # Fortschritt = hat HEAD sich in DIESEM Lauf bewegt? Robust gg. amend/reset/force-push
          # (jede HEAD-Bewegung = Arbeit; keine Bewegung = nichts getan) und self-contained
          # (lokales Repo, keine API-/Marker-Abhaengigkeit). Das alte REVIEW_TS-Konstrukt fiel
          # bei fehlendem Review-Marker auf Total-Commits zurueck und meldete Fortschritt, wo
          # keiner war -> Review<->Fixup-Endlosloop (PR #524).
          sha_before="${{ steps.head-before.outputs.sha }}"
          sha_after="$(git rev-parse HEAD)"
          echo "HEAD vor Claude: ${sha_before:-?} | nach Claude: ${sha_after:-?}"
          ARTIFACTS_OK="false"
          if [ -n "$sha_before" ] && [ "$sha_after" != "$sha_before" ]; then
            ARTIFACTS_OK="true"
          fi

          gh label create "ai:needs-review" --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true
          gh label create "ai:needs-changes" --repo "$GITHUB_REPOSITORY" --color D93F0B 2>/dev/null || true
          gh label create "ai:needs-human" --repo "$GITHUB_REPOSITORY" --color 5319e7 --description "Nicht-automatisierbare Entscheidung — wartet auf Mensch (Fixup greift bewusst nicht)" 2>/dev/null || true

          # Trigger-Labels immer erst entfernen (Force-Set-Semantik).
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai:needs-changes 2>/dev/null || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai:needs-review 2>/dev/null || true

          # B1: Claude abgestuerzt/abgebrochen (failure/cancelled) — kein vertrauenswuerdiges
          # Verdict, HEAD-Fortschritt nicht aussagekraeftig (evtl. mittendrin abgebrochen).
          # Terminal ai:needs-human + Kommentar, KEINE Re-Armierung: ein wiederholt abstuerzender
          # Claude wuerde sonst eine Re-Arm-Schleife erzeugen. Review macht analog den Safe-Default.
          if [ "$OUTCOME" != "success" ]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ai:needs-human
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "🛑 **Fixup #${PR}: Claude-Schritt \`${OUTCOME}\`** — kein Verdict, HEAD-Fortschritt nach Absturz/Abbruch nicht vertrauenswuerdig. ai:needs-human gesetzt — bitte manuell pruefen (war es ein transienter API-Fehler, \`ai:needs-changes\` neu setzen und erneut fixupen lassen)." 2>/dev/null || true
            echo "::warning::Claude-Schritt '${OUTCOME}' -> ai:needs-human (keine Re-Armierung, Mensch prueft)."
            echo "stuck=true" >> "$GITHUB_OUTPUT"
            echo "stuck_reason=crash" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # B2: Verdict ist beratend — EINZIG `needs-human` ist verbindlich (terminal). Fortschritt
          # entscheidet der Workflow ausschliesslich ueber HEAD-Bewegung (Commits = Ground Truth),
          # niemals ueber ein `fixup-complete`-Verdict. Vgl. Prompt-Vertrag (VERDICT-Abschnitt).
          if [ "$verdict" = "needs-human" ]; then
            # Claude hat erkannt: verbleibende Findings sind Entscheidungs-Findings, die ein Mensch
            # treffen muss (kein automatisierbarer Fix). Terminal an Mensch — kein Re-Arm, kein Loop.
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ai:needs-human
            echo "::notice::Verdict needs-human -> Label gesetzt: ai:needs-human (wartet auf Mensch)."
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⏸️ **Wartet auf menschliche Entscheidung** — verbleibende Findings sind nicht automatisierbar (Architektur-/Produkt-/Designentscheidung, siehe Review-Threads). Der Fixup kann hier nicht weiterhelfen. Nach der Entscheidung: Label \`ai:needs-human\` entfernen und via \`ai:needs-review\` neu triggern." 2>/dev/null || true
            echo "stuck=true" >> "$GITHUB_OUTPUT"
            echo "stuck_reason=needs-human" >> "$GITHUB_OUTPUT"
          elif [ "$ARTIFACTS_OK" = "true" ]; then
            # Fortschritt -> an Review uebergeben. Konvergiert via Stop-Guard (>10 Commits),
            # falls Review nie gruen wird.
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ai:needs-review
            echo "::notice::Fortschritt erkannt (HEAD bewegt) -> Label gesetzt: ai:needs-review"
            echo "stuck=false" >> "$GITHUB_OUTPUT"
          else
            # KEIN Fortschritt und kein klares needs-human-Verdict -> NICHT erneut triggern (kappt
            # sowohl Fixup<->Fixup- als auch Review<->Fixup-Endlosloop). Terminal an Mensch via
            # ai:needs-human (vermutlich doch ein nicht-automatisierbarer Blocker) + Kommentar.
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ai:needs-human
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "🛑 **Fixup #${PR} ohne Fortschritt** — kein neuer Commit in diesem Lauf (HEAD unverändert). Vermutlich ein nicht-automatisierbares Finding. ai:needs-human gesetzt — bitte manuell prüfen (ggf. entscheiden und \`ai:needs-review\` neu setzen)." 2>/dev/null || true
            echo "::warning::Kein Fixup-Fortschritt (HEAD unverändert) -> ai:needs-human, keine Re-Armierung, Mensch prüft."
            echo "stuck=true" >> "$GITHUB_OUTPUT"
            echo "stuck_reason=no-progress" >> "$GITHUB_OUTPUT"
          fi

      - name: Ergebnis zusammenfassen
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          SKIP_SUPERSEDE: ${{ steps.supersede-check.outputs.skip }}
          STOP_GUARD: ${{ steps.stop-guard.outputs.stop }}
          STUCK: ${{ steps.label-post.outputs.stuck }}
          STUCK_REASON: ${{ steps.label-post.outputs.stuck_reason }}
        run: |
          labels="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          # Je ein eigener Arm pro Guard: ohne sie faellt der gewollte Abbruch auf den
          # Fehler-Arm (OUTCOME ist leer, weil der claude-Step nie lief) und meldet ❌.
          # Der Stop-Guard ist ein GEWOLLTER Abbruch (Loop-Schutz, > 10 Commits) — er hat
          # bereits selbst kommentiert; hier gehoert eine Warnung hin, kein Fehler.
          # Dasselbe gilt fuer den No-Progress-Fall (STUCK): Claude lief, aber ohne Commit ->
          # bewusst keine Re-Armierung, Mensch prüft.
          if [ "${SKIP_SUPERSEDE:-false}" = "true" ]; then
            echo "::notice title=⏭️ Fixup übersprungen::PR #${PR} — Lauf bereits aktiv"
          elif [ "${STOP_GUARD:-false}" = "true" ]; then
            echo "::warning title=🛑 Fixup gestoppt::PR #${PR} — Stop-Guard (Loop-Schutz), bitte manuell prüfen"
          elif [ "${STUCK:-false}" = "true" ]; then
            # STUCK=true kommt von drei Pfaden (stuck_reason): Claude-Crash (OUTCOME!=success),
            # needs-human-Verdict ODER echtem No-Progress. Jeder braucht seine eigene Wahrheit:
            # beim Crash ist der HEAD-Fortschritt nicht vertrauenswuerdig, bei needs-human wartet
            # der PR auf eine menschliche Entscheidung (Claude kann trotzdem Commits gemacht
            # haben — "kein neuer Commit" waere hier falsch), bei No-Progress gab es wirklich keinen.
            case "${STUCK_REASON:-no-progress}" in
              crash)
                echo "::warning title=🛑 Fixup abgestürzt/abgebrochen::PR #${PR} — Claude-Schritt \`${OUTCOME:-unbekannt}\`, HEAD-Fortschritt nicht vertrauenswürdig, keine Re-Armierung, bitte manuell prüfen"
                ;;
              needs-human)
                echo "::notice title=⏸️ Fixup wartet auf Entscheidung::PR #${PR} — verbleibende Findings nicht automatisierbar (ai:needs-human gesetzt), bitte manuell prüfen"
                ;;
              *)
                echo "::warning title=🛑 Fixup ohne Fortschritt::PR #${PR} — kein neuer Commit, keine Re-Armierung, bitte manuell prüfen"
                ;;
            esac
          elif [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Fixup erfolgreich::PR #${PR}"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Fixup abgebrochen"
          else
            echo "::error title=❌ Fixup fehlgeschlagen"
          fi
          {
            echo "### Fixup #${PR}"
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Labels: ${labels:-keine}"
          } >> "$GITHUB_STEP_SUMMARY"
