name: Weekly Arc42 Documentation

on:
  schedule:
    # Mondays at 09:00 UTC (11:00 CEST)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task type'
        required: true
        type: choice
        options:
          - review
          - lint
          - full
        default: review

jobs:
  arc42:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.8.1'

      - name: Setup pnpm
        run: corepack enable pnpm && pnpm install

      - name: Arc42 Documentation
        run: |
          pnpm ai run /arc42-weekly \
            --prompt "Weekly arc42 maintenance: ${{ github.event.inputs.task || 'review' }}" \
            --output docs/arc42-report.md

      - name: Create PR if changes
        if: steps.changes.outputs.any_changed == 'true'
        run: |
          gh pr create \
            --title "docs: Weekly arc42 update $(date +%Y-%m-%d)" \
            --body "Weekly arc42 documentation maintenance generated by /arc42-weekly skill." \
            --base main \
            --head "arc42/update-$(date +%Y%m%d)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Report
        run: |
          echo "### Arc42 Weekly Report" >> $GITHUB_STEP_SUMMARY
          echo "- Task: ${{ github.event.inputs.task || 'review' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered: $(date)" >> $GITHUB_STEP_SUMMARY
          cat docs/arc42-report.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No report generated." >> $GITHUB_STEP_SUMMARY
