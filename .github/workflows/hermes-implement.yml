name: Hermes Implement (ai:ready)

# Setzt ein Issue um, sobald es das Label "ai:ready" erhält UND bereits
# "ai:analyzed" trägt.
# Setzt Hermes **oder Claude Code** — wählbar per `vars.AGENT` (default: hermes).

on:
  issues:
    types: [labeled]

concurrency:
  group: hermes-implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      ${{ github.event.label.name == 'ai:ready'
          && contains(github.event.issue.labels.*.name, 'ai:analyzed')
          && github.event.issue.state == 'open' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      HERMES_HOME: /tmp/hermes-ci
    permissions:
      contents: read
      id-token: write
      actions: write
      pull-requests: write
      issues: write
    steps:
      - name: Startzeit merken (für weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 840))" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Hermes/Claude Code
        id: setup
        uses: ./.github/actions/setup-hermes
        with:
          agent: ${{ vars.AGENT }}
          needs-mcp: true
          event-type: ${{ github.event_name }}
          ticket-ref: ${{ github.event.issue.number }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          claude-model: ${{ vars.LLM_PROVIDER == 'openrouter' && 'anthropic/claude-sonnet-4' || 'glm-5.1' }}
          nous-portal-token: ${{ secrets.NOUS_PORTAL_TOKEN }}
          deepseek-model: deepseek/deepseek-v4-flash

      - name: Issue einem Menschen zuweisen (Best-Effort)
        if: steps.setup.outputs.configured == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
          ASSIGNEE: ${{ github.event.sender.type == 'User' && github.event.sender.login || (github.event.issue.user.type == 'User' && github.event.issue.user.login || '') }}
        run: |
          if [ -z "$ASSIGNEE" ]; then
            echo "::notice::Kein menschlicher Assignee ermittelbar."
            exit 0
          fi
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-assignee "$ASSIGNEE"

      - name: Doppel-Run-Guard (ready-PR existiert bereits)
        id: doppel-guard
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if ! existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,isDraft,closingIssuesReferences \
            --jq "[.[] | select(.isDraft == false) | select((.closingIssuesReferences // []) | any(.number == ${ISSUE}))] | length" 2>/dev/null)"; then
            echo "::warning::Doppel-Run-Guard: gh-API nicht erreichbar — fail-open."
            existing=0
          fi
          if [ "${existing:-0}" -gt 0 ]; then
            echo "::notice::Umsetzung übersprungen — ready-PR existiert bereits für Issue #$ISSUE."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: pnpm einrichten
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Node.js einrichten
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Abhängigkeiten installieren
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Git-Hooks installieren (lefthook)
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm exec lefthook install

      - name: Fortsetzungs-Stand prüfen (ai:continued)
        id: continued-before
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          already="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "ai:continued")' 2>/dev/null || echo false)"
          echo "already=${already:-false}" >> "$GITHUB_OUTPUT"

      - name: Umsetzung via Hermes
        id: hermes
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          cat > /tmp/hermes-prompt.txt << 'HERMES_EOF'
          Das Label `ai:ready` wurde an Issue #ISSUE_NR gesetzt — setze dieses Issue jetzt um.

          Folge dem Umsetzungs-Workflow .ai-knowledge/ticket-implementation.md, aber NUR Schritte 1 bis 4:
            1. Zuweisung übernimmt bereits der Workflow (nicht selbst zuweisen).
            2. Beginne SOFORT mit der Arbeit — keine Wartezeit!
            3. Analyse lesen & schnell verifizieren (keine vollständige Re-Triage!): Akzeptanzkriterien aus dem Body-Block übernehmen, nur prüfen ob die genannten Dateien noch existieren. Kippt die Ampel auf 🔴 → NICHT umsetzen, ai:ready entfernen, begründet kommentieren und stoppen.
            4. Spec-Modus (Regelfall): den vorhandenen DRAFT-PR auschecken (gh pr list --state open --draft --json number,headRefName,closingIssuesReferences, den mit Issue #ISSUE_NR; dann git fetch origin && git switch <headRefName>). Dessen ROTE Tests GRÜN machen — Tests NICHT ändern (Gewaltenteilung). OBOSLETER TEST: Steht ein bestehender (Spec- oder Alt-)Test nachweislich im Widerspruch zum geklärten Soll (Anforderung geändert)? → NICHT still ändern/löschen, sondern im PR-Body einen Abschnitt „Test-Pflege-Bedarf" mit Datei:Zeile + Begründung anlegen und weitermachen — die Anpassung/Entfernung entscheidet der Mensch bzw. ein Folge-Spec. Fallback (kein Draft-PR): eigenen Branch + Tests selbst schreiben. In beiden Fällen: Code bis pnpm test grün, dann pnpm format + pnpm lint + pnpm knip.
            5. Committen, Branch pushen. Im Spec-Modus Draft-PR review-bereit machen (gh pr ready <nr>), Beschreibung ergänzen. GIB VERDICT AUS — KEINE LABELS SELBST SETZEN!

          ⚠️ LABELS: Du darfst KEINE Labels setzen oder entfernen! Der Workflow übernimmt das automatisch.

          VERDICT-MARKER: Gib GANZ AM ENDE deiner letzten Antwort GENAU EINE Zeile aus:
            - `VERDICT: needs-review` (Implementierung fertig + PR review-bereit)
            - `VERDICT: not-ready` (Partial — PR als Draft belassen, Folgelauf nötig)

          ZEITLIMIT: Deine Soft-Deadline ist SOFT_DEADLINE (Unix-Epoch). Prüfe `[ $(date +%s) -ge SOFT_DEADLINE ]` vor jedem größeren Schritt. Bei OVER: aktuellen Stand committen+pushen, Turn sofort beenden.

          Idempotenz: Draft-PR mit Closes #ISSUE_NR ist normaler Spec-Eingang — aufgreifen. Nicht-Draft-PR = Umsetzung schon gelaufen → Lauf beenden.

          WERKZEUGE: Bash (gh, git, pnpm), Datei-Tools sowie KoliBri-MCP-Tools (mcp_kolibri_search, mcp_kolibri_fetch für KoliBri-Komponenten). GH_TOKEN für gh-Befehle.
          Keine interaktive Bestätigung — Label ai:ready autorisiert.
          HERMES_EOF

          sed -i "s/#ISSUE_NR/${{ github.event.issue.number }}/g" /tmp/hermes-prompt.txt
          sed -i "s/SOFT_DEADLINE/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/hermes-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/hermes-prompt.txt)" \
            ${{ steps.setup.outputs.resume-flag }} \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/hermes-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Save Session
        if: always() && steps.setup.outputs.configured == 'true'
        uses: ./.github/actions/save-session
        with:
          session-artifact-name: ${{ steps.setup.outputs.session-artifact-name }}
          configured: ${{ steps.setup.outputs.configured }}

      - name: Label-Post-Assertion (VERDICT parsen, Labels via App-Token force-setzen)
        if: always() && steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true' && (steps.hermes.outcome == 'success' || steps.hermes.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
          ALREADY_CONTINUED: ${{ steps.continued-before.outputs.already }}
        run: |
          verdict=""
          if [ -f /tmp/hermes-output.log ]; then
            verdict="$(grep -oP 'VERDICT:\s*\K.*' /tmp/hermes-output.log | tail -1 | tr -d '[:space:]' || true)"
          fi
          echo "Hermes-Verdict aus Output: '${verdict:-keins}'"

          PR_NR="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,isDraft,closingIssuesReferences \
            --jq "[.[] | select((.closingIssuesReferences // []) | any(.number == ${ISSUE})) | .number] | first" 2>/dev/null || echo "")"
          ARTIFACTS_OK="false"
          if [ -n "$PR_NR" ] && [ "$PR_NR" != "null" ]; then
            PR_DRAFT="$(gh pr view "$PR_NR" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo "true")"
            PR_COMMITS="$(gh pr view "$PR_NR" --repo "$GITHUB_REPOSITORY" --json commits --jq '.commits | length' 2>/dev/null || echo "0")"
            if [ "$PR_DRAFT" != "true" ] && [ "${PR_COMMITS:-0}" -gt 0 ]; then
              ARTIFACTS_OK="true"
            fi
          fi

          if [ "$verdict" = "needs-review" ]; then
            if [ "$ARTIFACTS_OK" != "true" ]; then
              echo "::error title=❌ PR fehlt::VERDICT needs-review, aber kein fertiger PR gefunden."
              exit 1
            fi
            final="needs-review"
          elif [ "$verdict" = "not-ready" ]; then
            if [ "$ARTIFACTS_OK" = "true" ]; then
              final="needs-review"
            else
              final="not-ready"
            fi
          else
            if [ "$ARTIFACTS_OK" = "true" ]; then
              final="needs-review"
            else
              final="not-ready"
            fi
          fi

          gh label create "ai:needs-review" --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true

          if [ "$final" = "needs-review" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:ready" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:continued" 2>/dev/null || true
            gh pr edit "$PR_NR" --repo "$GITHUB_REPOSITORY" --remove-label "ai:needs-review" 2>/dev/null || true
            gh pr edit "$PR_NR" --repo "$GITHUB_REPOSITORY" --add-label "ai:needs-review"
            echo "::notice::Labels gesetzt: ai:needs-review an PR #${PR_NR}"

          else
            if [ "${ALREADY_CONTINUED:-false}" = "true" ]; then
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:ready" 2>/dev/null || true
              gh label create "ai:to-big-issue" --repo "$GITHUB_REPOSITORY" --color B60205 2>/dev/null || true
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue" 2>/dev/null || true
              echo "::warning::Obergrenze erreicht (2. Soft-Abort) — ai:to-big-issue gesetzt"
            else
              gh label create "ai:continued" --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:continued"
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:ready" 2>/dev/null || true
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:ready"
              echo "::notice::Soft-Abort — ai:continued gesetzt, ai:ready retriggert"
            fi
          fi

      - name: Ergebnis zusammenfassen
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.hermes.outcome }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Umsetzung erfolgreich::Issue #${ISSUE}"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Umsetzung abgebrochen"
          else
            echo "::error title=❌ Umsetzung fehlgeschlagen"
          fi
          {
            echo "### Umsetzung #${ISSUE} — fertig"
            echo "- Hermes-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Labels: ${labels:-keine}"
          } >> "$GITHUB_STEP_SUMMARY"
