name: Claude Implement (ai:ready)

# Setzt ein Issue um, sobald es das Label "ai:ready" erhaelt UND bereits "ai:analyzed" traegt
# (Label-Kette aus AGENTS.md: analysiert -> freigegeben -> Umsetzung als PR).
# Fuehrt die Schritte 1-4 aus .ai-knowledge/ticket-implementation.md aus (zuweisen, Analyse
# re-verifizieren, umsetzen, PR mit "Closes #" erstellen). Der erstellte PR erhaelt das Label
# "ai:needs-review", woraufhin der Kreuzverhoer-Review (claude-pr-review.yml) ihn aufgreift.
#
# Claude Code laeuft direkt im Runner (anthropics/claude-code-action). HARTES Zeitlimit:
# timeout-minutes: 20 — laeuft die Umsetzung laenger, bricht GitHub den Job ab. Der Prompt
# weist Claude an, rechtzeitig (~18 Min) den Zwischenstand zu sichern, damit beim harten
# Abbruch nicht alles verloren geht.
#
# Nutzt fuer GitHub-Operationen ein kurzlebiges GitHub-App-Token, damit der erstellte PR den
# Review-Workflow ausloest (mit dem Standard-GITHUB_TOKEN wuerde er das nicht -> Schleifenschutz).
# Voraussetzungen (Repo-Secrets): CLAUDE_CODE_OAUTH_TOKEN sowie eine GitHub App, hinterlegt als
# APP_ID + APP_PRIVATE_KEY (App-Permissions: Contents/Issues/Pull requests = Read and write).
# ACHTUNG: Wird die App-Permission nachtraeglich geaendert, muss die Aenderung in der Repo-
# Installation BESTAETIGT (Re-Approve) werden — sonst behaelt das Token die alten Rechte. Fehlt
# "Contents: write", bricht der Schritt "Schreibrechte des App-Tokens sicherstellen" frueh ab.

on:
  issues:
    types: [labeled]

concurrency:
  group: claude-implement-${{ github.event.issue.number }}
  cancel-in-progress: false # eine laufende Umsetzung nicht mittendrin abbrechen

jobs:
  implement:
    # Nur wenn GENAU das Label "ai:ready" neu gesetzt wurde, das Issue zusaetzlich "ai:analyzed"
    # traegt und offen ist.
    if: >-
      ${{ github.event.label.name == 'ai:ready'
          && contains(github.event.issue.labels.*.name, 'ai:analyzed')
          && github.event.issue.state == 'open' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20 # hartes Limit: laeuft die Umsetzung laenger, bricht GitHub den Job ab
    permissions:
      contents: read # Checkout (Schreibzugriff laeuft ueber das App-Token)
      id-token: write # OIDC-Token der Action (sonst fehlt ACTIONS_ID_TOKEN_REQUEST_URL)
    steps:
      - name: Voraussetzung pruefen (GitHub-App-Secrets)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::GitHub-App-Secrets fehlen (APP_ID und/oder APP_PRIVATE_KEY) — Lauf wird uebersprungen (kein Fehler). GitHub App anlegen (Contents/Issues/Pull requests = Read and write), aufs Repo installieren und beide Werte als Repo-Secrets hinterlegen, damit die Pipeline laeuft."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Fail-fast: Das App-Token traegt NUR die Permissions, die der App-INSTALLATION zugestanden
      # UND bestaetigt wurden (eine Permission-Aenderung an der App muss in der Repo-Installation
      # erneut genehmigt werden). Fehlt "Contents: write", scheitert spaeter `git push` mit 403 —
      # der teure Claude-Lauf laeuft dann sinnlos durch und der Job endet faelschlich "gruen", OHNE
      # PR. Darum hier hart und frueh abbrechen, BEVOR Claude (kostenpflichtig) startet.
      - name: Schreibrechte des App-Tokens sicherstellen
        id: token-perms
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if perms="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.push' 2>/dev/null)"; then
            if [ "$perms" = "true" ]; then
              echo "App-Token hat Schreibrecht (contents.push=true) — weiter."
              exit 0
            fi
          else
            echo "::warning::Konnte die Token-Permissions nicht abfragen (API-Fehler) — fahre fort und ueberlasse die Diagnose dem spaeteren Push."
            exit 0
          fi
          echo "::error title=App-Token ohne Schreibrecht::Der GitHub-App-Installation fehlt 'Contents: Read and write' (contents.push=false). Branch-Push und PR-Erstellung sind unmoeglich — Lauf wird abgebrochen, bevor Claude (kostenpflichtig) startet."
          marker="<!-- claude-implement:no-write-permission -->"
          exists="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json comments --jq "[.comments[] | select(.body | contains(\"$marker\"))] | length" 2>/dev/null || echo 0)"
          if [ "${exists:-0}" = "0" ]; then
            body="$(printf '%s\n' \
              "$marker" \
              "🤖 **Umsetzung übersprungen — der GitHub-App fehlen Schreibrechte**" \
              "" \
              "Das App-Token dieses Laufs hat **kein \`Contents: write\`** (\`repos.permissions.push = false\`). Damit sind **Branch-Push und PR-Erstellung unmöglich** — der Lauf bricht **sofort** ab, statt einen kostenpflichtigen Claude-Lauf ohne Ergebnis zu fahren (vorher endete der Job irreführend \"grün\", ohne PR)." \
              "" \
              "**Fix (einmalig, durch Admin):**" \
              "1. GitHub App \`my-github-action-bot\` → *Permissions* → **Contents = Read and write** und **Pull requests = Read and write** setzen (Issues = Read and write ist bereits aktiv)." \
              "2. **Wichtig:** Die geänderten Permissions in der **Repo-Installation bestätigen/genehmigen** (Re-Approve) — sonst behält das Token die alten (nur-lese) Rechte." \
              "3. Danach \`ai:ready\` an diesem Issue **erneut setzen**. Idempotenz greift: solange kein offener PR mit \`Closes #${ISSUE}\` existiert, wird neu umgesetzt." )"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$body" || true
          fi
          exit 1

      - name: Issue einem Menschen zuweisen (Best-Effort)
        # Best-Effort: an den auslösenden Menschen, sonst den Issue-Autor. Im 🟢-Automatikpfad
        # setzt die Triage ai:ready als App-Bot — dann ist sender ein Bot (nicht als Assignee
        # zulaessig). Daher Bot-Logins herausfiltern; sind beide Bots, bleibt das Issue
        # unzugewiesen (sauberer ::notice:: statt stillem Fehlschlag). NIE @me (waere der Bot).
        if: steps.preflight.outputs.configured == 'true'
        continue-on-error: true # nice-to-have; darf die Umsetzung nicht blockieren
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          ASSIGNEE: ${{ github.event.sender.type == 'User' && github.event.sender.login || (github.event.issue.user.type == 'User' && github.event.issue.user.login || '') }}
        run: |
          if [ -z "$ASSIGNEE" ]; then
            echo "::notice::Kein menschlicher Assignee ermittelbar (Ausloeser und Issue-Autor sind Bots) — Issue bleibt unzugewiesen."
            exit 0
          fi
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-assignee "$ASSIGNEE"

      - name: Checkout
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # voller Verlauf: der Umsetzungs-Flow arbeitet mit Branches
          token: ${{ steps.app-token.outputs.token }} # Push als App-Token -> loest Folge-Workflows aus

      - name: Umsetzung via Claude Code
        id: claude
        if: steps.preflight.outputs.configured == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }} # gh nutzt das App-Token -> erstellter PR loest Review aus
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          prompt: |
            Das Label `ai:ready` wurde an Issue #${{ github.event.issue.number }} gesetzt —
            setze dieses Issue jetzt um.

            Folge dem Umsetzungs-Workflow .ai-knowledge/ticket-implementation.md (entspricht
            `/implement-ticket ${{ github.event.issue.number }}`), aber NUR die Schritte 1 bis 4:
              1. Zuweisung übernimmt bereits der Workflow (Best-Effort: an den auslösenden
                 Menschen, sonst den Issue-Autor). Weise dich NICHT selbst zu — `@me` wäre der Bot.
              2. Analyse re-verifizieren (Re-Triage gegen den aktuellen Repo-Stand). Kippt die
                 Umsetzbarkeits-Ampel auf 🔴 → NICHT umsetzen, `ai:ready` entfernen, im Issue
                 begründen und stoppen (Mensch entscheidet).
              3. Auf eigenem Branch umsetzen (Projekt-Konventionen, danach `pnpm format` + Lint).
              4. Committen, Branch pushen, PR ERSTELLEN (ready to review, KEIN Draft) mit
                 `Closes #${{ github.event.issue.number }}` im Body und format-/lint-Ergebnissen.
                 Dann das Label `ai:needs-review` am PR setzen (`gh pr edit <pr-nr> --add-label
                 ai:needs-review`; Label bei Bedarf vorher `gh label create "ai:needs-review"
                 --color 1D76DB`), damit der Kreuzverhör-Review (claude-pr-review.yml) ihn aufgreift.

            HARTES Zeitlimit: Dieser Lauf wird nach 20 Minuten von GitHub hart abgebrochen. Plane
            damit. Merkst du, dass es eng wird, sichere SPÄTESTENS nach ~18 Minuten den
            Zwischenstand, statt einen kompletten Durchlauf zu erzwingen: committen, Branch pushen
            und lieber einen Draft-PR mit `Closes #${{ github.event.issue.number }}` und einer
            kurzen Restpunkte-Liste erstellen (Label `ai:needs-review` dann NICHT setzen, solange
            unfertig). Ein PR mit dokumentiertem Teilstand ist deutlich besser als ein harter
            Abbruch ohne jedes Ergebnis.

            Idempotenz: Ist das Issue bereits dir zugewiesen oder existiert bereits ein offener
            PR mit `Closes #${{ github.event.issue.number }}`, NICHT erneut umsetzen — Lauf beenden.

            Schritt 5 (PR-Abo + Kreuzverhör-Loop) NICHT ausführen — der Review läuft als eigener
            Workflow. `subscribe_pr_activity` ist hier nicht verfügbar.

            Bearbeite ausschließlich dieses eine Issue. Die Freigabe gilt durch das Label
            `ai:ready` als erteilt: arbeite autonom, ohne auf eine interaktive Bestätigung zu warten.
          claude_args: >-
            --model claude-opus-4-8 --effort medium
            --allowedTools "Bash(gh issue:*),Bash(gh pr:*),Bash(gh label:*),Bash(gh api:*),Bash(git switch:*),Bash(git checkout:*),Bash(git branch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(git fetch:*),Bash(pnpm:*),Read,Edit,Write,Grep,Glob,Skill,Task"
            --append-system-prompt "Automatisierter, durch das Label ai:ready autorisierter Umsetzungs-Lauf in GitHub Actions (headless). Bearbeite ausschliesslich Issue #${{ github.event.issue.number }}, Schritte 1-4 der Umsetzung; KEIN PR-Abo/Kreuzverhoer-Loop (separater Workflow). HARTES 20-Minuten-Timeout: sichere bei drohendem Limit (~18 Min) rechtzeitig den Zwischenstand (committen/pushen, ggf. Draft-PR), statt einen vollen Durchlauf zu erzwingen. Bestaetigung gilt durch ai:ready als erteilt; arbeite autonom ohne interaktive Rueckfrage."

      # Deterministisches Abschluss-Signal (unabhaengig von der LLM-Ausgabe): laeuft auch bei
      # Abbruch/Timeout (if: always()) und macht im Log/Job-Summary klar sichtbar, DASS und mit
      # welchem Ergebnis der Lauf fertig ist. outcome=cancelled signalisiert das 20-Min-Timeout.
      - name: Ergebnis zusammenfassen
        if: always() && steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          {
            echo "### Umsetzung #${ISSUE} — fertig"
            echo ""
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\` (cancelled = 20-Min-Timeout erreicht)"
            echo "- Aktuelle Issue-Labels: ${labels:-keine}"
            if [ -n "$SESSION_ID" ]; then echo "- Session-ID: \`${SESSION_ID}\` (\`--resume\` zum Nachschauen)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Umsetzung #${ISSUE} fertig::Claude-Schritt ${OUTCOME:-unbekannt}; Labels: ${labels:-keine}"
