name: Claude Implement (ai:ready)

# Setzt ein Issue um, sobald es das Label "ai:ready" erhaelt UND bereits "ai:analyzed" traegt
# (Label-Kette aus AGENTS.md: analysiert -> freigegeben -> Umsetzung als PR).
# Fuehrt die Schritte 1-4 aus .ai-knowledge/ticket-implementation.md aus (zuweisen, Analyse
# re-verifizieren, umsetzen — im Regelfall den Draft-PR der Spec-Stufe (claude-spec.yml) gruen
# machen, sonst neu erstellen). Der PR erhaelt das Label
# "ai:needs-review" von DIESEM Workflow SELBST, als expliziten letzten Schritt (M9-Revidiert,
# 2026-07-08): `pr-needs-review-label.yml` reagiert bewusst NICHT auf bot-erzeugte Draft->ready-
# Uebergaenge (nur auf menschliche Aktoren, s. dort) — so entscheidet diese Umsetzung selbst,
# wann genau der Kreuzverhoer-Review (claude-pr-review.yml) startet (erst wenn Beschreibung +
# Testergebnisse wirklich vollstaendig sind), statt dass ein fruehes ready_for_review-Event das
# Review auf einem noch unfertigen PR anstoesst.
#
# Claude Code laeuft direkt im Runner (anthropics/claude-code-action). HARTES Zeitlimit:
# timeout-minutes: 20 — laeuft die Umsetzung laenger, bricht GitHub den Job ab. Der Prompt
# weist Claude an, rechtzeitig (~18 Min) den Zwischenstand zu sichern, damit beim harten
# Abbruch nicht alles verloren geht.
#
# Nutzt fuer GitHub-Operationen ein kurzlebiges GitHub-App-Token, damit der erstellte PR den
# Review-Workflow ausloest (mit dem Standard-GITHUB_TOKEN wuerde er das nicht -> Schleifenschutz).
# Voraussetzungen (Repo-Secrets): CLAUDE_CODE_OAUTH_TOKEN sowie eine GitHub App, hinterlegt als
# APP_ID + APP_PRIVATE_KEY (App-Permissions: Contents/Issues/Pull requests = Read and write).

on:
  issues:
    types: [labeled]

concurrency:
  group: claude-implement-${{ github.event.issue.number }}
  cancel-in-progress: false # eine laufende Umsetzung nicht mittendrin abbrechen

jobs:
  implement:
    # Nur wenn GENAU das Label "ai:ready" neu gesetzt wurde, das Issue zusaetzlich "ai:analyzed"
    # traegt und offen ist.
    if: >-
      ${{ github.event.label.name == 'ai:ready'
          && contains(github.event.issue.labels.*.name, 'ai:analyzed')
          && github.event.issue.state == 'open' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20 # hartes Limit: laeuft die Umsetzung laenger, bricht GitHub den Job ab
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      BASH_MAX_OUTPUT_LENGTH: '20000'
      CLAUDE_HIDE_BANNER: '1'
    permissions:
      contents: read # Checkout (Schreibzugriff laeuft ueber das App-Token)
      id-token: write # OIDC-Token der Action (sonst fehlt ACTIONS_ID_TOKEN_REQUEST_URL)
      actions: write # `gh cache delete` + actions/cache im Session-Archiv-Schritt (Soft-Abort, 2026-07-08)
    steps:
      # Startzeit fuer die Timeout-Erkennung: nur ein nahezu vollstaendig ausgeschoepfter Lauf
      # (>= 18 Min) gilt als Timeout (-> ai:to-big-issue). Ein frueher Abbruch (z. B. manueller
      # Cancel) erzeugt zwar ebenfalls outcome=cancelled, liegt aber deutlich unter der Schwelle.
      # soft_deadline_epoch (Soft-Abort, 2026-07-08): jetzt + 840s (14 Min, 6 Min Puffer bis zum
      # harten Kill) -- wird unten als literale Zahl in den Prompt gerendert.
      - name: Startzeit merken (fuer Timeout-Erkennung + weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 840))" >> "$GITHUB_OUTPUT"

      - name: Voraussetzung pruefen (GitHub-App-Secrets)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::GitHub-App-Secrets fehlen (APP_ID und/oder APP_PRIVATE_KEY) — Lauf wird uebersprungen (kein Fehler). GitHub App anlegen (Contents/Issues/Pull requests = Read and write), aufs Repo installieren und beide Werte als Repo-Secrets hinterlegen, damit die Pipeline laeuft."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Issue einem Menschen zuweisen (Best-Effort)
        # Best-Effort: an den auslösenden Menschen, sonst den Issue-Autor. Im 🟢-Automatikpfad
        # setzt die Triage ai:ready als App-Bot — dann ist sender ein Bot (nicht als Assignee
        # zulaessig). Daher Bot-Logins herausfiltern; sind beide Bots, bleibt das Issue
        # unzugewiesen (sauberer ::notice:: statt stillem Fehlschlag). NIE @me (waere der Bot).
        if: steps.preflight.outputs.configured == 'true'
        continue-on-error: true # nice-to-have; darf die Umsetzung nicht blockieren
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          ASSIGNEE: ${{ github.event.sender.type == 'User' && github.event.sender.login || (github.event.issue.user.type == 'User' && github.event.issue.user.login || '') }}
        run: |
          if [ -z "$ASSIGNEE" ]; then
            echo "::notice::Kein menschlicher Assignee ermittelbar (Ausloeser und Issue-Autor sind Bots) — Issue bleibt unzugewiesen."
            exit 0
          fi
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-assignee "$ASSIGNEE"

      - name: Checkout
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # voller Verlauf: der Umsetzungs-Flow arbeitet mit Branches
          token: ${{ steps.app-token.outputs.token }} # Push als App-Token -> loest Folge-Workflows aus

      # KI-Backend (Issue #403): Label `ai:use-zai` am Issue waehlt pro Lauf z.ai statt Anthropic
      # (Default). Schreibt AI_BACKEND=anthropic|zai nach $GITHUB_ENV; bei zai kommen Endpoint +
      # ANTHROPIC_AUTH_TOKEN (Secret ZAI_API_KEY) dazu. Muss VOR Preflight + claude-code-action.
      - name: KI-Backend konfigurieren
        if: steps.preflight.outputs.configured == 'true'
        uses: ./.github/actions/configure-ai-backend
        with:
          entity-type: issue
          entity-number: ${{ github.event.issue.number }}
          gh-token: ${{ steps.app-token.outputs.token }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}

      # Deterministischer Agent-Secret-Check (Haerten S2): die OAuth-Token-Voraussetzung fuer
      # Claude darf NICHT still skippen — fehlt CLAUDE_CODE_OAUTH_TOKEN, bricht der Lauf hier
      # deterministisch ab. Ai:to-big-issue + ai:ready entfernen, damit KEIN Re-Loop. Setzt mit
      # dem App-Token, damit die Label greifen.
      - name: Agent-Secret prüfen (kein stiller Skip)
        if: steps.preflight.outputs.configured == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AI_BACKEND: ${{ env.AI_BACKEND }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ "${AI_BACKEND:-}" = "zai" ]; then
            echo "KI-Backend=zai — Auth via ZAI_API_KEY (in configure-ai-backend validiert). OAuth-Preflight entfaellt."
            exit 0
          fi
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error title=Agent-Secret fehlt::CLAUDE_CODE_OAUTH_TOKEN fehlt — fehlt es, darf der Lauf nicht still skippen (AGENTS.md: bewusstes Opt-in). Secret als Repo-Secret hinterlegen."
            gh label create "ai:to-big-issue" --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "KI-Job lief rot (Konfiguration/Secret) — bitte pruefen" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue"
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:ready" 2>/dev/null || true
            exit 1
          fi
          echo "Agent-Secret (CLAUDE_CODE_OAUTH_TOKEN) vorhanden."

      # Deterministischer Doppel-Run-Guard (Haerten H3): prueft VOR dem Agenten deterministisch,
      # ob schon ein READY-PR (nicht Draft) fuer das Issue existiert. Ein Draft-PR ist der normale
      # Spec-Eingang (wird aufgregriffen); ein ready-PR bedeutet, die Umsetzung lief bereits. Die
      # Idempotenz stand bisher NUR im Prompt und war Race-gefaehrdet (zwei Laeufe => doppelt).
      - name: Doppel-Run-Guard (ready-PR existiert bereits)
        id: doppel-guard
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          # Fallback bei transienter gh-API-Stoerung: bewusst fail-open (existing=0, Umsetzung darf
          # laufen) statt den Lauf zu blockieren — im Worst Case ein seltener doppelter Branch,
          # statt jeden Implement-Lauf an einem gh-Hickup scheitern zu lassen. Warnung macht das sichtbar.
          if ! existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,isDraft,closingIssuesReferences \
            --jq "[.[] | select(.isDraft == false) | select((.closingIssuesReferences // []) | any(.number == ${ISSUE}))] | length" 2>/dev/null)"; then
            echo "::warning::Doppel-Run-Guard: gh-API nicht erreichbar — Pruefung uebersprungen (fail-open, Umsetzung darf laufen)."
            existing=0
          fi
          if [ "${existing:-0}" -gt 0 ]; then
            echo "::notice title=Umsetzung übersprungen::Für Issue #$ISSUE existiert bereits ein ready-PR — Umsetzung lief bereits (Doppel-Run-Guard)." >> "$GITHUB_STEP_SUMMARY"
            echo "Doppel-Run-Guard: ${existing} ready-PR(s) für Issue #$ISSUE — Umsetzung beendet (No-op)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Kein ready-PR für Issue #$ISSUE — Umsetzung darf laufen (Draft-PR = Spec-Eingang wird aufgehoben)."
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # Kreuzverhoer-Finding (2026-07-08): bisher nur an preflight gekoppelt — im No-op-Fall
      # (Doppel-Run-Guard: ready-PR existiert schon) lief die volle Installation trotzdem durch,
      # bevor der Claude-Schritt sie wirkungslos ignorierte. Jetzt zusaetzlich an
      # steps.doppel-guard.outputs.skip gekoppelt.
      - name: pnpm einrichten
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Node.js einrichten
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc # zentrale Node-Version (gleicher Stand wie ci/fixup/deploy)
          cache: pnpm

      - name: Abhaengigkeiten installieren
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Git-Hooks installieren (lefthook)
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm exec lefthook install

      # Soft-Abort-Obergrenze (2026-07-08): merkt sich, ob "ai:continued" bereits VOR diesem Lauf
      # gesetzt war. Der Cap-Step nach dem Claude-Schritt liest diesen Wert, um eine zweite
      # Fortsetzung in Folge zu verhindern (siehe dort).
      - name: Fortsetzungs-Stand pruefen (ai:continued)
        id: continued-before
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          already="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels \
            --jq 'any(.labels[]; .name == "ai:continued")' 2>/dev/null || echo false)"
          echo "already=${already:-false}" >> "$GITHUB_OUTPUT"

      # Named Session Resume (Phase "impl", Soft-Abort-Rollout 2026-07-08): laedt ein evtl.
      # archiviertes Sitzungsarchiv dieses Issues, damit ein Selbst-Retrigger-Folgelauf die
      # Konversation fortsetzt statt kontextlos neu zu beginnen. Fail-open wie in claude-triage.yml.
      - name: Session-Archiv wiederherstellen (Phase impl)
        id: session-restore
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        continue-on-error: true
        uses: ./.github/actions/session-restore
        with:
          issue: ${{ github.event.issue.number }}
          phase: impl

      - name: Supersede-Check
        id: supersede-check
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          running=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs \
            --jq ".workflow_runs[] | select(.name == \"Claude Implement\" and (.status == \"queued\" or .status == \"in_progress\") and .id != ${{ github.run_id }}) | .id" 2>/dev/null | head -1)
          if [ -n "$running" ]; then
            echo "::notice::Ein Implement-Lauf für Issue #${{ github.event.issue.number }} läuft bereits — dieser Trigger wird übersprungen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Umsetzung via Claude Code
        id: claude
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true' && steps.supersede-check.outputs.skip != 'true'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1.0.165
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }} # gh nutzt das App-Token -> erstellter PR loest Review aus
        with:
          claude_code_oauth_token: ${{ env.AI_BACKEND != 'zai' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ steps.app-token.outputs.token }}
          # Erlaubte Bot-Ausloeser — die Triage setzt `ai:ready` als App-Bot (claude[bot]), sonst
          # blockt checkHumanActor ("Workflow initiated by non-human actor"). Absicherung zusaetzlich
          # ueber den engen Job-`if:` (genau ai:ready + ai:analyzed + offen).
          allowed_bots: 'claude[bot],my-github-action-bot'
          prompt: |
            Das Label `ai:ready` wurde an Issue #${{ github.event.issue.number }} gesetzt —
            setze dieses Issue jetzt um.

            Folge dem Umsetzungs-Workflow .ai-knowledge/ticket-implementation.md (entspricht
            `/implement-ticket ${{ github.event.issue.number }}`), aber NUR die Schritte 1 bis 4:
              1. Zuweisung übernimmt bereits der Workflow (Best-Effort: an den auslösenden
                 Menschen, sonst den Issue-Autor). Weise dich NICHT selbst zu — `@me` wäre der Bot.
              2. Analyse re-verifizieren (Re-Triage gegen den aktuellen Repo-Stand). Kippt die
                 Umsetzbarkeits-Ampel auf 🔴 → NICHT umsetzen, `ai:ready` entfernen, im Issue
                 begründen und stoppen (Mensch entscheidet). Trägt das Issue bereits
                 `ai:to-big-issue`, hat ein vorheriger Lauf die Fortsetzungs-Obergrenze bereits
                 ausgeschöpft — ebenfalls nicht weiterarbeiten, kurz kommentieren und stoppen.
              3. Spec-Modus (Regelfall): den aus der Spec-Stufe vorhandenen DRAFT-PR auschecken
                 (`gh pr list --state open --draft --json number,headRefName,closingIssuesReferences`,
                 den mit Issue #${{ github.event.issue.number }} in closingIssuesReferences; dann
                 `git fetch origin && git switch <headRefName>`). Dessen ROTE Tests GRUEN machen — die
                 Tests NICHT aendern (Gewaltenteilung); ein falscher Spec-Test wird begruendet
                 zurueckgemeldet, nicht still editiert. Fallback (kein Draft-PR): eigenen Branch
                 anlegen und die Tests zu den Akzeptanzkriterien selbst zuerst schreiben (rot, erster
                 Commit). In beiden Faellen: Code bis `pnpm test` gruen, danach `pnpm format` + Lint + `pnpm knip`.
              4. Committen, Branch pushen. Im Spec-Modus den vorhandenen Draft-PR review-bereit
                 machen (`gh pr ready <pr-nr>`) und die Beschreibung um Umsetzung +
                 format-/lint-/test-Ergebnisse ergaenzen — KEINEN neuen PR anlegen. Im Fallback einen
                 PR ERSTELLEN (ready to review, KEIN Draft) mit
                 `Closes #${{ github.event.issue.number }}` im Body und format-/lint-/test-Ergebnissen.
                 ALLERLETZTER Schritt, NIE davor: ERST NACHDEM Push + PR/Beschreibung vollstaendig
                 stehen, das Label `ai:needs-review` am PR setzen (`gh pr edit <pr-nr> --add-label
                 ai:needs-review`; Label bei Bedarf vorher `gh label create "ai:needs-review"
                 --color 1D76DB`) — das setzt sofort den Kreuzverhör-Review (claude-pr-review.yml)
                 in Gang, der den PR-Stand unmittelbar danach liest. Du entscheidest damit selbst
                 ueber den genauen Zeitpunkt: `pr-needs-review-label.yml` reagiert bewusst NICHT auf
                 den Draft→ready-Uebergang von App-Bot-erzeugten PRs (nur auf menschliche Aktoren) —
                 das Label kommt ausschliesslich von dir, hier, erst wenn wirklich alles fertig ist.

            Weiches Zeitlimit (Soft-Abort): Dieser Lauf wird nach 20 Minuten von GitHub HART
            abgebrochen (kein SIGTERM-Handling möglich). Prüfe daher VOR jedem größeren Teilschritt
            (nächster Test-Lauf, neuer Datei-Batch) mit
            `test "$(date +%s)" -ge ${{ steps.starttime.outputs.soft_deadline_epoch }}`, ob das
            weiche Limit (14 Min nach Start, 6 Min Puffer) erreicht ist. Ist das der Fall, STOPPE
            SOFORT den aktuellen Teilschritt kontrolliert und sichere den Zwischenstand statt einen
            kompletten Durchlauf zu erzwingen: committen, Branch pushen und lieber einen Draft-PR
            mit `Closes #${{ github.event.issue.number }}` und einer kurzen Restpunkte-Liste
            erstellen bzw. aktualisieren (Label `ai:needs-review` NICHT setzen, solange unfertig).
            Löse danach selbst einen sauberen Folgelauf aus: `ai:ready` am Issue entfernen und
            sofort wieder setzen (`gh issue edit ${{ github.event.issue.number }} --remove-label
            ai:ready` gefolgt von `--add-label ai:ready`) — das feuert claude-implement.yml erneut,
            der Folgelauf setzt per Session-Resume an dieser Stelle fort. Danach den Turn beenden.
            Ein PR mit dokumentiertem Teilstand ist deutlich besser als ein harter Abbruch ohne
            jedes Ergebnis.

            Idempotenz: Ein DRAFT-PR mit `Closes #${{ github.event.issue.number }}` ist der normale
            Spec-Eingang (siehe Schritt 3) — den aufgreifen, NICHT ueberspringen. Nur abbrechen, wenn
            bereits ein NICHT-Draft-PR (ready) mit `Closes #${{ github.event.issue.number }}`
            existiert (Umsetzung schon gelaufen) — Lauf beenden.

            Schritt 5 (PR-Abo + Kreuzverhör-Loop) NICHT ausführen — der Review läuft als eigener
            Workflow. `subscribe_pr_activity` ist hier nicht verfügbar.

            Bearbeite ausschließlich dieses eine Issue. Die Freigabe gilt durch das Label
            `ai:ready` als erteilt: arbeite autonom, ohne auf eine interaktive Bestätigung zu warten.
          claude_args: >-
            --bare --model claude-sonnet-4-6 --effort medium
            ${{ steps.session-restore.outputs.resume-arg }}
            --allowedTools "Bash(gh issue:*),Bash(gh pr:*),Bash(gh label:*),Bash(gh api:*),Bash(git switch:*),Bash(git checkout:*),Bash(git branch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(git fetch:*),Bash(pnpm:*),Read,Edit,Write,Grep,Glob,Task"
            --append-system-prompt "Automatisierter, durch das Label ai:ready autorisierter Umsetzungs-Lauf in GitHub Actions (headless). Bearbeite ausschliesslich Issue #${{ github.event.issue.number }}, Schritte 1-4 der Umsetzung; KEIN PR-Abo/Kreuzverhoer-Loop (separater Workflow). Setze ai:needs-review ALS ALLERLETZTEN Schritt, NIE davor — erst nach Commit+Push+PR, da der Kreuzverhoer-Review den PR-Stand unmittelbar danach liest; pr-needs-review-label.yml reagiert bewusst NICHT auf deine bot-erzeugten PRs, DU allein steuerst den Zeitpunkt. HARTES 20-Minuten-Timeout, weiches Limit bei 14 Min (Soft-Abort): pruefe vor jedem groesseren Teilschritt `date +%s` gegen ${{ steps.starttime.outputs.soft_deadline_epoch }}; ist das erreicht, sichere den Zwischenstand (committen/pushen, ggf. Draft-PR mit Restpunkte-Liste), setze KEIN ai:needs-review, sondern entferne+setze ai:ready neu (Selbst-Retrigger, der Folgelauf setzt per --resume fort) und beende den Turn. Modell-Strategie: Du laeufst als Sonnet-Koordinator. Schaetze die Komplexitaet der Aufgabe ein und delegiere die eigentliche Abarbeitung per Agent-Tool an einen Subagenten in derselben Session: heavy (Opus) fuer komplexe/architektonische Aufgaben, light (Haiku) fuer triviale/mechanische Aufgaben; Standard- und Koordinationsarbeit erledigst du selbst auf Sonnet."

      - name: Kosten-Zusammenfassung
        if: always()
        continue-on-error: true
        uses: ./.github/actions/cost-summary
        with:
          execution-file: ${{ steps.claude.outputs.execution_file }}
          label: Umsetzung

      # Named Session Resume (Phase "impl"): sichert die eben beendete/abgebrochene Session ins
      # Sitzungsarchiv, damit ein Selbst-Retrigger-Folgelauf per --resume anknuepfen kann.
      # if: always() -- auch ein in den harten Timeout gelaufener Lauf sichert seinen Teil-Fortschritt.
      - name: Session-Archiv sichern (Phase impl)
        if: always() && steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        continue-on-error: true
        uses: ./.github/actions/session-save
        with:
          issue: ${{ github.event.issue.number }}
          phase: impl
          session-id: ${{ steps.claude.outputs.session_id }}
          gh-token: ${{ steps.app-token.outputs.token }}

      # Soft-Abort-Obergrenze (2026-07-08): erkennt einen BEWUSSTEN Zwischenstopp (Claude hat
      # sauber beendet -- outcome success, nicht cancelled -- und ai:ready selbst wieder gesetzt,
      # ohne dass bereits ein nicht-Draft-PR fuer dieses Issue existiert) und begrenzt automatische
      # Selbst-Fortsetzungen auf genau EINE, bevor deterministisch auf ai:to-big-issue
      # zurueckgefallen wird (verhindert eine Endlosschleife bei einem grundsaetzlich zu grossen Issue).
      - name: Soft-Abort-Fortsetzung erkennen und begrenzen (ai:continued)
        if: always() && steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true' && steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          ALREADY_CONTINUED: ${{ steps.continued-before.outputs.already }}
        run: |
          has_ready="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels \
            --jq 'any(.labels[]; .name == "ai:ready")' 2>/dev/null || echo false)"
          # Gleiche Abfrage wie der Doppel-Run-Guard oben: existiert bereits ein nicht-Draft-PR mit
          # Closes #N, ist die Umsetzungsphase abgeschlossen (unabhaengig vom aktuellen Review-Label).
          non_draft_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,isDraft,closingIssuesReferences \
            --jq "[.[] | select(.isDraft == false) | select((.closingIssuesReferences // []) | any(.number == ${ISSUE}))] | length" 2>/dev/null || echo 0)"

          if [ "${non_draft_pr:-0}" -gt 0 ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:continued" 2>/dev/null || true
            exit 0
          fi

          if [ "$has_ready" != "true" ]; then
            # Ampel ist bei der Re-Verifikation auf 🔴 gekippt (ai:ready wurde entfernt) -- kein
            # Soft-Abort-Fall, nichts zu tun.
            exit 0
          fi

          if [ "${ALREADY_CONTINUED:-false}" = "true" ]; then
            echo "::warning title=Issue #${ISSUE} Fortsetzungs-Obergrenze::Zweiter Zwischenstopp in Folge -- automatische Fortsetzung ausgeschoepft, markiere als zu gross."
            gh label create "ai:to-big-issue" --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "KI-Job lief in den Timeout -- Issue zu gross, bitte aufteilen" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:ready" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:continued" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Automatischer Soft-Abort: 2 Versuche (Original + 1 Fortsetzung) ausgeschoepft, ohne die Umsetzung abzuschliessen. Als \`ai:to-big-issue\` markiert -- bitte aufteilen oder nach Behebung das Label entfernen, um es erneut zu versuchen." 2>/dev/null || true
          else
            gh label create "ai:continued" --repo "$GITHUB_REPOSITORY" \
              --color FBCA04 --description "Automatischer Soft-Abort: Lauf hat sich selbst fuer eine Fortsetzung neu getriggert" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:continued"
            echo "::notice title=Issue #${ISSUE} Soft-Abort::Erster Zwischenstopp -- Folgelauf per Selbst-Retrigger (ai:ready) unterwegs."
          fi

      # Bei hartem Timeout (Agent-Schritt cancelled) ist das Issue zu gross, um es in einem Lauf
      # umzusetzen: mit "ai:to-big-issue" markieren (Kandidat zum Aufteilen) und "ai:ready"
      # entfernen, damit der Umsetzungs-Workflow es nicht erneut aufgreift. Laeuft im
      # Cancellation-Grace-Fenster (if: always(), bis ~5 Min) — die schnellen gh-Aufrufe passen hinein.
      # Zeit-Guard: nur labeln, wenn der Lauf das 20-Min-Limit nahezu ausgeschoepft hat (>= 18 Min) —
      # so faellt ein frueher, ebenfalls cancelled-erzeugender Abbruch (manueller Cancel) heraus.
      - name: Bei Timeout als zu gross markieren (ai:to-big-issue)
        if: always() && steps.preflight.outputs.configured == 'true' && steps.claude.outcome == 'cancelled'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_START: ${{ steps.starttime.outputs.epoch }}
        run: |
          elapsed=$(( $(date +%s) - ${RUN_START:-0} ))
          if [ "${RUN_START:-0}" -eq 0 ] || [ "$elapsed" -lt 1080 ]; then
            echo "::notice title=Kein Timeout::Lauf nach ${elapsed}s abgebrochen (< 18 Min) — vermutlich manueller Cancel, kein ai:to-big-issue."
            exit 0
          fi
          gh label create "ai:to-big-issue" --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "KI-Job lief in den Timeout — Issue zu gross, bitte aufteilen" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:ready" 2>/dev/null || true
          echo "::warning title=Issue #${ISSUE} zu gross::20-Min-Timeout erreicht (${elapsed}s) — Label ai:to-big-issue gesetzt, ai:ready entfernt; bitte Issue aufteilen."

      # Deterministisches Abschluss-Signal (unabhaengig von der LLM-Ausgabe): laeuft auch bei
      # Abbruch/Timeout (if: always()) und macht im Log/Job-Summary klar sichtbar, DASS und mit
      # welchem Ergebnis der Lauf fertig ist. outcome=cancelled signalisiert das 20-Min-Timeout.
      - name: Ergebnis zusammenfassen
        if: always() && steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Umsetzung erfolgreich::Issue #${ISSUE} — Tests grün gemacht"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Umsetzung abgebrochen::Lauf durch neueren Trigger verdrängt (kein Fehler)"
          else
            echo "::error title=❌ Umsetzung fehlgeschlagen::Claude-Lauf gescheitert"
          fi
          {
            echo "### Umsetzung #${ISSUE} — fertig"
            echo ""
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\` (cancelled = 20-Min-Timeout erreicht oder Supersede)"
            echo "- Aktuelle Issue-Labels: ${labels:-keine}"
            if [ -n "$SESSION_ID" ]; then echo "- Session-ID: \`${SESSION_ID}\` (\`--resume\` zum Nachschauen)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Umsetzung #${ISSUE} fertig::Claude-Schritt ${OUTCOME:-unbekannt}; Labels: ${labels:-keine}"
