name: Claude Implement (ai:ready)

# Stoesst die Umsetzung eines Issues an, sobald es das Label "ai:ready" erhaelt UND bereits
# "ai:analyzed" traegt (Label-Kette aus AGENTS.md: analysiert -> freigegeben -> Umsetzung als PR).
#
# Frueher lief die Umsetzung direkt hier als `anthropics/claude-code-action@v1` auf einem
# GitHub-Runner. Eine echte Umsetzung (Branch, Code, `pnpm format`+Lint, PR) dauert aber
# regelmaessig laenger als das auf 10 Minuten begrenzte Action-Timeout -> der Lauf wurde
# mittendrin abgebrochen ("wird nicht fertig"). Daher ist dieser Workflow jetzt nur noch eine
# schlanke BRUECKE: er feuert den API-Trigger einer Claude-Code-Cloud-"Routine" (Sekundensache,
# kein Timeout-Risiko). Die eigentliche, langlaufende Umsetzung laeuft dann auf
# Anthropic-Infrastruktur in der Routine (kein hartes 10-Minuten-Limit).
#
# Die Routine erstellt den PR ueber ihren GitHub-Connector (Claude GitHub App) und setzt das
# Label "ai:needs-review" am PR, woraufhin der Kreuzverhoer-Review (claude-pr-review.yml) ihn
# aufgreift. Weil der PR von der App (nicht vom Standard-GITHUB_TOKEN) stammt, loest er die
# Folge-Workflows aus (Schleifenschutz bleibt gewahrt).
#
# Einrichtung der Routine (einmalig, im Web-UI claude.ai/code/routines):
#   1. Neue Routine anlegen, dieses Repo auswaehlen, als Prompt die Schritte 1-4 aus
#      .ai-knowledge/ticket-implementation.md hinterlegen (Vorlage siehe unten im Fire-Step).
#      Die zu bearbeitende Issue-Nummer kommt zur Laufzeit im `text`-Feld des API-Triggers.
#   2. Trigger "API" hinzufuegen -> Endpoint-URL kopieren und Token generieren (wird nur EINMAL
#      angezeigt).
#   3. Beide Werte als Repo-Secrets hinterlegen:
#        CLAUDE_ROUTINE_IMPLEMENT_URL   = vollstaendige .../fire-Endpoint-URL
#        CLAUDE_ROUTINE_IMPLEMENT_TOKEN = Bearer-Token (sk-ant-oat01-...)
#   Fehlen die Secrets, wird der Lauf sauber uebersprungen (Warnung statt Fehler).

on:
  issues:
    types: [labeled]

concurrency:
  group: claude-implement-${{ github.event.issue.number }}
  # Reiht Laeufe pro Issue ein (kein Abbruch laufender/queued Laeufe); dedupliziert aber NICHT:
  # zwei kurz aufeinanderfolgende labeled-Events feuern die Routine zweimal. Ein Doppel-Trigger
  # wird ueber die Idempotenz-Pruefung im Routine-Prompt abgefangen (kein zweiter PR, wenn bereits
  # ein offener PR mit `Closes #N` existiert).
  cancel-in-progress: false

jobs:
  dispatch:
    # Nur wenn GENAU das Label "ai:ready" neu gesetzt wurde, das Issue zusaetzlich "ai:analyzed"
    # traegt und offen ist.
    if: >-
      ${{ github.event.label.name == 'ai:ready'
          && contains(github.event.issue.labels.*.name, 'ai:analyzed')
          && github.event.issue.state == 'open' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5 # nur ein API-Call + Best-Effort-Zuweisung; die Umsetzung laeuft in der Routine
    permissions:
      issues: write # Best-Effort-Zuweisung an einen Menschen
    steps:
      - name: Voraussetzung pruefen (Routine-Secrets)
        id: preflight
        env:
          ROUTINE_URL: ${{ secrets.CLAUDE_ROUTINE_IMPLEMENT_URL }}
          ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_IMPLEMENT_TOKEN }}
        run: |
          if [ -z "$ROUTINE_URL" ] || [ -z "$ROUTINE_TOKEN" ]; then
            echo "::warning::Routine-Secrets fehlen (CLAUDE_ROUTINE_IMPLEMENT_URL und/oder CLAUDE_ROUTINE_IMPLEMENT_TOKEN) — Lauf wird uebersprungen (kein Fehler). Routine unter claude.ai/code/routines anlegen, API-Trigger hinzufuegen und beide Werte als Repo-Secrets hinterlegen (Details im Workflow-Kopf)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Issue einem Menschen zuweisen (Best-Effort)
        # Best-Effort: an den auslösenden Menschen, sonst den Issue-Autor. Im 🟢-Automatikpfad
        # setzt die Triage ai:ready als App-Bot — dann ist sender ein Bot (nicht als Assignee
        # zulaessig). Daher Bot-Logins herausfiltern; sind beide Bots, bleibt das Issue
        # unzugewiesen (sauberer ::notice:: statt stillem Fehlschlag). NIE @me (waere der Bot).
        if: steps.preflight.outputs.configured == 'true'
        continue-on-error: true # nice-to-have; darf die Umsetzung nicht blockieren
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          ASSIGNEE: ${{ github.event.sender.type == 'User' && github.event.sender.login || (github.event.issue.user.type == 'User' && github.event.issue.user.login || '') }}
        run: |
          if [ -z "$ASSIGNEE" ]; then
            echo "::notice::Kein menschlicher Assignee ermittelbar (Ausloeser und Issue-Autor sind Bots) — Issue bleibt unzugewiesen."
            exit 0
          fi
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-assignee "$ASSIGNEE"

      - name: Routine ausloesen (Umsetzung in Claude Code Cloud)
        if: steps.preflight.outputs.configured == 'true'
        env:
          ROUTINE_URL: ${{ secrets.CLAUDE_ROUTINE_IMPLEMENT_URL }}
          ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_IMPLEMENT_TOKEN }}
          # Issue-Titel NICHT direkt ins Skript interpolieren (Script-Injection); ueber env +
          # `jq --arg` sicher in den JSON-Body einbetten.
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Kontext fuer die Routine: Repo + Issue-Nummer (+ Titel) als freier Text. Die
          # eigentlichen Umsetzungs-Anweisungen (Schritte 1-4) stehen im gespeicherten
          # Routine-Prompt; hier wird nur mitgegeben, WELCHES Issue umzusetzen ist.
          read -r -d '' PROMPT_TEXT <<EOF || true
          Setze GitHub-Issue #${ISSUE_NUMBER} im Repository ${REPO} um ("${ISSUE_TITLE}").

          Folge dem Umsetzungs-Workflow .ai-knowledge/ticket-implementation.md (entspricht
          \`/implement-ticket ${ISSUE_NUMBER}\`), aber NUR die Schritte 1 bis 4:
            1. Das Issue ist im Best-Effort bereits einem Menschen zugewiesen. Weise dich NICHT
               selbst zu.
            2. Analyse re-verifizieren (Re-Triage gegen den aktuellen Repo-Stand). Kippt die
               Umsetzbarkeits-Ampel auf rot -> NICHT umsetzen, \`ai:ready\` entfernen, im Issue
               begruenden und stoppen (Mensch entscheidet).
            3. Auf eigenem Branch umsetzen (Projekt-Konventionen, danach \`pnpm format\` + Lint).
            4. Committen, Branch pushen, PR ERSTELLEN (ready to review, KEIN Draft) mit
               \`Closes #${ISSUE_NUMBER}\` im Body und format-/lint-Ergebnissen. Dann das Label
               \`ai:needs-review\` am PR setzen, damit der Kreuzverhoer-Review ihn aufgreift.

          Idempotenz: Existiert bereits ein offener PR mit \`Closes #${ISSUE_NUMBER}\`, NICHT
          erneut umsetzen — beenden. Schritt 5 (PR-Abo/Kreuzverhoer-Loop) NICHT ausfuehren — der
          Review laeuft als eigener Workflow. Bearbeite ausschliesslich dieses eine Issue; die
          Freigabe gilt durch \`ai:ready\` als erteilt, arbeite autonom ohne Rueckfrage.

          Zeitbudget (weiche Timebox): Arbeite zuegig und zielgerichtet. Stellst du fest, dass der
          Umfang deutlich groesser ist als erwartet und du nach rund 25 Minuten noch weit von einem
          fertigen PR entfernt bist, laufe NICHT unbegrenzt weiter: Sichere den Zwischenstand
          (committen + Branch pushen), erstelle — falls schon sinnvoll moeglich — einen PR als
          Draft mit \`Closes #${ISSUE_NUMBER}\` und einer kurzen Restpunkte-Liste, ODER kommentiere
          den erreichten Stand und die offenen Punkte am Issue #${ISSUE_NUMBER}. Stoppe dann und
          ueberlasse die Entscheidung ueber das weitere Vorgehen dem Menschen, statt das Ticket in
          einem ueberlangen Lauf vollstaendig erzwingen zu wollen.
          EOF

          payload="$(jq -nc --arg t "$PROMPT_TEXT" '{text: $t}')"

          # Netzwerk-Robustheit: bis zu 4 Versuche mit exponentiellem Backoff (2s/4s/8s).
          attempt=1
          max=4
          delay=2
          while :; do
            http_code="$(curl -sS -o response.json -w '%{http_code}' \
              --connect-timeout 10 --max-time 60 \
              -X POST "$ROUTINE_URL" \
              -H "Authorization: Bearer $ROUTINE_TOKEN" \
              -H "anthropic-version: 2023-06-01" \
              -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
              -H "Content-Type: application/json" \
              -d "$payload")" || http_code="000"

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              session_url="$(jq -r '.claude_code_session_url // empty' response.json)"
              echo "Routine ausgeloest fuer Issue #${ISSUE_NUMBER} (HTTP $http_code)."
              {
                echo "### Claude Implement -> Cloud-Routine ausgeloest"
                echo ""
                echo "- Issue: #${ISSUE_NUMBER} — ${ISSUE_TITLE}"
                if [ -n "$session_url" ]; then
                  echo "- Session: ${session_url}"
                fi
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "::warning::Routine-Trigger fehlgeschlagen (Versuch ${attempt}/${max}, HTTP ${http_code})."
            cat response.json || true
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::Routine konnte nach ${max} Versuchen nicht ausgeloest werden (letzter HTTP ${http_code})."
              exit 1
            fi
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
