name: 03 Define Spec

# Schreibt die ROTEN Tests (ausführbarer Vertrag) für ein Issue, sobald es
# das Label "ai:needs-spec" erhält (gesetzt von der UX-Phase bei UI-Tickets oder
# direkt von der Analyse-Phase bei Nicht-UI-Tickets).
# Setzt **Claude Code** ein; Provider via `vars.LLM_PROVIDER` (zai|claude), aufgelöst in setup-claude.
#
# CONCURRENCY: Statische Gruppe pro Phase (globale Serialisierung, FIFO). Der `precheck`-Job
# prüft den LABEL-IST-ZUSTAND zur LAUFZEIT — queued Runs würden mit dem Label-Zustand zum
# TRIGGER-Zeitpunkt falsch wiederholen (Label inzwischen von einem anderen Lauf konsumiert).

on:
  issues:
    types: [labeled]

concurrency:
  group: claude-spec
  cancel-in-progress: false
  # queue: max — OHNE dies hält GitHub pro Gruppe nur EINEN pending-Run: jeder neue
  # Run cancelt den wartenden (`queue: single` ist der Default). Mit statischem,
  # ticket-unabhängigem Key hätte ein Label-Burst über mehrere Tickets die
  # wartenden Läufe still verworfen — Trigger-Label klebt, kein Lauf, kein Notice.
  # `max` = bis zu 100 pending, FIFO. Unvereinbar mit cancel-in-progress: true.
  queue: max

jobs:
  precheck:
    # Unveränderliches Event-Faktum filtert hier (spart den Runner für No-op-Trigger — 02 feuert
    # auf JEDES `labeled` im Repo). Es gatet den precheck, nicht den Hauptjob: wird der precheck
    # übersprungen, ist sein Output leer und der Hauptjob fällt korrekt mit aus.
    if: ${{ github.event.label.name == 'ai:needs-spec' }}
    # Label-IST-Zustand zur Laufzeit: ai:needs-spec muss JETZT (nach dem Warten in
    # der globalen Phasen-Queue) noch am Issue kleben. Soll-Werte stehen zentral
    # in .github/scripts/check-phase-label.sh; hier wird nur der Phasen-Name übergeben.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # lokale Action + Skript auschecken
      issues: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Label-Pre-Check (IST-Zustand zur Laufzeit)
        id: check
        uses: ./.github/actions/check-phase-label
        with:
          phase: spec
          ticket: ${{ github.event.issue.number }}

  spec:
    needs: precheck
    # `result == 'failure'` ist FAIL-OPEN und beabsichtigt: das Skript fällt bei API-Fehlern
    # bewusst auf "laufen lassen" zurück, aber ein Fehler AUSSERHALB (Checkout, Timeout,
    # Runner-Ausfall) würde den Hauptjob sonst stumm überspringen — Trigger konsumiert, niemand
    # arbeitet, nichts re-armt. Ein übersprungener precheck (result == 'skipped', No-op-Trigger)
    # erfüllt keine der beiden Klauseln und lässt den Hauptjob korrekt entfallen.
    if: >-
      ${{ always()
          && (needs.precheck.outputs.proceed == 'true' || needs.precheck.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    permissions:
      contents: read
      id-token: write
      actions: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Startzeit merken (für weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 840))" >> "$GITHUB_OUTPUT"

      - name: Phasen-Routing aus ai-phase-routing-Tabelle
        # Modell+Effort je Phase aus der analysgetriebenen Tabelle am Issue (ADR-0004).
        # Fail-open: Keine Tabelle/Zeile -> leere Outputs -> die Defaults unten greifen.
        id: routing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/resolve-phase-routing.sh \
            --repo "$GITHUB_REPOSITORY" \
            --issue "${{ github.event.issue.number }}" \
            --phase spec || true

      - name: Setup Claude Code (mit Memory-Load)
        id: setup
        uses: ./.github/actions/setup-claude
        with:
          needs-mcp: true
          tools-tier: full
          event-type: ${{ github.event_name }}
          ticket-ref: ${{ github.event.issue.number }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          # vars.* = manueller Not-Override; sonst Tabelle; sonst bewährter Default.
          model: ${{ vars.CLAUDE_MODEL_SPEC || steps.routing.outputs.model || 'sonnet' }}
          effort: ${{ steps.routing.outputs.effort || 'medium' }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          zai-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}
          openrouter-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          tailscale-exit-node: ${{ vars.TAILSCALE_EXIT_NODE }}
          memory-load: 'true'
          expect-memory: 'true'

      # Kein Skip-Guard ("läuft bereits") mehr: Die globale Phasen-Serialisierung (statische
      # concurrency-Gruppe) lässt Läufe desselben Issues nie parallel laufen, und der precheck
      # dedupliziert über den Label-IST-Zustand. Ein Lauf-Listen-Guard würde hier nur noch
      # queued Nachfolger finden und das FALSCHE Skip auslösen.

      - name: Doppel-Run-Guard (ready-PR existiert) + verwaiste Drafts aufräumen
        id: doppel-guard
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          # Ready-PR (Nicht-Draft) existiert -> Implement schon gelaufen -> skip.
          ready="$(bash .github/scripts/pr-for-issue.sh --repo "$GITHUB_REPOSITORY" \
            --issue "$ISSUE" --draft no --out count)"
          if [ "${ready:-0}" -gt 0 ]; then
            echo "::notice::Spec übersprungen – ready-PR (Nicht-Draft) existiert bereits für Issue #$ISSUE."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Draft-PRs für dieses Issue ermitteln
          drafts="$(bash .github/scripts/pr-for-issue.sh --repo "$GITHUB_REPOSITORY" \
            --issue "$ISSUE" --draft yes --out all 2>/dev/null || true)"
          draft_count=$(echo "$drafts" | grep -v '^$' | wc -w)

          if [ "$draft_count" -eq 1 ]; then
            # Genau 1 Draft → wiederverwenden (Branch auschecken, weiterarbeiten)
            DRAFT_PR="$drafts"
            DRAFT_BRANCH="$(gh pr view "$DRAFT_PR" --repo "$GITHUB_REPOSITORY" --json headRefName -q .headRefName 2>/dev/null || true)"
            if [ -n "$DRAFT_BRANCH" ] && [ "$DRAFT_BRANCH" != "null" ]; then
              echo "reuse_draft=true" >> "$GITHUB_OUTPUT"
              echo "draft_pr=$DRAFT_PR" >> "$GITHUB_OUTPUT"
              echo "draft_branch=$DRAFT_BRANCH" >> "$GITHUB_OUTPUT"
              echo "::notice::Draft-PR #$DRAFT_PR (Branch $DRAFT_BRANCH) wird weitergeführt."
            else
              echo "reuse_draft=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Draft-PR #$DRAFT_PR gefunden, aber Branch nicht auflösbar – neu anlegen."
            fi
          elif [ "$draft_count" -gt 1 ]; then
            # Mehrere Drafts → aufräumen (jüngsten behalten, ältere schließen)
            # Sortiere nach Erstellungsdatum, jüngsten behalten
            keep_pr=""
            newest_date=""
            for pr in $drafts; do
              created="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json createdAt -q .createdAt 2>/dev/null || true)"
              if [ -n "$created" ] && ([ -z "$newest_date" ] || [ "$created" > "$newest_date" ]); then
                newest_date="$created"
                keep_pr="$pr"
              fi
            done
            for pr in $drafts; do
              [ "$pr" = "$keep_pr" ] && continue
              [ -n "$pr" ] || continue
              gh pr close "$pr" --repo "$GITHUB_REPOSITORY" \
                --comment "🔄 Spec für Issue #$ISSUE neu angestoßen – älterer Draft geschlossen (jüngster Draft #$keep_pr bleibt)." 2>/dev/null || true
              echo "::notice::Älterer Draft-PR #$pr für Issue #$ISSUE geschlossen (behalten: #$keep_pr)."
            done
            # Jüngsten wiederverwenden
            DRAFT_BRANCH="$(gh pr view "$keep_pr" --repo "$GITHUB_REPOSITORY" --json headRefName -q .headRefName 2>/dev/null || true)"
            if [ -n "$DRAFT_BRANCH" ] && [ "$DRAFT_BRANCH" != "null" ]; then
              echo "reuse_draft=true" >> "$GITHUB_OUTPUT"
              echo "draft_pr=$keep_pr" >> "$GITHUB_OUTPUT"
              echo "draft_branch=$DRAFT_BRANCH" >> "$GITHUB_OUTPUT"
              echo "::notice::Jüngster Draft-PR #$keep_pr (Branch $DRAFT_BRANCH) wird weitergeführt."
            else
              echo "reuse_draft=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "reuse_draft=false" >> "$GITHUB_OUTPUT"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: pnpm einrichten
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Node.js einrichten
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Abhängigkeiten installieren
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Git-Hooks installieren (lefthook)
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm exec lefthook install

      - name: Spec via Claude
        id: claude
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          # Prompt liegt kanonisch in .github/prompts/spec.md.
          sed -e "s/{{ISSUE_NR}}/${{ github.event.issue.number }}/g" \
              -e "s/{{SOFT_DEADLINE}}/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" \
              .github/prompts/spec.md > /tmp/claude-prompt.txt

          # RESUME_HINT: Draft-Wiederverwendung oder Neu-Lauf
          if [ "${REUSE_DRAFT}" = "true" ]; then
            sed -i "s|{{RESUME_HINT}}|⚠️ FORTSETZUNGS-Lauf (Draft-Wiederverwendung) — PR #${DRAFT_PR}, Branch ${DRAFT_BRANCH}. Bestehenden Branch auschecken (git fetch origin && git switch ${DRAFT_BRANCH}), Stand prüfen, weiterschreiben. NICHT neu anlegen.|g" /tmp/claude-prompt.txt
          else
            sed -i "s|{{RESUME_HINT}}||g" /tmp/claude-prompt.txt
          fi

          # Memory-Snippets anhängen (Phase 3: restauriert + schreibt). Snippet-Platzhalter
          # separat substituieren, da die spec.md-sed oben nur den Prompt-Teil erfasst hat.
          cat .github/prompts/memory-read.md >> /tmp/claude-prompt.txt
          bash .github/scripts/render-memory-context.sh >> /tmp/claude-prompt.txt
          cat .github/prompts/memory-write.md >> /tmp/claude-prompt.txt
          sed -i "s/{{ISSUE_NR}}/${{ github.event.issue.number }}/g" /tmp/claude-prompt.txt
          sed -i "s/{{PHASE}}/spec/g" /tmp/claude-prompt.txt
          sed -i "s/{{MEMORY_STATUS}}/${{ steps.setup.outputs.memory-status-text }}/g" /tmp/claude-prompt.txt
          bash .github/scripts/assert-prompt-complete.sh /tmp/claude-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"
      - name: Token & Kosten erfassen
        # always(): Auch ein abgebrochener Lauf hat Token verbraucht — gerade teure
        # Fehlläufe gehören in die Baseline, sonst sieht die alte Pipeline zu günstig aus.
        if: always() && steps.setup.outputs.configured == 'true'
        uses: ./.github/actions/record-cost
        with:
          issue: ${{ steps.setup.outputs.issue-number || github.event.issue.number }}
          phase: spec
          since-epoch: ${{ steps.starttime.outputs.epoch }}
          provider: ${{ steps.setup.outputs.llm-provider }}

      - name: Issue-Storage sichern (Harness-Branch)
        # ADR 0007: Fetch-then-Commit auf ai/harness/{N} — derselbe Branch, auf dem
        # Spec/Impl arbeiten; der Memory reist committet mit dem PR nach main.
        if: always() && steps.setup.outputs.configured == 'true'
        uses: ./.github/actions/issue-state-save
        with:
          issue-number: ${{ steps.setup.outputs.issue-number || github.event.issue.number }}
          phase: spec

      - name: Label-Post-Assertion (VERDICT parsen, Labels via App-Token force-setzen)
        if: always() && steps.setup.outputs.configured == 'true' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure' || steps.doppel-guard.outputs.skip == 'true')
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
          GUARD_SKIP: ${{ steps.doppel-guard.outputs.skip }}
        run: |
          verdict=""
          if [ -f /tmp/claude-output.log ]; then
            # Erster bekannter Token gewinnt, längstes zuerst (spec-partial/spec-ready vor ready) —
            # Prosa/Markdown nach dem Token ist egal (#1017-Klasse, exakter Vergleich klebte sie fest).
            # spec-ready ist der ALT-Token für "Partial" und wird nur noch entgegengenommen: er kollidierte
            # mit dem gleichnamigen Triage-Token ("Issue direkt umsetzbar") und heißt hier jetzt spec-partial.
            verdict="$(grep 'VERDICT:' /tmp/claude-output.log | tail -1 | sed -E 's/^.*VERDICT:[[:space:]]*//' | grep -oE 'spec-partial|spec-ready|ready' | head -1 || true)"
            if [ "$verdict" = "spec-ready" ]; then verdict="spec-partial"; fi
          fi
          echo "Claude-Verdict aus Output: '${verdict:-keins}'"

          if [ "${GUARD_SKIP:-false}" = "true" ]; then
            verdict="ready"
            echo "::notice::Doppel-Run-Guard: PR existiert bereits – behandele als ready."
          fi

          # Spec-PR finden: primär closingIssuesReferences, Fallback auf Body-Suche
          # (PR #585: "Closes NNN" ohne "#" lässt die Referenz sonst leer → Crash).
          SPEC_PR="$(bash .github/scripts/pr-for-issue.sh --repo "$GITHUB_REPOSITORY" \
            --issue "$ISSUE" --draft any --out first)"
          ARTIFACTS_OK="false"
          if [ -n "$SPEC_PR" ] && [ "$SPEC_PR" != "null" ]; then
            # Prinzip: Tests nur für Anwendungscode (ADR 0001 + spec.md-NICHT-ANWENDUNGSCODE-Carve-out).
            # Spec-PR gilt als artefakt-OK, wenn er einen App-Test enthält ODER gar keinen
            # Anwendungscode berührt (reine Doku/Workflow/Config → keine Test-Pflicht). Ein
            # Workflow-/Markdown-Test (z. B. .github/workflows/*.test.ts) zählt NICHT als App-Test.
            HAS_APP_TEST="$(gh pr view "$SPEC_PR" --repo "$GITHUB_REPOSITORY" --json files \
              --jq '[.files[].path | select((startswith("server/src/") or startswith("frontend/src/") or startswith("frontend/e2e/")) and (endswith(".test.ts") or endswith(".test.tsx") or endswith(".spec.ts") or endswith(".spec.tsx")))] | any' 2>/dev/null || echo "false")"
            TOUCHES_APP="$(gh pr view "$SPEC_PR" --repo "$GITHUB_REPOSITORY" --json files \
              --jq '[.files[].path | select(startswith("server/src/") or startswith("frontend/src/") or startswith("frontend/e2e/"))] | any' 2>/dev/null || echo "false")"
            echo "::notice::Spec-PR #$SPEC_PR: HAS_APP_TEST=$HAS_APP_TEST TOUCHES_APP=$TOUCHES_APP"
            if [ "$HAS_APP_TEST" = "true" ] || [ "$TOUCHES_APP" != "true" ]; then
              ARTIFACTS_OK="true"
              [ "$TOUCHES_APP" != "true" ] && echo "::notice::Spec-PR #$SPEC_PR: kein Anwendungscode berührt — Test-Pflicht entfällt (nur App-Code wird getestet)"
            fi
          fi

          if [ "$verdict" = "ready" ]; then
            if [ "$ARTIFACTS_OK" != "true" ]; then
              echo "::error title=❌ Spec fehlt::VERDICT ready, aber kein Spec-PR mit Tests."
              exit 1
            fi
            final="ready"
          elif [ "$verdict" = "spec-partial" ]; then
            if [ "$ARTIFACTS_OK" = "true" ]; then
              final="ready"
            else
              final="spec-partial"
            fi
          else
            if [ "$ARTIFACTS_OK" = "true" ]; then
              final="ready"
            else
              echo "::error title=❌ Spec fehlgeschlagen::Kein VERDICT und keine Artefakte."
              exit 1
            fi
          fi

          gh label create "ai:needs-impl" --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true
          gh label create "ai:needs-spec" --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true

          # Trigger konsumieren + stale Folge-Trigger entfernen (Idempotenz: remove-vor-add).
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:needs-spec" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:needs-impl" 2>/dev/null || true

          if [ "$final" = "ready" ]; then
            # Erfolg: Trigger der nächsten Phase (Umsetzung) als letzter Write.
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:needs-impl"
            echo "::notice::Label gesetzt: ai:needs-impl (verifiziert: Spec-PR + rote Tests)"
          else
            # Partial-Retry: ai:needs-spec neu setzen (oben konsumiert) retriggert die
            # Spec-Phase; das Add-over-Remove-Muster erzeugt genau ein labeled-Event.
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:needs-spec"
            echo "::notice::Label gesetzt: ai:needs-spec (Partial-Retry, Artefakte unvollständig)"
          fi

      - name: Ergebnis zusammenfassen
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          SKIP_DOPPEL: ${{ steps.doppel-guard.outputs.skip }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          # Eigener Arm fuer den Doppel-Run-Guard: ohne ihn faellt der gewollte Skip auf den
          # Fehler-Arm (OUTCOME ist leer, weil der claude-Step nie lief) und meldet ❌.
          if [ "${SKIP_DOPPEL:-false}" = "true" ]; then
            echo "::notice title=⏭️ Spec übersprungen::Issue #${ISSUE} — PR existiert bereits"
          elif [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Spec erfolgreich::Issue #${ISSUE} — Rote Tests geschrieben"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Spec abgebrochen"
          else
            echo "::error title=❌ Spec fehlgeschlagen"
          fi
          {
            echo "### Spec #${ISSUE} – fertig"
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Labels: ${labels:-keine}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🩺 Z.AI Fair-Usage-Check (1313)
        # Rohausgabe des Claude-Laufs auf z.ai-Fehler 1313 (Fair Usage) durchsuchen
        # und Ergebnis als Annotation + Job-Summary sichtbar machen.
        if: always()
        uses: ./.github/actions/llm-fair-usage-check
