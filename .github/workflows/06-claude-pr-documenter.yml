name: 6/6 Dokumentation

# 6. Pipeline-Phase — PR-Documenter (LLM-gesteuert, wie die Claude-Phasen 01–05).
# Läuft NACH einem erfolgreichen PR-Merge und pflegt Titel, Beschreibung,
# Release-Note-Kommentar und Labels des EINEN gemergten PRs via Claude Code.
# Kein Batch mehr: PR-Daten kommen aus dem pull_request-Event bzw. `gh pr view`.
# PR-Pflege läuft ausschließlich via gh-Befehle — Claude braucht keine Dateimutationsmacht
# (tools-tier: review = Bash für gh, kein Write/Edit).

on:
  # Trigger an den ECHTEN Merge koppeln (Issue #496): `pull_request: [closed]` feuert pro
  # geschlossenem PR genau einmal; der Job-Guard (`if: ... merged == true`) schaltet die
  # Schliessen-ohne-Merge-Closes aus. Damit entfaellt das Over-Triggering des frueheren
  # `workflow_run`-Triggers, der bei JEDEM Abschluss des Gate-Workflows (meist No-op) feuerte.
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR-Nummer für manuellen Catch-up (z. B. liegengebliebener, gemergter PR)'
        required: true
        type: string

concurrency:
  # Pro-PR keyed: kurz hintereinander gemergte PRs parallelisieren statt serialisieren.
  group: 06-pr-documenter-${{ github.event.pull_request.number || github.event.inputs.pr-number }}
  cancel-in-progress: false

permissions:
  contents: read # Claude ändert PR-Metadaten via gh, nicht den Repo-Inhalt — kein Commit mehr.
  pull-requests: write
  issues: write
  # actions: write — fuer gh cache delete beim Issue-Memory-Abbau.
  actions: write
  # id-token: write — App-Token (setup-claude).
  id-token: write

env:
  REPO: ${{ github.repository }}

jobs:
  document-merged-pr:
    name: Document Merged PR (Claude)
    # Nur bei ECHTEM Merge laufen (AK2/AK3): pull_request:[closed] feuert auch beim Schliessen-ohne-
    # Merge, dieser Guard schaltet das aus. Der workflow_dispatch-Pfad (manueller Catch-up, AK4)
    # bleibt frei, weil dort event_name == 'workflow_dispatch' zutrifft.
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PR: ${{ github.event.pull_request.number || github.event.inputs.pr-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Startzeit merken (für weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 600))" >> "$GITHUB_OUTPUT"

      - name: Setup Claude Code (mit Memory-Load)
        id: setup
        uses: ./.github/actions/setup-claude
        with:
          needs-mcp: false
          tools-tier: review
          event-type: ${{ github.event_name }}
          ticket-ref: ${{ github.event.pull_request.number || github.event.inputs.pr-number }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          model: ${{ vars.CLAUDE_MODEL_DOCUMENTATION || 'haiku' }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          zai-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}
          openrouter-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          tailscale-exit-node: ${{ vars.TAILSCALE_EXIT_NODE }}
          memory-load: 'true'
          expect-memory: 'true'

      - name: 🔧 Phase 0 - Labels sicherstellen (deterministisch, vor Claude)
        # gh pr edit --add-label bricht hart ab ("X not found"), wenn ein Label im Repo fehlt.
        # Deshalb hier idempotent alle Labels anlegen, die Claude setzen kann: ai:documented +
        # die fünf release:* + release:ignore. create_label überspringt vorhandene; schlägt der
        # List-Abruf fehl (transienter gh-Ausfall), wird nicht angelegt statt zu crashen.
        # Bleibt deterministischer Bash-Helper — NICHT im LLM-Prompt.
        id: labels
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
        run: |
          set -euo pipefail

          if existing="$(gh label list --repo "$REPO" --json name | jq -r '.[].name')"; then
            fetch_ok=1
          else
            existing=""
            fetch_ok=0
            echo "⚠️ Label-Liste nicht abrufbar — überspringe Erstellung (idempotent, kein Crash)."
          fi
          create_label() {
            local name="$1" color="$2" desc="$3"
            if [ "$fetch_ok" = "0" ]; then
              echo "⏭️ Label '$name': Abruf war nicht autoritativ, überspringe Erstellung."
              return 0
            elif grep -qx "$name" <<<"$existing"; then
              echo "✅ Label '$name' existiert bereits"
            else
              echo "📝 Erstelle Label '$name'..."
              gh label create "$name" --repo "$REPO" --color "$color" --description "$desc"
            fi
          }
          create_label "ai:documented" 0075ca "Automatically documented by AI"
          create_label "release:feature" a2eeef "New feature"
          create_label "release:fix" d73a4a "Bug fix"
          create_label "release:improvement" a2eeef "Improvement"
          create_label "release:breaking-change" b60205 "Breaking change"
          create_label "release:engineering" cfd3d7 "Internal (no release note)"
          create_label "release:ignore" cfd3d7 "Ignored by release pipeline"

      - name: 📝 PR-Dokumentation via Claude
        id: claude
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr-number }}
        run: |
          cat > /tmp/claude-prompt.txt << 'CLAUDE_EOF'
          HINWEIS: Documenter ist terminal + Review-Tier — du schreibst KEINEN Memory (nur Lesen). Lesedetails siehe Memory-Abschnitt am Prompt-Ende.

          ROLLE: Du bist der PR-Documenter. Pflege Titel + Beschreibung des soeben gemergten PR #PR_NR. Du arbeitest NUR über gh (gh pr edit / gh pr comment) und änderst KEINE Dateien im Repo.

          INPUTS (liest selbst, nicht im Prompt wiederholen):
            - gh pr diff #PR_NR                        (die echten Codeänderungen)
            - gh pr view #PR_NR --json title,body,files,labels,author  (aktueller PR-Stand)
            - verknüpftes Issue falls vorhanden: gh issue view <nr>   (Issue-Beschreibung als Kontext)

          ABLAUF (STRIKT):
            1. SOFORT starten. Diff + PR + verknüpftes Issue lesen.
            2. BOT-ERKENNUNG: Autor Dependabot/Renovate/github-actions[bot] UND Diff nur Lockfile/Dependabot-Config?
               → NUR ai:documented + release:ignore setzen (siehe Schritt 7), sonst nichts. Dann VERDICT: documented.
            3. KLASSIFIKATION (genau eine): breaking | new | improved | fixed | internal — aus Diff + Titel + Issue, nicht spekulieren.
            4. PR-TITEL: Conventional Commits prüfen (type(scope): subject, subject lowercase, <=72 Zeichen).
               Nur wenn NICHT konform ODER der type nicht zur Klassifikation passt → via gh pr edit --title korrigieren.
               Mapping: breaking→feat!, new→feat, improved→perf, fixed→fix, internal→chore. Scope aus der Hauptdatei.
            5. PR-BESCHREIBUNG: NUR überschreiben/erstellen, wenn der aktuelle Body DÜNN ist (weniger als ~50 Zeichen oder praktisch leer).
               Eine gepflegte Beschreibung (Implement/Human) bleibt UNANGETASTET. Neu: What changed + Linked issues + Type of change + deutsche <details>-Sektion.
            6. RELEASE-NOTE-KOMMENTAR: GENAU EINEN Kommentar pflegen (vorhandenen Documenter-Kommentar mit Marker <!-- ai-documenter --> aktualisieren statt duplizieren).
               Bei internal: "no release note". Sonst: Klassifikation + Komponente + Kernänderungen.
            7. LABELS via gh pr edit, JE EIN EIGENER Aufruf (--add-label erwartet EINEN Wert, kein Array):
               a) ZUERST ai:documented setzen (MUSS — Idempotät-Invariante): gh pr edit #PR_NR --add-label ai:documented
               b) DANN release:* passend zur Klassifikation (separater, best-effort Aufruf):
                  breaking→release:breaking-change, new→release:feature, improved→release:improvement, fixed→release:fix, internal→release:engineering.
               Bot-PR (Schritt 2): stattdessen release:ignore.

          CONSTRAINTS:
            - KEINE Dateiänderungen (kein Write/Edit) — alles via gh.
            - KEINE Spekulation: nur was im Diff/PR/Issue belegt ist.
            - Conventional Commits, Mobile-First, deutsche + englische Sektion im Body.

          VERDICT: GANZ AM ENDE GENAU EINE Zeile:
            - VERDICT: documented

          ZEITLIMIT: Soft-Deadline = SOFT_DEADLINE. Vor jedem Schritt: [ $(date +%s) -ge SOFT_DEADLINE ]. Bei OVER: mindestens ai:documented sichern, Turn beenden.
          CLAUDE_EOF

          # Memory-Read-Snippet anhängen (Phase 6 = Documenter: terminal, nur Lesen)
          cat .github/prompts/memory-read.md >> /tmp/claude-prompt.txt

          sed -i "s/#PR_NR/$PR/g" /tmp/claude-prompt.txt
          sed -i "s/#MEMORY_STATUS/${{ steps.setup.outputs.memory-status-text }}/g" /tmp/claude-prompt.txt
          sed -i "s/SOFT_DEADLINE/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/claude-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      # Kein Memory-Save (im Gegensatz zu 01-05): der Documenter ist terminal, der nachfolgende
      # Teardown (🧹 Issue-Memory abbau) löscht den Cache ohnehin. Ein Save wäre save-then-delete
      # (redundant). Der Documenter ist terminal - Persistenz hat keine Folge-Phase mehr.

      - name: 🏷️ Label-Post-Assertion (ai:documented muss am PR hängen)
        # Erfolgskriterium des Documenter ist nicht ein Review-Verdict, sondern dass ai:documented
        # am PR hängt. Fehlt es (auch nach Retry für API-Replikationsverzögerung) → harter Fehler:
        # Claude hat vermutlich nicht gearbeitet. release:* bleibt best-effort (|| true).
        if: always() && steps.setup.outputs.configured == 'true' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
        run: |
          documented="false"
          for attempt in 1 2 3 4; do
            if gh pr view "$PR" --repo "$REPO" --json labels \
              --jq '[.labels[].name] | any(. == "ai:documented")' 2>/dev/null | grep -q true; then
              documented="true"
              break
            fi
            [ "$attempt" -lt 4 ] && sleep "$attempt"
          done
          if [ "$documented" != "true" ]; then
            echo "::error title=❌ Documenter ohne ai:documented::PR #$PR hat nach Claudes Lauf kein ai:documented-Label — Claude hat vermutlich nicht gearbeitet."
            exit 1
          fi
          echo "::notice title=✅ Dokumentation abgeschlossen::PR #$PR — ai:documented gesetzt."

      - name: 🧹 Issue-Memory abbauen (deterministisch)
        # Claude pflegt seinen nativen Memory nach .claude/memory/ (autoMemoryDirectory), pro Issue
        # persistiert unter stabilem Key claude-memory-issue-{N} (s. setup-claude, memory-save-key).
        # Nach Merge ist dieser Memory stale -> abbauen. Issue-Auflösung wie setup-claude: Closing-Issue,
        # sonst PR-Nummer als Fallback. Best-Effort: ein fehlgeschlagener Delete darf den Lauf nicht
        # abbrechen.
        # NUR bei Job-Erfolg (kein always()): schlägt der Documenter fehl, bleibt der Memory für den
        # Re-Run erhalten — always() würde die Vor-Phasen-Notizen vor dem Retry wegputzen.
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
        run: |
          closing_issue="$(gh pr view "$PR" --repo "$REPO" --json closingIssuesReferences \
            --jq '[.closingIssuesReferences[].number] | first' 2>/dev/null || true)"
          for ref in "$closing_issue" "$PR"; do
            if [ -z "$ref" ] || [ "$ref" = "null" ]; then continue; fi
            while IFS= read -r cid; do
              [ -z "$cid" ] && continue
              gh cache delete "$cid" --repo "$REPO" 2>/dev/null && echo "🗑️ Cache $cid gelöscht" || true
            done < <(gh cache list --repo "$REPO" --key "claude-memory-issue-${ref}" --json id,key 2>/dev/null | jq -r --arg k "claude-memory-issue-${ref}" '.[] | select(.key == $k) | .id' 2>/dev/null || true)
          done
          exit 0

      - name: 📋 Ergebnis zusammenfassen
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          labels="$(gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Documenter erfolgreich::PR #$PR"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Documenter abgebrochen::PR #$PR"
          else
            echo "::error title=❌ Documenter fehlgeschlagen::PR #$PR"
          fi
          {
            echo "### PR-Documenter #$PR"
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Labels: ${labels:-keine}"
          } >> "$GITHUB_STEP_SUMMARY"
