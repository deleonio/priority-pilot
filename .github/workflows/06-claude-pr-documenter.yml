name: 6/6 Dokumentation

# 7. Pipeline-Phase — PR-Documenter (Arbeitsteilung Regel-Logik + LLM).
# Läuft NACH einem erfolgreichen PR-Merge und pflegt Titel, Beschreibung,
# Release-Note-Kommentar und Labels des EINEN gemergten PRs.
# Aufteilung (empirisch: Prompt-only erzeugte driftende Kommentar-Formate und
# unnormalisierte Titel — Legacy-Erfahrung aus dem Prompt-only-Betrieb):
#   - pr-doc-facts.sh    — Bot-Erkennung, Conventional-Commits-Titelprüfung (deterministisch)
#   - Claude (doc.json)  — NUR Klassifikation + Fließtext (Titel/Beschreibung/Kommentar-Texte)
#   - pr-doc-render.sh   — sämtliche Schreibzugriffe: Titel-Rename, Body-Marker-Splice,
#                          genau EIN ai-documenter-Kommentar (PATCH statt Duplikat), Labels
# Bot-/release:ignore-PRs werden deterministisch kurzgeschlossen — ohne LLM-Lauf.

on:
  # Trigger an den ECHTEN Merge koppeln (Issue #496): `pull_request: [closed]` feuert pro
  # geschlossenem PR genau einmal; der Job-Guard (`if: ... merged == true`) schaltet die
  # Schliessen-ohne-Merge-Closes aus. Damit entfaellt das Over-Triggering des frueheren
  # `workflow_run`-Triggers, der bei JEDEM Abschluss des Gate-Workflows (meist No-op) feuerte.
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'PR-Nummer für manuellen Catch-up (z. B. liegengebliebener, gemergter PR)'
        required: true
        type: string

concurrency:
  # Statische Gruppe pro Phase (globale Serialisierung, FIFO): jede Phase hat genau eine
  # Laufzeit-Instanz. Der precheck-Job verhindert falsches Nachziehen — kurz hintereinander
  # gemergte PRs reihen sich ein statt zu parallelisieren.
  group: claude-pr-documenter
  cancel-in-progress: false
  # queue: max — OHNE dies hält GitHub pro Gruppe nur EINEN pending-Run: jeder neue
  # Run cancelt den wartenden (`queue: single` ist der Default). Mit statischem,
  # ticket-unabhängigem Key hätte ein Merge-Burst die wartenden Läufe still
  # verworfen — PR bliebe undokumentiert, kein Notice.
  # `max` = bis zu 100 pending, FIFO. Unvereinbar mit cancel-in-progress: true.
  queue: max

permissions:
  # GITHUB_TOKEN bleibt lesend: Checkout + PR-Metadaten via gh. Der Siegel-Schritt
  # committet .costs/<n>.json — aber über das App-Token (Installation: Contents:Write),
  # nicht über GITHUB_TOKEN.
  contents: read
  pull-requests: write
  issues: write
  # id-token: write — App-Token (setup-claude). Branch-Deletes im Teardown laufen über
  # dasselbe App-Token (Contents:Write der Installation), nicht über GITHUB_TOKEN.
  id-token: write

env:
  REPO: ${{ github.repository }}

jobs:
  precheck:
    # Unveränderliche Event-Fakten filtern hier (merged ist nach dem Schliessen unveränderlich);
    # der workflow_dispatch-Catch-up-Pfad bleibt offen.
    if: ${{ github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' }}
    # IST-Zustand zur Laufzeit: PR muss JETZT (nach dem Warten in der globalen Phasen-Queue)
    # noch gemergt und NOCH NICHT dokumentiert (ai:documented) sein — Letzteres ist die
    # Idempotenz-Invariante gegen queued Doppel-Events und workflow_dispatch-Catch-up-Doppel.
    # Soll-Werte stehen zentral in .github/scripts/check-phase-label.sh; hier wird nur der
    # Phasen-Name übergeben (Fail-open bei API-Fehler ist dort implementiert).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # lokale Action + Skript auschecken
      pull-requests: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Pre-Check (merged + noch nicht dokumentiert, zur Laufzeit)
        id: check
        uses: ./.github/actions/check-phase-label
        with:
          phase: documenter
          ticket: ${{ github.event.pull_request.number || github.event.inputs.pr-number }}

  document-merged-pr:
    name: Document Merged PR (Claude)
    needs: precheck
    # Nur bei ECHTEM Merge laufen (AK2/AK3): pull_request:[closed] feuert auch beim Schliessen-ohne-
    # Merge — das filtert bereits das precheck-if. Der precheck prüft zusätzlich die
    # Laufzeit-Invariante (noch kein ai:documented) statt des Trigger-Zeitpunkt-Payloads.
    # KEIN Fail-open-Arm wie in 01–05: Der Documenter ist die einzige Phase, deren Doppel-Lauf
    # nicht rückgängig zu machen ist (überschriebener Titel, zweiter Release-Kommentar), während
    # ein ausgefallener Lauf per workflow_dispatch nachholbar ist. Bricht der precheck ab,
    # bleibt die Doku bewusst aus.
    if: needs.precheck.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      PR: ${{ github.event.pull_request.number || github.event.inputs.pr-number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Startzeit merken (für weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 600))" >> "$GITHUB_OUTPUT"

      - name: Setup Claude Code (mit Memory-Load)
        id: setup
        uses: ./.github/actions/setup-claude
        with:
          needs-mcp: false
          tools-tier: review
          event-type: ${{ github.event_name }}
          ticket-ref: ${{ github.event.pull_request.number || github.event.inputs.pr-number }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          model: ${{ vars.CLAUDE_MODEL_DOCUMENTATION || 'haiku' }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          zai-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}
          openrouter-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          tailscale-exit-node: ${{ vars.TAILSCALE_EXIT_NODE }}
          memory-load: 'true'
          expect-memory: 'true'

      - name: 🔧 Phase 0 - Labels sicherstellen (deterministisch, vor Claude)
        # gh pr edit --add-label bricht hart ab ("X not found"), wenn ein Label im Repo fehlt.
        # Deshalb hier idempotent alle Labels anlegen, die Claude setzen kann: ai:documented +
        # die fünf release:* + release:ignore. create_label überspringt vorhandene; schlägt der
        # List-Abruf fehl (transienter gh-Ausfall), wird nicht angelegt statt zu crashen.
        # Bleibt deterministischer Bash-Helper — NICHT im LLM-Prompt.
        id: labels
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
        run: |
          set -euo pipefail

          if existing="$(gh label list --repo "$REPO" --json name | jq -r '.[].name')"; then
            fetch_ok=1
          else
            existing=""
            fetch_ok=0
            echo "⚠️ Label-Liste nicht abrufbar — überspringe Erstellung (idempotent, kein Crash)."
          fi
          create_label() {
            local name="$1" color="$2" desc="$3"
            if [ "$fetch_ok" = "0" ]; then
              echo "⏭️ Label '$name': Abruf war nicht autoritativ, überspringe Erstellung."
              return 0
            elif grep -qx "$name" <<<"$existing"; then
              echo "✅ Label '$name' existiert bereits"
            else
              echo "📝 Erstelle Label '$name'..."
              gh label create "$name" --repo "$REPO" --color "$color" --description "$desc"
            fi
          }
          create_label "ai:documented" 0075ca "Automatically documented by AI"
          create_label "release:feature" a2eeef "New feature"
          create_label "release:fix" d73a4a "Bug fix"
          create_label "release:improvement" a2eeef "Improvement"
          create_label "release:breaking-change" b60205 "Breaking change"
          create_label "release:engineering" cfd3d7 "Internal (no release note)"
          create_label "release:ignore" cfd3d7 "Ignored by release pipeline"

      - name: 🔍 PR-Fakten deterministisch erheben
        # Bot-Erkennung + Conventional-Commits-Titelprüfung sind Regel-Logik, kein LLM-Job
        # (s. .github/scripts/pr-doc-facts.sh). Fail-open: bei facts_ok=false laufen Shortcut
        # und Claude-Pfad normal (Bot-PRs fielen dann notfalls nur in die Engineering-Kategorie,
        # das release.yml schließt Bot-Autoren zusätzlich per exclude.authors aus).
        id: facts
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
        run: |
          bash .github/scripts/pr-doc-facts.sh --repo "$REPO" --pr "$PR" >> "$GITHUB_OUTPUT"

      - name: ⏭️ Bot-/Ignore-Kurzschluss (deterministisch, ohne LLM)
        # Dependency-Bot-PRs (Renovate/Dependabot) und bereits als release:ignore markierte PRs:
        # nur Labels setzen, den kompletten LLM-Lauf (Setup, Diff-Analyse, Rendering) überspringen.
        # ai:documented sichert hier die Idempotenz-Invariante, release:ignore nur im Bot-Fall —
        # ein vorhandenes release:ignore wird nicht erweitert/umgedeutet.
        id: shortcut
        if: steps.setup.outputs.configured == 'true' && (steps.facts.outputs.bot_skip == 'true' || steps.facts.outputs.already_ignored == 'true')
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
        run: |
          if [ "${{ steps.facts.outputs.bot_skip }}" = "true" ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label release:ignore
            echo "skip_reason=dependency-bot" >> "$GITHUB_OUTPUT"
          else
            echo "skip_reason=release-ignore" >> "$GITHUB_OUTPUT"
          fi
          gh pr edit "$PR" --repo "$REPO" --add-label ai:documented
          # Datenschutz (Issue #1021) gilt auch im Shortcut: Der Render-Schritt läuft
          # hier nicht, deshalb der direkte Bild-Sweep (best-effort, idempotent).
          bash .github/scripts/pr-image-strip.sh --repo "$REPO" --pr "$PR" \
            || echo "::warning title=Bild-Sweep fehlgeschlagen::Best-effort."
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=⏭️ Documenter übersprungen::PR #$PR — Shortcut (${{ steps.facts.outputs.bot_skip == 'true' && 'dependency-bot' || 'release:ignore' }}), nur Labels gesetzt."

      - name: 📝 PR-Analyse via Claude (schreibt nur /tmp/doc.json)
        id: claude
        if: steps.setup.outputs.configured == 'true' && steps.shortcut.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr-number }}
        run: |
          # Prompt liegt kanonisch in .github/prompts/documenter.md (Quelle fuer CI + lokale
          # Inspektion, analog ticket-spec/CI.md in Phase 3). Kein Inline-Heredoc mehr: der Vertrag
          # (doc.json-Schema, Mapping-Regeln) ist damit reviewbar ohne Workflow-Diff.
          {
            echo 'HINWEIS: Documenter ist Review-Tier — Code bleibt tabu, aber du SCHREIBST deine Phasen-Notiz (Details in den Memory-Abschnitten am Prompt-Ende).'
            echo
            cat .github/prompts/documenter.md
            cat .github/prompts/memory-read.md
            # Kein '>>' hier: der Block schreibt bereits nach /tmp/claude-prompt.txt, ein
            # zweiter Handle auf dieselbe Datei würde sich mit der äusseren Umleitung
            # überschreiben. stdout des Skripts fliesst in den Block.
            bash .github/scripts/render-memory-context.sh
            cat .github/prompts/memory-write.md
          } > /tmp/claude-prompt.txt

          # Fakten aus dem Facts-Schritt injizieren (Werte sind sichere Token: true/false,
          # Zahlen, Scope-Wörter). Fehlende Fakten (facts_ok=false) => Fallback-Defaults.
          sed -i "s/{{PR_NR}}/$PR/g" /tmp/claude-prompt.txt
          sed -i "s/{{TITLE_OK}}/${{ steps.facts.outputs.title_ok || 'unbekannt' }}/g" /tmp/claude-prompt.txt
          sed -i "s/{{SUGGESTED_TYPE}}/${{ steps.facts.outputs.suggested_type || 'chore' }}/g" /tmp/claude-prompt.txt
          sed -i "s/{{SUGGESTED_SCOPE}}/${{ steps.facts.outputs.suggested_scope || 'k.A.' }}/g" /tmp/claude-prompt.txt
          sed -i "s/{{LINKED_ISSUES}}/${{ steps.facts.outputs.linked_issues || 'keine' }}/g" /tmp/claude-prompt.txt
          sed -i "s/{{MEMORY_STATUS}}/${{ steps.setup.outputs.memory-status-text }}/g" /tmp/claude-prompt.txt
          # Aus memory-write.md (Dateiname der Phasen-Notiz) — der Documenter schreibt jetzt
          # ebenfalls einen Checkpoint, damit ein Re-Run nach Teilerfolg fortsetzen kann.
          sed -i "s/{{ISSUE_NR}}/${{ steps.setup.outputs.issue-number || github.event.pull_request.number }}/g" /tmp/claude-prompt.txt
          sed -i "s/{{PHASE}}/documenter/g" /tmp/claude-prompt.txt
          sed -i "s/{{SOFT_DEADLINE}}/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/claude-prompt.txt
          bash .github/scripts/assert-prompt-complete.sh /tmp/claude-prompt.txt

          rm -f /tmp/doc.json
          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Token & Kosten erfassen
        # always(): Auch ein abgebrochener Lauf hat Token verbraucht — gerade teure
        # Fehlläufe gehören in die Baseline, sonst sieht die alte Pipeline zu günstig aus.
        # issue-number löst den PR über closingIssuesReferences auf das Ticket auf, damit
        # alle Phasen EINES Tickets in derselben .costs-Datei landen.
        if: always() && steps.setup.outputs.configured == 'true'
        uses: ./.github/actions/record-cost
        with:
          issue: ${{ steps.setup.outputs.issue-number || github.event.pull_request.number || github.event.inputs.pr-number }}
          phase: documenter
          since-epoch: ${{ steps.starttime.outputs.epoch }}
          provider: ${{ steps.setup.outputs.llm-provider }}

      - name: App-Token für Kosten-Siegel holen
        # always(): Auch bei Fehlläufen die bereits erfassten Costs versiegeln
        if: always() && steps.setup.outputs.configured == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 💰 Kostenlauf versiegeln
        # Siegelt alle Artefakte dieses Tickets in .costs/<n>.json (idempotent).
        # Läuft immer, damit auch abgebrochene Läufe ihre Costs versiegeln.
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr-number }}
        run: |
          set -uo pipefail
          # Issue-Auflösung wie im catchup-Job: Closing-Issue, sonst PR-Nummer —
          # alle Phasen EINES Tickets landen in derselben .costs-Datei.
          issue="$(gh pr view "$PR" --repo "$REPO" --json closingIssuesReferences \
            --jq '[.closingIssuesReferences[].number] | first' 2>/dev/null || true)"
          issue="${issue:-$PR}"
          bash .github/scripts/seal-costs.sh --repo "$REPO" --issue "$issue"

      - name: Issue-Storage sichern (State-Branch)
        # Der Documenter schreibt jetzt ebenfalls: "am Ende jeder Phase speichern" gilt ohne
        # Ausnahme. Nutzen auch in der terminalen Phase: schlaegt er fehl und laeuft erneut,
        # setzt der Re-Run auf seinem eigenen Checkpoint auf statt bei null.
        if: always() && steps.setup.outputs.configured == 'true'
        uses: ./.github/actions/issue-state-save
        id: save
        with:
          issue-number: ${{ steps.setup.outputs.issue-number || github.event.pull_request.number || github.event.inputs.pr-number }}
          phase: documenter

      - name: 🔍 Notiz-Post-Assertion (Claude-Pfad muss neue Phasen-Notiz schreiben)
        # Spiegelstück zur Label-Post-Assertion unten (#1010 AK2): Der Save meldet nur noch
        # NEUE Notizen (Blob-Diff gegen den State-Branch) — ein grüner Lauf ohne neue
        # .ai-memory/issue-*.md bedeutet, Claude hat den Checkpoint vergessen. Fail-hard
        # statt stiller Speicher-Schein (Beobachtungsfall Run 32803685957 aus #1008).
        # Bot-/Ignore-Shortcut läuft bewusst ohne Claude und bleibt ausgenommen (analog
        # Bedingung des Claude-Steps); auch ein leerer/fehlender Output zählt als Verstoß.
        if: always() && steps.setup.outputs.configured == 'true' && steps.shortcut.outputs.skip != 'true'
        run: |
          new_notes="${{ steps.save.outputs.new-notes }}"
          if [ "$new_notes" -ge 1 ] 2>/dev/null; then
            echo "::notice title=✅ Phasen-Notiz gesichert::${new_notes} neue Notiz(en) im Issue-Storage."
          else
            echo "::error title=❌ Documenter ohne neue Phasen-Notiz::Claude-Pfad lief ohne neu geschriebene .ai-memory/issue-*.md — Storage-Commit enthält nur restaurierte Notizen/state.json. Re-Run mit Checkpoint erforderlich."
            exit 1
          fi

      - name: 🖨️ Rendern — Titel/Body/Kommentar/Labels deterministisch
        # Alle Schreibzugriffe in einem Schritt: Titel-Rename, Body-Marker-Splice, GENAU EIN
        # ai-documenter-Kommentar (PATCH statt Duplikat), Labels (ai:documented zuletzt).
        # Läuft BEWUSST auch bei fehlgeschlagenem/abwesendem Claude-Schritt: das Skript hat
        # einen Fallback-Pfad (Minimal-Kommentar + ai:documented + release:engineering), denn
        # der fail-closed-Precheck macht einen Re-Run nach gesetztem ai:documented unmöglich —
        # ein roter Job ohne Fallback wäre eine Sackgasse.
        id: render
        if: always() && steps.setup.outputs.configured == 'true' && steps.shortcut.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
        run: |
          bash .github/scripts/pr-doc-render.sh --repo "$REPO" --pr "$PR" --doc /tmp/doc.json

      # Kein Issue-Storage-Save (im Gegensatz zu 01-05): der Documenter ist terminal, der
      # nachfolgende Teardown (🧹 Issue-Storage abbau) löscht den State-Branch ohnehin. Ein
      # Save wäre save-then-delete (redundant).

      - name: 🏷️ Label-Post-Assertion (ai:documented muss am PR hängen)
        # Erfolgskriterium des Documenter ist nicht ein Review-Verdict, sondern dass ai:documented
        # am PR hängt. Fehlt es (auch nach Retry für API-Replikationsverzögerung) → harter Fehler:
        # Claude hat vermutlich nicht gearbeitet. release:* bleibt best-effort (|| true).
        # Ohne steps.claude.outcome-Klausel: die Assertion deckt auch den Bot-SHORTCUT-Pfad ab,
        # in dem ai:documented deterministisch ohne Claude gesetzt wird.
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
        run: |
          documented="false"
          for attempt in 1 2 3 4; do
            if gh pr view "$PR" --repo "$REPO" --json labels \
              --jq '[.labels[].name] | any(. == "ai:documented")' 2>/dev/null | grep -q true; then
              documented="true"
              break
            fi
            [ "$attempt" -lt 4 ] && sleep "$attempt"
          done
          if [ "$documented" != "true" ]; then
            echo "::error title=❌ Documenter ohne ai:documented::PR #$PR hat nach Claudes Lauf kein ai:documented-Label — Claude hat vermutlich nicht gearbeitet."
            exit 1
          fi
          echo "::notice title=✅ Dokumentation abgeschlossen::PR #$PR — ai:documented gesetzt."

      - name: 🧹 Issue-Storage stehen lassen (Abbau macht der Hygiene-Sweep)
        # GEÄNDERT gegenüber ADR 0006 Punkt 6: Der Documenter löscht den State-Branch NICHT mehr.
        #
        # Grund: Er schreibt seit dieser Änderung selbst eine Phasen-Notiz — den Speicher im
        # selben Lauf anzulegen und wieder wegzuräumen ist widersprüchlich. Und ein Ticket ist
        # mit dem Merge nicht zwingend zu Ende: Re-Open, Nachtrags-PR oder ein Documenter-Re-Run
        # fänden nach dem Löschen nichts mehr vor und begännen bei null.
        #
        # Der Abbau bleibt deterministisch, nur später: der Sweep in cache-cleanup.yml entfernt
        # ai/state/issue-*-Branches, deren Issue GESCHLOSSEN ist und deren letzter Commit älter
        # als 7 Tage ist. Damit räumt genau eine Stelle auf statt zweier, und das Zeitfenster
        # deckt Nacharbeit ab.
        if: steps.setup.outputs.configured == 'true'
        run: |
          echo "::notice title=🗄️ Issue-Storage bleibt::State-Branch wird nicht mehr im Documenter gelöscht — der Hygiene-Sweep (Issue geschlossen + >7 Tage) räumt ihn ab. Nacharbeit am Ticket findet den Kontext dadurch noch vor."

      - name: 📋 Ergebnis zusammenfassen
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          OUTCOME: ${{ steps.claude.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
          SKIP_REASON: ${{ steps.shortcut.outputs.skip_reason }}
        run: |
          labels="$(gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          if [ -n "$SKIP_REASON" ]; then
            echo "::notice title=✅ Documenter übersprungen::PR #$PR — $SKIP_REASON (nur Labels, kein LLM-Lauf)."
          elif [ "$RENDER_OUTCOME" = "success" ]; then
            echo "::notice title=✅ Documenter erfolgreich::PR #$PR"
          elif [ "$OUTCOME" = "cancelled" ] || [ "$RENDER_OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Documenter abgebrochen::PR #$PR"
          else
            echo "::error title=❌ Documenter fehlgeschlagen::PR #$PR"
          fi
          {
            echo "### PR-Documenter #$PR"
            if [ -n "$SKIP_REASON" ]; then
              echo "- Shortcut: \`${SKIP_REASON}\` (kein LLM-Lauf)"
            else
              echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
              echo "- Render-Schritt: \`${RENDER_OUTCOME:-unbekannt}\`"
            fi
            echo "- Labels: ${labels:-keine}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🩺 Z.AI Fair-Usage-Check (1313)
        # Rohausgabe des Claude-Laufs auf z.ai-Fehler 1313 (Fair Usage) durchsuchen
        # und Ergebnis als Annotation + Job-Summary sichtbar machen.
        if: always()
        uses: ./.github/actions/llm-fair-usage-check

  seal-costs-catchup:
    name: Kosten-Siegel nachziehen
    # Eigenständiger Retry-Pfad für fehlgeschlagene Siegel: Der Documenter-Precheck
    # bricht bei gesetztem ai:documented ab (Idempotenz gegen Doppel-Dokumentation) —
    # genau dann brauchte der Seal bisher einen Weg, der an derselben Invariante
    # hing. Dieser Job läuft NUR den Daten-Siegel (kein LLM, kein Rendering):
    # per workflow_dispatch nachträglich für bereits dokumentierte PRs.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Checkout + Skripte; der Seal-Commit läuft über das App-Token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: App-Token holen
        # Gleiche Erzeugung wie setup-claude/deploy: unscoped = volle Installations-
        # Rechte (Contents:Write für den Seal-Commit, Actions:Read für Artefakte).
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 💰 Kosten-Siegel nachziehen
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr-number }}
        run: |
          set -uo pipefail
          # Laufzeit-Guard: dispatch auf einen NICHT gemergten PR wäre ein No-op mit
          # falschem Signal — offen melden statt leise siegeln. Bewusst --json state
          # (`.state == "MERGED"`): `merged` ist KEIN gültiges gh-JSON-Feld — der
          # unbekannte Feldname crasht gh, das `|| echo false` machte daraus im ersten
          # Live-Lauf die Falschmeldung „nicht gemergt" für längst gemergte PRs.
          if [ "$(gh pr view "$PR" --repo "$REPO" --json state --jq '.state == "MERGED"' 2>/dev/null || echo false)" != "true" ]; then
            echo "::notice title=Catch-up übersprungen::PR #$PR ist nicht gemergt — nichts nachzuziehen."
            exit 0
          fi
          # Issue-Auflösung wie im Documenter-Job: Closing-Issue, sonst PR-Nummer —
          # alle Phasen EINES Tickets landen in derselben .costs-Datei.
          issue="$(gh pr view "$PR" --repo "$REPO" --json closingIssuesReferences \
            --jq '[.closingIssuesReferences[].number] | first' 2>/dev/null || true)"
          issue="${issue:-$PR}"
          bash .github/scripts/seal-costs.sh --repo "$REPO" --issue "$issue"
