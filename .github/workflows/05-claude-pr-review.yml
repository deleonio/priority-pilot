name: 5/6 Review

# ⚠️ Der `name:` ist lastend: das workflow_run-Allowlist in claude-pr-gate-merge.yml matcht ihn
#    exakt ("5/6 Review"). Umbenennen schaltet das Gate lautlos ab → stummes Gate. ACHTUNG: es
#    gibt KEINEN Contract-Test für diese Kopplung (ADR #567 — Workflows bleiben ungetestet), ein
#    Rename fällt also lautlos durch — vor jeder `name:`-Änderung die Stelle manuell mitpflegen.

# Reviewt einen Pull Request im Kreuzverhör, sobald er das Label
# "ai:needs-review" trägt.
# Setzt **Claude Code** ein; Provider via `vars.LLM_PROVIDER` (zai|claude), aufgelöst in setup-claude.
#   - Findings → ai:needs-fixup (→ Fixup)
#   - Entscheidungs-Findings ("Mensch entscheidet") → ai:reviewed + ai:needs-human (→ wartet auf Mensch)
#   - sauber 🟢 → ai:reviewed (→ Gate-Merge)
# Ändert KEINEN Code.
#
# CONCURRENCY: Statische Gruppe pro Phase (globale Serialisierung, FIFO). Der `precheck`-Job
# prüft den LABEL-IST-ZUSTAND zur LAUFZEIT — queued Runs würden mit dem Label-Zustand zum
# TRIGGER-Zeitpunkt falsch wiederholen. Der frühere Supersede-Effekt (cancel-in-progress: true
# verdrängte den laufenden Review bei Neu-Triggern) wird durch den Autolabeler kompensiert
# (pr-needs-review-label.yml cancelt bei menschlichem Push zuerst alte 05/06-Runs des Branches).

on:
  pull_request:
    types: [labeled]

concurrency:
  group: claude-pr-review
  cancel-in-progress: false
  # queue: max — OHNE dies hält GitHub pro Gruppe nur EINEN pending-Run: jeder neue
  # Run cancelt den wartenden (`queue: single` ist der Default). Mit statischem,
  # ticket-unabhängigem Key hätte ein Label-Burst über mehrere Tickets die
  # wartenden Läufe still verworfen — Trigger-Label klebt, kein Lauf, kein Notice.
  # `max` = bis zu 100 pending, FIFO. Unvereinbar mit cancel-in-progress: true.
  queue: max

jobs:
  precheck:
    # Unveränderliche Event-Fakten filtern hier — inkl. des FORK-GUARDS. Der ist an dieser
    # Stelle sicherheitsrelevant: `actions/checkout` holt bei pull_request den Merge-Ref, also
    # PR-Code, und die lokale Action samt Skript würde daraus ausgeführt. Stünde der Guard erst
    # am Hauptjob, führte ein Fork-PR mit manipuliertem check-phase-label.sh eigenen Bash aus,
    # sobald irgendjemand ein Label setzt. Vor dieser Umstellung gab es für Fork-PRs gar keinen
    # Checkout in 04.
    if: >-
      ${{ github.event.label.name == 'ai:needs-review'
          && github.event.pull_request.head.repo.full_name == github.repository }}
    # Label-IST-Zustand zur Laufzeit: ai:needs-review muss JETZT (nach dem Warten in der
    # globalen Phasen-Queue) noch am PR kleben und der PR offen + nicht-draft sein.
    # Soll-Werte stehen zentral in .github/scripts/check-phase-label.sh; hier wird nur der
    # Phasen-Name übergeben.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # lokale Action + Skript auschecken
      pull-requests: write # Abbruchfall der Modellwahl setzt ai:needs-human + Begründung
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      model: ${{ steps.model.outputs.model }}
      model_abort: ${{ steps.model.outputs.abort }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Label-Pre-Check (IST-Zustand zur Laufzeit)
        id: check
        uses: ./.github/actions/check-phase-label
        with:
          phase: review
          ticket: ${{ github.event.pull_request.number }}

      - name: Modellwahl aus ai:model:*-Label
        # NACH dem Phasen-Check: Ein konsumierter Trigger soll nicht wegen einer fehlenden
        # Modellwahl ai:needs-human setzen — der Lauf ist dann ohnehin ein No-op.
        if: steps.check.outputs.proceed == 'true'
        id: model
        uses: ./.github/actions/resolve-model
        with:
          ticket: ${{ github.event.pull_request.number }}
          kind: pr

  review:
    needs: precheck
    # `result == 'failure'` ist FAIL-OPEN und beabsichtigt: das Skript fällt bei API-Fehlern
    # bewusst auf "laufen lassen" zurück, aber ein Fehler AUSSERHALB (Checkout, Timeout,
    # Runner-Ausfall) würde den Hauptjob sonst stumm überspringen — Trigger konsumiert, niemand
    # arbeitet, nichts re-armt. Ein übersprungener precheck (result == 'skipped', No-op-Trigger
    # ODER Fork-PR) erfüllt keine der beiden Klauseln und lässt den Hauptjob korrekt entfallen —
    # der Fork-Guard aus dem precheck-if wirkt dadurch weiterhin auch für den Hauptjob.
    if: >-
      ${{ always()
          && needs.precheck.outputs.model_abort != 'true'
          && (needs.precheck.outputs.proceed == 'true' || needs.precheck.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    permissions:
      contents: read
      id-token: write
      actions: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Startzeit merken (für weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 600))" >> "$GITHUB_OUTPUT"
          # Erklärungs-Gate (needs-human-explain.sh): Als Erklärung für
          # ai:needs-human zählen nur Kommentare dieses Laufes. 5 min Toleranz
          # nach unten decken Queue-/Checkout-Zeit vor dem LLM-Lauf ab.
          echo "since_epoch=$((now - 300))" >> "$GITHUB_OUTPUT"

      - name: Setup Claude Code (mit Memory-Load)
        id: setup
        uses: ./.github/actions/setup-claude
        with:
          needs-mcp: true
          tools-tier: review
          event-type: ${{ github.event_name }}
          ticket-ref: ${{ github.event.pull_request.number }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          # Modellwahl kommt aus dem ai:model:*-Label (precheck), NICHT mehr statisch:
          # der PR erbt sie vom verknüpften Issue, ein Label am PR selbst gewinnt.
          # vars.CLAUDE_MODEL_PR_REVIEW bleibt als manueller Not-Override wirksam.
          # Dritter Fallback ist der frühere Phasen-Default und KEIN Schmuck: Läuft ein PR
          # ohne Analyse-Herkunft, liefert der Resolver bewusst ein leeres Modell. Leer
          # bedeutet in setup-claude aber „kein Alias auflösen" — bei zai/openrouter bleibt
          # dann das Modell aus settings.local.json stehen, das der Provider als
          # `unrecognized_model` ablehnen kann (beobachtet an PR #916). Der Literal-Default
          # stellt exakt das Verhalten von vor der Modellwahl wieder her.
          model: ${{ vars.CLAUDE_MODEL_PR_REVIEW || needs.precheck.outputs.model || 'opus' }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          zai-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}
          openrouter-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          tailscale-exit-node: ${{ vars.TAILSCALE_EXIT_NODE }}
          memory-load: 'true'
          expect-memory: 'true'

      # Kein Supersede-Check mehr: Die globale Phasen-Serialisierung (statische
      # concurrency-Gruppe) lässt Review-Läufe desselben Branches nie parallel laufen, und der
      # precheck dedupliziert über den Label-IST-Zustand. Neu-Triggern bei menschlichem Push
      # übernimmt der Autolabeler (cancel + Neu-Setzen von ai:needs-review).

      - name: Trigger-Label konsumieren (Start-Konsum)
        # Der precheck (eigener Job) verifiziert ai:needs-review zu SEINEM Zeitpunkt; bis hier
        # her vergeht Setup-Zeit. Dieser Step konsumiert das Label JETZT atomar (Pipeline-
        # Bestand → leer) — mit --expect-Guard: Hat zwischenzeitlich ein anderer Akteur
        # geschrieben (z. B. Gate auf ai:needs-fixup), verwirft dieser Lauf sich selbst
        # (proceed=false) statt den neueren Zustand zu überschreiben. Nach dem Konsum skippt
        # jeder in der Phasen-Queue wartende Run im precheck (Label ist weg) — ein Review
        # parallel zum Fixup ist damit strukturell ausgeschlossen (PR #890).
        # Seit PR #903 laeuft check-phase-label.sh frisch direkt vor dem Konsum — needs-human
        # oder Phasen-Mismatch stoppen hier, bevor irgendein Label bereinigt wird
        # (zusaetzlich verwirft label-transition.sh selbst jede Transition, die ein klebendes
        # ai:needs-human entfernen wuerde).
        id: consume
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # User-Direktive (PR #903): Erst die Label-Phasen-Pruefung FRISCH (Phasen-Match +
          # ai:needs-human), DANN bereinigen. Der precheck-Job lief minutenalt und wird bei
          # eigenem Job-Failure bewusst fail-open umgangen — diese Pruefung hier ist die
          # verbindliche vor jedem Label-Write. proceed=false => Abbruch, Labels UNANGETASTET.
          CHECK=""
          if ! CHECK="$(bash .github/scripts/check-phase-label.sh \
            --repo "$GITHUB_REPOSITORY" --phase review --ticket "$PR")"; then
            # exit 2 = Konfigurationsfehler (unbekannte Phase) — bewusst rot wie im precheck.
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::error title=❌ Phasen-Prüfung fehlgeschlagen::check-phase-label.sh exited non-zero. Trigger bleibt bewaffnet."
            exit 1
          fi
          c_proceed="$(printf '%s\n' "$CHECK" | sed -n 's/^proceed=//p')"
          c_reason="$(printf '%s\n' "$CHECK" | sed -n 's/^reason=//p')"
          if [ "$c_proceed" != "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "reason=${c_reason:-phasen-pruefung}" >> "$GITHUB_OUTPUT"
            echo "::notice title=⏭️ Review verworfen::Frische Phasen-Prüfung: ${c_reason:-Label-Ist-Zustand passt nicht zur Phase} — Labels unangetastet."
            exit 0
          fi

          OUT=""
          if ! OUT="$(bash .github/scripts/label-transition.sh \
            --repo "$GITHUB_REPOSITORY" --pr "$PR" \
            --set-none --expect ai:needs-review)"; then
            # Script-Exit != 0: PUT endgültig fehlgeschlagen (Diagnose via stderr im
            # Job-Log). Bewusst ROT enden statt fail-open: Der Trigger bleibt bewaffnet
            # (kein Zustandsverlust), ein Re-Push re-triggert. Ein stiller Weiterlauf
            # wuerde die Single-Runner-Garantie des Konsums aushebeln.
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::error title=❌ Start-Konsum fehlgeschlagen::label-transition.sh fehlgeschlagen (Details: letzte gh-Fehlerzeile im Log). Trigger bleibt bewaffnet."
            exit 1
          fi
          applied="$(printf '%s\n' "$OUT" | sed -n 's/^applied=//p')"
          state="$(printf '%s\n' "$OUT" | sed -n 's/^state=//p')"
          reason="$(printf '%s\n' "$OUT" | sed -n 's/^reason=//p')"
          echo "reason=${reason:-}" >> "$GITHUB_OUTPUT"
          # read-failed = fail-open (analog zum precheck): Phase lieber einmal zu viel
          # laufen lassen als eine Freigabe zu verlieren. Label bleibt dann unkonsumiert —
          # der precheck des Folge-Laufs dedupliziert.
          if [ "$applied" = "true" ] || [ "$state" = "read-failed" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ai:needs-review konsumiert (Start-Konsum) — Review läuft."
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=⏭️ Review verworfen::Trigger nicht mehr unverändert vorhanden — ${reason:-neuerer Zustand regiert}."
          fi

      - name: 🔍 Titel-Fakten deterministisch erheben
        # Conventional-Commits-Prüfung des PR-Titels VOR dem Merge (Regel-Logik, s.
        # .github/scripts/pr-doc-facts.sh --mode title-only). Post-Merge-Umbenennen im
        # Documenter ist nur noch Backstop — der Merge-Commit-Subject steht dann schon.
        # Bewusst KEIN eigener CI-Check-Job: ein roter Check setzt ai:needs-fixup →
        # Fixup läuft → Titelkorrektur erzeugt keinen Commit → No-Progress-Erkennung
        # schlägt zu → ai:needs-human. Sackgasse; der Reviewer hat gh + vollen Kontext.
        id: facts
        if: steps.setup.outputs.configured == 'true' && steps.consume.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          bash .github/scripts/pr-doc-facts.sh --repo "$REPO" --pr "$PR" --mode title-only >> "$GITHUB_OUTPUT"

      - name: Kreuzverhör-Review via Claude
        id: claude
        if: steps.setup.outputs.configured == 'true' && steps.consume.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Prompt liegt kanonisch in .github/prompts/review.md (Quelle fuer CI; Methode:
          # Skill .claude/skills/review-kreuzverhoer/SKILL.md). Snippet-Platzhalter ({{ISSUE_NR}}, {{PHASE}},
          # {{MEMORY_STATUS}}) werden erst NACH dem Anhaengen der Memory-Snippets substituiert.
          sed -e "s/{{PR_NR}}/${{ github.event.pull_request.number }}/g" \
              -e "s/{{TITLE_OK}}/${{ steps.facts.outputs.title_ok || 'unbekannt' }}/g" \
              -e "s/{{SUGGESTED_TYPE}}/${{ steps.facts.outputs.suggested_type || 'chore' }}/g" \
              -e "s/{{SUGGESTED_SCOPE}}/${{ steps.facts.outputs.suggested_scope || 'k.A.' }}/g" \
              -e "s/{{SOFT_DEADLINE}}/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" \
              .github/prompts/review.md > /tmp/claude-prompt.txt

          # Memory-Snippets anhängen (Phase 5 = Review: restauriert + schreibt Review-Notizen;
          # {{ISSUE_NR}} aus dem Setup-Output, da dieser Workflow am PR hängt, nicht am Issue)
          cat .github/prompts/memory-read.md >> /tmp/claude-prompt.txt
          bash .github/scripts/render-memory-context.sh >> /tmp/claude-prompt.txt
          cat .github/prompts/memory-write.md >> /tmp/claude-prompt.txt
          sed -i "s/{{ISSUE_NR}}/${{ steps.setup.outputs.issue-number }}/g" /tmp/claude-prompt.txt
          sed -i "s/{{PHASE}}/review/g" /tmp/claude-prompt.txt
          sed -i "s/{{MEMORY_STATUS}}/${{ steps.setup.outputs.memory-status-text }}/g" /tmp/claude-prompt.txt
          bash .github/scripts/assert-prompt-complete.sh /tmp/claude-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Token & Kosten erfassen
        # always(): Auch ein abgebrochener Lauf hat Token verbraucht — gerade teure
        # Fehlläufe gehören in die Baseline, sonst sieht die alte Pipeline zu günstig aus.
        # issue-number löst den PR über closingIssuesReferences auf das Ticket auf, damit
        # alle Phasen EINES Tickets in derselben .costs-Datei landen.
        if: always() && steps.setup.outputs.configured == 'true'
        uses: ./.github/actions/record-cost
        with:
          issue: ${{ steps.setup.outputs.issue-number || github.event.pull_request.number }}
          phase: review
          since-epoch: ${{ steps.starttime.outputs.epoch }}
          provider: ${{ steps.setup.outputs.llm-provider }}

      - name: Issue-Storage sichern (State-Branch)
        # ADR 0006: Fetch-then-Commit auf ai/state/issue-{N} — der Branch IST der Speicher
        # (unbefristet, versioniert, kein Artefakt-/Cache-Transport mehr; Cache-Writes sind
        # für diese Trigger platform-seitig gesperrt, s. setup-claude Kopf-Kommentar).
        if: always() && steps.setup.outputs.configured == 'true'
        uses: ./.github/actions/issue-state-save
        with:
          issue-number: ${{ steps.setup.outputs.issue-number || github.event.pull_request.number }}
          phase: review

      - name: Label-Post-Assertion (Labels via App-Token force-setzen)
        if: always() && steps.setup.outputs.configured == 'true' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
          SINCE_EPOCH: ${{ steps.starttime.outputs.since_epoch }}
        run: |
          # Verdict-Kanal: Datei primär (Claude schreibt /tmp/claude-verdict per Bash —
          # robuster als Log-Parsing, dessen Brüche PR #524/#530 auslösten), Log-Grep
          # nur noch Übergangs-Fallback, solange ältere Prompt-Versionen unterwegs sind.
          verdict=""
          if [ -f /tmp/claude-verdict ]; then
            verdict="$(tr -d -c 'A-Za-z0-9-' < /tmp/claude-verdict)"
          fi
          if [ -z "$verdict" ] && [ -f /tmp/claude-output.log ]; then
            verdict="$(grep 'VERDICT:' /tmp/claude-output.log | tail -1 | sed -E 's/^.*VERDICT:[[:space:]]*//' | tr -d -c 'A-Za-z0-9-' || true)"
          fi
          echo "Claude-Verdict: '${verdict:-keins}'"

          # Erklärungs-Gate: Nur Kommentare dieses Laufes gelten als Erklärung
          # für ai:needs-human. GNU-date (-d @epoch): nur Ubuntu-Runner.
          SINCE_ISO="$(date -u -d "@${SINCE_EPOCH:-0}" +%Y-%m-%dT%H:%M:%SZ)"

          # Review-Marker (<!-- ai-review -->) nachsehen — MIT Retry: unmittelbar nach Claudes Post
          # liefert die GitHub-API den Kommentar (Replikationsverzögerung) gelegentlich noch nicht.
          # Ohne Retry endete der Review hier fälschlich ❌, obwohl Claude Verdict + Kommentar
          # geliefert hatte (PR #524: Review↔Fixup-Loop).
          ARTIFACTS_OK="false"
          for attempt in 1 2 3 4; do
            REVIEW_COMMENT_ID="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments \
              --jq '[.comments[] | select(.body | test("<!-- ai-review -->"))] | first | .id' 2>/dev/null || echo "")"
            if [ -n "$REVIEW_COMMENT_ID" ] && [ "$REVIEW_COMMENT_ID" != "null" ]; then
              ARTIFACTS_OK="true"
              break
            fi
            [ "$attempt" -lt 4 ] && sleep "$attempt"
          done

          if [ "$ARTIFACTS_OK" != "true" ]; then
            # Marker auch nach Retry nicht gefunden. Nur ein harter Fehler, wenn Claude KEIN klares
            # Verdict lieferte (dann fehlt jeder Artefakt-Nachweis — Claude hat vermutlich nicht
            # gearbeitet). Bei klarem Verdict ist der Kommentar ein Hilfssignal, das Verdict primär:
            # wir setzen das Label nach Verdict und warnen nur. Ohne diese Unterscheidung würde ein
            # fehlender Marker ein klares reviewed zu needs-fixup degradieren und einen
            # Fixup-Loop auslösen (PR #524: Claude postete teils keinen Marker-Kommentar).
            case "$verdict" in
              reviewed|needs-fixup|needs-human)
                echo "::warning title=Review-Kommentar fehlt::Kein <!-- ai-review -->-Kommentar am PR (auch nach Retry). Claude-Verdict '${verdict}' ist klar → Label nach Verdict, kein harter Fehler. Marker wird vom Workflow angelegt."
                # Create-or-Update (#530): Claude postet den Sammelkommentar gelegentlich
                # nicht. Fehlt der Marker (leere REVIEW_COMMENT_ID), legt der Workflow ihn
                # selbst an — existiert er, bleibt er unangetastet: kein Duplikat, kein Überschreiben.
                if [ -z "$REVIEW_COMMENT_ID" ] || [ "$REVIEW_COMMENT_ID" = "null" ]; then
                  gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "<!-- ai-review --> 🧭 Review-Marker vom Workflow gesetzt — Claude-Verdict \`${verdict}\`, aber kein Sammelkommentar gepostet (PR #524/#530)." 2>/dev/null || true
                fi
                ;;
              *)
                echo "::error title=❌ Review ohne Artefakt::Kein <!-- ai-review -->-Kommentar UND kein klares Verdict ('${verdict:-keins}'). Claude hat vermutlich nichts geleistet."
                exit 1
                ;;
            esac
          fi

          # Ungültiges/fehlendes Verdict (bei vorhandenem Marker-Kommentar): kein Raten
          # mehr in needs-fixup — der alte Default konnte einen Fixup-Loop ganz ohne
          # begründetes Verdict starten. terminal an den Menschen; der needs-human-Pfad
          # unten erfasst es (Sektion fehlt → Diagnose-Zweig mit Run-Link + Log-Auszug).
          case "$verdict" in
            reviewed|needs-fixup|needs-human) ;;
            *) verdict="needs-human" ;;
          esac

          if [ "$verdict" = "reviewed" ]; then
            allow='[]'
            delays=(2 3 5 8)
            for attempt in 1 2 3 4 5; do
              checks="$(gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --json name,bucket,workflow 2>/dev/null || echo '[]')"
              if [ -z "$checks" ]; then checks='[]'; fi
              # `.name != "precheck"` — analog zum Gate (claude-pr-gate-merge.yml): der
              # Label-Pre-Check laeuft unter demselben Workflow-Namen und darf das eigene
              # Allowlist-Urteil weder rot faerben noch has_reviewer vorzeitig erfuellen.
              allow="$(echo "$checks" | jq '[.[] | select(.workflow == "CI" or (.workflow == "5/6 Review" and .name != "precheck"))]')"
              has_ci="$(echo "$allow" | jq -r 'any(.[]; .workflow == "CI")')"
              has_reviewer="$(echo "$allow" | jq -r 'any(.[]; .workflow == "5/6 Review")')"
              if [ "$has_ci" = "true" ] && [ "$has_reviewer" = "true" ]; then break; fi
              if [ "$attempt" -lt 5 ]; then sleep "${delays[$((attempt - 1))]}"; fi
            done
            any_fail="false"
            if [ "$(echo "$allow" | jq 'length')" -gt 0 ]; then
              any_fail="$(echo "$allow" | jq -r 'any(.[]; .bucket == "fail")')"
            fi
            if [ "$any_fail" = "true" ]; then
              echo "::warning::Allowlist-Check rot → Downgrade zu needs-fixup"
              verdict="needs-fixup"
            else
              final="reviewed"
            fi
          fi

          if [ "$verdict" = "needs-human" ]; then
            final="needs-human"
          elif [ "$verdict" != "reviewed" ]; then
            final="needs-fixup"
          fi

          # EINE atomare Transition statt 4× remove + add: label-transition.sh ersetzt den
          # gesamten Pipeline-Bestand in EINEM API-Call — kein Zwischenzustand mit 0/2
          # Triggern, Nicht-Pipeline-Labels bleiben erhalten, und die Invariante
          # „ai:needs-fixup ⇒ kein ai:needs-review" gilt per Konstruktion (PR #890).
          # --expect none: Dieser Lauf hat seinen Trigger im Start-Konsum entfernt — ist
          # zwischenzeitlich ein NEUES Pipeline-Label erschienen, verwirft der Guard den
          # Write (neuere Entscheidung regiert, z. B. Autolabeler-Re-Arm bei Push).
          # Retries (Issue #613, Backoff 1s/2s/4s) leben IM Skript.
          apply_transition() { # $1 = Ziel-Labels (Komma-liste); Return 0=ok, 1=fehlschlagen, 2=Guard-Verwurf
            if ! OUT="$(bash .github/scripts/label-transition.sh \
                --repo "$GITHUB_REPOSITORY" --pr "$PR" --set "$1" --expect none)"; then
              return 1 # PUT nach 3 Retries endgültig fehlgeschlagen
            fi
            t_applied="$(printf '%s\n' "$OUT" | sed -n 's/^applied=//p')"
            t_state="$(printf '%s\n' "$OUT" | sed -n 's/^state=//p')"
            t_reason="$(printf '%s\n' "$OUT" | sed -n 's/^reason=//p')"
            if [ "$t_state" = "read-failed" ]; then
              echo "transition_read_failed: ${t_reason:-IST-Zustand unlesbar}" >&2
              return 1
            fi
            if [ "$t_applied" != "true" ]; then
              echo "::warning title=⏭️ Label-Write verworfen::${t_reason:-Guard}. Verdict '${verdict}' NICHT gesetzt — der neuere Zustand regiert."
              return 2
            fi
            return 0
          }
          # #613-Nachfolge: Der Notfall-Pfad (Transition endgültig fehlgeschlagen) eskaliert
          # terminal an den Menschen statt still zu enden — sonst: Trigger konsumiert,
          # kein Label, nichts re-armt.
          transition_failed() {
            echo "::error::Label-Transition fehlgeschlagen → ai:needs-human gesetzt"
            RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            {
              printf '%s\n\n' "⚠️ **Label-Race-Condition (#613): Label-Transition fehlgeschlagen**"
              printf '%s\n\n' "Label-Write nach 3 Retries fehlgeschlagen (Ziel-Verdict: '${verdict:-keins}'). Bitte manuell prüfen. Run: ${RUN_URL}"
              printf '%s\n' "**Checkliste:**"
              printf '%s\n' "- [ ] 1. Labels manuell prüfen und via \`ai:needs-review\` neu triggern"
            } > /tmp/needs-human-body.md
            bash .github/scripts/needs-human-explain.sh post --repo "$GITHUB_REPOSITORY" --pr "$PR" --body-file /tmp/needs-human-body.md
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ai:needs-human 2>/dev/null || true
          }

          rc=0
          if [ "$final" = "reviewed" ]; then
            # 🟢: Done-Label gesetzt — ai:reviewed ist gleichzeitig der Gate-Merge-Trigger.
            # Das Gate verifiziert zusätzlich, dass kein ai:needs-fixup/ai:needs-review/
            # ai:needs-human mehr klebt (Rename-hardening, Issue #851).
            apply_transition "ai:reviewed" || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::notice::Label gesetzt: ai:reviewed"
            fi
          elif [ "$final" = "needs-human" ]; then
            # Erklärungs-Gate (#848): Der alte Text verwies auf die Sektion
            # "## ⏸️ Entscheidungs-Findings ... Sammelkommentar oben" — die Sektion
            # existierte unter anderem Namen, "oben" war vage. lookup verifiziert
            # stattdessen per Substring (tolerant gg. Heading-Level/Emoji), dass
            # der ai-review-Kommentar DIESES Laufes die Sektion enthält, und
            # liefert Permalink + Finding-Titel. Fehlt sie: Diagnose-Fallback.
            # Kommentar vor Label-Setzen.
            GUARD="$(bash .github/scripts/needs-human-explain.sh lookup --repo "$GITHUB_REPOSITORY" --pr "$PR" --mode review-section --since "$SINCE_ISO")"
            GUARD_STATUS="$(printf '%s\n' "$GUARD" | sed -n 's/^status=//p')"
            GUARD_LINK="$(printf '%s\n' "$GUARD" | sed -n 's/^permalink=//p')"
            GUARD_FINDINGS="$(printf '%s\n' "$GUARD" | sed -n 's/^findings=//p')"
            {
              printf '%s\n\n' "⏸️ **Wartet auf menschliche Entscheidung (Review-Entscheidung)**"
              if [ "$GUARD_STATUS" = "found" ]; then
                printf '%s\n\n' "**Warum:** Dieser PR enthält Findings, die eine menschliche Entscheidung erfordern — die KI kann hier nicht alleine weiterarbeiten."
                [ -n "$GUARD_FINDINGS" ] && printf '%s\n\n' "**Entscheidungs-Findings:** ${GUARD_FINDINGS}"
                printf '%s\n\n' "**Erklärung (Optionen/Empfehlung, Sektion Entscheidungs-Findings):** ${GUARD_LINK}"
              else
                RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                printf '%s\n\n' "**Warum:** Verdict \`needs-human\`, aber der ai-review-Kommentar dieses Laufes enthält keine Sektion Entscheidungs-Findings — die Begründung ist nicht verifizierbar."
                printf '%s\n\n' "**Diagnose:** Run: ${RUN_URL} — Claudes letzte Ausgabezeilen können die Findings nennen."
                printf '%s\n' "<details><summary>Log-Auszug (letzte 25 Zeilen von /tmp/claude-output.log)</summary>"
                printf '\n%s\n' '```'
                bash .github/scripts/needs-human-explain.sh logtail
                printf '%s\n' '```'
                printf '%s\n\n' "</details>"
              fi
              printf '%s\n' "**Was du als Mensch beitragen/entscheiden solltest:**"
              if [ "$GUARD_STATUS" = "found" ]; then
                printf '%s\n' "- [ ] 1. Entscheidungs-Findings durchgehen (Erklärung oben verlinkt)"
              else
                # Kein toter Verweis (PR #848/#903): In diesem Zweig existiert KEIN Link —
                # die Sektion Entscheidungs-Findings fehlt im ai-review-Kommentar.
                printf '%s\n' "- [ ] 1. Findings aus dem Log-Auszug ableiten — der ai-review-Kommentar dieses Laufes enthält KEINE Sektion Entscheidungs-Findings"
              fi
              printf '%s\n' "- [ ] 2. Entscheidung treffen (Code anpassen / akzeptieren / Fixup-Anweisung)"
              printf '%s\n' "- [ ] 3. Label \`ai:needs-human\` entfernen"
              printf '%s\n' "- [ ] 4. Label \`ai:needs-review\` setzen → loest erneuten Review aus"
            } > /tmp/needs-human-body.md
            bash .github/scripts/needs-human-explain.sh post --repo "$GITHUB_REPOSITORY" --pr "$PR" --body-file /tmp/needs-human-body.md
            apply_transition "ai:needs-human,ai:reviewed" || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::notice::Labels gesetzt: ai:reviewed + ai:needs-human (wartet auf Mensch)"
            fi
          else
            # Kein ai:reviewed im findings-Pfad: Das Done-Label ist Gate-Trigger und
            # könnte vor diesem Write gelesen werden (TOCTOU-Fenster); der Fixup-Trigger
            # reicht als Übergang, die Review-Runde dokumentiert der Sammelkommentar.
            apply_transition "ai:needs-fixup" || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::notice::Label gesetzt: ai:needs-fixup"
            fi
          fi
          # Guard-Verwurf (rc=2) ist KEIN Fehler: Eine neuere Entscheidung regiert, dieser
          # Lauf hat nur noch seinen Sammelkommentar hinterlassen. Nur der echte
          # Schreib-Fehler (rc=1) eskaliert terminal.
          if [ "$rc" -eq 1 ]; then
            transition_failed
            exit 1
          fi

      - name: Bei Timeout PR-Kommentar (Alarm)
        if: always() && steps.setup.outputs.configured == 'true' && steps.claude.outcome == 'cancelled'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⚠️ **Review #${PR} – Timeout erreicht** Bitte manuell prüfen." 2>/dev/null || true

      - name: Ergebnis zusammenfassen
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          CONSUME_PROCEED: ${{ steps.consume.outputs.proceed }}
          CONSUME_REASON: ${{ steps.consume.outputs.reason }}
        run: |
          labels="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          if [ "$CONSUME_PROCEED" != "true" ]; then
            echo "::notice title=⏭️ Review verworfen::PR #${PR} — Trigger im Start-Konsum nicht mehr gültig (${CONSUME_REASON:-neuerer Zustand regiert})."
          elif [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Review erfolgreich::PR #${PR}"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Review abgebrochen"
          else
            echo "::error title=❌ Review fehlgeschlagen"
          fi
          {
            echo "### Kreuzverhör-Review #${PR}"
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Labels: ${labels:-keine}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🩺 Z.AI Fair-Usage-Check (1313)
        # Rohausgabe des Claude-Laufs auf z.ai-Fehler 1313 (Fair Usage) durchsuchen
        # und Ergebnis als Annotation + Job-Summary sichtbar machen.
        if: always()
        uses: ./.github/actions/llm-fair-usage-check

      - name: Review-Ergebnis prüfen (Label via API verifizieren)
        # proceed-Gate: Ein im Start-Konsum verworfener Lauf hat bewusst KEIN Label
        # geschrieben — die Verifikation würde ihn fälschlich rot machen.
        if: always() && steps.setup.outputs.configured == 'true' && steps.consume.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for i in 1 2 3 4 5; do
            labels_json="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]' 2>/dev/null || echo '[]')"
            needs_fixup="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:needs-fixup")')"
            reviewed="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:reviewed")')"
            needs_human="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:needs-human")')"
            if [ "$needs_fixup" = "true" ] || [ "$reviewed" = "true" ] || [ "$needs_human" = "true" ]; then break; fi
            if [ "$i" -lt 5 ]; then sleep 3; fi
          done
          echo "Labels verifiziert: needs_fixup=${needs_fixup:-?} reviewed=${reviewed:-?} needs_human=${needs_human:-?}"
          if [ "$needs_fixup" = "true" ]; then
            echo "::notice title=Review: Änderungen erforderlich::PR #${PR} – ai:needs-fixup gesetzt (Fixup läuft an), gültiges Ergebnis."
          elif [ "$reviewed" = "true" ]; then
            echo "::notice title=Review: reviewed::PR #${PR} – ai:reviewed gesetzt."
          elif [ "$needs_human" = "true" ]; then
            echo "::notice title=Review: Mensch entscheidet::PR #${PR} – ai:needs-human gesetzt, wartet auf menschliche Entscheidung."
          else
            echo "::error title=Review stecken geblieben::PR #${PR} – weder ai:needs-fixup noch ai:reviewed noch ai:needs-human gesetzt."
            exit 1
          fi
