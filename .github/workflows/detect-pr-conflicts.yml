name: Detect PR Conflicts

# Erkennt Merge-Konflikte in offenen PRs bei jedem Push auf main: Mechanisch
# lösbare Konflikte (Merge-Treiber aus .gitattributes) merged der Job selbst
# und pusht den Merge-Commit auf den PR-Branch — kein Fixup-Lauf nötig (#2099).
# Nur echte Konfliktmarker bekommen ai:needs-fixup samt Dateilisten-Kommentar;
# deren Auflösung übernimmt 04-claude-implement.yml (PR-Eingang).
#
# Muster: pr-needs-review-label.yml (App-Token), claude-pr-gate-merge.yml (DIRTY-Erkennung).

on:
  push:
    branches:
      - main

concurrency:
  group: pr-conflict-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ${{ vars.PHASE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Voraussetzung prüfen (GitHub-App-Secrets)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::GitHub-App-Secrets fehlen (APP_ID und/oder APP_PRIVATE_KEY) — Lauf wird übersprungen (kein Fehler). GitHub App anlegen, aufs Repo installieren und beide Werte als Repo-Secrets hinterlegen, damit die Pipeline läuft."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: GH_TOKEN-Fallback setzen (App-Token oder GITHUB_TOKEN)
        id: gh-token
        run: |
          APP_TOK="${{ steps.app-token.outputs.token }}"
          if [ -n "$APP_TOK" ] && [ "$APP_TOK" != "null" ]; then
            echo "token=$APP_TOK" >> "$GITHUB_OUTPUT"
            echo "::notice::Nutze GitHub-App-Token für gh-Befehle."
          else
            echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
            echo "::warning::App-Token nicht verfügbar — nutze GITHUB_TOKEN (Achtung: Label-Wechsel lösen ggf. keine Folge-Workflows aus)."
          fi

      # Checkout fuer label-transition.sh UND den mechanischen Auto-Merge
      # (fetch-depth: 0 — depth 1 pflanzt den main-Tip ohne Eltern, der Merge im
      # Auto-Merge-Schritt bricht mit "refusing to merge unrelated histories" ab;
      # persist-credentials: false — der Job schreibt nach GitHub via App-Token).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.preflight.outputs.configured == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Alle offenen PRs auf Merge-Konflikte prüfen
        id: scan
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Alle offenen PRs auflisten (kein --label-Filter: alle offenen PRs prüfen, nicht nur markierte)
          # --repo bleibt Pflicht: der Checkout oben dient NUR label-transition.sh, der Loop
          # laeuft bewusst repo-agnostisch ueber die API.
          # Renovate-PRs (Head-Branch `renovate/…`) sind ausgenommen: Ein Dependency-Bump
          # gehört keiner Pipeline-Phase, Renovate rebaset seine Branches bei Konflikt selbst
          # und mergt selbst. Ohne diesen Filter labelte jeder main-Push jeden konfliktbehafteten
          # Lockfile-PR mit ai:needs-fixup und startete darauf einen Fixup-/Review-Loop
          # (#1399, #1331, #1330 am 12.09.2026). Zweite Leine: Guard 0 in label-transition.sh
          # verwirft solche Transitionen ohnehin — hier wird zusätzlich gefiltert, damit der
          # Lauf nicht pro Bump eine irreführende Job-Summary schreibt.
          prs=$(gh pr list --repo "$REPO" --state open --json number,isDraft,headRepository,headRefName \
            --jq '.[] | select(.isDraft == false) | select(.headRepository.nameWithOwner == $ENV.REPO) | select(.headRefName | startswith("renovate/") | not) | .number')

          if [ -z "$prs" ]; then
            echo "Keine offenen Nicht-Draft-same-repo-PRs gefunden — nichts zu tun."
            exit 0
          fi

          for pr in $prs; do
            # Merge-Status und Labels abfragen
            view="$(gh pr view "$pr" --repo "$REPO" --json mergeable,mergeStateStatus,labels)"
            mergeable="$(echo "$view" | jq -r '.mergeable')"
            merge_state="$(echo "$view" | jq -r '.mergeStateStatus')"

            echo "PR #$pr: mergeable=$mergeable, mergeStateStatus=$merge_state"

            # UNKNOWN: No-op — GitHub berechnet Mergebarkeit asynchron direkt nach Push (kein Fehl-Positiv)
            if [ "$mergeable" = "UNKNOWN" ] || [ "$merge_state" = "UNKNOWN" ]; then
              echo "PR #$pr: UNKNOWN — No-op (async, Mergebarkeit wird noch berechnet)."
              continue
            fi

            # MERGEABLE: kein Konflikt — No-op
            if [ "$mergeable" = "MERGEABLE" ]; then
              echo "PR #$pr: MERGEABLE — kein Konflikt, No-op."
              continue
            fi

            # DIRTY / CONFLICTING: Konflikt erkannt — nur MERKEN (#2099): Erst versucht der
            # Folgeschritt einen mechanischen Merge (git wertet die Merge-Treiber aus
            # .gitattributes, GitHub bei der Mergeability nicht — MEMORY.md union-mergt lokal
            # sauber, während GitHub dirty meldet, Beleg PR #2084). Nur echte Konfliktmarker
            # verdienen einen Fixup-LLM-Lauf (früher 10-30 min serielle Queue für einen
            # Merge, den git selbst kann, Beleg PR #2085).
            if [ "$merge_state" = "DIRTY" ] || [ "$mergeable" = "CONFLICTING" ]; then
              head_ref="$(gh pr view "$pr" --repo "$REPO" --json headRefName --jq -r .headRefName)"
              echo "${pr} ${head_ref}" >> /tmp/dirty-prs.txt
              echo "PR #${pr} (${head_ref}): Konflikt erkannt (mergeable=$mergeable, state=$merge_state) — mechanischer Merge-Versuch folgt."
              {
                echo "- PR #${pr} (${head_ref}): Konflikt erkannt — mechanischer Merge-Versuch folgt."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "PR #$pr: Nicht sauber mergebar (mergeable=$mergeable, state=$merge_state) — No-op."
            fi
          done

          if [ -f /tmp/dirty-prs.txt ]; then
            dirty="$(tr '\n' ';' < /tmp/dirty-prs.txt)"
            echo "dirty=${dirty%;}" >> "$GITHUB_OUTPUT"
            echo "DIRTY-PRs: ${dirty%;}"
          else
            echo "dirty=" >> "$GITHUB_OUTPUT"
          fi

      - name: Mechanisch lösbare Konflikte selbst mergen (#2099)
        # git merge mit den Merge-Treibern aus .gitattributes; läuft es sauber durch,
        # wird der Merge-Commit normal (kein Rebase/Force) auf den PR-Branch gepusht.
        # CI und Gate laufen danach wie gewohnt — ein grünes Verdict bleibt unangetastet,
        # es gibt keinen Fixup-Zyklus mehr. Echte Konfliktmarker → Dateiliste für den
        # Label-Schritt. KEIN Push, solange am PR ein ai:needs-*-Label klebt (= laufende
        # Phase; der Push würde ihr den Boden unter den Füßen wegziehen, Issue-Weg 4).
        id: auto-merge
        if: steps.preflight.outputs.configured == 'true' && steps.scan.outputs.dirty != ''
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          REPO: ${{ github.repository }}
          DIRTY_PRS: ${{ steps.scan.outputs.dirty }}
        run: |
          set -uo pipefail
          git config user.name "conflict-detector[bot]"
          git config user.email "conflict-detector@users.noreply.github.com"

          conflicted=""
          for entry in ${DIRTY_PRS//;/ }; do
            pr="${entry%% *}"
            head_ref="${entry#* }"

            # Guard: laufende Phase? Ein ai:needs-*-Label am PR heißt, eine Phase ist
            # getriggert oder läuft — dann KEIN Push (Issue-Weg 4).
            labels="$(gh pr view "$pr" --repo "$REPO" --json labels --jq '[.labels[].name?]')"
            if echo "$labels" | jq -e 'any(.[]; startswith("ai:needs-"))' >/dev/null; then
              echo "PR #${pr}: Pipeline-Phase aktiv ($(echo "$labels" | jq -r 'map(select(startswith("ai:needs-"))) | join(", "))') — kein Push, Konflikt der Phase überlassen."
              conflicted="${conflicted}${pr} (Phase läuft, kein Auto-Merge);"
              continue
            fi

            if ! git -c http.extraheader="AUTHORIZATION: bearer $(gh auth token)" \
                 fetch --no-tags origin "+refs/pull/${pr}/head" "+refs/heads/main:refs/remotes/origin/main" 2>/dev/null; then
              echo "::warning::PR #${pr}: fetch fehlgeschlagen — übersprungen."
              conflicted="${conflicted}${pr} (fetch fehlgeschlagen);"
              continue
            fi
            git switch --force-create "conflict-try-${pr}" FETCH_HEAD >/dev/null 2>&1
            if git merge --no-ff --no-edit origin/main -m "merge: main nachziehen (automatischer Konflikt-Detektor, #2099)" >/dev/null 2>&1; then
              # Push ohne Token in der URL: Header-Auth (leakt nicht in Fehlermeldungen).
              if git -c http.extraheader="AUTHORIZATION: bearer $(gh auth token)" \
                   push origin "HEAD:refs/heads/${head_ref}" 2>/dev/null; then
                echo "::notice title=✅ Auto-Merge::PR #${pr}: main mechanisch gemerged und gepusht — kein Fixup nötig (#2099)."
                echo "- PR #${pr}: mechanisch gemerged, Merge-Commit gepusht — kein Fixup-Lauf." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::PR #${pr}: Merge sauber, aber Push abgelehnt — als Konflikt weitergegeben."
                conflicted="${conflicted}${pr} (Merge ok, Push abgelehnt);"
              fi
            else
              files="$(git diff --name-only --diff-filter=U | tr '\n' ',' | sed 's/,$//')"
              git merge --abort >/dev/null 2>&1 || true
              echo "PR #${pr}: ECHTER Konflikt — Dateien: ${files:-?}"
              conflicted="${conflicted}${pr} ${files:-unbekannt};"
            fi
            git switch - >/dev/null 2>&1 || git checkout main >/dev/null 2>&1 || true
            git branch -D "conflict-try-${pr}" >/dev/null 2>&1 || true
          done
          echo "conflicted=${conflicted%;}" >> "$GITHUB_OUTPUT"

      - name: Echte Konflikte labeln + Dateiliste (#2099)
        # Nur was auch lokal Konfliktmarker hatte: ai:needs-fixup (atomare Transition wie
        # zuvor, PR #890) plus Dateiliste als PR-KOMMENTAR — der Fixup liest PR-Kommentare;
        # ein Inline-Kommentar bräuchte eine Diff-Position, die es für die konfliktierte
        # Datei nicht zuverlässig gibt. Dateiliste statt bloßem Label spart dem Fixup
        # die Suche (Issue: „hängt die betroffenen Dateien als Hinweis an").
        if: steps.preflight.outputs.configured == 'true' && steps.auto-merge.outputs.conflicted != ''
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          REPO: ${{ github.repository }}
          CONFLICTED: ${{ steps.auto-merge.outputs.conflicted }}
        run: |
          set -uo pipefail
          IFS=';' read -ra items <<< "$CONFLICTED"
          for item in "${items[@]}"; do
            pr="${item%% *}"
            rest="${item#* }"
            echo "PR #${pr}: setze ai:needs-fixup (echter Konflikt: ${rest:-?})."
            if ! OUT="$(bash .github/scripts/label-transition.sh \
                --repo "$REPO" --pr "$pr" --set ai:needs-fixup --forbid ai:needs-fixup)"; then
              echo "::error::PR #${pr}: Label-Transition zu ai:needs-fixup endgültig fehlgeschlagen"
              continue
            fi
            if [ "$(printf '%s\n' "$OUT" | sed -n 's/^applied=//p')" = "true" ]; then
              # Body bewusst per Datei: Die Dateiliste braucht Backticks (Code-Format),
              # im doppelten Anführungszeichen waeren das Command-Substitutionen.
              {
                printf '<!-- ai-conflict-files -->\n'
                printf '**Merge-Konflikt (automatisch erkannt, #2099):** Lokaler Merge mit den Merge-Treibern aus `.gitattributes` schlug fehl. Betroffene Dateien:\n\n'
                printf '%s\n' "$rest" | tr ',' '\n' | sed -e 's/^/- `/' -e 's/$/`/'
                printf '\n`git merge origin/main` lokal auflösen, committen, pushen — danach weiter wie im Fixup-Ablauf.\n'
              } > "/tmp/conflict-comment-${pr}.md"
              gh pr comment "$pr" --repo "$REPO" --body-file "/tmp/conflict-comment-${pr}.md"
              echo "PR #${pr}: ai:needs-fixup gesetzt + Dateiliste kommentiert." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "PR #${pr}: Transition verworfen ($(printf '%s\n' "$OUT" | sed -n 's/^reason=//p')) — kein Fixup-Trigger gesetzt."
            fi
          done
