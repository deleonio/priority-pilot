name: Nightly Architecture Optimization

# Nightly: genau EINE Architektur-Optimierung (Stabilität/Wartbarkeit) via Claude Code suchen
# und als pipeline-fähiges Ticket anlegen. Läuft täglich 03:57 UTC — nicht auf Push/PR.
#
# APP-TOKEN-PFLICHT: Issue-Anlage inkl. Label `ai:needs-analyse` läuft über das GitHub-App-
# Token (steps.setup.outputs.gh-token) — von GITHUB_TOKEN gesetzte Labels lösen KEINE Folge-
# Workflows aus (gleiche Falle wie in claude-continue-sweep.yml dokumentiert), die Triage der
# Pipeline würde sonst nie anlaufen.
#
# DEDUP: Existiert bereits ein offenes `nightly-arch-opt`-Issue, wird KEIN neues angelegt
# (Notice statt Spam-Duplikat, Muster test-optimization.yml). Die offenen Titel bekommt der
# Agent vorab als bekannt mitgegeben, damit er nichts Offenes erneut vorschlägt.
#
# TEMPLATE-PFLICHT: Der Issue-Body folgt dem Ticket-Template (vier Abschnitte „Was ist das
# Problem? / Wo tritt es auf? / Wie soll es sein? / Woran messen wir das?"), sonst weist ihn
# das Güte-Gate der Triage (verify-issue-quality.sh) sofort zurück.

on:
  schedule:
    - cron: '57 3 * * *'
  workflow_dispatch: {}

concurrency:
  group: arch-opt
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  analyze:
    name: Optimierung suchen + Ticket anlegen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Muster aller Claude-Workflows: kein GITHUB_TOKEN-Credential hinterlassen —
          # setup-claude legt das App-Token als einzige origin-Credential ab.
          persist-credentials: false

      - name: Setup Claude Code
        id: setup
        uses: ./.github/actions/setup-claude
        with:
          tools-tier: restricted
          # Stateless Helper: kein Ticket-Kontext, kein Memory (memory-load=false,
          # Default). ticket-ref ist Pflicht-Input der Action und bleibt bewusst
          # leer — verbraucht wird die Nummer nur für Memory-Load/Save, beides hier
          # deaktiviert.
          event-type: issues
          ticket-ref: ''
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          model: ${{ vars.CLAUDE_MODEL_ARCH_OPT || 'sonnet' }}
          effort: 'high'
          # Fan-out-Lesen (Umfeldrecherche) auf dem billigen Modell, Muster Triage —
          # sonst liefe der Subagent auf dem teuren Phasenmodell.
          subagent-model: ${{ vars.CLAUDE_MODEL_ARCH_OPT_SUBAGENT || 'haiku' }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          zai-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}
          openrouter-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          tailscale-exit-node: ${{ vars.TAILSCALE_EXIT_NODE }}

      - name: Bekannte offene Optimierungs-Issues listen
        # DEDUP-Eingabe: Der Agent schlägt nichts erneut vor, was schon als offenes
        # Ticket wartet. Label existiert beim ersten Lauf noch nicht → leere Liste.
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --label nightly-arch-opt \
            --json number,title --jq '.[] | "- #\(.number): \(.title)"' > /tmp/known-issues.md 2>/dev/null || true
          echo "Offene arch-opt-Issues: $(wc -l < /tmp/known-issues.md | tr -d ' ')"

      - name: Architektur-Analyse via Claude
        id: claude
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
        run: |
          cp .github/prompts/nightly-arch-opt.md /tmp/claude-prompt.txt

          # Kontext als angehängten Block statt sed-Substitution über Freitext
          # (Muster memory-read/memory-write in den Phasen-Workflows — kein
          # Escaping-Problem mit Titeln aus Issues).
          {
            echo ""
            echo "## Bereits bekannte offene Optimierungs-Issues (nicht erneut vorschlagen)"
            if [ -s /tmp/known-issues.md ]; then cat /tmp/known-issues.md; else echo "- (keine)"; fi
          } >> /tmp/claude-prompt.txt

          bash .github/scripts/assert-prompt-complete.sh /tmp/claude-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Ergebnis parsen
        # FOUND-Zeile robust wie das VERDICT-Parsing der Triage (#582/#1017):
        # Markdown-Deko (Backticks/**/#N) vor/hinter dem Token ist egal, der letzte
        # Treffer gewinnt. Ein NICHT geparstes FOUND ist ein Formatbruch und endet
        # LAUT rot — kein stiller No-op (Fail-safe-Richtung des Repos).
        id: parse
        if: steps.setup.outputs.configured == 'true' && steps.claude.outcome == 'success'
        run: |
          LOG=/tmp/claude-output.log
          found="$(grep 'FOUND:' "$LOG" | tail -1 | sed -E 's/^.*FOUND:[[:space:]]*//' | grep -oE 'true|false' | head -1 || true)"
          if [ -z "$found" ]; then
            echo "::error title=❌ Formatbruch::Keine FOUND:-Zeile im Claude-Output erkennbar — Lauf wiederholen oder Prompt straffen."
            exit 1
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"

          if [ "$found" = "false" ]; then
            reason="$(grep 'REASON:' "$LOG" | tail -1 | sed -E 's/^.*REASON:[[:space:]]*//' || true)"
            echo "reason=${reason:-keine Begruendung geliefert}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Blockfelder: von Marker bis Marker (substring-robust gegen Deko wie
          # **PROPOSAL:**; der Agent hält die Reihenfolge laut Skill ein).
          field() { awk -v a="$1" -v b="$2" 'index($0, a) { f = 1; next } index($0, b) { f = 0 } f' "$LOG"; }

          title="$(grep 'TITLE:' "$LOG" | tail -1 | sed -E 's/^.*TITLE:[[:space:]]*//' | tr -d '\r' | sed -E 's/[`*]//g')"
          affected="$(field 'AFFECTED_FILES:' 'DESCRIPTION:')"
          description="$(field 'DESCRIPTION:' 'PROPOSAL:')"
          proposal="$(field 'PROPOSAL:' 'IMPACT:')"
          impact="$(field 'IMPACT:' 'ACCEPTANCE:')"
          acceptance="$(field 'ACCEPTANCE:' 'FOUND:')"

          # Mindestfüllung hart prüfen — was das Güte-Gate der Triage ohnehin
          # zurückweisen würde, wird gar nicht erst zum Issue (fail-safe laut).
          bullets="$(printf '%s' "$acceptance" | grep -cE '^[[:space:]]*[-*+] ' || true)"
          if [ -z "$title" ] || [ "$(printf '%s' "$description" | tr -s '[:space:]' ' ' | wc -c | tr -d ' ')" -lt 10 ] || [ "$bullets" -lt 1 ] || [ -z "$(printf '%s' "$affected" | tr -d '[:space:]')" ]; then
            echo "::error title=❌ Ergebnis unvollständig::TITLE/DESCRIPTION/AFFECTED_FILES/ACCEPTANCE nicht brauchbar gefüllt — Lauf wiederholen."
            exit 1
          fi

          # Mehrzeilige Outputs über Heredoc-Syntax (Muster verify-issue-quality.sh).
          for pair in "title:$title" "affected:$affected" "description:$description" "proposal:$proposal" "impact:$impact" "acceptance:$acceptance"; do
            key="${pair%%:*}"
            {
              echo "${key}<<PARSE_EOF"
              printf '%s\n' "${pair#*:}"
              echo "PARSE_EOF"
            } >> "$GITHUB_OUTPUT"
          done

      - name: Issue anlegen (dedupliziert, template-konform)
        # App-Token: github-script läuft mit dem App-Token — nur dessen Labels
        # triggern die Triage-Pipeline. Felder über env statt ${{ }}-Interpolation:
        # LLM-Text mit Backticks/Quotes darf kein JS/YAML brechen.
        if: steps.parse.outputs.found == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          ISSUE_TITLE: ${{ steps.parse.outputs.title }}
          ISSUE_AFFECTED: ${{ steps.parse.outputs.affected }}
          ISSUE_DESCRIPTION: ${{ steps.parse.outputs.description }}
          ISSUE_PROPOSAL: ${{ steps.parse.outputs.proposal }}
          ISSUE_IMPACT: ${{ steps.parse.outputs.impact }}
          ISSUE_ACCEPTANCE: ${{ steps.parse.outputs.acceptance }}
        with:
          token: ${{ steps.setup.outputs.gh-token }}
          script: |
            const { owner, repo } = context.repo;
            const date = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // Label idempotent anlegen (422 „existiert bereits“ ist kein Fehler).
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: 'nightly-arch-opt',
                color: '1d76db',
                description: 'Automatische Architektur-Optimierung (Nightly)',
              });
            } catch (err) {
              core.info(`Label „nightly-arch-opt“ existiert bereits oder ist nicht anlegbar: ${err.message}`);
            }

            // DEDUP (harte Sicherung hinter der bekannte-Issues-Liste im Prompt):
            // Ein offenes arch-opt-Issue reicht — kein tägliches Duplikat.
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'nightly-arch-opt' });
            if (open.data.length > 0) {
              core.notice(`Kein neues Issue: #${open.data[0].number} ist noch offen (Dedup).`);
              return;
            }

            // Body im Ticket-Template-Format — das Güte-Gate der Triage prüft
            // genau diese vier Abschnitte (verify-issue-quality.sh).
            const body = [
              `> 🤖 Automatisch erstellt vom Nightly-Architecture-Optimization-Workflow am ${date} — [Run #${context.runId}](${runUrl}). Kann vor der Analyse verworfen oder angepasst werden.`,
              '',
              '## Was ist das Problem?',
              '',
              process.env.ISSUE_DESCRIPTION,
              '',
              '## Wo tritt es auf?',
              '',
              process.env.ISSUE_AFFECTED,
              '',
              '## Wie soll es sein?',
              '',
              process.env.ISSUE_PROPOSAL,
              '',
              '## Woran messen wir das?',
              '',
              process.env.ISSUE_ACCEPTANCE,
              '',
              '---',
              '',
              '### Architektur-Einschätzung des Nightly-Laufs',
              '',
              process.env.ISSUE_IMPACT,
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner,
              repo,
              title: `[arch-opt] ${process.env.ISSUE_TITLE}`,
              body,
              labels: ['nightly-arch-opt', 'ai:needs-analyse'],
            });
            core.notice(`Issue #${issue.data.number} erstellt: [arch-opt] ${process.env.ISSUE_TITLE}`);

      - name: Ergebnis zusammenfassen
        if: always()
        run: |
          {
            echo "### Nightly Architecture Optimization"
            echo ""
            if [ "${{ steps.setup.outputs.configured }}" != "true" ]; then
              echo "- ⚠️ App-Secrets fehlen — Lauf übersprungen (kein Fehler)."
            elif [ "${{ steps.claude.outcome }}" = "success" ] && [ "${{ steps.parse.outputs.found }}" = "true" ]; then
              echo "- ✅ Optimierung gefunden, Issue angelegt bzw. Dedup aktiv (siehe Log)."
            elif [ "${{ steps.claude.outcome }}" = "success" ] && [ "${{ steps.parse.outputs.found }}" = "false" ]; then
              echo "- ✅ Keine Optimierung gefunden: ${{ steps.parse.outputs.reason }}"
            elif [ "${{ steps.claude.outcome }}" = "success" ]; then
              echo "- ❌ Ergebnis-Parsing fehlgeschlagen (Formatbruch) — Lauf wiederholen."
            else
              echo "- ❌ Claude-Lauf fehlgeschlagen: ${{ steps.claude.outcome }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
