name: Audit Prompts

# Nächtlicher LLM-Job (wie die Phasen 01–06 über setup-claude, aber KEINE Pipeline-Phase):
# Review der Phasen-Prompts der KI-Pipeline unter der Leitfrage: Wie lässt sich der
# Aufwand pro Phase minimieren (Turns zuerst, Tokens dazu), ohne dass Korrektheit,
# Vollständigkeit, Präzision, Prägnanz, Klarheit oder Widerspruchsfreiheit leiden — und ohne
# Konkretisierung zu opfern? Effizienz wird NETTO über die Phasen-Kette gemessen: Je
# konkreter ein Prompt die Umsetzung lenkt (Pfade, Befehle, Grenzen, erwartete Ausgaben),
# desto weniger Folge-Turns (Klärung, Fixup, Review) verursacht er. Der Audit meldet daher
# auch Funde, die Tokens hinzufügen, wenn die erwartete Ersparnis downstream die Mehrkosten
# übersteigt (eine Fixup-Schleife ≈ 50 Turns).
#
# TURN-ÖKONOMIE ist die zweite Achse (#1198): Die Abos rechnen je Prompt/Turn ab, also
# bewertet der Audit auch, ob ein Prompt vermeidbare Turns erzeugt oder eine Bündelungs-
# Anweisung vermissen lässt (AGENTS.md „Turns bündeln"), mit eigener Fund-Kategorie
# „Turn-Bündelung"; vorhandene Bündelung ist guter Zustand und darf keinem Kürzungs-
# Vorschlag zum Opfer fallen. Die Datenbasis liefert costs-summary.sh (Turns gesamt,
# Turns ∅ je Lauf, Turns/Ticket neben $).
#
# PRÜFOBJEKT: alle Prompts unter .github/prompts/ (Phasen-Prompts, Memory-Snippets
# memory-{read,write}.md, Nightly-Helfer spec-sync/guide-sync/prompt-audit).
# Referenz für Redundanz-Funde: die zugehörigen SKILL.md-Dateien
# der Skills, .ai-knowledge/*.md + AGENTS.md.
#
# DELIVERY: Bei Funden Issue mit Label ci:prompt-audit (bewusst NICHT ai:needs-analyse —
# das würde die Ticket-Pipeline starten!). Ist bereits ein offenes Audit-Issue vorhanden,
# wird dessen Body durch den neuen Report ersetzt (Titel-Datum mit aktualisiert) — genau
# ein offenes Audit-Issue, kein Issue-Stau pro Nacht. Keine Funde → kein Issue.
# Issue-Anlegen/Updaten macht der WORKFLOW deterministisch (Muster Documenter/Guide-Sync:
# der Agent liefert nur den Report, nie die GitHub-Seiteneffekte).
#
# STATELESS: kein pro-Issue-Memory (memory-load/expect false). Modell: opus (Default,
# überschreibbar via vars.CLAUDE_MODEL_PROMPT_AUDIT).
#
# KEINE Nummer im Dateinamen: Nummern (01–06) sind lastend (Workflow-Name-Matching), dieser
# Job ist ein Helper und hängt nicht in der Label-Kette.

on:
  schedule:
    - cron: '17 1 * * *' # täglich 01:17 UTC (Auftakt des LLM-Nachtblocks), vor Spec-Sync (02:37) und Guide-Sync (03:07)
  workflow_dispatch:
    inputs:
      force:
        description: 'Skip-Guard ignorieren (Lauf erzwingen, auch wenn main unverändert ist)'
        type: boolean
        default: false

concurrency:
  group: claude-prompt-audit
  cancel-in-progress: false
  # queue: max — OHNE dies hält GitHub pro Gruppe nur EINEN pending-Run: ein manueller
  # workflow_dispatch während des Nightly-Laufs würde still verworfen. `max` = FIFO-Schlange.
  queue: max

permissions:
  contents: read # Prompts + Wissensbasis lesen
  issues: write # Audit-Issue anlegen/aktualisieren + gh label create
  id-token: write # App-Token (setup-claude)
  actions: read # Skip-Guard: letzte erfolgreiche Run-Historie lesen

jobs:
  prompt-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Skip-Guard (main unverändert seit letztem erfolgreichen Audit)
        # LLM-Budget sparen: Hat main seit dem letzten erfolgreichen Lauf denselben SHA,
        # ist das Review-Ergebnis deterministisch dasselbe → kein Lauf. Fail-open bei
        # API-Fehlern (leerer last_sha → Lauf). force=true umgeht (Re-Audit nach
        # Prompt-Anpassung ohne main-Bewegung).
        id: guard
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force == true) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last_sha="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow cron.audit-prompts.yml \
            --status success --limit 1 --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)"
          if [ -n "$last_sha" ] && [ "$last_sha" = "$GITHUB_SHA" ]; then
            echo "::notice title=⏭️ Prompt-Audit übersprungen::Main unverändert ($GITHUB_SHA) seit letztem erfolgreichen Audit."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Startzeit merken (für weiches Zeitlimit)
        id: starttime
        if: steps.guard.outputs.skip != 'true'
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 900))" >> "$GITHUB_OUTPUT"

      - name: Setup Claude Code
        id: setup
        if: steps.guard.outputs.skip != 'true'
        uses: ./.github/actions/setup-claude
        with:
          needs-mcp: false
          browser-mcp: false
          # review-Tier: volles Lesen (Read/Glob/Grep/Bash) für Prompt- + Wissensbasis-Scan,
          # aber Code schreibgeschützt (kein Bypass) — der Agent ändert nichts, der Report
          # geht per Bash-Heredoc nach /tmp (Write-Tool ist hier bewusst nicht erlaubt).
          tools-tier: review
          event-type: ${{ github.event_name }}
          # ticket-ref ist Pflicht-Input, dieser Job hat kein Ticket: '0' fließt NUR in den
          # ungenutzten Storage-Namen — Memory ist komplett aus (memory-load: false).
          ticket-ref: '0'
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          model: ${{ vars.CLAUDE_MODEL_PROMPT_AUDIT || 'opus' }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          zai-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}
          openrouter-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          tailscale-exit-node: ${{ vars.TAILSCALE_EXIT_NODE }}
          memory-load: 'false'
          expect-memory: 'false'

      - name: Prompt-Audit via Claude
        id: claude
        if: steps.guard.outputs.skip != 'true' && steps.setup.outputs.configured == 'true'
        run: |
          cp .github/prompts/prompt-audit.md /tmp/claude-prompt.txt

          sed -i "s/{{AUDIT_DATE}}/$(date -u +%F)/g" /tmp/claude-prompt.txt
          sed -i "s/{{SOFT_DEADLINE}}/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/claude-prompt.txt
          bash .github/scripts/assert-prompt-complete.sh /tmp/claude-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Report als Artefakt sichern
        # Auch bei Folgefehlern (Issue-Step) bleibt der Report auffindbar; bei «clean» ist
        # er die einzige Spur des Audits (kein Issue).
        if: ${{ always() && steps.guard.outputs.skip != 'true' && steps.setup.outputs.configured == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prompt-audit-report
          path: /tmp/prompt-audit.md
          if-no-files-found: ignore

      - name: Post-Assertion (Verdict ↔ Report) + Issue-Anlage/Update
        # Ehrlichkeits-Kreuzcheck nach dem VERDICT-Muster der Phasen-Workflows, danach das
        # Issue-Handling deterministisch (bewusst KEINE Agent-Aufgabe). Genau EIN offenes
        # Audit-Issue: vorhanden → Body durch den neuen Report ersetzen, sonst neu anlegen.
        # Label ci:prompt-audit NICHT ai:needs-analyse — sonst startet die Ticket-Pipeline!
        if: >-
          ${{ always()
              && steps.guard.outputs.skip != 'true'
              && steps.setup.outputs.configured == 'true'
              && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          # Portables VERDICT-Parsen wie in 01 (BSD/GNU-grep-sicher): erster bekannter
          # Token gewinnt, Prosa/Markdown nach dem Token ist egal.
          verdict=""
          if [ -f /tmp/claude-output.log ]; then
            verdict="$(grep 'VERDICT:' /tmp/claude-output.log | tail -1 | sed -E 's/^.*VERDICT:[[:space:]]*//' | grep -oE 'findings|clean' | head -1 || true)"
          fi
          echo "Claude-Verdict aus Output: '${verdict:-keins}'"

          if [ "$OUTCOME" != "success" ]; then
            echo "::error title=❌ Prompt-Audit fehlgeschlagen::Claude-Lauf nicht erfolgreich — kein stiller «clean»."
            exit 1
          fi
          if [ "$verdict" != "findings" ] && [ "$verdict" != "clean" ]; then
            echo "::error title=❌ Prompt-Audit ohne Verdict::Weder «findings» noch «clean» — Lauf wiederholen."
            exit 1
          fi

          if [ "$verdict" = "clean" ]; then
            echo "::notice title=✅ Prompts in Ordnung::Keine Funde — kein Issue."
            {
              echo "### Prompt-Audit – fertig"
              echo ""
              echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
              echo "- Verdict: \`clean\` (keine Funde, kein Issue)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # findings → Report muss da und substantiell sein (Ehrlichkeits-Regel).
          if [ ! -s /tmp/prompt-audit.md ]; then
            echo "::error title=❌ Verdict ohne Report::VERDICT findings, aber /tmp/prompt-audit.md fehlt oder ist leer."
            exit 1
          fi

          # Report ohne Empfehlung ist keine Entscheidungsgrundlage: mindestens eine Option
          # muss den ASCII-Marker EMPFOHLEN tragen (grep-stabil, ⭐ ist nur Deko).
          if ! grep -q 'EMPFOHLEN' /tmp/prompt-audit.md; then
            echo "::error title=❌ Report ohne Empfehlung::Findings-Report muss genau eine Optimierungsoption als EMPFOHLEN auszeichnen."
            exit 1
          fi

          gh label create "ci:prompt-audit" --repo "$GITHUB_REPOSITORY" --color BFD4F2 \
            --description "Nightly LLM-Review der Pipeline-Phasen-Prompts (Token-Optimierung)" 2>/dev/null || true

          title="ci: Prompt-Audit — Phasen-Prompts optimieren ($(date -u +%F))"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci:prompt-audit --state open \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)"

          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/prompt-audit.md
            echo "AUDIT_ISSUE=$number" >> "$GITHUB_ENV"
            echo "::notice title=✅ Audit-Issue aktualisiert::#$number trägt den Report von $(date -u +%F)."
          else
            url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --label ci:prompt-audit --body-file /tmp/prompt-audit.md)"
            number="$(printf '%s\n' "$url" | sed -nE 's#.*/issues/([0-9]+).*#\1#p' | tail -1)"
            echo "AUDIT_ISSUE=${number:-?}" >> "$GITHUB_ENV"
            echo "::notice title=✅ Audit-Issue erstellt::${url:-Nummer nicht auflösbar}"
          fi

          {
            echo "### Prompt-Audit – fertig"
            echo ""
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Verdict: \`findings\` — Report im Audit-Issue #${number:-?} (Label \`ci:prompt-audit\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🩺 Z.AI Fair-Usage-Check (1313)
        # Rohausgabe des Claude-Laufs auf z.ai-Fehler 1313 (Fair Usage) durchsuchen
        # und Ergebnis als Annotation + Job-Summary sichtbar machen.
        if: always()
        uses: ./.github/actions/llm-fair-usage-check
