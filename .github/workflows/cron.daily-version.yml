name: Daily Version

# Einmal täglich einen Minor-Bump (0.1.x -> 0.2.0 -> 0.3.0 -> ...) zusätzlich zum
# Patch-Bump-pro-Merge aus deploy.yml — für einen fortlaufenden Tages-Release-Rhythmus.
#
# Kein PR seit dem letzten Minor-Bump gemergt -> kein Bump. Erkennung ohne eigene
# State-Datei und ohne GitHub-API-Abfrage: `deploy.yml` erhoeht bei JEDEM Merge nur
# die Patch-Komponente, `npm version minor` (dieser Workflow) setzt sie beim
# Minor-Bump auf 0 zurueck. Also gilt Patch-Komponente von `LAST_TAG` != 0 <=> seit
# dem letzten Minor-Bump wurde mindestens einmal gemergt. Ein Merge-Zeitstempel-
# Vergleich gegen `LAST_TAG` waere hier falsch: `deploy.yml` taggt sofort nach jedem
# Merge, der "letzte Tag" faellt also fast immer mit dem Merge zusammen, der ihn
# ausgeloest hat, und eine "PRs seit LAST_TAG"-Abfrage faende praktisch immer 0
# Treffer. `git describe --tags --abbrev=0` liefert den Zeitanker fuer den
# Tages-Check unten; es folgt dem Commit-Graph (nicht der hoechsten Versionsnummer)
# und ignoriert damit verwaiste/nicht mehr erreichbare Alt-Tags.
#
# Cron/DST: GitHub-Crons laufen in UTC; Europe/Berlin wechselt zwischen CEST (UTC+2)
# und CET (UTC+1). Zwei Cron-Zeilen decken beide Offsets ab, der Job-Guard öffnet ein
# Fenster (05-07 Berlin, TZ=Europe/Berlin) statt strikter Stundengleichheit, damit ein
# von GitHub verzögerter Lauf nicht ersatzlos ausfällt. Die Doppel-Feuerung (DST-Offset
# UND ein verzögerter Lauf innerhalb desselben Fensters) fängt der Tages-Check im
# Merge-Check ab (Tag-Datum == heutiges Berlin-Datum -> bereits erledigt), nicht die
# Stunde selbst.
#
# App-Token noetig: Standard-GITHUB_TOKEN loest keine Folge-Workflows aus; Branch-
# Protection auf main blockiert direkte Pushes ohne App-Berechtigung (gleiches Muster
# wie deploy.yml). Der Bump-Commit traegt [skip ci] — es aendert sich nur die
# Versionsnummer, kein Code, ein Deploy waere unnoetig.

on:
  schedule:
    - cron: '0 3 * * *' # 05:00 Berlin im Sommer (CEST, UTC+2)
    - cron: '0 4 * * *' # 05:00 Berlin im Winter (CET, UTC+1)
  workflow_dispatch: {} # manueller Testlauf, umgeht das Zeitfenster-Gate

concurrency:
  group: daily-version
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Zeitfenster prüfen (05-07 Uhr Europe/Berlin; manuell immer)
        # schedule-Feuerungen laufen 2×/Tag (CEST- und CET-Offset), plus mögliche
        # GitHub-Verzögerung über die Stundengrenze hinweg. Ein offenes Fenster (05-07)
        # fängt verzögerte Läufe auf; Doppel-Feuerungen innerhalb des Fensters filtert
        # der Tages-Check im Merge-Check-Schritt (nicht diese Stunde-Prüfung).
        id: timegate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
            echo "Manueller Lauf — Zeitfenster-Guard übergangen."
            exit 0
          fi
          BERLIN_HOUR="$(TZ='Europe/Berlin' date +%H)"
          echo "Berlin-Uhrzeit: ${BERLIN_HOUR}:xx Europe/Berlin."
          case "$BERLIN_HOUR" in
            05|06|07)
              echo "active=true" >> "$GITHUB_OUTPUT"
              echo "::notice title=🕐 Daily-Version aktiv::${BERLIN_HOUR}:00 Europe/Berlin (Fenster 05-07)."
              ;;
            *)
              echo "active=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=⏭️ Übersprungen::Berlin-Stunde ${BERLIN_HOUR} außerhalb des Fensters 05-07 — nichts zu tun."
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.timegate.outputs.active == 'true'
        with:
          # fetch-depth: 0 noetig fuer git describe ueber die volle Tag-Historie
          fetch-depth: 0

      - name: Merge-Check seit letztem Release
        if: steps.timegate.outputs.active == 'true'
        id: mergecheck
        run: |
          git fetch origin --tags --quiet
          # `|| true`: ohne erreichbaren Tag endet git describe mit Exit 1 und faerbt
          # den Job rot, statt sauber zu ueberspringen.
          LAST_TAG="$(git describe --tags --abbrev=0 origin/main 2>/dev/null || true)"
          if [ -z "$LAST_TAG" ]; then
            echo "has_merges=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=⏭️ Kein Tag::Kein erreichbarer Tag auf origin/main — ohne Zeitanker kein Merge-Check."
            exit 0
          fi
          echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"

          # Tages-Check zuerst: fängt Doppel-Feuerungen des Daily-Jobs selbst innerhalb
          # des 05-07-Fensters ab (DST-Offset UND ein verzögerter Lauf am selben Tag).
          LAST_DAILY_ISO="$(git log -1 --format=%cI --fixed-strings --grep='(daily) [skip ci]' origin/main)"
          if [ -n "$LAST_DAILY_ISO" ]; then
            LAST_DAILY_DATE="$(TZ='Europe/Berlin' date -d "$LAST_DAILY_ISO" +%Y-%m-%d)"
            TODAY_BERLIN="$(TZ='Europe/Berlin' date +%Y-%m-%d)"
            if [ "$LAST_DAILY_DATE" = "$TODAY_BERLIN" ]; then
              echo "has_merges=false" >> "$GITHUB_OUTPUT"
              echo "::notice title=⏭️ Bereits heute erledigt::Daily-Bump vom ${TODAY_BERLIN} (Berlin) liegt bereits vor — kein zweiter Bump."
              exit 0
            fi
          fi

          # Patch-Komponente von LAST_TAG (siehe Kopfkommentar): deploy.yml bumpt bei
          # jedem Merge nur den Patch-Teil, der Minor-Bump hier setzt ihn auf 0 zurueck.
          # != 0 heisst also zwingend: seit dem letzten Minor-Bump wurde gemergt.
          PATCH="$(echo "$LAST_TAG" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+)$/\1/')"
          echo "Letzter Release-Tag: ${LAST_TAG} — Patch-Komponente: ${PATCH}."
          if [ "$PATCH" -eq 0 ]; then
            echo "has_merges=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=⏭️ Kein Bump::Patch-Komponente von ${LAST_TAG} ist 0 — seit dem letzten Minor-Bump nichts gemergt."
          else
            echo "has_merges=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.mergecheck.outputs.has_merges == 'true'
        with:
          node-version-file: .nvmrc

      - name: App-Token holen
        id: app-token
        if: steps.mergecheck.outputs.has_merges == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Git-Identität auf Repo-Owner stellen
        if: steps.mergecheck.outputs.has_merges == 'true'
        # Release-Commits laufen unter der Identität des Repo-Owners statt der App-Bot-
        # Identität — gültige noreply-Adresse, Commits verlinken auf den Owner-Account.
        # Der PUSH bleibt App-Token (App-only-Pipeline), gleiches Muster wie deploy.yml.
        run: |
          git config user.name "deleonio"
          git config user.email "6279703+deleonio@users.noreply.github.com"

      - name: Minor-Bump + Commit + Push auf main
        if: steps.mergecheck.outputs.has_merges == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git pull --rebase origin main
          npm version minor --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json
          # --no-verify: siehe deploy.yml — lefthook pre-commit-Hooks sollen den reinen
          # Versions-Commit nicht ausloesen.
          git commit --no-verify -m "chore(release): v${NEW_VERSION} (daily) [skip ci]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main

      - name: Tag + GitHub Release (best-effort)
        if: steps.mergecheck.outputs.has_merges == 'true'
        # Gleiches idempotente Best-effort-Muster wie deploy.yml: ein fehlgeschlagenes
        # Release darf den Bump NIE kippen.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          TAG="v${NEW_VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "⏭️ Tag ${TAG} existiert bereits (Re-Run) — nur Release prüfen."
          else
            git tag "$TAG"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "refs/tags/${TAG}" \
              || { echo "::warning title=Tag-Push fehlgeschlagen::${TAG} konnte nicht gepusht werden — manuell nachholen."; exit 0; }
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "⏭️ Release ${TAG} existiert bereits — nichts zu tun."
          else
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "$TAG" --generate-notes --latest \
              || { echo "::warning title=Release-Creation fehlgeschlagen::${TAG} — manuell nachholen."; exit 0; }
            echo "🚀 Release ${TAG} mit generierten Notes erstellt."
          fi
