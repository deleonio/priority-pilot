name: Test Optimization

# Tägliche Analyse der Test-Suite nach TDD-Prinzipien (Substance over Quantity).
# Erkennt tautologische Tests, Redundanzen, fehlende Mutation-Probes, leere Mengen.
# Läuft täglich 08:57 UTC (09:57/10:57 MESZ) — nicht auf Push/PR, um CI nicht zu belasten.
# Ergebnis: Markdown-Report als Workflow-Artefakt + optional Issue bei kritischen Findings.

on:
  schedule:
    - cron: '57 8 * * *'
  workflow_dispatch: {} # manuell anstoßbar

concurrency:
  group: test-optimization
  cancel-in-progress: true

jobs:
  analyze:
    name: Test-Suite analysieren
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      issues: write
    services:
      # Erforderlich für AK-5 (Redis-Store Session-Sharing Test in session.test.ts)
      # Der Test verbindet sich zu redis://localhost:6379
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test-Suite ausführen (Unit + E2E Shard 1)
        run: |
          set -euo pipefail
          pnpm -r test 2>&1 | tee unit-results.txt
          pnpm --filter frontend exec playwright test --shard=1/4 2>&1 | tee e2e-results.txt || true

      - name: Test-Analyse (TypeScript, wie Contract-Tests)
        id: analyze
        run: |
          pnpm dlx tsx@4.22.4 .github/scripts/analyze-test-suite.ts \
            --unit-results unit-results.txt \
            --e2e-results e2e-results.txt \
            --repo-root . \
            --report-dir .ai-knowledge

      - name: Report als Artefakt hochladen
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-optimization-report-${{ github.run_id }}
          path: ${{ steps.analyze.outputs.report_path }}
          retention-days: 30

      - name: Issue bei kritischen Findings (dedupliziert)
        # Vorher: bedingungsloses issues.create JEDEM Lauf → bei persistenten Findings
        # täglich ein neues Duplikat. Jetzt: ein offenes test-maintenance-Issue suchen und
        # dessen Body aktualisieren; nur wenn keines existiert, ein neues anlegen.
        if: steps.analyze.outputs.critical_findings == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('${{ steps.analyze.outputs.report_path }}', 'utf8');
            const { owner, repo } = context.repo;
            const runDate = new Date().toISOString().slice(0, 10);

            // Labels idempotisch anlegen (422 „existiert bereits" ist kein Fehler).
            const ensureLabel = async (name, color) => {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color });
                core.info(`Label „${name}" angelegt.`);
              } catch (err) {
                core.info(`Label „${name}" existiert bereits oder nicht anlegbar: ${err.message}`);
              }
            };
            await ensureLabel('test-maintenance', 'fbca04');
            await ensureLabel('automated', '0e8a16');

            const body = `> 🔄 Automatisch aktualisiert am ${runDate} (Run #${context.runId})\n\n${report}`;

            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'test-maintenance',
            });

            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
              core.info(`Bestehendes Issue #${issue.number} aktualisiert (kein Spam-Duplikat).`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: '[test-maintenance] Tägliche Test-Optimierung: Kritische Findings',
                body,
                labels: ['test-maintenance', 'automated'],
              });
              core.info(`Neues Issue #${created.data.number} erstellt.`);
            }
