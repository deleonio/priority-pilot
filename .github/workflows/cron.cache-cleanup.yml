name: Cleanup Cache

# Der Repo-Cache (GitHub Actions, 10-GB-Limit) fuellte sich zuletzt spuerbar aus pnpm-Store- und
# Playwright-Browser-Caches (ci.yml/deploy.yml/03-claude-spec.yml/04-claude-implement.yml —
# letzterer ueber .github/actions/claude-workbench, alle per `cache: pnpm` bzw. eigenem `actions/cache`-Schritt keyed auf den
# pnpm-lock.yaml-Hash). Jeder Lockfile-Hash-Wechsel (z. B. wenn ein Umsetzungs-Workflow eine neue
# Dependency committet) erzeugt einen NEUEN, ~130-260 MiB grossen Eintrag, der nach einem Merge/
# Verwerfen des Branches nie wieder getroffen wird und sonst bis zu GitHubs impliziter 7-Tage-
# Eviction bzw. dem 10-GB-Limit liegen bleibt.
#
# FRUEHER (bis 2026-09-03): eine harte 1-Tag-Obergrenze per createdAt. Das war kontraproduktiv:
# Der taegliche Delete kaltete den warmen main-Eintrag an, und weil GitHub Caches je BRANCH
# scopet, rettete sich jeder im Kaltfenster laufende Branch eine eigene ~136-MiB-Kopie bei
# IDENTISCHEM Lockfile-Hash (Messung 2026-09-03: 70 Caches / 10,08 GiB am Limit, davon 61
# node-cache-Kopien). Jetzt: Delete nach lastAccessedAt mit 7-Tage-Grenze, deckungsgleich mit
# GitHubs eigener LRU. Heisse Eintraege (main, taeglich getroffen) ueberleben, echte Verwaiste
# (alter Hash nach Renovate-Bump, dessen Branch weg ist) fallen nach einer Woche Ruhe.
#
# `hermes-session-*`- und `ticket-*`-Caches sind verwaiste Legacy-Typen, die nicht mehr
# geschrieben werden (Artefakt-Umstellung 2026-07-10). Altbestaende wurden 2026-08 abgeraeumt.
#
# `codeql-overlay-base-database-*`-Caches (vom github/codeql-action automatisch verwaltet) werden
# hier NICHT geloescht -- ihre Reduktion erfolgt ueber die Trigger-Aenderung in cron.codeql.yml
# (Schedule-only statt pro Push/PR). Sie fallen innerhalb von 7 Tagen an GitHubs Eviction.
#
# STORAGE-BRANCH-SWEEP (ADR 0007, Erbe aus ADR 0006): Der Issue-Storage lebt auf
# Harness-Zweigen ai/harness/{N} (ab Spec zugleich PR-Branch, vom Merge automatisch
# geloescht) sowie legacy auf ai/state/issue-{N}. Dieser Sweep ist der Backstop fuer
# Tickets, die den geregelten Abbau nie erreichen (ai:needs-human, Abbruch,
# ai:to-big-issue): Ein Branch beider Prefixe, dessen Issue/PR GESCHLOSSEN ist und dessen
# letzter Commit aelter als 7 Tage ist, wird entfernt. Offene Issues werden nie angefasst.

on:
  schedule:
    - cron: '17 3 * * *' # taeglich 03:17 UTC, versetzt zu Renovate (Mo 04:00 UTC)
  workflow_dispatch:

permissions:
  actions: write # Cache-Deletes
  contents: write # Branch-Deletes im State-Branch-Sweep
  issues: read # Issue-Status (offen/geschlossen) im State-Branch-Sweep
  pull-requests: read # PR-Fallback im State-Branch-Sweep (PR-keyed Storages ohne Closing-Issue)

concurrency:
  group: cache-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: pnpm-/Playwright-Caches ohne Zugriff seit 7 Tagen + verwaiste Altbestaende loeschen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          cutoff_epoch=$(( $(date -u +%s) - 7*86400 ))

          # Caches in eine Datei schreiben (Prozess-Substitution statt Pipe, damit
          # set -e / Exit-Codes in der Schleife nicht durch die Subshell verschluckt werden).
          # --limit 300: bei Messung 2026-08-15 178 Caches, Reserve fuer Wachstum.
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 300 \
            --json id,key,lastAccessedAt \
            --jq '.[] | select(.key | startswith("node-cache-") or startswith("Linux-playwright-")) | [.id, .key, .lastAccessedAt] | @tsv' \
            > /tmp/caches-to-check.tsv

          total=$(wc -l < /tmp/caches-to-check.tsv)
          deleted=0
          kept=0
          failed=0

          while IFS=$'\t' read -r id key accessed; do
            [ -z "$id" ] && continue
            accessed_epoch=$(date -u -d "$accessed" +%s)
            # Nur Caches ohne Zugriff seit 7 Tagen loeschen - nie den warmen main-Eintrag.
            if [ "$accessed_epoch" -lt "$cutoff_epoch" ]; then
              if gh cache delete "$id" --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
                echo "Loesche Cache '$key' (id=$id, letzter Zugriff $accessed)"
                deleted=$((deleted + 1))
              else
                echo "::warning::Loeschen von Cache $id ($key) fehlgeschlagen (uebersprungen)"
                failed=$((failed + 1))
              fi
            else
              echo "Behalte Cache '$key' (id=$id, letzter Zugriff $accessed, < 7 Tage)"
              kept=$((kept + 1))
            fi
          done < /tmp/caches-to-check.tsv

          echo ""
          echo "=== Zusammenfassung ==="
          echo "Caches geprueft: $total"
          echo "Caches geloescht: $deleted"
          echo "Caches behalten:  $kept (Zugriff < 7 Tage)"
          echo "Fehlschlaege:     $failed"

      - name: Verwaiste Issue-Storage-Branches entfernen (ai/state/* + ai/harness/*, Issue/PR geschlossen, >7 Tage)
        # ADR 0007 (Erbe 0006): Backstop fuer Storage-Branches (ai/harness/* + legacy
        # ai/state/*), deren Ticket den geregelten Abbau nie erreicht hat. Ein
        # geschlossenes Issue/PR + 7 Tage Ruhe = nachweislich verwaisst.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          cutoff_epoch=$(( $(date -u +%s) - 7*86400 ))

          # matching-refs liefert alle Refs unter dem Praefix in einem Call (paginiert).
          branch_total=0
          branch_deleted=0
          branch_failed=0

          while IFS=$'\t' read -r ref sha; do
            [ -z "$ref" ] && continue
            branch_total=$((branch_total + 1))
            branch="${ref#refs/heads/}"                 # ai/state/issue-123 | ai/harness/123
            case "$branch" in
              ai/state/*)   issue="${branch##*issue-}" ;;  # 123
              ai/harness/*) issue="${branch##*/}" ;;      # 123
              *) issue="" ;;
            esac
            if ! [[ "$issue" =~ ^[0-9]+$ ]]; then
              echo "Ueberspringe $branch (keine Issue-Nr im Namen)"
              continue
            fi
            state="$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json state -q .state 2>/dev/null || true)"
            # PR-keyed Storages (PR ohne Closing-Issue): Issue-API kennt die Nummer nicht —
            # dann entscheidet der PR-Zustand (closed = verwaisbar, gleiche 7-Tage-Regel).
            if [ -z "$state" ]; then
              state="$(gh pr view "$issue" --repo "$GITHUB_REPOSITORY" --json state -q .state 2>/dev/null || true)"
            fi
            if [ "$state" != "closed" ]; then
              echo "Behalte $branch (Issue #$issue ${state:-nicht gefunden})"
              continue
            fi
            committed="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$sha" --jq .committer.date 2>/dev/null || true)"
            [ -z "$committed" ] && { echo "Ueberspringe $branch (Commit-Datum nicht ermittelbar)"; continue; }
            if [ "$(date -u -d "$committed" +%s)" -ge "$cutoff_epoch" ]; then
              echo "Behalte $branch (Issue geschlossen, aber Commit juenger als 7 Tage)"
              continue
            fi
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" 2>/dev/null; then
              echo "Loesche $branch (Issue #$issue geschlossen, letzter Commit $committed)"
              branch_deleted=$((branch_deleted + 1))
            else
              echo "::warning::Loeschen von $branch fehlgeschlagen (uebersprungen)"
              branch_failed=$((branch_failed + 1))
            fi
          done < <({ gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/ai/state/" \
                       --jq '.[] | [.ref, .object.sha] | @tsv' 2>/dev/null || true
                     gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/ai/harness/" \
                       --jq '.[] | [.ref, .object.sha] | @tsv' 2>/dev/null || true; })

          echo ""
          echo "=== Zusammenfassung Storage-Branches (ai/state + ai/harness) ==="
          echo "Branches geprueft: $branch_total"
          echo "Branches geloescht: $branch_deleted"
          echo "Fehlschlaege:       $branch_failed"
