# ⚠️ Der Workflow-Name ist der Selektor des Skip-Guards weiter unten
# (`select(.name == "Claude Spec (ai:spec-ready)" ...)`). Wird er hier geaendert,
# muss die jq-Query mitgezogen werden — sonst greift der Guard still nicht mehr.
name: Claude Spec (ai:spec-ready)

# Schreibt die ROTEN Tests (ausführbarer Vertrag) für ein Issue, sobald es
# das Label "ai:spec-ready" erhält UND bereits "ai:analyzed" trägt.
# Setzt **Claude Code** ein; Provider via `vars.LLM_PROVIDER` (zai|claude), aufgelöst in setup-claude.

on:
  issues:
    types: [labeled]

concurrency:
  group: claude-spec-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  spec:
    if: >-
      ${{ github.event.label.name == 'ai:spec-ready'
          && contains(github.event.issue.labels.*.name, 'ai:analyzed')
          && github.event.issue.state == 'open' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    permissions:
      contents: read
      id-token: write
      actions: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Startzeit merken (für weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 840))" >> "$GITHUB_OUTPUT"

      - name: Setup Claude Code (mit Memory-Load)
        id: setup
        uses: ./.github/actions/setup-claude
        with:
          needs-mcp: false
          tools-tier: full
          event-type: ${{ github.event_name }}
          ticket-ref: ${{ github.event.issue.number }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          zai-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}
          openrouter-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}
          memory-load: 'true'

      - name: Skip-Guard (Spec läuft bereits)
        id: skip-guard
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          running=$(gh api --paginate repos/${GITHUB_REPOSITORY}/actions/runs \
            --jq '.workflow_runs[] | select(.name == "Claude Spec (ai:spec-ready)" and (.status == "queued" or .status == "in_progress") and (.event.issue.number | tonumber) == (env.ISSUE | tonumber) and .id != ${{ github.run_id }}) | .id' 2>/dev/null | head -1)
          if [ -n "$running" ]; then
            echo "::notice::Spec-Lauf für Issue #$ISSUE läuft bereits – übersprungen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Doppel-Run-Guard (existierender PR mit Closes #N)
        id: doppel-guard
        if: steps.setup.outputs.configured == 'true' && steps.skip-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if ! existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,isDraft,closingIssuesReferences \
            --jq "[.[] | select((.closingIssuesReferences // []) | any(.number == ${ISSUE}))] | length" 2>/dev/null)"; then
            echo "::warning::Doppel-Run-Guard: gh-API nicht erreichbar – fail-open."
            existing=0
          fi
          if [ "${existing:-0}" -gt 0 ]; then
            echo "::notice::Spec übersprungen – PR existiert bereits für Issue #$ISSUE."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: pnpm einrichten
        if: steps.setup.outputs.configured == 'true' && steps.skip-guard.outputs.skip != 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Node.js einrichten
        if: steps.setup.outputs.configured == 'true' && steps.skip-guard.outputs.skip != 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Abhängigkeiten installieren
        if: steps.setup.outputs.configured == 'true' && steps.skip-guard.outputs.skip != 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Git-Hooks installieren (lefthook)
        if: steps.setup.outputs.configured == 'true' && steps.skip-guard.outputs.skip != 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm exec lefthook install

      - name: Spec via Claude
        id: claude
        if: steps.setup.outputs.configured == 'true' && steps.skip-guard.outputs.skip != 'true' && steps.doppel-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          cat > /tmp/claude-prompt.txt << 'CLAUDE_EOF'
          TICKET-MEMORY: Lies vor Beginn alle Dateien in .claude/ticket-memory/ (falls vorhanden) — ticketspezifisches Gedächtnis aus früheren Phasen. Schreibe am ENDE deine wichtigsten Erkenntnisse (Entscheidungen, Fallstricke, fertige/fehlende Tests) in .claude/ticket-memory/phase-spec.md. Max. ~30 Zeilen, nur Neues.
          FOKUS: NUR Issue #ISSUE_NR. KEINE Abstecher. Token sparen: kurz, präzise, direkt.

          Memory ist bereits geladen (ticket-ISSUE_NR).

          ABLAUF (STRIKT):
            1. SOFORT starten.
            2. Branch anlegen: git switch -c feat/issue-ISSUE_NR-<kurzname>.
               Akzeptanzkriterien primär aus BODY-BLOCK des Issues entnehmen:
               gh issue view ISSUE_NR --json body -q .body (Abschnitt zwischen <!-- KI-ANALYSE:START --> und <!-- KI-ANALYSE:END -->).
            3. ROTE Tests schreiben – je Akzeptanzkriterium echte, ausführbare Tests.
               VORAB Dedup: Prüfe per grep, ob ein AK bereits durch bestehenden Test abgedeckt ist.
                 - Schon abgedeckt → NICHT duplizieren.
                 - Widerspricht AK einem bestehenden Test → alten Test ENTFERNEN und im PR-Body im Abschnitt "Test-Pflege-Bedarf" dokumentieren (Datei:Zeile + Begründung).
            4. Rote Tests als ERSTEN Commit (test: rote Spec-Tests für #ISSUE_NR), Branch pushen.
               DRAFT-PR erstellen (gh pr create --draft) mit Closes #ISSUE_NR im Body. KEIN ai:needs-review setzen.

          ⚠️ LABELS: KEINE Labels setzen! Workflow übernimmt das automatisch.

          VERDICT: GANZ AM ENDE GENAU EINE Zeile:
            - VERDICT: ready (rote Tests geschrieben + Draft-PR erstellt → gibt Issue zur Umsetzung frei)
            - VERDICT: spec-ready (Partial – Tests unvollständig, braucht Folgelauf)

          EHRLICHKEITS-REGEL: VERDICT: ready NUR ausgeben, wenn Draft-PR tatsächlich existiert UND mindestens eine Test-Datei committed+gepusht ist (vorher mit gh pr view/git log verifizieren).

          ZEITLIMIT: Soft-Deadline = SOFT_DEADLINE. Vor jedem Schritt: [ $(date +%s) -ge SOFT_DEADLINE ]. Bei OVER: aktuellen Stand committen+pushen als Draft-PR, Turn beenden.
          CLAUDE_EOF

          sed -i "s/#ISSUE_NR/${{ github.event.issue.number }}/g" /tmp/claude-prompt.txt
          sed -i "s/SOFT_DEADLINE/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/claude-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Memory-Save (ticketspezifisch, dateibasiert)
        # Cache nur schreiben, wenn Claude gelaufen ist (s. workflow-invariants-Test: das
        # outcome-Binding hält diesen Step im Guard-Skip-Fall indirekt heraus).
        if: always() && steps.setup.outputs.configured == 'true' && steps.claude.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.memory-path }}
          key: ${{ steps.setup.outputs.memory-save-key }}
          if-no-path-exists: ignore

      - name: Label-Post-Assertion (VERDICT parsen, Labels via App-Token force-setzen)
        if: always() && steps.setup.outputs.configured == 'true' && steps.skip-guard.outputs.skip != 'true' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure' || steps.doppel-guard.outputs.skip == 'true')
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
          GUARD_SKIP: ${{ steps.doppel-guard.outputs.skip }}
        run: |
          verdict=""
          if [ -f /tmp/claude-output.log ]; then
            verdict="$(grep -oP 'VERDICT:\s*\K.*' /tmp/claude-output.log | tail -1 | tr -d '[:space:]' || true)"
          fi
          echo "Claude-Verdict aus Output: '${verdict:-keins}'"

          if [ "${GUARD_SKIP:-false}" = "true" ]; then
            verdict="ready"
            echo "::notice::Doppel-Run-Guard: PR existiert bereits – behandele als ready."
          fi

          SPEC_PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,closingIssuesReferences \
            --jq "[.[] | select((.closingIssuesReferences // []) | any(.number == ${ISSUE})) | .number] | first" 2>/dev/null || echo "")"
          ARTIFACTS_OK="false"
          if [ -n "$SPEC_PR" ] && [ "$SPEC_PR" != "null" ]; then
            HAS_TESTS="$(gh pr view "$SPEC_PR" --repo "$GITHUB_REPOSITORY" --json files \
              --jq '[.files[].path | (endswith(".test.ts") or endswith(".test.tsx") or endswith(".spec.ts") or endswith(".spec.tsx"))] | any' 2>/dev/null || echo "false")"
            echo "::notice::Spec-PR #$SPEC_PR: HAS_TESTS=$HAS_TESTS"
            if [ "$HAS_TESTS" = "true" ]; then
              ARTIFACTS_OK="true"
            fi
          fi

          if [ "$verdict" = "ready" ]; then
            if [ "$ARTIFACTS_OK" != "true" ]; then
              echo "::error title=❌ Spec fehlt::VERDICT ready, aber kein Spec-PR mit Tests."
              exit 1
            fi
            final="ready"
          elif [ "$verdict" = "spec-ready" ]; then
            if [ "$ARTIFACTS_OK" = "true" ]; then
              final="ready"
            else
              final="spec-ready"
            fi
          else
            if [ "$ARTIFACTS_OK" = "true" ]; then
              final="ready"
            else
              echo "::error title=❌ Spec fehlgeschlagen::Kein VERDICT und keine Artefakte."
              exit 1
            fi
          fi

          gh label create "ai:ready" --repo "$GITHUB_REPOSITORY" --color 0E8A16 2>/dev/null || true
          gh label create "ai:spec-ready" --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true

          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:spec-ready" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:ready" 2>/dev/null || true

          if [ "$final" = "ready" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:ready"
            echo "::notice::Label gesetzt: ai:ready (verifiziert: Spec-PR + rote Tests)"
          else
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:spec-ready"
            echo "::notice::Label gesetzt: ai:spec-ready (Partial)"
          fi

      - name: Ergebnis zusammenfassen
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          SKIP_GUARD: ${{ steps.skip-guard.outputs.skip }}
          SKIP_DOPPEL: ${{ steps.doppel-guard.outputs.skip }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          # Je ein eigener Arm pro Guard: ohne sie faellt der gewollte Skip auf den
          # Fehler-Arm (OUTCOME ist leer, weil der claude-Step nie lief) und meldet ❌.
          if [ "${SKIP_GUARD:-false}" = "true" ]; then
            echo "::notice title=⏭️ Spec übersprungen::Issue #${ISSUE} — Lauf bereits aktiv"
          elif [ "${SKIP_DOPPEL:-false}" = "true" ]; then
            echo "::notice title=⏭️ Spec übersprungen::Issue #${ISSUE} — PR existiert bereits"
          elif [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Spec erfolgreich::Issue #${ISSUE} — Rote Tests geschrieben"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Spec abgebrochen"
          else
            echo "::error title=❌ Spec fehlgeschlagen"
          fi
          {
            echo "### Spec #${ISSUE} – fertig"
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Labels: ${labels:-keine}"
          } >> "$GITHUB_STEP_SUMMARY"
