name: 00-Set LLM Provider

# Manuelles Umschalten der Repository-Variable LLM_PROVIDER (claude | zai | openrouter)
# Löst KEINE Folge-Workflows aus — nur Variable setzen + Verifizieren.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'LLM-Provider für alle 5 Pipeline-Phasen'
        type: choice
        required: true
        default: 'claude'
        options:
          - claude
          - zai
          - openrouter
      dry-run:
        description: 'Nur anzeigen, was passieren würde (keine Änderung)'
        type: boolean
        required: false
        default: false

jobs:
  set-provider:
    name: Update LLM_PROVIDER
    runs-on: ubuntu-latest
    permissions:
      contents: read
      variables: write # Für Repository-Variable LLM_PROVIDER
    steps:
      - name: Checkout (für gh auth)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Aktuelle Variable anzeigen
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh variable get LLM_PROVIDER -R "${GITHUB_REPOSITORY}" 2>/dev/null || echo 'nicht gesetzt')"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "Aktueller Wert: ${current}"

      - name: Validierung (nur erlaubte Werte)
        if: ${{ !inputs.dry-run }}
        env:
          TARGET: ${{ inputs.provider }}
        run: |
          case "${TARGET}" in
            claude|zai|openrouter) ;;
            *)
              echo "::error::Ungültiger Provider '${TARGET}' — erlaubt: claude, zai, openrouter"
              exit 1
              ;;
          esac

      - name: Variable setzen
        if: ${{ !inputs.dry-run }}
        id: set-var
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.provider }}
        run: |
          gh variable set LLM_PROVIDER -b "${TARGET}" -R "${GITHUB_REPOSITORY}"
          echo "::notice title=✅ Variable gesetzt::LLM_PROVIDER=${TARGET}"

      - name: Verifizieren
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 1  # kurze Propagation-Pause
          verified="$(gh variable get LLM_PROVIDER -R "${GITHUB_REPOSITORY}" 2>/dev/null || echo 'FEHLER')"
          echo "Verifizierter Wert: ${verified}"
          if [ "${verified}" != "${{ inputs.provider }}" ]; then
            echo "::error::Verifikation fehlgeschlagen — Variable nicht übernommen"
            exit 1
          fi

      - name: Dry-Run Summary
        if: ${{ inputs.dry-run }}
        run: |
          echo "::notice::DRY-RUN — würde LLM_PROVIDER auf '${{ inputs.provider }}' setzen (aktuell: ${{ steps.current.outputs.current }})"

      - name: Zusammenfassung
        if: always()
        run: |
          {
            echo "### LLM Provider Update"
            echo ""
            echo "- **Target Provider:** ${{ inputs.provider }}"
            echo "- **Previous Value:** ${{ steps.current.outputs.current }}"
            echo "- **Mode:** ${{ inputs.dry-run && 'Dry-Run (keine Änderung)' || 'Live' }}"
            echo "- **Status:** ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
