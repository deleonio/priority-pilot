name: Claude PR Fixup (Findings umsetzen)

# Reagiert auf das Label "ai:needs-changes" (vom Review-Workflow gesetzt) und setzt die
# zutreffenden Findings um (Fix + Antwort im Thread + Push). Zum Abschluss Label-Umschaltung
# zurueck auf "ai:needs-review" -> der Review prueft erneut. Steuerung rein ueber LABELS
# (kein Review-/Kommentar-/Push-Event) -> stabiles Ping-Pong:
#   review --(ai:needs-changes)--> fixup --(ai:needs-review)--> review --> ... bis ai:ready-to-merge
# Entspricht Schritt 5.3 aus .ai-knowledge/ticket-implementation.md.
#
# Nutzt ein kurzlebiges GitHub-App-Token, damit Push und Label-Umschaltung greifen.
# Voraussetzungen: CLAUDE_CODE_OAUTH_TOKEN sowie eine GitHub App (APP_ID + APP_PRIVATE_KEY).

on:
  pull_request:
    types: [labeled]

concurrency:
  # Gemeinsame Gruppe mit dem Review-Workflow (claude-pr-review.yml): Review und Fixup desselben PRs
  # laufen dadurch nie parallel, sondern strikt nacheinander — ein Fixup wartet auf ein laufendes
  # Review (und umgekehrt), und auch gleiche Workflows auf demselben PR reihen sich ein statt
  # parallel zu laufen. cancel-in-progress: false -> warten statt abbrechen (einen laufenden Fix
  # nicht mittendrin verwerfen).
  group: claude-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fixup:
    # Nur wenn GENAU das Label ai:needs-changes gesetzt wurde, an nicht-Draft-PRs aus demselben Repo.
    if: >-
      ${{ github.event.label.name == 'ai:needs-changes'
          && github.event.pull_request.draft == false
          && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Voraussetzung pruefen (GitHub-App-Secrets)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::GitHub-App-Secrets fehlen (APP_ID und/oder APP_PRIVATE_KEY) — Lauf wird uebersprungen (kein Fehler). GitHub App anlegen (Contents/Issues/Pull requests = Read and write), aufs Repo installieren und beide Werte als Repo-Secrets hinterlegen, damit die Pipeline laeuft."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout (PR-Head-Branch)
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }} # Fix-Push als App-Token

      # Standard-Pfad (Claude): laeuft, solange die Repo-Variable AI_AGENT NICHT auf "mistral" steht
      # (auch ungesetzt -> Claude bleibt Default). Umschalten: `gh variable set AI_AGENT --body
      # mistral` (zurueck: `gh variable set AI_AGENT --body claude`).
      - name: Findings umsetzen via Claude Code
        id: claude
        if: steps.preflight.outputs.configured == 'true' && vars.AI_AGENT != 'mistral'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # App-Bot als Ausloeser zulassen — der Review setzt das Label als Bot, sonst blockt
          # checkHumanActor diesen Fixup-Lauf (Bot-Name aus der Fehlermeldung der Action).
          allowed_bots: 'my-github-action-bot'
          prompt: |
            Auf Pull Request #${{ github.event.pull_request.number }} hat der Review das Label
            `ai:needs-changes` gesetzt. Arbeite die offenen Kreuzverhör-Findings ab — Schritt 5.3
            aus .ai-knowledge/ticket-implementation.md. Die Pipeline koordiniert ausschließlich
            über LABELS — schalte sie zum Abschluss exakt wie unten beschrieben um.

            Vorgehen:
              1. Findings lesen: `gh pr view`, `gh pr diff`, die Review-Threads
                 (`gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`)
                 und CI (`gh pr checks`).
              2. Zutreffende, EINDEUTIGE Findings fixen: Code ändern, `pnpm format` + Lint,
                 committen und auf den PR-Branch `${{ github.event.pull_request.head.ref }}` pushen.
                 Im jeweiligen Thread antworten und ihn auflösen. Mehrdeutige oder architektonisch
                 große Punkte NICHT blind umsetzen — begründet kommentieren bzw. dem Menschen
                 überlassen. Bereits begründet abgelehnte Findings nicht erneut aufmachen.
              3. Abschluss: Labels in ZWEI getrennten Befehlen umschalten (nie kombiniert, sonst
                 Doppel-Trigger), damit der Review erneut prüft:
                 `gh pr edit ${{ github.event.pull_request.number }} --remove-label ai:needs-changes`,
                 danach `gh pr edit ${{ github.event.pull_request.number }} --add-label ai:needs-review`
              4. Sicherheitsnetz gegen Endlosschleifen: Trägt der Branch schon viele Fixup-Commits
                 aus diesem Loop (Richtwert > 5) und bleiben Punkte offen, NICHT weiter drehen —
                 das Label `ai:needs-changes` belassen (NICHT auf ai:needs-review schalten, sonst
                 läuft der Loop weiter), den Stand zusammenfassen und den Menschen
                 (@${{ github.repository_owner }}) taggen.

            Bearbeite ausschließlich diesen PR. Arbeite autonom, ohne interaktive Rückfrage.
          claude_args: >-
            --model claude-opus-4-8 --effort medium
            --allowedTools "Bash(gh pr:*),Bash(gh issue view:*),Bash(gh label:*),Bash(gh api:*),Bash(git switch:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(git fetch:*),Bash(pnpm:*),Read,Edit,Write,Grep,Glob"
            --append-system-prompt "Automatisierter, label-gesteuerter Fixup-Lauf in GitHub Actions (headless) fuer PR #${{ github.event.pull_request.number }}. Setze nur eindeutige, zutreffende Findings um; mehrdeutige/grosse Punkte dem Menschen ueberlassen. Schalte zum Abschluss die Labels um (ai:needs-changes -> ai:needs-review) — AUSSER der Loop soll wegen Nicht-Konvergenz anhalten, dann ai:needs-changes belassen und den Menschen taggen. Arbeite ohne interaktive Rueckfrage."

      # Mistral-Pfad (AI_AGENT == 'mistral'): Vibe laeuft headless OHNE Approval-Callback — ohne
      # erzwungenes Auto-Approve wuerde jedes genehmigungspflichtige Tool (gh/git/pnpm/Datei-Writes)
      # als "Tool execution not permitted" uebersprungen. default_agent=auto-approve setzt
      # bypass_tool_permissions=true; ~/.vibe/config.toml ist der Default-Konfig-Ort (VIBE_HOME).
      - name: Vibe-Konfig (Headless Auto-Approve)
        if: steps.preflight.outputs.configured == 'true' && vars.AI_AGENT == 'mistral'
        run: |
          mkdir -p "$HOME/.vibe"
          cat > "$HOME/.vibe/config.toml" <<'EOF'
          default_agent = "auto-approve"
          bypass_tool_permissions = true
          EOF

      # Spiegelt den Claude-Schritt: gleicher Fixup-Ablauf, anderer Agent. GH_TOKEN = App-Token,
      # damit Push und Label-Umschaltung die Folge-Workflows ausloesen; der Push laeuft ueber den im
      # Checkout gesetzten App-Token-Remote. Die Vibe-Action reicht KEINE Extra-Flags durch —
      # System-Prompt-Regeln als fuehrender [KONTEXT]-Block; keine Tool-Restriktion erzwingbar.
      - name: Findings umsetzen via Mistral Vibe
        id: mistral
        if: steps.preflight.outputs.configured == 'true' && vars.AI_AGENT == 'mistral'
        uses: mistralai/mistral-vibe@v2.17.1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }} # gh/Push als App-Token -> Label-Wechsel loest Review aus
        with:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          prompt: |
            [KONTEXT/REGELN] Automatisierter, label-gesteuerter Fixup-Lauf in GitHub Actions
            (headless) fuer PR #${{ github.event.pull_request.number }}. Setze nur eindeutige,
            zutreffende Findings um; mehrdeutige/grosse Punkte dem Menschen ueberlassen. Schalte zum
            Abschluss die Labels um (ai:needs-changes -> ai:needs-review) — AUSSER der Loop soll
            wegen Nicht-Konvergenz anhalten, dann ai:needs-changes belassen und den Menschen taggen.
            Arbeite ohne interaktive Rueckfrage. Nutze fuer GitHub-Operationen die `gh`-CLI (Token
            ist gesetzt).

            Auf Pull Request #${{ github.event.pull_request.number }} hat der Review das Label
            `ai:needs-changes` gesetzt. Arbeite die offenen Kreuzverhör-Findings ab — Schritt 5.3
            aus .ai-knowledge/ticket-implementation.md. Die Pipeline koordiniert ausschließlich
            über LABELS — schalte sie zum Abschluss exakt wie unten beschrieben um.

            Vorgehen:
              1. Findings lesen: `gh pr view`, `gh pr diff`, die Review-Threads
                 (`gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`)
                 und CI (`gh pr checks`).
              2. Zutreffende, EINDEUTIGE Findings fixen: Code ändern, `pnpm format` + Lint,
                 committen und auf den PR-Branch `${{ github.event.pull_request.head.ref }}` pushen.
                 Im jeweiligen Thread antworten und ihn auflösen. Mehrdeutige oder architektonisch
                 große Punkte NICHT blind umsetzen — begründet kommentieren bzw. dem Menschen
                 überlassen. Bereits begründet abgelehnte Findings nicht erneut aufmachen.
              3. Abschluss: Labels in ZWEI getrennten Befehlen umschalten (nie kombiniert, sonst
                 Doppel-Trigger), damit der Review erneut prüft:
                 `gh pr edit ${{ github.event.pull_request.number }} --remove-label ai:needs-changes`,
                 danach `gh pr edit ${{ github.event.pull_request.number }} --add-label ai:needs-review`
              4. Sicherheitsnetz gegen Endlosschleifen: Trägt der Branch schon viele Fixup-Commits
                 aus diesem Loop (Richtwert > 5) und bleiben Punkte offen, NICHT weiter drehen —
                 das Label `ai:needs-changes` belassen (NICHT auf ai:needs-review schalten, sonst
                 läuft der Loop weiter), den Stand zusammenfassen und den Menschen
                 (@${{ github.repository_owner }}) taggen.

            Bearbeite ausschließlich diesen PR. Arbeite autonom, ohne interaktive Rückfrage.

      # Deterministisches Abschluss-Signal (unabhaengig von der LLM-Ausgabe): laeuft auch bei
      # Abbruch/Timeout (if: always()) und macht im Log/Job-Summary klar sichtbar, DASS und mit
      # welchem Ergebnis der Lauf fertig ist. outcome=cancelled signalisiert das 20-Min-Timeout.
      - name: Ergebnis zusammenfassen
        if: always() && steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          AGENT: ${{ vars.AI_AGENT == 'mistral' && 'Mistral' || 'Claude' }}
          # Outcome des tatsaechlich gelaufenen Agent-Schritts (der andere ist 'skipped').
          OUTCOME: ${{ steps.claude.outcome != 'skipped' && steps.claude.outcome || steps.mistral.outcome }}
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
        run: |
          labels="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          {
            echo "### Fixup #${PR} — fertig"
            echo ""
            echo "- ${AGENT}-Schritt: \`${OUTCOME:-unbekannt}\` (cancelled = 20-Min-Timeout erreicht)"
            echo "- Aktuelle Pipeline-Labels: ${labels:-keine}"
            if [ -n "$SESSION_ID" ]; then echo "- Session-ID: \`${SESSION_ID}\` (\`--resume\` zum Nachschauen)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Fixup #${PR} fertig::${AGENT}-Schritt ${OUTCOME:-unbekannt}; Labels: ${labels:-keine}"
