name: Claude PR Fixup (Findings umsetzen)

# Reagiert auf das Label "ai:needs-changes" (vom Review-Workflow gesetzt) und setzt die
# zutreffenden Findings um (Fix + Antwort im Thread + Push). Zum Abschluss Label-Umschaltung
# zurueck auf "ai:needs-review" -> der Review prueft erneut. Steuerung rein ueber LABELS
# (kein Review-/Kommentar-/Push-Event) -> stabiles Ping-Pong:
#   review --(ai:needs-changes)--> fixup --(ai:needs-review)--> review --> ... bis ai:ready-to-merge
# Entspricht Schritt 5.3 aus .ai-knowledge/ticket-implementation.md.
#
# Nutzt ein kurzlebiges GitHub-App-Token, damit Push und Label-Umschaltung greifen.
# Voraussetzungen: CLAUDE_CODE_OAUTH_TOKEN sowie eine GitHub App (APP_ID + APP_PRIVATE_KEY).

on:
  pull_request:
    types: [labeled]

concurrency:
  # EIGENE Gruppe pro Workflow (Fixup getrennt von Review) — ausfuehrliche Begruendung in
  # claude-pr-review.yml. Kurz: eine gemeinsame Gruppe + Trigger beider Workflows auf jedes
  # `labeled`-Event liessen No-op-Geschwister-Runs den echten Fixup aus dem einzigen Pending-Slot
  # canceln (GitHub haelt pro Gruppe nur einen laufenden + einen wartenden Run). Getrennte Gruppen
  # serialisieren nur noch GLEICHE Fixup-Laeufe desselben PRs. cancel-in-progress: false -> einen
  # laufenden Fix nie mittendrin verwerfen (Push-Sicherheit).
  group: claude-pr-fixup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fixup:
    # Nur wenn GENAU das Label ai:needs-changes gesetzt wurde, an nicht-Draft-PRs aus demselben Repo.
    if: >-
      ${{ github.event.label.name == 'ai:needs-changes'
          && github.event.pull_request.draft == false
          && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      BASH_MAX_OUTPUT_LENGTH: '20000'
      CLAUDE_HIDE_BANNER: '1'
      API_TIMEOUT_MS: '3000000'
    permissions:
      contents: read
      id-token: write
      actions: write # `gh cache delete` + actions/cache im Session-Archiv-Schritt (Soft-Abort, 2026-07-08)
    steps:
      # Startzeit fuer das weiche Zeitlimit (Soft-Abort, 2026-07-08): soft_deadline_epoch = jetzt +
      # 840s (14 Min, 6 Min Puffer bis zum harten 20-Min-Kill). PR-Workflows hatten bisher keine
      # eigene Startzeit-Erfassung (cancel-in-progress:false macht outcome=cancelled hier ohnehin
      # eindeutig einen echten Timeout, ein Zeit-Guard war daher nie noetig) -- der Epoch-Wert wird
      # unten als literale Zahl in den Prompt gerendert.
      - name: Startzeit merken (fuer weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "soft_deadline_epoch=$((now + 840))" >> "$GITHUB_OUTPUT"

      - name: Voraussetzung pruefen (GitHub-App-Secrets)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::GitHub-App-Secrets fehlen (APP_ID und/oder APP_PRIVATE_KEY) — Lauf wird uebersprungen (kein Fehler). GitHub App anlegen (Contents/Issues/Pull requests = Read and write), aufs Repo installieren und beide Werte als Repo-Secrets hinterlegen, damit die Pipeline laeuft."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout (PR-Head-Branch)
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }} # Fix-Push als App-Token

      # KI-Backend (Issue #403): Label `ai:use-zai` oder `ai:use-hermes` am PR ODER dessen
      # verlinktem Issue waehlt pro Lauf z.ai oder Hermes statt Anthropic (Default). Schreibt
      # AI_BACKEND=anthropic|zai|hermes nach $GITHUB_ENV; bei z.ai kommen Endpoint + ANTHROPIC_AUTH_TOKEN
      # (Secret ZAI_API_KEY) dazu; bei hermes wird API_SERVER_ENABLED + API_SERVER_KEY gesetzt.
      # Muss VOR Preflight + Agent-Schritt.
      - name: KI-Backend konfigurieren
        if: steps.preflight.outputs.configured == 'true'
        uses: ./.github/actions/configure-ai-backend
        with:
          entity-type: pr
          entity-number: ${{ github.event.pull_request.number }}
          gh-token: ${{ steps.app-token.outputs.token }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          hermes-api-key: ${{ secrets.HERMES_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}

      # Modell-Konfiguration für Hermes/Fixup
      - name: Modell-Konfiguration für Hermes vorbereiten
        id: hermes-config
        if: steps.preflight.outputs.configured == 'true'
        run: |
          case "${{ env.AI_BACKEND }}" in
            hermes)
              echo "HERMES_PROVIDER=${{ env.HERMES_PROVIDER || 'anthropic' }}" >> "$GITHUB_ENV"
              echo "HERMES_MODEL=${{ env.HERMES_MODEL || 'claude-sonnet-4-6' }}" >> "$GITHUB_ENV"
              ;;
            zai)
              echo "HERMES_PROVIDER=zai" >> "$GITHUB_ENV"
              echo "HERMES_MODEL=glm-4.7" >> "$GITHUB_ENV"
              ;;
            openrouter)
              echo "HERMES_PROVIDER=openrouter" >> "$GITHUB_ENV"
              # TODO: Default-Modell-ID gegen den realen OpenRouter-Katalog verifizieren/anpassen.
              echo "HERMES_MODEL=${{ env.HERMES_MODEL || 'anthropic/claude-sonnet-4.5' }}" >> "$GITHUB_ENV"
              ;;
            *)
              echo "HERMES_PROVIDER=anthropic" >> "$GITHUB_ENV"
              echo "HERMES_MODEL=claude-sonnet-4-6" >> "$GITHUB_ENV"
              ;;
          esac

      # Deterministischer Agent-Secret-Check (Haerten S2): die OAuth-Token-Voraussetzung fuer
      # das gewählte Backend darf NICHT still skippen — fehlt das Secret, bricht der Lauf hier
      # deterministisch ab (::error::, kein stiller Skip). Der Fixup-Check wird rot -> Gate setzt
      # ai:needs-changes -> sichtbar. Zusaetzlich ein PR-Kommentar (statt Issue-Label wie bei
      # triage/spec/implement — PR-Workflows vergeben bewusst kein ai:to-big-issue, s.
      # S3/Timeout-Alarm), damit der Ausfall nicht nur im Checks-Tab sichtbar ist, sondern den
      # PR-Autor aktiv erreicht.
      - name: Agent-Secret prüfen (kein stiller Skip)
        if: steps.preflight.outputs.configured == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          AI_BACKEND: ${{ env.AI_BACKEND }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          case "${AI_BACKEND:-}" in
            zai)
              echo "KI-Backend=zai — Auth via ZAI_API_KEY (in configure-ai-backend validiert). OAuth-Preflight entfaellt."
              exit 0
              ;;
            hermes)
              echo "KI-Backend=hermes — Auth via HERMES_API_KEY (in configure-ai-backend validiert). OAuth-Preflight entfaellt."
              exit 0
              ;;
            openrouter)
              echo "KI-Backend=openrouter — Auth via OPENROUTER_API_KEY (in configure-ai-backend validiert). OAuth-Preflight entfaellt."
              exit 0
              ;;
          esac

          # Default: Anthropic (Claude Code)
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error title=Agent-Secret fehlt::CLAUDE_CODE_OAUTH_TOKEN fehlt — fehlt es, darf der Lauf nicht still skippen (AGENTS.md: bewusstes Opt-in). Secret als Repo-Secret hinterlegen."
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "🛑 **Fixup #${PR} — Agent-Secret fehlt**

          CLAUDE_CODE_OAUTH_TOKEN ist nicht gesetzt. Der Lauf wurde abgebrochen (kein stiller Skip). Bitte Secret hinterlegen." 2>/dev/null || true
            exit 1
          fi
          echo "Agent-Secret (CLAUDE_CODE_OAUTH_TOKEN) vorhanden."

      - name: pnpm einrichten
        if: steps.preflight.outputs.configured == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Node.js einrichten
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc # zentrale Node-Version (gleicher Stand wie ci/implement/deploy)
          cache: pnpm

      - name: Abhaengigkeiten installieren
        if: steps.preflight.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Git-Hooks installieren (lefthook)
        if: steps.preflight.outputs.configured == 'true'
        run: pnpm exec lefthook install

      # Merge-Konflikte erkennen und automatisch auflösen (Merge-Strategie: git merge --no-ff).
      # Dies muss VOR dem LLM-Schritt passieren, damit die KI auf einem sauberen Stand arbeitet.
      # Härtung H2: GitHub berechnet `mergeable` ASYNCHRON — direkt nach einem Push ist es oft
      # UNKNOWN/null. Früher fiel UNKNOWN in den Default-Zweig (conflict=false), sodass der LLM auf
      # einem nicht merge-fähigen Stand lief, ohne dass die Konflikt-Behandlung griff. Jetzt: UNKNOWN
      # wird explizit (mit kurzem Retry) behandelt; Bedingungen sind explizit geklammert (Shell-
      # Präzedenz `&&` bindet stärker als `||`); [skip ci] im Merge-Commit ENTFERNT, damit CI den
      # gemergten Stand validiert (sonst schlüge ein semantisch kaputter Auto-Merge erst beim
      # finalen Fix-Push auf).
      - name: Merge-Konflikte prüfen und auflösen
        id: resolve-conflicts
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # 1. Mergeable-Status von GitHub API (EIN Call, beide Felder).
          fetch_state() { gh pr view "$PR" --repo "$REPO" --json mergeable,mergeStateStatus; }
          # Fallback bei transienter gh-API-Störung: set -euo pipefail wuerde den Step sonst toeten,
          # bevor der LLM laeuft. conflict=unknown -> LLM prueft Konflikte selbst via git status/diff.
          if ! state_json="$(fetch_state 2>/dev/null)"; then
            echo "conflict=unknown" >> "$GITHUB_OUTPUT"
            echo "::warning::gh-API (mergeable) nicht erreichbar — LLM prüft Konflikte selbst via git status/diff."
            exit 0
          fi
          mergeable="$(echo "$state_json" | jq -r '.mergeable')"
          merge_state="$(echo "$state_json" | jq -r '.mergeStateStatus')"
          echo "PR #$PR - mergeable: $mergeable, mergeStateStatus: $merge_state"

          # 2. UNKNOWN/null-Race behandeln: GitHub berechnet mergeable ASYNCHRON direkt nach Push.
          #    Bis zu 2x kurz warten (5s), dann aufgeben (LLM prüft via git status selbst).
          is_unknown() { [ "$mergeable" = "UNKNOWN" ] || [ "$mergeable" = "null" ] || [ -z "$mergeable" ]; }
          if is_unknown; then
            echo "mergeable ist UNKNOWN/null (async Race) — warte 5s und prüfe erneut..."
            sleep 5
            state_json="$(fetch_state)"
            mergeable="$(echo "$state_json" | jq -r '.mergeable')"
            merge_state="$(echo "$state_json" | jq -r '.mergeStateStatus')"
            echo "Nach Retry - mergeable: $mergeable, mergeStateStatus: $merge_state"
          fi

          # 3. Sauber mergebar -> nichts zu tun.
          if [ "$mergeable" = "MERGEABLE" ]; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "PR ist sauber mergebar — keine Konflikt-Auflösung nötig."
            exit 0
          fi

          # 4. Noch immer UNKNOWN -> Konflikt-Status unklar. KEIN falsches Auto-Merge, KEIN falsches
          #    conflict=false. LLM prüft Konflikte selbst via git status/diff (Prompt deckt das ab).
          if is_unknown; then
            echo "conflict=unknown" >> "$GITHUB_OUTPUT"
            echo "::warning::mergeable bleibt UNKNOWN nach Retry — LLM prüft Konflikte selbst via git status/diff."
            exit 0
          fi

          # 5. Konflikt (DIRTY ODER CONFLICTING) -> Auflösung versuchen. Explizit geklammert
          #    (früher: Präzedenzfehler durch `&& ... || grep`).
          if [ "$merge_state" = "DIRTY" ] || [ "$mergeable" = "CONFLICTING" ]; then
            echo "Merge-Konflikt erkannt bei PR #$PR — versuche automatisch aufzulösen..."

            git fetch origin "$TARGET_BRANCH" --depth=1 --no-tags

            # 6. Lokale Changes sichern (falls vorhanden von vorherigen Fixup-Läufen).
            STASHED="false"
            if ! git diff --quiet; then
              echo "Lokale uncommitted Changes gefunden — stashen..."
              git stash push --include-untracked --message "fixup-stash-before-merge"
              STASHED="true"
            fi

            # 7. Merge versuchen (--no-ff, KEIN [skip ci] — CI soll den gemergten Stand validieren).
            CONFLICT_RESOLVED="false"
            if git merge origin/"$TARGET_BRANCH" --no-ff --no-edit -m "Auto-merge: resolve conflicts for PR #$PR"; then
              echo "✅ Merge erfolgreich — Konflikt automatisch gelöst"
              CONFLICT_RESOLVED="true"
            else
              echo "⚠️ Merge mit Konflikten — prüfe auf echte Konflikt-Marker..."
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "❌ Echte Merge-Konflikte in Dateien — Konflikt-Marker bleiben, KI löst sie im nächsten Schritt."
                CONFLICT_RESOLVED="false"
              else
                echo "❌ Merge fehlgeschlagen, aber keine Konflikt-Marker (z.B. CRLF/permissions) — abort."
                git merge --abort
                CONFLICT_RESOLVED="aborted"
              fi
            fi

            # 8. Nur bei sauber aufgelöstem Merge pushen.
            if [ "$CONFLICT_RESOLVED" = "true" ]; then
              git push origin HEAD:"$HEAD_BRANCH"
              echo "✅ Merge-Commit gepusht (ohne [skip ci] — CI validiert den Stand)"
              echo "conflict=resolved" >> "$GITHUB_OUTPUT"
            elif [ "$CONFLICT_RESOLVED" = "false" ]; then
              echo "conflict=needs_resolution" >> "$GITHUB_OUTPUT"
              echo "::warning::Echte Merge-Konflikte — KI löst sie im nächsten Schritt."
            else
              echo "conflict=aborted" >> "$GITHUB_OUTPUT"
              echo "::error::Merge aborted — nicht lösbar, Mensch muss manuell eingreifen."
            fi

            # 9. Gestashte Changes wiederherstellen.
            if [ "$STASHED" = "true" ]; then
              echo "Stash wiederherstellen..."
              git stash pop || echo "::warning::Stash pop fehlgeschlagen"
            fi
          else
            # 10. Nicht wegen Konflikt nicht mergebar (z.B. BLOCKED/UNSTABLE/BEHIND wegen Checks).
            echo "PR nicht mergebar, aber nicht wegen Merge-Konflikt (mergeable=$mergeable, state=$merge_state)"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          fi

      # Deterministischer Stop-Guard (Haerten C1/S1): der review<->fixup-Loop ist durch das 20-Min-
      # Timeout gedeckelt, aber die Spec (pipeline-flow.md) verspricht einen Stop-Guard. Frueher
      # existierte der NUR als Prompt-Anweisung (LLM soll selbst zaehlen). Dieser Step zaehlt
      # deterministisch die PR-eigenen Commits (Spec- + Implementierungs- + Fixup-Commits — eine
      # saubere Trennung NUR nach Fixup-Commits brauchte eine unzuverlaessige ready_for_review-
      # Timeline; daher Heuristik: alle PR-Commits, Schwelle > 10) und stoppt den Lauf hart:
      # ai:needs-changes BELASSEN (kein --add-label ai:needs-review), PR-Autor pingen, Agent-Schritt
      # überspringen. Hinweis: ein 0-Commit-Loop (Fixup ohne Findings) wird hiervon NICHT gebremst —
      # in dem Fall alarmiert die H1-Post-Assertion im Review per PR-Kommentar.
      - name: Stop-Guard (> 10 PR-Commits)
        id: stop-guard
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Anzahl Commits auf dem PR-Branch (Spec+Impl+Fixup — semantisch nicht trennbar ohne
          # unzuverlaessige ready_for_review-Timeline, daher Heuristik alle PR-Commits, Schwelle > 10).
          # Fallback bei transienter gh-API-Stoerung (Haerten C1-Nachtrag): NICHT stillschweigend als
          # "0 Commits" werten — das wuerde den Guard bei einem echten, anhaltenden API-Ausfall
          # dauerhaft wirkungslos machen (exakt das Gegenteil der Absicht). Stattdessen fail-closed:
          # der Agent-Lauf wird uebersprungen (stop=true), bis die Zaehlung wieder moeglich ist.
          if ! commits="$(gh pr view "$PR" --repo "$REPO" --json commits --jq '.commits | length' 2>/dev/null)"; then
            echo "stop=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Stop-Guard::gh-API (commits) nicht erreichbar — PR-Commits koennen nicht gezaehlt werden. Fail-closed: Fixup-Agent wird diesen Lauf uebersprungen (ai:needs-changes bleibt), statt den Guard wirkungslos zu machen."
            gh pr comment "$PR" --repo "$REPO" --body "🛑 **Stop-Guard: gh-API nicht erreichbar**

          PR #$PR — der Stop-Guard konnte die PR-Commits nicht zaehlen (gh-API-Stoerung). Fail-closed: der Fixup-Agent wird diesen Lauf uebersprungen, damit der Guard bei einem echten API-Ausfall nicht wirkungslos wird. Bitte erneut anstossen (z. B. per Push) oder manuell pruefen." 2>/dev/null || true
            exit 0
          fi
          if [ "${commits:-0}" -gt 10 ]; then
            author="$(gh pr view "$PR" --repo "$REPO" --json author --jq '.author.login' 2>/dev/null || echo '')"
            mention="@${author:-$OWNER}"
            echo "stop=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Stop-Guard::PR #$PR hat ${commits} PR-Commits (> 10) — Fixup-Loop wird gestoppt, ai:needs-changes belassen."
            gh pr comment "$PR" --repo "$REPO" --body "🛑 **Stop-Guard: Fixup-Loop gestoppt**

          PR #$PR hat **${commits} PR-Commits** (Richtwert > 10). Die Kreuzverhör-Findings konvergieren offenbar nicht automatisch.
          ${mention}: Bitte manuell prüfen und entscheiden (Labels selbst setzen oder PR schließen). Der Loop wird nicht weitergedreht." 2>/dev/null || true
            exit 0
          fi
          echo "stop=false" >> "$GITHUB_OUTPUT"
          echo "PR #$PR hat ${commits} PR-Commits (≤ 10) — Fixup darf laufen."

      # Soft-Abort-Obergrenze (2026-07-08): merkt sich, ob "ai:continued" bereits VOR diesem Lauf
      # gesetzt war. Der Cap-Step nach dem Claude-Schritt liest diesen Wert, um eine zweite
      # Fortsetzung in Folge zu verhindern (siehe dort).
      - name: Fortsetzungs-Stand pruefen (ai:continued)
        id: continued-before
        if: steps.preflight.outputs.configured == 'true' && steps.stop-guard.outputs.stop != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          already="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels \
            --jq 'any(.labels[]; .name == "ai:continued")' 2>/dev/null || echo false)"
          echo "already=${already:-false}" >> "$GITHUB_OUTPUT"

      # Named Session Resume (Phase "fix", Soft-Abort-Rollout 2026-07-08): PRs haben keine
      # Issue-Nummer im Event, daher wird hier die PR-Nummer uebergeben -- `id-type: pr` haelt den
      # Cache-Key-Namensraum (claude-session-pr-<N>) getrennt vom issue-basierten
      # (claude-session-issue-<N>) der anderen drei Phasen (Kreuzverhoer-Finding M3, 2026-07-08:
      # ohne diese Trennung waere "claude-session-issue-<N>" fuer eine PR-Nummer irrefuehrend
      # benannt). Fail-open wie in claude-triage.yml.
      - name: Session-Archiv wiederherstellen (Phase fix)
        id: session-restore
        if: steps.preflight.outputs.configured == 'true' && steps.stop-guard.outputs.stop != 'true'
        continue-on-error: true
        uses: ./.github/actions/session-restore
        with:
          issue: ${{ github.event.pull_request.number }}
          phase: fix
          id-type: pr

      - name: Supersede-Check
        id: supersede-check
        # Scope auf DENSELBEN PR (head_branch): Der Filter matcht sonst nur den Workflow-NAMEN und
        # die native concurrency-Gruppe ist pro PR -> ein Fixup-Lauf eines ANDEREN PRs (gleicher
        # Name, in_progress) würde diesen Lauf fälschlich als "superseded" überspringen. head_branch
        # ist pro PR eindeutig und grenzt korrekt auf Geschwister-Läufe desselben PRs ein.
        # HEAD_BRANCH wird via $ENV IN jq gelesen (NICHT in die Query interpoliert): ", $ und ` sind
        # gültige git-Branch-Zeichen und würden eine interpolierte jq-Query brechen/injizieren.
        if: steps.preflight.outputs.configured == 'true' && steps.stop-guard.outputs.stop != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          running=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs \
            --jq '.workflow_runs[] | select(.name == "Claude PR Fixup" and (.status == "queued" or .status == "in_progress") and .head_branch == $ENV.HEAD_BRANCH and .id != ${{ github.run_id }}) | .id' 2>/dev/null | head -1)
          if [ -n "$running" ]; then
            echo "::notice::Ein Fixup-Lauf für PR #${{ github.event.pull_request.number }} läuft bereits — dieser Trigger wird übersprungen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Findings umsetzen via Hermes Agent
        id: hermes
        if: steps.preflight.outputs.configured == 'true' && steps.stop-guard.outputs.stop != 'true' && steps.supersede-check.outputs.skip != 'true' && (env.AI_BACKEND == 'hermes' || env.AI_BACKEND == 'openrouter')
        uses: ./.github/actions/hermes-agent-action
        with:
          hermes_args: >-
            --allowedTools "Bash(gh pr:*),Bash(gh issue view:*),Bash(gh label:*),Bash(gh api:*),Bash(git switch:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(git fetch:*),Bash(git merge:*),Bash(git stash:*),Bash(git reset:*),Bash(pnpm:*),Read,Edit,Write,Grep,Glob,Task"
            --append-system-prompt "Automatisierter, label-gesteuerter Fixup-Lauf in GitHub Actions (headless) fuer PR #${{ github.event.pull_request.number }}. Setze nur eindeutige, zutreffende Findings um; mehrdeutige/grosse Punkte dem Menschen ueberlassen. Schalte die Labels ALS ALLERLETZTEN Schritt um (ai:needs-changes -> ai:needs-review), NIE davor — erst nach Commit+Push, da der Review den PR-Stand unmittelbar danach liest. AUSSER der Loop soll wegen Nicht-Konvergenz anhalten, dann ai:needs-changes belassen und den Menschen taggen. HARTES 20-Minuten-Timeout, weiches Limit bei 14 Min (Soft-Abort): pruefe vor jedem groesseren Teilschritt `date +%s` gegen ${{ steps.starttime.outputs.soft_deadline_epoch }}; ist das erreicht, sichere den Zwischenstand (committen/pushen, PR-Kommentar mit offenen Punkten), setze ai:continued UND entferne+setze ai:needs-changes neu (Selbst-Retrigger, der Folgelauf setzt per --resume fort) statt auf ai:needs-review umzuschalten, dann beende den Turn. Arbeite ohne interaktive Rueckfrage. Modell-Strategie: Du laeufst als Sonnet-Koordinator. Schaetze die Komplexitaet der Aufgabe ein und delegiere die eigentliche Abarbeitung per Agent-Tool an einen Subagenten in derselben Session: heavy (Opus) fuer komplexe/architektonische Aufgaben, light (Haiku) fuer triviale/mechanische Aufgaben; Standard- und Koordinationsarbeit erledigst du selbst auf Sonnet."
          resume_arg: ${{ steps.session-restore.outputs.resume-arg }}
          github_token: ${{ steps.app-token.outputs.token }}
          hermes_api_key: ${{ env.HERMES_API_SERVER_KEY || '' }}
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          ai_backend: ${{ env.AI_BACKEND }}
          provider: ${{ env.HERMES_PROVIDER || 'anthropic' }}
          model: ${{ env.HERMES_MODEL }}

      - name: Findings umsetzen via Claude Code (Fallback)
        id: claude
        if: steps.preflight.outputs.configured == 'true' && steps.stop-guard.outputs.stop != 'true' && steps.supersede-check.outputs.skip != 'true' && env.AI_BACKEND != 'hermes' && env.AI_BACKEND != 'openrouter'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1.0.165
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          claude_code_oauth_token: ${{ env.AI_BACKEND != 'zai' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ steps.app-token.outputs.token }}
          # Erlaubte Bot-Ausloeser — der Review setzt das Label als Bot (claude[bot]), sonst blockt
          # checkHumanActor diesen Fixup-Lauf. Absicherung zusaetzlich ueber den Job-`if:`.
          allowed_bots: 'claude[bot],my-github-action-bot'
          prompt: |
            Auf Pull Request #${{ github.event.pull_request.number }} hat der Review das Label
            `ai:needs-changes` gesetzt. Arbeite die offenen Kreuzverhör-Findings ab — Schritt 5.3
            aus .ai-knowledge/ticket-implementation.md. Die Pipeline koordiniert ausschließlich
            über LABELS — schalte sie zum Abschluss exakt wie unten beschrieben um.

            HINWEIS ZU MERGE-KONFLIKTEN: Ein vorheriger Schritt hat bereits versucht, Merge-Konflikte
            automatisch aufzulösen. Prüfe mit `git status` und `git diff --name-only --diff-filter=U`
            ob ungelöste Konflikte vorliegen (Dateien mit Konflikt-Markern <<<<<<</========/>>>>>>>).

            Vorgehen:
              0. KONFLIKTAUFLÖSUNG (falls nötig):
                 Falls `git diff --name-only --diff-filter=U` Dateien mit Merge-Konflikten anzeigt:
                 - Analysiere JEDE Konfliktdatei mit `read`
                 - Identifiziere die konkreten Konflikte (zwischen <<<<<<< HEAD und >>>>>>> target_branch)
                 - Löse sie EINDEUTIG auf: Behalte die richtige Version (HEAD für PR-Änderungen,
                   target_branch nur wenn der Konflikt dort bereits behoben wurde)
                 - Bei komplexen inhaltlichen Konflikten (beide Seiten haben relevante Änderungen):
                   Versuche die Änderungen intelligent zu mergen. Falls nicht eindeutig lösbar,
                   kommentiere im PR die Konfliktstelle mit Vorschlag und belasse die Marker.
                 - Nach der Auflösung: `git add <datei>` für alle gelösten Dateien
                  - Commit: `git commit -m "Fix merge conflict in <datei>"`
                 - Push: `git push origin ${{ github.event.pull_request.head.ref }}`
                 - Erst DANN mit den Findings weitermachen.
              1. Findings lesen: `gh pr view`, `gh pr diff`, die Review-Threads
                 (`gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`)
                 und CI (`gh pr checks`).
              2. Zutreffende, EINDEUTIGE Findings fixen: Code ändern, dann vor jedem Commit
                 das lokale CI-Gate grün ziehen:
                 `pnpm format && pnpm exec prettier --check . && pnpm lint && pnpm knip`
                 (repo-weit — CI lintet rekursiv, nicht nur ein Package).
                 Erst wenn alle Checks grün, committen und auf den PR-Branch
                 `${{ github.event.pull_request.head.ref }}` pushen.
                 Bricht CI allein an Format-Check oder Lint, ist das selbst ein Finding.
                 Im jeweiligen Thread antworten und ihn auflösen. Mehrdeutige oder architektonisch
                 große Punkte NICHT blind umsetzen — begründet kommentieren bzw. dem Menschen
                 überlassen. Bereits begründet abgelehnte Findings nicht erneut aufmachen.
              3. Abschluss (ALLERLETZTER Schritt, NIE davor — ERST NACHDEM alle Fixes committet UND
                 gepusht sind): Labels in ZWEI getrennten Befehlen umschalten (nie kombiniert, sonst
                 Doppel-Trigger), damit der Review erneut prüft (er liest den PR-Stand unmittelbar
                 nach dem zweiten Befehl):
                 `gh pr edit ${{ github.event.pull_request.number }} --remove-label ai:needs-changes`,
                 danach `gh pr edit ${{ github.event.pull_request.number }} --add-label ai:needs-review`.
                 Trägt der PR das Label `ai:continued` (von einem vorherigen Zwischenstopp), entferne
                 es hier zusätzlich (`gh pr edit ${{ github.event.pull_request.number }} --remove-label ai:continued`).
               4. Sicherheitsnetz gegen Endlosschleifen: Ein deterministischer Workflow-Step
                  ("Stop-Guard") zählt die PR-Commits und stoppt den Lauf hart, sobald > 10
                  erreicht sind (ai:needs-changes bleibt belassen, der PR-Autor wird automatisch
                  gepingt). Du musst diese Bremse NICHT selbst im Kopf führen — arbeite die
                  Findings sauber ab; der Step greift bei Bedarf.

            Weiches Zeitlimit (Soft-Abort): Dieser Lauf wird nach 20 Minuten HART abgebrochen (kein
            SIGTERM-Handling möglich). Prüfe daher VOR jedem größeren Teilschritt (nächster Fix,
            `pnpm lint`/`pnpm knip`-Lauf) mit
            `test "$(date +%s)" -ge ${{ steps.starttime.outputs.soft_deadline_epoch }}`, ob das
            weiche Limit (14 Min nach Start, 6 Min Puffer) erreicht ist. Ist das der Fall, STOPPE
            SOFORT den aktuellen Fix kontrolliert und fuehre NUR noch dies aus: committen und
            pushen, offene/verbleibende Findings als kurzen PR-Kommentar festhalten, dann
            `gh pr edit ${{ github.event.pull_request.number }} --add-label ai:continued` setzen
            (Label bei Bedarf vorher `gh label create "ai:continued" --color FBCA04` anlegen) UND
            `ai:needs-changes` entfernen+sofort wieder setzen (Selbst-Retrigger — NICHT auf
            `ai:needs-review` umschalten, die Findings sind noch nicht vollständig abgearbeitet).
            Danach den Turn beenden.

            Bearbeite ausschließlich diesen PR. Arbeite autonom, ohne interaktive Rückfrage.
          claude_args: >-
            --bare --model claude-sonnet-4-6 --effort medium
            ${{ steps.session-restore.outputs.resume-arg }}
            --allowedTools "Bash(gh pr:*),Bash(gh issue view:*),Bash(gh label:*),Bash(gh api:*),Bash(git switch:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(git fetch:*),Bash(git merge:*),Bash(git stash:*),Bash(git reset:*),Bash(pnpm:*),Read,Edit,Write,Grep,Glob,Task"
            --append-system-prompt "Automatisierter, label-gesteuerter Fixup-Lauf in GitHub Actions (headless) fuer PR #${{ github.event.pull_request.number }}. Setze nur eindeutige, zutreffende Findings um; mehrdeutige/grosse Punkte dem Menschen ueberlassen. Schalte die Labels ALS ALLERLETZTEN Schritt um (ai:needs-changes -> ai:needs-review), NIE davor — erst nach Commit+Push, da der Review den PR-Stand unmittelbar danach liest. AUSSER der Loop soll wegen Nicht-Konvergenz anhalten, dann ai:needs-changes belassen und den Menschen taggen. HARTES 20-Minuten-Timeout, weiches Limit bei 14 Min (Soft-Abort): pruefe vor jedem groesseren Teilschritt `date +%s` gegen ${{ steps.starttime.outputs.soft_deadline_epoch }}; ist das erreicht, sichere den Zwischenstand (committen/pushen, PR-Kommentar mit offenen Punkten), setze ai:continued UND entferne+setze ai:needs-changes neu (Selbst-Retrigger, der Folgelauf setzt per --resume fort) statt auf ai:needs-review umzuschalten, dann beende den Turn. Arbeite ohne interaktive Rueckfrage. Modell-Strategie: Du laeufst als Sonnet-Koordinator. Schaetze die Komplexitaet der Aufgabe ein und delegiere die eigentliche Abarbeitung per Agent-Tool an einen Subagenten in derselben Session: heavy (Opus) fuer komplexe/architektonische Aufgaben, light (Haiku) fuer triviale/mechanische Aufgaben; Standard- und Koordinationsarbeit erledigst du selbst auf Sonnet."

      # Vereinheitlichung der Agent-Ausgaben
      - name: Agent-Ausgaben vereinheitlichen
        id: agent-output
        if: always()
        env:
          # Step-Auswahl im Expression-Layer (NICHT via steps[bash-var]). outcome für Claude aus der
          # built-in Step-Conclusion (.outcome), nicht .outputs.outcome.
          IS_HERMES: ${{ (env.AI_BACKEND == 'hermes' || env.AI_BACKEND == 'openrouter') && 'true' || 'false' }}
          HERMES_EXEC: ${{ steps.hermes.outputs.execution_file }}
          HERMES_SESSION: ${{ steps.hermes.outputs.session_id }}
          HERMES_OUTCOME: ${{ steps.hermes.outputs.outcome }}
          CLAUDE_EXEC: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_SESSION: ${{ steps.claude.outputs.session_id }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          if [ "$IS_HERMES" = "true" ]; then
            echo "execution_file=$HERMES_EXEC" >> "$GITHUB_OUTPUT"
            echo "session_id=$HERMES_SESSION" >> "$GITHUB_OUTPUT"
            echo "outcome=$HERMES_OUTCOME" >> "$GITHUB_OUTPUT"
          else
            echo "execution_file=$CLAUDE_EXEC" >> "$GITHUB_OUTPUT"
            echo "session_id=$CLAUDE_SESSION" >> "$GITHUB_OUTPUT"
            echo "outcome=$CLAUDE_OUTCOME" >> "$GITHUB_OUTPUT"
          fi

      - name: Kosten-Zusammenfassung
        if: always()
        continue-on-error: true
        uses: ./.github/actions/cost-summary
        with:
          execution-file: ${{ steps.agent-output.outputs.execution_file }}
          label: Fixup

      # Named Session Resume (Phase "fix"): sichert die eben beendete/abgebrochene Session ins
      # Sitzungsarchiv, damit ein Selbst-Retrigger-Folgelauf per --resume anknuepfen kann.
      # if: always() -- auch ein in den harten Timeout gelaufener Lauf sichert seinen Teil-Fortschritt.
      - name: Session-Archiv sichern (Phase fix)
        if: always() && steps.preflight.outputs.configured == 'true' && steps.stop-guard.outputs.stop != 'true'
        continue-on-error: true
        uses: ./.github/actions/session-save
        with:
          issue: ${{ github.event.pull_request.number }}
          phase: fix
          id-type: pr
          session-id: ${{ steps.agent-output.outputs.session_id }}

      # Soft-Abort-Obergrenze (2026-07-08): das Label "ai:continued" wird NUR von Claude selbst
      # gesetzt (als expliziter Teil des Stopp-Checkliste-Schritts) -- so bleibt der Fall vom
      # bestehenden "Findings sind mehrdeutig, nichts umgesetzt" Pfad unterscheidbar, der ebenfalls
      # ai:needs-changes unveraendert laesst, aber KEIN ai:continued setzt. Begrenzt automatische
      # Selbst-Fortsetzungen auf genau EINE.
      - name: Soft-Abort-Fortsetzung erkennen und begrenzen (ai:continued)
        if: always() && steps.preflight.outputs.configured == 'true' && steps.agent-output.outputs.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          ALREADY_CONTINUED: ${{ steps.continued-before.outputs.already }}
        run: |
          has_continued="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels \
            --jq 'any(.labels[]; .name == "ai:continued")' 2>/dev/null || echo false)"

          if [ "${has_continued:-false}" != "true" ]; then
            # Kein Soft-Abort-Fall (normal beendet ODER Findings mehrdeutig ohne Aenderung) --
            # nichts zu tun.
            exit 0
          fi

          if [ "${ALREADY_CONTINUED:-false}" = "true" ]; then
            echo "::warning title=PR #${PR} Fortsetzungs-Obergrenze::Zweiter Zwischenstopp in Folge -- automatische Fortsetzung ausgeschoepft."
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "ai:continued" 2>/dev/null || true
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "🛑 **Fixup #${PR} — Fortsetzungs-Obergrenze erreicht**

          2 Versuche (Original + 1 automatische Fortsetzung) ausgeschöpft, ohne die Findings vollständig abzuarbeiten. \`ai:needs-changes\` bleibt bestehen — bitte manuell prüfen." 2>/dev/null || true
          else
            echo "::notice title=PR #${PR} Soft-Abort::Erster Zwischenstopp -- Folgelauf per Selbst-Retrigger (ai:needs-changes) unterwegs."
          fi

      # Deterministisches Abschluss-Signal (unabhaengig von der LLM-Ausgabe): laeuft auch bei
      # Abbruch/Timeout (if: always()) und macht im Log/Job-Summary klar sichtbar, DASS und mit
      # welchem Ergebnis der Lauf fertig ist. outcome=cancelled signalisiert das 20-Min-Timeout.
      - name: Ergebnis zusammenfassen
        if: always() && steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.agent-output.outputs.outcome }}
          SESSION_ID: ${{ steps.agent-output.outputs.session_id }}
        run: |
          labels="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Fixup erfolgreich::PR #${PR} — Findings umgesetzt"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Fixup abgebrochen::Lauf durch neueren Trigger verdrängt (kein Fehler)"
          elif [ "$OUTCOME" = "skipped" ]; then
            echo "::notice title=⏭️ Fixup übersprungen::Supersede — ein aktuellerer Fixup-Lauf desselben PRs übernimmt (kein Fehler)"
          else
            echo "::error title=❌ Fixup fehlgeschlagen::Claude-Lauf gescheitert"
          fi
          {
            echo "### Fixup #${PR} — fertig"
            echo ""
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\` (cancelled = 20-Min-Timeout; skipped = Supersede durch neueren Lauf)"
            echo "- Aktuelle Pipeline-Labels: ${labels:-keine}"
            if [ -n "$SESSION_ID" ]; then echo "- Session-ID: \`${SESSION_ID}\` (\`--resume\` zum Nachschauen)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Fixup #${PR} fertig::Claude-Schritt ${OUTCOME:-unbekannt}; Labels: ${labels:-keine}"

      # Deterministisches Timeout-Signal fuer PR-Workflows (Haerten S3): review/fixup vergeben
      # bewusst KEIN ai:to-big-issue (AGENTS.md) — sonst staute der PR unsichtbar, wenn er in das
      # 20-Min-Timeout laeuft. cancel-in-progress:false bedeutet: outcome=cancelled ist hier ein
      # ECHTES Timeout (kein Supersede wie bei cancel-in-progress:true), daher kein Zeit-Guard
      # noetig. Dieser Schritt postet bei Timeout einen sichtbaren PR-Kommentar als Alarm.
      - name: Bei Timeout PR-Kommentar (Alarm)
        if: always() && steps.preflight.outputs.configured == 'true' && steps.agent-output.outputs.outcome == 'cancelled'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⚠️ **Fixup #${PR} — 20-Min-Timeout erreicht**

          Der Fixup-Lauf wurde hart abgebrochen (wahrscheinlich zu großer PR oder nicht konvergierende Findings). Bitte PR-Größe reduzieren (aufteilen) oder manuell eingreifen." 2>/dev/null || true
