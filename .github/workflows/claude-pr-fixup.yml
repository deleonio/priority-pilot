name: Claude PR Fixup (Findings umsetzen)

# Reagiert auf das Label "ai:needs-changes" (vom Review-Workflow gesetzt) und setzt die
# zutreffenden Findings um (Fix + Antwort im Thread + Push). Zum Abschluss Label-Umschaltung
# zurueck auf "ai:needs-review" -> der Review prueft erneut. Steuerung rein ueber LABELS
# (kein Review-/Kommentar-/Push-Event) -> stabiles Ping-Pong:
#   review --(ai:needs-changes)--> fixup --(ai:needs-review)--> review --> ... bis ai:ready-to-merge
# Entspricht Schritt 5.3 aus .ai-knowledge/ticket-implementation.md.
#
# Nutzt ein kurzlebiges GitHub-App-Token, damit Push und Label-Umschaltung greifen.
# Voraussetzungen: CLAUDE_CODE_OAUTH_TOKEN sowie eine GitHub App (APP_ID + APP_PRIVATE_KEY).

on:
  pull_request:
    types: [labeled]

concurrency:
  # EIGENE Gruppe pro Workflow (Fixup getrennt von Review) — ausfuehrliche Begruendung in
  # claude-pr-review.yml. Kurz: eine gemeinsame Gruppe + Trigger beider Workflows auf jedes
  # `labeled`-Event liessen No-op-Geschwister-Runs den echten Fixup aus dem einzigen Pending-Slot
  # canceln (GitHub haelt pro Gruppe nur einen laufenden + einen wartenden Run). Getrennte Gruppen
  # serialisieren nur noch GLEICHE Fixup-Laeufe desselben PRs. cancel-in-progress: false -> einen
  # laufenden Fix nie mittendrin verwerfen (Push-Sicherheit).
  group: claude-pr-fixup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fixup:
    # Nur wenn GENAU das Label ai:needs-changes gesetzt wurde, an nicht-Draft-PRs aus demselben Repo.
    if: >-
      ${{ github.event.label.name == 'ai:needs-changes'
          && github.event.pull_request.draft == false
          && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Voraussetzung pruefen (GitHub-App-Secrets)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::GitHub-App-Secrets fehlen (APP_ID und/oder APP_PRIVATE_KEY) — Lauf wird uebersprungen (kein Fehler). GitHub App anlegen (Contents/Issues/Pull requests = Read and write), aufs Repo installieren und beide Werte als Repo-Secrets hinterlegen, damit die Pipeline laeuft."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout (PR-Head-Branch)
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }} # Fix-Push als App-Token

      # Deterministischer Agent-Secret-Check (Haerten S2): das Opt-in fuer GLM/Mistral (und die
      # OAuth-Token-Voraussetzung fuer Claude) darf NICHT still skippen — fehlt das zum aktiven
      # AI_AGENT-Pfad gehoerige Secret, bricht der Lauf hier deterministisch ab (::error::, kein
      # stiller Skip). Der Fixup-Check wird rot -> Gate setzt ai:needs-changes -> sichtbar. Zusaetzlich
      # ein PR-Kommentar (statt Issue-Label wie bei triage/spec/implement — PR-Workflows vergeben
      # bewusst kein ai:to-big-issue, s. S3/Timeout-Alarm), damit der Ausfall nicht nur im Checks-Tab
      # sichtbar ist, sondern den PR-Autor aktiv erreicht.
      - name: Agent-Secret prüfen (kein stiller Skip)
        if: steps.preflight.outputs.configured == 'true'
        env:
          AI_AGENT: ${{ vars.AI_AGENT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          missing=""
          # Haerten C2-Nachtrag: GitHub-Actions-`==` (die if:-Bedingungen der Agent-Schritte)
          # vergleicht Strings case-insensitiv, Bashs `case` NICHT. Ohne `,,`-Lowering wuerde
          # z. B. AI_AGENT=GLM zum GLM-Schritt routen, aber hier in den `*)`-Default-Zweig fallen
          # (CLAUDE_CODE_OAUTH_TOKEN statt ZAI_API_KEY geprueft) — der S2-Stille-Skip waere ueber
          # Gross-/Kleinschreibung wieder offen.
          case "${AI_AGENT,,}" in
            glm)     [ -z "$ZAI_API_KEY" ] && missing="ZAI_API_KEY" ;;
            mistral) [ -z "$MISTRAL_API_KEY" ] && missing="MISTRAL_API_KEY" ;;
            *)       [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && missing="CLAUDE_CODE_OAUTH_TOKEN" ;;
          esac
          if [ -n "$missing" ]; then
            echo "::error title=Agent-Secret fehlt::AI_AGENT='${AI_AGENT:-claude}' benoetigt Secret '$missing' — fehlt es, darf der Lauf nicht still skippen (AGENTS.md: bewusstes Opt-in). Secret als Repo-Secret hinterlegen."
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "🛑 **Fixup #${PR} — Agent-Secret fehlt**

          AI_AGENT='${AI_AGENT:-claude}' benötigt Secret \`$missing\`, das nicht gesetzt ist. Der Lauf wurde abgebrochen (kein stiller Skip). Bitte Secret hinterlegen oder \`AI_AGENT\` zurücksetzen." 2>/dev/null || true
            exit 1
          fi
          echo "Agent-Secret fuer AI_AGENT='${AI_AGENT:-claude}' vorhanden."

      - name: pnpm einrichten
        if: steps.preflight.outputs.configured == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Node.js einrichten
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc # zentrale Node-Version (gleicher Stand wie ci/implement/deploy)
          cache: pnpm

      - name: Abhaengigkeiten installieren
        if: steps.preflight.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Git-Hooks installieren (lefthook)
        if: steps.preflight.outputs.configured == 'true'
        run: pnpm exec lefthook install

      # Merge-Konflikte erkennen und automatisch auflösen (Merge-Strategie: git merge --no-ff).
      # Dies muss VOR dem LLM-Schritt passieren, damit die KI auf einem sauberen Stand arbeitet.
      # Härtung H2: GitHub berechnet `mergeable` ASYNCHRON — direkt nach einem Push ist es oft
      # UNKNOWN/null. Früher fiel UNKNOWN in den Default-Zweig (conflict=false), sodass der LLM auf
      # einem nicht merge-fähigen Stand lief, ohne dass die Konflikt-Behandlung griff. Jetzt: UNKNOWN
      # wird explizit (mit kurzem Retry) behandelt; Bedingungen sind explizit geklammert (Shell-
      # Präzedenz `&&` bindet stärker als `||`); [skip ci] im Merge-Commit ENTFERNT, damit CI den
      # gemergten Stand validiert (sonst schlüge ein semantisch kaputter Auto-Merge erst beim
      # finalen Fix-Push auf).
      - name: Merge-Konflikte prüfen und auflösen
        id: resolve-conflicts
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # 1. Mergeable-Status von GitHub API (EIN Call, beide Felder).
          fetch_state() { gh pr view "$PR" --repo "$REPO" --json mergeable,mergeStateStatus; }
          # Fallback bei transienter gh-API-Störung: set -euo pipefail wuerde den Step sonst toeten,
          # bevor der LLM laeuft. conflict=unknown -> LLM prueft Konflikte selbst via git status/diff.
          if ! state_json="$(fetch_state 2>/dev/null)"; then
            echo "conflict=unknown" >> "$GITHUB_OUTPUT"
            echo "::warning::gh-API (mergeable) nicht erreichbar — LLM prüft Konflikte selbst via git status/diff."
            exit 0
          fi
          mergeable="$(echo "$state_json" | jq -r '.mergeable')"
          merge_state="$(echo "$state_json" | jq -r '.mergeStateStatus')"
          echo "PR #$PR - mergeable: $mergeable, mergeStateStatus: $merge_state"

          # 2. UNKNOWN/null-Race behandeln: GitHub berechnet mergeable ASYNCHRON direkt nach Push.
          #    Bis zu 2x kurz warten (5s), dann aufgeben (LLM prüft via git status selbst).
          is_unknown() { [ "$mergeable" = "UNKNOWN" ] || [ "$mergeable" = "null" ] || [ -z "$mergeable" ]; }
          if is_unknown; then
            echo "mergeable ist UNKNOWN/null (async Race) — warte 5s und prüfe erneut..."
            sleep 5
            state_json="$(fetch_state)"
            mergeable="$(echo "$state_json" | jq -r '.mergeable')"
            merge_state="$(echo "$state_json" | jq -r '.mergeStateStatus')"
            echo "Nach Retry - mergeable: $mergeable, mergeStateStatus: $merge_state"
          fi

          # 3. Sauber mergebar -> nichts zu tun.
          if [ "$mergeable" = "MERGEABLE" ]; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "PR ist sauber mergebar — keine Konflikt-Auflösung nötig."
            exit 0
          fi

          # 4. Noch immer UNKNOWN -> Konflikt-Status unklar. KEIN falsches Auto-Merge, KEIN falsches
          #    conflict=false. LLM prüft Konflikte selbst via git status/diff (Prompt deckt das ab).
          if is_unknown; then
            echo "conflict=unknown" >> "$GITHUB_OUTPUT"
            echo "::warning::mergeable bleibt UNKNOWN nach Retry — LLM prüft Konflikte selbst via git status/diff."
            exit 0
          fi

          # 5. Konflikt (DIRTY ODER CONFLICTING) -> Auflösung versuchen. Explizit geklammert
          #    (früher: Präzedenzfehler durch `&& ... || grep`).
          if [ "$merge_state" = "DIRTY" ] || [ "$mergeable" = "CONFLICTING" ]; then
            echo "Merge-Konflikt erkannt bei PR #$PR — versuche automatisch aufzulösen..."

            git fetch origin "$TARGET_BRANCH" --depth=1 --no-tags

            # 6. Lokale Changes sichern (falls vorhanden von vorherigen Fixup-Läufen).
            STASHED="false"
            if ! git diff --quiet; then
              echo "Lokale uncommitted Changes gefunden — stashen..."
              git stash push --include-untracked --message "fixup-stash-before-merge"
              STASHED="true"
            fi

            # 7. Merge versuchen (--no-ff, KEIN [skip ci] — CI soll den gemergten Stand validieren).
            CONFLICT_RESOLVED="false"
            if git merge origin/"$TARGET_BRANCH" --no-ff --no-edit -m "Auto-merge: resolve conflicts for PR #$PR"; then
              echo "✅ Merge erfolgreich — Konflikt automatisch gelöst"
              CONFLICT_RESOLVED="true"
            else
              echo "⚠️ Merge mit Konflikten — prüfe auf echte Konflikt-Marker..."
              if git diff --name-only --diff-filter=U | grep -q .; then
                echo "❌ Echte Merge-Konflikte in Dateien — Konflikt-Marker bleiben, KI löst sie im nächsten Schritt."
                CONFLICT_RESOLVED="false"
              else
                echo "❌ Merge fehlgeschlagen, aber keine Konflikt-Marker (z.B. CRLF/permissions) — abort."
                git merge --abort
                CONFLICT_RESOLVED="aborted"
              fi
            fi

            # 8. Nur bei sauber aufgelöstem Merge pushen.
            if [ "$CONFLICT_RESOLVED" = "true" ]; then
              git push origin HEAD:"$HEAD_BRANCH"
              echo "✅ Merge-Commit gepusht (ohne [skip ci] — CI validiert den Stand)"
              echo "conflict=resolved" >> "$GITHUB_OUTPUT"
            elif [ "$CONFLICT_RESOLVED" = "false" ]; then
              echo "conflict=needs_resolution" >> "$GITHUB_OUTPUT"
              echo "::warning::Echte Merge-Konflikte — KI löst sie im nächsten Schritt."
            else
              echo "conflict=aborted" >> "$GITHUB_OUTPUT"
              echo "::error::Merge aborted — nicht lösbar, Mensch muss manuell eingreifen."
            fi

            # 9. Gestashte Changes wiederherstellen.
            if [ "$STASHED" = "true" ]; then
              echo "Stash wiederherstellen..."
              git stash pop || echo "::warning::Stash pop fehlgeschlagen"
            fi
          else
            # 10. Nicht wegen Konflikt nicht mergebar (z.B. BLOCKED/UNSTABLE/BEHIND wegen Checks).
            echo "PR nicht mergebar, aber nicht wegen Merge-Konflikt (mergeable=$mergeable, state=$merge_state)"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          fi

      # Deterministischer Stop-Guard (Haerten C1/S1): der review<->fixup-Loop ist durch das 20-Min-
      # Timeout gedeckelt, aber die Spec (pipeline-flow.md) verspricht einen Stop-Guard. Frueher
      # existierte der NUR als Prompt-Anweisung (LLM soll selbst zaehlen). Dieser Step zaehlt
      # deterministisch die PR-eigenen Commits (Spec- + Implementierungs- + Fixup-Commits — eine
      # saubere Trennung NUR nach Fixup-Commits brauchte eine unzuverlaessige ready_for_review-
      # Timeline; daher Heuristik: alle PR-Commits, Schwelle > 10) und stoppt den Lauf hart:
      # ai:needs-changes BELASSEN (kein --add-label ai:needs-review), PR-Autor pingen, Agent-Schritt
      # überspringen. Hinweis: ein 0-Commit-Loop (Fixup ohne Findings) wird hiervon NICHT gebremst —
      # in dem Fall alarmiert die H1-Post-Assertion im Review per PR-Kommentar.
      - name: Stop-Guard (> 10 PR-Commits)
        id: stop-guard
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Anzahl Commits auf dem PR-Branch (Spec+Impl+Fixup — semantisch nicht trennbar ohne
          # unzuverlaessige ready_for_review-Timeline, daher Heuristik alle PR-Commits, Schwelle > 10).
          # Fallback bei transienter gh-API-Stoerung (Haerten C1-Nachtrag): NICHT stillschweigend als
          # "0 Commits" werten — das wuerde den Guard bei einem echten, anhaltenden API-Ausfall
          # dauerhaft wirkungslos machen (exakt das Gegenteil der Absicht). Stattdessen fail-closed:
          # der Agent-Lauf wird uebersprungen (stop=true), bis die Zaehlung wieder moeglich ist.
          if ! commits="$(gh pr view "$PR" --repo "$REPO" --json commits --jq '.commits | length' 2>/dev/null)"; then
            echo "stop=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Stop-Guard::gh-API (commits) nicht erreichbar — PR-Commits koennen nicht gezaehlt werden. Fail-closed: Fixup-Agent wird diesen Lauf uebersprungen (ai:needs-changes bleibt), statt den Guard wirkungslos zu machen."
            gh pr comment "$PR" --repo "$REPO" --body "🛑 **Stop-Guard: gh-API nicht erreichbar**

          PR #$PR — der Stop-Guard konnte die PR-Commits nicht zaehlen (gh-API-Stoerung). Fail-closed: der Fixup-Agent wird diesen Lauf uebersprungen, damit der Guard bei einem echten API-Ausfall nicht wirkungslos wird. Bitte erneut anstossen (z. B. per Push) oder manuell pruefen." 2>/dev/null || true
            exit 0
          fi
          if [ "${commits:-0}" -gt 10 ]; then
            author="$(gh pr view "$PR" --repo "$REPO" --json author --jq '.author.login' 2>/dev/null || echo '')"
            mention="@${author:-$OWNER}"
            echo "stop=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Stop-Guard::PR #$PR hat ${commits} PR-Commits (> 10) — Fixup-Loop wird gestoppt, ai:needs-changes belassen."
            gh pr comment "$PR" --repo "$REPO" --body "🛑 **Stop-Guard: Fixup-Loop gestoppt**

          PR #$PR hat **${commits} PR-Commits** (Richtwert > 10). Die Kreuzverhör-Findings konvergieren offenbar nicht automatisch.
          ${mention}: Bitte manuell prüfen und entscheiden (Labels selbst setzen oder PR schließen). Der Loop wird nicht weitergedreht." 2>/dev/null || true
            exit 0
          fi
          echo "stop=false" >> "$GITHUB_OUTPUT"
          echo "PR #$PR hat ${commits} PR-Commits (≤ 10) — Fixup darf laufen."

      # Standard-Pfad (Claude): laeuft, solange die Repo-Variable AI_AGENT NICHT auf "mistral"
      # oder "glm" steht (auch ungesetzt -> Claude bleibt Default). Umschalten:
      # `gh variable set AI_AGENT --body glm` (Z.ai GLM) oder
      # `gh variable set AI_AGENT --body mistral` (Mistral Vibe);
      # zurueck: `gh variable set AI_AGENT --body claude`.
      - name: Findings umsetzen via Claude Code
        id: claude
        if: steps.preflight.outputs.configured == 'true' && steps.stop-guard.outputs.stop != 'true' && vars.AI_AGENT != 'mistral' && vars.AI_AGENT != 'glm'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1.0.165
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # Erlaubte Bot-Ausloeser — der Review setzt das Label als Bot (claude[bot]), sonst blockt
          # checkHumanActor diesen Fixup-Lauf. Absicherung zusaetzlich ueber den Job-`if:`.
          allowed_bots: 'claude[bot],my-github-action-bot'
          prompt: |
            Auf Pull Request #${{ github.event.pull_request.number }} hat der Review das Label
            `ai:needs-changes` gesetzt. Arbeite die offenen Kreuzverhör-Findings ab — Schritt 5.3
            aus .ai-knowledge/ticket-implementation.md. Die Pipeline koordiniert ausschließlich
            über LABELS — schalte sie zum Abschluss exakt wie unten beschrieben um.

            HINWEIS ZU MERGE-KONFLIKTEN: Ein vorheriger Schritt hat bereits versucht, Merge-Konflikte
            automatisch aufzulösen. Prüfe mit `git status` und `git diff --name-only --diff-filter=U`
            ob ungelöste Konflikte vorliegen (Dateien mit Konflikt-Markern <<<<<<</========/>>>>>>>).

            Vorgehen:
              0. KONFLIKTAUFLÖSUNG (falls nötig):
                 Falls `git diff --name-only --diff-filter=U` Dateien mit Merge-Konflikten anzeigt:
                 - Analysiere JEDE Konfliktdatei mit `read`
                 - Identifiziere die konkreten Konflikte (zwischen <<<<<<< HEAD und >>>>>>> target_branch)
                 - Löse sie EINDEUTIG auf: Behalte die richtige Version (HEAD für PR-Änderungen,
                   target_branch nur wenn der Konflikt dort bereits behoben wurde)
                 - Bei komplexen inhaltlichen Konflikten (beide Seiten haben relevante Änderungen):
                   Versuche die Änderungen intelligent zu mergen. Falls nicht eindeutig lösbar,
                   kommentiere im PR die Konfliktstelle mit Vorschlag und belasse die Marker.
                 - Nach der Auflösung: `git add <datei>` für alle gelösten Dateien
                  - Commit: `git commit -m "Fix merge conflict in <datei>"`
                 - Push: `git push origin ${{ github.event.pull_request.head.ref }}`
                 - Erst DANN mit den Findings weitermachen.
              1. Findings lesen: `gh pr view`, `gh pr diff`, die Review-Threads
                 (`gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`)
                 und CI (`gh pr checks`).
              2. Zutreffende, EINDEUTIGE Findings fixen: Code ändern, dann vor jedem Commit
                 das lokale CI-Gate grün ziehen:
                 `pnpm format && pnpm exec prettier --check . && pnpm lint && pnpm knip`
                 (repo-weit — CI lintet rekursiv, nicht nur ein Package).
                 Erst wenn alle Checks grün, committen und auf den PR-Branch
                 `${{ github.event.pull_request.head.ref }}` pushen.
                 Bricht CI allein an Format-Check oder Lint, ist das selbst ein Finding.
                 Im jeweiligen Thread antworten und ihn auflösen. Mehrdeutige oder architektonisch
                 große Punkte NICHT blind umsetzen — begründet kommentieren bzw. dem Menschen
                 überlassen. Bereits begründet abgelehnte Findings nicht erneut aufmachen.
              3. Abschluss (ALLERLETZTER Schritt, NIE davor — ERST NACHDEM alle Fixes committet UND
                 gepusht sind): Labels in ZWEI getrennten Befehlen umschalten (nie kombiniert, sonst
                 Doppel-Trigger), damit der Review erneut prüft (er liest den PR-Stand unmittelbar
                 nach dem zweiten Befehl):
                 `gh pr edit ${{ github.event.pull_request.number }} --remove-label ai:needs-changes`,
                 danach `gh pr edit ${{ github.event.pull_request.number }} --add-label ai:needs-review`
               4. Sicherheitsnetz gegen Endlosschleifen: Ein deterministischer Workflow-Step
                  ("Stop-Guard") zählt die PR-Commits und stoppt den Lauf hart, sobald > 10
                  erreicht sind (ai:needs-changes bleibt belassen, der PR-Autor wird automatisch
                  gepingt). Du musst diese Bremse NICHT selbst im Kopf führen — arbeite die
                  Findings sauber ab; der Step greift bei Bedarf.

            Bearbeite ausschließlich diesen PR. Arbeite autonom, ohne interaktive Rückfrage.
          claude_args: >-
            --model claude-sonnet-4-6 --effort medium
            --allowedTools "Bash(gh pr:*),Bash(gh issue view:*),Bash(gh label:*),Bash(gh api:*),Bash(git switch:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(git fetch:*),Bash(git merge:*),Bash(git stash:*),Bash(git reset:*),Bash(pnpm:*),Read,Edit,Write,Grep,Glob,Task"
            --append-system-prompt "Automatisierter, label-gesteuerter Fixup-Lauf in GitHub Actions (headless) fuer PR #${{ github.event.pull_request.number }}. Setze nur eindeutige, zutreffende Findings um; mehrdeutige/grosse Punkte dem Menschen ueberlassen. Schalte die Labels ALS ALLERLETZTEN Schritt um (ai:needs-changes -> ai:needs-review), NIE davor — erst nach Commit+Push, da der Review den PR-Stand unmittelbar danach liest. AUSSER der Loop soll wegen Nicht-Konvergenz anhalten, dann ai:needs-changes belassen und den Menschen taggen. Arbeite ohne interaktive Rueckfrage. Modell-Strategie: Du laeufst als Sonnet-Koordinator. Schaetze die Komplexitaet der Aufgabe ein und delegiere die eigentliche Abarbeitung per Agent-Tool an einen Subagenten in derselben Session: heavy (Opus) fuer komplexe/architektonische Aufgaben, light (Haiku) fuer triviale/mechanische Aufgaben; Standard- und Koordinationsarbeit erledigst du selbst auf Sonnet."

      # Mistral-Pfad (AI_AGENT == 'mistral'): Vibe laeuft headless OHNE Approval-Callback — ohne
      # erzwungenes Auto-Approve wuerde jedes genehmigungspflichtige Tool (gh/git/pnpm/Datei-Writes)
      # als "Tool execution not permitted" uebersprungen. default_agent=auto-approve setzt
      # bypass_tool_permissions=true; ~/.vibe/config.toml ist der Default-Konfig-Ort (VIBE_HOME).
      - name: Vibe-Konfig (Headless Auto-Approve)
        if: steps.preflight.outputs.configured == 'true' && vars.AI_AGENT == 'mistral'
        run: |
          mkdir -p "$HOME/.vibe"
          cat > "$HOME/.vibe/config.toml" <<'EOF'
          default_agent = "auto-approve"
          bypass_tool_permissions = true
          EOF

      # Spiegelt den Claude-Schritt: gleicher Fixup-Ablauf, anderer Agent. GH_TOKEN = App-Token,
      # damit Push und Label-Umschaltung die Folge-Workflows ausloesen; der Push laeuft ueber den im
      # Checkout gesetzten App-Token-Remote. Die Vibe-Action reicht KEINE Extra-Flags durch —
      # System-Prompt-Regeln als fuehrender [KONTEXT]-Block; keine Tool-Restriktion erzwingbar.
      - name: Findings umsetzen via Mistral Vibe
        id: mistral
        if: steps.preflight.outputs.configured == 'true' && steps.stop-guard.outputs.stop != 'true' && vars.AI_AGENT == 'mistral'
        uses: mistralai/mistral-vibe@474a0e4055b210a60c39ed0c89458d904b7f6a7b # v2.19.0
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }} # gh/Push als App-Token -> Label-Wechsel loest Review aus
        with:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          args: --trust
          prompt: |
            [KONTEXT/REGELN] Automatisierter, label-gesteuerter Fixup-Lauf in GitHub Actions
            (headless) fuer PR #${{ github.event.pull_request.number }}. Setze nur eindeutige,
            zutreffende Findings um; mehrdeutige/grosse Punkte dem Menschen ueberlassen. Schalte zum
            Abschluss die Labels um (ai:needs-changes -> ai:needs-review) — AUSSER der Loop soll
            wegen Nicht-Konvergenz anhalten, dann ai:needs-changes belassen und den Menschen taggen.
            Arbeite ohne interaktive Rueckfrage. Nutze fuer GitHub-Operationen die `gh`-CLI (Token
            ist gesetzt).

            HINWEIS ZU MERGE-KONFLIKTEN: Ein vorheriger Schritt hat bereits versucht, Merge-Konflikte
            automatisch aufzulösen. Prüfe mit `git status` und `git diff --name-only --diff-filter=U`
            ob ungelöste Konflikte vorliegen (Dateien mit Konflikt-Markern <<<<<<</========/>>>>>>>).

            Auf Pull Request #${{ github.event.pull_request.number }} hat der Review das Label
            `ai:needs-changes` gesetzt. Arbeite die offenen Kreuzverhör-Findings ab — Schritt 5.3
            aus .ai-knowledge/ticket-implementation.md. Die Pipeline koordiniert ausschließlich
            über LABELS — schalte sie zum Abschluss exakt wie unten beschrieben um.

            Vorgehen:
              0. KONFLIKTAUFLÖSUNG (falls nötig):
                 Falls `git diff --name-only --diff-filter=U` Dateien mit Merge-Konflikten anzeigt:
                 - Analysiere JEDE Konfliktdatei mit `read`
                 - Identifiziere die konkreten Konflikte (zwischen <<<<<<< HEAD und >>>>>>> target_branch)
                 - Löse sie EINDEUTIG auf: Behalte die richtige Version (HEAD für PR-Änderungen,
                   target_branch nur wenn der Konflikt dort bereits behoben wurde)
                 - Bei komplexen inhaltlichen Konflikten (beide Seiten haben relevante Änderungen):
                   Versuche die Änderungen intelligent zu mergen. Falls nicht eindeutig lösbar,
                   kommentiere im PR die Konfliktstelle mit Vorschlag und belasse die Marker.
                 - Nach der Auflösung: `git add <datei>` für alle gelösten Dateien
                  - Commit: `git commit -m "Fix merge conflict in <datei>"`
                 - Push: `git push origin ${{ github.event.pull_request.head.ref }}`
                 - Erst DANN mit den Findings weitermachen.
              1. Findings lesen: `gh pr view`, `gh pr diff`, die Review-Threads
                 (`gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`)
                 und CI (`gh pr checks`).
              2. Zutreffende, EINDEUTIGE Findings fixen: Code ändern, dann vor jedem Commit
                 das lokale CI-Gate grün ziehen:
                 `pnpm format && pnpm exec prettier --check . && pnpm lint && pnpm knip`
                 (repo-weit — CI lintet rekursiv, nicht nur ein Package).
                 Erst wenn alle Checks grün, committen und auf den PR-Branch
                 `${{ github.event.pull_request.head.ref }}` pushen.
                 Bricht CI allein an Format-Check oder Lint, ist das selbst ein Finding.
                 Im jeweiligen Thread antworten und ihn auflösen. Mehrdeutige oder architektonisch
                 große Punkte NICHT blind umsetzen — begründet kommentieren bzw. dem Menschen
                 überlassen. Bereits begründet abgelehnte Findings nicht erneut aufmachen.
              3. Abschluss (ALLERLETZTER Schritt, NIE davor — ERST NACHDEM alle Fixes committet UND
                 gepusht sind): Labels in ZWEI getrennten Befehlen umschalten (nie kombiniert, sonst
                 Doppel-Trigger), damit der Review erneut prüft (er liest den PR-Stand unmittelbar
                 nach dem zweiten Befehl):
                 `gh pr edit ${{ github.event.pull_request.number }} --remove-label ai:needs-changes`,
                 danach `gh pr edit ${{ github.event.pull_request.number }} --add-label ai:needs-review`
               4. Sicherheitsnetz gegen Endlosschleifen: Ein deterministischer Workflow-Step
                  ("Stop-Guard") zählt die PR-Commits und stoppt den Lauf hart, sobald > 10
                  erreicht sind (ai:needs-changes bleibt belassen, der PR-Autor wird automatisch
                  gepingt). Du musst diese Bremse NICHT selbst im Kopf führen — arbeite die
                  Findings sauber ab; der Step greift bei Bedarf.

            Bearbeite ausschließlich diesen PR. Arbeite autonom, ohne interaktive Rückfrage.

      # GLM-Pfad (AI_AGENT == 'glm'): verwendet die claude-code-action mit dem Z.ai-Anthropic-
      # kompatiblen Endpoint statt Anthropic. Authentifizierung ueber ZAI_API_KEY
      # (anthropic_api_key); Z.ai mappt Claude-Modellnamen automatisch auf GLM-Modelle.
      - name: Findings umsetzen via GLM (Z.ai)
        id: glm
        if: steps.preflight.outputs.configured == 'true' && steps.stop-guard.outputs.stop != 'true' && vars.AI_AGENT == 'glm'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1.0.165
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
          API_TIMEOUT_MS: '3000000'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        with:
          anthropic_api_key: ${{ secrets.ZAI_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          allowed_bots: 'claude[bot],my-github-action-bot'
          prompt: |
            Auf Pull Request #${{ github.event.pull_request.number }} hat der Review das Label
            `ai:needs-changes` gesetzt. Arbeite die offenen Kreuzverhör-Findings ab — Schritt 5.3
            aus .ai-knowledge/ticket-implementation.md. Die Pipeline koordiniert ausschließlich
            über LABELS — schalte sie zum Abschluss exakt wie unten beschrieben um.

            HINWEIS ZU MERGE-KONFLIKTEN: Ein vorheriger Schritt hat bereits versucht, Merge-Konflikte
            automatisch aufzulösen. Prüfe mit `git status` und `git diff --name-only --diff-filter=U`
            ob ungelöste Konflikte vorliegen (Dateien mit Konflikt-Markern <<<<<<</========/>>>>>>>).

            Vorgehen:
              0. KONFLIKTAUFLÖSUNG (falls nötig):
                 Falls `git diff --name-only --diff-filter=U` Dateien mit Merge-Konflikten anzeigt:
                 - Analysiere JEDE Konfliktdatei mit `read`
                 - Identifiziere die konkreten Konflikte (zwischen <<<<<<< HEAD und >>>>>>> target_branch)
                 - Löse sie EINDEUTIG auf: Behalte die richtige Version (HEAD für PR-Änderungen,
                   target_branch nur wenn der Konflikt dort bereits behoben wurde)
                 - Bei komplexen inhaltlichen Konflikten (beide Seiten haben relevante Änderungen):
                   Versuche die Änderungen intelligent zu mergen. Falls nicht eindeutig lösbar,
                   kommentiere im PR die Konfliktstelle mit Vorschlag und belasse die Marker.
                 - Nach der Auflösung: `git add <datei>` für alle gelösten Dateien
                  - Commit: `git commit -m "Fix merge conflict in <datei>"`
                 - Push: `git push origin ${{ github.event.pull_request.head.ref }}`
                 - Erst DANN mit den Findings weitermachen.
              1. Findings lesen: `gh pr view`, `gh pr diff`, die Review-Threads
                 (`gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`)
                 und CI (`gh pr checks`).
              2. Zutreffende, EINDEUTIGE Findings fixen: Code ändern, dann vor jedem Commit
                 das lokale CI-Gate grün ziehen:
                 `pnpm format && pnpm exec prettier --check . && pnpm lint && pnpm knip`
                 (repo-weit — CI lintet rekursiv, nicht nur ein Package).
                 Erst wenn alle Checks grün, committen und auf den PR-Branch
                 `${{ github.event.pull_request.head.ref }}` pushen.
                 Bricht CI allein an Format-Check oder Lint, ist das selbst ein Finding.
                 Im jeweiligen Thread antworten und ihn auflösen. Mehrdeutige oder architektonisch
                 große Punkte NICHT blind umsetzen — begründet kommentieren bzw. dem Menschen
                 überlassen. Bereits begründet abgelehnte Findings nicht erneut aufmachen.
              3. Abschluss (ALLERLETZTER Schritt, NIE davor — ERST NACHDEM alle Fixes committet UND
                 gepusht sind): Labels in ZWEI getrennten Befehlen umschalten (nie kombiniert, sonst
                 Doppel-Trigger), damit der Review erneut prüft (er liest den PR-Stand unmittelbar
                 nach dem zweiten Befehl):
                 `gh pr edit ${{ github.event.pull_request.number }} --remove-label ai:needs-changes`,
                 danach `gh pr edit ${{ github.event.pull_request.number }} --add-label ai:needs-review`
               4. Sicherheitsnetz gegen Endlosschleifen: Ein deterministischer Workflow-Step
                  ("Stop-Guard") zählt die PR-Commits und stoppt den Lauf hart, sobald > 10
                  erreicht sind (ai:needs-changes bleibt belassen, der PR-Autor wird automatisch
                  gepingt). Du musst diese Bremse NICHT selbst im Kopf führen — arbeite die
                  Findings sauber ab; der Step greift bei Bedarf.

            Bearbeite ausschließlich diesen PR. Arbeite autonom, ohne interaktive Rückfrage.
          claude_args: >-
            --model claude-sonnet-4-6 --effort medium
            --allowedTools "Bash(gh pr:*),Bash(gh issue view:*),Bash(gh label:*),Bash(gh api:*),Bash(git switch:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(git fetch:*),Bash(git merge:*),Bash(git stash:*),Bash(git reset:*),Bash(pnpm:*),Read,Edit,Write,Grep,Glob,Task"
            --append-system-prompt "Automatisierter, label-gesteuerter Fixup-Lauf in GitHub Actions (headless) fuer PR #${{ github.event.pull_request.number }}. Setze nur eindeutige, zutreffende Findings um; mehrdeutige/grosse Punkte dem Menschen ueberlassen. Schalte die Labels ALS ALLERLETZTEN Schritt um (ai:needs-changes -> ai:needs-review), NIE davor — erst nach Commit+Push, da der Review den PR-Stand unmittelbar danach liest. AUSSER der Loop soll wegen Nicht-Konvergenz anhalten, dann ai:needs-changes belassen und den Menschen taggen. Arbeite ohne interaktive Rueckfrage. Modell-Strategie: Du laeufst als Sonnet-Koordinator. Schaetze die Komplexitaet der Aufgabe ein und delegiere die eigentliche Abarbeitung per Agent-Tool an einen Subagenten in derselben Session: heavy (Opus) fuer komplexe/architektonische Aufgaben, light (Haiku) fuer triviale/mechanische Aufgaben; Standard- und Koordinationsarbeit erledigst du selbst auf Sonnet."

      # Deterministisches Abschluss-Signal (unabhaengig von der LLM-Ausgabe): laeuft auch bei
      # Abbruch/Timeout (if: always()) und macht im Log/Job-Summary klar sichtbar, DASS und mit
      # welchem Ergebnis der Lauf fertig ist. outcome=cancelled signalisiert das 20-Min-Timeout.
      - name: Ergebnis zusammenfassen
        if: always() && steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          AGENT: ${{ vars.AI_AGENT == 'mistral' && 'Mistral' || (vars.AI_AGENT == 'glm' && 'GLM (Z.ai)' || 'Claude') }}
          # Outcome des tatsaechlich gelaufenen Agent-Schritts (die anderen sind 'skipped').
          OUTCOME: ${{ steps.claude.outcome != 'skipped' && steps.claude.outcome || (steps.glm.outcome != 'skipped' && steps.glm.outcome || steps.mistral.outcome) }}
          SESSION_ID: ${{ steps.claude.outputs.session_id || steps.glm.outputs.session_id }}
        run: |
          labels="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          {
            echo "### Fixup #${PR} — fertig"
            echo ""
            echo "- ${AGENT}-Schritt: \`${OUTCOME:-unbekannt}\` (cancelled = 20-Min-Timeout erreicht)"
            echo "- Aktuelle Pipeline-Labels: ${labels:-keine}"
            if [ -n "$SESSION_ID" ]; then echo "- Session-ID: \`${SESSION_ID}\` (\`--resume\` zum Nachschauen)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Fixup #${PR} fertig::${AGENT}-Schritt ${OUTCOME:-unbekannt}; Labels: ${labels:-keine}"

      # Deterministisches Timeout-Signal fuer PR-Workflows (Haerten S3): review/fixup vergeben
      # bewusst KEIN ai:to-big-issue (AGENTS.md) — sonst staute der PR unsichtbar, wenn er in das
      # 20-Min-Timeout laeuft. cancel-in-progress:false bedeutet: outcome=cancelled ist hier ein
      # ECHTES Timeout (kein Supersede wie bei cancel-in-progress:true), daher kein Zeit-Guard
      # noetig. Dieser Schritt postet bei Timeout einen sichtbaren PR-Kommentar als Alarm.
      - name: Bei Timeout PR-Kommentar (Alarm)
        if: always() && steps.preflight.outputs.configured == 'true' && (steps.claude.outcome == 'cancelled' || steps.glm.outcome == 'cancelled' || steps.mistral.outcome == 'cancelled')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⚠️ **Fixup #${PR} — 20-Min-Timeout erreicht**

          Der Fixup-Lauf wurde hart abgebrochen (wahrscheinlich zu großer PR oder nicht konvergierende Findings). Bitte PR-Größe reduzieren (aufteilen) oder manuell eingreifen." 2>/dev/null || true
