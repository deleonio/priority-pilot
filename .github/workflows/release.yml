name: Release

# Tag-getriebener Release: vX.Y.Z -> Build (Tarball) -> GitHub Release -> SSH-Deploy.
# Baut auf scripts/pack-release.sh (R1/#102) auf; Referenz: docs/deployment.md & docs/deployment-repo-plan.md (R2).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # gh release create

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.3.1 # MUSS zur Node-Major-Version des Hosts passen (native sqlite3)
          cache: pnpm

      # Baut Frontend + Backend und schnuert priority-pilot-<tag>.tar.gz im Repo-Root.
      - name: Pack release
        run: bash scripts/pack-release.sh "${GITHUB_REF_NAME}"

      # Idempotent: existiert zum Tag bereits eine Release (z. B. Re-Run nach Deploy-Abbruch),
      # wird nur das Tarball-Asset ersetzt statt erneut `create` zu rufen (das sonst mit
      # "a release with the same tag name already exists" abbräche). Siehe Issue #134.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "priority-pilot-${GITHUB_REF_NAME}.tar.gz" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "priority-pilot-${GITHUB_REF_NAME}.tar.gz" --generate-notes
          fi

      # Pull-Modell: der Host zieht das Release selbst (siehe docs/deployment.md, Abschnitt 6).
      # Bricht erwartbar ab, solange Server/Secrets noch nicht eingerichtet sind.
      - name: Deploy auslösen
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          install -m600 <(printf '%s\n' "$SSH_KEY") /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "deploy priority-pilot ${GITHUB_REF_NAME}"
