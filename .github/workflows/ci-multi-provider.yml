name: CI Multi-Provider

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider to test (default = claude)'
        required: false
        type: choice
        options:
          - claude
          - zai
          - openrouter
  schedule:
    - cron: '17 4 * * *'

env:
  # Provider aus Input oder Default
  LLM_PROVIDER: ${{ github.event.inputs.provider || 'claude' }}

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Configure Provider Settings
        id: provider
        run: |
          PROVIDER="${{ env.LLM_PROVIDER }}"
          echo "provider=$PROVIDER" >> $GITHUB_OUTPUT

          case $PROVIDER in
            claude)
              echo "Using native Claude (no settings.local)"
              echo "ANTHROPIC_AUTH_TOKEN=${{ secrets.CLAUDE_API_KEY }}" >> $GITHUB_ENV
              ;;
            zai)
              echo "Configuring Z.ai from CLAUDE_CODE_SETTINGS_LOCAL_ZAI variable"
              echo "${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}" > .claude/settings.local.json
              echo "ANTHROPIC_AUTH_TOKEN=${{ secrets.ZAI_API_KEY }}" >> $GITHUB_ENV
              ;;
            openrouter)
              echo "Configuring OpenRouter from CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER variable"
              echo "${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}" > .claude/settings.local.json
              echo "ANTHROPIC_AUTH_TOKEN=${{ secrets.OPENROUTER_API_KEY }}" >> $GITHUB_ENV
              ;;
            *)
              echo "Unknown provider: $PROVIDER" && exit 1
              ;;
          esac

          # Debug: show generated settings.local (without secrets)
          if [ -f .claude/settings.local.json ]; then
            echo "Generated settings.local.json:"
            cat .claude/settings.local.json | sed 's#"ANTHROPIC_AUTH_TOKEN": "[^"]*"#"ANTHROPIC_AUTH_TOKEN": "***"#'
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format-Check
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm -r build

      - name: Test (frontend)
        run: pnpm --filter frontend test

      - name: Coverage-Gate (server/src/logics)
        run: pnpm --filter server test:coverage

  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Configure Provider Settings
        run: |
          PROVIDER="${{ env.LLM_PROVIDER }}"

          case $PROVIDER in
            claude)
              echo "ANTHROPIC_AUTH_TOKEN=${{ secrets.CLAUDE_API_KEY }}" >> $GITHUB_ENV
              ;;
            zai)
              echo "${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}" > .claude/settings.local.json
              echo "ANTHROPIC_AUTH_TOKEN=${{ secrets.ZAI_API_KEY }}" >> $GITHUB_ENV
              ;;
            openrouter)
              echo "${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}" > .claude/settings.local.json
              echo "ANTHROPIC_AUTH_TOKEN=${{ secrets.OPENROUTER_API_KEY }}" >> $GITHUB_ENV
              ;;
            *)
              echo "Unknown provider: $PROVIDER" && exit 1
              ;;
          esac

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright-Browser-Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Playwright-Browser installieren
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: E2E (shard ${{ matrix.shard }}/4)
        run: pnpm --filter frontend exec playwright test --shard=${{ matrix.shard }}/4

      - name: Playwright-Report sichern
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ env.LLM_PROVIDER }}-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
