name: Deploy
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 noetig, damit git push den vollstaendigen Verlauf hat
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc # zentrale Node-Version (gleicher Stand wie ci/implement/fixup)
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build

      - name: Server-Prod-Deps bündeln
        run: pnpm --filter ./server --prod deploy --legacy server/deploy

      - name: SSH-Key bereitstellen
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m700 -d ~/.ssh
          install -m600 <(printf '%s\n' "$SSH_KEY") ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: rsync Frontend
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_WEB_DIR }}/"

      - name: rsync Backend
        run: |
          rsync -az --delete --exclude 'data/' --exclude '*.sqlite' --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            server/dist/ "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_APP_DIR }}/dist/"
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            server/deploy/package.json "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_APP_DIR }}/package.json"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            server/deploy/node_modules/ "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_APP_DIR }}/node_modules/"

      - name: Backend per PM2 neu starten
        run: |
          ssh -i ~/.ssh/deploy_key "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "pm2 reload priority-pilot --update-env || pm2 start ${{ vars.DEPLOY_APP_DIR }}/dist/index.js --name priority-pilot"

      # ━━━━ Patch-Bump nach Deploy (#286) ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # App-Token noetig: Standard-GITHUB_TOKEN loest keine Folge-Workflows aus;
      # Branch-Protection auf main blockiert direkte Pushes ohne App-Berechtigung.
      # Der Bump-Commit traegt [skip ci] — verhindert eine Endlosschleife (deploy.yml
      # wuerde sonst durch den eigenen Push erneut ausgefuehrt).
      - name: App-Token holen
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Git-Identitaet aus App-Slug ableiten
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user="${APP_SLUG}[bot]"
          id=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${APP_SLUG}%5Bbot%5D" | jq -r '.id // empty') || id=""
          if [ -n "$id" ]; then
            email="${id}+${user}@users.noreply.github.com"
          else
            email="${user}@users.noreply.github.com"
          fi
          git config user.name "$user"
          git config user.email "$email"

      - name: Patch-Bump + Commit + Push auf main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Vor dem Bump sicherstellen, dass wir auf dem aktuellen Stand sind
          git pull --rebase origin main
          # Relativer Bump: respektiert eine im PR manuell angehobene Version automatisch
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json
          # --no-verify: der Release-Commit darf die lefthook pre-commit-Hooks
          # (format/lint/knip) NICHT ausloesen. In der Deploy-CI synchronisiert
          # pnpm's deps-status-check node_modules sonst auf den prod-only-Stand des
          # vorherigen `--prod deploy`-Schritts und entfernt die devDependencies
          # inkl. lefthook selbst → `lefthook install` (prepare) schlaegt fehl.
          git commit --no-verify -m "chore(release): v${NEW_VERSION} [skip ci]"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
