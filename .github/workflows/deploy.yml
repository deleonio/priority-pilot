name: Deploy
on:
  push:
    branches: [main]
  # Redeploy des aktuellen main OHNE Patch-Bump — stößt cron.daily-version.yml nach
  # seinem Minor-Bump an (dessen [skip ci]-Commit löst keinen push-Lauf aus).
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 noetig, damit git push den vollstaendigen Verlauf hat
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc # zentrale Node-Version (gleicher Stand wie ci/implement/fixup)
          cache: pnpm

      - name: Git-Identität auf Repo-Owner stellen
        # Release-Commits (Patch-Bump auf main) laufen unter der Identität des Repo-Owners
        # statt der App-Bot-Identität — gültige noreply-Adresse, Commits verlinken auf den
        # Owner-Account. Der PUSH bleibt App-Token (App-only-Pipeline).
        run: |
          git config user.name "deleonio"
          git config user.email "6279703+deleonio@users.noreply.github.com"

      # ━━━━ Patch-Bump VOR dem Build (#286) ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # vite.config.ts backt package.json.version beim Build als __APP_VERSION__ in das
      # Frontend-Bundle (Footer). Lief der Bump erst nach dem Deploy, trug das deployte
      # Bundle immer die Vorgängerversion, während Changelog/Release schon die neue zeigten.
      # Deshalb: Bump hier nur LOKAL committen, Build + Deploy damit ausführen und den
      # Commit erst nach erfolgreichem Deploy pushen — ein roter Build hinterlässt so keine
      # Version auf main, die nie ausgeliefert wurde.
      - name: Patch-Bump + Commit (lokal)
        if: github.event_name == 'push'
        run: |
          # Relativer Bump: respektiert eine im PR manuell angehobene Version automatisch
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          git add package.json
          # --no-verify: der Release-Commit darf die lefthook pre-commit-Hooks
          # (format/lint/knip) NICHT auslösen — reiner Versions-Commit.
          git commit --no-verify -m "chore(release): v${NEW_VERSION} [skip ci]"

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build

      - name: Server-Prod-Deps bündeln
        run: pnpm --filter ./server --prod deploy --legacy server/deploy

      - name: Commit-SHA und Version in die deployte package.json stempeln
        run: |
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const path = 'server/deploy/package.json';
            const pkg = JSON.parse(readFileSync(path, 'utf8'));
            pkg.gitSha = process.env.GITHUB_SHA.slice(0, 12);
            pkg.version = JSON.parse(readFileSync('package.json', 'utf8')).version;
            writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: SSH-Key bereitstellen
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m700 -d ~/.ssh
          install -m600 <(printf '%s\n' "$SSH_KEY") ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: rsync Frontend
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            frontend/dist/ "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_WEB_DIR }}/"

      - name: rsync Backend
        run: |
          rsync -az --delete --exclude 'data/' --exclude '*.sqlite' --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key" \
            server/dist/ "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_APP_DIR }}/dist/"
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            server/deploy/package.json "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_APP_DIR }}/package.json"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            server/deploy/node_modules/ "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_APP_DIR }}/node_modules/"

      - name: Backend per PM2 neu starten
        run: |
          ssh -i ~/.ssh/deploy_key "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "pm2 reload priority-pilot --update-env || pm2 start ${{ vars.DEPLOY_APP_DIR }}/dist/index.js --name priority-pilot"

      # App-Token noetig: Standard-GITHUB_TOKEN loest keine Folge-Workflows aus;
      # Branch-Protection auf main blockiert direkte Pushes ohne App-Berechtigung.
      # Der Bump-Commit traegt [skip ci] — verhindert eine Endlosschleife (deploy.yml
      # wuerde sonst durch den eigenen Push erneut ausgefuehrt).
      - name: App-Token holen
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Release-Commit auf main pushen
        # Der Bump-Commit entstand vor dem Build (s. „Patch-Bump + Commit (lokal)") und wird
        # erst jetzt, nach erfolgreichem Deploy, veröffentlicht. Rebase holt zwischenzeitliche
        # [skip ci]-Commits (z. B. CHANGELOG.md des Vorlaufs) nach.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git pull --rebase origin main
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main

      - name: Tag + GitHub Release (best-effort)
        if: github.event_name == 'push'
        # Versieht den Release-Commit mit v<Version> und erzeugt ein GitHub-Release mit
        # generierten Notes (Kategorisierung über .github/release.yml aus den release:*
        # Labels der gemergten PRs — ohne diesen Schritt liefen die Documenter-Labels ins
        # Leere). Best-effort: ein fehlgeschlagenes Release darf das Deploy NIE kippen.
        #
        # Race Condition (Changelog-Konsolidierung): 06-document.yml setzt das release:*-
        # Label ERST NACH dem Merge (pull_request:closed), parallel zu diesem push-getriggerten
        # Workflow. Der Build/Deploy-Pfad hier ist meist schneller als der LLM-Klassifizierungs-
        # Pfad des Documenters — `gh release create --generate-notes` snapshottet die PR-Labels
        # zum Zeitpunkt des Aufrufs, ein danach gesetztes Label wird NIE nachträglich übernommen
        # (gh release view oben überspringt ein bereits existierendes Release komplett). Daher
        # hier best-effort kurz auf das Label warten, bevor das Release erzeugt wird.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          TAG="v${NEW_VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "⏭️ Tag ${TAG} existiert bereits (Re-Run) — nur Release prüfen."
          else
            git tag "$TAG"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "refs/tags/${TAG}" \
              || { echo "::warning title=Tag-Push fehlgeschlagen::${TAG} konnte nicht gepusht werden — Deploy bleibt grün, manuell nachholen."; exit 0; }
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "⏭️ Release ${TAG} existiert bereits — nichts zu tun."
          else
            # PR-Nummer aus dem Squash-Merge-Commit ableiten (merge-pr.yml merged
            # ausschließlich per --squash mit Titel = PR-Titel; GitHub hängt an die
            # Squash-Commit-Message standardmäßig "(#NNN)" an).
            PR_NUMBER="$(git log -1 --format=%s | grep -oP '\(#\K[0-9]+(?=\)$)' || true)"
            if [ -n "$PR_NUMBER" ]; then
              echo "Merge-PR erkannt: #${PR_NUMBER} — warte bis zu 3 Minuten auf release:*-Label des PR-Documenters."
              WAITED=0
              while [ "$WAITED" -lt 180 ]; do
                LABELS="$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels -q '.labels[].name' 2>/dev/null || true)"
                if printf '%s\n' "$LABELS" | grep -q '^release:'; then
                  echo "✅ release:*-Label gefunden nach ${WAITED}s."
                  break
                fi
                sleep 15
                WAITED=$((WAITED + 15))
              done
              if ! printf '%s\n' "$LABELS" | grep -q '^release:'; then
                echo "::warning title=Kein release:-Label::PR #${PR_NUMBER} hat nach ${WAITED}s kein release:*-Label — Release wird trotzdem erstellt (landet in \"Other Changes\")."
              fi
            else
              echo "::warning title=PR-Nummer nicht ermittelbar::Merge-Commit-Message ohne (#NNN) — Label-Wait übersprungen."
            fi
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "$TAG" --generate-notes --latest \
              || { echo "::warning title=Release-Creation fehlgeschlagen::${TAG} — Deploy bleibt grün, manuell nachholen."; exit 0; }
            echo "🚀 Release ${TAG} mit generierten Notes erstellt."
          fi

      - name: CHANGELOG.md aktualisieren (best-effort)
        # Regeneriert CHANGELOG.md aus ALLEN GitHub-Releases (#1372), NACH dem Release-Schritt
        # oben, damit das gerade erstellte Release direkt enthalten ist. Best-effort wie der
        # Schritt davor: ein Fehler darf das Deploy nie kippen. [skip ci] + --no-verify aus
        # demselben Grund wie beim Patch-Bump-Commit oben (sonst Endlosschleife bzw.
        # lefthook-Fehler, s. Kommentar dort).
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bash .github/scripts/changelog-render.sh --repo "${{ github.repository }}" \
            || { echo "::warning title=Changelog-Rendering fehlgeschlagen::Deploy bleibt grün, manuell nachholen."; exit 0; }
          if git diff --quiet -- CHANGELOG.md; then
            echo "⏭️ CHANGELOG.md unverändert."
            exit 0
          fi
          git add CHANGELOG.md
          git commit --no-verify -m "docs(changelog): CHANGELOG.md aktualisieren [skip ci]" \
            || { echo "::warning title=Changelog-Commit fehlgeschlagen::Deploy bleibt grün, manuell nachholen."; exit 0; }
          git pull --rebase origin main \
            || { echo "::warning title=Changelog-Rebase fehlgeschlagen::Deploy bleibt grün, manuell nachholen."; exit 0; }
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main \
            || echo "::warning title=Changelog-Push fehlgeschlagen::Deploy bleibt grün, manuell nachholen."
