name: Test Tailscale Exit Node Route

on:
  workflow_dispatch: # Erlaubt manuelles Starten über die GitHub-Oberfläche

jobs:
  test-vpn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. IP VOR der VPN-Verbindung prüfen (Microsoft Azure Datacenter IP)
      - name: Check IP (Before Tailscale)
        run: |
          echo "=== Official Runner IP ==="
          curl -s --max-time 10 https://ifconfig.me
          echo ""

      # 2. Tailscale verbinden & Traffic über den Exit Node zwingen
      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          args: --exit-node=${{ vars.TAILSCALE_EXIT_NODE }} --exit-node-allow-lan-access=true

      # 2b. Diagnose: Ist der Exit Node überhaupt erkannt + Routing aktiv?
      - name: Diagnose Exit-Node-Routing
        run: |
          echo "=== TAILSCALE_EXIT_NODE Variable ==="
          echo "${{ vars.TAILSCALE_EXIT_NODE }}"
          echo ""
          echo "=== Tailscale Peers ==="
          tailscale status || true
          echo ""
          echo "=== Exit-Node-Liste ==="
          tailscale exit-node list 2>/dev/null || echo "(exit-node list nicht verfügbar)"
          echo ""
          echo "=== Default Route ==="
          ip route show default
          echo ""
          echo "=== Tailscale-Interface ==="
          ip addr show tailscale0 2>/dev/null || echo "(kein tailscale0-Interface)"

      # 3. DNS-Fix: systemd-resolved im Stub-Modus intercepted DNS-Queries und fragt
      #    weiterhin den Azure-DNS, der durch den Tunnel nicht erreichbar ist. Service
      #    stoppen + echte resolv.conf schreiben, sonst schlagen die folgenden curls
      #    mit exit 28 fehl.
      - name: Fix DNS for Exit-Node routing
        run: |
          sudo systemctl stop systemd-resolved 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee /etc/resolv.conf >/dev/null
          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf >/dev/null
          echo "=== DNS check ==="
          getent hosts ifconfig.me || echo "::warning::DNS-Auflösung fehlgeschlagen"

      # 4. IP NACH der VPN-Verbindung prüfen (Deine Frankfurter Server IP)
      - name: Check IP (After Tailscale)
        run: |
          echo "=== Routed IP via Frankfurt ==="
          curl -s --max-time 10 https://ifconfig.me || echo "(curl fehlgeschlagen — Exit Node routet nicht)"
          echo ""
          echo "=== Trace Route Details ==="
          curl -s --max-time 10 https://ipapi.co/json/ || echo "(curl fehlgeschlagen)"
