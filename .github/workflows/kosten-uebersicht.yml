name: Kosten-Übersicht

# Rendert die Gesamt-Übersicht über ALLE versiegelten Kosten-Datensätze (.costs/*.json)
# in die Job-Summary — das Gegenstück zum Workflow „Kosten-Baseline" (der aggregiert die
# 90-Tage-ARTEFAKTE eines einzelnen Tickets, dieser liest die dauerhaft EINGECHECKTEN
# Dateien aller Tickets, s. .costs/SCHEMA.md).
#
# WARUM NUR MANUELL: Die Übersicht ist eine Momentaufnahme für den Menschen („wo stehen
# die Kosten, welche Tickets sind die Schleifen-Kandidaten") — ein schedule würde nur
# Runner verbrennen. Beim lokalen Blick reicht:
#   node .github/scripts/costs-report.ts --dir .costs
#
# NUR LESEND: kein Label, kein Kommentar, kein Commit.

on:
  workflow_dispatch: {}

permissions:
  contents: read # .costs/ + Skript auschecken

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Bericht bauen
        run: |
          set -euo pipefail
          # Bewusst `node` statt tsx: kein pnpm-Setup nötig, das Skript nutzt
          # ausschliesslich löschbare TypeScript-Syntax (gleiche Begründung wie record-cost).
          node .github/scripts/costs-report.ts --dir .costs \
            | tee -a "$GITHUB_STEP_SUMMARY"
