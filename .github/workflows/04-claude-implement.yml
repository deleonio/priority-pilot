name: 4/6 Umsetzung

# Die EINE Phase, die Code schreibt. Sie hat zwei Eingänge:
#
#   Issue + ai:needs-impl   → Erstumsetzung (aus der Spec oder im Direkt-Modus)
#   PR    + ai:needs-fixup  → Nacharbeit an Review-Findings / roter CI / Merge-Konflikten
#
# Setzt **Claude Code** ein; Provider via `vars.LLM_PROVIDER` (zai|claude), aufgelöst in setup-claude.
#
# WARUM ZUSAMMENGEFÜHRT (ADR-0005, vormals 06-claude-pr-fixup.yml): Beide Eingänge machen
# dasselbe — Code ändern, Tests grün bekommen, committen, an den Review übergeben. Getrennt
# gehalten bedeutete: zwei Setup-Ketten, zwei Memory-Blöcke und zwei Stellen, an denen jeder
# Fix nachgezogen werden muss. Der Nutzen ist Wartbarkeit, NICHT Token-Ersparnis — beide
# Eingänge starten weiterhin je eine eigene Claude-Session, es wird kein Kontext geteilt.
#
# PREIS DER GEMEINSAMEN GRUPPE: Umsetzung und Nacharbeit stapeln sich jetzt in EINER Queue,
# der Durchsatz sinkt also unter Last. Dafür kann eine Umsetzung am Issue nicht mehr parallel
# zur Nacharbeit am zugehörigen PR laufen. Dieser Fall war schon vorher unwahrscheinlich (der
# Doppel-Run-Guard fängt „ready-PR existiert bereits" ab) — die gemeinsame Gruppe macht daraus
# eine Invariante statt eines Guards, der greifen muss.
#
# WARUM TROTZDEM ZWEI JOBS: Die Eingänge unterscheiden sich in allem, was den Job ausmacht —
# Checkout-Ref (Merge-Ref vs. head.ref), Fork-Guard, Vor-Guards (Doppel-Run vs. Target-Merge +
# Start-Konsum + Stop-Guard), Fortschrittsmessung (fertiger PR vs. HEAD-Bewegung) und
# Ergebnis-Labels. In EINEN Job gepresst wäre jeder zweite Step ein `if` auf den Event-Typ —
# genau die Sorte Bedingungsgeflecht, in der Fehler unsichtbar werden. Geteilt wird, was
# tatsächlich geteilt gehört: Workflow-Datei, Concurrency-Gruppe, Precheck und Modellwahl.
#
# CONCURRENCY: EINE statische Gruppe für beide Eingänge (globale Serialisierung, FIFO). Der
# `precheck`-Job prüft den LABEL-IST-ZUSTAND zur LAUFZEIT — queued Runs würden mit dem
# Label-Zustand zum TRIGGER-Zeitpunkt falsch wiederholen (Label inzwischen von einem anderen
# Lauf konsumiert). Ausnahme Continuation: Der Soft-Abort im Issue-Zweig entfernt+re-addet
# ai:needs-impl absichtlich — der Folgelauf sieht das Label dann (korrekt) noch vorhanden und
# setzt fort.

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

concurrency:
  group: claude-implement
  cancel-in-progress: false
  # queue: max — OHNE dies hält GitHub pro Gruppe nur EINEN pending-Run: jeder neue
  # Run cancelt den wartenden (`queue: single` ist der Default). Mit statischem,
  # ticket-unabhängigem Key hätte ein Label-Burst über mehrere Tickets die
  # wartenden Läufe still verworfen — Trigger-Label klebt, kein Lauf, kein Notice.
  # `max` = bis zu 100 pending, FIFO. Unvereinbar mit cancel-in-progress: true.
  queue: max

jobs:
  precheck:
    # Unveränderliche Event-Fakten filtern hier (spart den Runner für No-op-Trigger — der
    # Workflow feuert auf JEDES `labeled` an Issues UND PRs im Repo).
    #
    # FORK-GUARD im PR-Zweig: `actions/checkout` holt bei pull_request den Merge-Ref, also
    # PR-Code, und die lokale Action samt Skript würde daraus ausgeführt. Stünde der Guard erst
    # am Hauptjob, führte ein Fork-PR mit manipuliertem check-phase-label.sh eigenen Bash aus,
    # sobald irgendjemand ein Label setzt. Ein Fork-PR lässt den precheck `skipped` — das
    # erfüllt keine Klausel im `if` des fixup-Jobs, der Guard wirkt also für beide Jobs.
    if: >-
      ${{ (github.event_name == 'issues' && github.event.label.name == 'ai:needs-impl')
          || (github.event_name == 'pull_request'
              && github.event.label.name == 'ai:needs-fixup'
              && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # lokale Action + Skript auschecken
      issues: write # Abbruchfall der Modellwahl setzt ai:needs-human + Begründung (Issue-Zweig)
      pull-requests: write # dito am PR (Fixup-Zweig)
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      model: ${{ steps.model.outputs.model }}
      model_abort: ${{ steps.model.outputs.abort }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Eingang bestimmen (Issue-Umsetzung oder PR-Fixup)
        id: route
        env:
          ISSUE_NR: ${{ github.event.issue.number }}
          PR_NR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Die beiden Eingänge derselben Phase tragen unterschiedliche Soll-Zustände
          # (Objekt-Art + Trigger-Label). Aufgelöst wird das über den Phasen-Namen, den
          # check-phase-label.sh kennt — hier fällt nur die Zuordnung.
          if [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            {
              echo "ticket=${ISSUE_NR}"
              echo "kind=issue"
              echo "phase=implement"
              # Auto-Eskalation ist an Review-Runden gebunden (Zählung der ai-review-
              # Kommentare am PR) und für ein Issue ohne Bedeutung.
              echo "escalate=false"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "ticket=${PR_NR}"
              echo "kind=pr"
              echo "phase=implement-pr"
              # Ab der zweiten Review-Runde eine Stufe hochsetzen: Eine zu niedrig
              # eingestufte Subtask erzeugt sonst Schleifen, die die Ersparnis auffressen.
              echo "escalate=true"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Label-Pre-Check (IST-Zustand zur Laufzeit)
        # Label-IST-Zustand zur Laufzeit: Das Trigger-Label muss JETZT (nach dem Warten in
        # der globalen Phasen-Queue) noch am Objekt kleben. Soll-Werte stehen zentral in
        # .github/scripts/check-phase-label.sh; hier wird nur der Phasen-Name übergeben.
        id: check
        uses: ./.github/actions/check-phase-label
        with:
          phase: ${{ steps.route.outputs.phase }}
          ticket: ${{ steps.route.outputs.ticket }}

      - name: Modellwahl aus ai:model:*-Label
        # NACH dem Phasen-Check: Ein konsumierter Trigger soll nicht wegen einer fehlenden
        # Modellwahl ai:needs-human setzen — der Lauf ist dann ohnehin ein No-op.
        if: steps.check.outputs.proceed == 'true'
        id: model
        uses: ./.github/actions/resolve-model
        with:
          ticket: ${{ steps.route.outputs.ticket }}
          kind: ${{ steps.route.outputs.kind }}
          auto-escalate: ${{ steps.route.outputs.escalate }}

  # ---------------------------------------------------------------------------
  # Eingang 1: Issue + ai:needs-impl  →  Erstumsetzung
  # ---------------------------------------------------------------------------
  implement:
    needs: precheck
    # `result == 'failure'` ist FAIL-OPEN und beabsichtigt: das Skript fällt bei API-Fehlern
    # bewusst auf "laufen lassen" zurück, aber ein Fehler AUSSERHALB (Checkout, Timeout,
    # Runner-Ausfall) würde den Hauptjob sonst stumm überspringen — Trigger konsumiert, niemand
    # arbeitet, nichts re-armt. Ein übersprungener precheck (result == 'skipped', No-op-Trigger)
    # erfüllt keine der beiden Klauseln und lässt den Hauptjob korrekt entfallen.
    # `model_abort == 'true'` stoppt zusätzlich hart: Ohne gesicherte Modellwahl liefe der
    # Lauf auf dem settings.json-Default, also potenziell auf dem teuersten Modell. Das
    # Ticket trägt dann bereits ai:needs-human samt Begründung (s. resolve-model).
    # `github.event_name` trennt die beiden Eingänge — der precheck ist für beide derselbe.
    if: >-
      ${{ always()
          && github.event_name == 'issues'
          && needs.precheck.outputs.model_abort != 'true'
          && (needs.precheck.outputs.proceed == 'true' || needs.precheck.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    permissions:
      contents: read
      id-token: write
      actions: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Startzeit merken (für weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 840))" >> "$GITHUB_OUTPUT"

      - name: Setup Claude Code (mit Memory-Load)
        id: setup
        uses: ./.github/actions/setup-claude
        with:
          needs-mcp: true
          browser-mcp: true
          tools-tier: full
          event-type: ${{ github.event_name }}
          ticket-ref: ${{ github.event.issue.number }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          # Modellwahl kommt aus dem ai:model:*-Label am Ticket (precheck), NICHT mehr
          # statisch aus einer Repo-Variable: Die Analyse stuft je Subtask ein, damit
          # einfache Aufgaben nicht dauerhaft auf dem teuersten Modell laufen.
          # vars.CLAUDE_MODEL_IMPLEMENT bleibt als manueller Not-Override wirksam.
          # Dritter Fallback ist der frühere Phasen-Default und KEIN Schmuck: Läuft ein PR
          # ohne Analyse-Herkunft, liefert der Resolver bewusst ein leeres Modell. Leer
          # bedeutet in setup-claude aber „kein Alias auflösen" — bei zai/openrouter bleibt
          # dann das Modell aus settings.local.json stehen, das der Provider als
          # `unrecognized_model` ablehnen kann (beobachtet an PR #916). Der Literal-Default
          # stellt exakt das Verhalten von vor der Modellwahl wieder her.
          model: ${{ vars.CLAUDE_MODEL_IMPLEMENT || needs.precheck.outputs.model || 'opus' }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          zai-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}
          openrouter-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          tailscale-exit-node: ${{ vars.TAILSCALE_EXIT_NODE }}
          memory-load: 'true'
          expect-memory: 'true'

      # Kein Skip-Guard ("läuft bereits") mehr: Die globale Phasen-Serialisierung (statische
      # concurrency-Gruppe) lässt Läufe desselben Issues nie parallel laufen, und der precheck
      # dedupliziert über den Label-IST-Zustand. Ein Lauf-Listen-Guard würde hier nur noch
      # queued Nachfolger finden und das FALSCHE Skip auslösen.

      - name: Issue einem Menschen zuweisen (Best-Effort)
        if: steps.setup.outputs.configured == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
          ASSIGNEE: ${{ github.event.sender.type == 'User' && github.event.sender.login || (github.event.issue.user.type == 'User' && github.event.issue.user.login || '') }}
        run: |
          if [ -z "$ASSIGNEE" ]; then
            echo "::notice::Kein menschlicher Assignee ermittelbar."
            exit 0
          fi
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-assignee "$ASSIGNEE"

      - name: Doppel-Run-Guard (ready-PR existiert bereits)
        id: doppel-guard
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          # Ready-PR = nicht-draft PR zu diesem Issue. Helper mit closingRef- +
          # Body-Fallback (PR #585: "Closes NNN" ohne "#" sonst nicht gefunden).
          existing="$(bash .github/scripts/pr-for-issue.sh --repo "$GITHUB_REPOSITORY" \
            --issue "$ISSUE" --draft no --out count)"
          if [ "${existing:-0}" -gt 0 ]; then
            echo "::notice::Umsetzung übersprungen – ready-PR existiert bereits für Issue #$ISSUE."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Arbeitsumgebung aufbauen (pnpm, Playwright, Inspect-Instanz)
        id: workbench
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: ./.github/actions/claude-workbench

      - name: Fortsetzungs-Stand prüfen (ai:continued)
        id: continued-before
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          already="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "ai:continued")' 2>/dev/null || echo false)"
          echo "already=${already:-false}" >> "$GITHUB_OUTPUT"

      - name: Umsetzung via Claude
        id: claude
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          # Prompt liegt kanonisch in .github/prompts/implement.md — dieselbe Ablage wie der
          # Fixup-Prompt der Schwesterphase. Snippet-Platzhalter (#ISSUE_NR, #PHASE,
          # #MEMORY_STATUS) werden erst NACH dem Anhängen der Memory-Snippets substituiert.
          cp .github/prompts/implement.md /tmp/claude-prompt.txt

          # Memory-Snippets anhängen (Phase 4: restauriert + schreibt). Vor den seds, damit
          # deren Platzhalter (#ISSUE_NR/#PHASE/#MEMORY_STATUS) mit substituiert werden.
          cat .github/prompts/memory-read.md >> /tmp/claude-prompt.txt
          cat .github/prompts/memory-write.md >> /tmp/claude-prompt.txt

          sed -i "s/#ISSUE_NR/${{ github.event.issue.number }}/g" /tmp/claude-prompt.txt
          sed -i "s/#PHASE/implement/g" /tmp/claude-prompt.txt
          sed -i "s/#MEMORY_STATUS/${{ steps.setup.outputs.memory-status-text }}/g" /tmp/claude-prompt.txt
          # Resume-Hinweis: bei ai:continued (Folgelauf nach Soft-Abort) Memory-Pflicht betonen.
          if [ "${{ steps.continued-before.outputs.already }}" = "true" ]; then
            sed -i "s|#RESUME_HINT|⚠️ FORTSETZUNGS-Lauf (ai:continued) — lies ZUERST .claude/memory/ und SETZE FORT, starte NICHT neu, wiederhole nichts aus 'Erledigt'!|g" /tmp/claude-prompt.txt
          else
            sed -i "s/#RESUME_HINT//g" /tmp/claude-prompt.txt
          fi
          sed -i "s/SOFT_DEADLINE/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/claude-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Token & Kosten erfassen
        # always(): Auch ein abgebrochener Lauf hat Token verbraucht — gerade teure
        # Fehlläufe gehören in die Baseline, sonst sieht die alte Pipeline zu günstig aus.
        if: always() && steps.setup.outputs.configured == 'true'
        uses: ./.github/actions/record-cost
        with:
          issue: ${{ steps.setup.outputs.issue-number || github.event.issue.number }}
          phase: implement
          since-epoch: ${{ steps.starttime.outputs.epoch }}
          provider: ${{ steps.setup.outputs.llm-provider }}

      - name: Issue-Storage sichern (State-Branch)
        # ADR 0006: Fetch-then-Commit auf ai/state/issue-{N} — der Branch IST der Speicher
        # (unbefristet, versioniert, kein Artefakt-/Cache-Transport mehr; Cache-Writes sind
        # für diese Trigger platform-seitig gesperrt, s. setup-claude Kopf-Kommentar).
        if: always() && steps.setup.outputs.configured == 'true'
        uses: ./.github/actions/issue-state-save
        with:
          issue-number: ${{ steps.setup.outputs.issue-number || github.event.issue.number }}
          phase: implement

      - name: Label-Post-Assertion (VERDICT parsen, Labels via App-Token force-setzen)
        if: always() && steps.setup.outputs.configured == 'true' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure' || steps.claude.outcome == 'cancelled' || steps.doppel-guard.outputs.skip == 'true')
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
          ALREADY_CONTINUED: ${{ steps.continued-before.outputs.already }}
          GUARD_SKIP: ${{ steps.doppel-guard.outputs.skip }}
        run: |
          verdict=""
          if [ -f /tmp/claude-output.log ]; then
            verdict="$(grep 'VERDICT:' /tmp/claude-output.log | tail -1 | sed -E 's/^.*VERDICT:[[:space:]]*//' | tr -d -c 'A-Za-z0-9-' || true)"
          fi
          echo "Claude-Verdict aus Output: '${verdict:-keins}'"

          # Dieser Step laeuft im Doppel-Run-Guard-Skip bewusst mit (siehe if oben): er soll das
          # Label fuer den BESTEHENDEN PR setzen. Ohne diesen Arm haengt das Ergebnis daran, dass
          # die ARTIFACTS_OK-Pruefung den fremden PR zufaellig als fertig erkennt — richtig, aber
          # unbelegt. Explizit machen, symmetrisch zu 03-claude-spec.yml.
          if [ "${GUARD_SKIP:-false}" = "true" ]; then
            verdict="needs-review"
            echo "::notice::Doppel-Run-Guard: PR existiert bereits — behandele als needs-review."
          fi

          # PR finden: primär closingIssuesReferences, Fallback auf Closing-Keyword im Body
          # (PR #585: "Closes NNN" ohne "#" lässt die Referenz sonst leer → Crash).
          PR_NR="$(bash .github/scripts/pr-for-issue.sh --repo "$GITHUB_REPOSITORY" \
            --issue "$ISSUE" --draft no --out first)"
          ARTIFACTS_OK="false"
          if [ -n "$PR_NR" ] && [ "$PR_NR" != "null" ]; then
            PR_DRAFT="$(gh pr view "$PR_NR" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo "true")"
            PR_COMMITS="$(gh pr view "$PR_NR" --repo "$GITHUB_REPOSITORY" --json commits --jq '.commits | length' 2>/dev/null || echo "0")"
            if [ "$PR_DRAFT" != "true" ] && [ "${PR_COMMITS:-0}" -gt 0 ]; then
              ARTIFACTS_OK="true"
            fi
          fi

          if [ "$verdict" = "needs-review" ]; then
            if [ "$ARTIFACTS_OK" != "true" ]; then
              echo "::error title=❌ PR fehlt::VERDICT needs-review, aber kein fertiger PR gefunden."
              exit 1
            fi
            final="needs-review"
          elif [ "$verdict" = "not-ready" ]; then
            if [ "$ARTIFACTS_OK" = "true" ]; then
              final="needs-review"
            else
              final="not-ready"
            fi
          else
            if [ "$ARTIFACTS_OK" = "true" ]; then
              final="needs-review"
            else
              final="not-ready"
            fi
          fi

          gh label create "ai:needs-review" --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true

          if [ "$final" = "needs-review" ]; then
            # Erfolg: Trigger konsumieren, Review-Trigger auf den PR
            # (Übergang Issue → PR: ai:needs-review startet Phase 5 am PR).
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:needs-impl" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:continued" 2>/dev/null || true
            gh pr edit "$PR_NR" --repo "$GITHUB_REPOSITORY" --remove-label "ai:needs-review" 2>/dev/null || true
            gh pr edit "$PR_NR" --repo "$GITHUB_REPOSITORY" --add-label "ai:needs-review"
            echo "::notice::Label gesetzt: ai:needs-review an PR #${PR_NR}"

          else
            if [ "${ALREADY_CONTINUED:-false}" = "true" ]; then
              # Obergrenze erreicht: ai:to-big-issue ist ein reines Info-Signal an den
              # Menschen (löst bewusst nichts automatisch aus).
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:needs-impl" 2>/dev/null || true
              gh label create "ai:to-big-issue" --repo "$GITHUB_REPOSITORY" --color B60205 2>/dev/null || true
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue" 2>/dev/null || true
              echo "::warning::Obergrenze erreicht (2. Soft-Abort) – ai:to-big-issue gesetzt"
            else
              gh label create "ai:continued" --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:continued"
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:needs-impl" 2>/dev/null || true
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:needs-impl"
              echo "::notice::Soft-Abort – ai:continued gesetzt, ai:needs-impl retriggert"
            fi
          fi

      - name: Ergebnis zusammenfassen
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          SKIP_DOPPEL: ${{ steps.doppel-guard.outputs.skip }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          # Eigener Arm fuer den Doppel-Run-Guard: ohne ihn faellt der gewollte Skip auf den
          # Fehler-Arm (OUTCOME ist leer, weil der claude-Step nie lief) und meldet ❌.
          if [ "${SKIP_DOPPEL:-false}" = "true" ]; then
            echo "::notice title=⏭️ Umsetzung übersprungen::Issue #${ISSUE} — PR existiert bereits"
          elif [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Umsetzung erfolgreich::Issue #${ISSUE}"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Umsetzung abgebrochen"
          else
            echo "::error title=❌ Umsetzung fehlgeschlagen"
          fi
          {
            echo "### Umsetzung #${ISSUE} – fertig"
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Labels: ${labels:-keine}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🩺 Z.AI Fair-Usage-Check (1313)
        # Rohausgabe des Claude-Laufs auf z.ai-Fehler 1313 (Fair Usage) durchsuchen
        # und Ergebnis als Annotation + Job-Summary sichtbar machen.
        if: always()
        uses: ./.github/actions/llm-fair-usage-check

  # ---------------------------------------------------------------------------
  # Eingang 2: PR + ai:needs-fixup  →  Nacharbeit an Review-Findings
  #   review → ai:needs-fixup → fixup → ai:needs-review → review → ... bis 🟢
  # ---------------------------------------------------------------------------
  fixup:
    needs: precheck
    # Gleiche Fail-open-Leine wie im implement-Job (siehe dort). Zusätzlich trennt
    # `github.event_name` die beiden Eingänge, und ein `skipped` precheck (No-op-Trigger
    # ODER Fork-PR) erfüllt keine Klausel — der Fork-Guard aus dem precheck-if wirkt
    # dadurch weiterhin auch für diesen Job.
    if: >-
      ${{ always()
          && github.event_name == 'pull_request'
          && needs.precheck.outputs.model_abort != 'true'
          && (needs.precheck.outputs.proceed == 'true' || needs.precheck.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Fixup-Runden-Deckel (Issue #993): Nach dieser Anzahl Fixup-Runden ohne
      # grünes Review geht die (max+1). Runde an den Menschen (ai:needs-human,
      # siehe Stop-Guard-Step). EIN Konfigurationsort für den Deckel — bewusst
      # als env, nicht im Prompt vergraben.
      MAX_FIXUP_ROUNDS: '3'
    permissions:
      contents: read
      id-token: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Startzeit merken (für weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 600))" >> "$GITHUB_OUTPUT"
          # Erklärungs-Gate (needs-human-explain.sh): Als Erklärung für
          # ai:needs-human zählen nur Kommentare dieses Laufes. 5 min Toleranz
          # nach unten decken Queue-/Checkout-Zeit vor dem LLM-Lauf ab.
          echo "since_epoch=$((now - 300))" >> "$GITHUB_OUTPUT"

      - name: Setup Claude Code (mit Memory-Load)
        id: setup
        uses: ./.github/actions/setup-claude
        with:
          needs-mcp: true
          browser-mcp: true
          tools-tier: full
          event-type: ${{ github.event_name }}
          ticket-ref: ${{ github.event.pull_request.number }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          # Modellwahl kommt aus dem ai:model:*-Label (precheck), NICHT mehr statisch:
          # der PR erbt sie vom verknüpften Issue, ein Label am PR selbst gewinnt.
          # vars.CLAUDE_MODEL_FIXUP bleibt als manueller Not-Override wirksam.
          # Dritter Fallback ist der frühere Phasen-Default und KEIN Schmuck: Läuft ein PR
          # ohne Analyse-Herkunft, liefert der Resolver bewusst ein leeres Modell. Leer
          # bedeutet in setup-claude aber „kein Alias auflösen" — bei zai/openrouter bleibt
          # dann das Modell aus settings.local.json stehen, das der Provider als
          # `unrecognized_model` ablehnen kann (beobachtet an PR #916). Der Literal-Default
          # stellt exakt das Verhalten von vor der Modellwahl wieder her.
          model: ${{ vars.CLAUDE_MODEL_FIXUP || needs.precheck.outputs.model || 'sonnet' }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          zai-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}
          openrouter-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          tailscale-exit-node: ${{ vars.TAILSCALE_EXIT_NODE }}
          memory-load: 'true'
          expect-memory: 'true'

      # Fixup checkt explizit head.ref (kein GitHub-Merge-Ref wie beim Review) – der
      # Target-Branch muss daher aktiv gemergt werden, damit auf demselben Stand
      # gefixt wird, den das Review bewertet hat (head+base).
      #
      # MUSS vor dem Start-Konsum (und vor pnpm install) laufen: Die Workflow-Yaml
      # kommt vom Merge-Ref (base-Stand), der head.ref-Checkout aber vom PR-Branch.
      # Branches, die vor Einführung eines Pipeline-Scripts (z. B. label-transition.sh,
      # 9d8a678) von main zweigten, haben es NICHT im Tree — erst der Merge bringt es
      # rein (PR #895: bash: label-transition.sh: No such file or directory). Genau
      # deshalb steht auch der Phasen-Name `implement-pr` erst NACH dem Merge zur
      # Verfügung: ein Branch mit altem check-phase-label.sh kennt ihn nicht.
      # Derselbe Grund für die Position vor pnpm install: ein Merge NACH dem Install
      # kann die pnpm-lock.yaml unter dem bereits gebauten node_modules austauschen.
      - name: Target-Branch mergen (immer vor Fixup)
        id: merge-target
        if: steps.setup.outputs.configured == 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH" --depth=1 --no-tags
          if git merge-base --is-ancestor "origin/$TARGET_BRANCH" HEAD; then
            echo "Target-Branch bereits in HEAD enthalten – kein Merge nötig."
            exit 0
          fi
          if git merge origin/"$TARGET_BRANCH" --no-ff --no-edit -m "chore(ci): auto-merge $TARGET_BRANCH into PR #$PR"; then
            git push origin HEAD:"$HEAD_BRANCH"
          elif git diff --name-only --diff-filter=U | grep -q .; then
            echo "Merge-Konflikte bleiben liegen – Claude löst sie auf (Prompt Schritt 0)."
          else
            git merge --abort 2>/dev/null || true
          fi

      - name: Trigger-Label konsumieren (Start-Konsum)
        # Atomarer Konsum von ai:needs-fixup direkt nach Target-Merge (analog 05): Der Pipeline-
        # Bestand geht auf leer, mit --expect-Guard gegen zwischenzeitliche Schreiben
        # anderer Akteure. Jeder in der Phasen-Queue wartende Fixup-Run skippt danach im
        # precheck — und ein parallel getriggerter Review sieht kein Trigger-Label mehr
        # (PR #890). Vorher klebte das Label bis zum Job-ENDE (8+ min Fenster).
        # Seit PR #903 laeuft check-phase-label.sh frisch direkt vor dem Konsum — needs-human
        # oder Phasen-Mismatch stoppen hier, bevor irgendein Label bereinigt wird
        # (zusaetzlich verwirft label-transition.sh selbst jede Transition, die ein klebendes
        # ai:needs-human entfernen wuerde).
        id: consume
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # User-Direktive (PR #903): Erst die Label-Phasen-Pruefung FRISCH (Phasen-Match +
          # ai:needs-human), DANN bereinigen. Der precheck-Job lief minutenalt und wird bei
          # eigenem Job-Failure bewusst fail-open umgangen — diese Pruefung hier ist die
          # verbindliche vor jedem Label-Write. proceed=false => Abbruch, Labels UNANGETASTET.
          CHECK=""
          if ! CHECK="$(bash .github/scripts/check-phase-label.sh \
            --repo "$GITHUB_REPOSITORY" --phase implement-pr --ticket "$PR")"; then
            # exit 2 = Konfigurationsfehler (unbekannte Phase) — bewusst rot wie im precheck.
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::error title=❌ Phasen-Prüfung fehlgeschlagen::check-phase-label.sh exited non-zero. Trigger bleibt bewaffnet."
            exit 1
          fi
          c_proceed="$(printf '%s\n' "$CHECK" | sed -n 's/^proceed=//p')"
          c_reason="$(printf '%s\n' "$CHECK" | sed -n 's/^reason=//p')"
          if [ "$c_proceed" != "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "reason=${c_reason:-phasen-pruefung}" >> "$GITHUB_OUTPUT"
            echo "::notice title=⏭️ Fixup verworfen::Frische Phasen-Prüfung: ${c_reason:-Label-Ist-Zustand passt nicht zur Phase} — Labels unangetastet."
            exit 0
          fi

          OUT=""
          if ! OUT="$(bash .github/scripts/label-transition.sh \
            --repo "$GITHUB_REPOSITORY" --pr "$PR" \
            --set-none --expect ai:needs-fixup)"; then
            # Script-Exit != 0: PUT endgültig fehlgeschlagen (Diagnose via stderr im
            # Job-Log). Bewusst ROT enden statt fail-open — analog 05: Trigger bleibt
            # bewaffnet, ein Re-Push re-triggert.
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::error title=❌ Start-Konsum fehlgeschlagen::label-transition.sh fehlgeschlagen (Details: letzte gh-Fehlerzeile im Log). Trigger bleibt bewaffnet."
            exit 1
          fi
          applied="$(printf '%s\n' "$OUT" | sed -n 's/^applied=//p')"
          state="$(printf '%s\n' "$OUT" | sed -n 's/^state=//p')"
          reason="$(printf '%s\n' "$OUT" | sed -n 's/^reason=//p')"
          echo "reason=${reason:-}" >> "$GITHUB_OUTPUT"
          # read-failed = fail-open (analog zum precheck): lieber einmal zu viel fixen
          # als eine Freigabe zu verlieren. Label bleibt dann unkonsumiert.
          if [ "$applied" = "true" ] || [ "$state" = "read-failed" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::ai:needs-fixup konsumiert (Start-Konsum) — Fixup läuft."
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=⏭️ Fixup verworfen::Trigger nicht mehr unverändert vorhanden — ${reason:-neuerer Zustand regiert}."
          fi

      - name: Arbeitsumgebung aufbauen (pnpm, Playwright, Inspect-Instanz)
        id: workbench
        if: steps.setup.outputs.configured == 'true'
        uses: ./.github/actions/claude-workbench

      # Zwei Bremsen mit unterschiedlichem Meterstab (Issue #993):
      #   1. Fixup-Runden-Deckel — die frühe, sinnvolle Bremse: Nach MAX_FIXUP_ROUNDS
      #      Runden ohne grünes Review geht die nächste Runde an den Menschen
      #      (ai:needs-human + Entscheidungs-Kommentar). Runden skalieren die Kosten
      #      (#932: 10 Review- + 4 Fixup-Läufe, 34,5 Mio Token, keine Bremse feuerte).
      #   2. Commit-Guard (> 10) — bleibt als grobe Ausfallsicherung: Commits ≠ Runden,
      #      aber ein PR mit > 10 Commits ist in jedem Fall ein Fall für den Menschen.
      - name: Stop-Guard (Fixup-Runden-Deckel / > 10 PR-Commits)
        id: stop-guard
        if: steps.setup.outputs.configured == 'true' && steps.consume.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # ── Bremse 1: Fixup-Runden-Deckel (Issue #993) ─────────────────────────
          # MAX_FIXUP_ROUNDS kommt aus dem Job-env (der eine Konfigurationsort).
          # Läuft NACH dem Start-Konsum (steps.consume): ai:needs-fixup klebt nicht
          # mehr, der Loop stirbt also natürlich, wenn wir hier stoppen. Trotzdem
          # ai:needs-human setzen — sonst parkt der PR stumm. Kommentar VOR Label
          # (Erklärungs-Gat, Muster aus dem resolve-Step).
          if ! ROUNDS="$(bash .github/scripts/fixup-rounds.sh count --repo "$REPO" --pr "$PR" --max "$MAX_FIXUP_ROUNDS")"; then
            echo "stop=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR" --repo "$REPO" --body "🛑 Stop-Guard: Fixup-Runden ließen sich nicht zählen (Timeline-Lesefehler) – fail-closed, bitte manuell prüfen." 2>/dev/null || true
            exit 0
          fi
          if [ "$(printf '%s\n' "$ROUNDS" | sed -n 's/^stop=//p')" = "true" ]; then
            N="$(printf '%s\n' "$ROUNDS" | sed -n 's/^count=//p')"
            M="$(printf '%s\n' "$ROUNDS" | sed -n 's/^max=//p')"
            echo "stop=true" >> "$GITHUB_OUTPUT"
            # Offene Findings der letzten Review-Runde: jüngster ai-review-Sammel-
            # kommentar (bewusst OHNE --since — hier zählt der letzte Stand, nicht
            # dieser Lauf). lookup ist nie fatal; ohne Fund zeigt der Kommentar
            # einen Hinweis statt eines toten Links.
            GUARD="$(bash .github/scripts/needs-human-explain.sh lookup --repo "$REPO" --pr "$PR" --mode review || true)"
            GUARD_STATUS="$(printf '%s\n' "$GUARD" | sed -n 's/^status=//p')"
            GUARD_LINK="$(printf '%s\n' "$GUARD" | sed -n 's/^permalink=//p')"
            GUARD_FINDINGS="$(printf '%s\n' "$GUARD" | sed -n 's/^findings=//p')"
            {
              printf '%s\n\n' "🛑 **Fixup-Runden-Deckel erreicht — an den Menschen übergeben**"
              printf '%s\n\n' "**Warum:** Dies wäre Fixup-Runde ${N} von maximal ${M}. Die Review→Fixup-Schleife hat zuvor ${M} Runden ohne grünes Review durchlaufen — jede weitere Runde kostet erfahrungsgemäß 2–4 Mio Token und eine halbe Stunde Wanduhr, ohne Konvergenz-Garantie (Ausreißer #932: 10 Review- + 4 Fixup-Läufe, 34,5 Mio Token)."
              if [ "$GUARD_STATUS" = "found" ]; then
                printf '%s\n\n' "**Offene Findings der letzten Review-Runde:** ${GUARD_FINDINGS:-—}"
                printf '%s\n\n' "**Letzter Review (Details):** ${GUARD_LINK}"
              else
                printf '%s\n\n' "**Offene Findings der letzten Review-Runde:** siehe letzten ai-review-Kommentar am PR (hier nicht verlinkbar)."
              fi
              printf '%s\n\n' "**Verbrauch:** Kosten-Daten werden erst nach Merge versiegelt (\`.costs/\`) — zum Laufzeitpunkt liegen keine verifizierten Zahlen vor."
              printf '%s\n' "**Entscheidung — bitte genau eine Option wählen:**"
              printf '%s\n' "- [ ] **F.1 — Findings selbst fixen:** Label \`ai:needs-human\` entfernen, Fixes committen, dann \`ai:needs-review\` setzen"
              printf '%s\n' "- [ ] **F.2 — Spec/PR neu zuschneiden:** PR-Beschreibung/Spec präzisieren, dann \`ai:needs-human\` entfernen und \`ai:needs-fixup\` setzen (Runde ${N} läuft dann bewusst und zuletzt)"
              printf '%s\n' "- [ ] **F.3 — Verwerfen:** PR schließen und Label \`ai:needs-human\` entfernen"
            } > /tmp/needs-human-body.md
            bash .github/scripts/needs-human-explain.sh post --repo "$REPO" --pr "$PR" --body-file /tmp/needs-human-body.md
            # --expect none: Der Start-Konsum hat eben alle Pipeline-Labels
            # entfernt; klebt hier doch etwas, regiert der neuere Zustand (dann
            # bewusst OHNE ai:needs-human lassen und nur warnen).
            if ! OUT="$(bash .github/scripts/label-transition.sh \
              --repo "$REPO" --pr "$PR" \
              --set ai:needs-human --expect none)"; then
              echo "::error title=⚠️ Deckel: Label-Übergabe fehlgeschlagen::ai:needs-human konnte nicht gesetzt werden (Details: letzte gh-Fehlerzeile im Log). Loop ist trotzdem gestoppt (kein ai:needs-fixup mehr am PR) — bitte manuell labeln."
            else
              echo "::warning title=🛑 Fixup-Runden-Deckel::PR #${PR} — Runde ${N} > Deckel ${M}, ai:needs-human gesetzt, keine weitere automatische Runde."
            fi
            exit 0
          fi

          # ── Bremse 2: Commit-Guard (grobe Ausfallsicherung, unverändert) ──────
          if ! commits="$(gh pr view "$PR" --repo "$REPO" --json commits --jq '.commits | length' 2>/dev/null)"; then
            echo "stop=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR" --repo "$REPO" --body "🛑 Stop-Guard: gh-API nicht erreichbar – fail-closed." 2>/dev/null || true
            exit 0
          fi
          if [ "${commits:-0}" -gt 10 ]; then
            echo "stop=true" >> "$GITHUB_OUTPUT"
            gh pr comment "$PR" --repo "$REPO" --body "🛑 **Stop-Guard: Fixup-Loop gestoppt** (${commits} Commits > 10). Bitte manuell prüfen." 2>/dev/null || true
            exit 0
          fi
          echo "stop=false" >> "$GITHUB_OUTPUT"

      # Kein Supersede-Check mehr: Die globale Phasen-Serialisierung (statische
      # concurrency-Gruppe) lässt Fixup-Läufe desselben Branches nie parallel laufen, und der
      # precheck dedupliziert über den Label-IST-Zustand. Ein Lauf-Listen-Guard würde hier nur
      # noch queued Nachfolger finden und das FALSCHE Skip auslösen.

      - name: HEAD vor Claude merken (Fortschritts-Baseline)
        id: head-before
        if: steps.setup.outputs.configured == 'true' && steps.stop-guard.outputs.stop != 'true' && steps.consume.outputs.proceed == 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Review-Baseline für das already-done-Verdict (Issue #961): id + updated_at
      # des letzten ai-review-Sammelkommentars JETZT merken, am Laufende erneut
      # lesen und vergleichen. Der Sammelkommentar wird über Runden FORTGESCHRIEBEN
      # (eine Kommentar-ID, wechselndes updatedAt) — nur die ID zu merken wäre blind
      # gegen in-place Edits. Bewusst OHNE --since: Die Baseline braucht den
      # ungefilterten Ist-Zustand, nicht die Kommentare dieses Laufes. Als eigener
      # Step analog head-before: Steps teilen keine env, nur outputs.
      - name: Review-Kommentar vor Claude merken (Delta-Baseline für already-done)
        id: review-before
        if: steps.setup.outputs.configured == 'true' && steps.stop-guard.outputs.stop != 'true' && steps.consume.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          OUT="$(bash .github/scripts/needs-human-explain.sh lookup --repo "$GITHUB_REPOSITORY" --pr "$PR" --mode review || true)"
          echo "id=$(printf '%s\n' "$OUT" | sed -n 's/^id=//p')" >> "$GITHUB_OUTPUT"
          echo "updated=$(printf '%s\n' "$OUT" | sed -n 's/^updated_at=//p')" >> "$GITHUB_OUTPUT"

      - name: Findings umsetzen via Claude
        id: claude
        if: steps.setup.outputs.configured == 'true' && steps.stop-guard.outputs.stop != 'true' && steps.consume.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Prompt liegt kanonisch in .github/prompts/fixup.md (Quelle fuer CI). Snippet-Platzhalter
          # (#ISSUE_NR, #PHASE, #MEMORY_STATUS) werden erst NACH dem Anhaengen der Memory-Snippets
          # substituiert.
          sed -e "s/#PR_NR/${{ github.event.pull_request.number }}/g" \
              -e "s/SOFT_DEADLINE/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" \
              .github/prompts/fixup.md > /tmp/claude-prompt.txt

          # Memory-Snippets anhängen (restauriert + schreibt)
          cat .github/prompts/memory-read.md >> /tmp/claude-prompt.txt
          cat .github/prompts/memory-write.md >> /tmp/claude-prompt.txt
          # #ISSUE_NR kommt aus memory-write.md (Dateiname der Phasen-Notiz). Ohne diese Zeile
          # schrieb der Fixup seine Notiz in eine Datei mit LITERALEM Platzhalter im Namen.
          sed -i "s/#ISSUE_NR/${{ steps.setup.outputs.issue-number }}/g" /tmp/claude-prompt.txt
          sed -i "s/#PHASE/fixup/g" /tmp/claude-prompt.txt
          sed -i "s/#MEMORY_STATUS/${{ steps.setup.outputs.memory-status-text }}/g" /tmp/claude-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Token & Kosten erfassen
        # always(): Auch ein abgebrochener Lauf hat Token verbraucht — gerade teure
        # Fehlläufe gehören in die Baseline, sonst sieht die alte Pipeline zu günstig aus.
        # issue-number löst den PR über closingIssuesReferences auf das Ticket auf, damit
        # alle Phasen EINES Tickets in derselben .costs-Datei landen.
        # phase bleibt `fixup` (nicht `implement`): Die Kostendatei ist eine Messreihe —
        # ein umbenannter Phasen-Schlüssel würde die Baseline gegen den alten Workflow
        # unvergleichbar machen, genau die Messung, für die sie angelegt wurde.
        if: always() && steps.setup.outputs.configured == 'true'
        uses: ./.github/actions/record-cost
        with:
          issue: ${{ steps.setup.outputs.issue-number || github.event.pull_request.number }}
          phase: fixup
          since-epoch: ${{ steps.starttime.outputs.epoch }}
          provider: ${{ steps.setup.outputs.llm-provider }}

      - name: Issue-Storage sichern (State-Branch)
        # Siehe implement-Job — gleiche Mechanik (ADR 0006), Phase fixup.
        if: always() && steps.setup.outputs.configured == 'true'
        uses: ./.github/actions/issue-state-save
        with:
          issue-number: ${{ steps.setup.outputs.issue-number || github.event.pull_request.number }}
          phase: fixup

      - name: Label-Post-Assertion (Labels via App-Token force-setzen)
        id: label-post
        # B1: Label-Transition auch bei Claude failure/cancelled — sonst bleibt der PR bei einem
        # Crash/Timeout dauerhaft auf ai:needs-fixup kleben (kein Re-Arm, keine Eskalation).
        # Analog 05-claude-pr-review.yml (dort success|failure; hier zusaetzlich cancelled wg.
        # timeout-minutes-Backstop). Skip-Reasons (stop-guard) liefern outcome=skipped und
        # fallen hier korrekt raus.
        if: always() && steps.setup.outputs.configured == 'true' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure' || steps.claude.outcome == 'cancelled')
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          SINCE_EPOCH: ${{ steps.starttime.outputs.since_epoch }}
        run: |
          # Verdict-Kanal: Datei primär (/tmp/claude-verdict, per Bash geschrieben —
          # robuster als Log-Parsing, vgl. PR #524/#530), Log-Grep als Übergangs-Fallback.
          # Nur `needs-human` ist hier verbindlich; Fortschritt entscheidet HEAD-Bewegung.
          verdict=""
          if [ -f /tmp/claude-verdict ]; then
            verdict="$(tr -d -c 'A-Za-z0-9-' < /tmp/claude-verdict)"
          fi
          if [ -z "$verdict" ] && [ -f /tmp/claude-output.log ]; then
            verdict="$(grep 'VERDICT:' /tmp/claude-output.log | tail -1 | sed -E 's/^.*VERDICT:[[:space:]]*//' | tr -d -c 'A-Za-z0-9-' || true)"
          fi
          echo "Claude-Verdict: '${verdict:-keins}'"

          # Erklärungs-Gate: Nur Kommentare dieses Laufes gelten als Erklärung
          # für ai:needs-human — keine alten Marker referenzieren (#842).
          # GNU-date (-d @epoch): Läuft nur auf dem Ubuntu-Runner.
          SINCE_ISO="$(date -u -d "@${SINCE_EPOCH:-0}" +%Y-%m-%dT%H:%M:%SZ)"

          # Fortschritt = hat HEAD sich in DIESEM Lauf bewegt? Robust gg. amend/reset/force-push
          # (jede HEAD-Bewegung = Arbeit; keine Bewegung = nichts getan) und self-contained
          # (lokales Repo, keine API-/Marker-Abhaengigkeit). Das alte REVIEW_TS-Konstrukt fiel
          # bei fehlendem Review-Marker auf Total-Commits zurueck und meldete Fortschritt, wo
          # keiner war -> Review<->Fixup-Endlosloop (PR #524).
          sha_before="${{ steps.head-before.outputs.sha }}"
          sha_after="$(git rev-parse HEAD)"
          echo "HEAD vor Claude: ${sha_before:-?} | nach Claude: ${sha_after:-?}"
          ARTIFACTS_OK="false"
          if [ -n "$sha_before" ] && [ "$sha_after" != "$sha_before" ]; then
            ARTIFACTS_OK="true"
          fi

          # EINE atomare Transition je Ausgangspfad statt 3× remove + add (PR #890):
          # label-transition.sh ersetzt den gesamten Pipeline-Bestand in EINEM API-Call —
          # auch ai:reviewed ist damit immer mit abgeräumt (stale Done-Label könnte das
          # Gate sonst vorzeitig mergen lassen). --expect none: Dieser Lauf hat seinen
          # Trigger im Start-Konsum entfernt; zwischenzeitliche Schreiben anderer Akteure
          # (Autolabeler, Gate) verwerfen diesen Write — der neuere Zustand regiert.
          # Retries (Issue #613, Backoff 1s/2s/4s) leben IM Skript.
          apply_transition() { # $1 = Ziel-Labels (Komma-liste); Return 0=ok, 1=fehlschlagen, 2=Guard-Verwurf
            if ! OUT="$(bash .github/scripts/label-transition.sh \
                --repo "$GITHUB_REPOSITORY" --pr "$PR" --set "$1" --expect none)"; then
              echo "::error::Label-Transition zu '$1' endgültig fehlgeschlagen"
              return 1
            fi
            t_applied="$(printf '%s\n' "$OUT" | sed -n 's/^applied=//p')"
            t_state="$(printf '%s\n' "$OUT" | sed -n 's/^state=//p')"
            t_reason="$(printf '%s\n' "$OUT" | sed -n 's/^reason=//p')"
            if [ "$t_state" = "read-failed" ]; then
              echo "::error::Label-Transition zu '$1': IST-Zustand unlesbar (${t_reason:-API?}) — nichts geschrieben"
              return 1
            fi
            if [ "$t_applied" != "true" ]; then
              echo "::warning title=⏭️ Label-Write verworfen::${t_reason:-Guard}. Ziel '$1' NICHT gesetzt — der neuere Zustand regiert."
              return 2
            fi
            return 0
          }

          # B1: Claude abgestuerzt/abgebrochen (failure/cancelled) — kein vertrauenswuerdiges
          # Verdict, HEAD-Fortschritt nicht aussagekraeftig (evtl. mittendrin abgebrochen).
          # Terminal ai:needs-human + Kommentar, KEINE Re-Armierung: ein wiederholt abstuerzender
          # Claude wuerde sonst eine Re-Arm-Schleife erzeugen. Review macht analog den Safe-Default.
          # AUSNAHME seit #960: Ein als TRANSIENT klassifizierter Crash (API 500/429/402,
          # 1313 Fair Usage, Network error) wird GENAU EINMAL automatisch re-armt — der
          # Mensch bekam vorher eine Checkliste, deren einziger Schritt genau das war.
          # Exactly-once-Sicherung: Marker-Kommentar <!-- ai-transient-rearm -->; klebt er
          # als letzter Kommentar (zweiter transienter Crash in Folge), wird geparkt.
          if [ "$OUTCOME" != "success" ]; then
            # Erklärungs-Gate: Erst der Kommentar mit echten Fakten (Run-Link,
            # HEADs, Log-Auszug — die Crash-Ursache steht im Log, z.B. 402
            # Credits/1313 Fair Usage), DANN das Label. Der alte generische Text
            # erklärte den Mechanismus statt die Ursache und wurde bei Re-Runs
            # wortidentisch doppelt gepostet (#870).
            RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            DETECT="$(bash .github/scripts/transient-api-error.sh detect --log /tmp/claude-output.log)"
            T_IS="$(printf '%s\n' "$DETECT" | sed -n 's/^transient=//p')"
            T_CAUSE="$(printf '%s\n' "$DETECT" | sed -n 's/^cause=//p')"
            REPEAT_BLOCK=""
            if [ "$T_IS" = "true" ]; then
              MARK="$(bash .github/scripts/transient-api-error.sh marker --repo "$GITHUB_REPOSITORY" --pr "$PR")"
              M_STATE="$(printf '%s\n' "$MARK" | sed -n 's/^marker=//p')"
              M_PREV_RUN="$(printf '%s\n' "$MARK" | sed -n 's/^prev_run=//p')"
              M_PREV_CAUSE="$(printf '%s\n' "$MARK" | sed -n 's/^prev_cause=//p')"
              if [ "$M_STATE" != "present" ]; then
                # Re-Arm (1/1): Marker-Kommentar mit Ursache + Neustart-Hinweis, DANN
                # ai:needs-fixup setzen (nicht remove+add) — das Setzen loest
                # pull_request[labeled] -> precheck -> Fixup erneut aus; die
                # Concurrency-Gruppe claude-implement serialisiert beide Laeufe.
                # Der HTML-Kommentar-Marker ist in der PR-Ansicht unsichtbar (Maschinen-
                # Marker); die menschenlesbare Aussage steht im Text darueber.
                {
                  printf '%s\n\n' "<!-- ai-transient-rearm -->"
                  printf '%s\n\n' "🔁 **Fixup #${PR}: transienter Crash — automatisch 1× neu gestartet**"
                  printf '%s\n\n' "**Ursache:** \`${T_CAUSE}\`"
                  printf '%s\n\n' "Gestoppter Lauf: ${RUN_URL} — der Fixup wurde über \`ai:needs-fixup\` automatisch 1× neu gestartet. Tritt derselbe transiente Fehler erneut auf, parkt das Ticket beim Menschen (kein zweiter Neustart)."
                } > /tmp/transient-rearm-body.md
                bash .github/scripts/needs-human-explain.sh post --repo "$GITHUB_REPOSITORY" --pr "$PR" --body-file /tmp/transient-rearm-body.md
                rc=0
                apply_transition "ai:needs-fixup" || rc=$?
                if [ "$rc" -eq 2 ]; then
                  echo "stuck=true" >> "$GITHUB_OUTPUT"; echo "stuck_reason=superseded" >> "$GITHUB_OUTPUT"; exit 0
                fi
                if [ "$rc" -eq 1 ]; then exit 1; fi
                echo "::notice::Transienter Crash (${T_CAUSE}) -> ai:needs-fixup (automatisch 1× neu gestartet)."
                exit 0
              fi
              # Marker klebt bereits: zweiter transienter Crash in Folge -> parken, und der
              # Park-Kommentar nennt BEIDE Laeufe und Ursachen (s.u. REPEAT_BLOCK).
              REPEAT_BLOCK="$(printf '%s\n%s\n%s\n\n%s' \
                "🔁 **Erneut transienter Crash nach automatischem Neustart — beim Menschen geparkt**" \
                "- Re-Arm-Lauf (gestoppt): ${M_PREV_RUN:-(Run-Link nicht extrahierbar)} — Ursache: \`${M_PREV_CAUSE:-unbekannt}\`" \
                "- Dieser Lauf (gestoppt): ${RUN_URL} — Ursache: \`${T_CAUSE}\`" \
                "Zwei transiente Crashes hintereinander sind kein Zufall mehr — kein zweiter automatischer Neustart.")"
            fi
            {
              printf '%s\n\n' "🛑 **Fixup #${PR}: Claude-Schritt \`${OUTCOME}\` (Crash)**"
              printf '%s\n\n' "**Warum:** Kein Verdict, HEAD-Fortschritt nach Absturz/Abbruch nicht vertrauenswuerdig — die KI kann hier nicht alleine weiterarbeiten."
              printf '%s\n\n' "**Diagnose:** Step-Outcome \`${OUTCOME}\` · HEAD vor Claude: \`${sha_before:-?}\` · nach Claude: \`${sha_after:-?}\` · Run: ${RUN_URL}"
              printf '%s\n' "<details><summary>Log-Auszug (letzte 25 Zeilen von /tmp/claude-output.log)</summary>"
              printf '\n%s\n' '```'
              bash .github/scripts/needs-human-explain.sh logtail
              printf '%s\n' '```'
              printf '%s\n\n' "</details>"
              # Wiederholter transienter Crash: BEIDE Laeufe/Ursachen nennen (#960) —
              # nur der aktuelle Lauf zu zeigen wuerde den automatischen Neustart verstecken.
              [ -n "$REPEAT_BLOCK" ] && printf '%s\n\n' "$REPEAT_BLOCK"
              printf '%s\n' "**Was du als Mensch beitragen/entscheiden solltest:**"
              printf '%s\n' "- [ ] 1. Crash-Ursache im Log-Auszug pruefen: transienter API-Fehler (\`ai:needs-fixup\` neu setzen) oder echter Blocker?"
              printf '%s\n' "- [ ] 2. Bei transientem Fehler: \`ai:needs-fixup\` setzen → loest Fixup neu aus"
              printf '%s\n' "- [ ] 3. Bei echtem Blocker: manuell pruefen und entscheiden"
              printf '%s\n' "- [ ] 4. Label \`ai:needs-human\` entfernen (nach Klärung)"
            } > /tmp/needs-human-body.md
            bash .github/scripts/needs-human-explain.sh post --repo "$GITHUB_REPOSITORY" --pr "$PR" --body-file /tmp/needs-human-body.md
            rc=0
            apply_transition "ai:needs-human" || rc=$?
            if [ "$rc" -eq 2 ]; then
              echo "stuck=true" >> "$GITHUB_OUTPUT"; echo "stuck_reason=superseded" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ "$rc" -eq 1 ]; then exit 1; fi
            echo "::warning::Claude-Schritt '${OUTCOME}' -> ai:needs-human (keine Re-Armierung, Mensch prueft)."
            echo "stuck=true" >> "$GITHUB_OUTPUT"
            echo "stuck_reason=crash" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # B2: Verdict ist beratend — EINZIG `needs-human` ist verbindlich (terminal). Fortschritt
          # entscheidet der workflow ausschliesslich ueber HEAD-Bewegung (Commits = Ground Truth),
          # niemals ueber ein `fixup-complete`-Verdict. Vgl. Prompt-Vertrag (VERDICT-Abschnitt).
          if [ "$verdict" = "needs-human" ]; then
            # Claude hat erkannt: verbleibende Findings sind Entscheidungs-Findings, die ein Mensch
            # treffen muss (kein automatisierbarer Fix). Done-Label + terminal an Mensch — kein
            # Re-Arm, kein Loop.
            #
            # Erklärungs-Gate: lookup verifiziert den ai-fixup-decisions-Kommentar
            # DIESES Laufes und liefert Permalink + Finding-Titel (Vorbild #844).
            # Fehlt er, postet der Workflow selbst eine Diagnose statt einen
            # Verweis ins Leere zu hinterlassen. Kommentar vor Label-Setzen.
            GUARD="$(bash .github/scripts/needs-human-explain.sh lookup --repo "$GITHUB_REPOSITORY" --pr "$PR" --mode decisions --since "$SINCE_ISO")"
            GUARD_STATUS="$(printf '%s\n' "$GUARD" | sed -n 's/^status=//p')"
            GUARD_LINK="$(printf '%s\n' "$GUARD" | sed -n 's/^permalink=//p')"
            GUARD_FINDINGS="$(printf '%s\n' "$GUARD" | sed -n 's/^findings=//p')"
            {
              printf '%s\n\n' "⏸️ **Wartet auf menschliche Entscheidung (Fixup-Entscheidung)**"
              if [ "$GUARD_STATUS" = "found" ]; then
                printf '%s\n\n' "**Warum:** Verbleibende Findings sind nicht automatisierbar (Architektur-/Produkt-/Designentscheidung) — die KI kommt hier nicht alleine weiter."
                [ -n "$GUARD_FINDINGS" ] && printf '%s\n\n' "**Entscheidungs-Findings:** ${GUARD_FINDINGS}"
                printf '%s\n\n' "**Erklärung (Was/Wo/Optionen/Empfehlung):** ${GUARD_LINK}"
              else
                RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                printf '%s\n\n' "**Warum:** Verdict \`needs-human\`, aber der Kommentar mit Marker \`ai-fixup-decisions\` fehlt in diesem Lauf — die Begründung ist nicht verifizierbar."
                printf '%s\n\n' "**Diagnose:** Run: ${RUN_URL} — Claudes letzte Ausgabezeilen können die Findings nennen."
                printf '%s\n' "<details><summary>Log-Auszug (letzte 25 Zeilen von /tmp/claude-output.log)</summary>"
                printf '\n%s\n' '```'
                bash .github/scripts/needs-human-explain.sh logtail
                printf '%s\n' '```'
                printf '%s\n\n' "</details>"
              fi
              printf '%s\n' "**Was du als Mensch beitragen/entscheiden solltest:**"
              if [ "$GUARD_STATUS" = "found" ]; then
                printf '%s\n' "- [ ] 1. Entscheidungs-Findings durchgehen (Erklärung oben verlinkt)"
              else
                # Kein toter Verweis: In diesem Zweig existiert KEIN Link — der
                # Marker-Kommentar fehlt (PR #903: Checkliste verwies ins Leere).
                printf '%s\n' "- [ ] 1. Findings aus dem Log-Auszug ableiten — Claude hat den Entscheidungs-Kommentar (Marker \`ai-fixup-decisions\`) in diesem Lauf NICHT gepostet"
              fi
              printf '%s\n' "- [ ] 2. Entscheidung treffen (Code anpassen / akzeptieren)"
              printf '%s\n' "- [ ] 3. Label \`ai:needs-human\` entfernen"
              printf '%s\n' "- [ ] 4. Label \`ai:needs-review\` setzen → loest erneuten Review aus"
            } > /tmp/needs-human-body.md
            bash .github/scripts/needs-human-explain.sh post --repo "$GITHUB_REPOSITORY" --pr "$PR" --body-file /tmp/needs-human-body.md
            rc=0
            apply_transition "ai:needs-human" || rc=$?
            if [ "$rc" -eq 2 ]; then
              echo "stuck=true" >> "$GITHUB_OUTPUT"; echo "stuck_reason=superseded" >> "$GITHUB_OUTPUT"
            elif [ "$rc" -eq 1 ]; then
              exit 1
            else
              echo "::notice::Verdict needs-human -> Label gesetzt: ai:needs-human (wartet auf Mensch)."
              echo "stuck=true" >> "$GITHUB_OUTPUT"
              echo "stuck_reason=needs-human" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$ARTIFACTS_OK" = "true" ]; then
            # Fortschritt -> an Review uebergeben. Konvergiert via Stop-Guard
            # (>10 Commits), falls Review nie gruen wird.
            rc=0
            apply_transition "ai:needs-review" || rc=$?
            if [ "$rc" -eq 2 ]; then
              echo "stuck=true" >> "$GITHUB_OUTPUT"; echo "stuck_reason=superseded" >> "$GITHUB_OUTPUT"
            elif [ "$rc" -eq 1 ]; then
              exit 1
            else
              echo "::notice::Fortschritt erkannt (HEAD bewegt) -> Label gesetzt: ai:needs-review"
              echo "stuck=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # KEIN Fortschritt (HEAD unverändert). Issue #961: Bevor terminal geparkt wird,
            # ist Claudes already-done-Verdict auf Glaubwürdigkeit zu prüfen — der Review-
            # Sammelkommentar muss seit Laufbeginn NEUE Findings geliefert haben (id/
            # updated_at-Delta gegen die review-before-Baseline). fixup-verdict.sh kapselt
            # die gesamte Tabelle; ohne already-done-Verdict fällt sie unverändert auf
            # no-progress — der klassische Loop-Schutz-Pfad bleibt exakt erhalten (AK4).
            REVIEW_NOW="$(bash .github/scripts/needs-human-explain.sh lookup --repo "$GITHUB_REPOSITORY" --pr "$PR" --mode review || true)"
            EVAL="$(bash .github/scripts/fixup-verdict.sh evaluate \
              --verdict "$verdict" --head-progress "$ARTIFACTS_OK" \
              --review-id-before "${{ steps.review-before.outputs.id }}" \
              --review-updated-before "${{ steps.review-before.outputs.updated }}" \
              --review-id-after "$(printf '%s\n' "$REVIEW_NOW" | sed -n 's/^id=//p')" \
              --review-updated-after "$(printf '%s\n' "$REVIEW_NOW" | sed -n 's/^updated_at=//p')")"
            EVAL_TARGET="$(printf '%s\n' "$EVAL" | sed -n 's/^target=//p')"
            EVAL_REASON="$(printf '%s\n' "$EVAL" | sed -n 's/^reason=//p')"

            if [ "$EVAL_TARGET" = "ai:needs-review" ]; then
              # already-done + Review-Delta (AK2): fertig gemeldet, glaubwürdig — zurück an
              # den Review. Der bestätigt den Zustand oder widerspricht (dann setzt er
              # ai:needs-fixup und der nächste No-Progress-Lauf fällt unten wieder korrekt
              # in die Loop-Sicherung). Kommentar OHNE Task-Checkliste — es gibt nichts
              # menschlich zu entscheiden; Claudes Begründung (Findings → Fix-Commits)
              # steht im Log-Fenster vor der VERDICT:-Zeile, logtail schneidet genau das aus.
              {
                printf '%s\n\n' "✅ **Fixup #${PR}: bereits erledigt — erneuter Review läuft**"
                printf '%s\n\n' "**Warum:** Claude meldet \`already-done\` (alle Findings nachweislich in früheren Runden gelöst, kein Commit nötig), und seit Laufbeginn hat der Review neue Findings geliefert (Kommentar-Delta erkannt). Der erneute Review bestätigt den Zustand — oder meldet neue Findings zurück."
                printf '%s\n' "<details><summary>Claudes Begründung (Log-Auszug: Findings → Fix-Commits)</summary>"
                printf '\n%s\n' '```'
                bash .github/scripts/needs-human-explain.sh logtail
                printf '%s\n' '```'
                printf '%s\n\n' "</details>"
              } > /tmp/already-done-body.md
              bash .github/scripts/needs-human-explain.sh post --repo "$GITHUB_REPOSITORY" --pr "$PR" --body-file /tmp/already-done-body.md
              rc=0
              apply_transition "ai:needs-review" || rc=$?
              if [ "$rc" -eq 2 ]; then
                echo "stuck=true" >> "$GITHUB_OUTPUT"; echo "stuck_reason=superseded" >> "$GITHUB_OUTPUT"
              elif [ "$rc" -eq 1 ]; then
                exit 1
              else
                echo "::notice::already-done mit Review-Delta -> Label gesetzt: ai:needs-review (erneuter Review läuft)."
                echo "stuck=false" >> "$GITHUB_OUTPUT"
              fi
            else
              # KEIN Fortschritt und kein klares needs-human-Verdict -> NICHT erneut triggern (kappt
              # sowohl Fixup<->Fixup- als auch Review<->Fixup-Endlosloop). Terminal an Mensch
              # via ai:needs-human + Kommentar.
              #
              # Erklärungs-Gate: Erst schauen, ob Claude in DIESEM Lauf einen
              # ai-fixup-decisions-Kommentar gepostet hat — in #842 existierte er
              # 25 s vor dem Label, wurde aber nicht referenziert. Sonst Fakten
              # statt Vermutung (das alte "vermutlich" war geraten): Review-
              # Kommentar verlinken + Claudes eigene Begründung aus dem Log.
              DEC_GUARD="$(bash .github/scripts/needs-human-explain.sh lookup --repo "$GITHUB_REPOSITORY" --pr "$PR" --mode decisions --since "$SINCE_ISO")"
              DEC_STATUS="$(printf '%s\n' "$DEC_GUARD" | sed -n 's/^status=//p')"
              DEC_LINK="$(printf '%s\n' "$DEC_GUARD" | sed -n 's/^permalink=//p')"
              DEC_FINDINGS="$(printf '%s\n' "$DEC_GUARD" | sed -n 's/^findings=//p')"
              {
                printf '%s\n\n' "🛑 **Fixup #${PR} ohne Fortschritt (Kein neuer Commit)**"
                if [ "$DEC_STATUS" = "found" ]; then
                  printf '%s\n\n' "**Warum:** Kein neuer Commit in diesem Lauf (HEAD unverändert: \`${sha_before}\` → \`${sha_after}\`). Claude hat den Block als Entscheidungs-Finding markiert:"
                  [ -n "$DEC_FINDINGS" ] && printf '%s\n\n' "**Entscheidungs-Findings:** ${DEC_FINDINGS}"
                  printf '%s\n\n' "**Erklärung (Was/Wo/Optionen/Empfehlung):** ${DEC_LINK}"
                else
                  REVIEW_GUARD="$(bash .github/scripts/needs-human-explain.sh lookup --repo "$GITHUB_REPOSITORY" --pr "$PR" --mode review)"
                  REVIEW_LINK="$(printf '%s\n' "$REVIEW_GUARD" | sed -n 's/^permalink=//p')"
                  RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                  if [ "$EVAL_REASON" = "no-review-delta" ]; then
                    # AK3 — Ping-Pong-Schutz: already-done ist nur mit neuem Review-Delta
                    # glaubwürdig. Der Sammelkommentar ist unverändert, also parken statt
                    # Review→Fixup→already-done→… endlos durchzureichen.
                    printf '%s\n\n' "**Warum:** Verdict \`already-done\`, aber der Review-Sammelkommentar ist seit Laufbeginn unverändert (kein id/updated_at-Delta, keine neuen Findings) — Ping-Pong-Schutz (Issue #961): \`already-done\` darf nicht zwei Fixup-Runden in Folge durchreichen, ohne dass der Review dazwischen etwas gemeldet hat. Claudes Begründung steht im Log-Auszug unten."
                  else
                    printf '%s\n\n' "**Warum:** Kein neuer Commit in diesem Lauf (HEAD unverändert: \`${sha_before}\` → \`${sha_after}\`). Claudes eigene Begründung steht im Log-Auszug unten."
                  fi
                  [ -n "$REVIEW_LINK" ] && printf '%s\n\n' "**Offene Findings (Review-Kommentar):** ${REVIEW_LINK}"
                  printf '%s\n\n' "**Diagnose:** Run: ${RUN_URL}"
                  printf '%s\n' "<details><summary>Log-Auszug (letzte 25 Zeilen von /tmp/claude-output.log)</summary>"
                  printf '\n%s\n' '```'
                  bash .github/scripts/needs-human-explain.sh logtail
                  printf '%s\n' '```'
                  printf '%s\n\n' "</details>"
                fi
                printf '%s\n' "**Was du als Mensch beitragen/entscheiden solltest:**"
                if [ "$DEC_STATUS" = "found" ]; then
                  printf '%s\n' "- [ ] 1. Begründung/Findings pruefen (oben verlinkt) — nicht-automatisierbares Finding?"
                else
                  # Kein toter Verweis: Entscheidungs-Kommentar fehlt in diesem Lauf —
                  # Review-Kommentar (falls verlinkt) und Log-Auszug sind die Quelle.
                  printf '%s\n' "- [ ] 1. Offene Findings pruefen: verlinkter Review-Kommentar / Log-Auszug — ein Entscheidungs-Kommentar fehlt in diesem Lauf"
                fi
                printf '%s\n' "- [ ] 2. Entscheidung treffen (Code anpassen / akzeptieren / Manuelles Fixup)"
                printf '%s\n' "- [ ] 3. Label \`ai:needs-human\` entfernen"
                printf '%s\n' "- [ ] 4. Label \`ai:needs-review\` setzen → loest erneuten Review aus"
              } > /tmp/needs-human-body.md
              bash .github/scripts/needs-human-explain.sh post --repo "$GITHUB_REPOSITORY" --pr "$PR" --body-file /tmp/needs-human-body.md
              rc=0
              apply_transition "ai:needs-human" || rc=$?
              if [ "$rc" -eq 2 ]; then
                echo "stuck=true" >> "$GITHUB_OUTPUT"; echo "stuck_reason=superseded" >> "$GITHUB_OUTPUT"
              elif [ "$rc" -eq 1 ]; then
                exit 1
              else
                echo "::warning::Kein Fixup-Fortschritt (HEAD unverändert) -> ai:needs-human, keine Re-Armierung, Mensch prüft."
                echo "stuck=true" >> "$GITHUB_OUTPUT"
                if [ "$EVAL_REASON" = "no-review-delta" ]; then
                  echo "stuck_reason=already-done-stale" >> "$GITHUB_OUTPUT"
                else
                  echo "stuck_reason=no-progress" >> "$GITHUB_OUTPUT"
                fi
              fi
            fi
          fi

      - name: Ergebnis zusammenfassen
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          STOP_GUARD: ${{ steps.stop-guard.outputs.stop }}
          STUCK: ${{ steps.label-post.outputs.stuck }}
          STUCK_REASON: ${{ steps.label-post.outputs.stuck_reason }}
          CONSUME_PROCEED: ${{ steps.consume.outputs.proceed }}
        run: |
          labels="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          # Eigener Arm fuer den Stop-Guard: ohne ihn faellt der gewollte Abbruch auf den
          # Fehler-Arm (OUTCOME ist leer, weil der claude-Step nie lief) und meldet ❌.
          # Der Stop-Guard ist ein GEWOLLTER Abbruch (Loop-Schutz, > 10 Commits) — er hat
          # bereits selbst kommentiert; hier gehoert eine Warnung hin, kein Fehler.
          # Dasselbe gilt fuer den No-Progress-Fall (STUCK): Claude lief, aber ohne Commit ->
          # bewusst keine Re-Armierung, Mensch prüft.
          if [ "$CONSUME_PROCEED" != "true" ]; then
            echo "::notice title=⏭️ Fixup verworfen::PR #${PR} — Trigger im Start-Konsum nicht mehr gültig, neuere Entscheidung regiert."
          elif [ "${STOP_GUARD:-false}" = "true" ]; then
            echo "::warning title=🛑 Fixup gestoppt::PR #${PR} — Stop-Guard (Loop-Schutz), bitte manuell prüfen"
          elif [ "${STUCK:-false}" = "true" ]; then
            # STUCK=true kommt von drei Pfaden (stuck_reason): Claude-Crash (OUTCOME!=success),
            # needs-human-Verdict ODER echtem No-Progress. Jeder braucht seine eigene Wahrheit:
            # beim Crash ist der HEAD-Fortschritt nicht vertrauenswuerdig, bei needs-human wartet
            # der PR auf eine menschliche Entscheidung (Claude kann trotzdem Commits gemacht
            # haben — "kein neuer Commit" waere hier falsch), bei No-Progress gab es wirklich keinen.
            case "${STUCK_REASON:-no-progress}" in
              crash)
                echo "::warning title=🛑 Fixup abgestürzt/abgebrochen::PR #${PR} — Claude-Schritt \`${OUTCOME:-unbekannt}\`, HEAD-Fortschritt nicht vertrauenswürdig, keine Re-Armierung, bitte manuell prüfen"
                ;;
              needs-human)
                echo "::notice title=⏸️ Fixup wartet auf Entscheidung::PR #${PR} — verbleibende Findings nicht automatisierbar (ai:needs-human gesetzt), bitte manuell prüfen"
                ;;
              already-done-stale)
                echo "::warning title=⏸️ Fixup already-done ohne Review-Delta::PR #${PR} — Verdict already-done, aber keine neuen Review-Findings seit Laufbeginn (Ping-Pong-Schutz, Issue #961), bitte manuell prüfen"
                ;;
              superseded)
                echo "::notice title=⏭️ Fixup abgelöst::PR #${PR} — Label-Zustand hat sich während des Laufs geändert, Schreib-Zugriff verworfen"
                ;;
              *)
                echo "::warning title=🛑 Fixup ohne Fortschritt::PR #${PR} — kein neuer Commit, keine Re-Armierung, bitte manuell prüfen"
                ;;
            esac
          elif [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Fixup erfolgreich::PR #${PR}"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Fixup abgebrochen"
          else
            echo "::error title=❌ Fixup fehlgeschlagen"
          fi
          {
            echo "### Fixup #${PR}"
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Labels: ${labels:-keine}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🩺 Z.AI Fair-Usage-Check (1313)
        # Rohausgabe des Claude-Laufs auf z.ai-Fehler 1313 (Fair Usage) durchsuchen
        # und Ergebnis als Annotation + Job-Summary sichtbar machen.
        if: always()
        uses: ./.github/actions/llm-fair-usage-check
