name: 4/7 Umsetzung

# Setzt ein Issue um, sobald es das Label "ai:ready" erhält UND bereits
# "ai:analyzed" trägt.
# Setzt **Claude Code** ein; Provider via `vars.LLM_PROVIDER` (zai|claude), aufgelöst in setup-claude.
#
# CONCURRENCY: Statische Gruppe pro Phase (globale Serialisierung, FIFO). Der `precheck`-Job
# prüft den LABEL-IST-ZUSTAND zur LAUFZEIT — queued Runs würden mit dem Label-Zustand zum
# TRIGGER-Zeitpunkt falsch wiederholen (Label inzwischen von einem anderen Lauf konsumiert).
# Ausnahme Continuation: Der Soft-Abort unten entfernt+re-addet ai:ready absichtlich — der
# Folgelauf sieht das Label dann (korrekt) noch vorhanden und setzt fort.

on:
  issues:
    types: [labeled]

concurrency:
  group: claude-implement
  cancel-in-progress: false
  # queue: max — OHNE dies hält GitHub pro Gruppe nur EINEN pending-Run: jeder neue
  # Run cancelt den wartenden (`queue: single` ist der Default). Mit statischem,
  # ticket-unabhängigem Key hätte ein Label-Burst über mehrere Tickets die
  # wartenden Läufe still verworfen — Trigger-Label klebt, kein Lauf, kein Notice.
  # `max` = bis zu 100 pending, FIFO. Unvereinbar mit cancel-in-progress: true.
  queue: max

jobs:
  precheck:
    # Unveränderliches Event-Faktum filtert hier (spart den Runner für No-op-Trigger — 03 feuert
    # auf JEDES `labeled` im Repo). Es gatet den precheck, nicht den Hauptjob: wird der precheck
    # übersprungen, ist sein Output leer und der Hauptjob fällt korrekt mit aus.
    if: ${{ github.event.label.name == 'ai:needs-impl' }}
    # Label-IST-Zustand zur Laufzeit: ai:ready + ai:analyzed müssen JETZT (nach dem Warten in
    # der globalen Phasen-Queue) noch am Issue kleben. Soll-Werte stehen zentral in
    # .github/scripts/check-phase-label.sh; hier wird nur der Phasen-Name übergeben.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # lokale Action + Skript auschecken
      issues: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Label-Pre-Check (IST-Zustand zur Laufzeit)
        id: check
        uses: ./.github/actions/check-phase-label
        with:
          phase: implement
          ticket: ${{ github.event.issue.number }}

  implement:
    needs: precheck
    # `result == 'failure'` ist FAIL-OPEN und beabsichtigt: das Skript fällt bei API-Fehlern
    # bewusst auf "laufen lassen" zurück, aber ein Fehler AUSSERHALB (Checkout, Timeout,
    # Runner-Ausfall) würde den Hauptjob sonst stumm überspringen — Trigger konsumiert, niemand
    # arbeitet, nichts re-armt. Ein übersprungener precheck (result == 'skipped', No-op-Trigger)
    # erfüllt keine der beiden Klauseln und lässt den Hauptjob korrekt entfallen.
    if: >-
      ${{ always()
          && (needs.precheck.outputs.proceed == 'true' || needs.precheck.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    permissions:
      contents: read
      id-token: write
      actions: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Startzeit merken (für weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 840))" >> "$GITHUB_OUTPUT"

      - name: Setup Claude Code (mit Memory-Load)
        id: setup
        uses: ./.github/actions/setup-claude
        with:
          needs-mcp: true
          browser-mcp: true
          tools-tier: full
          event-type: ${{ github.event_name }}
          ticket-ref: ${{ github.event.issue.number }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          model: ${{ vars.CLAUDE_MODEL_IMPLEMENT || 'opus' }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          zai-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}
          openrouter-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          tailscale-exit-node: ${{ vars.TAILSCALE_EXIT_NODE }}
          memory-load: 'true'
          expect-memory: 'true'

      # Kein Skip-Guard ("läuft bereits") mehr: Die globale Phasen-Serialisierung (statische
      # concurrency-Gruppe) lässt Läufe desselben Issues nie parallel laufen, und der precheck
      # dedupliziert über den Label-IST-Zustand. Ein Lauf-Listen-Guard würde hier nur noch
      # queued Nachfolger finden und das FALSCHE Skip auslösen.

      - name: Issue einem Menschen zuweisen (Best-Effort)
        if: steps.setup.outputs.configured == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
          ASSIGNEE: ${{ github.event.sender.type == 'User' && github.event.sender.login || (github.event.issue.user.type == 'User' && github.event.issue.user.login || '') }}
        run: |
          if [ -z "$ASSIGNEE" ]; then
            echo "::notice::Kein menschlicher Assignee ermittelbar."
            exit 0
          fi
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-assignee "$ASSIGNEE"

      - name: Doppel-Run-Guard (ready-PR existiert bereits)
        id: doppel-guard
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          # Ready-PR = nicht-draft PR zu diesem Issue. Helper mit closingRef- +
          # Body-Fallback (PR #585: "Closes NNN" ohne "#" sonst nicht gefunden).
          existing="$(bash .github/scripts/pr-for-issue.sh --repo "$GITHUB_REPOSITORY" \
            --issue "$ISSUE" --draft no --out count)"
          if [ "${existing:-0}" -gt 0 ]; then
            echo "::notice::Umsetzung übersprungen – ready-PR existiert bereits für Issue #$ISSUE."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: pnpm einrichten
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Node.js einrichten
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Abhängigkeiten installieren
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Git-Hooks installieren (lefthook)
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm exec lefthook install

      - name: Playwright-Cache (ms-playwright)
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Chromium installieren (Playwright)
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Server bauen (für Inspect no-watch)
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm --filter server build

      - name: Inspect-Instanz im Hintergrund starten
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        env:
          INSPECT_NO_WATCH: '1'
        run: |
          nohup ./ui-inspect.sh > /tmp/ui-inspect.log 2>&1 &
          echo "::notice::Inspect-Instanz gestartet (Hintergrund)"
          # Readiness-Check mit Timeout 120s: der Server startet ohne nodemon/Rebuild
          # (INSPECT_NO_WATCH + vorab gebautes dist) in Sekunden. Beim Fail das Log mitgeben.
          timeout=120
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if curl -s http://localhost:4174 >/dev/null 2>&1; then
              echo "::notice::✅ Inspect-Instanz bereit nach ${elapsed}s"
              exit 0
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "::error::Inspect-Instanz nicht innerhalb von ${timeout}s bereit (Timeout)"
          echo "::group::ui-inspect.log (letzte 60 Zeilen)"
          tail -n 60 /tmp/ui-inspect.log || true
          echo "::endgroup::"
          exit 1

      - name: Fortsetzungs-Stand prüfen (ai:continued)
        id: continued-before
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          already="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "ai:continued")' 2>/dev/null || echo false)"
          echo "already=${already:-false}" >> "$GITHUB_OUTPUT"

      - name: Umsetzung via Claude
        id: claude
        if: steps.setup.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          cat > /tmp/claude-prompt.txt << 'CLAUDE_EOF'
          #RESUME_HINT
          FOKUS: NUR Issue #ISSUE_NR. Nur die für die Akzeptanzkriterien notwendigen Dateien/Zeilen ändern, kein Refactoring am Rande. KEINE Abstecher. Token sparen: kurz, präzise, direkt.

          ⚠️ KI-UX-Block: Falls das Issue UX-Aspekte hat (KI-UX:END-Block im Issue-Body vorhanden), UX-Anforderungen aus diesem Block beachten.

          ABLAUF (STRIKT):
            1. SOFORT starten.
            2. Analyse lesen & schnell verifizieren (KEINE vollständige Re-Triage!):
               Akzeptanzkriterien aus BODY-BLOCK übernehmen (gh issue view #ISSUE_NR --json body -q .body).
               Prüfe NUR, ob die genannten Dateien noch existieren. Ampel 🔴 → NICHT umsetzen, ai:ready entfernen, begründet kommentieren und stoppen.
            3. Spec-Modus (Regelfall): vorhandenen DRAFT-PR auschecken
               (gh pr list --state open --draft --json number,headRefName,closingIssuesReferences,
               den mit Issue #ISSUE_NR; FALLS leer weil Spec "Closes NNN" ohne "#" schrieb:
               Fallback gh pr list --state open --draft --search "ISSUE_NR in:body" --json number,headRefName;
               dann git fetch origin && git switch <headRefName>).
               Dessen ROTE Tests GRÜN machen – Tests NICHT ändern (Gewaltenteilung).
               **Hinweis:** Obsolete Tests wurden bereits in der Spec-Stufe entfernt. Falls trotzdem Widerspruch auffällt → NICHT still ändern/löschen, sondern im PR-Body Abschnitt "Test-Pflege-Bedarf" mit Datei:Zeile + Begründung anlegen.
               Fallback (kein Draft-PR): eigenen Branch + Tests selbst schreiben.
            3.5. UI-ARBEITEN bei Frontend-Änderungen (frontend/src/**, frontend/e2e/**):
               a) KoliBri-First: passende Komponente via mcp__kolibri-mcp__search/fetch finden und mit ihren Properties/Features einsetzen.
                  Eigene Komponenten nur stylen/bauen, wenn KEINE KoliBri-Komponente passt.
                  Begründung im PR-Body (KoliBri = Shadow-Web-Components mit festem Styling).
               b) Layout: App läuft im Hintergrund auf http://localhost:4174; sichtbare Änderungen per Playwright-MCP bei 375px UND 1280px prüfen (Screenshot + A11y-Snapshot).
                  Layout-Brüche (horizontales Scrollen/Overflow) fixen.
            4. Code bis pnpm test grün, dann pnpm format + pnpm lint + pnpm knip.
               Bei Confirm-/Lösch-/Zerstör-Dialogen: docs/ux-pattern-sequential-confirmation.md anwenden – sequenzielle Ja/Nein-Schritte, striktes Fokus-Management beim Übergang (verbindliche A11y-Vorgabe).
               Bei sichtbarer UI: docs/mobile-ui-rules.md anwenden – Touch-Targets ≥44px, async Zustände entwerfen, Anti-Patterns meiden (Repo-Abstimmung im Doc beachten).
            5. Committen, Branch pushen. Im Spec-Modus Draft-PR review-bereit machen (gh pr ready <nr>), Beschreibung ergänzen.

          ⚠️ LABELS: KEINE Labels setzen! Workflow übernimmt das automatisch.

          VERDICT: GANZ AM ENDE GENAU EINE Zeile:
            - VERDICT: needs-review (Implementierung fertig + PR review-bereit)
            - VERDICT: not-ready (Partial – PR als Draft belassen, Folgelauf nötig)

          ZEITLIMIT: Soft-Deadline = SOFT_DEADLINE. Vor jedem Schritt: [ $(date +%s) -ge SOFT_DEADLINE ]. Bei OVER: aktuellen Stand committen+pushen, Turn beenden.

          Idempotenz: Draft-PR mit Closes #ISSUE_NR ist normaler Spec-Eingang – aufgreifen. Nicht-Draft-PR = Umsetzung schon gelaufen → Lauf beenden.
          CLAUDE_EOF

          # Memory-Snippets anhängen (Phase 4: restauriert + schreibt). Vor den seds, damit
          # deren Platzhalter (#ISSUE_NR/#PHASE/#MEMORY_STATUS) mit substituiert werden.
          cat .github/prompts/memory-read.md >> /tmp/claude-prompt.txt
          cat .github/prompts/memory-write.md >> /tmp/claude-prompt.txt

          sed -i "s/#ISSUE_NR/${{ github.event.issue.number }}/g" /tmp/claude-prompt.txt
          sed -i "s/#PHASE/implement/g" /tmp/claude-prompt.txt
          sed -i "s/#MEMORY_STATUS/${{ steps.setup.outputs.memory-status-text }}/g" /tmp/claude-prompt.txt
          # Resume-Hinweis: bei ai:continued (Folgelauaf nach Soft-Abort) Memory-Pflicht betonen.
          if [ "${{ steps.continued-before.outputs.already }}" = "true" ]; then
            sed -i "s|#RESUME_HINT|⚠️ FORTSETZUNGS-Lauf (ai:continued) — lies ZUERST .claude/memory/ und SETZE FORT, starte NICHT neu, wiederhole nichts aus 'Erledigt'!|g" /tmp/claude-prompt.txt
          else
            sed -i "s/#RESUME_HINT//g" /tmp/claude-prompt.txt
          fi
          sed -i "s/SOFT_DEADLINE/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/claude-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Memory-Upload (das Artefakt IST der Speicher der Phasen-Notizen)
        # Kein Cache-Save mehr — er ist für diese Pipeline platform-seitig unmöglich: GitHubs
        # Richtlinie vom 2026-06-26 vergibt für Issue-/Label-/PR-Trigger UND die daraus
        # kaskadierten workflow_run-Läufe nur lese-only Cache-Token. Der frühere Companion
        # (claude-memory-save.yml) scheiterte deshalb in JEDEM Lauf still mit "cache write
        # denied: token has no writable scopes" — als ##[warning], also bei grünem Job.
        # Artefakte unterliegen dieser Restriktion nicht; die Folgephase holt sich das jüngste
        # nicht-abgelaufene Artefakt dieses Namens (s. setup-claude, Step "Memory-Load").
        # Name = claude-memory-issue-{N} (steps.setup.outputs.memory-save-key).
        if: always() && steps.setup.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.setup.outputs.memory-save-key }}
          path: ${{ steps.setup.outputs.memory-path }}
          # 14 Tage: das Artefakt ist jetzt der einzige Speicher, nicht mehr nur ein Transport-
          # vehikel zum Cache (dort war 1 Tag genug). Muss den ganzen Ticket-Lebenszyklus
          # überdauern; Phase 7 räumt am Ende ohnehin deterministisch auf. Größe: ~1 KB.
          retention-days: 14
          if-no-files-found: ignore

      - name: Label-Post-Assertion (VERDICT parsen, Labels via App-Token force-setzen)
        if: always() && steps.setup.outputs.configured == 'true' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure' || steps.claude.outcome == 'cancelled' || steps.doppel-guard.outputs.skip == 'true')
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
          ALREADY_CONTINUED: ${{ steps.continued-before.outputs.already }}
          GUARD_SKIP: ${{ steps.doppel-guard.outputs.skip }}
        run: |
          verdict=""
          if [ -f /tmp/claude-output.log ]; then
            verdict="$(grep 'VERDICT:' /tmp/claude-output.log | tail -1 | sed -E 's/^.*VERDICT:[[:space:]]*//' | tr -d -c 'A-Za-z0-9-' || true)"
          fi
          echo "Claude-Verdict aus Output: '${verdict:-keins}'"

          # Dieser Step laeuft im Doppel-Run-Guard-Skip bewusst mit (siehe if oben): er soll das
          # Label fuer den BESTEHENDEN PR setzen. Ohne diesen Arm haengt das Ergebnis daran, dass
          # die ARTIFACTS_OK-Pruefung den fremden PR zufaellig als fertig erkennt — richtig, aber
          # unbelegt. Explizit machen, symmetrisch zu 03-claude-spec.yml.
          if [ "${GUARD_SKIP:-false}" = "true" ]; then
            verdict="needs-review"
            echo "::notice::Doppel-Run-Guard: PR existiert bereits — behandele als needs-review."
          fi

          # PR finden: primär closingIssuesReferences, Fallback auf Body-Suche
          # (PR #585: "Closes NNN" ohne "#" lässt die Referenz sonst leer → Crash).
          PR_NR="$(bash .github/scripts/pr-for-issue.sh --repo "$GITHUB_REPOSITORY" \
            --issue "$ISSUE" --draft no --out first)"
          ARTIFACTS_OK="false"
          if [ -n "$PR_NR" ] && [ "$PR_NR" != "null" ]; then
            PR_DRAFT="$(gh pr view "$PR_NR" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo "true")"
            PR_COMMITS="$(gh pr view "$PR_NR" --repo "$GITHUB_REPOSITORY" --json commits --jq '.commits | length' 2>/dev/null || echo "0")"
            if [ "$PR_DRAFT" != "true" ] && [ "${PR_COMMITS:-0}" -gt 0 ]; then
              ARTIFACTS_OK="true"
            fi
          fi

          if [ "$verdict" = "needs-review" ]; then
            if [ "$ARTIFACTS_OK" != "true" ]; then
              echo "::error title=❌ PR fehlt::VERDICT needs-review, aber kein fertiger PR gefunden."
              exit 1
            fi
            final="needs-review"
          elif [ "$verdict" = "not-ready" ]; then
            if [ "$ARTIFACTS_OK" = "true" ]; then
              final="needs-review"
            else
              final="not-ready"
            fi
          else
            if [ "$ARTIFACTS_OK" = "true" ]; then
              final="needs-review"
            else
              final="not-ready"
            fi
          fi

          # Neue Labels erstellen
          gh label create "ai:implemented" --repo "$GITHUB_REPOSITORY" --color 0E8A16 2>/dev/null || true
          gh label create "ai:needs-review" --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true
          gh label create "ai:needs-impl" --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true

          # Trigger-Label entfernen
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:needs-impl" 2>/dev/null || true

          if [ "$final" = "needs-review" ]; then
            # Done-Label setzen + Trigger für Phase 5
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:implemented"
            gh pr edit "$PR_NR" --repo "$GITHUB_REPOSITORY" --remove-label "ai:needs-review" 2>/dev/null || true
            gh pr edit "$PR_NR" --repo "$GITHUB_REPOSITORY" --add-label "ai:needs-review"
            echo "::notice::Labels gesetzt: ai:implemented + ai:needs-review (PR #${PR_NR})"
          else
            # Partial: ai:needs-impl neu setzen
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:needs-impl"
            echo "::notice::Label gesetzt: ai:needs-impl (Partial – erneut auslösen)"
          fi

      - name: Ergebnis zusammenfassen
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          SKIP_DOPPEL: ${{ steps.doppel-guard.outputs.skip }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          # Eigener Arm fuer den Doppel-Run-Guard: ohne ihn faellt der gewollte Skip auf den
          # Fehler-Arm (OUTCOME ist leer, weil der claude-Step nie lief) und meldet ❌.
          if [ "${SKIP_DOPPEL:-false}" = "true" ]; then
            echo "::notice title=⏭️ Umsetzung übersprungen::Issue #${ISSUE} — PR existiert bereits"
          elif [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Umsetzung erfolgreich::Issue #${ISSUE}"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Umsetzung abgebrochen"
          else
            echo "::error title=❌ Umsetzung fehlgeschlagen"
          fi
          {
            echo "### Umsetzung #${ISSUE} – fertig"
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Labels: ${labels:-keine}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🩺 Z.AI Fair-Usage-Check (1313)
        # Rohausgabe des Claude-Laufs auf z.ai-Fehler 1313 (Fair Usage) durchsuchen
        # und Ergebnis als Annotation + Job-Summary sichtbar machen.
        if: always()
        uses: ./.github/actions/llm-fair-usage-check
