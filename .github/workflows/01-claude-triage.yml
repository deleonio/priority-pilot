name: Claude Triage (Analyse)

# Stößt die KI-Analyse (Triage) eines Issues automatisch an.
# Setzt **Claude Code** ein; Provider via `vars.LLM_PROVIDER` (zai|claude), aufgelöst in setup-claude.
#
# Triggert bei:
#  - neuem Issue (issues: opened)
#  - Entfernen von Label "ai:analyzed" oder "ai:to-big-issue" (issues: unlabeled)
#  - @hermes-Kommentar einer Person mit Schreibzugriff (issue_comment: created)

on:
  issues:
    types: [opened, unlabeled]
  issue_comment:
    types: [created]

concurrency:
  group: claude-triage-${{ github.event.issue.number }}-${{ (github.event_name == 'issues' && (github.event.action == 'opened' || github.event.label.name == 'ai:analyzed' || github.event.label.name == 'ai:to-big-issue')) || github.event_name == 'issue_comment' }}
  cancel-in-progress: true

jobs:
  triage:
    if: >-
      ${{ (github.event_name == 'issues'
            && github.event.issue.state == 'open'
            && (
                 (github.event.action == 'opened'
                   && !contains(github.event.issue.labels.*.name, 'ai:analyzed')
                   && (github.event.issue.author_association == 'OWNER'
                       || github.event.issue.author_association == 'MEMBER'
                       || github.event.issue.author_association == 'COLLABORATOR'))
                 || (github.event.action == 'unlabeled'
                     && (github.event.label.name == 'ai:analyzed'
                         || github.event.label.name == 'ai:to-big-issue'))
               ))
          || (github.event_name == 'issue_comment'
              && github.event.issue.pull_request == null
              && contains(github.event.comment.body, '@hermes')
              && (github.event.comment.author_association == 'OWNER'
                  || github.event.comment.author_association == 'MEMBER'
                  || github.event.comment.author_association == 'COLLABORATOR')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    permissions:
      contents: read
      issues: write
      id-token: write
      pull-requests: write
      actions: write
    steps:
      - name: Startzeit merken (für weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 600))" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Claude Code
        id: setup
        uses: ./.github/actions/setup-claude
        with:
          needs-mcp: true
          event-type: ${{ github.event_name }}
          ticket-ref: ${{ github.event.issue.number }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}

      - name: Triage via Claude
        id: claude
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          cat > /tmp/claude-prompt.txt << 'CLAUDE_EOF'
          Führe für GENAU DIESES EINE Issue (#ISSUE_NR) den Ticket-Triage-Workflow aus der Wissensbasis aus — verbindlicher Ablauf: .ai-knowledge/ticket-triage.md.

          TRIGGER-ERKENNUNG (Re-Triage oder Erst-Triage):
            Die Analyse läuft entweder zum ersten Mal (Erst-Triage) oder als aktualisierte Analyse (Re-Triage). Das erkennst du am Body-Block: existiert bereits <!-- KI-ANALYSE:START stand=... --> ... <!-- KI-ANALYSE:END --> im Issue-Body, ist es eine Re-Triage. Dann den stand-Timestamp auslesen und NUR die Delta-Kommentare seit stand lesen (gh issue view #ISSUE_NR --json comments --jq '.comments[] | select(.createdAt > "<stand>")'), NICHT den ganzen Thread. Fehlt der Body-Block, ist es eine Erst-Analyse.

          ABLAUF:
            1. Beginne SOFORT mit der Arbeit — keine Wartezeit!
            2. Lektoriere die Issue-Beschreibung (Form verbessern, Inhalt unverändert, via gh issue edit --body-file -).
            3. Prüfe den Titel auf Konsistenz zur Beschreibung/zum Ziel und optimiere ihn bei Inkonsistenz inhaltlich treu (kein Edit pro forma, keine Titel-Drift, via gh issue edit --title ...).
            4. Zerlege zu große Tickets in verknüpfte Sub-Issues (max. eine Ebene, Rekursionsschutz via Label 'ai:analyzed').
            5. Schreibe die Analyse mit prüfbaren Akzeptanzkriterien + Testfällen und Umsetzbarkeits-Ampel (🟢/🟡/🔴) in einen markierten Block in der Issue-Beschreibung (gh issue edit --body-file -).
            6. Setze genau EINEN kurzen Ping-Kommentar (gh issue comment; bei offenen Fragen mit @author).
            7. GIB VERDICT AUS — KEINE LABELS SELBST SETZEN!

          BODY-BLOCK-FORMAT:
            Der Analyse-Block muss zwischen diesen Markern stehen:
            <!-- KI-ANALYSE:START stand=<aktuelles Datum in ISO-8601> -->
            ...
            <!-- KI-ANALYSE:END -->

          ⚠️ LABELS: Du darfst KEINE Labels setzen oder entfernen! Der Workflow übernimmt das automatisch anhand deines VERDICT-Markers.

          VERDICT-MARKER: Gib GANZ AM ENDE deiner letzten Antwort GENAU EINE Zeile aus:
            - `VERDICT: spec-ready` (bei 🟢 — startet die Spec-Stufe)
            - `VERDICT: analyzed` (bei 🟡/🔴)

          ZEITLIMIT: Deine Soft-Deadline ist SOFT_DEADLINE (Unix-Epoch). Prüfe `[ $(date +%s) -ge SOFT_DEADLINE ]` vor jedem größeren Schritt. Bei OVER: Body-Block mit aktuellem Stand sichern, Turn sofort beenden.
          CLAUDE_EOF

          sed -i "s/#ISSUE_NR/${{ github.event.issue.number }}/g" /tmp/claude-prompt.txt
          sed -i "s/SOFT_DEADLINE/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/claude-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Label-Post-Assertion (VERDICT parsen, Labels via App-Token force-setzen)
        if: always() && steps.setup.outputs.configured == 'true' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          verdict=""
          if [ -f /tmp/claude-output.log ]; then
            verdict="$(grep -oP 'VERDICT:\s*\K.*' /tmp/claude-output.log | tail -1 | tr -d '[:space:]' || true)"
          fi
          echo "Claude-Verdict aus Output: '${verdict:-keins}'"

          BODY="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)"
          HAS_BLOCK="false"
          HAS_AK="false"
          if printf '%s' "$BODY" | grep -q "KI-ANALYSE:START"; then
            HAS_BLOCK="true"
            if printf '%s' "$BODY" | grep -qiE "Akzeptanzkriterien|AK[[:space:]]*[0-9]"; then
              HAS_AK="true"
            fi
          fi

          if [ "$HAS_BLOCK" != "true" ]; then
            echo "::error title=❌ Analyse fehlt::Kein KI-ANALYSE-Block im Issue-Body. Lauf muss wiederholt werden."
            exit 1
          fi

          if [ "$verdict" = "spec-ready" ]; then
            if [ "$HAS_AK" = "true" ]; then
              final="spec-ready"
            else
              final="analyzed"
            fi
          elif [ "$verdict" = "analyzed" ]; then
            if [ "$HAS_AK" = "true" ]; then
              final="spec-ready"
            else
              final="analyzed"
            fi
          else
            if [ "$HAS_AK" = "true" ]; then
              final="spec-ready"
            else
              final="analyzed"
            fi
          fi

          gh label create "ai:analyzed" --color 0E8A16 2>/dev/null || true
          gh label create "ai:spec-ready" --color FBCA04 2>/dev/null || true

          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:analyzed" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:analyzed"

          if [ "$final" = "spec-ready" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:spec-ready"
            echo "::notice::Labels gesetzt: ai:analyzed + ai:spec-ready"
          else
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:spec-ready" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:ready" 2>/dev/null || true
            echo "::notice::Label gesetzt: ai:analyzed (🟡/🔴)"
          fi

      - name: Ergebnis zusammenfassen
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Triage erfolgreich::Issue #${ISSUE} vollständig analysiert"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Triage abgebrochen::Lauf durch neueren Trigger verdrängt oder Timeout"
          else
            echo "::error title=❌ Triage fehlgeschlagen::Claude-Lauf gescheitert"
          fi
          {
            echo "### (Re-)Triage #${ISSUE} — fertig"
            echo ""
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Aktuelle Labels: ${labels:-keine}"
          } >> "$GITHUB_STEP_SUMMARY"
