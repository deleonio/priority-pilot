name: 1/6 Analyse

# Stößt die KI-Analyse (Triage) eines Issues an.
# Setzt **Claude Code** ein; Provider via `vars.LLM_PROVIDER` (zai|claude), aufgelöst in setup-claude.
#
# Triggert bei:
#  - Setzen von Label "ai:needs-analyse" (issues: labeled) → Einstieg in die Pipeline
#  - Entfernen von Label "ai:analysed" (issues: unlabeled) → Re-Triage (manuell)
#
# BEWUSST KEIN issues.opened-Trigger (mehr): Ein neues Issue startet NICHTS von selbst — die
# Pipeline beginnt erst, wenn ein Mensch `ai:needs-analyse` setzt. So bleibt kontrollierbar,
# WELCHE Tickets in den Flow gehen und WANN (Sammel-Anlage, Entwürfe, fremde Reports laufen
# nicht automatisch los). Nebeneffekt: Der frühere author_association-Guard (OWNER/MEMBER/
# COLLABORATOR) im precheck-if entfällt — Labels kann ohnehin nur setzen, wer Schreib-/
# Triage-Rechte am Repo hat.
# BEWUSST KEIN issue_comment-Trigger: Der frühere @hermes-Mention-Trigger ist tot – die
# Konvention gibt es nicht mehr, und Kommentare (insbesondere Bot-Kommentare) dürfen nichts
# anstoßen.
# Zwei Wege in die Phase: `ai:needs-analyse` setzen (Konsum-Weg, auch von issue-unblock
# genutzt) und `ai:analysed` entfernen (manueller Weg, seit ADR-0003-Fortschreibung zurück).
#
# CONCURRENCY: Statische Gruppe pro Phase (globale Serialisierung, FIFO) + cancel-in-progress:
# false. Ein Run, der hinterher im Pre-Check übersprungen wird, darf KEINESFALLS einen laufenden
# Run verdrängen — mit true würde JEDES Issue-Event den laufenden Triage-Lauf global canceln.
# Die frühere Dedup über den Suffix-Trick im Group-Key (Trigger-Bedingung als true/false-Anhang)
# übernimmt jetzt der `precheck`-Job: Er prüft den LABEL-IST-ZUSTAND zur LAUFZEIT, weil queued
# Runs mit dem Label-Zustand zum TRIGGER-Zeitpunkt falsch wiederholen würden.

on:
  issues:
    types: [labeled, unlabeled]

concurrency:
  group: claude-triage
  cancel-in-progress: false
  # queue: max — OHNE dies hält GitHub pro Gruppe nur EINEN pending-Run: jeder neue
  # Run cancelt den wartenden (`queue: single` ist der Default). Mit statischem,
  # ticket-unabhängigem Key hätte ein Label-Burst über mehrere Tickets die
  # wartenden Läufe still verworfen — Trigger-Label klebt, kein Lauf, kein Notice.
  # `max` = bis zu 100 pending, FIFO. Unvereinbar mit cancel-in-progress: true.
  queue: max

jobs:
  precheck:
    # Unveränderliche Event-Fakten filtern hier (sparten den Runner für No-op-Trigger — 01 feuert
    # auf JEDES `labeled`/`unlabeled` im Repo, auch die eigenen Trigger-Konsum-Removes). Sie gaten
    # den precheck, nicht den Hauptjob: wird der precheck übersprungen, ist sein Output leer und
    # der Hauptjob fällt korrekt mit aus.
    if: >-
      ${{ (github.event.action == 'labeled' && github.event.label.name == 'ai:needs-analyse') || (github.event.action == 'unlabeled' && github.event.label.name == 'ai:analysed') }}
    # Label-IST-Zustand zur Laufzeit abfragen (nicht den Trigger-Zeitpunkt-Payload): Dieser Run
    # kann lange in der globalen Phasen-Queue warten — bis er startet, kann das Trigger-Label
    # (ai:needs-analyse) bereits von einem anderen Lauf konsumiert (entfernt) worden sein.
    # Soll-Werte stehen zentral in .github/scripts/check-phase-label.sh; hier wird nur der
    # Phasen-Name übergeben. Fail-open bei API-Fehler (dort implementiert).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # lokale Action + Skript auschecken
      issues: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Label-Pre-Check (IST-Zustand zur Laufzeit)
        id: check
        uses: ./.github/actions/check-phase-label
        with:
          phase: analyse
          ticket: ${{ github.event.issue.number }}
          # Zwei Einstiege: Der unlabeled-Re-Triage (Entfernen von ai:analysed) übergibt
          # LEER — die Action prüft dann, dass ai:analysed abwesend ist; das ist hier der
          # Konsumiert-Check (klebt es wieder, war ein paralleler Lauf schneller). Bei
          # labeled (ai:needs-analyse) wird der Labelname als REQUIRED weitergegeben
          # (muss noch da sein = konsumiert wäre entfernt).
          trigger-label: ${{ github.event.action == 'labeled' && github.event.label.name || '' }}

  triage:
    needs: precheck
    # `result == 'failure'` ist FAIL-OPEN und beabsichtigt: das Skript fällt bei API-Fehlern
    # bewusst auf "laufen lassen" zurück, aber ein Fehler AUSSERHALB (Checkout, Timeout,
    # Runner-Ausfall) würde den Hauptjob sonst stumm überspringen — Trigger konsumiert, niemand
    # arbeitet, nichts re-armt. Ein übersprungener precheck (result == 'skipped', No-op-Trigger)
    # erfüllt keine der beiden Klauseln und lässt den Hauptjob korrekt entfallen.
    if: >-
      ${{ always()
          && (needs.precheck.outputs.proceed == 'true' || needs.precheck.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    permissions:
      contents: read
      issues: write
      id-token: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Startzeit merken (für weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          # 840s statt 600s (Gleichstand mit 02/03): Die Analyse ermittelt den
          # Umsetzungskontext jetzt AM CODE (Read/Glob/Grep) statt ihn zu raten. Das ist
          # der Zweck der Phase — alle Folgeschritte sparen sich die Recherche. Mit dem
          # alten Limit hätte sie den Kontext nur angefangen und die Ersparnis verfehlt.
          # Job-Timeout (30 min) bleibt unverändert die harte Grenze.
          echo "soft_deadline_epoch=$((now + 840))" >> "$GITHUB_OUTPUT"

      - name: Setup Claude Code (mit Memory-Load)
        id: setup
        uses: ./.github/actions/setup-claude
        with:
          needs-mcp: true
          tools-tier: restricted
          event-type: ${{ github.event_name }}
          ticket-ref: ${{ github.event.issue.number }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          model: ${{ vars.CLAUDE_MODEL_TRIAGE || 'opus' }}
          effort: 'high'
          # Compaction: Triage nutzt Subagent-Fanout (haiku) für Reads — der Eltern-
          # kontext bleibt klein. "auto" lässt Claude bei Bedarf kompaktieren.
          # Fan-out-Lesen läuft günstig: Nur die Schlussfolgerung kehrt in den
          # fable-Kontext zurück, nicht die gelesenen Dateien. Ohne diese Zeile
          # liefen Subagents ebenfalls auf fable und der Spareffekt kehrte sich um.
          subagent-model: ${{ vars.CLAUDE_MODEL_TRIAGE_SUBAGENT || 'haiku' }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          zai-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}
          openrouter-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          tailscale-exit-node: ${{ vars.TAILSCALE_EXIT_NODE }}
          # Memory laden: Erst-Triage findet kein Artefakt (Start von null = Normalfall),
          # Re-Triage restauriert den bisherigen Ticket-Memory als Kontext und nutzt ihn.
          # expect-memory=false: leeres Memory bleibt der Normalfall (keine Warning trotz Load).
          memory-load: 'true'
          expect-memory: 'false'

      # Labels VOR dem Claude-Lauf anlegen: Der Zerlegungspfad ruft `gh issue create --label`,
      # was ohne existierendes Label fehlschlägt. Deterministisch hier statt als Prompt-Anweisung —
      # die Triage läuft im restricted-Tier (nur Bash(gh *)), ein `bash …`-Aufruf wäre dort gar
      # nicht erlaubt, und Seiteneffekte gehören ohnehin in den Workflow, nicht in den Agenten.
      - name: Labels sicherstellen (für den Zerlegungspfad)
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
        run: bash .github/scripts/ensure-labels.sh

      - name: Triage via Claude
        id: claude
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          cp .github/prompts/triage.md /tmp/claude-prompt.txt

          # Memory-Snippets anhängen (Read + Write: Erst-Triage startet mit leerem Memory,
          # Re-Triage setzt anhand des restaurierten Standes fort; vor den seds, damit
          # {{ISSUE_NR}}/{{PHASE}}/{{MEMORY_STATUS}} mit substituiert werden)
          cat .github/prompts/memory-read.md >> /tmp/claude-prompt.txt
          bash .github/scripts/render-memory-context.sh >> /tmp/claude-prompt.txt
          cat .github/prompts/memory-write.md >> /tmp/claude-prompt.txt

          sed -i "s/{{ISSUE_NR}}/${{ github.event.issue.number }}/g" /tmp/claude-prompt.txt
          sed -i "s/{{PHASE}}/triage/g" /tmp/claude-prompt.txt
          sed -i "s/{{MEMORY_STATUS}}/${{ steps.setup.outputs.memory-status-text }}/g" /tmp/claude-prompt.txt
          sed -i "s/{{SOFT_DEADLINE}}/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/claude-prompt.txt
          bash .github/scripts/assert-prompt-complete.sh /tmp/claude-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Token & Kosten erfassen
        # always(): Auch ein abgebrochener Lauf hat Token verbraucht — gerade teure
        # Fehlläufe gehören in die Baseline, sonst sieht die alte Pipeline zu günstig aus.
        if: always() && steps.setup.outputs.configured == 'true'
        uses: ./.github/actions/record-cost
        with:
          issue: ${{ steps.setup.outputs.issue-number || github.event.issue.number }}
          phase: analyse
          since-epoch: ${{ steps.starttime.outputs.epoch }}
          provider: ${{ steps.setup.outputs.llm-provider }}

      - name: Issue-Storage sichern (State-Branch)
        # ADR 0006: Fetch-then-Commit auf ai/state/issue-{N} — der Branch IST der Speicher
        # (unbefristet, versioniert, kein Artefakt-/Cache-Transport mehr; Cache-Writes sind
        # für diese Trigger platform-seitig gesperrt, s. setup-claude Kopf-Kommentar).
        # origin trägt das App-Token aus setup-claude; der Documenter-Teardown räumt den
        # Branch am Ticket-Ende ab, der Hygiene-Sweep fängt Verwaiste.
        if: always() && steps.setup.outputs.configured == 'true'
        uses: ./.github/actions/issue-state-save
        with:
          issue-number: ${{ steps.setup.outputs.issue-number || github.event.issue.number }}
          phase: triage

      - name: Label-Post-Assertion (VERDICT parsen, Labels via App-Token force-setzen)
        if: always() && steps.setup.outputs.configured == 'true' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          verdict=""
          LOG=/tmp/claude-output.log
          if [ -f "$LOG" ]; then
            # Portabel statt `grep -oP '…\K…'` (\K = Perl-Lookbehind): BSD-grep (macOS
            # /usr/bin/grep) kennt -P nicht → verdict leer → fälschlich fail-safe „analyzed".
            # sed -E und grep -oE sind BSD wie GNU portabel (CI: GNU-grep; macOS Manuell-Test:
            # BSD-grep). grep -oE nimmt den ERSTEN bekannten Token aus dem Zeilenrest —
            # Markdown-Dekoration (**…**, Backticks, #582) UND Prosa hinter dem Token
            # („spec-ready, AKs im Body", #1017) sind damit egal; tr -d klebte beides
            # vorher an den Token und der exakte Vergleich fiel fälschlich auf fail-safe.
            verdict="$(grep 'VERDICT:' "$LOG" | tail -1 | sed -E 's/^.*VERDICT:[[:space:]]*//' | grep -oE 'spec-ready|needs-human|analyzed' | head -1 || true)"
          fi
          echo "Claude-Verdict aus Output: '${verdict:-keins}'"

          BODY="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)"
          HAS_BLOCK="false"
          HAS_AK="false"
          if printf '%s' "$BODY" | grep -q "KI-ANALYSE:START"; then
            HAS_BLOCK="true"
            if printf '%s' "$BODY" | grep -qiE "Akzeptanzkriterien|AK[[:space:]]*[0-9]"; then
              HAS_AK="true"
            fi

            # UI-Bezug aus KI-ANALYSE-Block parsen (entscheidet den nächsten Trigger:
            # ai:needs-ux-ui bei UI-Bezug, ai:needs-spec überspringt die UX-Phase)
            UI_BEZUG=""
            UI_BEZUG_LINE="$(printf '%s' "$BODY" | grep -iE "UI-Bezug:" | head -1 || true)"
            if [ -n "$UI_BEZUG_LINE" ]; then
              UI_BEZUG="$(printf '%s' "$UI_BEZUG_LINE" | sed -E 's/^.*[Uu][Iu][- ]?[Bb]ezug:[[:space:]]*//' | tr -d '[:space:]' | head -c 4 || true)"
            fi
            echo "UI-Bezug aus Analyse: '${UI_BEZUG:-nicht gefunden}'"

            # Aufwandsklasse = Modell der impl-Zeile aus der ai-phase-routing-Tabelle
            # (die EINE analysgetriebene Steuerung, ADR-0004; resolve-model-label.sh
            # liest das daraus gesetzte ai:model:*-Label).
            # Parselogik deckungsgleich mit resolve-phase-routing.sh (Feld $4 der
            # Markdown-Zeile, Whitespace entfernt) — BODY liegt hier bereits vor,
            # deshalb inline statt Script-Call (kein zweiter API-Roundtrip).
            KLASSE="$(printf '%s' "$BODY" | sed -n '/ai-phase-routing:START/,/ai-phase-routing:END/p' \
              | awk -F'|' '/^\|[[:space:]]*impl[[:space:]]*\|/ { m=$4; gsub(/[ \t]/, "", m); print m; exit }')"
            case "$KLASSE" in
              haiku|sonnet|opus) ;;
              # Kein stiller Fallback: eine geratene Klasse wäre genau das Verhalten,
              # gegen das die Modellwahl antritt. Leer lassen — die Folgephase bricht
              # dann ab und parkt mit Begründung beim Menschen (resolve-model).
              *) [ -n "$KLASSE" ] && echo "::warning title=Aufwandsklasse::Unbekannter Wert '${KLASSE}' aus Routing-Tabelle — ignoriert."; KLASSE="" ;;
            esac
            echo "Aufwandsklasse aus Routing-Tabelle (impl-Zeile): '${KLASSE:-nicht gefunden}'"

            # Spec nötig? Entscheidung liegt in resolve-spec-skip.sh (dort getestet), nicht
            # hier inline: Sie prüft die Selbstauskunft der Analyse gegen die deklarierten
            # Dateien und fällt bei jeder Unsicherheit auf „Spec läuft" zurück.
            printf '%s' "$BODY" > /tmp/analyse-block.md
            SPEC_OUT="$(bash .github/scripts/resolve-spec-skip.sh --block-file /tmp/analyse-block.md 2>/dev/null || true)"
            NEEDS_SPEC="$(printf '%s' "$SPEC_OUT" | sed -n 's/^needs_spec=//p')"
            SPEC_REASON="$(printf '%s' "$SPEC_OUT" | sed -n 's/^reason=//p')"
            # Leere Ausgabe (Skript nicht lauffähig) = Spec läuft — gleiche Richtung wie im Skript.
            [ -n "$NEEDS_SPEC" ] || { NEEDS_SPEC="true"; SPEC_REASON="Spec-Entscheidung nicht ermittelbar — Spec läuft (fail-safe)."; }
            echo "Spec nötig: ${NEEDS_SPEC} — ${SPEC_REASON}"
          fi

          # Self-Heal (Issue #566): Schwachmodell-Agent (zai/GLM) postet den KI-ANALYSE-Block
          # gelegentlich als Kommentar, statt ihn via `gh issue edit` in den Body zu schreiben.
          # Statt dann den kompletten Lauf (und die Token-Spende) wegzuwerfen, den Block aus
          # dem neuesten passenden Kommentar in den Body migrieren — modellunabhängige
          # Sicherheitsleine. hart-fail nur, wenn der Block WEDER im Body NOCH in einem
          # Kommentar existiert.
          if [ "$HAS_BLOCK" != "true" ]; then
            BLOCK_FROM_COMMENT="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json comments -q \
              '[.comments[] | select(.body | test("KI-ANALYSE:START"))] | last | .body // ""' 2>/dev/null || true)"
            if [ -n "$BLOCK_FROM_COMMENT" ]; then
              printf '%s\n\n%s\n' "$BODY" "$BLOCK_FROM_COMMENT" \
                | gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file - 2>/dev/null || true
              echo "::warning title=♻️ Block migriert::KI-ANALYSE-Block war in einem Kommentar statt im Issue-Body – automatisch in den Body migriert."
              BODY="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)"
              HAS_BLOCK="true"
              if printf '%s' "$BODY" | grep -qiE "Akzeptanzkriterien|AK[[:space:]]*[0-9]"; then
                HAS_AK="true"
              fi
            fi
          fi

          if [ "$HAS_BLOCK" != "true" ]; then
            echo "::error title=❌ Analyse fehlt::Kein KI-ANALYSE-Block im Issue-Body ODER in Kommentaren. Lauf muss wiederholt werden."
            exit 1
          fi

          # VERDICT ist autoritativ für die Phasen-Freigabe (Issue #538):
          #   spec-ready (🟢) + AK vorhanden → Freigabe in die Spec-Stufe
          #   needs-human → harter Stopp, aber NUR mit Begründungs-Kommentar (s. u.)
          #   analyzed (🟡/🔴) oder leer/ungültig → beim Menschen bleiben (fail-safe)
          # HAS_AK wirkt nur als zusätzlicher Guard, nie als alleiniger Promoter.
          if [ "$verdict" = "spec-ready" ] && [ "$HAS_AK" = "true" ]; then
            final="spec-ready"
          elif [ "$verdict" = "needs-human" ]; then
            final="needs-human"
          else
            final="analyzed"
          fi

          # BEGRÜNDUNGSPFLICHT: ai:needs-human darf technisch nicht ohne begleitenden
          # Kommentar gesetzt werden. Fehlt er, wird NICHT stillschweigend das Label
          # gesetzt (das verlagerte die Analysearbeit zurück und machte das Label
          # wertlos) — stattdessen postet der Workflow seine eigene Diagnose, damit am
          # Ticket IMMER steht, warum es steht. Gleiche Mechanik wie in 05/06.
          if [ "$final" = "needs-human" ]; then
            SINCE_ISO="$(date -u -d "@${{ steps.starttime.outputs.epoch }}" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo '')"
            LOOKUP="$(bash .github/scripts/needs-human-explain.sh lookup \
              --repo "$GITHUB_REPOSITORY" --ticket "$ISSUE" --mode triage \
              ${SINCE_ISO:+--since "$SINCE_ISO"} 2>/dev/null || true)"
            if [ "$(printf '%s' "$LOOKUP" | sed -n 's/^status=//p')" != "found" ]; then
              echo "::warning title=Begründung fehlt::VERDICT needs-human ohne <!-- ai-triage-decision -->-Kommentar — Workflow postet Ersatz-Diagnose."
              {
                echo "<!-- ai-triage-decision -->"
                echo "## ⛔ Analyse gestoppt — Begründung fehlt"
                echo ""
                echo "**Was zu entscheiden ist:** Die Analyse hat das Ticket als nicht eindeutig eingestuft,"
                echo "aber KEINE Begründung hinterlassen. Was hier zu klären ist, muss aus dem Ticket selbst"
                echo "bestimmt werden."
                echo ""
                echo "**Worauf es sich bezieht:** Issue #${ISSUE}"
                echo ""
                echo "**Optionen:**"
                echo "- Ticket präzisieren, dann \`ai:needs-human\` entfernen **und** \`ai:needs-analyse\` setzen."
                echo "- War dies ein Fehllauf (Ticket ist eindeutig): genauso vorgehen — \`ai:needs-human\` weg,"
                echo "  \`ai:needs-analyse\` gesetzt."
                echo ""
                echo "> Das Entfernen von \`ai:needs-human\` hebt nur die Sperre auf und startet nichts."
                echo "> Das Ticket trägt \`ai:analysed\`, aber keinen Phasen-Trigger — der Anstoß fehlt sonst."
                echo ""
                echo "**Empfehlung:** Letzten Lauf im Actions-Log prüfen — dort steht, woran die Analyse hing."
                echo ""
                echo "---"
                echo "_Ersatz-Diagnose des Workflows: Das Label wird nie ohne Begründung gesetzt._"
              } > /tmp/triage-needs-human.md
              gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file /tmp/triage-needs-human.md || true
            else
              echo "::notice title=Begründung vorhanden::$(printf '%s' "$LOOKUP" | sed -n 's/^permalink=//p')"
            fi
          fi

          bash .github/scripts/ensure-labels.sh

          # Aufwandsklasse als ai:model:*-Label setzen. Genau EINES: die anderen erst
          # entfernen (Re-Triage kann neu einstufen), dann das aktuelle setzen — zwei
          # Labels ließen resolve-model-label.sh bewusst abbrechen.
          # `ai:model:*` ist KEIN Pipeline-Trigger und steht deshalb nicht in der
          # MANAGED-Liste von label-transition.sh — es überlebt alle Phasen-Transitions.
          if [ -n "$KLASSE" ]; then
            for m in haiku sonnet opus; do
              [ "$m" = "$KLASSE" ] && continue
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:model:$m" 2>/dev/null || true
            done
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:model:$KLASSE"
            echo "::notice title=🎚️ Modell::Aufwandsklasse '$KLASSE' als ai:model:$KLASSE gesetzt."
          else
            echo "::warning title=Aufwandsklasse fehlt::Kein ai:model:*-Label gesetzt — die Umsetzung wird abbrechen und beim Menschen parken."
          fi

          # Trigger konsumieren (ai:needs-analyse bei Re-Triage) und stale Folge-Trigger
          # abräumen — Remove-vor-Add (#536), damit kein alter Trigger kleben bleibt.
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:needs-analyse" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:needs-ux-ui" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:needs-spec" 2>/dev/null || true
          # ai:needs-impl gehört seit der überspringbaren Spec ebenfalls in die Liste: Die
          # Analyse kann es jetzt selbst setzen, also muss ein Re-Triage es auch wieder
          # abräumen können — sonst bliebe nach einer Neubewertung („doch Spec nötig") der
          # alte Direkt-Trigger kleben und Spec- und Umsetzungsphase liefen beide an.
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:needs-impl" 2>/dev/null || true

          # Done-Label der Analyse-Phase (immer — auch 🟡/🔴 bleibt die Analyse erledigt).
          # Idempotent setzen: Hängt es schon (Re-Triage), kein Remove+Add — jedes Add
          # feuert ein labeled-Event, das nur 4 No-Op-Runs startet.
          HAS_ANALYSED="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels \
            --jq '[.labels[].name] | any(. == "ai:analysed")' 2>/dev/null || echo false)"
          if [ "$HAS_ANALYSED" != "true" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:analysed"
          fi

          if [ "$final" = "spec-ready" ]; then
            # 🟢: Trigger der nächsten Phase setzen — UX-Phase nur bei UI-Bezug,
            # Nicht-UI-Tickets springen direkt zur Spec-Phase (kein separates
            # Skip-Marker-Label mehr nötig: der Trigger IST der Skip).
            if [ "$UI_BEZUG" != "nein" ]; then
              # UI-Ticket: erst UX, dann Spec. 02 setzt auf ux-ready IMMER ai:needs-spec —
              # damit ist `needs_ux ⇒ needs_spec` auch auf diesem Weg erzwungen.
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:needs-ux-ui"
              echo "::notice::Label gesetzt: ai:needs-ux-ui (UI-Ticket – 02 kümmert sich)"
            elif [ "$NEEDS_SPEC" = "false" ]; then
              # Spec übersprungen: direkt in die Umsetzung. Die Spec könnte hier keine roten
              # Tests schreiben (Test-Carve-out), also bliebe nur ein Dokument — dafür lohnt
              # der Lauf nicht. Die Umsetzung legt Branch und PR selbst an (Direkt-Modus).
              gh label create "ai:needs-impl" --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:needs-impl"
              echo "::notice title=⏭️ Spec übersprungen::${SPEC_REASON}"
              echo "::notice::Label gesetzt: ai:needs-impl (Spec übersprungen)"
            else
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:needs-spec"
              echo "::notice::Label gesetzt: ai:needs-spec (${SPEC_REASON})"
            fi
          elif [ "$final" = "needs-human" ]; then
            # Harter Stopp: check-phase-label.sh blockt mit diesem Label JEDE
            # Folgephase, auch wenn ein Trigger klebt. Bewusst KEIN Phasen-Trigger —
            # es wird nichts vorsorglich spezifiziert oder implementiert.
            # Die Begründung steht bereits am Ticket (oben erzwungen).
            gh label create "ai:needs-human" --color 5319e7 \
              --description "Nicht-automatisierbare Entscheidung — wartet auf Mensch" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:needs-human"
            echo "::notice::Label gesetzt: ai:needs-human (Aufgabenstellung nicht eindeutig — Pipeline gestoppt)"
          else
            echo "::notice::Label gesetzt: ai:analysed (🟡/🔴)"
          fi

      - name: Ergebnis zusammenfassen
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Triage erfolgreich::Issue #${ISSUE} vollständig analysiert"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Triage abgebrochen::Lauf durch neueren Trigger verdrängt oder Timeout"
          else
            echo "::error title=❌ Triage fehlgeschlagen::Claude-Lauf gescheitert"
          fi
          {
            echo "### (Re-)Triage #${ISSUE} – fertig"
            echo ""
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Aktuelle Labels: ${labels:-keine}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🩺 Z.AI Fair-Usage-Check (1313)
        # Rohausgabe des Claude-Laufs auf z.ai-Fehler 1313 (Fair Usage) durchsuchen
        # und Ergebnis als Annotation + Job-Summary sichtbar machen.
        if: always()
        uses: ./.github/actions/llm-fair-usage-check
