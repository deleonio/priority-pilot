name: Claude Triage (Analyse)

# Stößt die KI-Analyse (Triage) eines Issues automatisch an.
# Setzt **Claude Code** ein; Provider via `vars.LLM_PROVIDER` (zai|claude), aufgelöst in setup-claude.
#
# Triggert bei:
#  - neuem Issue (issues: opened)
#  - Entfernen von Label "ai:analyzed" oder "ai:to-big-issue" (issues: unlabeled) → Re-Triage
#
# BEWUSST KEIN issue_comment-Trigger. Zwei Gründe:
#  1. Der frühere @hermes-Mention-Trigger ist tot – die Konvention gibt es nicht mehr.
#  2. Kommentare dürfen nichts anstoßen, insbesondere nicht die des Bots selbst: GitHub
#     wertet `concurrency` auf RUN-Ebene aus, BEVOR das job-if greift. Ein Run, der danach
#     übersprungen wird, cancelt trotzdem einen laufenden Run derselben Gruppe.
# Re-Triage läuft über das Entfernen von `ai:analyzed`.

on:
  issues:
    types: [opened, unlabeled]

concurrency:
  group: >-
    claude-triage-${{ github.event.issue.number }}-${{ github.event.issue.state == 'open' && ( (github.event.action == 'opened' && !contains(github.event.issue.labels.*.name, 'ai:analyzed') && (github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'MEMBER' || github.event.issue.author_association == 'COLLABORATOR')) || (github.event.action == 'unlabeled' && (github.event.label.name == 'ai:analyzed' || github.event.label.name == 'ai:to-big-issue')) ) }}
  cancel-in-progress: true

jobs:
  triage:
    if: >-
      ${{ github.event.issue.state == 'open' && ( (github.event.action == 'opened' && !contains(github.event.issue.labels.*.name, 'ai:analyzed') && (github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'MEMBER' || github.event.issue.author_association == 'COLLABORATOR')) || (github.event.action == 'unlabeled' && (github.event.label.name == 'ai:analyzed' || github.event.label.name == 'ai:to-big-issue')) ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    permissions:
      contents: read
      issues: write
      id-token: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Startzeit merken (für weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 600))" >> "$GITHUB_OUTPUT"

      - name: Setup Claude Code (mit Memory-Load)
        id: setup
        uses: ./.github/actions/setup-claude
        with:
          needs-mcp: true
          tools-tier: restricted
          event-type: ${{ github.event_name }}
          ticket-ref: ${{ github.event.issue.number }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          model: ${{ vars.CLAUDE_MODEL_TRIAGE }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          zai-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}
          openrouter-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}
          memory-load: 'true'

      - name: Triage via Claude
        id: claude
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          cat > /tmp/claude-prompt.txt << 'CLAUDE_EOF'
          TICKET-MEMORY: Lies vor Beginn alle Dateien in .claude/ticket-memory/ (falls vorhanden) — ticketspezifisches Gedächtnis aus früheren Phasen. Schreibe am ENDE deine wichtigsten Erkenntnisse (Entscheidungen, Fallstricke, fertige/fehlende Schritte) in .claude/ticket-memory/phase-triage.md. Max. ~30 Zeilen, nur Neues.
          FOKUS: NUR Issue #ISSUE_NR. Recherche = Issue-Body + ggf. Delta-Kommentare seit stand, sonst nichts. KEINE Abstecher. Token sparen: kurz, präzise, direkt.

          Memory ist bereits geladen (ticket-ISSUE_NR).

          TRIGGER:
            - Erst-Triage: Kein <!-- KI-ANALYSE:START --> Block im Issue-Body.
            - Re-Triage: Block existiert. Lese NUR Delta-Kommentare seit stand-Timestamp:
              gh issue view #ISSUE_NR --json comments --jq '.comments[] | select(.createdAt > "<stand>")'

          ABLAUF (STRIKT):
            1. SOFORT starten.
            2. Titel prüfen: Konsistenz zur Beschreibung? Falls nein: inhaltlich treu optimieren (gh issue edit --title).
            3. Beschreibung lektorieren (Form verbessern, Inhalt unverändert, gh issue edit --body-file -).
            4. Zu große Tickets: in Sub-Issues zerlegen (max. 1 Ebene).
            5. Analyse schreiben: Akzeptanzkriterien + Testfälle + Ampel (🟢/🟡/🔴) in BODY-BLOCK.
            6. EINEN Ping-Kommentar (gh issue comment).

          BODY-BLOCK-FORMAT:
            <!-- KI-ANALYSE:START stand=<ISO-8601-Datum> -->
            [Analyse – präzise, ohne Füllwörter]
            <!-- KI-ANALYSE:END -->

          ⚠️ LABELS: KEINE Labels setzen! Workflow übernimmt das via VERDICT.

          VERDICT: GANZ AM ENDE GENAU EINE Zeile:
            - VERDICT: spec-ready (bei 🟢)
            - VERDICT: analyzed (bei 🟡/🔴)

          ZEITLIMIT: Soft-Deadline = SOFT_DEADLINE. Vor jedem Schritt: [ $(date +%s) -ge SOFT_DEADLINE ]. Bei OVER: Body-Block sichern, Turn beenden.
          CLAUDE_EOF

          sed -i "s/#ISSUE_NR/${{ github.event.issue.number }}/g" /tmp/claude-prompt.txt
          sed -i "s/SOFT_DEADLINE/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/claude-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Memory-Save (ticketspezifisch, dateibasiert)
        # Cache nur schreiben, wenn Claude gelaufen ist (s. workflow-invariants-Test: das
        # outcome-Binding hält diesen Step im Guard-Skip-Fall indirekt heraus).
        if: always() && steps.setup.outputs.configured == 'true' && steps.claude.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.setup.outputs.memory-path }}
          key: ${{ steps.setup.outputs.memory-save-key }}
          if-no-path-exists: ignore

      - name: Label-Post-Assertion (VERDICT parsen, Labels via App-Token force-setzen)
        if: always() && steps.setup.outputs.configured == 'true' && (steps.claude.outcome == 'success' || steps.claude.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          verdict=""
          LOG=/tmp/claude-output.log
          if [ -f "$LOG" ]; then
            verdict="$(grep -oP 'VERDICT:\s*\K.*' "$LOG" | tail -1 | tr -d '[:space:]' || true)"
          fi
          echo "Claude-Verdict aus Output: '${verdict:-keins}'"

          BODY="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || true)"
          HAS_BLOCK="false"
          HAS_AK="false"
          if printf '%s' "$BODY" | grep -q "KI-ANALYSE:START"; then
            HAS_BLOCK="true"
            if printf '%s' "$BODY" | grep -qiE "Akzeptanzkriterien|AK[[:space:]]*[0-9]"; then
              HAS_AK="true"
            fi
          fi

          if [ "$HAS_BLOCK" != "true" ]; then
            echo "::error title=❌ Analyse fehlt::Kein KI-ANALYSE-Block im Issue-Body. Lauf muss wiederholt werden."
            exit 1
          fi

          # VERDICT ist autoritativ für die Phasen-Freigabe (Issue #538):
          #   spec-ready (🟢) + AK vorhanden → Freigabe in die Spec-Stufe
          #   analyzed (🟡/🔴) oder leer/ungültig → beim Menschen bleiben (fail-safe)
          # HAS_AK wirkt nur als zusätzlicher Guard, nie als alleiniger Promoter.
          if [ "$verdict" = "spec-ready" ] && [ "$HAS_AK" = "true" ]; then
            final="spec-ready"
          else
            final="analyzed"
          fi

          gh label create "ai:analyzed" --color 0E8A16 2>/dev/null || true
          gh label create "ai:spec-ready" --color FBCA04 2>/dev/null || true

          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:analyzed" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:analyzed"

          if [ "$final" = "spec-ready" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:spec-ready"
            echo "::notice::Labels gesetzt: ai:analyzed + ai:spec-ready"
          else
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:spec-ready" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:ready" 2>/dev/null || true
            echo "::notice::Label gesetzt: ai:analyzed (🟡/🔴)"
          fi

      - name: Ergebnis zusammenfassen
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Triage erfolgreich::Issue #${ISSUE} vollständig analysiert"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Triage abgebrochen::Lauf durch neueren Trigger verdrängt oder Timeout"
          else
            echo "::error title=❌ Triage fehlgeschlagen::Claude-Lauf gescheitert"
          fi
          {
            echo "### (Re-)Triage #${ISSUE} – fertig"
            echo ""
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Aktuelle Labels: ${labels:-keine}"
          } >> "$GITHUB_STEP_SUMMARY"
