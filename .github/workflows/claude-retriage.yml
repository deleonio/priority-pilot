name: Claude Re-Triage

# Stoesst eine KI-Neu-Analyse (Re-Triage) eines Issues an, sobald jemand mit
# Schreibzugriff einen Issue-Kommentar mit dem Stichwort "@claude" hinterlaesst
# ODER einen Kommentar so bearbeitet, dass er "@claude" enthaelt.
# Setzt den Ticket-Triage-Ablauf fuer genau dieses eine Issue um (Re-Triage).
# Ablauf/Hintergrund: .ai-knowledge/ticket-triage.md und .claude/commands/triage-ticket.md
#
# Voraussetzung: Repository-Secret CLAUDE_CODE_OAUTH_TOKEN (per `claude setup-token`).

on:
  issue_comment:
    # created: neuer Kommentar; edited: nachtraeglich um "@claude" ergaenzter Kommentar.
    types: [created, edited]

# Pro Issue nur ein Lauf gleichzeitig. cancel-in-progress: true -> eine neue Aenderung
# (weiterer/bearbeiteter @claude-Kommentar) am selben Issue bricht den noch laufenden
# Re-Triage-Lauf ab, damit immer nur die juengste Analyse durchlaeuft (aeltere, ueberholte
# Laeufe werden verworfen). Ein abgebrochener Teil-Lauf ist unkritisch: der naechste Lauf
# fuehrt die Re-Triage vollstaendig neu aus.
concurrency:
  group: claude-retriage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  re-triage:
    # Nur ausloesen, wenn ALLE Bedingungen zutreffen:
    #  - echtes Issue, kein PR (issue_comment feuert auch fuer PRs -> pull_request == null)
    #  - der Kommentar enthaelt das Stichwort @claude
    #  - der Kommentar stammt von jemandem mit Schreibzugriff (OWNER/MEMBER/COLLABORATOR),
    #    damit Aussenstehende den Lauf (und das OAuth-Token) nicht ausloesen koennen.
    #    Die Action prueft den Schreibzugriff zwar zusaetzlich selbst, dies ist die
    #    vorgeschaltete, billige Absicherung (kein Runner-Start fuer Fremde).
    if: >-
      ${{ github.event.issue.pull_request == null
          && contains(github.event.comment.body, '@claude')
          && (github.event.comment.author_association == 'OWNER'
              || github.event.comment.author_association == 'MEMBER'
              || github.event.comment.author_association == 'COLLABORATOR') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Repo auschecken (Slash-Command + Wissensbasis lesen)
      issues: write # Beschreibung lektorieren, Analyse-Kommentar posten, Labels setzen
      id-token: write # OIDC-Token der Action; ohne diese Permission fehlt ACTIONS_ID_TOKEN_REQUEST_URL
    steps:
      # Startzeit fuer die Timeout-Erkennung (siehe Zeit-Guard im Label-Schritt unten).
      - name: Startzeit merken (fuer Timeout-Erkennung)
        id: starttime
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # GitHub-App-Token (optional): Setzt die Re-Triage `ai:spec-ready` als App-Bot, loest das den
      # Spec-Workflow (claude-spec.yml) aus. Mit dem Standard-GITHUB_TOKEN gesetzte Labels triggern
      # KEINE Folge-Workflows. Fehlen die App-Secrets, faellt GH_TOKEN auf github.token zurueck
      # (Re-Triage laeuft normal, nur der Spec-Auto-Trigger entfaellt dann).
      - name: Voraussetzung pruefen (GitHub-App-Secrets, optional)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::notice::GitHub-App-Secrets fehlen — Re-Triage laeuft mit GITHUB_TOKEN; der Auto-Trigger der Spec-Stufe (ai:spec-ready -> claude-spec.yml) entfaellt. Fuer den Trigger eine GitHub App (Issues/Contents/Pull requests = Read and write) als APP_ID + APP_PRIVATE_KEY hinterlegen."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Standard-Pfad (Claude): laeuft, solange die Repo-Variable AI_AGENT NICHT auf "mistral"
      # steht (auch ungesetzt -> Claude bleibt Default). Umschalten: `gh variable set AI_AGENT
      # --body mistral` (zurueck: `gh variable set AI_AGENT --body claude`).
      - name: Re-Triage via Claude Code
        id: claude
        if: vars.AI_AGENT != 'mistral'
        uses: anthropics/claude-code-action@74eedf1a1892082d619c3edb66b9402da6520e7f # v1.0.156
        env:
          # gh nutzt das App-Token (falls vorhanden) -> das gesetzte ai:spec-ready loest den
          # Spec-Workflow aus; ohne App-Secrets Fallback auf github.token.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Re-Triage fuer genau dieses eine Issue. Bewusst natuerlichsprachig formuliert
          # (nicht als Slash-Command), da die Action keine garantierte Slash-Command-
          # Ausfuehrung im prompt zusichert; verweist aber auf den verbindlichen Ablauf.
          prompt: |
            Eine Person mit Schreibzugriff hat Issue #${{ github.event.issue.number }}
            kommentiert (Stichwort @claude) und damit eine Neu-Analyse (Re-Triage) angefordert.

            Fuehre fuer GENAU DIESES EINE Issue (#${{ github.event.issue.number }}) den
            Ticket-Triage-Workflow aus der Wissensbasis aus — verbindlicher Ablauf:
            .ai-knowledge/ticket-triage.md (entspricht dem Slash-Command
            `/triage-ticket ${{ github.event.issue.number }}`).

            Behandle es als Re-Triage (Schritt 1 der Wissensbasis): eine bereits vorhandene
            KI-Analyse nicht unveraendert uebernehmen, sondern auf Passung und Vollstaendigkeit
            zur (ggf. geaenderten) Aufgabenstellung pruefen und bei Bedarf aktualisieren bzw.
            ergaenzen. Dann wie im Ablauf: Beschreibung lektorieren (Inhalt unveraendert), am Ende
            den Titel auf Konsistenz zur Beschreibung/zum Ziel pruefen und bei Inkonsistenz
            inhaltlich treu optimieren (kein Edit pro forma, keine Titel-Drift),
            Loesungs-Kommentar auf Deutsch mit Umsetzbarkeits-Ampel (gruen/gelb/rot) posten und
            Labels gemaess Ampel setzen (`ai:analyzed`; bei gruen zusaetzlich `ai:spec-ready` (Output
            der Spec-Stufe; NICHT `ai:ready`), bei gelb/rot ein evtl. vorhandenes
            `ai:spec-ready`/`ai:ready` entfernen).

            Bearbeite ausschliesslich dieses eine Issue (kein Batch). Committe keinen Produktivcode.
          # Nur die im Triage-Ablauf benoetigten Tools zulassen (headless, keine interaktive
          # Freigabe) und die in der Wissensbasis geforderte Bestaetigung als durch den
          # @claude-Ausloeser erteilt behandeln.
          claude_args: >-
            --model claude-sonnet-4-6 --effort medium
            --allowedTools "Bash(gh issue:*),Bash(gh api:*),Bash(gh label:*),Read,Grep,Glob,Task"
            --append-system-prompt "Automatisierter, vom Maintainer per @claude-Kommentar autorisierter Re-Triage-Lauf in GitHub Actions (headless, keine interaktive Rueckfrage moeglich). Die in der Wissensbasis geforderte Bestaetigung vor dem oeffentlichen Posten gilt durch den @claude-Ausloeser als erteilt: Poste Lektorat, Analyse-Kommentar und Labels direkt fuer Issue #${{ github.event.issue.number }}, ohne auf eine Bestaetigung zu warten. Bearbeite ausschliesslich dieses Issue und committe keinen Produktivcode. Modell-Strategie: Du laeufst als Sonnet-Koordinator. Schaetze die Komplexitaet der Aufgabe ein und delegiere die eigentliche Abarbeitung per Agent-Tool an einen Subagenten in derselben Session: heavy (Opus) fuer komplexe/architektonische Aufgaben, light (Haiku) fuer triviale/mechanische Aufgaben; Standard- und Koordinationsarbeit erledigst du selbst auf Sonnet."

      # Mistral-Pfad (AI_AGENT == 'mistral'): Vibe laeuft headless OHNE Approval-Callback — ohne
      # erzwungenes Auto-Approve wuerde jedes genehmigungspflichtige Tool (gh/git/pnpm/Datei-Writes)
      # als "Tool execution not permitted" uebersprungen. default_agent=auto-approve setzt
      # bypass_tool_permissions=true; ~/.vibe/config.toml ist der Default-Konfig-Ort (VIBE_HOME).
      - name: Vibe-Konfig (Headless Auto-Approve)
        if: vars.AI_AGENT == 'mistral'
        run: |
          mkdir -p "$HOME/.vibe"
          cat > "$HOME/.vibe/config.toml" <<'EOF'
          default_agent = "auto-approve"
          bypass_tool_permissions = true
          EOF

      # Spiegelt den Claude-Schritt: gleicher Ablauf, anderer Agent. Die Vibe-Action reicht KEINE
      # Extra-Flags durch — daher System-Prompt-Regeln als fuehrender [KONTEXT]-Block im prompt;
      # Tool-Restriktion wie bei Claude ist hier nicht erzwingbar (Auto-Approve gibt alle Tools frei).
      - name: Re-Triage via Mistral Vibe
        id: mistral
        if: vars.AI_AGENT == 'mistral'
        uses: mistralai/mistral-vibe@725d3a56ce99aa69157f33cabdf28f23a69320da # v2.17.1
        env:
          # gh nutzt das App-Token (falls vorhanden) -> ai:spec-ready loest den Spec-Workflow aus;
          # ohne App-Secrets Fallback auf github.token.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        with:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          args: --trust
          prompt: |
            [KONTEXT/REGELN] Automatisierter, vom Maintainer per @claude-Kommentar autorisierter
            Re-Triage-Lauf in GitHub Actions (headless, keine interaktive Rueckfrage moeglich). Die
            in der Wissensbasis geforderte Bestaetigung vor dem oeffentlichen Posten gilt durch den
            @claude-Ausloeser als erteilt. Nutze fuer GitHub-Operationen ausschliesslich die
            `gh`-CLI; committe keinen Produktivcode und bearbeite ausschliesslich Issue
            #${{ github.event.issue.number }}.

            Eine Person mit Schreibzugriff hat Issue #${{ github.event.issue.number }}
            kommentiert (Stichwort @claude) und damit eine Neu-Analyse (Re-Triage) angefordert.

            Fuehre fuer GENAU DIESES EINE Issue (#${{ github.event.issue.number }}) den
            Ticket-Triage-Workflow aus der Wissensbasis aus — verbindlicher Ablauf:
            .ai-knowledge/ticket-triage.md (entspricht dem Slash-Command
            `/triage-ticket ${{ github.event.issue.number }}`).

            Behandle es als Re-Triage (Schritt 1 der Wissensbasis): eine bereits vorhandene
            KI-Analyse nicht unveraendert uebernehmen, sondern auf Passung und Vollstaendigkeit
            zur (ggf. geaenderten) Aufgabenstellung pruefen und bei Bedarf aktualisieren bzw.
            ergaenzen. Dann wie im Ablauf: Beschreibung lektorieren (Inhalt unveraendert), am Ende
            den Titel auf Konsistenz zur Beschreibung/zum Ziel pruefen und bei Inkonsistenz
            inhaltlich treu optimieren (kein Edit pro forma, keine Titel-Drift),
            Loesungs-Kommentar auf Deutsch mit Umsetzbarkeits-Ampel (gruen/gelb/rot) posten und
            Labels gemaess Ampel setzen (`ai:analyzed`; bei gruen zusaetzlich `ai:spec-ready` (Output
            der Spec-Stufe; NICHT `ai:ready`), bei gelb/rot ein evtl. vorhandenes
            `ai:spec-ready`/`ai:ready` entfernen).

            Bearbeite ausschliesslich dieses eine Issue (kein Batch). Committe keinen Produktivcode.

      # Bei hartem Timeout (Agent-Schritt cancelled) ist das Issue zu gross, um es in einem Lauf zu
      # analysieren: mit "ai:to-big-issue" markieren (Kandidat zum Aufteilen) und ein evtl.
      # vorhandenes "ai:ready" entfernen. Laeuft im Cancellation-Grace-Fenster (if: always(), ~5 Min).
      # Zeit-Guard (WICHTIG bei cancel-in-progress: true): nur labeln, wenn der Lauf das 20-Min-Limit
      # nahezu ausgeschoepft hat (>= 18 Min). Ein durch einen neueren @claude-Kommentar verdraengter
      # Lauf (Concurrency-Supersede) erzeugt ebenfalls outcome=cancelled, passiert aber frueher und
      # faellt so heraus — sonst wuerde ein nur ueberholtes Issue faelschlich als "zu gross" markiert.
      - name: Bei Timeout als zu gross markieren (ai:to-big-issue)
        if: always() && (steps.claude.outcome == 'cancelled' || steps.mistral.outcome == 'cancelled')
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_START: ${{ steps.starttime.outputs.epoch }}
        run: |
          elapsed=$(( $(date +%s) - ${RUN_START:-0} ))
          if [ "${RUN_START:-0}" -eq 0 ] || [ "$elapsed" -lt 1080 ]; then
            echo "::notice title=Kein Timeout::Lauf nach ${elapsed}s abgebrochen (< 18 Min) — vermutlich Supersede/Cancel, kein ai:to-big-issue."
            exit 0
          fi
          gh label create "ai:to-big-issue" --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "KI-Job lief in den Timeout — Issue zu gross, bitte aufteilen" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:spec-ready" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:ready" 2>/dev/null || true
          echo "::warning title=Issue #${ISSUE} zu gross::20-Min-Timeout erreicht (${elapsed}s) — Label ai:to-big-issue gesetzt; bitte Issue aufteilen."

      # Deterministisches Abschluss-Signal (unabhaengig von der LLM-Ausgabe): laeuft auch bei
      # Abbruch/Timeout (if: always()) und macht im Log/Job-Summary klar sichtbar, DASS und mit
      # welchem Ergebnis der Lauf fertig ist. outcome=cancelled signalisiert das 20-Min-Timeout.
      - name: Ergebnis zusammenfassen
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          AGENT: ${{ vars.AI_AGENT == 'mistral' && 'Mistral' || 'Claude' }}
          # Outcome des tatsaechlich gelaufenen Agent-Schritts (der andere ist 'skipped').
          OUTCOME: ${{ steps.claude.outcome != 'skipped' && steps.claude.outcome || steps.mistral.outcome }}
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          {
            echo "### Re-Triage #${ISSUE} — fertig"
            echo ""
            echo "- ${AGENT}-Schritt: \`${OUTCOME:-unbekannt}\` (cancelled = 20-Min-Timeout erreicht)"
            echo "- Aktuelle Labels: ${labels:-keine}"
            if [ -n "$SESSION_ID" ]; then echo "- Session-ID: \`${SESSION_ID}\` (\`--resume\` zum Nachschauen)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Re-Triage #${ISSUE} fertig::${AGENT}-Schritt ${OUTCOME:-unbekannt}; Labels: ${labels:-keine}"
