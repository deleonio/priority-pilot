name: Claude Re-Triage

# Stoesst eine KI-Neu-Analyse (Re-Triage) eines Issues an, sobald jemand mit
# Schreibzugriff einen Issue-Kommentar mit dem Stichwort "@claude" hinterlaesst
# ODER einen Kommentar so bearbeitet, dass er "@claude" enthaelt.
# Setzt den Ticket-Triage-Ablauf fuer genau dieses eine Issue um (Re-Triage).
# Ablauf/Hintergrund: .ai-knowledge/ticket-triage.md und .claude/commands/triage-ticket.md
#
# Voraussetzung: Repository-Secret CLAUDE_CODE_OAUTH_TOKEN (per `claude setup-token`).

on:
  issue_comment:
    # Nur `created` (neuer Kommentar) — NICHT `edited`: das nachtraegliche Einfuegen von "@claude"
    # in einen (ggf. Jahre alten) Kommentar waere ein Spam-/Missbrauchsvektor, weil dabei kein
    # sichtbarer neuer Kommentar in der UI entsteht. Wer eine Re-Triage will, schreibt einen neuen
    # @claude-Kommentar (created feuert zuverlaessig).
    types: [created]

# Pro Issue nur ein Lauf gleichzeitig. cancel-in-progress: true -> eine neue Aenderung
# (weiterer/bearbeiteter @claude-Kommentar) am selben Issue bricht den noch laufenden
# Re-Triage-Lauf ab, damit immer nur die juengste Analyse durchlaeuft (aeltere, ueberholte
# Laeufe werden verworfen). Ein abgebrochener Teil-Lauf ist unkritisch: der naechste Lauf
# fuehrt die Re-Triage vollstaendig neu aus.
concurrency:
  group: claude-retriage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  re-triage:
    # Nur ausloesen, wenn ALLE Bedingungen zutreffen:
    #  - echtes Issue, kein PR (issue_comment feuert auch fuer PRs -> pull_request == null)
    #  - der Kommentar enthaelt das Stichwort @claude
    #  - der Kommentar stammt von jemandem mit Schreibzugriff (OWNER/MEMBER/COLLABORATOR),
    #    damit Aussenstehende den Lauf (und das OAuth-Token) nicht ausloesen koennen.
    #    Die Action prueft den Schreibzugriff zwar zusaetzlich selbst, dies ist die
    #    vorgeschaltete, billige Absicherung (kein Runner-Start fuer Fremde).
    if: >-
      ${{ github.event.issue.pull_request == null
          && contains(github.event.comment.body, '@claude')
          && (github.event.comment.author_association == 'OWNER'
              || github.event.comment.author_association == 'MEMBER'
              || github.event.comment.author_association == 'COLLABORATOR') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Repo auschecken (Slash-Command + Wissensbasis lesen)
      issues: write # Beschreibung lektorieren + Analyse-Body-Block schreiben, Ping-Kommentar posten, Labels setzen
      id-token: write # OIDC-Token der Action; ohne diese Permission fehlt ACTIONS_ID_TOKEN_REQUEST_URL
    steps:
      # Startzeit fuer die Timeout-Erkennung (siehe Zeit-Guard im Label-Schritt unten).
      - name: Startzeit merken (fuer Timeout-Erkennung)
        id: starttime
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # GitHub-App-Token (optional): Setzt die Re-Triage `ai:spec-ready` als App-Bot, loest das den
      # Spec-Workflow (claude-spec.yml) aus. Mit dem Standard-GITHUB_TOKEN gesetzte Labels triggern
      # KEINE Folge-Workflows. Fehlen die App-Secrets, faellt GH_TOKEN auf github.token zurueck
      # (Re-Triage laeuft normal, nur der Spec-Auto-Trigger entfaellt dann).
      - name: Voraussetzung pruefen (GitHub-App-Secrets, optional)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::notice::GitHub-App-Secrets fehlen — Re-Triage laeuft mit GITHUB_TOKEN; der Auto-Trigger der Spec-Stufe (ai:spec-ready -> claude-spec.yml) entfaellt. Fuer den Trigger eine GitHub App (Issues/Contents/Pull requests = Read and write) als APP_ID + APP_PRIVATE_KEY hinterlegen."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Deterministischer Agent-Secret-Check (Haerten S2): das Opt-in fuer GLM/Mistral (und die
      # OAuth-Token-Voraussetzung fuer Claude) darf NICHT still skippen — fehlt das zum aktiven
      # AI_AGENT-Pfad gehoerige Secret, bricht der Lauf hier deterministisch mit einem klaren
      # ::error:: ab (statt erst spaet in der claude-code-action/vibe-Action kryptisch zu sterben).
      # Ai:to-big-issue markiert das Issue als "Mensch muss handeln", damit es nicht still stale steht
      # (das Label triggert bewusst KEINEN Folge-Workflow, gesetzt mit github.token wie die Timeouts).
      - name: Agent-Secret prüfen (kein stiller Skip)
        env:
          AI_AGENT: ${{ vars.AI_AGENT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          missing=""
          # Haerten C2-Nachtrag: GitHub-Actions-`==` (die if:-Bedingungen der Agent-Schritte)
          # vergleicht Strings case-insensitiv, Bashs `case` NICHT. Ohne `,,`-Lowering wuerde
          # z. B. AI_AGENT=GLM zum GLM-Schritt routen, aber hier in den `*)`-Default-Zweig fallen
          # (CLAUDE_CODE_OAUTH_TOKEN statt ZAI_API_KEY geprueft) — der S2-Stille-Skip waere ueber
          # Gross-/Kleinschreibung wieder offen.
          case "${AI_AGENT,,}" in
            glm)     [ -z "$ZAI_API_KEY" ] && missing="ZAI_API_KEY" ;;
            mistral) [ -z "$MISTRAL_API_KEY" ] && missing="MISTRAL_API_KEY" ;;
            *)       [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && missing="CLAUDE_CODE_OAUTH_TOKEN" ;;
          esac
          if [ -n "$missing" ]; then
            echo "::error title=Agent-Secret fehlt::AI_AGENT='${AI_AGENT:-claude}' benoetigt Secret '$missing' — fehlt es, darf der Lauf nicht still skippen (AGENTS.md: bewusstes Opt-in). Secret als Repo-Secret hinterlegen."
            gh label create "ai:to-big-issue" --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "KI-Job lief rot (Konfiguration/Secret) — bitte pruefen" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue" 2>/dev/null || true
            exit 1
          fi
          echo "Agent-Secret fuer AI_AGENT='${AI_AGENT:-claude}' vorhanden."

      # Standard-Pfad (Claude): laeuft, solange die Repo-Variable AI_AGENT NICHT auf "mistral"
      # oder "glm" steht (auch ungesetzt -> Claude bleibt Default). Umschalten:
      # `gh variable set AI_AGENT --body glm` (Z.ai GLM) oder
      # `gh variable set AI_AGENT --body mistral` (Mistral Vibe);
      # zurueck: `gh variable set AI_AGENT --body claude`.
      - name: Re-Triage via Claude Code
        id: claude
        if: vars.AI_AGENT != 'mistral' && vars.AI_AGENT != 'glm'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1.0.165
        env:
          # gh nutzt das App-Token (falls vorhanden) -> das gesetzte ai:spec-ready loest den
          # Spec-Workflow aus; ohne App-Secrets Fallback auf github.token.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Re-Triage fuer genau dieses eine Issue. Bewusst natuerlichsprachig formuliert
          # (nicht als Slash-Command), da die Action keine garantierte Slash-Command-
          # Ausfuehrung im prompt zusichert; verweist aber auf den verbindlichen Ablauf.
          prompt: |
            Eine Person mit Schreibzugriff hat Issue #${{ github.event.issue.number }}
            kommentiert (Stichwort @claude) und damit eine Neu-Analyse (Re-Triage) angefordert.

            Fuehre fuer GENAU DIESES EINE Issue (#${{ github.event.issue.number }}) den
            Ticket-Triage-Workflow aus der Wissensbasis aus — verbindlicher Ablauf:
            .ai-knowledge/ticket-triage.md (entspricht dem Slash-Command
            `/triage-ticket ${{ github.event.issue.number }}`).

            Behandle es als Re-Triage (Schritt 1 der Wissensbasis): die vorhandene KI-Analyse lebt
            im Body-Block (`<!-- KI-ANALYSE:START stand=... -->` ... `<!-- KI-ANALYSE:END -->`). Sie
            nicht unveraendert uebernehmen: den `stand`-Timestamp aus dem Block auslesen und NUR die
            Delta-Kommentare seit `stand` lesen (gh issue view <nr> --json comments
            -q '.comments[] | select(.createdAt > "<stand>")'), NICHT den ganzen Thread; auf Passung
            und Vollstaendigkeit zur (ggf. geaenderten) Aufgabenstellung pruefen, beantwortete offene
            Fragen einarbeiten/entfernen und bei Bedarf aktualisieren bzw. ergaenzen. Fehlt der
            Body-Block (Alt-Issue), neu anlegen. Dann wie im Ablauf: Beschreibung lektorieren (Inhalt
            unveraendert), am Ende den Titel auf Konsistenz zur Beschreibung/zum Ziel pruefen und bei
            Inkonsistenz inhaltlich treu optimieren (kein Edit pro forma, keine Titel-Drift), die
            Analyse auf Deutsch mit Umsetzbarkeits-Ampel (gruen/gelb/rot) am Anfang in die
            Beschreibung schreiben — als Block zwischen den Markern
            `<!-- KI-ANALYSE:START stand=... -->` und `<!-- KI-ANALYSE:END -->`
            (stand = `date -u +%Y-%m-%dT%H:%M:%SZ`, bei jedem Schreiben neu) via
            `gh issue edit <nr> --body-file -`; NUR den Block zwischen den Markern in-place ersetzen,
            die Original-Beschreibung oberhalb des START-Markers NICHT ueberschreiben. KEINE
            Vollanalyse mehr als Kommentar. Danach genau EINEN kurzen Ping-Kommentar posten
            (`gh issue comment`: Hinweis, dass die Analyse in der Beschreibung aktualisiert wurde; nur
            bei offenen Fragen zusaetzlich @<issue-author> + die offenen Fragen).

            ALLERLETZTER Schritt, NIE davor: Labels gemaess Ampel setzen (`ai:analyzed`; bei gruen
            zusaetzlich `ai:spec-ready` (Output der Spec-Stufe; NICHT `ai:ready`), bei gelb/rot ein
            evtl. vorhandenes `ai:spec-ready`/`ai:ready` entfernen). Setze Labels ERST, NACHDEM die
            Beschreibung (Body-Block) UND der Ping-Kommentar bereits geschrieben/gepostet sind — das
            Setzen von `ai:spec-ready` startet SOFORT die naechste Pipeline-Stufe (claude-spec.yml),
            die die Beschreibung unmittelbar danach liest. Ist sie zu diesem Zeitpunkt noch nicht
            aktualisiert, arbeitet die Spec-Stufe mit veraltetem Issue-Inhalt.

            HARTES Zeitlimit (Haerten L1): Dieser Lauf wird nach 20 Minuten hart abgebrochen. Merkst
            du, dass es eng wird, sichere SPAETESTENS nach ~18 Minuten den Zwischenstand: schreibe die
            bisherige Analyse (auch wenn unvollstaendig) als Body-Block in die Beschreibung, aber setze
            KEIN Label und poste KEINEN Ping-Kommentar — so bleibt das Issue fuer einen saubereren
            Folgelauf offen, statt dass der Timeout den gesamten Fortschritt verwirft.

            Bearbeite ausschliesslich dieses eine Issue (kein Batch). Committe keinen Produktivcode.
          # Nur die im Triage-Ablauf benoetigten Tools zulassen (headless, keine interaktive
          # Freigabe) und die in der Wissensbasis geforderte Bestaetigung als durch den
          # @claude-Ausloeser erteilt behandeln.
          claude_args: >-
            --model claude-opus-4-8 --effort max
            --allowedTools "Bash(gh issue:*),Bash(gh api:*),Bash(gh label:*),Read,Grep,Glob,Task"
            --append-system-prompt "Automatisierter, vom Maintainer per @claude-Kommentar autorisierter Re-Triage-Lauf in GitHub Actions (headless, keine interaktive Rueckfrage moeglich). Die in der Wissensbasis geforderte Bestaetigung vor dem oeffentlichen Posten gilt durch den @claude-Ausloeser als erteilt: Schreibe Lektorat und Analyse-Body-Block, poste einen kurzen Ping-Kommentar und setze die Labels ALS ALLERLETZTEN Schritt (NIE davor — sonst startet die naechste Pipeline-Stufe mit veraltetem Issue-Inhalt) fuer Issue #${{ github.event.issue.number }}, ohne auf eine Bestaetigung zu warten. Bearbeite ausschliesslich dieses Issue und committe keinen Produktivcode. HARTES 20-Minuten-Timeout: sichere bei drohendem Limit (~18 Min) die bisherige Analyse als Body-Block (kein Label, kein Ping-Kommentar), statt einen vollen Durchlauf zu erzwingen. Modell-Strategie: Du laeufst fest auf Opus (claude-opus-4-8, --effort max) — fuer die Re-Triage-Analyse ist bewusst das staerkste Modell verdrahtet, damit die Analyse optimal ausfaellt. Fuehre die Analyse vollstaendig selbst durch (keine Eskalation an heavy noetig — du BIST bereits das staerkste Modell); allenfalls triviale mechanische Nebenschritte darfst du per Agent-Tool an light (Haiku) delegieren."

      # Mistral-Pfad (AI_AGENT == 'mistral'): Vibe laeuft headless OHNE Approval-Callback — ohne
      # erzwungenes Auto-Approve wuerde jedes genehmigungspflichtige Tool (gh/git/pnpm/Datei-Writes)
      # als "Tool execution not permitted" uebersprungen. default_agent=auto-approve setzt
      # bypass_tool_permissions=true; ~/.vibe/config.toml ist der Default-Konfig-Ort (VIBE_HOME).
      - name: Vibe-Konfig (Headless Auto-Approve)
        if: vars.AI_AGENT == 'mistral'
        run: |
          mkdir -p "$HOME/.vibe"
          cat > "$HOME/.vibe/config.toml" <<'EOF'
          default_agent = "auto-approve"
          bypass_tool_permissions = true
          EOF

      # Spiegelt den Claude-Schritt: gleicher Ablauf, anderer Agent. Die Vibe-Action reicht KEINE
      # Extra-Flags durch — daher System-Prompt-Regeln als fuehrender [KONTEXT]-Block im prompt;
      # Tool-Restriktion wie bei Claude ist hier nicht erzwingbar (Auto-Approve gibt alle Tools frei).
      - name: Re-Triage via Mistral Vibe
        id: mistral
        if: vars.AI_AGENT == 'mistral'
        uses: mistralai/mistral-vibe@474a0e4055b210a60c39ed0c89458d904b7f6a7b # v2.19.0
        env:
          # gh nutzt das App-Token (falls vorhanden) -> ai:spec-ready loest den Spec-Workflow aus;
          # ohne App-Secrets Fallback auf github.token.
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        with:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          args: --trust
          prompt: |
            [KONTEXT/REGELN] Automatisierter, vom Maintainer per @claude-Kommentar autorisierter
            Re-Triage-Lauf in GitHub Actions (headless, keine interaktive Rueckfrage moeglich). Die
            in der Wissensbasis geforderte Bestaetigung vor dem oeffentlichen Posten gilt durch den
            @claude-Ausloeser als erteilt. Nutze fuer GitHub-Operationen ausschliesslich die
            `gh`-CLI; committe keinen Produktivcode und bearbeite ausschliesslich Issue
            #${{ github.event.issue.number }}.

            Eine Person mit Schreibzugriff hat Issue #${{ github.event.issue.number }}
            kommentiert (Stichwort @claude) und damit eine Neu-Analyse (Re-Triage) angefordert.

            Fuehre fuer GENAU DIESES EINE Issue (#${{ github.event.issue.number }}) den
            Ticket-Triage-Workflow aus der Wissensbasis aus — verbindlicher Ablauf:
            .ai-knowledge/ticket-triage.md (entspricht dem Slash-Command
            `/triage-ticket ${{ github.event.issue.number }}`).

            Behandle es als Re-Triage (Schritt 1 der Wissensbasis): die vorhandene KI-Analyse lebt
            im Body-Block (`<!-- KI-ANALYSE:START stand=... -->` ... `<!-- KI-ANALYSE:END -->`). Sie
            nicht unveraendert uebernehmen: den `stand`-Timestamp aus dem Block auslesen und NUR die
            Delta-Kommentare seit `stand` lesen (gh issue view <nr> --json comments
            -q '.comments[] | select(.createdAt > "<stand>")'), NICHT den ganzen Thread; auf Passung
            und Vollstaendigkeit zur (ggf. geaenderten) Aufgabenstellung pruefen, beantwortete offene
            Fragen einarbeiten/entfernen und bei Bedarf aktualisieren bzw. ergaenzen. Fehlt der
            Body-Block (Alt-Issue), neu anlegen. Dann wie im Ablauf: Beschreibung lektorieren (Inhalt
            unveraendert), am Ende den Titel auf Konsistenz zur Beschreibung/zum Ziel pruefen und bei
            Inkonsistenz inhaltlich treu optimieren (kein Edit pro forma, keine Titel-Drift), die
            Analyse auf Deutsch mit Umsetzbarkeits-Ampel (gruen/gelb/rot) am Anfang in die
            Beschreibung schreiben — als Block zwischen den Markern
            `<!-- KI-ANALYSE:START stand=... -->` und `<!-- KI-ANALYSE:END -->`
            (stand = `date -u +%Y-%m-%dT%H:%M:%SZ`, bei jedem Schreiben neu) via
            `gh issue edit <nr> --body-file -`; NUR den Block zwischen den Markern in-place ersetzen,
            die Original-Beschreibung oberhalb des START-Markers NICHT ueberschreiben. KEINE
