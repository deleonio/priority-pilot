name: tmp-pi5-workspace-fix
# Temporaer: loescht root-gehoerige Dateien im pi5-Runner-Workspace
# (entstehen, wenn Agent-Jobs Docker-Container auf den Workspace mounten).
# Wird nach Gebrauch wieder entfernt.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  fix:
    runs-on: pi5
    timeout-minutes: 5
    steps:
      - name: Root-owned Dateien listen
        run: |
          docker run --rm -v /home/gh-runner/actions-runner/_work:/work alpine sh -c \
            "find /work/priority-pilot/priority-pilot -user 0 | head -30; echo '--- count:'; find /work/priority-pilot/priority-pilot -user 0 | wc -l"
      - name: Root-owned Dateien loeschen
        run: |
          docker run --rm -v /home/gh-runner/actions-runner/_work:/work alpine sh -c \
            "find /work/priority-pilot/priority-pilot -depth -user 0 -exec rm -rf {} + 2>/dev/null; echo 'rest: '; find /work/priority-pilot/priority-pilot -user 0 | wc -l"
