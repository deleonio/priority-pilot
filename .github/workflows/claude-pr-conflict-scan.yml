name: PR Conflict Scan

# Erkennt Merge-Konflikte in offenen PRs bei jedem Push auf main und setzt
# ai:needs-fixup, damit die Umsetzungsphase (04-claude-implement.yml) sie automatisch auflöst.
# Kein eigener Auflöser — die Auflösung übernimmt 04-claude-implement.yml (PR-Eingang).
#
# Muster: pr-needs-review-label.yml (App-Token), claude-pr-gate-merge.yml (DIRTY-Erkennung).

on:
  push:
    branches:
      - main

concurrency:
  group: pr-conflict-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Voraussetzung prüfen (GitHub-App-Secrets)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::GitHub-App-Secrets fehlen (APP_ID und/oder APP_PRIVATE_KEY) — Lauf wird übersprungen (kein Fehler). GitHub App anlegen, aufs Repo installieren und beide Werte als Repo-Secrets hinterlegen, damit die Pipeline läuft."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: GH_TOKEN-Fallback setzen (App-Token oder GITHUB_TOKEN)
        id: gh-token
        run: |
          APP_TOK="${{ steps.app-token.outputs.token }}"
          if [ -n "$APP_TOK" ] && [ "$APP_TOK" != "null" ]; then
            echo "token=$APP_TOK" >> "$GITHUB_OUTPUT"
            echo "::notice::Nutze GitHub-App-Token für gh-Befehle."
          else
            echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
            echo "::warning::App-Token nicht verfügbar — nutze GITHUB_TOKEN (Achtung: Label-Wechsel lösen ggf. keine Folge-Workflows aus)."
          fi

      # Checkout NUR fuer label-transition.sh (persist-credentials: false — der Job
      # schreibt nach GitHub ausschliesslich via App-Token).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.preflight.outputs.configured == 'true'
        with:
          persist-credentials: false

      - name: Alle offenen PRs auf Merge-Konflikte prüfen
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Alle offenen PRs auflisten (kein --label-Filter: alle offenen PRs prüfen, nicht nur markierte)
          # --repo bleibt Pflicht: der Checkout oben dient NUR label-transition.sh, der Loop
          # laeuft bewusst repo-agnostisch ueber die API.
          prs=$(gh pr list --repo "$REPO" --state open --json number,isDraft,headRepository \
            --jq '.[] | select(.isDraft == false) | select(.headRepository.nameWithOwner == $ENV.REPO) | .number')

          if [ -z "$prs" ]; then
            echo "Keine offenen Nicht-Draft-same-repo-PRs gefunden — nichts zu tun."
            exit 0
          fi

          for pr in $prs; do
            # Merge-Status und Labels abfragen
            view="$(gh pr view "$pr" --repo "$REPO" --json mergeable,mergeStateStatus,labels)"
            mergeable="$(echo "$view" | jq -r '.mergeable')"
            merge_state="$(echo "$view" | jq -r '.mergeStateStatus')"

            echo "PR #$pr: mergeable=$mergeable, mergeStateStatus=$merge_state"

            # UNKNOWN: No-op — GitHub berechnet Mergebarkeit asynchron direkt nach Push (kein Fehl-Positiv)
            if [ "$mergeable" = "UNKNOWN" ] || [ "$merge_state" = "UNKNOWN" ]; then
              echo "PR #$pr: UNKNOWN — No-op (async, Mergebarkeit wird noch berechnet)."
              continue
            fi

            # MERGEABLE: kein Konflikt — No-op
            if [ "$mergeable" = "MERGEABLE" ]; then
              echo "PR #$pr: MERGEABLE — kein Konflikt, No-op."
              continue
            fi

            # DIRTY / CONFLICTING: Merge-Konflikt erkannt → ai:needs-fixup setzen
            if [ "$merge_state" = "DIRTY" ] || [ "$mergeable" = "CONFLICTING" ]; then
              # Idempotenz-Guard: ai:needs-fixup bereits gesetzt → idempotent überspringen (kein Label-Flackern)
              labels="$(echo "$view" | jq -r '[.labels[].name? // empty]')"
              if [ "$(echo "$labels" | jq -r 'any(.[]; . == "ai:needs-fixup")')" = "true" ]; then
                echo "PR #$pr: ai:needs-fixup bereits gesetzt — idempotent, No-op."
                continue
              fi

              echo "PR #$pr: Merge-Konflikt erkannt (mergeable=$mergeable, state=$merge_state) — setze ai:needs-fixup."
              # EINE atomare Transition zu ai:needs-fixup (PR #890): Das alte reine Add
              # liess ein evtl. klebendes ai:needs-review UNBERÜHRT — beide Trigger
              # gleichzeitig am PR erzeugten Review- und Fixup-Run nebeneinander. Die
              # Transition ersetzt den gesamten Pipeline-Bestand, die Invariante gilt
              # damit per Konstruktion. --forbid = Oszillationsschutz zur Laufzeit
              # (der Check oben las den Zustand nur einmalig). Transition verwirft bei
              # klebendem ai:needs-human — Parker bleibt, Konflikt wartet auf den Menschen (PR #903).
              if ! OUT="$(bash .github/scripts/label-transition.sh \
                  --repo "$REPO" --pr "$pr" --set ai:needs-fixup --forbid ai:needs-fixup)"; then
                echo "::error::PR #$pr: Label-Transition zu ai:needs-fixup endgültig fehlgeschlagen"
                continue
              fi
              if [ "$(printf '%s\n' "$OUT" | sed -n 's/^applied=//p')" != "true" ]; then
                echo "PR #$pr: Transition verworfen ($(printf '%s\n' "$OUT" | sed -n 's/^reason=//p')) — kein Fixup-Trigger gesetzt."
              fi

              {
                echo "### PR #${pr} — ai:needs-fixup wegen Merge-Konflikt gesetzt"
                echo ""
                echo "- Merge-Konflikte erkannt (mergeable=$mergeable, state=$merge_state)"
                echo "- Folge: 04-claude-implement.yml (PR-Eingang) wird ausgelöst."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "PR #$pr: Nicht sauber mergebar (mergeable=$mergeable, state=$merge_state) — No-op."
            fi
          done
