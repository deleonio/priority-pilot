name: Cache-Aufraeumen

# Der Repo-Cache (GitHub Actions, 10-GB-Limit) fuellte sich zuletzt spuerbar aus pnpm-Store- und
# Playwright-Browser-Caches (ci.yml/deploy.yml/03-claude-spec.yml/04-claude-implement.yml/
# 06-claude-pr-fixup.yml, alle per `cache: pnpm` bzw. eigenem `actions/cache`-Schritt keyed auf den
# pnpm-lock.yaml-Hash). Jeder Lockfile-Hash-Wechsel (z. B. wenn ein Umsetzungs-Workflow eine neue
# Dependency committet) erzeugt einen NEUEN, ~130-260 MiB grossen Eintrag, der nach einem Merge/
# Verwerfen des Branches nie wieder getroffen wird und sonst bis zu GitHubs impliziter 7-Tage-
# Eviction bzw. dem 10-GB-Limit liegen bleibt. Dieser Job erzwingt stattdessen eine harte 1-Tag-
# Obergrenze fuer genau diese Cache-Arten.
#
# `hermes-session-*`-Caches (Named Session Resume, siehe .github/actions/session-save) sind seit
# der Artefakt-Umstellung (2026-07-10) VERWAIST: das Sitzungsarchiv liegt jetzt in
# Workflow-Artefakten (GitHubs Read-only-Cache fuer untrusted Trigger, Changelog 2026-06-26,
# machte Cache-Saves aus den Issue-Workflows unmoeglich). Es werden keine neuen
# hermes-session-Caches mehr geschrieben -- Altbestaende werden hier mit abgeraeumt (ohne
# Altersgrenze, sie sind ersatzlos tot), bis keiner mehr auftaucht.
#
# `ticket-*`-Caches sind ein ebenfalls verwaister Legacy-Typ (Pro-Issue-Caches a ~1-2 KiB), der
# von keinem aktuellen Workflow mehr geschrieben wird (die Issue-Memory-Persistierung laeuft
# seit 2026-08-16 ausschliesslich ueber Workflow-ARTEFAKTE -- der Cache-Weg ist fuer die
# Claude-Phasen platform-seitig schreib-tot, s. setup-claude Kopf-Kommentar; der frueher hier
# genannte Begleitworkflow claude-memory-save.yml wurde deshalb entfernt). Sie werden hier ohne
# Altersgrenze abgeraeumt, bis der Altbestand (51 Eintraege bei Messung 2026-08-15) auf null
# geschrumpft ist.
#
# `codeql-overlay-base-database-*`-Caches (vom github/codeql-action automatisch verwaltet) werden
# hier NICHT geloescht -- ihre Reduktion erfolgt ueber die Trigger-Aenderung in codeql.yml
# (Schedule-only statt pro Push/PR). Sie fallen innerhalb von 7 Tagen an GitHubs Eviction.

on:
  schedule:
    - cron: '17 3 * * *' # taeglich 03:17 UTC, versetzt zu Renovate (Mo 04:00 UTC)
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cache-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: pnpm-/Playwright-Caches aelter als 24h + verwaiste Altbestaende loeschen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          cutoff_epoch=$(( $(date -u +%s) - 86400 ))

          # Caches in eine Datei schreiben (Prozess-Substitution statt Pipe, damit
          # set -e / Exit-Codes in der Schleife nicht durch die Subshell verschluckt werden).
          # --limit 300: bei Messung 2026-08-15 178 Caches, Reserve fuer Wachstum.
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 300 \
            --json id,key,createdAt \
            --jq '.[] | select(.key | startswith("node-cache-") or startswith("Linux-playwright-") or startswith("hermes-session-") or startswith("ticket-")) | [.id, .key, .createdAt] | @tsv' \
            > /tmp/caches-to-check.tsv

          total=$(wc -l < /tmp/caches-to-check.tsv)
          deleted=0
          kept=0
          failed=0

          while IFS=$'\t' read -r id key created; do
            [ -z "$id" ] && continue
            created_epoch=$(date -u -d "$created" +%s)
            # Verwaiste Altbestaende (Archiv liegt jetzt in Artefakten oder Typ wird nicht
            # mehr geschrieben) -- ohne Altersgrenze loeschen; alles andere erst nach 24h.
            if [ "${key#hermes-session-}" != "$key" ] || [ "${key#ticket-}" != "$key" ] || [ "$created_epoch" -lt "$cutoff_epoch" ]; then
              if gh cache delete "$id" --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
                echo "Loesche Cache '$key' (id=$id, erstellt $created)"
                deleted=$((deleted + 1))
              else
                echo "::warning::Loeschen von Cache $id ($key) fehlgeschlagen (uebersprungen)"
                failed=$((failed + 1))
              fi
            else
              echo "Behalte Cache '$key' (id=$id, erstellt $created, < 24h alt)"
              kept=$((kept + 1))
            fi
          done < /tmp/caches-to-check.tsv

          echo ""
          echo "=== Zusammenfassung ==="
          echo "Caches geprueft: $total"
          echo "Caches geloescht: $deleted"
          echo "Caches behalten:  $kept (< 24h alt)"
          echo "Fehlschlaege:     $failed"
