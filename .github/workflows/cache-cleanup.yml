name: Cache-Aufraeumen

# Der Repo-Cache (GitHub Actions, 10-GB-Limit) fuellte sich zuletzt spuerbar aus pnpm-Store- und
# Playwright-Browser-Caches (ci.yml/deploy.yml/hermes-spec.yml/hermes-implement.yml/
# hermes-pr-fixup.yml, alle per `cache: pnpm` bzw. eigenem `actions/cache`-Schritt keyed auf den
# pnpm-lock.yaml-Hash). Jeder Lockfile-Hash-Wechsel (z. B. wenn ein Umsetzungs-Workflow eine neue
# Dependency committet) erzeugt einen NEUEN, ~130-260 MiB grossen Eintrag, der nach einem Merge/
# Verwerfen des Branches nie wieder getroffen wird und sonst bis zu GitHubs impliziter 7-Tage-
# Eviction bzw. dem 10-GB-Limit liegen bleibt. Dieser Job erzwingt stattdessen eine harte 1-Tag-
# Obergrenze fuer genau diese beiden Cache-Arten.
#
# `hermes-session-*`-Caches (Named Session Resume, siehe .github/actions/session-save) sind seit
# der Artefakt-Umstellung (2026-07-10) VERWAIST: das Sitzungsarchiv liegt jetzt in
# Workflow-Artefakten (GitHubs Read-only-Cache fuer untrusted Trigger, Changelog 2026-06-26,
# machte Cache-Saves aus den Issue-Workflows unmoeglich). Es werden keine neuen
# hermes-session-Caches mehr geschrieben -- Altbestaende werden hier mit abgeraeumt (ohne
# Altersgrenze, sie sind ersatzlos tot), bis keiner mehr auftaucht.

on:
  schedule:
    - cron: '17 3 * * *' # taeglich 03:17 UTC, versetzt zu Renovate (Mo 04:00 UTC)
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cache-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: pnpm-/Playwright-Caches aelter als 24h + verwaiste Session-Caches loeschen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cutoff_epoch=$(( $(date -u +%s) - 86400 ))

          gh cache list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json id,key,createdAt \
            --jq '.[] | select(.key | startswith("node-cache-") or startswith("Linux-playwright-") or startswith("hermes-session-")) | [.id, .key, .createdAt] | @tsv' \
          | while IFS=$'\t' read -r id key created; do
              created_epoch=$(date -u -d "$created" +%s)
              # hermes-session-*: verwaiste Altbestaende (Archiv liegt jetzt in Artefakten) --
              # ohne Altersgrenze loeschen; alles andere erst nach 24h.
              if [ "${key#hermes-session-}" != "$key" ] || [ "$created_epoch" -lt "$cutoff_epoch" ]; then
                echo "Loesche Cache '$key' (id=$id, erstellt $created)"
                gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || echo "::warning::Loeschen von Cache $id fehlgeschlagen (uebersprungen)"
              else
                echo "Behalte Cache '$key' (id=$id, erstellt $created, < 24h alt)"
              fi
            done
