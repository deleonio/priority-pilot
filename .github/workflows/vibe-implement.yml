name: Mistral Vibe Implement (ai:ready)

# Setzt ein Issue um, sobald es das Label "ai:ready" erhaelt UND bereits
# "ai:analyzed" traegt. Ersetzt claude-implement.yml (MIG-001, 2026-07-10).
#
# Setzt Mistral Vibe Agent (Nous Research) -- Provider waehlbar per Issue-Label:
#   ai:use-openrouter (Default): DeepSeek via OpenRouter (MISTRAL_API_KEY)
#   ai:use-nous:         Nous Portal direkt (MISTRAL_API_KEY)
#   ai:use-zai:          Z.AI direkt (MISTRAL_API_KEY, GLM-Modelle)
# Ohne Label ? OpenRouter + DeepSeek.
#
# Voraussetzungen: MISTRAL_API_KEY

on:
  issues:
    types: [labeled]

concurrency:
  group: vibe-implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: >-
      ${{ github.event.label.name == 'ai:ready'
          && contains(github.event.issue.labels.*.name, 'ai:analyzed')
          && github.event.issue.state == 'open'
          && (contains(github.event.issue.labels.*.name, 'ai:use-mistral') || contains(github.event.issue.labels.*.name, 'ai:use-nous') || contains(github.event.issue.labels.*.name, 'ai:use-zai') || !contains(github.event.issue.labels.*.name, 'ai:use-claude')) }}
    runs-on: ubuntu-latest
    env:
      VIBE_HOME: /tmp/vibe-ci
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: write
      issues: write
    steps:
      - name: Startzeit merken (fuer Timeout-Erkennung + weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 900))" >> "$GITHUB_OUTPUT"  # 15 min (Puffer vor 20-Min-GitHub-Timeout)

      - name: Voraussetzung pruefen (GitHub-App-Secrets)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::GitHub-App-Secrets fehlen -- Lauf wird uebersprungen."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: GH_TOKEN-Fallback setzen (App-Token oder GITHUB_TOKEN)
        id: gh-token
        run: |
          APP_TOK="${{ steps.app-token.outputs.token }}"
          if [ -n "$APP_TOK" ] && [ "$APP_TOK" != "null" ]; then
            echo "token=$APP_TOK" >> "$GITHUB_OUTPUT"
            echo "::notice::Nutze GitHub-App-Token fuer gh-Befehle."
          else
            echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
            echo "::warning::App-Token nicht verfuegbar -- nutze GITHUB_TOKEN (Achtung: Label-Wechsel loesen ggf. keine Folge-Workflows aus)."
          fi

      - name: Issue einem Menschen zuweisen (Best-Effort)
        if: steps.preflight.outputs.configured == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          ASSIGNEE: ${{ github.event.sender.type == 'User' && github.event.sender.login || (github.event.issue.user.type == 'User' && github.event.issue.user.login || '') }}
        run: |
          if [ -z "$ASSIGNEE" ]; then
            echo "::notice::Kein menschlicher Assignee ermittelbar."
            exit 0
          fi
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-assignee "$ASSIGNEE"

      - name: Checkout
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.gh-token.outputs.token }}

      - name: Cache-Key fuer uv berechnen
        id: uv-cache-key
        if: steps.preflight.outputs.configured == 'true'
        run: echo "week=$(date +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: uv-Paketcache wiederherstellen
        id: uv-cache
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
          key: uv-vibe-${{ runner.os }}-${{ steps.uv-cache-key.outputs.week }}
          restore-keys: uv-vibe-${{ runner.os }}-

      - name: Mistral Vibe installieren
        if: steps.preflight.outputs.configured == 'true'
        run: |
          curl -fsSL https://vibe-agent.nousresearch.com/install.sh | bash -s -- --skip-browser --skip-setup
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Mistral Vibe konfigurieren (Provider anhand Issue-Label)
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          # Provider anhand des Issue-Labels waehlen
          LABELS=$(gh issue view $ISSUE --repo $GITHUB_REPOSITORY --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          if echo "$LABELS" | grep -q 'ai:use-nous'; then
            echo "::notice::Provider: Nous Portal (ai:use-nous)"
            vibe config set model.provider mistral
            vibe config set model.base_url https://api.mistral.ai/v1
            vibe auth add nous --type api-key --api-key "${{ secrets.MISTRAL_API_KEY }}" --label ci
          elif echo "$LABELS" | grep -q 'ai:use-zai'; then
            echo "::notice::Provider: Z.AI direkt (ai:use-zai)"
            vibe config set model.provider mistral
            # zai needs no base_url, uses built-in endpoint probing
            export MISTRAL_API_KEY="${{ secrets.MISTRAL_API_KEY }}"
            echo "MISTRAL_API_KEY=$MISTRAL_API_KEY" >> "$GITHUB_ENV"
          else
            echo "::notice::Provider: OpenRouter (Default)"
            vibe config set model.provider mistral
            vibe config set model.base_url https://api.mistral.ai/v1
          fi
          vibe config set agent.max_turns 90
          pip install mcp -q
          vibe mcp add kolibri --url https://public-ui-kolibri-mcp.vercel.app/mcp

      - name: Session-Archiv herunterladen (Phase impl)
        id: session-dl
        if: steps.preflight.outputs.configured == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: vibe-session-issue-${{ github.event.issue.number }}-impl
          path: /tmp/vibe-session-restore

      - name: Session wiederherstellen
        id: session-restore
        if: steps.preflight.outputs.configured == 'true' && steps.session-dl.outcome == 'success'
        run: |
          if [ -f /tmp/vibe-session-restore/vibe-session.tar.gz ]; then
            mkdir -p "$VIBE_HOME"
            tar -xzf /tmp/vibe-session-restore/vibe-session.tar.gz -C "$VIBE_HOME"
            if [ -f "$VIBE_HOME/session_id.txt" ]; then
              RID=$(cat "$VIBE_HOME/session_id.txt")
              echo "resume_arg=$RID" >> "$GITHUB_OUTPUT"
              echo "::notice::Session #$RID wiederhergestellt"
            fi
          fi

      - name: Auth pruefen (provider-spezifisch)
        if: steps.preflight.outputs.configured == 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          LABELS=$(gh issue view $ISSUE --repo $GITHUB_REPOSITORY --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          if echo "$LABELS" | grep -q 'ai:use-nous'; then
            if [ -z "$MISTRAL_API_KEY" ]; then
              echo "::error title=Auth fehlt::MISTRAL_API_KEY nicht gesetzt -- als Repo-Secret hinterlegen"
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:ready" 2>/dev/null || true
              exit 1
            fi
            echo "MISTRAL_API_KEY vorhanden."
          elif echo "$LABELS" | grep -q 'ai:use-zai'; then
            if [ -z "$MISTRAL_API_KEY" ]; then
              echo "::error title=Auth fehlt::MISTRAL_API_KEY nicht gesetzt -- als Repo-Secret hinterlegen"
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:ready" 2>/dev/null || true
              exit 1
            fi
            echo "MISTRAL_API_KEY vorhanden."
          else
            if [ -z "$MISTRAL_API_KEY" ]; then
              echo "::error title=Auth fehlt::MISTRAL_API_KEY nicht gesetzt -- als Repo-Secret hinterlegen (siehe https://console.mistral.ai/)"
              gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:ready" 2>/dev/null || true
              exit 1
            fi
          fi

      - name: Doppel-Run-Guard (ready-PR existiert bereits)
        id: doppel-guard
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if ! existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,isDraft,closingIssuesReferences \
            --jq "[.[] | select(.isDraft == false) | select((.closingIssuesReferences // []) | any(.number == ${ISSUE}))] | length" 2>/dev/null)"; then
            echo "::warning::Doppel-Run-Guard: gh-API nicht erreichbar -- fail-open."
            existing=0
          fi
          if [ "${existing:-0}" -gt 0 ]; then
            echo "::notice::Umsetzung uebersprungen -- ready-PR existiert bereits fuer Issue #$ISSUE."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: pnpm einrichten
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Node.js einrichten
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Abhaengigkeiten installieren
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Git-Hooks installieren (lefthook)
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm exec lefthook install

      - name: Fortsetzungs-Stand pruefen (ai:continued)
        id: continued-before
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          already="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "ai:continued")' 2>/dev/null || echo false)"
          echo "already=${already:-false}" >> "$GITHUB_OUTPUT"

      - name: Umsetzung via Mistral Vibe (Provider per Label)
        id: vibe
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          # Provider und Modell anhand des Issue-Labels waehlen
          LABELS=$(gh issue view $ISSUE --repo $GITHUB_REPOSITORY --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          PROVIDER_FLAG="--provider openrouter"
          MODEL="mistral-large-latest"
          if echo "$LABELS" | grep -q 'ai:use-nous'; then
            PROVIDER_FLAG="--provider nous"
          elif echo "$LABELS" | grep -q 'ai:use-zai'; then
            PROVIDER_FLAG="--provider zai"
            MODEL="z-ai/glm-5.1"
          fi

          cat > /tmp/vibe-prompt.txt << 'VIBE_EOF'
          Das Label `ai:ready` wurde an Issue #ISSUE_NR gesetzt -- setze dieses Issue jetzt um.

          Folge dem Umsetzungs-Workflow .ai-knowledge/ticket-implementation.md, aber NUR Schritte 1 bis 4:
            1. Zuweisung uebernimmt bereits der Workflow (nicht selbst zuweisen).
            2. Beginne SOFORT mit der Arbeit -- keine Wartezeit!
            3. Analyse re-verifizieren (Re-Triage gegen aktuellen Repo-Stand). Kippt die Ampel auf ? ? NICHT umsetzen, ai:ready entfernen, begruendet kommentieren und stoppen.
            4. Spec-Modus (Regelfall): den vorhandenen DRAFT-PR auschecken (gh pr list --state open --draft --json number,headRefName,closingIssuesReferences, den mit Issue #ISSUE_NR; dann git fetch origin && git switch <headRefName>). Dessen ROTE Tests GRUeN machen -- Tests NICHT aendern (Gewaltenteilung). Fallback (kein Draft-PR): eigenen Branch + Tests selbst schreiben. In beiden Faellen: Code bis pnpm test gruen, dann pnpm format + pnpm lint + pnpm knip.
            5. Committen, Branch pushen. Im Spec-Modus Draft-PR review-bereit machen (gh pr ready <nr>), Beschreibung ergaenzen. ALLERLETZTER Schritt: Label ai:needs-review am PR setzen.

          WEICHES ZEITLIMIT (Soft-Abort):
            Beginne SOFORT mit der Arbeit. Pruefe VOR jedem groesseren Teilschritt date +%s gegen SOFT_DEADLINE. Ist das Limit erreicht: Zwischenstand committen+pushen, Draft-PR mit TODO-Liste (KEIN ai:needs-review). ai:ready entfernen+sofort wieder setzen (Selbst-Retrigger). Turn beenden.

          Idempotenz: Draft-PR mit Closes #ISSUE_NR ist normaler Spec-Eingang -- aufgreifen. Nicht-Draft-PR = Umsetzung schon gelaufen ? Lauf beenden.

          WERKZEUGE: Bash (gh, git, pnpm), Datei-Tools sowie KoliBri-MCP-Tools (mcp_kolibri_search, mcp_kolibri_fetch fuer KoliBri-Komponenten). GH_TOKEN fuer gh-Befehle.
          Keine interaktive Bestaetigung -- Label ai:ready autorisiert.
          VIBE_EOF

          sed -i "s/#ISSUE_NR/${{ github.event.issue.number }}/g" /tmp/vibe-prompt.txt
          sed -i "s/SOFT_DEADLINE/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" /tmp/vibe-prompt.txt

          RESUME_ARG=""
          if [ -n "${{ steps.session-restore.outputs.resume_arg }}" ]; then
            RESUME_ARG="--resume ${{ steps.session-restore.outputs.resume_arg }}"
          fi

          vibe chat -q "$(cat /tmp/vibe-prompt.txt)" \
            $RESUME_ARG \
            -Q --yolo $PROVIDER_FLAG \
            -m "$MODEL" \
            -t "terminal,file" \
            --max-turns 90 \
            --accept-hooks \
            2>&1 | tee /tmp/vibe-output.log
          # PIPESTATUS: Exit-Code von vibe chat durch pipe propagieren
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Mistral Vibe-Session-ID erfassen
        if: always()
        id: session
        run: |
          if [ -f /tmp/vibe-output.log ]; then
            sid="$(grep '^session_id:' /tmp/vibe-output.log | head -1 | sed 's/^session_id:[[:space:]]*//')"
            if [ -n "$sid" ]; then
              echo "session_id=$sid" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Session-Archiv packen
        if: always() && steps.session.outputs.session_id != ''
        continue-on-error: true
        run: |
          SID="${{ steps.session.outputs.session_id }}"
          if [ -n "$SID" ] && [ -d "$VIBE_HOME" ]; then
            echo "$SID" > "$VIBE_HOME/session_id.txt"
            tar -czf /tmp/vibe-session.tar.gz -C "$VIBE_HOME" .
            echo "::notice::Session #$SID gepackt"
          fi

      - name: Session hochladen
        if: always() && steps.session.outputs.session_id != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vibe-session-issue-${{ github.event.issue.number }}-impl
          path: /tmp/vibe-session.tar.gz
          retention-days: 30
          overwrite: true

      - name: Soft-Abort-Fortsetzung erkennen und begrenzen (ai:continued)
        if: always() && steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true' && steps.vibe.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          ALREADY_CONTINUED: ${{ steps.continued-before.outputs.already }}
        run: |
          has_ready="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "ai:ready")' 2>/dev/null || echo false)"
          non_draft_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,isDraft,closingIssuesReferences \
            --jq "[.[] | select(.isDraft == false) | select((.closingIssuesReferences // []) | any(.number == ${ISSUE}))] | length" 2>/dev/null || echo 0)"
          if [ "${non_draft_pr:-0}" -gt 0 ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:continued" 2>/dev/null || true
            exit 0
          fi
          if [ "$has_ready" != "true" ]; then exit 0; fi
          if [ "${ALREADY_CONTINUED:-false}" = "true" ]; then
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:ready" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue" 2>/dev/null || true
          else
            gh label create "ai:continued" --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:continued"
          fi

      - name: Bei Timeout als zu gross markieren (ai:to-big-issue)
        if: always() && steps.preflight.outputs.configured == 'true' && steps.vibe.outcome == 'cancelled'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_START: ${{ steps.starttime.outputs.epoch }}
        run: |
          elapsed=$(( $(date +%s) - ${RUN_START:-0} ))
          if [ "${RUN_START:-0}" -eq 0 ] || [ "$elapsed" -lt 1080 ]; then exit 0; fi
          gh label create "ai:to-big-issue" --repo "$GITHUB_REPOSITORY" --color B60205 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:ready" 2>/dev/null || true

      - name: Ergebnis zusammenfassen
        if: always() && steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.vibe.outcome }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice title=? Umsetzung erfolgreich::Issue #${ISSUE}"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=?? Umsetzung abgebrochen"
          else
            echo "::error title=? Umsetzung fehlgeschlagen"
          fi
          {
            echo "### Umsetzung #${ISSUE} -- fertig"
            echo "- Mistral Vibe-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Labels: ${labels:-keine}"
            if [ -n "$SESSION_ID" ]; then echo "- Session-ID: \`${SESSION_ID}\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"
