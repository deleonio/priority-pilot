name: 2/6 UX-Beratung

# UX-Beratung als automatisierte Phase VOR der Spec — beratend, nicht blockierend.
# Läuft als Phase 2 von 7, sequenziell nach der Analyse. Triggert auf ai:needs-ux-ui,
# schreibt den KI-UX-Block zwischen <!-- KI-UX:START --> und <!-- KI-UX:END --> in den
# Harness-Kommentar (ADR 0009: erste Zeile <!-- ai-harness --> — der Issue-Body bleibt
# unberührt) und übergibt über ai:needs-spec an die Spec-Phase (Trigger wird hier
# konsumiert).
#
# CONCURRENCY: Statische Gruppe pro Phase (globale Serialisierung, FIFO).

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue-Nummer'
        required: true
        type: string

concurrency:
  group: claude-ux
  cancel-in-progress: false
  queue: max

jobs:
  precheck:
    # Bei workflow_dispatch immer laufen, sonst nur bei Label ai:needs-ux-ui
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai:needs-ux-ui' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      # `|| `-Fallback: bei workflow_dispatch ist der `check`-Step übersprungen (leerer
      # Output) und proceed kommt aus check-dispatch — ohne Fallback wäre der manuelle
      # Dispatch (der Recovery-Pfad für UX-Unklarheiten) stumm tot.
      proceed: ${{ steps.check.outputs.proceed || steps.check-dispatch.outputs.proceed }}
      issue_number: ${{ steps.issue.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Issue-Nummer ermitteln
        id: issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Label-Pre-Check (ai:needs-ux-ui muss vorhanden sein)
        id: check
        if: ${{ github.event_name == 'issues' }}
        uses: ./.github/actions/check-phase-label
        with:
          phase: ux
          ticket: ${{ steps.issue.outputs.number }}

      - name: Für workflow_dispatch immer proceed=true
        id: check-dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "proceed=true" >> "$GITHUB_OUTPUT"

  ux:
    needs: precheck
    if: >-
      ${{ always()
          && (needs.precheck.outputs.proceed == 'true' || needs.precheck.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    permissions:
      contents: read
      id-token: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Startzeit merken
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 600))" >> "$GITHUB_OUTPUT"

      - name: Phasen-Routing aus ai-phase-routing-Tabelle
        # Modell+Effort je Phase aus der analysgetriebenen Tabelle am Issue (ADR-0004).
        # Fail-open: Keine Tabelle/Zeile -> leere Outputs -> die Defaults unten greifen.
        id: routing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/resolve-phase-routing.sh \
            --repo "$GITHUB_REPOSITORY" \
            --issue "${{ needs.precheck.outputs.issue_number }}" \
            --phase ux || true

      - name: Setup Claude Code (mit Memory-Load)
        id: setup
        uses: ./.github/actions/setup-claude
        with:
          needs-mcp: true
          browser-mcp: false
          tools-tier: restricted
          event-type: ${{ github.event_name }}
          ticket-ref: ${{ needs.precheck.outputs.issue_number }}
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          llm-provider: ${{ vars.LLM_PROVIDER }}
          # vars.* = manueller Not-Override; sonst Tabelle; sonst bewährter Default.
          model: ${{ vars.CLAUDE_MODEL_UX || steps.routing.outputs.model || 'haiku' }}
          effort: ${{ steps.routing.outputs.effort || 'low' }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          zai-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_ZAI }}
          openrouter-settings-json: ${{ vars.CLAUDE_CODE_SETTINGS_LOCAL_OPENROUTER }}
          tailscale-authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          tailscale-exit-node: ${{ vars.TAILSCALE_EXIT_NODE }}
          memory-load: 'true'
          expect-memory: 'false'

      - name: 'UX-Beratung via Claude (statisch: Design-Regeln, Tokens, KoliBri-Docs)'
        id: claude
        if: steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ needs.precheck.outputs.issue_number }}
        run: |
          sed -e "s/{{ISSUE_NR}}/${{ needs.precheck.outputs.issue_number }}/g" \
              -e "s/{{SOFT_DEADLINE}}/${{ steps.starttime.outputs.soft_deadline_epoch }}/g" \
              .github/prompts/ux.md > /tmp/claude-prompt.txt

          # Memory-Snippets anhängen (Phase 2: restauriert + schreibt).
          cat .github/prompts/memory-read.md >> /tmp/claude-prompt.txt
          bash .github/scripts/render-memory-context.sh >> /tmp/claude-prompt.txt
          cat .github/prompts/memory-write.md >> /tmp/claude-prompt.txt
          sed -i "s/{{ISSUE_NR}}/${{ needs.precheck.outputs.issue_number }}/g" /tmp/claude-prompt.txt
          sed -i "s/{{PHASE}}/ux/g" /tmp/claude-prompt.txt
          sed -i "s/{{MEMORY_STATUS}}/${{ steps.setup.outputs.memory-status-text }}/g" /tmp/claude-prompt.txt
          bash .github/scripts/assert-prompt-complete.sh /tmp/claude-prompt.txt

          ${{ steps.setup.outputs.invoke-cmd }} "$(cat /tmp/claude-prompt.txt)" \
            ${{ steps.setup.outputs.invoke-args }} \
            2>&1 | tee /tmp/claude-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Token & Kosten erfassen
        # always(): Auch ein abgebrochener Lauf hat Token verbraucht — gerade teure
        # Fehlläufe gehören in die Baseline, sonst sieht die alte Pipeline zu günstig aus.
        if: always() && steps.setup.outputs.configured == 'true'
        uses: ./.github/actions/record-cost
        with:
          issue: ${{ steps.setup.outputs.issue-number || needs.precheck.outputs.issue_number }}
          phase: ux
          since-epoch: ${{ steps.starttime.outputs.epoch }}
          provider: ${{ steps.setup.outputs.llm-provider }}

      - name: Issue-Storage sichern (Harness-Branch)
        # ADR 0007: Fetch-then-Commit auf ai/harness/{N} — derselbe Branch, auf dem
        # Spec/Impl arbeiten; der Memory reist committet mit dem PR nach main.
        if: always() && steps.setup.outputs.configured == 'true'
        uses: ./.github/actions/issue-state-save
        with:
          issue-number: ${{ steps.setup.outputs.issue-number || needs.precheck.outputs.issue_number }}
          phase: ux

      - name: Label-Post-Assertion (VERDICT parsen, ai:needs-spec setzen)
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ needs.precheck.outputs.issue_number }}
        run: |
          verdict=""
          if [ -f /tmp/claude-output.log ]; then
            # Erster bekanntter Token aus der VERDICT-Zeile gewinnt: Prosa nach dem
            # Token („ux-ready (steht im Issue-Body)", #1017) darf das Verdict nicht
            # unkenntlich machen — exakter Zeilenvergleich klebte sie vorher daran fest.
            verdict="$(grep 'VERDICT:' /tmp/claude-output.log | tail -1 | sed -E 's/^.*VERDICT:[[:space:]]*//' | grep -oE 'ux-not-ready|ux-ready' | head -1 || true)"
          fi
          echo "Claude-Verdict aus Output: '${verdict:-keins}'"

          gh label create "ai:needs-spec" --repo "$GITHUB_REPOSITORY" --color FBCA04 2>/dev/null || true
          gh label create "ai:needs-human" --repo "$GITHUB_REPOSITORY" --color D4C5F9 2>/dev/null || true

          # Trigger konsumieren + stale Folge-Trigger entfernen (Idempotenz: remove-vor-add).
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:needs-ux-ui" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:needs-spec" 2>/dev/null || true

          if [ "$verdict" = "ux-ready" ]; then
            # Erfolg: Trigger der nächsten Phase (Spec) als letzter Write.
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:needs-human" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:needs-spec"
            echo "::notice::Label gesetzt: ai:needs-spec"
          elif [ "$verdict" = "ux-not-ready" ]; then
            # KI kommt nicht weiter: ai:needs-human mit Begründung + konkreten Optionen
            # für den Menschen (Bot-Kommentar triggert nichts — Labels sind der einzige
            # Ketten-Trigger, deshalb bleibt die Kette hier bewusst stehen).
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:needs-human"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
              "⚠️ **UX-Beratung: KI kommt nicht alleine weiter** (\`ai:needs-human\`).

          **Warum:** Die UX-Beratung konnte die UI-Entscheidung für dieses Ticket nicht belastbar treffen. Die offenen Fragen und Überlegungen stehen im KI-UX-Block des Harness-Kommentars (Kommentar mit `<!-- ai-harness -->` in der ersten Zeile).

          **Was du als Mensch beitragen/entscheiden solltest:**
          1. Die offenen UX-Fragen im Issue klären (z. B. als Kommentar ins Ticket schreiben).
          2. Danach \`ai:needs-ux-ui\` manuell setzen → UX-Beratung läuft mit deinem Kontext erneut.
          3. Oder, wenn der UX-Blocker unerheblich ist: \`ai:needs-spec\` manuell setzen → Spec-Phase startet direkt." 2>/dev/null || true
            echo "::notice::Label gesetzt: ai:needs-human (UX unklar)"
          else
            # ABSTURZ (kein verwertbares VERDICT): Der Trigger ai:needs-ux-ui ist oben bereits
            # konsumiert. Ohne Gegenmaßnahme stünde das Ticket jetzt ohne Trigger, ohne Label
            # und ohne Hinweis da — die Kette wäre still tot (beobachtet an Issue #912, das so
            # zweimal über Stunden unbemerkt liegenblieb). Deshalb sichtbar beim Menschen
            # parken, mit Log-Auszug, in dem die echte Ursache steht.
            echo "::warning::Kein VERDICT im Output — Phase abgebrochen, Ticket wird beim Menschen geparkt."
            bash .github/scripts/phase-crash-park.sh \
              --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" \
              --phase ux --trigger ai:needs-ux-ui || true
          fi

      - name: Ergebnis zusammenfassen
        if: always() && steps.setup.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.gh-token }}
          ISSUE: ${{ needs.precheck.outputs.issue_number }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ UX-Beratung erfolgreich::Issue #${ISSUE}"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ UX-Beratung abgebrochen"
          else
            echo "::error title=❌ UX-Beratung fehlgeschlagen"
          fi
          {
            echo "### UX-Beratung #${ISSUE} – fertig"
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Labels: ${labels:-keine}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🩺 Z.AI Fair-Usage-Check (1313)
        if: always()
        uses: ./.github/actions/llm-fair-usage-check
