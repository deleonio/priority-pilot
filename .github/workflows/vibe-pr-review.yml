name: Mistral Vibe PR Review (Kreuzverhoer)

# Reviewt einen Pull Request im Kreuzverhör, sobald er das Label
# "ai:needs-review" trägt UND das Issue das Label "ai:use-mistral" hat.
#
# Steuerung rein über Labels (kein Event-Kaskaden):
#   - Findings → ai:needs-changes (→ Fixup)
#   - sauber 🟢 → ai:ready-to-merge (→ Gate)
# Ändert KEINEN Code.
#
# Setzt Mistral Vibe Coding Agent über die Mistral API ein.
# Voraussetzung: Repo-Secret MISTRAL_API_KEY (https://console.mistral.ai/)

on:
  pull_request:
    types: [labeled]

concurrency:
  group: vibe-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      ${{ github.event.pull_request.draft == false
          && github.event.pull_request.head.repo.full_name == github.repository
          && contains(github.event.pull_request.labels.*.name, 'ai:needs-review')
          && contains(github.event.pull_request.labels.*.name, 'ai:use-mistral') }}
    runs-on: ubuntu-latest
    env:
      VIBE_HOME: /tmp/vibe-ci
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: write
      issues: write
    steps:
      - name: Voraussetzung prüfen (GitHub-App-Secrets)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::GitHub-App-Secrets fehlen — Lauf wird übersprungen."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: GH_TOKEN-Fallback setzen (App-Token oder GITHUB_TOKEN)
        id: gh-token
        run: |
          APP_TOK="${{ steps.app-token.outputs.token }}"
          if [ -n "$APP_TOK" ] && [ "$APP_TOK" != "null" ]; then
            echo "token=$APP_TOK" >> "$GITHUB_OUTPUT"
            echo "::notice::Nutze GitHub-App-Token für gh-Befehle."
          else
            echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
            echo "::warning::App-Token nicht verfügbar — nutze GITHUB_TOKEN (Achtung: Label-Wechsel lösen ggf. keine Folge-Workflows aus)."
          fi

      - name: Checkout
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mistral Vibe installieren
        if: steps.preflight.outputs.configured == 'true'
        run: |
          curl -fsSL https://vibe.mistral.ai/install.sh | bash -s -- --skip-browser --skip-setup
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Mistral Vibe konfigurieren
        if: steps.preflight.outputs.configured == 'true'
        run: |
          vibe config set model.provider mistral
          vibe config set model.base_url https://api.mistral.ai/v1
          vibe config set agent.max_turns 90

      - name: API-Key prüfen (MISTRAL_API_KEY)
        if: steps.preflight.outputs.configured == 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -z "$MISTRAL_API_KEY" ]; then
            echo "::error title=API-Key fehlt::MISTRAL_API_KEY nicht gesetzt"
            exit 1
          fi

      - name: Supersede-Check
        id: supersede-check
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          running=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs \
            --jq '.workflow_runs[] | select(.name == "Mistral Vibe PR Review (Kreuzverhoer)" and (.status == "queued" or .status == "in_progress") and .head_branch == $ENV.HEAD_BRANCH and .id != ${{ github.run_id }}) | .id' 2>/dev/null | head -1)
          if [ -n "$running" ]; then
            echo "::notice::Review-Lauf läuft bereits — übersprungen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Kreuzverhör-Review via Mistral Vibe
        id: vibe
        if: steps.preflight.outputs.configured == 'true' && steps.supersede-check.outputs.skip != 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
        run: |
          cat > /tmp/vibe-prompt.txt << 'VIBE_EOF'
          Reviewe Pull Request #PR_NR im Kreuzverhör (Label `ai:needs-review` ist gesetzt).

          Folge dem Ablauf .ai-knowledge/pr-review.md: vollständigen Diff (gh pr diff) und das verknüpfte Ticket lesen, adversarial prüfen (löst der PR das Problem ganz? Edge Cases? einfachster Weg? Performance/Security?), Code-Qualität und Projekt-Konventionen prüfen.

          ABSCHLUSS — GENAU EINEN Weg gehen. Labels sind ALLERLETZTER Schritt, NIE davor:
            - Es gibt zutreffende Findings → Review-Kommentare posten (an Datei/Zeile verankert), ERST DANACH in ZWEI getrennten Befehlen: gh pr edit PR_NR --remove-label ai:needs-review, danach --add-label ai:needs-changes
            - PR ist solide (🟢) → KEINE Pseudo-Findings, knappe 🟢-Bestätigung, ERST DANACH: ai:needs-review entfernen, ai:ready-to-merge setzen

          Sammelkommentar konsolidieren: Urteil als GENAU EINEN <!-- ai-review -->-Kommentar pflegen. Vorhandenen suchen und aktualisieren statt neu anzulegen.

          VERDICT-MARKER: Gib GANZ AM ENDE deiner letzten Antwort eine Zeile aus: `VERDICT: ready-to-merge` (bei 🟢) oder `VERDICT: needs-changes` (bei Findings). Der Workflow parst diese Zeile als Fallback, falls du die Labels nicht selbst setzen konntest (z.B. bei Token-Problemen).

          Bei Folge-Review (markierter Kommentar existiert): NUR den Diff SEIT dem letzten Review prüfen (über updatedAt des Kommentars). Bereits in "Behobene Anmerkungen" geführte Punkte NICHT erneut aufrollen.

          Fehlende Labels vorher mit gh label create anlegen.

          WICHTIG: Ändere KEINEN Code, committe nichts. Reiner Review. Keine interaktive Rückfrage.
          VIBE_EOF

          sed -i "s/#PR_NR/${{ github.event.pull_request.number }}/g" /tmp/vibe-prompt.txt

          vibe chat -q "$(cat /tmp/vibe-prompt.txt)" \
            -Q --yolo --provider mistral \
            -m "mistral-large-latest" \
            -t "terminal,file" \
            --max-turns 90 \
            --accept-hooks \
            2>&1 | tee /tmp/vibe-output.log
          test "${PIPESTATUS[0]}" -eq 0 || exit "${PIPESTATUS[0]}"

      - name: Mistral Vibe Session-ID erfassen
        if: always()
        id: session
        run: |
          if [ -f /tmp/vibe-output.log ]; then
            sid="$(grep '^session_id:' /tmp/vibe-output.log | head -1 | sed 's/^session_id:[[:space:]]*//')"
            if [ -n "$sid" ]; then echo "session_id=$sid" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Label-Post-Assertion (Safe-Default ai:needs-changes + Allowlist-Check-Guard)
        if: always() && steps.preflight.outputs.configured == 'true' && (steps.vibe.outcome == 'success' || steps.vibe.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels_json="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]' 2>/dev/null || echo '[]')"
          has_changes="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:needs-changes")')"
          has_ready="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:ready-to-merge")')"
          has_review="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:needs-review")')"

          # VERDICT aus Vibe-Output parsen (Fallback, falls Agent Labels nicht selbst setzen konnte)
          verdict=""
          if [ -f /tmp/vibe-output.log ]; then
            verdict="$(grep -oP '^VERDICT:\s*\K.*' /tmp/vibe-output.log | tail -1 | tr -d '[:space:]' || true)"
          fi
          echo "Mistral Vibe Verdict aus Output: '${verdict:-keins}'"

          # Allowlist-Checks (CI + Reviewer) auf grünen Status prüfen
          allow='[]'
          delays=(2 3 5 8)
          for attempt in 1 2 3 4 5; do
            checks="$(gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --json name,bucket,workflow 2>/dev/null || echo '[]')"
            if [ -z "$checks" ]; then checks='[]'; fi
            allow="$(echo "$checks" | jq '[.[] | select(.workflow == "CI" or .workflow == "Mistral Vibe PR Review (Kreuzverhoer)")]')"
            has_ci="$(echo "$allow" | jq -r 'any(.[]; .workflow == "CI")')"
            has_reviewer="$(echo "$allow" | jq -r 'any(.[]; .workflow == "Mistral Vibe PR Review (Kreuzverhoer)")')"
            if [ "$has_ci" = "true" ] && [ "$has_reviewer" = "true" ]; then
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              d="${delays[$((attempt - 1))]}"
              sleep "$d"
            fi
          done

          # Fehlende Checks sind kein Fehler hier (wir sind der Reviewer selbst, der läuft), aber wenn beide sichtbar sind, prüfen wir ob grün
          any_fail='false'
          if [ "$(echo "$allow" | jq 'length')" -gt 0 ]; then
            any_fail="$(echo "$allow" | jq -r 'any(.[]; .bucket == "fail")')"
          fi

          # Safe-Default-Logik: Kein Ergebnis-Label, Allowlist-Check rot ODER verdict=needs-changes → ai:needs-changes setzen
          should_set_needs_changes='false'
          reason=''

          # 1) Wenn Vibe verdict=needs-changes gemeldet hat, immer ai:needs-changes setzen
          if [ "$verdict" = "needs-changes" ] && [ "$has_changes" != "true" ]; then
            should_set_needs_changes='true'
            reason='Mistral Vibe Verdict: needs-changes'
          # 2) Kein Ergebnis-Label gesetzt → Safe-Default (nur wenn verdict nicht ready-to-merge)
          elif [ "$has_changes" != "true" ] && [ "$has_ready" != "true" ]; then
            if [ "$verdict" = "ready-to-merge" ]; then
              # Vibe sagte 🟢, konnte Label aber nicht setzen → korrigieren statt Safe-Default
              echo "Mistral Vibe Verdict ist ready-to-merge, aber kein Label gesetzt → korrigiere."
              if [ "$has_review" = "true" ]; then
                gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai:needs-review 2>/dev/null || true
              fi
              gh label create "ai:ready-to-merge" --repo "$GITHUB_REPOSITORY" --color 0E8A16 2>/dev/null || true
              gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ai:ready-to-merge
              should_set_needs_changes='false'
            else
              # Kein verdict und kein Label → Safe-Default
              should_set_needs_changes='true'
              reason='Review ohne Ergebnis-Label'
            fi
          # 3) ai:ready-to-merge gesetzt, aber Allowlist-Check rot → korrigieren
          elif [ "$has_ready" = "true" ] && [ "$any_fail" = "true" ]; then
            should_set_needs_changes='true'
            reason='ai:ready-to-merge gesetzt, aber Allowlist-Check rot'
          fi

          if [ "$should_set_needs_changes" = "true" ]; then
            # Terminale/abgeschlossene Pipeline-Labels entfernen, dann ai:needs-changes setzen
            if [ "$has_ready" = "true" ]; then
              gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai:ready-to-merge 2>/dev/null || true
            fi
            if [ "$has_review" = "true" ]; then
              gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label ai:needs-review 2>/dev/null || true
            fi
            gh label create "ai:needs-changes" --repo "$GITHUB_REPOSITORY" --color D93F0B 2>/dev/null || true
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label ai:needs-changes
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⚠️ Review: $reason — Safe-Default ai:needs-changes." 2>/dev/null || true
          fi

      - name: Bei Timeout PR-Kommentar (Alarm)
        if: always() && steps.preflight.outputs.configured == 'true' && steps.vibe.outcome == 'cancelled'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⚠️ **Review #${PR} — 20-Min-Timeout erreicht** Bitte manuell prüfen." 2>/dev/null || true

      - name: Ergebnis zusammenfassen
        if: always() && steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          OUTCOME: ${{ steps.vibe.outcome }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
        run: |
          labels="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Review erfolgreich::PR #${PR}"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Review abgebrochen"
          else
            echo "::error title=❌ Review fehlgeschlagen"
          fi
          {
            echo "### Kreuzverhör-Review #${PR}"
            echo "- Mistral Vibe Schritt: \`${OUTCOME:-unbekannt}\`"
            echo "- Labels: ${labels:-keine}"
            if [ -n "$SESSION_ID" ]; then echo "- Session-ID: \`${SESSION_ID}\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reviewer rot, wenn Änderungen erforderlich (ai:needs-changes)
        if: always() && steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Retry: API-Read-After-Write kann bei gh pr edit --add-label + direktem
          # gh pr view das Label auf einem Replica noch nicht sehen (Race).
          for i in 1 2 3; do
            labels_json="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]' 2>/dev/null || echo '[]')"
            needs_changes="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:needs-changes")')"
            ready_to_merge="$(echo "$labels_json" | jq -r 'any(.[]; . == "ai:ready-to-merge")')"
            if [ "$needs_changes" = "true" ] || [ "$ready_to_merge" = "true" ]; then break; fi
            if [ "$i" -lt 3 ]; then sleep 2; fi
          done

          # Fallback: VERDICT aus Vibe-Output — falls API-Label immer noch nicht sichtbar ist
          if [ "$ready_to_merge" != "true" ] && [ -f /tmp/vibe-output.log ]; then
            verdict="$(grep -oP '^VERDICT:\s*\K.*' /tmp/vibe-output.log | tail -1 | tr -d '[:space:]' || true)"
            if [ "$verdict" = "ready-to-merge" ]; then
              echo "::notice::ai:ready-to-merge im API-Read unsichtbar, aber VERDICT=ready-to-merge im Output — als gesetzt gewertet."
              ready_to_merge='true'
            fi
          fi

          if [ "$needs_changes" = "true" ]; then echo "::error title=Review: Änderungen erforderlich::PR #${PR}" && exit 1; fi
          if [ "$ready_to_merge" != "true" ]; then echo "::error title=Review stecken geblieben::PR #${PR}" && exit 1; fi
