name: Claude Spec (ai:spec-ready)

# Schreibt die ROTEN Tests (ausfuehrbarer Vertrag) fuer ein Issue, sobald es das Label
# "ai:spec-ready" erhaelt UND bereits "ai:analyzed" traegt (Label-Kette aus AGENTS.md:
# analysiert -> spezifiziert -> freigegeben -> Umsetzung). Fuehrt die Schritte aus
# .ai-knowledge/ticket-spec.md aus: Branch anlegen, rote Tests aus den Akzeptanzkriterien
# schreiben (KEIN Produktivcode), Draft-PR mit "Closes #" eroeffnen, dann am Issue "ai:ready"
# setzen und "ai:spec-ready" entfernen — woraufhin die Umsetzung (claude-implement.yml) den
# Draft-PR aufgreift und die Tests gruen macht.
#
# Das ist die GEWALTENTEILUNG aus Stufe 3 der TDD-Strategie (.ai-knowledge/tdd-strategy.md):
# Wer die Tests schreibt (dieser Workflow), schreibt NICHT den Code (claude-implement.yml) —
# zwei getrennte headless-Laeufe -> keine tautologischen Tests.
#
# Claude Code laeuft direkt im Runner. HARTES Zeitlimit: timeout-minutes: 20. Der Prompt weist
# an, rechtzeitig (~18 Min) den Zwischenstand zu sichern.
#
# Nutzt fuer GitHub-Operationen ein kurzlebiges GitHub-App-Token, damit das gesetzte "ai:ready"
# den Umsetzungs-Workflow ausloest (mit dem Standard-GITHUB_TOKEN wuerde er das nicht).
# Voraussetzungen (Repo-Secrets): CLAUDE_CODE_OAUTH_TOKEN sowie eine GitHub App, hinterlegt als
# APP_ID + APP_PRIVATE_KEY (App-Permissions: Contents/Issues/Pull requests = Read and write).

on:
  issues:
    types: [labeled]

concurrency:
  group: claude-spec-${{ github.event.issue.number }}
  cancel-in-progress: false # einen laufenden Spec-Lauf nicht mittendrin abbrechen

jobs:
  spec:
    # Nur wenn GENAU das Label "ai:spec-ready" neu gesetzt wurde, das Issue zusaetzlich
    # "ai:analyzed" traegt und offen ist.
    if: >-
      ${{ github.event.label.name == 'ai:spec-ready'
          && contains(github.event.issue.labels.*.name, 'ai:analyzed')
          && github.event.issue.state == 'open' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20 # hartes Limit: laeuft die Spec laenger, bricht GitHub den Job ab
    permissions:
      contents: read # Checkout (Schreibzugriff laeuft ueber das App-Token)
      id-token: write # OIDC-Token der Action (sonst fehlt ACTIONS_ID_TOKEN_REQUEST_URL)
    steps:
      # Startzeit fuer die Timeout-Erkennung: nur ein nahezu vollstaendig ausgeschoepfter Lauf
      # (>= 18 Min) gilt als Timeout (-> ai:to-big-issue). Ein frueher Abbruch liegt darunter.
      - name: Startzeit merken (fuer Timeout-Erkennung)
        id: starttime
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Voraussetzung pruefen (GitHub-App-Secrets)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::GitHub-App-Secrets fehlen (APP_ID und/oder APP_PRIVATE_KEY) — Lauf wird uebersprungen (kein Fehler). GitHub App anlegen (Contents/Issues/Pull requests = Read and write), aufs Repo installieren und beide Werte als Repo-Secrets hinterlegen, damit die Pipeline laeuft."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # voller Verlauf: der Spec-Flow arbeitet mit einem Branch
          token: ${{ steps.app-token.outputs.token }} # Push als App-Token -> loest Folge-Workflows aus

      # Standard-Pfad (Claude): laeuft, solange die Repo-Variable AI_AGENT NICHT auf "mistral" steht
      # (auch ungesetzt -> Claude bleibt Default). Umschalten: `gh variable set AI_AGENT --body
      # mistral` (zurueck: `gh variable set AI_AGENT --body claude`).
      - name: Spec via Claude Code
        id: claude
        if: steps.preflight.outputs.configured == 'true' && vars.AI_AGENT != 'mistral'
        uses: anthropics/claude-code-action@74eedf1a1892082d619c3edb66b9402da6520e7f # v1.0.156
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }} # gh nutzt das App-Token -> gesetztes ai:ready loest die Umsetzung aus
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          # Erlaubte Bot-Ausloeser — die Triage setzt `ai:spec-ready` als App-Bot (claude[bot]),
          # sonst blockt checkHumanActor. Absicherung zusaetzlich ueber den engen Job-`if:`.
          allowed_bots: 'claude[bot],my-github-action-bot'
          prompt: |
            Das Label `ai:spec-ready` wurde an Issue #${{ github.event.issue.number }} gesetzt —
            schreibe jetzt die ROTEN Tests (den Vertrag) fuer dieses Issue.

            Folge dem Spec-Workflow .ai-knowledge/ticket-spec.md (entspricht
            `/spec-ticket ${{ github.event.issue.number }}`):
              1. Branch anlegen (`git switch -c feat/issue-${{ github.event.issue.number }}-<kurzname>`).
                 Den Akzeptanzkriterien-+-Testfaelle-Block aus dem Triage-Kommentar entnehmen.
              2. ROTE Tests schreiben — je Akzeptanzkriterium echte, ausfuehrbare Tests in der zum
                 Ticket-Typ passenden Datei (server/src/logics|express/*.test.ts,
                 frontend/src/lib/*.test.ts, frontend/e2e/*.spec.ts). Sie pruefen echtes Soll-Verhalten
                 und werden gruen, sobald der Code existiert. Schreibe KEINEN Produktivcode.
              3. Rote Tests als ERSTEN Commit (`test: rote Spec-Tests fuer #${{ github.event.issue.number }}`),
                 Branch pushen, DRAFT-PR erstellen (`gh pr create --draft`) mit
                 `Closes #${{ github.event.issue.number }}` im Body (kurze Liste der Akzeptanzkriterien
                 + Hinweis "Implementierung folgt"). Setze NICHT `ai:needs-review` (der PR ist Draft).
              4. UEBERGABE: am Issue `ai:ready` setzen und `ai:spec-ready` entfernen
                 (`gh issue edit ${{ github.event.issue.number }} --add-label ai:ready --remove-label ai:spec-ready`;
                 Label `ai:ready` bei Bedarf vorher `gh label create "ai:ready" --color 0E8A16`).
                 Damit greift die Umsetzung (claude-implement.yml) den Draft-PR auf und macht ihn gruen.

            Weise dich NICHT selbst zu — `@me` waere der Bot.

            HARTES Zeitlimit: Dieser Lauf wird nach 20 Minuten hart abgebrochen. Merkst du, dass es
            eng wird, sichere SPAETESTENS nach ~18 Minuten den Zwischenstand (committen, Branch pushen,
            Draft-PR), aber setze `ai:ready` NUR, wenn die roten Tests vollstaendig stehen — sonst
            bleibt das Issue `ai:spec-ready` fuer einen Folgelauf.

            Idempotenz: Existiert bereits ein offener PR mit `Closes #${{ github.event.issue.number }}`,
            NICHT erneut spezifizieren — Lauf beenden.

            Bearbeite ausschliesslich dieses eine Issue. Die Freigabe gilt durch das Label
            `ai:spec-ready` als erteilt: arbeite autonom, ohne auf eine interaktive Bestaetigung zu warten.
          claude_args: >-
            --model claude-opus-4-8 --effort medium
            --allowedTools "Bash(gh issue:*),Bash(gh pr:*),Bash(gh label:*),Bash(gh api:*),Bash(git switch:*),Bash(git checkout:*),Bash(git branch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(git fetch:*),Bash(pnpm:*),Read,Edit,Write,Grep,Glob,Skill,Task"
            --append-system-prompt "Automatisierter, durch das Label ai:spec-ready autorisierter SPEC-Lauf in GitHub Actions (headless). Schreibe ausschliesslich Tests fuer Issue #${{ github.event.issue.number }} (KEIN Produktivcode), eroeffne einen Draft-PR und gib das Issue per ai:ready frei (ai:spec-ready entfernen). HARTES 20-Minuten-Timeout: sichere bei drohendem Limit (~18 Min) den Zwischenstand, setze ai:ready aber nur bei vollstaendigen roten Tests. Bestaetigung gilt durch ai:spec-ready als erteilt; arbeite autonom ohne interaktive Rueckfrage."

      # Mistral-Pfad (AI_AGENT == 'mistral'): Vibe laeuft headless OHNE Approval-Callback — ohne
      # erzwungenes Auto-Approve wuerde jedes genehmigungspflichtige Tool uebersprungen.
      - name: Vibe-Konfig (Headless Auto-Approve)
        if: steps.preflight.outputs.configured == 'true' && vars.AI_AGENT == 'mistral'
        run: |
          mkdir -p "$HOME/.vibe"
          cat > "$HOME/.vibe/config.toml" <<'EOF'
          default_agent = "auto-approve"
          bypass_tool_permissions = true
          EOF

      # Spiegelt den Claude-Schritt: gleiche Schritte, anderer Agent. GH_TOKEN = App-Token, damit das
      # gesetzte ai:ready den Umsetzungs-Workflow ausloest; der git-Push laeuft ueber den im Checkout
      # gesetzten App-Token-Remote. Die Vibe-Action reicht KEINE Extra-Flags durch — System-Prompt-
      # Regeln als fuehrender [KONTEXT]-Block; keine Tool-Restriktion erzwingbar.
      - name: Spec via Mistral Vibe
        id: mistral
        if: steps.preflight.outputs.configured == 'true' && vars.AI_AGENT == 'mistral'
        uses: mistralai/mistral-vibe@725d3a56ce99aa69157f33cabdf28f23a69320da # v2.17.1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }} # gh/Push als App-Token -> ai:ready loest Umsetzung aus
        with:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          args: --trust
          prompt: |
            [KONTEXT/REGELN] Automatisierter, durch das Label ai:spec-ready autorisierter SPEC-Lauf in
            GitHub Actions (headless). Schreibe ausschliesslich Tests fuer Issue
            #${{ github.event.issue.number }} (KEIN Produktivcode), eroeffne einen Draft-PR und gib das
            Issue per ai:ready frei (ai:spec-ready entfernen). HARTES 20-Minuten-Timeout: sichere bei
            drohendem Limit (~18 Min) den Zwischenstand, setze ai:ready aber nur bei vollstaendigen
            roten Tests. Bestaetigung gilt durch ai:spec-ready als erteilt; arbeite autonom ohne
            interaktive Rueckfrage. Nutze fuer GitHub-Operationen die `gh`-CLI (Token ist gesetzt).

            Das Label `ai:spec-ready` wurde an Issue #${{ github.event.issue.number }} gesetzt —
            schreibe jetzt die ROTEN Tests (den Vertrag) fuer dieses Issue.

            Folge dem Spec-Workflow .ai-knowledge/ticket-spec.md (entspricht
            `/spec-ticket ${{ github.event.issue.number }}`):
              1. Branch anlegen (`git switch -c feat/issue-${{ github.event.issue.number }}-<kurzname>`).
                 Den Akzeptanzkriterien-+-Testfaelle-Block aus dem Triage-Kommentar entnehmen.
              2. ROTE Tests schreiben — je Akzeptanzkriterium echte, ausfuehrbare Tests in der zum
                 Ticket-Typ passenden Datei (server/src/logics|express/*.test.ts,
                 frontend/src/lib/*.test.ts, frontend/e2e/*.spec.ts). Sie pruefen echtes Soll-Verhalten
                 und werden gruen, sobald der Code existiert. Schreibe KEINEN Produktivcode.
              3. Rote Tests als ERSTEN Commit (`test: rote Spec-Tests fuer #${{ github.event.issue.number }}`),
                 Branch pushen, DRAFT-PR erstellen (`gh pr create --draft`) mit
                 `Closes #${{ github.event.issue.number }}` im Body. Setze NICHT `ai:needs-review`.
              4. UEBERGABE: am Issue `ai:ready` setzen und `ai:spec-ready` entfernen
                 (`gh issue edit ${{ github.event.issue.number }} --add-label ai:ready --remove-label ai:spec-ready`).

            Weise dich NICHT selbst zu. Idempotenz: Existiert bereits ein offener PR mit
            `Closes #${{ github.event.issue.number }}`, NICHT erneut spezifizieren — Lauf beenden.
            Bearbeite ausschliesslich dieses eine Issue.

      # Bei hartem Timeout (Agent-Schritt cancelled) ist das Issue zu gross fuer einen Spec-Lauf:
      # mit "ai:to-big-issue" markieren und "ai:spec-ready" entfernen, damit der Spec-Workflow es
      # nicht erneut aufgreift. Laeuft im Cancellation-Grace-Fenster (if: always(), ~5 Min).
      # Zeit-Guard: nur labeln, wenn der Lauf das 20-Min-Limit nahezu ausgeschoepft hat (>= 18 Min).
      - name: Bei Timeout als zu gross markieren (ai:to-big-issue)
        if: always() && steps.preflight.outputs.configured == 'true' && (steps.claude.outcome == 'cancelled' || steps.mistral.outcome == 'cancelled')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_START: ${{ steps.starttime.outputs.epoch }}
        run: |
          elapsed=$(( $(date +%s) - ${RUN_START:-0} ))
          if [ "${RUN_START:-0}" -eq 0 ] || [ "$elapsed" -lt 1080 ]; then
            echo "::notice title=Kein Timeout::Lauf nach ${elapsed}s abgebrochen (< 18 Min) — vermutlich manueller Cancel, kein ai:to-big-issue."
            exit 0
          fi
          gh label create "ai:to-big-issue" --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "KI-Job lief in den Timeout — Issue zu gross, bitte aufteilen" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:spec-ready" 2>/dev/null || true
          echo "::warning title=Issue #${ISSUE} zu gross::20-Min-Timeout erreicht (${elapsed}s) — Label ai:to-big-issue gesetzt, ai:spec-ready entfernt; bitte Issue aufteilen."

      # Deterministisches Abschluss-Signal (unabhaengig von der LLM-Ausgabe): laeuft auch bei
      # Abbruch/Timeout (if: always()). outcome=cancelled signalisiert das 20-Min-Timeout.
      - name: Ergebnis zusammenfassen
        if: always() && steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          AGENT: ${{ vars.AI_AGENT == 'mistral' && 'Mistral' || 'Claude' }}
          OUTCOME: ${{ steps.claude.outcome != 'skipped' && steps.claude.outcome || steps.mistral.outcome }}
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          {
            echo "### Spec #${ISSUE} — fertig"
            echo ""
            echo "- ${AGENT}-Schritt: \`${OUTCOME:-unbekannt}\` (cancelled = 20-Min-Timeout erreicht)"
            echo "- Aktuelle Issue-Labels: ${labels:-keine}"
            if [ -n "$SESSION_ID" ]; then echo "- Session-ID: \`${SESSION_ID}\` (\`--resume\` zum Nachschauen)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Spec #${ISSUE} fertig::${AGENT}-Schritt ${OUTCOME:-unbekannt}; Labels: ${labels:-keine}"
