name: Claude Spec (ai:spec-ready)

# Schreibt die ROTEN Tests (ausfuehrbarer Vertrag) fuer ein Issue, sobald es das Label
# "ai:spec-ready" erhaelt UND bereits "ai:analyzed" traegt (Label-Kette aus AGENTS.md:
# analysiert -> spezifiziert -> freigegeben -> Umsetzung). Fuehrt die Schritte aus
# .ai-knowledge/ticket-spec.md aus: Branch anlegen, rote Tests aus den Akzeptanzkriterien
# schreiben (KEIN Produktivcode), Draft-PR mit "Closes #" eroeffnen, dann am Issue "ai:ready"
# setzen und "ai:spec-ready" entfernen — woraufhin die Umsetzung (claude-implement.yml) den
# Draft-PR aufgreift und die Tests gruen macht.
#
# Das ist die GEWALTENTEILUNG aus Stufe 3 der TDD-Strategie (.ai-knowledge/tdd-strategy.md):
# Wer die Tests schreibt (dieser Workflow), schreibt NICHT den Code (claude-implement.yml) —
# zwei getrennte headless-Laeufe -> keine tautologischen Tests.
#
# Claude Code laeuft direkt im Runner. HARTES Zeitlimit: timeout-minutes: 20. Der Prompt weist
# an, rechtzeitig (~18 Min) den Zwischenstand zu sichern.
#
# Nutzt fuer GitHub-Operationen ein kurzlebiges GitHub-App-Token, damit das gesetzte "ai:ready"
# den Umsetzungs-Workflow ausloest (mit dem Standard-GITHUB_TOKEN wuerde er das nicht).
# Voraussetzungen (Repo-Secrets): CLAUDE_CODE_OAUTH_TOKEN sowie eine GitHub App, hinterlegt als
# APP_ID + APP_PRIVATE_KEY (App-Permissions: Contents/Issues/Pull requests = Read and write).

on:
  issues:
    types: [labeled]

concurrency:
  group: claude-spec-${{ github.event.issue.number }}
  cancel-in-progress: false # einen laufenden Spec-Lauf nicht mittendrin abbrechen

jobs:
  spec:
    # Nur wenn GENAU das Label "ai:spec-ready" neu gesetzt wurde, das Issue zusaetzlich
    # "ai:analyzed" traegt und offen ist.
    if: >-
      ${{ github.event.label.name == 'ai:spec-ready'
          && contains(github.event.issue.labels.*.name, 'ai:analyzed')
          && github.event.issue.state == 'open' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20 # hartes Limit: laeuft die Spec laenger, bricht GitHub den Job ab
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      BASH_MAX_OUTPUT_LENGTH: '20000'
      CLAUDE_HIDE_BANNER: '1'
      API_TIMEOUT_MS: '3000000'
    permissions:
      contents: read # Checkout (Schreibzugriff laeuft ueber das App-Token)
      id-token: write # OIDC-Token der Action (sonst fehlt ACTIONS_ID_TOKEN_REQUEST_URL)
      actions: read # Artefakt-Suche/-Download (`gh api`) im Session-Archiv-Wiederherstellen-Schritt
    steps:
      # Startzeit fuer die Timeout-Erkennung: nur ein nahezu vollstaendig ausgeschoepfter Lauf
      # (>= 18 Min) gilt als Timeout (-> ai:to-big-issue). Ein frueher Abbruch liegt darunter.
      # soft_deadline_epoch (Soft-Abort, 2026-07-08): jetzt + 840s (14 Min, 6 Min Puffer bis zum
      # harten Kill) -- wird unten als literale Zahl in den Prompt gerendert.
      - name: Startzeit merken (fuer Timeout-Erkennung + weiches Zeitlimit)
        id: starttime
        run: |
          now=$(date +%s)
          echo "epoch=$now" >> "$GITHUB_OUTPUT"
          echo "soft_deadline_epoch=$((now + 840))" >> "$GITHUB_OUTPUT"

      - name: Voraussetzung pruefen (GitHub-App-Secrets)
        id: preflight
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::GitHub-App-Secrets fehlen (APP_ID und/oder APP_PRIVATE_KEY) — Lauf wird uebersprungen (kein Fehler). GitHub App anlegen (Contents/Issues/Pull requests = Read and write), aufs Repo installieren und beide Werte als Repo-Secrets hinterlegen, damit die Pipeline laeuft."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub-App-Token erzeugen
        id: app-token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # voller Verlauf: der Spec-Flow arbeitet mit einem Branch
          token: ${{ steps.app-token.outputs.token }} # Push als App-Token -> loest Folge-Workflows aus

      # KI-Backend (Issue #403): Label `ai:use-zai` am Issue waehlt pro Lauf z.ai statt Anthropic
      # (Default). Schreibt AI_BACKEND=anthropic|zai nach $GITHUB_ENV; bei zai kommen Endpoint +
      # ANTHROPIC_AUTH_TOKEN (Secret ZAI_API_KEY) dazu. Muss VOR Preflight + claude-code-action.
      - name: KI-Backend konfigurieren
        if: steps.preflight.outputs.configured == 'true'
        uses: ./.github/actions/configure-ai-backend
        with:
          entity-type: issue
          entity-number: ${{ github.event.issue.number }}
          gh-token: ${{ steps.app-token.outputs.token }}
          zai-api-key: ${{ secrets.ZAI_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}

      # Deterministischer Agent-Secret-Check (Haerten S2): die OAuth-Token-Voraussetzung fuer
      # Claude darf NICHT still skippen — fehlt CLAUDE_CODE_OAUTH_TOKEN, bricht der Lauf hier
      # deterministisch mit einem klaren ::error:: ab. Ai:to-big-issue + ai:spec-ready entfernen,
      # damit KEIN Re-Loop, aber das Issue fuer den Menschen sichtbar ist. Setzt mit dem
      # App-Token, damit die Label-Entfernung greift.
      - name: Agent-Secret prüfen (kein stiller Skip)
        if: steps.preflight.outputs.configured == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AI_BACKEND: ${{ env.AI_BACKEND }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ "${AI_BACKEND:-}" = "zai" ] || [ "${AI_BACKEND:-}" = "openrouter" ]; then
            echo "KI-Backend=${AI_BACKEND} — Auth via API-Key (in configure-ai-backend validiert). OAuth-Preflight entfaellt."
            exit 0
          fi
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error title=Agent-Secret fehlt::CLAUDE_CODE_OAUTH_TOKEN fehlt — fehlt es, darf der Lauf nicht still skippen (AGENTS.md: bewusstes Opt-in). Secret als Repo-Secret hinterlegen."
            gh label create "ai:to-big-issue" --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "KI-Job lief rot (Konfiguration/Secret) — bitte pruefen" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue"
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:spec-ready" 2>/dev/null || true
            exit 1
          fi
          echo "Agent-Secret (CLAUDE_CODE_OAUTH_TOKEN) vorhanden."

      # Deterministischer Doppel-Run-Guard (Haerten H3): cancel-in-progress:false + on:labeled kann
      # bei zwei schnellen ai:spec-ready-Events zwei Spec-Laeufe queue'n. Die Idempotenz ("existiert
      # bereits ein PR mit Closes #N") stand bisher NUR im Prompt — zwei parallele Laeufe konnten
      # zwei Branches / zwei Draft-PRs erzeugen. Dieser Step prueft VOR dem Agenten deterministisch
      # ueber closingIssuesReferences, ob schon ein offener PR fuer das Issue existiert, und beendet
      # den Lauf sauber (No-op), statt einen zweiten Branch anzulegen.
      - name: Doppel-Run-Guard (existierender PR mit Closes #N)
        id: doppel-guard
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          # Fallback bei transienter gh-API-Stoerung: bewusst fail-open (existing=0, Spec darf
          # laufen) statt den Lauf zu blockieren — im Worst Case ein seltener doppelter Branch,
          # statt jeden Spec-Lauf an einem gh-Hickup scheitern zu lassen. Warnung macht das sichtbar.
          if ! existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,isDraft,closingIssuesReferences \
            --jq "[.[] | select((.closingIssuesReferences // []) | any(.number == ${ISSUE}))] | length" 2>/dev/null)"; then
            echo "::warning::Doppel-Run-Guard: gh-API nicht erreichbar — Pruefung uebersprungen (fail-open, Spec darf laufen)."
            existing=0
          fi
          if [ "${existing:-0}" -gt 0 ]; then
            echo "::notice title=Spec übersprungen::Für Issue #$ISSUE existiert bereits ein offener PR — kein zweiter Branch/PR (Doppel-Run-Guard). Issue bleibt ai:spec-ready." >> "$GITHUB_STEP_SUMMARY"
            echo "Doppel-Run-Guard: ${existing} PR(s) bereits verknüpft mit Issue #$ISSUE — Spec-Lauf beendet (No-op)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Kein existierender PR für Issue #$ISSUE — Spec darf laufen."
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # Kreuzverhoer-Finding (2026-07-08): fehlte bisher komplett, obwohl der Prompt unten
      # `pnpm test` zur Rot-Verifikation braucht und claude_args `Bash(pnpm:*)` erlaubt — der
      # Agent musste sich pnpm/Node selbst bootstrappen. An steps.doppel-guard.outputs.skip
      # gekoppelt, damit im No-op-Fall (Issue hat schon einen PR) kein unnoetiger Install laeuft.
      - name: pnpm einrichten
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Node.js einrichten
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc # zentrale Node-Version (gleicher Stand wie ci/implement/fixup/deploy)
          cache: pnpm

      - name: Abhaengigkeiten installieren
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Git-Hooks installieren (lefthook)
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        run: pnpm exec lefthook install

      # Soft-Abort-Obergrenze (2026-07-08): merkt sich, ob "ai:continued" bereits VOR diesem Lauf
      # gesetzt war (also ob ein vorheriger Lauf schon einmal selbst fortgesetzt hat). Der
      # Cap-Step nach dem Claude-Schritt liest diesen Wert, um eine zweite Fortsetzung in Folge zu
      # verhindern (siehe dort).
      - name: Fortsetzungs-Stand pruefen (ai:continued)
        id: continued-before
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          already="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels \
            --jq 'any(.labels[]; .name == "ai:continued")' 2>/dev/null || echo false)"
          echo "already=${already:-false}" >> "$GITHUB_OUTPUT"

      # Named Session Resume (Phase "spec", Soft-Abort-Rollout 2026-07-08): laedt ein evtl.
      # archiviertes Sitzungsarchiv dieses Issues, damit ein Selbst-Retrigger-Folgelauf (siehe
      # Cap-Step unten) die Konversation fortsetzt statt kontextlos neu zu beginnen. Fail-open wie
      # in claude-triage.yml.
      - name: Session-Archiv wiederherstellen (Phase spec)
        id: session-restore
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        continue-on-error: true
        uses: ./.github/actions/session-restore
        with:
          issue: ${{ github.event.issue.number }}
          phase: spec
          fallback-phase: analyse

      # Kein manueller Supersede-Check: issue-getriggerte Läufe tragen head_branch=main und sind
      # über die Runs-API NICHT auf das konkrete Issue scopebar. Ein namensbasierter Filter würde
      # quer über verschiedene Issues fälschlich überspringen. Die native concurrency-Gruppe
      # (claude-spec-<issue-nr>) serialisiert bereits pro Issue -> kein Supersede-Check nötig.
      - name: Spec via Claude Code
        id: claude
        if: steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        uses: anthropics/claude-code-action@558b1d6cab4085c7753fe402c10bef0fbb92ac7a # v1.0.165
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }} # gh nutzt das App-Token -> gesetztes ai:ready loest die Umsetzung aus
        with:
          claude_code_oauth_token: ${{ env.AI_BACKEND != 'zai' && env.AI_BACKEND != 'openrouter' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ steps.app-token.outputs.token }}
          # Erlaubte Bot-Ausloeser — die Triage setzt `ai:spec-ready` als App-Bot (claude[bot]),
          # sonst blockt checkHumanActor. Absicherung zusaetzlich ueber den engen Job-`if:`.
          allowed_bots: 'claude[bot],my-github-action-bot'
          prompt: |
            Das Label `ai:spec-ready` wurde an Issue #${{ github.event.issue.number }} gesetzt —
            schreibe jetzt die ROTEN Tests (den Vertrag) fuer dieses Issue.

            Folge dem Spec-Workflow .ai-knowledge/ticket-spec.md (entspricht
            `/spec-ticket ${{ github.event.issue.number }}`):
              1. Branch anlegen (`git switch -c feat/issue-${{ github.event.issue.number }}-<kurzname>`).
                 Den Akzeptanzkriterien-+-Testfaelle-Block der Triage primaer aus dem BODY-Block des
                 Issues entnehmen (`gh issue view ${{ github.event.issue.number }} --json body -q .body`,
                 Abschnitt zwischen den Markern `<!-- KI-ANALYSE:START stand=... -->` und
                 `<!-- KI-ANALYSE:END -->`); fehlt der Body-Block (Alt-Issue), Fallback auf den
                 juengsten `KI-Analyse`-Kommentar.
              2. ROTE Tests schreiben — je Akzeptanzkriterium echte, ausfuehrbare Tests in der zum
                 Ticket-Typ passenden Datei (server/src/logics|express/*.test.ts,
                 frontend/src/lib/*.test.ts, frontend/e2e/*.spec.ts). Sie pruefen echtes Soll-Verhalten
                 und werden gruen, sobald der Code existiert. Schreibe KEINEN Produktivcode.
              3. Rote Tests als ERSTEN Commit (`test: rote Spec-Tests fuer #${{ github.event.issue.number }}`),
                 Branch pushen, DRAFT-PR erstellen (`gh pr create --draft`) mit
                 `Closes #${{ github.event.issue.number }}` im Body (kurze Liste der Akzeptanzkriterien
                 + Hinweis "Implementierung folgt"). Setze NICHT `ai:needs-review` (der PR ist Draft).
              4. UEBERGABE (ALLERLETZTER Schritt, NIE davor — ERST NACHDEM Push + Draft-PR aus
                 Schritt 3 vollstaendig stehen): am Issue `ai:ready` setzen und `ai:spec-ready`
                 entfernen (`gh issue edit ${{ github.event.issue.number }} --add-label ai:ready --remove-label ai:spec-ready`;
                 Label `ai:ready` bei Bedarf vorher `gh label create "ai:ready" --color 0E8A16`).
                 Das setzt sofort die Umsetzung (claude-implement.yml) in Gang, die den Draft-PR
                 unmittelbar danach ausliest.

            Weise dich NICHT selbst zu — `@me` waere der Bot.

            Trägt das Issue bereits `ai:to-big-issue`, hat ein vorheriger Lauf die
            Fortsetzungs-Obergrenze bereits ausgeschoepft — nicht weiterarbeiten, kurz kommentieren
            und stoppen.

            Weiches Zeitlimit (Soft-Abort): Dieser Lauf wird nach 20 Minuten HART abgebrochen (kein
            SIGTERM-Handling moeglich). Pruefe daher VOR jedem groesseren Teilschritt (naechste
            Testdatei, `pnpm test`-Lauf) mit `test "$(date +%s)" -ge ${{ steps.starttime.outputs.soft_deadline_epoch }}`,
            ob das weiche Limit (14 Min nach Start, 6 Min Puffer) erreicht ist. Ist das der Fall,
            STOPPE SOFORT den aktuellen Teilschritt kontrolliert und fuehre NUR noch dies aus:
            Zwischenstand committen und pushen (Branch/Draft-PR wie in Schritt 3 beschrieben, auch
            wenn die roten Tests noch unvollstaendig sind), kurze TODO-Notiz in die PR-Beschreibung
            (was steht, was fehlt) — setze `ai:ready` NICHT. Loese stattdessen selbst einen
            sauberen Folgelauf aus: `ai:spec-ready` entfernen und sofort wieder setzen
            (`gh issue edit ${{ github.event.issue.number }} --remove-label ai:spec-ready` gefolgt
            von `--add-label ai:spec-ready`) — das feuert claude-spec.yml erneut, der Folgelauf
            setzt per Session-Resume an dieser Stelle fort. Danach den Turn beenden.

            Idempotenz: Existiert bereits ein offener PR mit `Closes #${{ github.event.issue.number }}`,
            NICHT erneut spezifizieren — Lauf beenden.

            Bearbeite ausschliesslich dieses eine Issue. Die Freigabe gilt durch das Label
            `ai:spec-ready` als erteilt: arbeite autonom, ohne auf eine interaktive Bestaetigung zu warten.
          claude_args: >-
            --bare --model claude-sonnet-4-6 --effort medium
            ${{ steps.session-restore.outputs.resume-arg }}
            --allowedTools "Bash(gh issue:*),Bash(gh pr:*),Bash(gh label:*),Bash(gh api:*),Bash(git switch:*),Bash(git checkout:*),Bash(git branch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(git fetch:*),Bash(pnpm:*),Read,Edit,Write,Grep,Glob,Task"
            --append-system-prompt "Automatisierter, durch das Label ai:spec-ready autorisierter SPEC-Lauf in GitHub Actions (headless). Schreibe ausschliesslich Tests fuer Issue #${{ github.event.issue.number }} (KEIN Produktivcode), eroeffne einen Draft-PR und gib das Issue ALS ALLERLETZTEN Schritt (NIE davor, erst nach Push+PR) per ai:ready frei (ai:spec-ready entfernen) — das startet sofort die Umsetzung, die den PR-Stand unmittelbar danach liest. HARTES 20-Minuten-Timeout, weiches Limit bei 14 Min (Soft-Abort): pruefe vor jedem groesseren Teilschritt `date +%s` gegen ${{ steps.starttime.outputs.soft_deadline_epoch }}; ist das erreicht, sichere den Zwischenstand (committen/pushen, TODO-Notiz), setze KEIN ai:ready, sondern entferne+setze ai:spec-ready neu (Selbst-Retrigger, der Folgelauf setzt per --resume fort) und beende den Turn. Modell-Strategie: Du laeufst als Sonnet-Koordinator. Schaetze die Komplexitaet der Aufgabe ein und delegiere die eigentliche Abarbeitung per Agent-Tool an einen Subagenten in derselben Session: heavy (Opus) fuer komplexe/architektonische Aufgaben, light (Haiku) fuer triviale/mechanische Aufgaben; Standard- und Koordinationsarbeit erledigst du selbst auf Sonnet."

      - name: Kosten-Zusammenfassung
        if: always()
        continue-on-error: true
        uses: ./.github/actions/cost-summary
        with:
          execution-file: ${{ steps.claude.outputs.execution_file }}
          label: Spec
          ai-backend: ${{ env.AI_BACKEND }}

      # Named Session Resume (Phase "spec"): sichert die eben beendete/abgebrochene Session ins
      # Sitzungsarchiv, damit ein Selbst-Retrigger-Folgelauf per --resume anknuepfen kann.
      # if: always() -- auch ein in den harten Timeout gelaufener Lauf sichert seinen Teil-Fortschritt.
      - name: Session-Archiv sichern (Phase spec)
        if: always() && steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true'
        continue-on-error: true
        uses: ./.github/actions/session-save
        with:
          issue: ${{ github.event.issue.number }}
          phase: spec
          session-id: ${{ steps.claude.outputs.session_id }}

      # Soft-Abort-Obergrenze (2026-07-08): erkennt einen BEWUSSTEN Zwischenstopp (Claude hat
      # sauber beendet -- outcome success, nicht cancelled -- und ai:spec-ready selbst wieder
      # gesetzt, ohne ai:ready zu setzen) und begrenzt automatische Selbst-Fortsetzungen auf genau
      # EINE, bevor deterministisch auf ai:to-big-issue zurueckgefallen wird (verhindert eine
      # Endlosschleife bei einem grundsaetzlich zu grossen Issue).
      - name: Soft-Abort-Fortsetzung erkennen und begrenzen (ai:continued)
        if: always() && steps.preflight.outputs.configured == 'true' && steps.doppel-guard.outputs.skip != 'true' && steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          ALREADY_CONTINUED: ${{ steps.continued-before.outputs.already }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]' 2>/dev/null || echo '[]')"
          has_ready=$(echo "$labels" | jq 'any(. == "ai:ready")')
          has_spec_ready=$(echo "$labels" | jq 'any(. == "ai:spec-ready")')

          if [ "$has_ready" = "true" ]; then
            # Phase abgeschlossen -- Marker aufraeumen fuer den naechsten, unabhaengigen Zyklus.
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:continued" 2>/dev/null || true
            exit 0
          fi

          if [ "$has_spec_ready" != "true" ]; then
            # Weder abgeschlossen noch bewusst fortgesetzt (z. B. 🔴-Ampel hat ai:spec-ready
            # entfernt) -- kein Soft-Abort-Fall, nichts zu tun.
            exit 0
          fi

          if [ "${ALREADY_CONTINUED:-false}" = "true" ]; then
            echo "::warning title=Issue #${ISSUE} Fortsetzungs-Obergrenze::Zweiter Zwischenstopp in Folge -- automatische Fortsetzung ausgeschoepft, markiere als zu gross."
            gh label create "ai:to-big-issue" --repo "$GITHUB_REPOSITORY" \
              --color B60205 --description "KI-Job lief in den Timeout -- Issue zu gross, bitte aufteilen" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:spec-ready" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:continued" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Automatischer Soft-Abort: 2 Versuche (Original + 1 Fortsetzung) ausgeschoepft, ohne die Spec abzuschliessen. Als \`ai:to-big-issue\` markiert -- bitte aufteilen oder nach Behebung das Label entfernen, um es erneut zu versuchen." 2>/dev/null || true
          else
            gh label create "ai:continued" --repo "$GITHUB_REPOSITORY" \
              --color FBCA04 --description "Automatischer Soft-Abort: Lauf hat sich selbst fuer eine Fortsetzung neu getriggert" 2>/dev/null || true
            gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:continued"
            echo "::notice title=Issue #${ISSUE} Soft-Abort::Erster Zwischenstopp -- Folgelauf per Selbst-Retrigger (ai:spec-ready) unterwegs."
          fi

      # Bei hartem Timeout (Agent-Schritt cancelled) ist das Issue zu gross fuer einen Spec-Lauf:
      # mit "ai:to-big-issue" markieren und "ai:spec-ready" entfernen, damit der Spec-Workflow es
      # nicht erneut aufgreift. Laeuft im Cancellation-Grace-Fenster (if: always(), ~5 Min).
      # Zeit-Guard: nur labeln, wenn der Lauf das 20-Min-Limit nahezu ausgeschoepft hat (>= 18 Min).
      - name: Bei Timeout als zu gross markieren (ai:to-big-issue)
        if: always() && steps.preflight.outputs.configured == 'true' && steps.claude.outcome == 'cancelled'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_START: ${{ steps.starttime.outputs.epoch }}
        run: |
          elapsed=$(( $(date +%s) - ${RUN_START:-0} ))
          if [ "${RUN_START:-0}" -eq 0 ] || [ "$elapsed" -lt 1080 ]; then
            echo "::notice title=Kein Timeout::Lauf nach ${elapsed}s abgebrochen (< 18 Min) — vermutlich manueller Cancel, kein ai:to-big-issue."
            exit 0
          fi
          gh label create "ai:to-big-issue" --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "KI-Job lief in den Timeout — Issue zu gross, bitte aufteilen" 2>/dev/null || true
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label "ai:to-big-issue"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label "ai:spec-ready" 2>/dev/null || true
          echo "::warning title=Issue #${ISSUE} zu gross::20-Min-Timeout erreicht (${elapsed}s) — Label ai:to-big-issue gesetzt, ai:spec-ready entfernt; bitte Issue aufteilen."

      # Deterministisches Abschluss-Signal (unabhaengig von der LLM-Ausgabe): laeuft auch bei
      # Abbruch/Timeout (if: always()). outcome=cancelled signalisiert das 20-Min-Timeout.
      - name: Ergebnis zusammenfassen
        if: always() && steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.claude.outcome }}
          SESSION_ID: ${{ steps.claude.outputs.session_id }}
        run: |
          labels="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(", ")' 2>/dev/null || true)"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice title=✅ Spec erfolgreich::Issue #${ISSUE} — Rote Tests geschrieben"
          elif [ "$OUTCOME" = "cancelled" ]; then
            echo "::warning title=⏸️ Spec abgebrochen::Lauf durch neueren Trigger verdrängt (kein Fehler)"
          else
            echo "::error title=❌ Spec fehlgeschlagen::Claude-Lauf gescheitert"
          fi
          {
            echo "### Spec #${ISSUE} — fertig"
            echo ""
            echo "- Claude-Schritt: \`${OUTCOME:-unbekannt}\` (cancelled = 20-Min-Timeout erreicht)"
            echo "- Aktuelle Issue-Labels: ${labels:-keine}"
            if [ -n "$SESSION_ID" ]; then echo "- Session-ID: \`${SESSION_ID}\` (\`--resume\` zum Nachschauen)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Spec #${ISSUE} fertig::Claude-Schritt ${OUTCOME:-unbekannt}; Labels: ${labels:-keine}"
