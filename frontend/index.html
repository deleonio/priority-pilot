<!doctype html>
<html lang="de">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!--
			`viewport-fit=cover` lässt die App in der installierten PWA (`display: standalone`) bis unter
			Notch/Home-Indicator zeichnen UND schaltet damit erst die `env(safe-area-inset-*)`-Werte scharf,
			mit denen app.css die Ränder wieder freihält. Ohne dieses Flag liefern die Insets konstant 0.
		-->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<!--
			Browser-/Statusleiste zieht mit dem Farbschema mit. Die Werte spiegeln `--pp-bg` aus app.css
			(hell #ffffff, dunkel #16191d); das `theme_color` im PWA-Manifest (vite.config.ts) bleibt der
			Install-Zeit-Fallback für Plattformen ohne Media-abhängige Meta-Auswertung.
		-->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16191d" />
		<title>Priority Pilot</title>
		<!--
			Anti-FOUC-Bootstrap: setzt `data-theme`/`color-scheme` synchron auf <html>, BEVOR das
			(im Prod-Build als <link> extrahierte) app.css paintet und bevor das deferred Entry-Modul
			läuft. So sieht ein Nutzer mit gespeichertem Dunkel-Modus keinen kurzen Hell-Blitz.
			Schlüssel/Logik spiegeln src/lib/theme.ts (STORAGE_KEY 'pp-theme'); der useTheme-Hook
			übernimmt danach die Live-Steuerung. Bewusst inline + ohne Abhängigkeiten, damit es vor
			allem anderen greift; Fehler werden geschluckt, der App-Start ist nie blockiert.
		-->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('pp-theme');
					var preference = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'light';
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					var resolved = preference === 'system' ? (prefersDark ? 'dark' : 'light') : preference;
					document.documentElement.dataset.theme = resolved;
					document.documentElement.style.colorScheme = resolved;
				} catch (e) {
					/* localStorage/matchMedia evtl. blockiert — dann greift das Hell-Standard-Theme. */
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
