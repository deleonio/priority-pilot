<!doctype html>
<html lang="de">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!--
			`viewport-fit=cover` lässt die App in der installierten PWA (`display: standalone`) bis unter
			Notch/Home-Indicator zeichnen UND schaltet damit erst die `env(safe-area-inset-*)`-Werte scharf,
			mit denen app.css die Ränder wieder freihält. Ohne dieses Flag liefern die Insets konstant 0.
		-->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<!--
			Browser-/Statusleiste zieht mit dem Farbschema mit. Die Werte spiegeln `--pp-bg` aus app.css
			(hell #ffffff, dunkel #16191d); das `theme_color` im PWA-Manifest (vite.config.ts) bleibt der
			Install-Zeit-Fallback für Plattformen ohne Media-abhängige Meta-Auswertung.
		-->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16191d" />
		<title>Priority Pilot</title>
		<!--
			Anti-FOUC-Bootstrap: setzt `data-theme`/`color-scheme` synchron auf <html>, BEVOR das
			(im Prod-Build als <link> extrahierte) app.css paintet und bevor das deferred Entry-Modul
			läuft. Dunkelmodus ist deaktiviert (P1-2, PR #848): Die App läuft fix im Hell-Modus —
			auch eine gespeicherte Altlast `pp-theme=dark` aus Sessions vor der Deaktivierung darf
			keinen Dunkel-Blitz mehr auslösen. Spiegelt src/lib/theme.ts (applyInitialTheme);
			bewusst inline + ohne Abhängigkeiten, damit es vor allem anderen greift; Fehler werden
			geschluckt, der App-Start ist nie blockiert.
		-->
		<script>
			(function () {
				try {
					document.documentElement.dataset.theme = 'light';
					document.documentElement.style.colorScheme = 'light';
				} catch (e) {
					/* DOM evtl. nicht verfügbar — dann greift das Hell-Standard-Theme. */
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
