<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="Priority Pilot">
  <!-- Hintergrund: Dunkles Squircle für Maskable-Kompatibilität -->
  <rect width="192" height="192" rx="36" fill="#1a1a1a" />
  
  <!-- Kompass/Pilot-Motiv: Ring mit 5 Säulen-Segmenten (skaliert für 192x192) -->
  <!-- Die 5 Segment-Bögen unten bilden den Ring bereits vollständig ab (gleicher Radius, breiterer
       Stroke) - ein zusätzlicher Ring-Kreis wäre komplett von ihnen überdeckt. -->
  <!-- 5 Säulen als Segmente im Ring (72° pro Segment) -->
  <!-- Segment 1: Körper (0°–72°) -->
  <path d="M96 24 A72 72 0 0 1 164 74" fill="none" stroke="#4a90e2" stroke-width="8" stroke-linecap="round" />

  <!-- Segment 2: Beziehungen (72°–144°) -->
  <path d="M164 74 A72 72 0 0 1 138 154" fill="none" stroke="#50c878" stroke-width="8" stroke-linecap="round" />

  <!-- Segment 3: Sinn (144°–216°) -->
  <path d="M138 154 A72 72 0 0 1 54 154" fill="none" stroke="#ff6b6b" stroke-width="8" stroke-linecap="round" />

  <!-- Segment 4: Mentale Gesundheit (216°–288°) -->
  <path d="M54 154 A72 72 0 0 1 28 74" fill="none" stroke="#ffd93d" stroke-width="8" stroke-linecap="round" />

  <!-- Segment 5: Wirksamkeit (288°–360°, hervorgehoben als "nächster Schritt") -->
  <path d="M28 74 A72 72 0 0 1 96 24" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  
  <!-- Chevron/Pfeil als "nächster Schritt" Indikator -->
  <path d="M96 44 L112 68 L96 60 Z" fill="#ffffff" />
  
  <!-- Zentrum: Kleiner Punkt als Navigationszentrum -->
  <circle cx="96" cy="96" r="6" fill="#ffffff" />
</svg>
