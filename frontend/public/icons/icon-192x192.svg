<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="Priority Pilot">
  <!-- Hintergrund: Dunkles Squircle für Maskable-Kompatibilität -->
  <rect width="192" height="192" rx="36" fill="#1a1a1a" />
  
  <!-- Kompass/Pilot-Motiv: Ring mit 5 Säulen-Segmenten (skaliert für 192x192) -->
  <!-- Äußerer Ring (Kompass) -->
  <circle cx="96" cy="96" r="72" fill="none" stroke="#ffffff" stroke-width="4" />
  
  <!-- 5 Säulen als Segmente im Ring (72° pro Segment) -->
  <!-- Segment 1: Körper -->
  <path d="M96 20 A72 72 0 0 1 168 96" fill="none" stroke="#4a90e2" stroke-width="8" stroke-linecap="round" />
  
  <!-- Segment 2: Beziehungen -->
  <path d="M168 96 A72 72 0 0 1 96 168" fill="none" stroke="#50c878" stroke-width="8" stroke-linecap="round" />
  
  <!-- Segment 3: Sinn -->
  <path d="M96 168 A72 72 0 0 1 24 96" fill="none" stroke="#ff6b6b" stroke-width="8" stroke-linecap="round" />
  
  <!-- Segment 4: Mentale Gesundheit -->
  <path d="M24 96 A72 72 0 0 1 96 20" fill="none" stroke="#ffd93d" stroke-width="8" stroke-linecap="round" />
  
  <!-- Segment 5: Wirksamkeit (hervorgehoben als "nächster Schritt") -->
  <path d="M96 20 A72 72 0 0 1 168 96" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  
  <!-- Chevron/Pfeil als "nächster Schritt" Indikator -->
  <path d="M96 44 L112 68 L96 60 Z" fill="#ffffff" />
  
  <!-- Zentrum: Kleiner Punkt als Navigationszentrum -->
  <circle cx="96" cy="96" r="6" fill="#ffffff" />
</svg>
