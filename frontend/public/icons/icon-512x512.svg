<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Priority Pilot">
  <!-- Hintergrund: Dunkles Squircle für Maskable-Kompatibilität -->
  <rect width="512" height="512" rx="96" fill="#1a1a1a" />
  
  <!-- Kompass/Pilot-Motiv: Ring mit 5 Säulen-Segmenten -->
  <!-- Äußerer Ring (Kompass) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-width="12" />
  
  <!-- 5 Säulen als Segmente im Ring (72° pro Segment) -->
  <!-- Segment 1: Körper (unten rechts) -->
  <path d="M256 56 A200 200 0 0 1 456 256" fill="none" stroke="#4a90e2" stroke-width="24" stroke-linecap="round" />
  
  <!-- Segment 2: Beziehungen (unten links) -->
  <path d="M456 256 A200 200 0 0 1 256 456" fill="none" stroke="#50c878" stroke-width="24" stroke-linecap="round" />
  
  <!-- Segment 3: Sinn (oben links) -->
  <path d="M256 456 A200 200 0 0 1 56 256" fill="none" stroke="#ff6b6b" stroke-width="24" stroke-linecap="round" />
  
  <!-- Segment 4: Mentale Gesundheit (oben rechts) -->
  <path d="M56 256 A200 200 0 0 1 256 56" fill="none" stroke="#ffd93d" stroke-width="24" stroke-linecap="round" />
  
  <!-- Segment 5: Wirksamkeit (mitte rechts - hervorgehoben als "nächster Schritt") -->
  <path d="M256 56 A200 200 0 0 1 456 256" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" />
  
  <!-- Chevron/Pfeil als "nächster Schritt" Indikator (Wirksamkeit) -->
  <path d="M256 120 L320 200 L256 180 Z" fill="#ffffff" />
  
  <!-- Zentrum: Kleiner Punkt als Navigationszentrum -->
  <circle cx="256" cy="256" r="16" fill="#ffffff" />
</svg>
