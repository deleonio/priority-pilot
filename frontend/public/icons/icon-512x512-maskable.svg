<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Priority Pilot">
  <!-- Maskable-Version: Vollflächiger Hintergrund, wichtiger Inhalt in 80% Safe-Zone -->
  <rect width="512" height="512" fill="#1a1a1a" />
  
  <!-- Kompass/Pilot-Motiv: Ring mit 5 Säulen-Segmenten (in Safe-Zone) -->
  <!-- Äußerer Ring (Kompass) - etwas kleiner für Safe-Zone -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="12" />
  
  <!-- 5 Säulen als Segmente im Ring (72° pro Segment) -->
  <!-- Segment 1: Körper (0°–72°) -->
  <path d="M256 76 A180 180 0 0 1 427 200" fill="none" stroke="#4a90e2" stroke-width="24" stroke-linecap="round" />

  <!-- Segment 2: Beziehungen (72°–144°) -->
  <path d="M427 200 A180 180 0 0 1 362 402" fill="none" stroke="#50c878" stroke-width="24" stroke-linecap="round" />

  <!-- Segment 3: Sinn (144°–216°) -->
  <path d="M362 402 A180 180 0 0 1 150 402" fill="none" stroke="#ff6b6b" stroke-width="24" stroke-linecap="round" />

  <!-- Segment 4: Mentale Gesundheit (216°–288°) -->
  <path d="M150 402 A180 180 0 0 1 85 200" fill="none" stroke="#ffd93d" stroke-width="24" stroke-linecap="round" />

  <!-- Segment 5: Wirksamkeit (288°–360°, hervorgehoben als "nächster Schritt") -->
  <path d="M85 200 A180 180 0 0 1 256 76" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" />
  
  <!-- Chevron/Pfeil als "nächster Schritt" Indikator -->
  <path d="M256 140 L320 200 L256 190 Z" fill="#ffffff" />
  
  <!-- Zentrum: Kleiner Punkt als Navigationszentrum -->
  <circle cx="256" cy="256" r="16" fill="#ffffff" />
</svg>
