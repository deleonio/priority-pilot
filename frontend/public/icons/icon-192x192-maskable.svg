<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="Priority Pilot">
  <!-- Maskable-Version: Vollflächiger Hintergrund, wichtiger Inhalt in 80% Safe-Zone -->
  <rect width="192" height="192" fill="#1a1a1a" />
  
  <!-- Kompass/Pilot-Motiv: Ring mit 5 Säulen-Segmenten (in Safe-Zone) -->
  <!-- Die 5 Segment-Bögen unten bilden den Ring bereits vollständig ab (gleicher Radius, breiterer
       Stroke) - ein zusätzlicher Ring-Kreis wäre komplett von ihnen überdeckt. -->
  <!-- 5 Säulen als Segmente im Ring (72° pro Segment) -->
  <!-- Segment 1: Körper (0°–72°) -->
  <path d="M96 28 A68 68 0 0 1 161 75" fill="none" stroke="#4a90e2" stroke-width="8" stroke-linecap="round" />

  <!-- Segment 2: Beziehungen (72°–144°) -->
  <path d="M161 75 A68 68 0 0 1 136 151" fill="none" stroke="#50c878" stroke-width="8" stroke-linecap="round" />

  <!-- Segment 3: Sinn (144°–216°) -->
  <path d="M136 151 A68 68 0 0 1 56 151" fill="none" stroke="#ff6b6b" stroke-width="8" stroke-linecap="round" />

  <!-- Segment 4: Mentale Gesundheit (216°–288°) -->
  <path d="M56 151 A68 68 0 0 1 31 75" fill="none" stroke="#ffd93d" stroke-width="8" stroke-linecap="round" />

  <!-- Segment 5: Wirksamkeit (288°–360°, hervorgehoben als "nächster Schritt") -->
  <path d="M31 75 A68 68 0 0 1 96 28" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
  
  <!-- Chevron/Pfeil als "nächster Schritt" Indikator -->
  <path d="M96 50 L112 64 L96 58 Z" fill="#ffffff" />
  
  <!-- Zentrum: Kleiner Punkt als Navigationszentrum -->
  <circle cx="96" cy="96" r="6" fill="#ffffff" />
</svg>
