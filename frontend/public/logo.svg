<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" role="img" aria-label="Priority Pilot Logo">
  <!-- Hintergrund (optional, kann transparent sein) -->
  <rect width="400" height="120" fill="none" />
  
  <!-- Kompass/Ring-Element (links) -->
  <g transform="translate(40, 60)">
    <!-- Äußerer Ring -->
    <circle cx="60" cy="0" r="50" fill="none" stroke="currentColor" stroke-width="3" />
    
    <!-- 5 Säulen-Segmente (miniaturisiert, 72° pro Segment) -->
    <path d="M60 -50 A50 50 0 0 1 107.6 -15.5" fill="none" stroke="#4a90e2" stroke-width="6" stroke-linecap="round" />
    <path d="M107.6 -15.5 A50 50 0 0 1 89.4 40.5" fill="none" stroke="#50c878" stroke-width="6" stroke-linecap="round" />
    <path d="M89.4 40.5 A50 50 0 0 1 30.6 40.5" fill="none" stroke="#ff6b6b" stroke-width="6" stroke-linecap="round" />
    <path d="M30.6 40.5 A50 50 0 0 1 12.4 -15.5" fill="none" stroke="#ffd93d" stroke-width="6" stroke-linecap="round" />
    <path d="M12.4 -15.5 A50 50 0 0 1 60 -50" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />

    <!-- Chevron/Pfeil (Wirksamkeit-Richtung) -->
    <path d="M28 -35 L16 -20 L22 -28 Z" fill="#ffffff" />
    
    <!-- Zentrum -->
    <circle cx="60" cy="0" r="4" fill="currentColor" />
  </g>
  
  <!-- Text: Priority Pilot -->
  <g transform="translate(140, 60)">
    <!-- Priority -->
    <text x="0" y="-15" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="currentColor">Priority</text>
    
    <!-- Pilot -->
    <text x="0" y="25" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="400" fill="currentColor">Pilot</text>
    
    <!-- Dekoratives Element: Kleiner Pfeil zwischen den Wörtern -->
    <path d="M120 -10 L140 10 L135 5 Z" fill="#4a90e2" />
  </g>
</svg>
