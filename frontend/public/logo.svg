<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" role="img" aria-label="Priority Pilot Logo">
  <!-- Hintergrund (optional, kann transparent sein) -->
  <rect width="400" height="120" fill="none" />
  
  <!-- Kompass/Ring-Element (links) -->
  <g transform="translate(40, 60)">
    <!-- Äußerer Ring -->
    <circle cx="60" cy="0" r="50" fill="none" stroke="#1a1a1a" stroke-width="3" />
    
    <!-- 5 Säulen-Segmente (miniaturisiert) -->
    <path d="M60 -50 A50 50 0 0 1 110 0" fill="none" stroke="#4a90e2" stroke-width="6" stroke-linecap="round" />
    <path d="M110 0 A50 50 0 0 1 60 50" fill="none" stroke="#50c878" stroke-width="6" stroke-linecap="round" />
    <path d="M60 50 A50 50 0 0 1 10 0" fill="none" stroke="#ff6b6b" stroke-width="6" stroke-linecap="round" />
    <path d="M10 0 A50 50 0 0 1 60 -50" fill="none" stroke="#ffd93d" stroke-width="6" stroke-linecap="round" />
    <path d="M60 -50 A50 50 0 0 1 110 0" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" />
    
    <!-- Chevron/Pfeil -->
    <path d="M60 -20 L80 0 L60 -10 Z" fill="#1a1a1a" />
    
    <!-- Zentrum -->
    <circle cx="60" cy="0" r="4" fill="#1a1a1a" />
  </g>
  
  <!-- Text: Priority Pilot -->
  <g transform="translate(140, 60)">
    <!-- Priority -->
    <text x="0" y="-15" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#1a1a1a">Priority</text>
    
    <!-- Pilot -->
    <text x="0" y="25" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="400" fill="#1a1a1a">Pilot</text>
    
    <!-- Dekoratives Element: Kleiner Pfeil zwischen den Wörtern -->
    <path d="M120 -10 L140 10 L135 5 Z" fill="#4a90e2" />
  </g>
</svg>
