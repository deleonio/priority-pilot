      description: >-
        Nur für Admins (403 sonst). Liefert je Woche die Anzahl angezeigter, übernommener,
        abgelehnter und ignorierter Vorlagen (ignoriert erst für Wochen, deren Ende mindestens
        7 Tage zurückliegt) sowie die 4- und 12-Wochen-Bindung getrennt nach Fürsorge-Push an
        und aus. Nur Summen, keine Nutzer-IDs; Zellen mit weniger als 5 Nutzern werden als
        `unterdrueckt` ausgegeben.
      operationId: getCareWirkung
      tags: [admin]
      responses:
        '200':
          description: Auswertung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareWirkung'
        '403':
          description: Angemeldeter Nutzer ist kein Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/kpis:
