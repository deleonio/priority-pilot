                    enum: [activated]
                  accessMailStatus:
                    type: string
                    enum: [sent, failed]
                    description: Ergebnis der Freischalt-Mail mit Login-Link (#2305).
        '400':
          description: Ungültige Eintrags-Id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Angemeldeter Nutzer ist kein Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
