        Bereits freigeschaltete belegen ihren Platz in den Top N, werden aber nicht erneut
        gezählt — `activatedCount` meldet nur die neu freigeschalteten Einträge. Je neu
        freigeschaltetem Eintrag geht eine Mail mit Login-Link raus (#2305).
