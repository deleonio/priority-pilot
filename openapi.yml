openapi: 3.0.0
info:
  title: Balamentum API
  description: >-
    Vertrag für die Aufgaben-Priorisierung über einen gewichteten
    Abhängigkeitsgraphen. Aus dieser Datei werden via `openapi-typescript`
    sowohl die Server-Typen (`server/src/api.d.ts`) als auch die Client-Typen
    (`client/src/schema.d.ts`) erzeugt.
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  /tasks:
    get:
      summary: Alle Tasks auflisten
      operationId: listTasks
      parameters:
        - name: missed
          in: query
          required: false
          schema:
            type: string
            enum: ['1']
          description: >-
            Verpasst-Auswahl (#1964): mit `missed=1` liefert der Endpunkt nur die überfälligen,
            nicht erledigten Aufgaben ohne Auto-Lösch-Häkchen und ohne Archiv — abgeleitete
            Ansicht, kein neuer Status.
        - name: archived
          in: query
          required: false
          schema:
            type: string
            enum: ['1']
          description: >-
            Archiv-Ansicht: mit `archived=1` liefert der Endpunkt nur die archivierten Aufgaben
            (ohne den Parameter erscheinen sie nie in der Liste).
      responses:
        '200':
          description: Liste aller Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      summary: Neuen Task anlegen
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
  /tasks/nearby:
    get:
      summary: Offene Tasks nach Distanz zur Position (#1066)
      description: >-
        Liefert maximal 10 offene Tasks (Status Open/In process) mit Koordinaten des
        eingeloggten Nutzers, aufsteigend nach Distanz (Haversine) zur übergebenen
        Position. Auth-pflichtig und owner-scoped (Datenisolation, #207/#244).
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: float
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          schema:
            type: number
            format: float
            minimum: -180
            maximum: 180
      responses:
        '200':
          description: Nearby-Liste (ggf. leer).
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/NearbyTask'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
  /tasks/free-slots:
    get:
      summary: Freie Zeit — Kalender-Lücken mit passenden Aufgaben (#1990)
      description: >-
        Liefert die Lücken im verbundenen Kalender von jetzt bis 22:00 (Serverzeit), die
        mindestens `freeSlotMinMinutes` lang sind, je Lücke höchstens drei offene Aufgaben,
        deren Aufwand (0.1 → 15 min … 1.0 → 120 min) hineinpasst, in Empfehlungs-Reihenfolge.
        Höchstens drei Lücken. Ohne Kalenderquelle oder bei Fehlern eine leere Liste.
      operationId: listFreeSlots
      tags: [tasks]
      responses:
        '200':
          description: Lücken mit passenden Aufgaben (ggf. leer).
          content:
            application/json:
              schema:
                type: array
                maxItems: 3
                items:
                  $ref: '#/components/schemas/FreeSlot'
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      summary: Einen Task abrufen
      operationId: getTask
      responses:
        '200':
          description: Der angeforderte Task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Einen Task teilweise aktualisieren
      description: >-
        Auch ein bereits erledigter Task (`status: Done`) ist direkt bearbeitbar (#1821,
        löst die Sperre aus #1438 ab). Ändern sich dabei Aufwand, Priorität oder Deadline,
        werden die Punkte des bestehenden Score-Eintrags mit dem gespeicherten
        Erledigt-Zeitpunkt neu berechnet.
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Der aktualisierte Task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Einen Task löschen
      operationId: deleteTask
      responses:
        '204':
          description: Task wurde gelöscht
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      summary: Einen Task archivieren (#1964)
      description: >-
        Nimmt den Task `{id}` aus Aufgabenliste und Verpasst-Bereich heraus, ohne ihn zu
        löschen und ohne den Status zu ändern (Score/Streak unberührt). Setzt `archivedAt`
        auf den Zeitpunkt des Aufrufs; der Task bleibt per `GET /tasks/{id}` lesbar.
      operationId: archiveTask
      responses:
        '200':
          description: Der archivierte Task (mit `archivedAt`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{id}/snooze:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      summary: Einen Task kurz zurückstellen (#2244)
      description: >-
        Blendet den Task `{id}` für 3 Stunden aus `GET /next` und `GET /suggestions` aus
        (Server setzt `snoozedUntil`, der Client sendet keine Zeit). Kein Verschieben:
        `postponeCount` und Bewertung bleiben unverändert.
      operationId: snoozeTask
      responses:
        '200':
          description: Der zurückgestellte Task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{id}/ai-draft:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      summary: KI-Entwurf zu einem Task erstellen (#2350)
      description: >-
        Ruft das LLM genau einmal mit dem Auftrag der serverseitig ermittelten KI-Eignung
        (`aiSuitability`: Entwurf, Zusammenfassung oder Recherche) auf und speichert das Ergebnis
        in `aiDraft`; `description` bleibt unverändert. Ein vorhandener Entwurf wird überschrieben.
        Aufgaben ohne Eignung antworten mit 400 ohne LLM-Aufruf. Zählt zum KI-Kontingent.
      operationId: createTaskAiDraft
      parameters:
        - name: provider
          in: query
          required: false
          description: >-
            Optionaler Provider-Pinning (#749/#951): Name eines konfigurierten
            Providers — überschreibt den aktiven Provider für diesen EINEN Aufruf.
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: Der gespeicherte Entwurf.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAiDraft'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/QuotaExhausted'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      summary: KI-Entwurf eines Tasks verwerfen (#2350)
      description: Setzt `aiDraft` auf `null`; `description` bleibt unverändert.
      operationId: deleteTaskAiDraft
      responses:
        '204':
          description: Entwurf wurde verworfen
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{id}/unarchive:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      summary: Einen archivierten Task wiederherstellen
      description: >-
        Setzt `archivedAt` des Tasks `{id}` zurück auf `null`; der Task erscheint wieder in
        Aufgabenliste (und ggf. Verpasst-Bereich).
      operationId: unarchiveTask
      responses:
        '200':
          description: Der wiederhergestellte Task (`archivedAt` ist `null`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{id}/dependencies:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      summary: Abhängigkeit (Vorgänger) zu einem Task hinzufügen
      description: >-
        Fügt dem Task `{id}` eine Abhängigkeit hinzu — den im Body angegebenen
        Task, von dem `{id}` abhängt (Vorgänger/Prerequisite). Entspricht
        `task.addDependency()`. Eine Abhängigkeit, die einen Zyklus erzeugen
        würde, wird mit `409` abgelehnt. Ein `weight` im Body erfordert das
        Feature `graph_weight` (ab Paket Plus, #1782), sonst `403`.
      operationId: addDependency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependencyInput'
      responses:
        '201':
          description: Abhängigkeit wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tasks/{id}/dependencies/{depId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - name: depId
        in: path
        required: true
        description: ID der zu entfernenden Abhängigkeit (Vorgänger-Task, von dem `{id}` abhängt)
        schema:
          type: integer
    delete:
      summary: Abhängigkeit (Vorgänger) von einem Task entfernen
      operationId: removeDependency
      responses:
        '204':
          description: Abhängigkeit wurde entfernt
        '403':
          $ref: '#/components/responses/PlanRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /pillars:
    get:
      summary: Alle Lebensbalance-Säulen auflisten
      description: >-
        Liefert die fünf festen Säulen inkl. ihres prozentualen Anteils
        (`weight`); die Gewichte summieren sich über alle Säulen auf 100.
      operationId: listPillars
      responses:
        '200':
          description: Liste aller Säulen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pillar'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Säule anlegen — gesperrt (403)
      description: >-
        Gesperrt seit #1573: Die fünf Lebensbalance-Säulen sind fest und gelten
        stets. Anlegen, Umbenennen und Löschen sind serverseitig gesperrt; der
        Endpunkt existiert weiter und antwortet immer mit 403.
      operationId: createPillar
      responses:
        '403':
          $ref: '#/components/responses/PillarsLocked'
  /pillars/{id}:
    parameters:
      - $ref: '#/components/parameters/PillarId'
    patch:
      summary: Säule aktualisieren — gesperrt (403)
      description: >-
        Gesperrt seit #1573: Die fünf Lebensbalance-Säulen sind fest und gelten
        stets. Anlegen, Umbenennen und Löschen sind serverseitig gesperrt; der
        Endpunkt existiert weiter und antwortet immer mit 403.
      operationId: updatePillar
      responses:
        '403':
          $ref: '#/components/responses/PillarsLocked'
    delete:
      summary: Säule löschen — gesperrt (403)
      description: >-
        Gesperrt seit #1573: Die fünf Lebensbalance-Säulen sind fest und gelten
        stets. Anlegen, Umbenennen und Löschen sind serverseitig gesperrt; der
        Endpunkt existiert weiter und antwortet immer mit 403.
      operationId: deletePillar
      responses:
        '403':
          $ref: '#/components/responses/PillarsLocked'
  /categories:
    get:
      summary: Alle Kategorien auflisten
      description: >-
        Liefert die thematischen Kategorien des eingeloggten Nutzers. Kategorien sind
        die flache Ordnungsebene neben den Lebensbalance-Säulen: Sie gruppieren und
        filtern, ohne in Wert-, Score- oder Balance-Berechnung einzufließen.
      operationId: listCategories
      responses:
        '200':
          description: Liste aller Kategorien des Nutzers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Neue Kategorie anlegen
      description: >-
        Legt eine Kategorie für den eingeloggten Nutzer an. Der Name ist pro Nutzer
        eindeutig (409 bei Dublette), die Farbe stammt aus der festen Palette.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Kategorie wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    patch:
      summary: Kategorie teilweise aktualisieren
      description: >-
        Ändert Name und/oder Farbe einer Kategorie. Bei Namenskonflikt 409, bei
        unbekannter oder fremder ID 404.
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Die aktualisierte Kategorie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Kategorie löschen
      description: >-
        Löscht die Kategorie. Aufgaben und Serien bleiben erhalten und verlieren nur
        die Zuordnung (`categoryId` wird auf `null` gesetzt).
      operationId: deleteCategory
      responses:
        '204':
          description: Kategorie wurde gelöscht
        '404':
          $ref: '#/components/responses/NotFound'
  /pillars/weights:
    put:
      summary: Gewichtung (100 %-Verteilung) über alle Säulen setzen
      description: >-
        Setzt die prozentuale Verteilung über die Säulen. Der Body muss genau
        alle existierenden Säulen enthalten; die Summe der Gewichte muss 100
        ergeben und jedes Gewicht `>= 0` sein.
      operationId: setPillarWeights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PillarWeightsInput'
      responses:
        '200':
          description: Die aktualisierte Liste aller Säulen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pillar'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /lektorat:
    post:
      summary: Text lektorieren (LLM-Kaskade)
      description: >-
        Lektoriert einen frei formulierten Text (#680) — Rechtschreibung, Grammatik und
        Formulierung — und kürzt ihn auf Wunsch auf `maxLength` Zeichen. Der Aufruf läuft
        über die konfigurierte LLM-Kaskade und setzt eine Session voraus: Fehlt der Key,
        antwortet der Endpoint mit 503; bei Upstream-/Format-Fehlern mit 502.
      operationId: lektorat
      parameters:
        - name: provider
          in: query
          required: false
          description: >-
            Optionaler Provider-Pinning (#749/#951): Name eines konfigurierten
            Providers — überschreibt den aktiven Provider für diesen EINEN Aufruf.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LektoratInput'
      responses:
        '200':
          description: Lektorierter Text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LektoratResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '429':
          $ref: '#/components/responses/QuotaExhausted'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /pillars/advisor:
    post:
      summary: Aktivitäten-Berater für die Säulen (Mistral)
      description: >-
        Kleiner Berater auf Basis der Säulen: schlägt konkrete Aktivitäten vor und
        ordnet jede Aktivität den Säulen zu, auf die sie einzahlen würde. Als Rubrik
        dienen die Kurzbeschreibungen der Säulen aus den Einstellungen
        (`Pillar.description`). Optional lenkt eine frei formulierte Frage bzw.
        Situationsbeschreibung die Vorschläge; ohne Frage deckt der Berater alle
        Säulen ab. Die Beratung erfolgt über die Mistral-API (`MISTRAL_API_KEY`,
        Modell via `MISTRAL_MODEL`, Default `mistral-small-latest`). Fehlt der Key
        oder gibt es keine Säulen, antwortet der Endpoint mit 503; bei
        Upstream-/Format-Fehlern mit 502.
      operationId: advisePillarActivities
      parameters:
        - name: provider
          in: query
          required: false
          description: >-
            Optionaler Provider-Pinning (#749/#951): Name eines konfigurierten
            Providers — überschreibt den aktiven Provider für diesen EINEN Aufruf.
            Fehlt der Parameter → der aktive Provider (`llm_providers`, #951).
            Ungültiger Wert → HTTP 400.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityAdvisorInput'
      responses:
        '200':
          description: Vorgeschlagene Aktivitäten samt Säulen-Zuordnung und Begründung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityAdvisorResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '429':
          $ref: '#/components/responses/QuotaExhausted'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/suggest-pillars:
    post:
      summary: Säulen-Einzahlung per Mistral klassifizieren
      description: >-
        Schlägt anhand von Titel/Beschreibung/Kontext vor, auf welche Säulen eine
        Aufgabe einzahlt, samt Konfidenz (0–100) je Säule. Die Klassifikation
        erfolgt über die Mistral-API (`MISTRAL_API_KEY`, Modell via `MISTRAL_MODEL`,
        Default `mistral-small-latest`). Fehlt der Key oder gibt es keine Säulen,
        antwortet der Endpoint mit 503; bei Upstream-/Format-Fehlern mit 502.
      operationId: suggestPillars
      parameters:
        - name: provider
          in: query
          required: false
          description: >-
            Optionaler Provider-Pinning (#749/#951): Name eines konfigurierten
            Providers — überschreibt den aktiven Provider für diesen EINEN Aufruf.
            Fehlt der Parameter → der aktive Provider (`llm_providers`, #951).
            Ungültiger Wert → HTTP 400.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestPillarsInput'
      responses:
        '200':
          description: Vorgeschlagene Säulen-Einzahlungen mit Konfidenz
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestPillarsResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '429':
          $ref: '#/components/responses/QuotaExhausted'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/suggest-pillars/feedback:
    post:
      summary: Säulen-Korrektur als Feedback speichern
      description: >-
        Speichert eine vom Nutzer bestätigte/korrigierte Säulen-Zuordnung (Titel/
        Beschreibung + final gewählte Säulen). Die jüngsten Korrekturen fließen als
        gelernte Few-Shot-Beispiele in nachfolgende Klassifikationen ein und
        kalibrieren sie personalisiert (Feedback-Loop, siehe #45). Da es kein
        Nutzerkonzept gibt, wirkt das Feedback global.
      operationId: recordPillarFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PillarFeedbackInput'
      responses:
        '201':
          description: Das Feedback-Sample wurde gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PillarFeedbackResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/parse-search:
    post:
      summary: Gesprochene/getippte Suchanfrage in Suchbegriff und Kategorie zerlegen
      description: >-
        Trennt eine frei formulierte Suchanfrage („offene Sachen zum Hausbau") in den
        reinen Suchbegriff und die gemeinte Kategorie des Nutzers. Die Kategorien des
        eingeloggten Nutzers gibt der Server dem Modell vor; erkennt es keine, bleibt
        `categoryId` leer. Fehlt der LLM-Key, antwortet der Endpoint mit 503; bei
        Upstream-/Format-Fehlern mit 502.
      operationId: parseSearchQuery
      parameters:
        - name: provider
          in: query
          required: false
          description: >-
            Optionaler Provider-Pinning (#749/#951): Name eines konfigurierten
            Providers — überschreibt den aktiven Provider für diesen EINEN Aufruf.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseTaskInput'
      responses:
        '200':
          description: Aus der Anfrage extrahierter Suchbegriff und Kategoriefilter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsedSearch'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '429':
          $ref: '#/components/responses/QuotaExhausted'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/parse-text:
    post:
      summary: Task-Freitext per Mistral in strukturierte Felder parsen
      description: >-
        Extrahiert aus einem frei formulierten Text (Schnellerfassung, #235) die
        strukturierten Felder einer Aufgabe (Titel plus optional Beschreibung,
        Priorität, geschätzter Aufwand und Deadline). Das Parsing erfolgt über die
        Mistral-API (`MISTRAL_API_KEY`, Modell via `MISTRAL_MODEL`, Default
        `mistral-small-latest`). Fehlt der Key, antwortet der Endpoint mit 503; bei
        Upstream-/Format-Fehlern mit 502.
      operationId: parseTaskText
      parameters:
        - name: provider
          in: query
          required: false
          description: >-
            Optionaler Provider-Pinning (#749/#951): Name eines konfigurierten
            Providers — überschreibt den aktiven Provider für diesen EINEN Aufruf.
            Fehlt der Parameter → der aktive Provider (`llm_providers`, #951).
            Ungültiger Wert → HTTP 400.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseTaskInput'
      responses:
        '200':
          description: Aus dem Text extrahierte, strukturierte Task-Felder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsedTask'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '429':
          $ref: '#/components/responses/QuotaExhausted'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /templates/{slug}/preview:
    get:
      summary: Vorschau einer Vorlage
      description: >-
        Nennt Anzahl der Aufgaben und Abhängigkeiten sowie die Schritt-Struktur
        einer Vorlage aus der Bibliothek (#1993) — schreibt nichts.
      operationId: previewTemplate
      parameters:
        - name: slug
          in: path
          required: true
          description: Kennung der Vorlage (z. B. `hausbau`)
          schema:
            type: string
      responses:
        '200':
          description: Zählwerte und Struktur der Vorlage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePreview'
        '404':
          $ref: '#/components/responses/NotFound'
  /templates/{slug}/apply:
    post:
      summary: Vorlage als Aufgabenpaket übernehmen
      description: >-
        Legt in einer Transaktion je Schritt eine Aufgabe, je Vorgänger-Kante
        eine Abhängigkeit und die Kategorie (Name = Vorlagentitel, vorhandene
        Kategorie des Nutzers wird wiederverwendet) an (#1993). Bei einem Fehler
        bleibt nichts zurück. Erneutes Übernehmen erzeugt eine zweite vollständige
        Kopie.
      operationId: applyTemplate
      parameters:
        - name: slug
          in: path
          required: true
          description: Kennung der Vorlage (z. B. `hausbau`)
          schema:
            type: string
      responses:
        '201':
          description: Neu angelegte Aufgaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateApplyResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/import/preview:
    post:
      summary: CSV-Import-Vorschau ohne Schreibzugriff
      description: >-
        Parst eine Todoist-Export-CSV oder eine Allgemein-CSV (#1969) und liefert
        Zeilenzahlen, bis zu fünf Beispiel-Zeilen, je unlesbarer Zeile Nummer und
        Grund sowie nicht zuordenbare Kategorie-/Säulenwerte. Ohne `mapping` gilt
        die Todoist-Auto-Erkennung (Spalten TYPE/CONTENT/PRIORITY/DATE). Legt
        keine Aufgaben an. Grenzen: CSV größer 10 MB oder mehr als 5000
        Datenzeilen → 400 mit Meldung (bewusst nicht 413 — der Import-Pfad
        mountet einen eigenen Body-Parser mit 11-MB-Limit).
      operationId: previewTaskImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskImportInput'
      responses:
        '200':
          description: Vorschau der übernehmbaren Zeilen (ohne Schreibzugriff)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskImportPreview'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/import:
    post:
      summary: Aufgaben aus CSV anlegen
      description: >-
        Legt die übernehmbaren Zeilen der CSV als Aufgaben des eingeloggten
        Nutzers an (#1969) — additiv, ohne Bestand zu ändern. Unlesbare Zeilen
        werden einzeln gemeldet (Nummer + Grund), ohne den Import abzubrechen;
        Kategorie-/Säulenwerte werden per Name (case-insensitive) gegen den
        Bestand des Nutzers gematcht, unbekannte bleiben ohne Zuordnung. Ohne
        übernehmbare Zeile → 400.
      operationId: importTasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskImportInput'
      responses:
        '200':
          description: Anzahl angelegter Aufgaben samt Zeilenfehlern
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskImportResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/import/analysis:
    post:
      summary: Import-Analyse-Bericht erzeugen
      description: >-
        Analysiert dieselbe CSV-Eingabe wie der Import und liefert den Bericht
        für die Import-Karte (#1988): Anzahl übernehmbarer Zeilen, Zeilen ohne
        Frist und exakte Dubletten (identisch normalisierter Titel, trim +
        lowercase). Dubletten werden im Bestand des Nutzers gezählt, sodass
        Kopien innerhalb der CSV und Treffer gegen vorhandene Aufgaben gleichermaßen
        sichtbar sind. Abhängigkeits-Vermutungen kommen vom aktiven LLM-Provider
        und degradieren still (Fehler/Erschöpfung → leere Liste); die Grundform
        braucht weder Plan-Merkmal ai_assist noch Kontingent.
      operationId: analyzeTaskImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskImportInput'
      responses:
        '200':
          description: Analyse-Bericht mit Grundform und (ggf. leeren) KI-Vorschlägen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskImportAnalysis'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/import/merge:
    post:
      summary: Exakte Dublette zusammenführen
      description: >-
        Entfernt die Dublette und übernimmt fehlende Felder (Frist; Priorität,
        solange der verbleibende Task den Modell-Default 3 trägt) in den
        verbleibenden Task (#1988). Genau ein Task bleibt übrig. Beide Tasks
        müssen dem eingeloggten Nutzer gehören — fremde Tasks → 404.
      operationId: mergeTaskImportDuplicate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskImportMergeInput'
      responses:
        '200':
          description: Merge abgeschlossen — ID des verbleibenden Tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskImportMergeResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/suggest-initial:
    post:
      summary: Erststart-Aufgabenvorschläge aus Freitext erzeugen
      description: >-
        Macht aus einer freien Beschreibung („Was beschäftigt dich gerade?“)
        fünf bis acht konkrete, sofort startbare Aufgaben-Vorschläge (#2068),
        jeweils mit einer Säule des Nutzers und optional einem Vorgänger-Verweis
        (`dependsOn`). Es werden keine Aufgaben angelegt, nur vorgeschlagen. Der
        Aufruf erfolgt über den aktiven LLM-Provider. Ohne angelegte Säulen
        antwortet der Endpoint mit 503; bei Upstream-/Format-Fehlern mit 502.
      operationId: suggestInitialTasks
      parameters:
        - name: provider
          in: query
          required: false
          description: >-
            Optionaler Provider-Pinning (#749/#951): Name eines konfigurierten
            Providers — überschreibt den aktiven Provider für diesen EINEN Aufruf.
            Fehlt der Parameter → der aktive Provider (`llm_providers`, #951).
            Ungültiger Wert → HTTP 400.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestInitialTasksInput'
      responses:
        '200':
          description: Bereinigte Liste der Aufgaben-Vorschläge (auch mit weniger als 5 Einträgen)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestInitialTasksResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '429':
          $ref: '#/components/responses/QuotaExhausted'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /health:
    get:
      summary: Liveness-Check
      description: >-
        Billiger Liveness-Check für Post-Deploy-Verifikation und Monitoring —
        robuster als der fachliche `GET /next`, da ohne Datenbank-Zugriff.
      operationId: getHealth
      responses:
        '200':
          description: Der Dienst läuft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /forest:
    get:
      summary: Aufgabenwald nach Wertschöpfung sortiert
      description: >-
        Liefert die Wurzel-Tasks (ohne Abhängigkeiten) als Bäume, absteigend
        nach Wertbeitrag sortiert (siehe `buildTaskForest`).
      operationId: getForest
      responses:
        '200':
          description: Liste der Aufgabenbäume
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskTreeNode'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /graph:
    get:
      summary: Aufgabengraph mit gewichteten Kanten
      description: >-
        Liefert die aktiven Aufgaben (`Open`/`In process`) des Nutzers als flache
        Knotenliste plus die gewichteten Kanten zwischen ihnen (siehe `buildTaskGraph`).
        Anders als `/forest` erscheint eine Aufgabe, die mehreren übergeordneten
        Aufgaben zuarbeitet, genau einmal — mit mehreren Kanten statt mehreren Kopien.
        Kennzahlen (`value`, `totalEstimatedEffort`, `progress`) sind wertgleich zu
        `/forest`.
      operationId: getTaskGraph
      responses:
        '200':
          description: Knoten und Kanten des Aufgabengraphen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskGraph'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /next:
    get:
      summary: Nächsten wichtigen Task ermitteln
      description: >-
        Liefert den Task mit dem höchsten Score derselben Bewertung, die
        `GET /suggestions` ordnet; nur Tasks, deren Abhängigkeiten alle
        abgeschlossen sind (siehe `findNextImportantTask`).
      operationId: getNextTask
      responses:
        '200':
          description: Der nächste wichtige Task oder `null`, falls keiner vorhanden ist
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/TaskRecommendation'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /suggestions:
    get:
      summary: '"Was ist jetzt dran?"-Vorschlagsliste'
      description: >-
        Liefert die nach Score sortierte, post-gefilterte Vorschlagsliste
        (Konzept §4.3): Priorität, Entsperr-Wirkung, Balance-Korrektur,
        Deadline-Nähe und Aufwand fließen ein, der Überlastungsschutz begrenzt die Liste (siehe
        `findSuggestedTasks`). Der Abhängigkeitsfilter aus `GET /next` bleibt
        vorgeschaltet.
      operationId: getSuggestions
      responses:
        '200':
          description: Nach Score sortierte Vorschlagsliste (ggf. leer)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskRecommendation'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /reverse-geocode:
    get:
      summary: Reverse Geocoding — Koordinaten → Adresse
      description: >-
        Ermittelt aus geographischen Koordinaten (lat/lon) eine lesbare Adresse
        über OpenStreetMap Nominatim (Issue #866). Bei Rate-Limit/Timeout/Offline
        wird eine leere Adresse zurückgegeben (Position anzeigen ohne Adresse).
        Rate-Limit: 1 req/sec (Nominatim-Policy).
      operationId: reverseGeocode
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: string
            pattern: '^-?\d+\.?\d*$'
          description: Breitengrad (z. B. 52.52)
        - name: lon
          in: query
          required: true
          schema:
            type: string
            pattern: '^-?\d+\.?\d*$'
          description: Längengrad (z. B. 13.405)
      responses:
        '200':
          description: Adresse (leer bei Fehler/Rate-Limit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReverseGeocodeResponse'
        '400':
          description: Ungültige Parameter (fehlend oder keine Zahl)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /geocode-search:
    get:
      summary: Adresssuche (Forward Geocoding) — Suchtext → Adress-Vorschläge
      description: >-
        Sucht Adress-Vorschläge zu einem Suchtext über OpenStreetMap Nominatim, für
        die Ortsauswahl im Task-Formular. Bei Rate-Limit/Timeout/Offline wird eine
        leere Liste zurückgegeben. Rate-Limit: 1 req/sec (Nominatim-Policy).
      operationId: geocodeSearch
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Suchtext (z. B. "Musterstraße 1 Berlin")
      responses:
        '200':
          description: Adress-Vorschläge (leer bei Fehler/Rate-Limit, max. 5 Einträge)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeocodeSearchResult'
        '400':
          description: Ungültiger oder fehlender q-Parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores:
    get:
      summary: Vergebene Gamification-Punkte je erledigtem Task
      description: >-
        Liefert je erledigtem Task des eingeloggten Nutzers einen Score-Eintrag
        (Konzept §4.4): beim Statuswechsel auf `Done` werden Punkte aus
        `estimatedEffort × priority` vergeben, pünktlich (volle) bzw. verspätet (reduzierte Punkte).
      operationId: getScores
      responses:
        '200':
          description: Liste der vergebenen Score-Einträge
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoreEntry'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores/by-pillar:
    get:
      summary: Balance-Stand — Punkte anteilig je Säule aggregiert
      description: >-
        Aggregiert die vergebenen Punkte anteilig (über `share` aus
        `task_pillars`) je Säule — der sichtbare Balance-Stand der Säulen.
      operationId: getScoresByPillar
      responses:
        '200':
          description: Punkte-Summe je Säule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PillarScore'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores/streak:
    get:
      summary: Streak — Kalendertage in Folge mit mindestens einer Erledigung
      description: >-
        Wertet die Erledigungszeitpunkte der Tasks des eingeloggten Nutzers aus
        (#1360): `aktuell` ist die Tagesfolge bis heute, `best` die persönliche
        Bestmarke. Mehrere Erledigungen am selben Kalendertag zählen als ein Tag; ein
        Ruhetag je Kalenderwoche hält die Folge (#1971). `wochenAusgewogen` zählt die
        ausgewogenen Wochen in Folge.
      operationId: getStreak
      parameters:
        - name: tz
          in: query
          required: false
          description: >-
            IANA-Zeitzone (z. B. `Europe/Berlin`), die die Kalendertagsgrenze
            bestimmt. Fehlt der Wert oder ist er keine gültige Zeitzone, wertet
            der Server in seiner eigenen Zeitzone aus — kein Fehler.
          schema:
            type: string
      responses:
        '200':
          description: Aktueller Streak und Bestmarke
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Streak'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores/milestones:
    get:
      summary: Meilenstein-Badges — feste Streak- und Punkte-Stufen (#1362)
      description: >-
        Wertet Streak (gegen die Bestmarke, #1360) und die Summe der Gamification-Punkte
        (`ScoreEntry.punkte`) des eingeloggten Nutzers rückwirkend gegen feste Stufen aus. Es gibt
        keinen gespeicherten Erreicht-Zustand — die Auswertung erfolgt bei jedem Aufruf neu.
      operationId: getMilestones
      parameters:
        - name: tz
          in: query
          required: false
          description: >-
            IANA-Zeitzone (z. B. `Europe/Berlin`), die die Kalendertagsgrenze des zugrunde
            liegenden Streaks bestimmt. Fehlt der Wert oder ist er keine gültige Zeitzone, wertet
            der Server in seiner eigenen Zeitzone aus — kein Fehler.
          schema:
            type: string
      responses:
        '200':
          description: Liste der Meilenstein-Stufen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Milestone'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores/missed:
    get:
      summary: Verpasste Aufgaben — vom Auto-Delete-Cron bereinigte Aufgaben (Sichtbarkeit im Bewertungssystem)
      description: >-
        Liefert die Aufgaben des eingeloggten Nutzers, die vom Auto-Delete-Cron
        (`runDeadlineAutoDelete`, Issue #523) wegen abgelaufener Deadline hart gelöscht
        wurden — als Schnappschuss zum Löschzeitpunkt, da die Original-Aufgabe danach
        nicht mehr existiert. Rein informativ: fließt NICHT in `berechneScore`,
        `berechneStreak` oder `berechneMeilensteine` ein — keine Minuspunkte, kein
        Streak-Malus.
      operationId: getMissedTasks
      responses:
        '200':
          description: Anzahl und jüngste Einträge der verpassten Aufgaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissedTasksSummary'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores/balance:
    get:
      summary: Lebensbalance-Stand — Füllstand des Dashboard-Herzens samt Säulen, Streak und Meilensteinen (#1423)
      description: >-
        Liefert den Stand des Dashboard-Herzens für den eingeloggten Nutzer in einer Antwort:
        Gesamt-Füllstand in Prozent, je Säule ihren Punktestand (anteilig auf die Säulen verteilter
        erledigter Aufwand) samt Gewichtung, den Streak und die **erreichten** Meilenstein-Stufen.
        Gerechnet wird über Säulen und Tasks des Nutzers (`ownerScope`) — gruppengeteilte fremde
        Aufgaben zählen bewusst nicht ein, auch wenn sie in `GET /tasks` sichtbar sind.
      operationId: getBalanceStatus
      parameters:
        - name: tz
          in: query
          required: false
          description: >-
            IANA-Zeitzone (z. B. `Europe/Berlin`), die die Kalendertagsgrenze des Streaks und der
            Meilensteine bestimmt. Fehlt der Wert oder ist er keine gültige Zeitzone, wertet der
            Server in seiner eigenen Zeitzone aus — kein Fehler.
          schema:
            type: string
      responses:
        '200':
          description: Aktueller Lebensbalance-Stand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceStatus'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores/balance/history:
    get:
      summary: Verlauf der Lebensbalance über einen Zeitraum (#1424)
      description: >-
        Rekonstruiert je Kalendertag des geschlossenen Intervalls `[von, bis]` den Stand des
        Dashboard-Herzens des eingeloggten Nutzers aus den Erledigungszeitpunkten
        (`ScoreEntry.zeitpunkt`) — kumulierend, sodass ein Tag ohne Erledigung den Vortag spiegelt.
        Ist `bis` der heutige Tag, stimmt der letzte Eintrag exakt mit `GET /scores/balance` überein.
        Gerechnet wird über Säulen und Tasks des Nutzers (`ownerScope`) — gruppengeteilte fremde
        Aufgaben zählen bewusst nicht ein.
      operationId: getBalanceHistory
      parameters:
        - name: von
          in: query
          required: true
          description: Erster Tag des Zeitraums (`YYYY-MM-DD`, inklusive).
          schema:
            type: string
        - name: bis
          in: query
          required: true
          description: Letzter Tag des Zeitraums (`YYYY-MM-DD`, inklusive, höchstens 366 Tage nach `von`).
          schema:
            type: string
        - name: tz
          in: query
          required: false
          description: >-
            IANA-Zeitzone (z. B. `Europe/Berlin`), die die Kalendertagsgrenze der Erledigungen
            bestimmt. Fehlt der Wert oder ist er keine gültige Zeitzone, wertet der Server in
            seiner eigenen Zeitzone aus — kein Fehler.
          schema:
            type: string
      responses:
        '200':
          description: Verlauf der Lebensbalance, ein Eintrag je Kalendertag des Zeitraums
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BalanceHistoryEntry'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores/monthly-recap:
    get:
      summary: Monatsrückblick — Säulen, Streak und Meilensteine des Vormonats (#1995)
      description: >-
        Liefert den Rückblick auf einen abgeschlossenen Monat in einer Antwort: die Säulen-Punkte
        als Differenz der kumulativen Verlauf-Stände (Fenster letzter Tag des Vormonats bis
        letzter Tag des Monats — dieselbe Rechnung wie die Wochenkarte über
        /scores/balance/history), den Streak-Stand zum Monatsende und die im Monat neu
        erreichten Meilensteine (MilestoneReached.zeitpunkt). Enthält keine Aufgabeninhalte.
        Gerechnet wird über Säulen und Tasks des Nutzers (`ownerScope`) — gescopet wie
        GET /scores/balance.
      operationId: getMonthlyRecap
      parameters:
        - name: monat
          in: query
          required: true
          description: Der zurückliegende Monat (`JJJJ-MM`); muss einen echten Kalendermonat benennen.
          schema:
            type: string
        - name: tz
          in: query
          required: false
          description: >-
            IANA-Zeitzone (z. B. `Europe/Berlin`), die Monatsgrenzen und den Streak-Stichtag
            bestimmt. Fehlt der Wert oder ist er keine gültige Zeitzone, wertet der Server in
            seiner eigenen Zeitzone aus — kein Fehler.
          schema:
            type: string
      responses:
        '200':
          description: Rückblick auf den angefragten Monat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyRecap'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores/yearly-recap:
    get:
      summary: Jahresrückblick — fünf Kennzahlen des Kalenderjahres (#1997)
      description: >-
        Liefert den Rückblick auf ein Kalenderjahr in einer Antwort: erledigte Aufgaben, investierte
        Stunden (actualEffort, sonst estimatedEffort), längster Streak im Jahr, stärkste Säule
        (größte Punkte-Differenz des kumulativen Verlaufs, 31.12. Vorjahr bis 31.12.) und
        abgeschlossene Projekte (im Jahr erledigte Oberaufgaben mit mindestens einer Unteraufgabe).
        Enthält keine Aufgabeninhalte. Gerechnet wird über Säulen und Tasks des Nutzers
        (`ownerScope`) — gescopet wie GET /scores/monthly-recap.
      operationId: getYearlyRecap
      parameters:
        - name: jahr
          in: query
          required: true
          description: Das Kalenderjahr (`JJJJ`, vierstellig).
          schema:
            type: string
        - name: tz
          in: query
          required: false
          description: >-
            IANA-Zeitzone (z. B. `Europe/Berlin`), die Jahresgrenzen und Streak-Tage bestimmt.
            Fehlt der Wert oder ist er keine gültige Zeitzone, wertet der Server in seiner eigenen
            Zeitzone aus — kein Fehler.
          schema:
            type: string
      responses:
        '200':
          description: Rückblick auf das angefragte Jahr
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YearlyRecap'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores/care-suggestions:
    get:
      summary: Konkrete Fürsorge-Vorschläge gegen ein Balance-Defizit (#1791)
      description: >-
        Liefert je defizitärer Säule (Defizit-Bewertung aus #1790) bis zu drei Vorschläge:
        zuerst eigene offene Aufgaben mit Säulen-Beitrag zu genau dieser Säule, sonst
        kuratierte Vorlagen. Abgelehnte Vorlagen (POST /scores/care-suggestions/dismissals)
        bleiben 14 Tage unterdrückt. Der Parameter `sprache` wählt die Sprache der
        Vorlagen-Texte. Gerechnet wird über Säulen und Tasks des Nutzers (`ownerScope`) —
        gescopet wie `GET /scores/balance`.
      operationId: getCareSuggestions
      parameters:
        - name: sprache
          in: query
          required: false
          description: >-
            Sprache der Vorlagen-Texte (App-Sprache). Fehlt der Wert oder ist unbekannt,
            liefert der Server die Texte auf Deutsch — kein Fehler.
          schema:
            type: string
      responses:
        '200':
          description: Vorschläge je defizitärer Säule; ohne Defizit eine leere Liste
          content:
            application/json:
              schema:
                type: object
                required: [vorschlaege]
                properties:
                  vorschlaege:
                    type: array
                    description: Bis zu drei Vorschläge je defizitärer Säule.
                    items:
                      $ref: '#/components/schemas/CareVorschlag'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores/care-suggestions/dismissals:
    post:
      summary: Einen Fürsorge-Vorschlag ablehnen (#1791)
      description: >-
        Lehnt eine kuratierte Vorlage über ihren sprachunabhängigen `templateKey` ab; die
        Ablehnung unterdrückt die Vorlage in `GET /scores/care-suggestions` für 14 Tage ab
        jetzt. Wiederholtes Ablehnen aktualisiert den bestehenden Eintrag, statt Zeilen zu
        häufen.
      operationId: createCareSuggestionDismissal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareSuggestionDismissalCreate'
      responses:
        '204':
          description: Ablehnung gespeichert
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores/care-suggestions/rejections:
    get:
      summary: Ablehnungs-Historie von Fürsorge-Vorschlägen abrufen (#1977)
      description: >-
        Liefert die „Nicht jetzt"-Einträge des Nutzers: ohne Filter alle eigenen, mit
        `?taskId=` nur die einer Aufgabe (aufsteigend). Strenger `ownerScope` — Einträge
        fremder Nutzer bleiben unsichtbar (leere Liste statt 403/404).
      operationId: getCareSuggestionRejections
      parameters:
        - name: taskId
          in: query
          required: false
          description: >-
            Filtert auf eine eigene Aufgabe. Fehlt der Wert, werden alle eigenen Einträge
            geliefert.
          schema:
            type: integer
      responses:
        '200':
          description: Ablehnungs-Historie (leere Liste, wenn nichts vorliegt)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CareSuggestionRejection'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: '„Nicht jetzt" mit Grund erfassen (#1977)'
      description: >-
        Erfasst den Grund einer „Nicht jetzt"-Entscheidung je Aufgabe (`taskId`) oder
        Vorlage (`templateKey`) — genau einer von beiden ist erforderlich. Jede Entscheidung
        wird als eigener Eintrag erfasst; KI-Vorschläge ohne stabilen Schlüssel erreichen
        den Endpoint nicht.
      operationId: createCareSuggestionRejection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareSuggestionRejectionCreate'
      responses:
        '204':
          description: Grund erfasst
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /series:
    get:
      summary: Alle Serien-Templates auflisten
      operationId: getSeries
      responses:
        '200':
          description: Liste der Serien-Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Series'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Neues Serien-Template anlegen
      operationId: createSeries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesCreate'
      responses:
        '201':
          description: Template angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /series/{id}:
    parameters:
      - $ref: '#/components/parameters/SeriesId'
    get:
      summary: Ein Serien-Template abrufen
      operationId: getSeriesById
      responses:
        '200':
          description: Das Serien-Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Serien-Template teilweise aktualisieren (gilt nur für künftige Instanzen)
      operationId: updateSeries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesUpdate'
      responses:
        '200':
          description: Aktualisiertes Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Serien-Template löschen
      operationId: deleteSeries
      parameters:
        - name: cascade
          in: query
          required: false
          description: >-
            `true` löscht zusätzlich alle generierten Instanzen (Tasks mit dieser `seriesId`).
            Default `false`: nur das Template wird entfernt; die Instanzen bleiben erhalten und
            werden von der Serie abgekoppelt (`seriesId → null`). Ihre dauerhafte Provenienz
            (`originSeriesId`) bleibt erhalten, sodass sich ehemalige Instanzen später noch
            gruppieren/filtern lassen.
          schema:
            type: boolean
      responses:
        '204':
          description: Template gelöscht
        '404':
          $ref: '#/components/responses/NotFound'
  /series/generate-all:
    post:
      summary: Fällige Instanzen aller aktiven Serien materialisieren (idempotent)
      description: >-
        Stößt die serverseitige Materialisierung an: erzeugt je fälligem Termin
        aller aktiven Serien (im Auth-Modus nur der eigenen) eine eigenständige
        `Task`-Instanz. Bereits materialisierte Termine werden übersprungen
        (keine Dubletten). Gibt die Anzahl der neu erzeugten Instanzen zurück.
      operationId: generateAllSeries
      responses:
        '200':
          description: Anzahl der neu materialisierten Instanzen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesGenerateAllResult'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /series/{id}/generate:
    parameters:
      - $ref: '#/components/parameters/SeriesId'
    post:
      summary: Fällige Instanzen bis `until` materialisieren (idempotent)
      description: >-
        Erzeugt je fälligem Termin im Fenster `[startDate, until]` genau eine
        eigenständige `Task`-Instanz mit `seriesId`. Bereits materialisierte
        Termine werden übersprungen (keine Dubletten). Gibt nur die neu
        erzeugten Instanzen zurück.
      operationId: generateSeriesInstances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesGenerateInput'
      responses:
        '201':
          description: Neu materialisierte Instanzen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /series/{id}/instances:
    parameters:
      - $ref: '#/components/parameters/SeriesId'
    post:
      summary: Eine Aufgabe aus der Serie auf Abruf anlegen
      description: >-
        Legt genau eine Aufgabe aus der Serie an, egal ob `autoCreate` an oder aus ist
        (#2357). Optional lassen sich `title`, `priority`, `estimatedEffort`, `description`
        und `deadline` mitgeben, alles andere (Säulen als Snapshot) übernimmt die Aufgabe
        von der Serie. Sie bleibt über `seriesId`/`originSeriesId` verknüpft und hat keinen
        Termin-Anker. Weicht ein mitgegebener Wert (außer `deadline`) von der Serie ab,
        gilt sie als `isException`. Die Fünfer-Grenze gilt nicht. Eine ruhende Serie
        antwortet 409.
      operationId: createSeriesInstance
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesInstanceInput'
      responses:
        '201':
          description: Angelegte Aufgabe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /push/vapid-public-key:
    get:
      summary: Öffentlichen VAPID-Schlüssel für Web-Push abrufen
      description: >-
        Liefert den öffentlichen VAPID-Schlüssel, den das Frontend für
        `PushManager.subscribe({ applicationServerKey })` benötigt (Issue #355).
        503, wenn Web-Push serverseitig nicht konfiguriert ist (VAPID-Schlüssel
        fehlen).
      operationId: getVapidPublicKey
      responses:
        '200':
          description: Der öffentliche VAPID-Schlüssel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VapidPublicKey'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /push/subscribe:
    post:
      summary: Web-Push-Subscription des Nutzers speichern
      description: >-
        Speichert die vom Browser (`PushManager.subscribe()`) erzeugte
        Subscription unter dem eingeloggten Nutzer (Datenisolation #207).
        Idempotent: eine bereits bekannte `endpoint`-URL wird aktualisiert statt
        dupliziert. 503, wenn Web-Push nicht konfiguriert ist.
      operationId: subscribePush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionInput'
      responses:
        '201':
          description: Subscription gespeichert/aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscriptionAck'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /push/unsubscribe:
    post:
      summary: Web-Push-Subscription des Nutzers löschen
      description: >-
        Entfernt die Subscription des eingeloggten Nutzers zum angegebenen
        `endpoint`. Idempotent: unbekannter Endpoint ⇒ trotzdem 200. 503, wenn
        Web-Push nicht konfiguriert ist.
      operationId: unsubscribePush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushUnsubscribeInput'
      responses:
        '200':
          description: Subscription entfernt (oder war nicht vorhanden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscriptionAck'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /push/fcm/register:
    post:
      summary: FCM-Token der Android-App registrieren
      description: >-
        Speichert das Firebase-Cloud-Messaging-Token der Android-App für den
        eingeloggten Nutzer (#1670, ADR 0016). Idempotent; gehörte das Token bisher
        einem anderen Nutzer, wechselt es zum aktuellen. Unabhängig von der
        VAPID-Konfiguration.
      operationId: registerFcmToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FcmTokenInput'
      responses:
        '204':
          description: Token gespeichert
        '400':
          $ref: '#/components/responses/ValidationError'
  /push/fcm/unregister:
    post:
      summary: FCM-Token der Android-App entfernen
      description: >-
        Entfernt das FCM-Token des eingeloggten Nutzers. Idempotent; fremde Tokens
        bleiben unberührt.
      operationId: unregisterFcmToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FcmTokenInput'
      responses:
        '204':
          description: Token entfernt (oder war nicht vorhanden)
        '400':
          $ref: '#/components/responses/ValidationError'
  /push/test:
    post:
      summary: Test-Push mit zufälligem Zitat senden
      description: >-
        Sendet einen Test-Push an alle Subscriptions des eingeloggten Nutzers.
        Das Zitat wird zufällig aus 10 fixen Lebensweisheiten gewählt. 503, wenn
        Web-Push nicht konfiguriert ist.
      operationId: sendTestPush
      tags: [push]
      responses:
        '200':
          description: Test-Push abgeschickt (auch wenn keine Subscription vorhanden, sent=0)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestPushResult'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /mail/test:
    post:
      summary: Testmail über den konfigurierten SMTP-Server versenden
      description: >-
        Sendet eine Testmail an die E-Mail-Adresse des angemeldeten Admins
        (Issue #1426). Nur für Admins (`member` → 403, keine Session → 401).
        503, wenn SMTP nicht konfiguriert ist; 502, wenn der Transport wirft.
      operationId: sendTestMail
      tags: [mail]
      responses:
        '200':
          description: Testmail abgeschickt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestMailResult'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Angemeldeter Nutzer ist kein Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /llm-providers:
    get:
      summary: Konfigurierte LLM-Provider auflisten
      description: >-
        Listet alle LLM-Provider inklusive effektiver Aktiv-Markierung — Built-ins
        (Mistral/OpenRouter) zuerst, danach die Custom-Provider. Ohne explizit
        aktiven Provider ist der Built-in-Fallback als aktiv markiert. API-Keys
        werden bewusst NICHT zurückgegeben (Write-Only).
      operationId: listLlmProviders
      tags: [llm]
      responses:
        '200':
          description: Liste aller Provider (ohne API-Keys)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LlmProvider'
    post:
      summary: Neuen Custom-Provider anlegen
      description: >-
        Legt einen neuen Custom-Provider an — inaktiv (Aktivierung über die
        Radio-Auswahl) und ohne Modell (Wahl über die Modellliste). Der Endpoint
        muss eine gültige http(s)-URL sein; andernfalls HTTP 400. Die Antwort
        enthält den Provider ohne API-Key.
      operationId: createLlmProvider
      tags: [llm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmProviderInput'
      responses:
        '201':
          description: Provider angelegt (ohne API-Key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProvider'
        '400':
          description: Ungültiger Payload (Validierung fehlgeschlagen)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /llm-providers/selection:
    get:
      summary: Gewählten LLM-Provider des Nutzers abfragen
      description: >-
        Liefert die Provider-Auswahl des eingeloggten Nutzers für seine KI-Aufrufe
        (#1548). `providerId: null` = keine Auswahl — die Auflösung fällt auf den
        instanzweit aktiven Provider zurück.
      operationId: getLlmProviderSelection
      tags: [llm]
      responses:
        '200':
          description: Aktuelle Auswahl des Nutzers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProviderSelection'
        '401':
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Provider für die KI-Aufrufe des Nutzers wählen
      description: >-
        Speichert die Provider-Auswahl des eingeloggten Nutzers (#1548): eigene oder
        instanzweite Provider-ID; `null` hebt die Auswahl auf. Nur eine Auswahl auf einen
        EIGENEN Provider ist wirksam (Gate- und Kontingent-Bypass); instanzweite Provider
        sind wählbar, wirken aber wie keine Auswahl. Eine fremde Provider-ID antwortet 404.
      operationId: setLlmProviderSelection
      tags: [llm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmProviderSelection'
      responses:
        '200':
          description: Auswahl gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProviderSelection'
        '400':
          description: Ungültiger Payload (providerId keine positive Ganzzahl/null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Provider nicht gefunden (fremde ID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /llm-providers/test-dry:
    post:
      summary: Provider-Entwurf testen (ohne Speichern)
      description: >-
        Prüft die Verbindung mit den unveränderten Formulardaten aus dem
        Anlege-/Bearbeiten-Dialog (#1577): dieselbe Test-Logik wie
        `POST /llm-providers/{id}/test`, aber mit einer Laufzeit-Konfiguration
        aus dem Request-Body statt aus einer DB-Zeile. Legt oder verändert
        keinen Provider und schreibt kein Test-Ergebnis in den Cooldown-Cache.
        Bei leerem `apiKey` mit `providerId` wird der gespeicherte Key des
        Providers genutzt; fremde oder unbekannte `providerId` antworten 404.
      operationId: testLlmProviderDraft
      tags: [llm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmProviderTestDraft'
      responses:
        '200':
          description: Testergebnis (Feld `ok` unterscheidet Erfolg/Misserfolg)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProviderTestResult'
        '400':
          description: Ungültiger Payload (endpoint/model/apiKey/providerId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Provider nicht gefunden (fremde providerId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /llm-providers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Providers
        schema:
          type: integer
    put:
      summary: LLM-Provider aktualisieren
      description: >-
        Aktualisiert einen Provider. Alle Felder optional: abwesende Felder bleiben
        unverändert. Der API-Key wird nur gesetzt, wenn ein nicht-leerer String
        übergeben wird (Write-Only, Bearbeiten-Dialog startet leer). Für Built-in-
        Provider ist ausschließlich `model` erlaubt — andere Felder führen zu HTTP 400.
      operationId: updateLlmProvider
      tags: [llm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmProviderUpdate'
      responses:
        '200':
          description: Aktualisierter Provider (ohne API-Key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProvider'
        '400':
          description: Ungültiger Payload oder Built-in-Provider (nur `model` erlaubt)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Provider unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Custom-Provider löschen
      description: >-
        Löscht einen Custom-Provider (Built-ins antworten HTTP 400). War er aktiv,
        übernimmt automatisch der Built-in-Fallback. Response 204 ohne Body.
      operationId: deleteLlmProvider
      tags: [llm]
      responses:
        '204':
          description: Provider gelöscht
        '400':
          description: Built-in-Provider ist fix und nicht löschbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Provider unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /llm-providers/{id}/activate:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Providers
        schema:
          type: integer
    post:
      summary: Provider als aktiv setzen
      description: >-
        Setzt den Provider als einzigen aktiven Provider: alle anderen werden
        deaktiviert (Radio-Button-Logik) — für Custom- UND Built-in-Provider.
      operationId: activateLlmProvider
      tags: [llm]
      responses:
        '200':
          description: Aktivierter Provider (ohne API-Key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProvider'
        '404':
          description: Provider unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /llm-providers/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Providers
        schema:
          type: integer
    post:
      summary: Provider-Verbindung testen
      description: >-
        Schickt einen minimalen Test-Prompt über den Provider — mit denselben
        Parametern wie echte KI-Aufrufe (Modell, Key, Endpoint,
        JSON-Mode) — und meldet Erfolg inkl. Latenz oder die konkrete
        Fehlerursache (Auth/Modell/Abo/Netzwerk) mit vom Upstream
        gelieferter Detailmeldung. Testet den Provider unabhängig davon,
        ob er aktiv ist — so lässt sich ein neu angelegter Provider vor der
        Aktivierung prüfen.
      operationId: testLlmProvider
      tags: [llm]
      responses:
        '200':
          description: Testergebnis (Feld `ok` unterscheidet Erfolg/Misserfolg)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProviderTestResult'
        '404':
          description: Provider unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /llm-providers/{id}/models:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Providers
        schema:
          type: integer
    get:
      summary: Verfügbare Modelle eines Providers lesen
      description: >-
        Fragt die Modellliste des Providers von dessen OpenAI-kompatiblen
        `GET /models`-Endpoint ab (mit API-Key, falls vorhanden) und liefert sie
        nach `id` sortiert — die Basis für die Modell-Auswahl im Frontend. Das
        Ergebnis wird serverseitig kurz (5 min) je Provider gecacht. Ist der
        Upstream nicht erreichbar oder antwortet ungültig, folgt HTTP 502.
      operationId: listLlmProviderModels
      tags: [llm]
      responses:
        '200':
          description: Verfügbare Modelle des Providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmModels'
        '404':
          description: Provider unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/BadGateway'
  /balance-variant:
    get:
      summary: Bildwahl der Lebensbalance lesen
      description: >-
        Liefert die serverseitig pro User gespeicherte Zifferblatt-Wahl (#2009);
        für Konten ohne gespeicherte Wahl `herz`. Der Antwort-Header `x-csrf-token`
        stellt zugleich den CSRF-Token bereit — der Client sendet den späteren PUT
        als einzelnen Fire-and-forget-Aufruf ohne eigenen Token-Vorab-Fetch.
      operationId: getBalanceVariant
      tags: [care]
      responses:
        '200':
          description: Aktuelle Bildwahl (inkl. Default)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceVariant'
    put:
      summary: Bildwahl der Lebensbalance speichern
      description: >-
        Speichert die Zifferblatt-Wahl am Konto (#2009); sie gilt auf allen
        angemeldeten Geräten. Schlüssel außerhalb der neun Varianten → HTTP 400
        ohne Persistenz.
      operationId: updateBalanceVariant
      tags: [care]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BalanceVariant'
      responses:
        '200':
          description: Gespeicherte Bildwahl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceVariant'
        '400':
          description: Unbekannter Varianten-Schlüssel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /geo-config:
    get:
      summary: Geo-Konfiguration des Users lesen
      description: >-
        Liefert die serverseitig pro User gespeicherte Geo-Konfiguration (#1098):
        Anzeige-Entfernung, Alarm-Entfernung und Aktualisierungsintervall. Ohne
        gespeicherte Werte gelten die Defaults 5 km / 1 km / 5 Minuten.
      operationId: getGeoConfig
      tags: [geo]
      responses:
        '200':
          description: Aktuelle Geo-Konfiguration (inkl. Defaults)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoConfig'
    put:
      summary: Geo-Konfiguration des Users speichern
      description: >-
        Speichert die Geo-Konfiguration (#1098). Kreuz-Schranken-Validierung:
        `alarmDistanceKm` in [1, displayDistanceKm], `displayDistanceKm` in
        [alarmDistanceKm, 50], `intervalMinutes` in [1, 60]; alle Werte ganze
        Zahlen. Verstöße → HTTP 400 ohne Persistenz.
      operationId: updateGeoConfig
      tags: [geo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoConfig'
      responses:
        '200':
          description: Gespeicherte Geo-Konfiguration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoConfig'
        '400':
          description: Ungültige Werte (Schranken verletzt)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/PlanRequired'
  /mcp-instructions:
    get:
      summary: Dialog-Vorgaben für die MCP-KI lesen
      description: >-
        Liefert die pro User gespeicherten Dialog-Vorgaben (#1935), die der
        MCP-Endpunkt im `initialize`-Handshake (`instructions`) an die KI
        übermittelt. Ohne Vorgaben ein leerer Text.
      operationId: getMcpInstructions
      tags: [mcp]
      responses:
        '200':
          description: Aktuelle Dialog-Vorgaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpInstructions'
    put:
      summary: Dialog-Vorgaben für die MCP-KI speichern
      description: >-
        Speichert den Freitext getrimmt (#1935); leer oder nur Whitespace
        löscht die Vorgaben. Mehr als 2000 Zeichen oder ein Nicht-String →
        HTTP 400 ohne Persistenz.
      operationId: updateMcpInstructions
      tags: [mcp]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/McpInstructions'
      responses:
        '200':
          description: Gespeicherte Dialog-Vorgaben (getrimmt)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpInstructions'
        '400':
          description: Ungültige Vorgaben (kein String oder länger als 2000 Zeichen)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /free-slot-config:
    get:
      summary: Mindestdauer freier Lücken lesen
      description: >-
        Liefert die pro User gespeicherte Mindestdauer freier Kalender-Lücken (#1990), Default 30 Minuten.
      operationId: getFreeSlotConfig
      tags: [tasks]
      responses:
        '200':
          description: Aktuelle Mindestdauer (inkl. Default)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeSlotConfig'
    put:
      summary: Mindestdauer freier Lücken speichern
      description: >-
        Speichert die Mindestdauer (#1990): ganze Zahl in [10, 240]. Verstöße → HTTP 400 ohne Persistenz.
      operationId: updateFreeSlotConfig
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreeSlotConfig'
      responses:
        '200':
          description: Gespeicherte Mindestdauer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeSlotConfig'
        '400':
          description: Ungültiger Wert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /care-config:
    get:
      summary: Care-Konfiguration des Users lesen
      description: >-
        Liefert die serverseitig pro User gespeicherte Care-Konfiguration (#1794):
        Fürsorge-Push-Schalter (Default: ein) und Nutzer-Zeitzone (Default: UTC).
      operationId: getCareConfig
      tags: [care]
      responses:
        '200':
          description: Aktuelle Care-Konfiguration (inkl. Defaults)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareConfig'
    put:
      summary: Care-Konfiguration des Users speichern
      description: >-
        Speichert Schalter und Zeitzone (#1794). `zeitzone` muss ein gültiger
        IANA-Zeitzonenname sein; Verstöße → HTTP 400 ohne Persistenz.
      operationId: updateCareConfig
      tags: [care]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareConfig'
      responses:
        '200':
          description: Gespeicherte Care-Konfiguration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareConfig'
        '400':
          description: Ungültige Werte (Schalter kein Boolean, Zeitzone kein IANA-Name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /care-config/sprache:
    put:
      summary: App-Sprache für den Fürsorge-Push speichern
      description: >-
        Speichert die aktive App-Sprache des Users (#1879), in der der Fürsorge-Push
        ankommt. Codes außerhalb der zehn App-Sprachen → HTTP 400 ohne Persistenz.
      operationId: updateCareSprache
      tags: [care]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareSprache'
      responses:
        '200':
          description: Gespeicherte Sprache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareSprache'
        '400':
          description: Unbekannter Sprachcode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /geo/position:
    post:
      summary: Positionsmeldung des Clients
      description: >-
        Meldet die aktuelle Position (#1101): der Server prüft daraufhin
        (Fire-and-forget) die offenen Aufgaben im Alarmabstand des Users und
        stößt ggf. eine gebündelte Push-Nachricht an. Wird vom Client im
        konfigurierten Intervall (`intervalMinutes`, #1098) aufgerufen.
      operationId: reportGeoPosition
      tags: [geo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lon]
              properties:
                lat:
                  type: number
                  format: double
                  description: Breitengrad (z. B. 52.52)
                lon:
                  type: number
                  format: double
                  description: Längengrad (z. B. 13.405)
      responses:
        '204':
          description: Meldung entgegengenommen (Versand läuft im Hintergrund)
        '400':
          description: Ungültige Koordinaten (keine Zahl oder außerhalb des Wertebereichs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Anmeldung erforderlich (kein anmeldefreier Pass-Through-Modus aktiv)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/PlanRequired'
  /profile:
    get:
      summary: Anzeigename, E-Mail und Avatar des Nutzers lesen
      description: >-
        Liefert den Anzeigenamen, die E-Mail-Adresse und die Avatar-URL des
        angemeldeten Nutzers (#1219). Im lokalen Pass-Through-Modus ohne
        Auth-Kontext wird der gemeinsame Entwicklungs-Nutzer bedient.
      operationId: getProfile
      tags: [profile]
      responses:
        '200':
          description: Profildaten des Nutzers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Anzeigenamen speichern
      description: >-
        Ändert ausschließlich den Anzeigenamen (#1219); die Session wird nachgezogen,
        sodass `/auth/me` sofort den neuen Namen liefert. Nach `trim()` leer oder
        länger als 60 Zeichen → HTTP 400 ohne Persistenz. `email`, `passwordHash`
        und unbekannte Felder im Body werden ignoriert.
      operationId: updateProfile
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 60
      responses:
        '200':
          description: Gespeicherte Profildaten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Ungültiger Anzeigename (leer oder länger als 60 Zeichen)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /kpis/wochenkarte:
    post:
      summary: Geteilte Wochen-Karte melden (#1989)
      description: >-
        Protokolliert das Teilen der Wochen-Karte als anonyme Ereigniszeile — je Konto und
        Kalenderwoche höchstens einmal (HMAC-Dedup, `logics/kpiKennzahlen.ts`), ohne
        Karteninhalte und ohne Nutzerbezug. Antwort immer 204; ein Protokollierfehler
        bleibt für den Share folgenlos.
      operationId: postWochenkarteShare
      tags: [kpi]
      responses:
        '204':
          description: Ereignis verarbeitet (auch bei Dedup)
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /groups:
    get:
      summary: Gruppen des angemeldeten Nutzers auflisten
      description: >-
        Listet alle Gruppen, in denen der angemeldete Nutzer Mitglied ist,
        inklusive seiner Rolle und der Mitgliederzahl (#1211).
      operationId: listGroups
      tags: [groups]
      responses:
        '200':
          description: Liste der Gruppen mit eigener Rolle
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
    post:
      summary: Neue Gruppe anlegen
      description: >-
        Legt eine Gruppe an; der Ersteller wird automatisch Mitglied mit Rolle
        `admin`. Name nach Trim nicht leer und maximal 60 Zeichen, sonst HTTP 400.
      operationId: createGroup
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInput'
      responses:
        '201':
          description: Gruppe angelegt (Ersteller ist Admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Ungültiger Payload (Name fehlt oder ist zu lang)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/PlanRequired'
  /groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Gruppe
        schema:
          type: integer
    get:
      summary: Einzelne Gruppe abrufen
      description: >-
        Liefert die Gruppe, wenn der angemeldete Nutzer Mitglied ist — sonst
        HTTP 404 (keine Existenz-Leak).
      operationId: getGroup
      tags: [groups]
      responses:
        '200':
          description: Gruppe mit Rolle des aufrufenden Nutzers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: Gruppe unbekannt oder kein Mitglied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Gruppe umbenennen oder Beschreibung ändern
      description: >-
        Nur für Admins (andere Mitglieder: HTTP 404). Abwesende Felder bleiben
        unverändert; Name nach Trim nicht leer und maximal 60 Zeichen, sonst
        HTTP 400.
      operationId: updateGroup
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      responses:
        '200':
          description: Aktualisierte Gruppe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Ungültiger Payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '404':
          description: Gruppe unbekannt, kein Mitglied oder kein Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Gruppe löschen
      description: >-
        Löscht die Gruppe inklusive aller Mitglieder-Einträge (Cascade). Nur
        Admins (andere: HTTP 404). Response 204 ohne Body.
      operationId: deleteGroup
      tags: [groups]
      responses:
        '204':
          description: Gruppe gelöscht
        '403':
          $ref: '#/components/responses/PlanRequired'
        '404':
          description: Gruppe unbekannt, kein Mitglied oder kein Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/search:
    get:
      summary: Konten für eine Einladung suchen
      description: >-
        Trefferliste für den Einladungsfluss (#1212): volle E-Mail-Adresse als
        Exact-Match ODER displayName-Fragment ab 3 Zeichen. Das DTO enthält nie
        die E-Mail. Zu kurze Anfragen und Nulltreffer liefern 200 mit [].
      operationId: searchUsers
      tags: [groups]
      parameters:
        - name: query
          in: query
          required: true
          description: Volle E-Mail-Adresse oder Namensfragment ab 3 Zeichen
          schema:
            type: string
      responses:
        '200':
          description: Trefferliste (nur id und displayName)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSearchHit'
  /admin/users:
    get:
      summary: Alle Nutzer der App auflisten
      description: >-
        Rollensystem admin/member: nur für Admins (403 sonst). Liefert jeden
        registrierten Nutzer mit E-Mail, Anzeigename und aktueller Rolle.
      operationId: listAdminUsers
      tags: [admin]
      responses:
        '200':
          description: Alle Nutzer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
        '403':
          description: Angemeldeter Nutzer ist kein Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users/{id}/role:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Nutzers
        schema:
          type: integer
    patch:
      summary: Rolle eines Nutzers ändern
      description: >-
        Rollensystem admin/member/tester: nur für Admins (403 sonst). Der letzte
        verbleibende Administrator kann nicht auf `member` oder `tester`
        zurückgestuft werden (409), damit die App nie ohne Administrator dasteht.
      operationId: updateAdminUserRole
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRoleUpdate'
      responses:
        '200':
          description: Nutzer mit aktualisierter Rolle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          description: Ungültiger Rollenwert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Angemeldeter Nutzer ist kein Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Nutzer unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Letzter verbleibender Administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users/{id}/plan:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Nutzers
        schema:
          type: integer
    patch:
      summary: Paket eines Nutzers setzen
      description: >-
        Manuelle Paketvergabe durch einen Admin (#1456) — für Admins und Tester (#1566);
        ein Tester darf nur die eigene Id setzen (403 sonst). Bis zur Selbstbedienung
        (T7) der einzige Weg, ein Paket zu vergeben; ohne Zahlungsbezug.
      operationId: updateAdminUserPlan
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserPlanUpdate'
      responses:
        '200':
          description: Nutzer mit aktualisiertem Paket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          description: Ungültige Nutzer-Id oder ungültiger Paketwert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Angemeldeter Nutzer ist kein Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Nutzer unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users/{id}/subscription/lock:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Nutzers
        schema:
          type: integer
    post:
      summary: Abo eines Nutzers sperren
      description: >-
        #1959 (AK1): nur für Admins (403 sonst). Stoppt den Zugriff auf das
        bezahlte Paket sofort (Paket am Nutzer wird auf `free` gesetzt) und
        markiert das Abo als `locked`. Rein lokale Aktion — es gibt keinen
        Aufruf beim Zahlungsdienstleister. Die Sperre blockiert keinen neuen
        Abschluss („bezahlt = Zugang“); eine Entsperrung ist nicht vorgesehen.
      operationId: lockAdminUserSubscription
      tags: [admin]
      responses:
        '200':
          description: Nutzer mit gesperrtem Abo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          description: Ungültige Nutzer-Id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Angemeldeter Nutzer ist kein Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Nutzer oder Abo nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users/{id}/subscription/cancel:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Nutzers
        schema:
          type: integer
    post:
      summary: Abo eines Nutzers kündigen
      description: >-
        #1959 (AK2): nur für Admins (403 sonst). Löst die Kündigung beim
        Zahlungsdienstleister aus; wirksam wird sie ausschließlich über das
        Webhook-Ereignis (ADR 0013) — das Paket läuft bis zum Ablauf des
        bezahlten Zeitraums weiter. Google-Play-Abos sind serverseitig nicht
        kündbar (409, ADR 0017) — sie lassen sich aber sperren.
      operationId: cancelAdminUserSubscription
      tags: [admin]
      responses:
        '200':
