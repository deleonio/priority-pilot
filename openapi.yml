openapi: 3.0.0
info:
  title: Priority Pilot API
  description: REST API for task management
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /tasks:
    get:
      summary: List all tasks
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Created task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /tasks/{id}:
    get:
      summary: Get a single task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
    put:
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
    delete:
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Task deleted
  /tasks/{id}/dependencies:
    post:
      summary: Add a dependency to a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dependencyId:
                  type: integer
              required:
                - dependencyId
      responses:
        '204':
          description: Dependency added
  /tasks/{id}/dependencies/{dependencyId}:
    delete:
      summary: Remove a dependency from a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: dependencyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Dependency removed
  /tasks/top:
    get:
      summary: Get the most important tasks
      responses:
        '200':
          description: Top tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskWithValue'
components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: integer
          description: Eindeutige ID des Tasks
        title:
          type: string
          description: Titel oder Kurzbeschreibung
        status:
          type: string
          description: Aktueller Bearbeitungsstatus
        priority:
          type: integer
          description: Wichtigkeit (1-10)
        estimatedEffort:
          type: number
          description: Geschätzter Aufwand in Stunden
        actualEffort:
          type: number
          description: Tatsächlicher Aufwand
        description:
          type: string
          description: Ausführliche Beschreibung
        deadline:
          type: string
          format: date-time
          description: Fälligkeitsdatum
        createdAt:
          type: string
          format: date-time
          description: Erstellungszeitpunkt
        updatedAt:
          type: string
          format: date-time
          description: Letzte Aktualisierung
    TaskInput:
      type: object
      properties:
        title:
          type: string
          description: Titel oder Kurzbeschreibung
        status:
          type: string
          description: Bearbeitungsstatus
        priority:
          type: integer
          description: Wichtigkeit (1-10)
        estimatedEffort:
          type: number
          description: Geschätzter Aufwand in Stunden
        actualEffort:
          type: number
          description: Tatsächlicher Aufwand
        description:
          type: string
          description: Ausführliche Beschreibung
        deadline:
          type: string
          format: date-time
          description: Fälligkeitsdatum
      required:
        - title
        - estimatedEffort
    TaskWithValue:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          properties:
            value:
              type: number
            totalTime:
              type: number
