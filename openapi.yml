          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Angemeldeter Nutzer ist kein Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/tasks/reassign-pillars/status:
    get:
      summary: Stand der app-weiten Säulen-Neuberechnung
      description: >-
        Aufgaben der Statusauswahl insgesamt und wie viele davon seit dem
        Laufstart ihres Kontos nicht erfolgreich neu berechnet wurden. Ruft
        keinen KI-Provider auf.
      operationId: getReassignPillarsStatus
      tags: [admin]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ReassignStatusFilter'
      responses:
        '200':
          description: Stand des Batches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnReassignPillarsStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Nur für Administratoren
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/tasks/reassign-pillars:
    post:
      summary: Säulenverteilung aller Aufgaben neu berechnen (Batch)
      description: >-
        Admin-getriggert: Berechnet die Säulen-Beiträge ALLER Aufgaben (aller
        Konten, einschließlich der erledigten) anhand des Aufgabenkontexts
        (Titel/Beschreibung) per KI-Klassifikator neu und speichert sie. Status,
        Punkte und Streak bleiben unberührt — der Batch öffnet Aufgaben nur für
        die Neuberechnung ihrer Verteilung, nicht im Status-Sinn. Aufgaben ohne
        brauchbaren Vorschlag behalten ihre bisherige Zuordnung; ein Fehler bei
        einer Aufgabe reißt den Lauf nicht ab. Bewusst manuell (kein Cron), damit
        der LLM-Upstream nicht unbemerkt dauerhaft läuft.
      operationId: reassignTaskPillars
      tags: [admin]
      parameters:
        - name: provider
          in: query
          required: false
          description: >-
            Optionaler Provider-Pinning (#749/#951): Name eines konfigurierten
            Providers — überschreibt den aktiven Provider für diesen Aufruf.
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          required: false
          description: >-
            Obergrenze der in diesem Lauf verarbeiteten Aufgaben (Default 200).
            So lässt sich ein großer Bestand in mehreren Aufrufen abarbeiten,
            statt den Request bis zum offenen HTTP-Timeout laufen zu lassen —
            `remaining` in der Antwort zeigt, wie viele Aufgaben noch offen sind.
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          required: false
          description: >-
            Anzahl bereits verarbeiteter Aufgaben vorheriger Läufe derselben
            Portionierungs-Serie (Default 0) — ohne ihn träfe jeder Aufruf
            wieder dieselbe erste `limit`-Portion. Zum Fortsetzen die Summe aus
            `failed` aller vorherigen Läufe übergeben — nur fehlgeschlagene
            Aufgaben bleiben Präfix der Auswahl, erfolgreich verarbeitete
            fallen serverseitig heraus.
          schema:
            type: integer
            minimum: 0
        - name: status
          in: query
          required: false
          description: >-
            Statusauswahl des Laufs (Default `all`). `open` umfasst offene UND
            in Bearbeitung befindliche Aufgaben, `done` nur erledigte.
          schema:
            $ref: '#/components/schemas/ReassignStatusFilter'
        - name: restart
          in: query
          required: false
          description: >-
            `true` beginnt den Lauf für ALLE Konten neu. Ohne den Parameter wird
            fortgesetzt: Verarbeitet werden nur Aufgaben, die seit dem Laufstart des
            jeweiligen Kontos nicht erfolgreich neu berechnet wurden. `offset` zählt
            dann nur die in dieser Serie fehlgeschlagenen Aufgaben.
          schema:
            type: boolean
      responses:
        '202':
          description: Hintergrundlauf gestartet — Fortschritt und Ergebnis über den Status-Endpunkt (#1642)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReassignRunStarted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Angemeldeter Nutzer ist kein Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Es läuft bereits ein Batch-Lauf (prozessweites Lauf-Flag) — erst
            dessen Ende abwarten.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/reassign-pillars/status:
    get:
      summary: Stand der Säulen-Neuberechnung der eigenen Aufgaben
      description: >-
        Liefert den Start des letzten Laufs und wie viele Aufgaben der
        Statusauswahl seitdem noch nicht erfolgreich neu berechnet wurden
        (fehlgeschlagene und nicht erreichte). Grundlage für „Fortsetzen“.
        Ruft keinen KI-Provider auf.
      operationId: getOwnReassignPillarsStatus
      tags: [tasks]
      parameters:
        - name: status
          in: query
          required: false
          description: Statusauswahl (Default `all`).
          schema:
            $ref: '#/components/schemas/ReassignStatusFilter'
      responses:
        '200':
          description: Stand des letzten Laufs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnReassignPillarsStatus'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/reassign-pillars:
    post:
      summary: Säulenverteilung der eigenen Aufgaben neu berechnen
      description: >-
        Berechnet die Säulen-Beiträge der EIGENEN Aufgaben anhand des
        Aufgabenkontexts (Titel/Beschreibung) per KI-Klassifikator neu — das
        nutzereigene Gegenstück zum app-weiten Admin-Batch. Status, Punkte und
        Streak bleiben unberührt. Aufgaben ohne brauchbaren Vorschlag behalten
        ihre bisherige Zuordnung; ein Fehler bei einer Aufgabe reißt den Lauf
        nicht ab. Jede klassifizierte Aufgabe bucht einen Punkt des monatlichen
        KI-Budgets — über dem Budget greift die Fair-Use-Drossel (#1783): je Intervall
        eine Aufgabe, danach endet der Lauf und meldet das über `quotaExhausted`.
      operationId: reassignOwnTaskPillars
      tags: [tasks]
      parameters:
        - name: provider
          in: query
          required: false
          description: Optionales Provider-Pinning (#749/#951).
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          required: false
          description: >-
            Obergrenze der in diesem Lauf verarbeiteten Aufgaben (Default 200).
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          required: false
          description: >-
            Anzahl bereits verarbeiteter Aufgaben vorheriger Läufe derselben
            Portionierungs-Serie (Default 0).
          schema:
            type: integer
            minimum: 0
        - name: status
          in: query
          required: false
          description: >-
            Statusauswahl des Laufs (Default `all`). `open` umfasst offene UND
            in Bearbeitung befindliche Aufgaben, `done` nur erledigte.
          schema:
            $ref: '#/components/schemas/ReassignStatusFilter'
        - name: restart
          in: query
          required: false
          description: >-
            `true` beginnt einen neuen Lauf, danach gilt jede Aufgabe wieder als
            offen. Ohne den Parameter wird der letzte Lauf fortgesetzt: Verarbeitet
            werden nur Aufgaben, die seit dessen Start nicht erfolgreich neu
            berechnet wurden. `offset` zählt dann nur die in dieser Serie
            fehlgeschlagenen Aufgaben.
          schema:
            type: boolean
      responses:
        '202':
          description: Hintergrundlauf gestartet — Fortschritt und Ergebnis über den Status-Endpunkt (#1642)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReassignRunStarted'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Das Paket des Nutzers schließt die KI-Funktionen aus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Für dieses Konto läuft bereits eine Neuberechnung, oder der
            app-weite Admin-Batch ist gerade unterwegs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /groups/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Gruppe
        schema:
          type: integer
    get:
      summary: Mitglieder einer Gruppe auflisten
      description: >-
        Jedes Mitglied (Admin oder Mitglied) sieht die Liste; fremde Gruppe 404.
      operationId: listGroupMembers
      tags: [groups]
      responses:
        '200':
          description: Mitglieder mit Anzeigename und Rolle
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupMember'
        '404':
          description: Gruppe unbekannt oder kein Mitglied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /groups/{id}/members/{userId}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Gruppe
        schema:
          type: integer
      - name: userId
        in: path
        required: true
        description: ID des zu entfernenden Kontos
        schema:
          type: integer
    patch:
      summary: Rolle eines Mitglieds ändern
      description: >-
        Nur Admins (#1221). Nicht-Mitglieder erhalten 404 (kein
        Existenz-Leak), Mitglieder ohne Adminrechte 403. Die Rückstufung des
        letzten verbleibenden Administrators wird abgelehnt (409, dieselbe
        Prüfung wie beim Entfernen).
      operationId: updateGroupMemberRole
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMemberRoleUpdate'
      responses:
        '200':
          description: Mitglied mit aktualisierter Rolle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMember'
        '400':
          description: Ungültiger Rollenwert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Mitglied ohne Adminrechte ändert eine Rolle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gruppe oder Mitglied unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Letzter Administrator der Gruppe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Mitglied entfernen oder Gruppe verlassen
      description: >-
        Admins entfernen beliebige Mitglieder, jedes Mitglied sich selbst
        (#1212 AK9). Der letzte verbleibende Admin wird nicht entfernt (409).
      operationId: removeGroupMember
      tags: [groups]
      responses:
        '204':
          description: Mitglied entfernt
        '403':
          description: Mitglied ohne Adminrechte entfernt ein fremdes Konto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gruppe oder Mitglied unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Letzter Administrator der Gruppe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /groups/{id}/tasks:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Gruppe
        schema:
          type: integer
    get:
      summary: Füreinander angelegte Aufgaben der Gruppe auflisten
      description: >-
        Offene Aufgaben, die ein Gruppenmitglied für ein anderes Mitglied
        angelegt hat (#1223). Selbst-Aufgaben und Altbestand ohne Ersteller
        bleiben privat (auch für Admins); erledigte Aufgaben erscheinen nicht.
        Reduzierter Feldsatz ohne Beschreibung, Checkliste und Ids. Fremde
        Gruppe 404, unauthentifiziert 401 (globales requireAuth).
      operationId: listGroupTasks
      tags: [groups]
      responses:
        '200':
          description: Füreinander angelegte offene Aufgaben, sortiert nach Empfänger und Fälligkeit
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupTask'
        '404':
          description: Gruppe unbekannt oder kein Mitglied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /groups/{id}/series:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Gruppe
        schema:
          type: integer
    get:
      summary: Füreinander angelegte Serien der Gruppe auflisten
      description: >-
        Serien, die ein Gruppenmitglied für ein anderes Mitglied angelegt hat
        (#1254). Selbst-Anlagen und Altbestand ohne Ersteller bleiben privat
        (auch für Admins); ruhende Serien sind enthalten und als active:false
        gekennzeichnet. Reduzierter Feldsatz ohne Beschreibung, Adresse,
        Koordinaten und Nutzer-Ids. Fremde Gruppe 404, unauthentifiziert 401
        (globales requireAuth).
      operationId: listGroupSeries
      tags: [groups]
      responses:
        '200':
          description: Füreinander angelegte Serien, sortiert nach Eigentümer und Titel
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupSeries'
        '404':
          description: Gruppe unbekannt oder kein Mitglied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /groups/{id}/duo:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Duos
        schema:
          type: integer
      - name: tz
        in: query
        required: false
        description: IANA-Zeitzone für die Tagesgrenze (Muster /scores/streak)
        schema:
          type: string
    get:
      summary: Gemeinsamer Streak und Säulenwerte eines Duos
      description: >-
        Streak nur aus Tagen, an denen beide Mitglieder etwas erledigt haben
        (#1974). Je Mitglied nur Säulenwerte, keine Aufgabenfelder. Nicht-Mitglied
        oder Gruppe ohne `kind=duo` 404.
      operationId: getGroupDuo
      tags: [groups]
      responses:
        '200':
          description: Duo-Stand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Duo'
        '404':
          description: Duo unbekannt oder kein Mitglied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /groups/{id}/challenge:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Gruppe
        schema:
          type: integer
    get:
      summary: Jüngste Challenge einer Gruppe mit Rangfolge nach Balance
      description: >-
        Status wird beim Lesen aus `endsAt` abgeleitet (#1992) — die Challenge
        endet ohne Job. Je Mitglied nur Name, Rang und Balance-Wert, keine
        Aufgabenfelder. Noch keine Challenge 204, Nicht-Mitglied 404.
      operationId: getGroupChallenge
      tags: [groups]
      responses:
        '200':
          description: Challenge-Stand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupChallenge'
        '204':
          description: Die Gruppe hatte noch keine Challenge
        '404':
          description: Gruppe unbekannt oder kein Mitglied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Sieben-Tage-Challenge starten
      description: >-
        Jedes Mitglied darf starten (#1992); `endsAt` liegt sieben Tage nach
        `startsAt`. Höchstens eine laufende Challenge je Gruppe (sonst 409).
      operationId: startGroupChallenge
      tags: [groups]
      responses:
        '201':
          description: Gestartete Challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupChallenge'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '404':
          description: Gruppe unbekannt oder kein Mitglied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Es läuft bereits eine Challenge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /groups/{id}/invitations:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Gruppe
        schema:
          type: integer
    get:
      summary: Offene Einladungen einer Gruppe auflisten
      description: Nur Admins (andere Mitglieder 403, Nicht-Mitglieder 404).
      operationId: listGroupInvitations
      tags: [groups]
      responses:
        '200':
          description: Offene Einladungen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupInvitation'
        '403':
          description: Mitglied ohne Adminrechte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gruppe unbekannt oder kein Mitglied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Konto in die Gruppe einladen
      description: >-
        Nur Admins (andere Mitglieder 403, Nicht-Mitglieder 404). Eine zweite
        offene Einladung für dasselbe Konto und eine bestehende Mitgliedschaft
        liefern 409; nach einer Ablehnung ist eine neue Einladung möglich.
      operationId: createGroupInvitation
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInvitationInput'
      responses:
        '201':
          description: Angelegte Einladung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupInvitation'
        '400':
          description: Ungültiger Payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Mitglied ohne Adminrechte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gruppe oder Konto unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Bereits Mitglied oder bereits eingeladen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /groups/{id}/invite-links:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Gruppe
        schema:
          type: integer
    post:
      summary: Teilbaren Einladungslink erzeugen
      description: >-
        Nur Admins (andere Mitglieder 403, Nicht-Mitglieder 404). Jeder Aufruf
        erzeugt einen neuen, anderen Token; der Link ist 7 Tage gültig und
        lässt sich jederzeit ungültig machen. Der Token wird ausschließlich in
        dieser Antwort übermittelt.
      operationId: createGroupInviteLink
      tags: [groups]
      responses:
        '201':
          description: Erzeugter Einladungslink
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupInviteLink'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Mitglied ohne Adminrechte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gruppe unbekannt oder kein Mitglied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /plans:
    get:
      summary: Paket-Katalog öffentlich abrufen
      description: >-
        Öffentlich ohne Anmeldung (#1456): Feature-Matrix und Preise je Paket.
        Der Inhalt stammt unverändert aus der Rechte-Zentrale
        (`server/src/logics/plans.ts`) — es gibt keine zweite Kopie der Matrix.
      operationId: getPlans
      tags: [plans]
      responses:
        '200':
          description: Feature-Matrix und Preise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlansCatalog'
  /invite-links/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: Token des Einladungslinks
        schema:
          type: string
    get:
      summary: Einladungslink öffentlich abrufen
      description: >-
        Öffentlich ohne Anmeldung (#1226). Liefert ausschließlich Gruppenname
        und Anzeigename des Einladenden — keine Mitglieder, keine E-Mails.
        Unbekanntes Token 404, abgelaufenes oder widerrufenes Token 410.
      operationId: getInviteLink
      tags: [groups]
      responses:
        '200':
          description: Linkvorschau
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteLinkPreview'
        '404':
          description: Einladungslink unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Einladungslink abgelaufen oder widerrufen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /invite-links/{token}/redeem:
    parameters:
      - name: token
        in: path
        required: true
        description: Token des Einladungslinks
        schema:
          type: string
    post:
      summary: Einladungslink einlösen (Gruppe beitreten)
      description: >-
        Hinter der Anmeldung (401 ohne Session). Der Aufrufer wird Mitglied mit
        Rolle „member"; eine bestehende Mitgliedschaft — egal wie entstanden —
        liefert 409. Unbekanntes Token 404, abgelaufen/widerrufen 410.
      operationId: redeemInviteLink
      tags: [groups]
      responses:
        '200':
          description: Beigetretene Gruppe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteLinkRedeemResult'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '404':
          description: Einladungslink unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Bereits Mitglied dieser Gruppe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Einladungslink abgelaufen oder widerrufen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /invite-links/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Einladungslinks
        schema:
          type: integer
    delete:
      summary: Einladungslink ungültig machen
      description: >-
        Nur Admins der Gruppe (Mitglied 403, fremde Gruppe oder unbekannter
        Link 404). Setzt `revokedAt`; Einlösen und öffentliches GET liefern
        danach 410.
      operationId: revokeInviteLink
      tags: [groups]
      responses:
        '204':
          description: Einladungslink ungültig gemacht (kein Inhalt)
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Mitglied ohne Adminrechte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Einladungslink unbekannt oder fremde Gruppe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /invitations:
    get:
      summary: Eigene offene Einladungen auflisten
      description: Gruppenübergreifend alle offenen Einladungen des angemeldeten Kontos.
      operationId: listReceivedInvitations
      tags: [groups]
      responses:
        '200':
          description: Offene Einladungen mit Gruppen- und Einladenden-Namen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReceivedInvitation'
  /invitations/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Einladung
        schema:
          type: integer
    post:
      summary: Einladung annehmen
      description: Nur der Eingeladene selbst; legt die Mitgliedschaft mit Rolle „member" an.
      operationId: acceptInvitation
      tags: [groups]
      responses:
        '200':
          description: Beigetretene Gruppe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResult'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '404':
          description: Einladung unbekannt oder fremd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /invitations/{id}/decline:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Einladung
        schema:
          type: integer
    post:
      summary: Einladung ablehnen
      description: Nur der Eingeladene selbst; die Mitgliederliste bleibt unverändert.
      operationId: declineInvitation
      tags: [groups]
      responses:
        '200':
          description: Abgelehnte Einladung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResult'
        '404':
          description: Einladung unbekannt oder fremd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api-tokens:
    get:
      summary: Eigene API-Tokens auflisten
      description: >-
        Liefert die nicht zurückgezogenen persönlichen API-Tokens des angemeldeten
        Nutzers (#1352) — ausschließlich Metadaten, nie den Klartext oder den Hash.
      operationId: listApiTokens
      tags: [api-tokens]
      responses:
        '200':
          description: Liste der eigenen Tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiToken'
    post:
      summary: Persönlichen API-Token erzeugen
      description: >-
        Legt einen neuen persönlichen API-Token an (#1352). Der Klartext ist
        ausschließlich in dieser einen Antwort enthalten und danach nicht mehr
        abrufbar; gespeichert wird nur sein Hash.
      operationId: createApiToken
      tags: [api-tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenInput'
      responses:
        '201':
          description: Angelegter Token inklusive einmaligem Klartext
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiToken'
        '400':
          description: >-
            Ungültiger Name (leer oder länger als 60 Zeichen) oder fehlende/ungültige
            Laufzeit (expiresInDays muss 30, 90, 180 oder 365 sein, #1357)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api-tokens/{id}:
    delete:
      summary: API-Token zurückziehen
      description: >-
        Zieht einen eigenen API-Token zurück (#1352). Ab dem nächsten Aufruf wird
        jeder Request mit diesem Token mit 401 abgewiesen. Fremde oder unbekannte
        Tokens liefern 404.
      operationId: deleteApiToken
      tags: [api-tokens]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Id des zurückzuziehenden Tokens
      responses:
        '204':
          description: Token zurückgezogen
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Rechtestufe eines API-Tokens umschalten
      description: >-
        Setzt die Rechtestufe (`scope`) eines eigenen API-Tokens (#1356). Der neue Wert
        gilt sofort für denselben Token, ohne dass er neu erzeugt werden muss.
      operationId: updateApiToken
      tags: [api-tokens]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Id des umzuschaltenden Tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenScopeInput'
      responses:
        '200':
          description: Aktualisierter Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiToken'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /place-favorites:
    get:
      summary: Gespeicherte Orte auflisten
      description: >-
        Liefert die gespeicherten Orte („Standort-Favoriten") des angemeldeten Nutzers
        (#1342) — ausschließlich die eigenen Einträge.
      operationId: listPlaceFavorites
      tags: [place-favorites]
      responses:
        '200':
          description: Liste der eigenen gespeicherten Orte
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaceFavorite'
    post:
      summary: Gespeicherten Ort anlegen
      description: >-
        Legt einen gespeicherten Ort an (#1342). Koordinaten sind optional: ein Freitext-Ort
        ohne Geocoding-Treffer wird mit `latitude`/`longitude: null` gespeichert.
      operationId: createPlaceFavorite
      tags: [place-favorites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceFavoriteInput'
      responses:
        '201':
          description: Angelegter gespeicherter Ort
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceFavorite'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
  /place-favorites/{id}:
    delete:
      summary: Gespeicherten Ort löschen
      description: >-
        Entfernt einen eigenen gespeicherten Ort endgültig (#1342). Fremde oder unbekannte
        Einträge liefern 404.
      operationId: deletePlaceFavorite
      tags: [place-favorites]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Id des gespeicherten Orts
      responses:
        '204':
          description: Gespeicherter Ort gelöscht
        '403':
          $ref: '#/components/responses/PlanRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /journal:
    get:
      summary: Journal-Einträge auflisten
      description: >-
        Liefert die Journal-Einträge des angemeldeten Nutzers (#2212), neuestes Datum zuerst —
        ausschließlich die eigenen.
      operationId: listJournalEntries
      tags: [journal]
      responses:
        '200':
          description: Liste der eigenen Journal-Einträge
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JournalEntry'
    post:
      summary: Journal-Eintrag anlegen
      description: >-
        Legt einen Journal-Eintrag an (#2212). Ohne `date` gilt der heutige Tag (UTC), ohne
        `pillarId` bleibt der Eintrag ohne Säule. Kein Paket-Limit.
      operationId: createJournalEntry
      tags: [journal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntryInput'
      responses:
        '201':
          description: Angelegter Journal-Eintrag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
        '400':
          $ref: '#/components/responses/ValidationError'
  /journal/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Id des Journal-Eintrags
    patch:
      summary: Journal-Eintrag bearbeiten
      description: >-
        Ändert die mitgeschickten Felder eines eigenen Journal-Eintrags (#2212), gleiche
        Prüfung wie beim Anlegen. Fremde oder unbekannte Einträge liefern 404.
      operationId: updateJournalEntry
      tags: [journal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntryUpdate'
      responses:
        '200':
          description: Geänderter Journal-Eintrag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Journal-Eintrag löschen
      description: >-
        Entfernt einen eigenen Journal-Eintrag endgültig (#2212). Fremde oder unbekannte
        Einträge liefern 404.
      operationId: deleteJournalEntry
      tags: [journal]
      responses:
        '204':
          description: Journal-Eintrag gelöscht
        '404':
          $ref: '#/components/responses/NotFound'
  /journal/stats:
    get:
      summary: Journal-Statistik über einen Zeitraum (#2213)
      description: >-
        Zählt die Journal-Einträge des angemeldeten Nutzers je Säule, ohne Säule und gesamt über
        Tages- bzw. Wochenfenster (Montag-Beginn, auf den Zeitraum geschnitten) und liefert den
        Balance-Verlauf (#1424) für denselben Zeitraum als zweite Reihe — Werte identisch zu
        `GET /scores/balance/history`. Kein Paket-Limit.
      operationId: getJournalStats
      tags: [journal]
      parameters:
        - name: von
          in: query
          required: true
          description: Erster Tag des Zeitraums (`YYYY-MM-DD`, inklusive).
          schema:
            type: string
        - name: bis
          in: query
          required: true
          description: Letzter Tag des Zeitraums (`YYYY-MM-DD`, inklusive, höchstens 366 Tage nach `von`).
          schema:
            type: string
        - name: granularitaet
          in: query
          required: false
          description: Fensterauflösung — `tag` (Default) oder `woche`.
          schema:
            type: string
            enum: [tag, woche]
        - name: tz
          in: query
          required: false
          description: >-
            IANA-Zeitzone (z. B. `Europe/Berlin`), die die Kalendertagsgrenze des Balance-Verlaufs
            bestimmt; ohne Angabe gilt die Serverzeit.
          schema:
            type: string
      responses:
        '200':
          description: Journal-Statistik mit Balance-Verlauf
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalStats'
        '400':
          $ref: '#/components/responses/ValidationError'
  /calendar-sources:
    get:
      summary: Kalenderquellen auflisten
      description: >-
        Liefert die Kalenderquellen des angemeldeten Nutzers (#2209), älteste zuerst — ohne
        Adresse und ohne CalDAV-Zugangsdaten (#2211), die bleiben geheim.
      operationId: listCalendarSources
      tags: [calendar]
      responses:
        '200':
          description: Liste der eigenen Kalenderquellen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarSource'
    post:
      summary: Kalenderquelle anlegen
      description: >-
        Legt eine Kalenderquelle per ICS-Adresse an (#2209), ruft sie sofort per GET ab und speichert
        die Termine mit Start von heute bis +14 Tage (nur Start, Ende, Titel, ganztägig). Danach
        ruft der Server alle 30 Minuten erneut ab und ersetzt den Bestand. Free erlaubt eine Quelle,
        Plus und Pro fünf; darüber 403 `plan_required`. Mit `type: caldav` (#2211) ruft der Server die
        Termine nur lesend per `REPORT` mit Benutzername und App-Passwort ab und speichert das Passwort
        verschlüsselt; ohne Server-Schlüssel `CALDAV_ENCRYPTION_KEY` 400.
      operationId: createCalendarSource
      tags: [calendar]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarSourceInput'
      responses:
        '201':
          description: Angelegte Kalenderquelle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarSource'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
  /calendar-sources/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Id der Kalenderquelle
    delete:
      summary: Kalenderquelle löschen
      description: >-
        Entfernt eine eigene Kalenderquelle samt Zugangsdaten und Terminen (#2209, #2211). Fremde oder unbekannte
        Quellen liefern 404.
      operationId: deleteCalendarSource
      tags: [calendar]
      responses:
        '204':
          description: Kalenderquelle und Termine gelöscht
        '404':
          $ref: '#/components/responses/NotFound'
  /calendar-events:
    get:
      summary: Kalendertermine auflisten
      description: >-
        Liefert die gespeicherten Termine aller eigenen Kalenderquellen (#2209), nach Start
        sortiert.
      operationId: listCalendarEvents
      tags: [calendar]
      responses:
        '200':
          description: Liste der eigenen Termine
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEvent'
  /auth/me:
    get:
      summary: Angemeldeten Nutzer lesen
      description: >-
        Liefert Session-Daten, Paket, Entitlements und Abo-Status des angemeldeten
        Nutzers (Issue #206/#1456/#1494). Im lokalen Pass-Through-Modus (kein
        Auth-Kontext konfiguriert) antwortet ein synthetischer Entwicklungs-Nutzer
        statt 401.
      operationId: getMe
      tags: [auth]
      responses:
        '200':
          description: Aktueller Nutzer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Anmeldung erforderlich (Auth-Kontext konfiguriert, keine Session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Eigenes Konto löschen
      description: >-
        Löscht das Konto des angemeldeten Nutzers samt persönlicher Daten (Aufgaben,
        Serien, Säulen, Kategorien, Tokens, Push-Registrierungen) und beendet die
        Session (#1671). Gruppen, in denen der Nutzer allein ist, entfallen mit.
        Rechnungen und Abo-Datensätze bleiben wegen der Aufbewahrungspflicht erhalten.
        409 bei laufendem oder ausstehendem Abo und als letzter Admin einer Gruppe
        mit weiteren Mitgliedern. Ein PayPal-Abo mit Zahlungsrückstand (past_due,
        suspended) wird vorher bei PayPal gekündigt; scheitert das, 502 und das Konto
        bleibt (#2240).
      operationId: deleteMe
      tags: [auth]
      responses:
        '204':
          description: Konto gelöscht, Session beendet
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Laufendes Abo oder letzter Admin einer Gruppe mit weiteren Mitgliedern
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: PayPal-Kündigung eines Abos mit Zahlungsrückstand gescheitert (5xx/Netzfehler, #2240); 4xx gilt als bereits gekündigt (#2276)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Löschung aus anderem Grund gescheitert (#2276)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/terms:
    post:
      summary: Zustimmung zu Nutzungsbedingungen und Datenschutzerklärung speichern
      description: >-
        Speichert Zeitpunkt und aktuelle Fassung der Nutzungsbedingungen am eigenen
        Konto (#1901). Beide Bestätigungen sind Pflicht; danach meldet `GET /auth/me`
        `termsAccepted: true`, bis die Fassung wechselt.
      operationId: acceptTerms
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TermsConsentInput'
      responses:
        '204':
          description: Zustimmung gespeichert
        '400':
          description: Nicht beide Punkte bestätigt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/providers:
    get:
      summary: Verfügbare Anmeldewege lesen
      description: >-
        Zeigt der Login-Seite, welche Anmeldewege auf dieser Instanz konfiguriert
        sind: Google-OAuth (Client-Credentials gesetzt) und Magic Link per E-Mail
        (SMTP und `PUBLIC_BASE_URL` gesetzt). Öffentlich, ohne Session.
      operationId: getAuthProviders
      tags: [auth]
      responses:
        '200':
          description: Konfigurierte Anmeldewege
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProviders'
  /auth/magic-link:
    post:
      summary: Anmeldelink per E-Mail anfordern
      description: >-
        Verschickt einen 15 Minuten gültigen Einmal-Link an die Adresse, sofern sie
        zugelassen ist (E-Mail-Allowlist). Die Antwort ist unabhängig davon immer 202,
        damit sich zugelassene Adressen nicht ausspähen lassen. Pro Adresse gehen
        höchstens drei Links je 15 Minuten raus; weitere Anfragen werden still verworfen.
      operationId: requestMagicLink
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
      responses:
        '202':
          description: Anfrage angenommen (Mail nur bei zugelassener Adresse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/magic-link/verify:
    post:
      summary: Anmeldelink einlösen
      description: >-
        Löst den Token aus dem Anmeldelink ein und meldet den Nutzer an. Existiert
        zur E-Mail noch kein Konto, wird es angelegt (Verknüpfung über die E-Mail wie
        beim Google-Login). Ein Token gilt genau einmal. Bewusst POST statt GET:
        Mail-Scanner rufen Links vorab auf und würden den Token sonst verbrauchen.
        Mit `X-Client-Channel: play` (Android-App) antwortet die Route statt mit
        Session-Cookie mit einem App-Token (#2377).
      operationId: verifyMagicLink
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkVerifyRequest'
      responses:
        '200':
          description: Angemeldet im Kanal `play` — App-Token statt Session-Cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppToken'
        '204':
          description: Angemeldet, Session-Cookie gesetzt
        '400':
          description: Token unbekannt, abgelaufen oder schon benutzt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/waitlist:
    post:
      summary: Auf die Warteliste eintragen
      description: >-
        Launch-Zugang über die Warteliste (#1982, ADR 0019). Öffentlich und sessionlos:
        Unbekannte Adressen tragen sich selbst ein und erhalten sofort ihre 1-basierte
        Position im Referral-Rang und den persönlichen Empfehlungs-Code. Idempotent —
        wiederholter Aufruf derselben (normalisierten) Adresse liefert denselben Eintrag.
        Ein unbekannter oder eigener `ref`-Code wird still ignoriert.
      operationId: joinWaitlist
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistJoinRequest'
      responses:
        '200':
          description: Position und Empfehlungs-Code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistJoined'
        '400':
          description: Ungültige E-Mail-Adresse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/native/exchange:
    post:
      summary: Einmal-Code aus dem App-Login einlösen
      description: >-
        Löst den Einmal-Code ein, mit dem `/auth/google?client=app&state=…` nach dem
        Google-Login auf den App Link `/app/auth/native?code=…` weiterleitet, und meldet
        den WebView der nativen App an (ADR 0016, #1669). Ein Code gilt 60 Sekunden,
        genau einmal und nur zusammen mit dem `state`, mit dem die App den Login gestartet hat.
        Mit `X-Client-Channel: play` antwortet die Route statt mit Session-Cookie mit einem
        App-Token (#2377).
      operationId: exchangeNativeLoginCode
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NativeLoginExchangeRequest'
      responses:
        '200':
          description: Angemeldet im Kanal `play` — App-Token statt Session-Cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppToken'
        '204':
          description: Angemeldet, Session-Cookie gesetzt
        '400':
          description: Code unbekannt, abgelaufen oder schon benutzt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /billing/subscriptions:
    post:
      summary: Abo anlegen
      description: >-
        Legt bei PayPal ein Abo zum gewählten Paket/Zeitraum an, persistiert einen
        `Subscription`-Datensatz mit Status `approval_pending` und liefert die
        Zustimmungs-URL (Issue #1505, T6d, AK1). Wirksam wird das Abo erst über das
        verifizierte Webhook-Ereignis (ADR 0013). Besteht für den Nutzer bereits ein
        laufendes Abo, antwortet die Route mit 409 (AK2); ein offener, nie bestätigter
        Checkout wird vorher über den PayPal-Kündigungsruf verworfen (#2235). Anfragen
        aus den Store-Apps (`X-Client-Channel: play` oder `appstore`) lehnt sie
        ebenfalls mit 409 ab, dort wird nie über PayPal gekauft (ADR 0016, #1668).
      operationId: createBillingSubscription
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingSubscriptionInput'
      responses:
        '201':
          description: Angelegtes Abo — Zustimmungs-URL; der Zustimmungszeitpunkt ist am Abo gespeichert (#2329)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingApproval'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Es besteht bereits ein laufendes Abo, oder die Anfrage kommt aus einer Store-App
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /billing/subscriptions/cancel:
    post:
      summary: Abo kündigen
      description: >-
        Ruft bei PayPal die Kündigung des eigenen Abos auf (Issue #1505, T6d, AK3).
        `plan` am Datensatz bleibt unverändert — wirksam wird die Kündigung erst
        über das Webhook-Ereignis `BILLING.SUBSCRIPTION.CANCELLED` (ADR 0013).
        Art, Grund und Bestätigungsadresse aus dem Bestätigungsschritt (#2308) werden
        am Abo gespeichert; die Bestätigungsmail an den Kunden geht erst mit dem Webhook
        raus, eine außerordentliche Kündigung meldet den Grund an `ADMIN_EMAILS`. Ein nie
        bestätigter Checkout wird ohne Body verworfen.
      operationId: cancelBillingSubscription
      tags: [billing]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingCancelInput'
      responses:
        '200':
          description: Kündigung bei PayPal ausgelöst
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Das Abo ist bereits gekündigt (#2048)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /billing/google/rtdn:
    post:
      summary: Abo-Ereignis von Google Play annehmen (RTDN)
      description: >-
        Pub/Sub-Push der Real-time Developer Notifications von Google Play (#1689,
        ADR 0017). Ohne Session und CSRF, vor `requireAuth` gemountet; geprüft wird
        das OIDC-Token im `Authorization`-Header (Aussteller Google, Zielgruppe
        `GOOGLE_RTDN_AUDIENCE`, Ablauf, optional das Dienstkonto). Das Ereignis wird
        dedupliziert über `message.messageId` abgelegt; danach holt der Server den
        aktuellen Abo-Stand über die Play Developer API und legt ihn am Abo ab.
      operationId: receiveGooglePlayNotification
      tags: [billing]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Pub/Sub-Push; die RTDN liegt Base64-kodiert in `message.data`.
              properties:
                message:
                  type: object
                  properties:
                    messageId:
                      type: string
                    data:
                      type: string
                subscription:
                  type: string
      responses:
        '200':
          description: Ereignis angenommen (auch bei einer wiederholten Zustellung)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [processed, duplicate]
        '400':
          description: Rumpf ist kein lesbares Ereignis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: OIDC-Token fehlt oder ist ungültig; nichts wird gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Google nicht erreichbar; Pub/Sub stellt erneut zu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /billing/google/purchase:
    post:
      summary: Kauf aus der Android-App freischalten
      description: >-
        Nimmt den Kauf-Token eines Abos aus Google Play Billing entgegen (#1687,
        ADR 0017). Der Server liest den Kauf über die Play Developer API, prüft per
        `obfuscatedAccountId`, dass er zum angemeldeten Nutzer gehört (`playAccountId`
        aus `GET /auth/me`), bestätigt ihn und legt das Abo mit Provider `google_play`
        an. Derselbe Token ein zweites Mal legt kein zweites Abo an. Ein Paketwechsel
        (#1696) verweist über `linkedPurchaseToken` auf den bisherigen Kauf und ersetzt
        dessen Abo; ein Wechsel zum Periodenende steht bis dahin in `pendingPlan`. Nur
        aus der Android-App (`X-Client-Channel: play`).
      operationId: submitGooglePurchase
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GooglePurchaseInput'
      responses:
        '204':
          description: Paket freigeschaltet (oder derselbe Kauf war schon freigeschaltet)
        '400':
          description: Token fehlt, ist ungültig oder gehört zu keinem bekannten Abo-Produkt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Der Kauf gehört zu einem anderen Konto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Anfrage nicht aus der Android-App, Kauf nicht aktiv oder es läuft schon ein Abo, das der Kauf nicht ersetzt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Google nicht erreichbar oder Play-Zugang nicht eingerichtet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /billing/subscriptions/change:
    post:
      summary: Paket wechseln
      description: >-
        Ruft bei PayPal den Wechsel des eigenen Abos auf Paket/Zeitraum auf (Issue
        #1505, T6d, AK4) und liefert, falls PayPal eine erneute Zustimmung verlangt,
        die Zustimmungs-URL. `plan` am Datensatz bleibt unverändert — wirksam wird
        der Wechsel erst über das Webhook-Ereignis (`applyPlanChange`, ADR 0013).
        Ein Upgrade oder Zeitraumwechsel im gleichen Paket (#2142) legt stattdessen ein neues PayPal-Abo an, dessen erster Zyklus
        um das Guthaben der Restlaufzeit reduziert ist, und liefert dessen
        Zustimmungs-URL; das alte Abo wird erst nach Bestätigung des neuen
        gekündigt (#1912); wartet das Abo noch auf seine erste Abbuchung, antwortet
        die Route mit 409. Anfragen aus den Store-Apps (`X-Client-Channel: play`
        oder `appstore`) lehnt die Route mit 409 ab (ADR 0016, #1668).
      operationId: changeBillingSubscription
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingSubscriptionInput'
      responses:
        '200':
          description: Wechsel bei PayPal ausgelöst — Zustimmungs-URL, falls PayPal eine verlangt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingApproval'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Anfrage aus einer Store-App, dort wird nicht über PayPal gekauft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /billing/subscriptions/change/preview:
    post:
      summary: Betrag des Paketwechsels vorab berechnen
      description: >-
        Liefert vor dem Bestätigen den Betrag, den der Paketwechsel kostet (#1913):
        bei einem PayPal-Upgrade oder Zeitraumwechsel im gleichen Paket (#2142) das Guthaben der Restlaufzeit und den um dieses
        reduzierten ersten Zyklus (dieselbe Rechnung wie `POST
        /billing/subscriptions/change`), sonst `creditCents: 0` und den Katalogpreis
        von Zielpaket/Zeitraum. Ruft PayPal nicht auf und schreibt nichts.
      operationId: previewBillingChange
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingSubscriptionInput'
      responses:
        '200':
          description: Guthaben und fälliger Betrag in Cent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingChangePreview'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /billing/invoices:
    get:
      summary: Eigene Rechnungen auflisten
      description: >-
        Liefert die Rechnungen des angemeldeten Nutzers (Issue #1505, T6d, AK5),
        neueste zuerst. Keine Zahlungsdaten (AK9) — die PDF-Bytes liefert
        `GET /billing/invoices/{id}/pdf` (#1955).
      operationId: listBillingInvoices
      tags: [billing]
      responses:
        '200':
          description: Liste der eigenen Rechnungen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /billing/invoices/{id}:
    get:
      summary: Eigene Rechnung lesen
      description: >-
        Liefert eine einzelne Rechnung des angemeldeten Nutzers (Issue #1505, T6d,
        AK5). Fremde oder unbekannte Rechnungen liefern 404 — weder inhaltlich noch
        über den Status wird eine fremde Rechnung verraten (Muster `/api-tokens/{id}`).
      operationId: getBillingInvoice
      tags: [billing]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Id der Rechnung
      responses:
        '200':
          description: Eigene Rechnung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /billing/invoices/{id}/pdf:
    get:
      summary: Rechnungs-PDF herunterladen
      description: >-
        Liefert das zum Erzeugungszeitpunkt gespeicherte PDF der eigenen Rechnung
        (Issue #1955, AK3/AK4) als Download — byte-identisch zum PDF-Anhang der
        Rechnungsmail. Fremde oder unbekannte Rechnungen — darunter Altrechnungen
        ohne gespeichertes PDF — liefern 404, wie `GET /billing/invoices/{id}`.
      operationId: getBillingInvoicePdf
      tags: [billing]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Id der Rechnung
      responses:
        '200':
          description: Das gespeicherte Rechnungs-PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    SeriesId:
      name: id
      in: path
      required: true
      description: ID der Serie
      schema:
        type: integer
    TaskId:
      name: id
      in: path
      required: true
      description: ID des Tasks
      schema:
        type: integer
    PillarId:
      name: id
      in: path
      required: true
      description: ID der Säule
      schema:
        type: integer
    CategoryId:
      name: id
      in: path
      required: true
      description: ID der Kategorie
      schema:
        type: integer
  responses:
    ValidationError:
      description: Ungültige Eingabe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PlanRequired:
      description: >-
        Das Paket des angemeldeten Nutzers enthält das benötigte Feature nicht (#1457).
        Body trägt zusätzlich `code: plan_required`, `feature`, `requiredPlan` und `currentPlan`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    QuotaExhausted:
      description: >-
        Fair-Use-Drossel (#1783): das interne Monatsbudget ist überschritten und die letzte
        KI-Anfrage liegt weniger als das Drossel-Intervall zurück. Body trägt zusätzlich
        `code: ai_throttled`, der Header `Retry-After` die Wartezeit in Sekunden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ressource nicht gefunden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Konflikt — die Abhängigkeit würde einen Zyklus erzeugen
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PillarsLocked:
      description: >-
        Gesperrt (#1573): Die fünf Säulen sind fest und gelten stets. Anlegen,
        Umbenennen und Löschen sind nicht erlaubt.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Interner Serverfehler (z. B. Datenbankfehler)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: Fehler beim Upstream-Dienst (Mistral nicht erreichbar/ungültige Antwort)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Dienst nicht konfiguriert (z. B. fehlender API-Key oder keine Säulen)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Profile:
      type: object
      description: >-
        Profildaten des Nutzers (#1219): Anzeigename (selbst festlegbar),
        unveränderliche E-Mail-Adresse und optionale Avatar-URL.
      required: [displayName, email, avatarUrl]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 60
          description: Anzeigename, fällt per Default auf die E-Mail zurück
        email:
          type: string
          format: email
          description: E-Mail-Adresse (über /profile nicht änderbar)
        avatarUrl:
          type: string
          nullable: true
          description: Avatar-URL (null ohne Avatar)
    BalanceVariant:
      type: object
      description: >-
        Zifferblatt-Auswahl pro User (#2009): welches Bild die Startseite für die
        Lebensbalance zeichnet — am Konto gespeichert, auf allen Geräten gleich.
      required: [variant]
      properties:
        variant:
          type: string
          description: Bild-Schlüssel (Default 'herz')
          enum: [herz, blasen, scheiben, ringe, strahlen, bluete, kristall, segmente, zeiger]
    GeoConfig:
      type: object
      description: >-
        Geo-Konfiguration pro User (#1098): Anzeige-Entfernung (max. Distanz der
        Nearby-Liste), Alarm-Entfernung (ab hier Alarm) und
        Aktualisierungsintervall der Positionsermittlung. Kreuz-Schranken:
        1 <= alarmDistanceKm <= displayDistanceKm <= 50, intervalMinutes 1–60.
      required: [displayDistanceKm, alarmDistanceKm, intervalMinutes]
      properties:
        displayDistanceKm:
          type: integer
          minimum: 1
          maximum: 50
          description: Anzeige-Entfernung in km (Default 5)
        alarmDistanceKm:
          type: integer
          minimum: 1
          maximum: 50
          description: Alarm-Entfernung in km (Default 1)
        intervalMinutes:
          type: integer
          minimum: 1
          maximum: 60
          description: Aktualisierungsintervall in Minuten (Default 5)
    McpInstructions:
      type: object
      description: Dialog-Vorgaben pro User für die per MCP verbundene KI (#1935).
      required: [instructions]
      properties:
        instructions:
          type: string
          maxLength: 2000
          description: Freitext (getrimmt, höchstens 2000 Zeichen); leer = keine Vorgaben
    FreeSlotConfig:
      type: object
      description: Mindestdauer freier Kalender-Lücken pro User (#1990).
      required: [freeSlotMinMinutes]
      properties:
        freeSlotMinMinutes:
          type: integer
          minimum: 10
          maximum: 240
          description: Mindestdauer in Minuten (Default 30)
    FreeSlot:
      type: object
      description: Eine freie Kalender-Lücke mit passenden offenen Aufgaben (#1990).
      required: [start, end, tasks]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        tasks:
          type: array
          maxItems: 3
          items:
            type: object
            required: [id, title]
            properties:
              id:
                type: integer
              title:
                type: string
    CareConfig:
      type: object
      description: >-
        Care-Konfiguration pro User (#1794): eigener Schalter für den Fürsorge-Push
        (getrennt von den Frist-Erinnerungen) und die Nutzer-Zeitzone (IANA) für
        Ruhezeit (21–8 Uhr) und Kalendertag-Dedup des Triggers.
      required: [carePushEnabled, zeitzone]
      properties:
        carePushEnabled:
          type: boolean
          description: Fürsorge-Push aktiv (Default true)
        zeitzone:
          type: string
          description: IANA-Zeitzonenname (Default 'UTC')
    CareSprache:
      type: object
      description: App-Sprache des Users für den Fürsorge-Push (#1879).
      required: [sprache]
      properties:
        sprache:
          type: string
          description: Sprachcode der App (de, en, es, fr, it, nl, pl, pt, ru, sv)
    Group:
      type: object
      description: >-
        Gruppe mit Sicht einer Mitgliedschaft (#1211): Rolle des aufrufenden
        Nutzers und Mitgliederzahl. Beschreibung ist optional (null ohne Angabe).
      required: [id, name, description, role, memberCount]
      properties:
        id:
          type: integer
          description: ID der Gruppe
        name:
          type: string
          description: Name der Gruppe (maximal 60 Zeichen)
        description:
          type: [string, 'null']
          description: Optionale Beschreibung der Gruppe
        imageUrl:
          type: [string, 'null']
          description: >-
            https-Bildadresse des Gruppenbilds (#1225); null = kein Bild
            (Initialen aus dem Namen)
        kind:
          type: string
          enum: [group, duo]
          description: Art der Gruppe (#1974); `duo` = genau zwei Mitglieder
        role:
          type: string
          enum: [admin, member]
          description: Rolle des aufrufenden Nutzers in der Gruppe
        memberCount:
          type: integer
          description: Anzahl der Mitglieder der Gruppe
    GroupInput:
      type: object
      description: Payload zum Anlegen einer Gruppe (#1211).
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Name der Gruppe (nach Trim nicht leer, max. 60 Zeichen)
        description:
          type: string
          description: Optionale Beschreibung der Gruppe
        kind:
          type: string
          enum: [group, duo]
          description: Art der Gruppe (#1974); ohne Angabe `group`, sonst HTTP 400
    GroupUpdate:
      type: object
      description: Payload zum Bearbeiten einer Gruppe — alle Felder optional.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Neuer Name (nach Trim nicht leer, max. 60 Zeichen)
        description:
          type: string
          description: Neue Beschreibung der Gruppe
        imageUrl:
          type: [string, 'null']
          description: >-
            Neue Bildadresse (#1225) — muss beginnen mit https://, null entfernt
            das Bild; abwesendes Feld lässt es unverändert
    UserSearchHit:
      type: object
      description: Suchtreffer der Nutzersuche (#1212) — bewusst ohne E-Mail.
      required: [id, displayName]
      properties:
        id:
          type: integer
        displayName:
          type: string
    CareWirkung:
      type: object
      description: Anonyme Wirkungs-Auswertung der Fürsorge (#1798), nur Summen.
      required: [wochen, bindung]
      properties:
        wochen:
          type: array
          items:
            type: object
            required: [woche, angezeigt, uebernommen, abgelehnt, ignoriert]
            properties:
              woche:
                type: string
                format: date
                description: Montag der Woche (UTC).
              angezeigt:
                type: integer
              uebernommen:
                type: integer
              abgelehnt:
                type: integer
              ignoriert:
                type: integer
        bindung:
          type: object
          required: [push_an, push_aus]
          properties:
            push_an:
              $ref: '#/components/schemas/CareBindung'
            push_aus:
              $ref: '#/components/schemas/CareBindung'
    CareBindung:
      type: object
      description: 4- und 12-Wochen-Bindung einer Push-Gruppe (Kohorte ab Registrierungswoche).
      required: [w4, w12]
      properties:
        w4:
          $ref: '#/components/schemas/CareBindungsZelle'
        w12:
          $ref: '#/components/schemas/CareBindungsZelle'
    CareBindungsZelle:
      description: >-
        Nutzer, deren Zielwoche vorbei ist, davon aktiv (mindestens eine erledigte Aufgabe in
        der Zielwoche); bei weniger als 5 Nutzern der String `unterdrueckt`.
      oneOf:
        - type: object
          required: [nutzer, aktiv, quote]
          properties:
            nutzer:
              type: integer
            aktiv:
              type: integer
            quote:
              type: number
        - type: string
          enum: [unterdrueckt]
    KpiAuswertung:
      type: object
      description: Markteinführungs-Kennzahlen je Registrierungsperiode (#1989), nur Summen.
      required: [zeitraum, zeilen]
      properties:
        zeitraum:
          type: string
          enum: [woche, monat]
        zeilen:
          type: array
          items:
            $ref: '#/components/schemas/KpiZeile'
    KpiZeile:
      type: object
      description: Eine Registrierungsperiode (Kalenderwoche bzw. Monat, UTC).
      required: [periode, neueNutzer, aktivierung, tag7, wochenkarte, einladungen]
      properties:
        periode:
          type: string
          description: Montag der Woche (YYYY-MM-DD) bzw. Monat (YYYY-MM) der Registrierungen.
        neueNutzer:
          type: integer
          description: Neue Konten der Periode (ohne Admin-Konten).
        aktivierung:
          $ref: '#/components/schemas/KpiZelle'
        tag7:
          $ref: '#/components/schemas/KpiZelle'
        wochenkarte:
          $ref: '#/components/schemas/KpiZelle'
        einladungen:
          $ref: '#/components/schemas/KpiZelle'
    KpiZelle:
      description: >-
        Zähler und Nenner einer Quote (Aktivierung/Tag 7: Kohorte; Wochenkarte/Einladungen:
        Ereignisse je neuem Konto); bei weniger als 5 Nutzern der String `unterdrueckt`.
      oneOf:
        - type: object
          required: [zaehler, nenner, quote]
          properties:
            zaehler:
              type: integer
            nenner:
              type: integer
            quote:
              type: number
        - type: string
          enum: [unterdrueckt]
    AdminUser:
      type: object
      description: Nutzer-Eintrag der Admin-Nutzerverwaltung (Rollensystem admin/member/tester).
      required: [id, email, displayName, role, plan, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, member, tester]
        plan:
          $ref: '#/components/schemas/Plan'
        createdAt:
          type: string
          format: date-time
        aiRequestsThisMonth:
          type: integer
          minimum: 0
          description: KI-Anfragen im laufenden Monat (#1783) — nur in der Nutzerliste.
        subscriptionStatus:
          type: string
          nullable: true
          description: >-
            Status des Zahlungsabos (#1959) — `null` ohne Abo; `locked` markiert die
            Admin-Sperre (Zugriff aufs bezahlte Paket gestoppt, ein neuer Abschluss
            ist nicht blockiert).
    AdminSubscription:
      type: object
      description: Abo eines Nutzers in der Admin-Nutzerverwaltung (#2295).
      required: [id, provider, plan, status, currentPeriodEnd, createdAt]
      properties:
        id:
          type: integer
        provider:
          type: string
          enum: [paypal, google]
        plan:
          $ref: '#/components/schemas/Plan'
        status:
          type: string
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    AdminWaitlistEntry:
      type: object
      description: Eintrag der Warteliste im Referral-Rang (#1982, ADR 0019).
      required: [id, email, status, position, referralCount, accessMailStatus, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
          description: Normalisierte E-Mail-Adresse (trim + lowercase).
        status:
          type: string
          enum: [waiting, activated]
          description: >-
            Freischalt-Status — reine Anzeige; die Login-Wirkung trägt der AllowedEmail-Eintrag
            (isDbEmailAllowed).
        position:
          type: integer
          minimum: 1
          description: 1-basierte Position im Referral-Rang.
        referralCount:
          type: integer
          minimum: 0
          description: Anzahl geworbener Anmeldungen über den persönlichen Empfehlungs-Code.
        accessMailStatus:
          type: string
          nullable: true
          enum: [sent, failed, null]
          description: Ergebnis der Freischalt-Mail (#2305); null = nie versucht.
        createdAt:
          type: string
          format: date-time
    AdminUserRoleUpdate:
      type: object
      description: Payload zum Ändern der Rolle eines Nutzers (Rollensystem admin/member/tester).
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member, tester]
    AdminUserPlanUpdate:
      type: object
      description: Payload zum Setzen des Pakets eines Nutzers (#1456, manuelle Vergabe bis T7).
      required: [plan]
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
    AllowedEmail:
      type: object
      description: >-
        Zugelassene E-Mail-Adresse mit Herkunft (#1983) — unabhängig davon, ob
        bereits ein Konto existiert (das Konto entsteht beim ersten Login).
      required: [email, origin, createdAt]
      properties:
        email:
          type: string
        origin:
          type: string
          enum: [einladung, delegation, admin, warteliste]
        createdAt:
          type: string
          format: date-time
    ReassignStatusFilter:
      type: string
      enum: [all, open, done]
      description: >-
        Statusauswahl eines Neuberechnungs-Laufs. `open` umfasst offene UND in
        Bearbeitung befindliche Aufgaben — dieselbe Abgrenzung wie im Frontend.
    OwnReassignPillarsResult:
      type: object
      description: >-
        Ergebnis eines Laufs über die eigenen Aufgaben
        (POST /tasks/reassign-pillars).
      required: [updated, failed, skipped, remaining, quotaExhausted]
      properties:
        updated:
          type: integer
          description: Aufgaben mit erfolgreich ersetzter Säulenverteilung.
        failed:
          type: integer
          description: Aufgaben, deren Klassifikation oder Speichern fehlschlug (Lauf lief weiter).
        skipped:
          type: integer
          description: Aufgaben ohne gültigen Vorschlag — Zuordnung unverändert gelassen.
        remaining:
          type: integer
          description: >-
            Aufgaben der gewählten Statusauswahl, die dieser Lauf nicht mehr
            erreicht hat — Grundlage für den Fortschritt und den Folgeaufruf.
        quotaExhausted:
          type: boolean
          description: >-
            Der Lauf endete vorzeitig, weil das interne KI-Budget überschritten ist und
            die Fair-Use-Drossel greift (#1783). `remaining` bleibt dann bewusst > 0.
        failureReasons:
          type: object
          additionalProperties:
            type: integer
          description: >-
            Fehlergründe der fehlgeschlagenen Aufgaben dieses Laufs, zusammengefasst
            als Grund → Anzahl (z. B. `{"HTTP 429": 12}`). Fehlt, wenn nichts fehlschlug.
    OwnReassignPillarsStatus:
      type: object
      description: Stand der Säulen-Neuberechnung (GET /tasks/reassign-pillars).
      required: [startedAt, total, pending]
      properties:
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: Start des letzten Laufs; `null`, wenn noch keiner lief.
        total:
          type: integer
          description: Aufgaben der Statusauswahl insgesamt.
        pending:
          type: integer
          description: >-
            Aufgaben der Statusauswahl, die seit `startedAt` nicht erfolgreich neu
            berechnet wurden. Ohne Lauf gleich `total`.
        running:
          type: boolean
          description: Ein Hintergrundlauf ist gerade unterwegs (#1642).
        processed:
          type: integer
          description: Im laufenden bzw. letzten Hintergrundlauf abgeschlossene Aufgaben.
        result:
          $ref: '#/components/schemas/ReassignRunResult'
    ReassignRunStarted:
      type: object
      description: Antwort auf den Start eines Hintergrundlaufs (#1642).
      required: [running, processed]
      properties:
        running:
          type: boolean
        processed:
          type: integer
    ReassignRunResult:
      type: object
      description: >-
        Ergebnis des letzten Hintergrundlaufs seit dem Serverstart (#1642) — fehlt,
        solange der Lauf noch läuft oder seit dem Serverstart keiner lief.
      required: [updated, failed, skipped, quotaExhausted]
      properties:
        updated:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        quotaExhausted:
          type: boolean
        failureReasons:
          type: object
          additionalProperties:
            type: integer
    ReassignPillarsResult:
      type: object
      description: >-
        Ergebnis des Batch-Laufs zur Neuberechnung der Säulenverteilung aller
        Aufgaben (POST /admin/tasks/reassign-pillars).
      required: [updated, failed, skipped, users, remaining]
      properties:
        updated:
          type: integer
          description: Aufgaben mit erfolgreich ersetzter Säulenverteilung.
        failed:
          type: integer
          description: Aufgaben, deren Klassifikation oder Speichern fehlschlug (Lauf lief weiter).
        skipped:
          type: integer
          description: Aufgaben ohne gültigen Vorschlag — Zuordnung unverändert gelassen.
        users:
          type: integer
          description: Konten mit verarbeiteten Aufgaben im Lauf.
        failureReasons:
          type: object
          additionalProperties:
            type: integer
          description: >-
            Fehlergründe der fehlgeschlagenen Aufgaben dieses Aufrufs, zusammengefasst
            als Grund → Anzahl. Fehlt, wenn nichts fehlschlug.
        remaining:
          type: integer
          description: >-
            Noch nicht verarbeitete Aufgaben, weil `limit` erreicht wurde — 0,
            wenn der Bestand komplett durchlief. Ein erneuter Aufruf setzt den
            Batch bei den verbleibenden Aufgaben fort.
    Plan:
      type: string
      description: Buchbares Paket. Reihenfolge der Werte ist die Rangfolge (aufsteigend).
      enum: [free, plus, pro]
    FeatureEntitlement:
      type: object
      description: >-
        Auswertung eines Features für ein Paket (#1456). `allowed` ist die
        wahrheitsgemäße Paketauswertung und bleibt unabhängig vom Rollout-Schalter
        `MONETIZATION_ENFORCED` — durchgesetzt wird erst in T8.
      required: [allowed, requiredPlan]
      properties:
        allowed:
          type: boolean
        requiredPlan:
          $ref: '#/components/schemas/Plan'
    FeatureCatalogEntry:
      type: object
      description: Ein Feature und die Pakete, die es enthalten (#1456).
      required: [feature, allowedPlans]
      properties:
        feature:
          type: string
          enum:
            [
              groups,
              voice_input,
              ai_assist,
              graph_write,
              graph_weight,
              location_reminders,
              mcp_readwrite,
              mcp_read,
              feedback,
            ]
        allowedPlans:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
    PlanPrice:
      type: object
      description: >-
        Preis eines Pakets je Abrechnungszeitraum in Cent (#1494). `quarterly`/`yearly` sind der
        kaufmännisch gerundete Monatspreis mal 3×0,9 bzw. 12×0,8.
      required: [monthly, quarterly, yearly]
      properties:
        monthly:
          type: integer
        quarterly:
          type: integer
        yearly:
          type: integer
    PlansCatalog:
      type: object
      description: Feature-Matrix und Preise aller Pakete (#1456) — Antwort von `GET /plans`.
      required: [features, prices]
      properties:
        features:
          type: array
          items:
            $ref: '#/components/schemas/FeatureCatalogEntry'
        prices:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PlanPrice'
    GroupMember:
      type: object
      description: Mitglied einer Gruppe mit Anzeigename und Rolle (#1212).
      required: [userId, displayName, role]
      properties:
        userId:
          type: integer
        displayName:
          type: string
        role:
          type: string
          enum: [admin, member]
    GroupTask:
      type: object
      description: >-
        Aufgabe, die ein Gruppenmitglied für ein anderes Mitglied angelegt hat
        (#1223) — bewusst ohne Beschreibung, Checkliste und Nutzer-Ids.
      required: [id, title, deadline, status, recipientName, creatorName]
      properties:
        id:
          type: integer
        title:
          type: string
        deadline:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/TaskStatus'
        recipientName:
          type: string
          description: Anzeigename des Empfängers (Fallback E-Mail)
        creatorName:
          type: string
          description: Anzeigename des Erstellers (Fallback E-Mail)
    Duo:
      type: object
      description: Stand eines Duos (#1974) — gemeinsamer Streak und Säulenwerte je Mitglied.
      required: [streak, members]
      properties:
        streak:
          type: object
          required: [aktuell, best]
          properties:
            aktuell:
              type: integer
            best:
              type: integer
        members:
          type: array
          items:
            type: object
            required: [userId, name, saeulen]
            properties:
              userId:
                type: integer
              name:
                type: string
              saeulen:
                type: array
                items:
                  type: object
                  required: [pillarId, name, wert]
                  properties:
                    pillarId:
                      type: integer
                    name:
                      type: string
                    wert:
                      type: number
    GroupChallenge:
      type: object
      description: >-
        Gruppen-Challenge (#1992) — Zeitraum, aus `endsAt` abgeleiteter Status
        und Rangfolge nach Balance (nicht nach Menge).
      required: [gruppe, status, startsAt, endsAt, rangfolge]
      properties:
        gruppe:
          type: string
          description: Gruppenname (für die teilbare Abschluss-Karte)
        status:
          type: string
          enum: [laufend, beendet]
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        rangfolge:
          type: array
          items:
            type: object
            required: [name, rang, balance]
            properties:
              name:
                type: string
              rang:
                type: integer
              balance:
                type: number
                nullable: true
                description: Füllstand 0–1; `null` ohne Punkte im Zeitraum
    GroupSeries:
      type: object
      description: >-
        Serie, die ein Gruppenmitglied für ein anderes Mitglied angelegt hat
        (#1254) — bewusst ohne Beschreibung, Adresse, Koordinaten und Nutzer-Ids.
      required: [id, title, rhythm, active, ownerName, creatorName]
      properties:
        id:
          type: integer
        title:
          type: string
        rhythm:
          $ref: '#/components/schemas/SeriesRhythm'
        active:
          type: boolean
          description: false = ruhend (z. B. nach Mitgliederaustritt #1251)
        ownerName:
          type: string
          description: Anzeigename des Eigentümers (Fallback E-Mail)
        creatorName:
          type: string
          description: Anzeigename des Erstellers (Fallback E-Mail)
    GroupMemberRoleUpdate:
      type: object
      description: Payload zum Ändern der Rolle eines Mitglieds (#1221).
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]
    GroupInvitationInput:
      type: object
      description: >-
        Payload zum Einladen eines Kontos (#1212). Alternativ zur userId kann eine
        E-Mail-Adresse eingeladen werden (#1983): Eine unbekannte Adresse wird als
        Konto angelegt, mit Herkunft einladung freigeschaltet und per Zugangs-Mail
        benachrichtigt; ein bekanntes Konto verhält sich wie der userId-Pfad.
      properties:
        userId:
          type: integer
        email:
          type: string
          description: >-
            E-Mail-Adresse statt userId (#1983, AK2) — eines von beiden ist Pflicht.
    GroupInvitation:
      type: object
      description: Offene Einladung aus Sicht der Gruppe (#1212).
      required: [id, groupId, userId, status]
      properties:
        id:
          type: integer
        groupId:
          type: integer
        userId:
          type: integer
        displayName:
          type: string
        status:
          type: string
          enum: [pending, accepted, declined]
        accessMailThrottled:
          type: boolean
          description: Nur gesetzt (true), wenn die Zugangs-Mail an eine neue Adresse wegen der Tagesgrenze je Nutzer entfiel (#2041).
    ReceivedInvitation:
      type: object
      description: Offene Einladung aus Sicht des Eingeladenen (#1212).
      required: [id, groupId, groupName, invitedByName]
      properties:
        id:
          type: integer
        groupId:
          type: integer
        groupName:
          type: string
        invitedByName:
          type: string
    InvitationResult:
      type: object
      description: Ergebnis von Annehmen/Ablehnen einer Einladung (#1212).
      required: [groupId]
      properties:
        groupId:
          type: integer
    GroupInviteLink:
      type: object
      description: >-
        Erzeugter Einladungslink (#1226). Der Token wird ausschließlich bei der
        Erzeugung übermittelt — ein späteres erneutes Auslesen ist bewusst
        nicht möglich.
      required: [id, token, expiresAt]
      properties:
        id:
          type: integer
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    InviteLinkPreview:
      type: object
      description: Öffentliche Linkpreisgabe (#1226) — nur Gruppenname und Einladender.
      required: [name, invitedByName]
      properties:
        name:
          type: string
        invitedByName:
          type: string
    InviteLinkRedeemResult:
      type: object
      description: Ergebnis des Einlösens eines Einladungslinks (#1226).
      required: [groupId]
      properties:
        groupId:
          type: integer
    ApiToken:
      type: object
      description: >-
        Persönlicher API-Token für externe Clients (#1352) — Metadaten-Sicht ohne
        Klartext und ohne Hash.
      required: [id, name, createdAt, lastUsedAt, scope, expiresAt]
      properties:
        id:
          type: integer
        name:
          type: string
          description: Frei gewählter Name zur Wiedererkennung (1–60 Zeichen)
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Zeitpunkt des letzten erfolgreichen Bearer-Requests (null, solange ungenutzt)
        scope:
          type: string
          enum: [read, readwrite]
          description: >-
            Rechtestufe des Tokens (#1356). `read` erlaubt nur lesende Requests, `readwrite`
            auch schreibende. Ein neu angelegter Token startet immer als `read`.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Ablaufdatum des Tokens (#1357). `null` ausschließlich für Bestandstokens ohne
            Migration — neu angelegte Tokens haben immer ein Ablaufdatum.
    ApiTokenInput:
      type: object
      description: Eingabe zum Anlegen eines API-Tokens (#1352).
      required: [name, expiresInDays]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        expiresInDays:
          type: integer
          enum: [30, 90, 180, 365]
          description: >-
            Feste Laufzeit in Tagen (#1357) — Pflichtfeld, Höchstlaufzeit 365 Tage
            (12 Monate).
    ApiTokenScopeInput:
      type: object
      description: Eingabe zum Umschalten der Rechtestufe eines API-Tokens (#1356).
      required: [scope]
      properties:
        scope:
          type: string
          enum: [read, readwrite]
    CreatedApiToken:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          description: Antwort auf das Anlegen — enthält den Klartext genau einmal (#1352).
          required: [token]
          properties:
            token:
              type: string
              description: Klartext-Token (`pp_<32 Hex>`); nur in dieser Antwort enthalten
    PlaceFavorite:
      type: object
      description: >-
        Gespeicherter Ort eines Nutzers (#1342) — eine Adresse, Koordinaten optional.
        Seit #1595 ohne Anzeigenamen: die Adresse ist die Bezeichnung.
      required: [id, address, latitude, longitude]
      properties:
        id:
          type: integer
        address:
          type: string
        latitude:
          type: number
          format: float
          nullable: true
          description: Breitengrad; null bei einem Freitext-Ort ohne Geocoding-Treffer
        longitude:
          type: number
          format: float
          nullable: true
          description: Längengrad; null bei einem Freitext-Ort ohne Geocoding-Treffer
    PlaceFavoriteInput:
      type: object
      description: >-
        Eingabe zum Anlegen eines gespeicherten Orts (#1342). Eine bereits gespeicherte Adresse
        (getrimmt, Groß-/Kleinschreibung egal) legt keinen zweiten Eintrag an, sondern liefert den
        bestehenden zurück (#1595).
      required: [address]
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 255
        latitude:
          type: number
          format: float
          nullable: true
        longitude:
          type: number
          format: float
          nullable: true
    JournalEntry:
      type: object
      description: >-
        Journal-Eintrag eines Nutzers (#2212). Verschwindet die Säule, wird `pillarId` zu null.
      required: [id, text, date, pillarId]
      properties:
        id:
          type: integer
        text:
          type: string
        date:
          type: string
          format: date
        pillarId:
          type: integer
          nullable: true
    JournalEntryInput:
      type: object
      description: Eingabe zum Anlegen eines Journal-Eintrags (#2212).
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 3000
        date:
          type: string
          format: date
          description: Kalendertag; ohne Angabe der heutige Tag (UTC)
        pillarId:
          type: integer
          nullable: true
          description: Eigene Säule; null oder fehlend = keine Säule
    JournalEntryUpdate:
      type: object
      description: Teiländerung eines Journal-Eintrags (#2212); nur mitgeschickte Felder ändern sich.
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 3000
        date:
          type: string
          format: date
        pillarId:
          type: integer
          nullable: true
    JournalStats:
      type: object
      description: >-
        Journal-Statistik (#2213): Eintragsanzahl je Zeitfenster neben dem Balance-Verlauf
        (#1424) für denselben Zeitraum.
      required: [fenster, balanceVerlauf]
      properties:
        fenster:
          type: array
          description: >-
            Zählfenster aufsteigend — je Kalendertag (`granularitaet=tag`) bzw. Kalenderwoche mit
            Montag-Beginn (`woche`), Randwochen auf den Zeitraum geschnitten; Fenster ohne
            Einträge mit 0.
          items:
            $ref: '#/components/schemas/JournalStatsFenster'
        balanceVerlauf:
          type: array
          description: Balance-Verlauf je Kalendertag — identisch zu `GET /scores/balance/history`.
          items:
            $ref: '#/components/schemas/BalanceHistoryEntry'
    JournalStatsFenster:
      type: object
      description: Eintragszählung eines Fensters.
      required: [von, bis, proSaeule, ohneSaeule, gesamt]
      properties:
        von:
          type: string
          description: Erster Tag des Fensters (`YYYY-MM-DD`).
        bis:
          type: string
          description: Letzter Tag des Fensters (`YYYY-MM-DD`).
        proSaeule:
          type: array
          description: Eintragsanzahl je Säule des Nutzers — alle Säulen, auch mit 0.
          items:
            type: object
            required: [pillarId, anzahl]
            properties:
              pillarId:
                type: integer
              anzahl:
                type: integer
        ohneSaeule:
          type: integer
          description: Anzahl Einträge ohne Säule im Fenster.
        gesamt:
          type: integer
          description: Summe aller Einträge im Fenster.
    CalendarSource:
      type: object
      description: Kalenderquelle eines Nutzers (#2209), ohne die geheime Adresse und ohne Zugangsdaten.
      required: [id, name, type]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [ics, caldav]
          description: Art der Quelle (#2211)
    CalendarSourceInput:
      type: object
      description: Eingabe zum Anlegen einer Kalenderquelle (#2209).
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2048
          description: ICS- oder CalDAV-Adresse (http oder https), z. B. die geheime iCal-Adresse aus Google Kalender
        name:
          type: string
          maxLength: 100
          description: Anzeigename; ohne Angabe „Kalender"
        type:
          type: string
          enum: [ics, caldav]
          description: Art der Quelle (#2211); ohne Angabe `ics`
        username:
          type: string
          maxLength: 1024
          description: CalDAV-Benutzername, Pflicht bei `caldav`
        password:
          type: string
          maxLength: 1024
          description: CalDAV-App-Passwort, Pflicht bei `caldav`; wird verschlüsselt gespeichert und nie ausgegeben
    CalendarEvent:
      type: object
      description: Gespeicherter Termin einer Kalenderquelle (#2209).
      required: [sourceId, start, end, title, allDay]
      properties:
        sourceId:
          type: integer
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        title:
          type: string
        allDay:
          type: boolean
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          description: Konstante Statuskennung; signalisiert einen lebenden Dienst.
    TaskStatus:
      type: string
      enum:
        - Open
        - In process
        - Done
      default: Open
      description: Bearbeitungsstatus des Tasks
    ScoreBreakdown:
      type: object
      description: >-
        Score-Aufschlüsselung einer Empfehlung (#2044): absolute Beiträge je Faktor
        (Summe der vorhandenen Beiträge = `total`). Ein Faktor mit Beitrag 0 fehlt.
      required: [total]
      properties:
        total:
          type: number
          description: Gesamtscore der Empfehlung.
        priority:
          type: number
          description: Beitrag der Priorität.
        unlock:
          type: number
          description: Beitrag der Entsperr-Wirkung.
        balance:
          type: number
          description: Beitrag der Balance-Korrektur.
        deadline:
          type: number
          description: Beitrag der Deadline-Nähe.
        effort:
          type: number
          description: Beitrag des Aufwands.
    TaskReasons:
      type: object
      description: >-
        Strukturierte Begründungswerte der Empfehlung (#1985): je Faktor mit Beitrag > 0 der
        Rohwert für die Begründungssätze der Karte. Ein Faktor ohne Beitrag fehlt; ganz ohne
        Anteile fehlt `reasons` komplett.
      properties:
        balance:
          type: object
          description: Namen der Defizit-Säulen (Soll > Ist) des Tasks.
          required: [pillars]
          properties:
            pillars:
              type: array
              items:
                type: string
        unlock:
          type: object
          description: Anzahl der offenen Nachfolger.
          required: [openCount]
          properties:
            openCount:
              type: integer
        deadline:
          type: object
          description: >-
            Frist des Tasks; `date` im ISO-Datumsformat, `daysUntil` die auf ganze Tage
            gerundete Differenz zum heutigen Kalendertag (negativ = überfällig).
          required: [date, daysUntil]
          properties:
            date:
              type: string
              format: date
            daysUntil:
              type: integer
        priority:
          type: object
          description: Prioritätswert des Tasks.
          required: [priority]
          properties:
            priority:
              type: integer
    TaskRecommendation:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          description: Task plus Begründung der Empfehlung (#2044).
          required: [scoreBreakdown]
          properties:
            scoreBreakdown:
              $ref: '#/components/schemas/ScoreBreakdown'
            reasons:
              $ref: '#/components/schemas/TaskReasons'
    Task:
      type: object
      required:
        - id
        - title
        - status
        - priority
        - estimatedEffort
        - pillars
      properties:
        accessMailThrottled:
          type: boolean
          description: Nur gesetzt (true), wenn die Zugangs-Mail an eine neue Empfänger-Adresse wegen der Tagesgrenze je Nutzer entfiel (#2041).
        id:
          type: integer
        title:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        estimatedEffort:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
          default: 0.5
          description: Geschätzter Eigenaufwand in Tagen (1 Tag ≙ 14 h reguläre Wachzeit)
        actualEffort:
          type: number
          format: float
          minimum: 0
          nullable: true
        description:
          type: string
          nullable: true
        address:
          type: string
          maxLength: 255
          nullable: true
          description: >-
            Adresse des Aufgabenorts, über die Adresssuche (Forward-Geocoding,
            OpenStreetMap Nominatim) ausgewählt. `null`, wenn kein Ortsbezug gesetzt ist.
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          nullable: true
          description: >-
            Breitengrad des Aufgabenorts (#1066). Wird nur bei Auswahl eines
            Adress-Vorschlags gesetzt; `null`, wenn kein Koordinaten-Bezug besteht.
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          nullable: true
          description: >-
            Längengrad des Aufgabenorts (#1066), analog `latitude`.
        deadline:
          type: string
          format: date-time
          nullable: true
        autoDeleteAfterDeadline:
          type: boolean
          description: >-
            `true`, wenn die Aufgabe bei verpasster Deadline automatisch gelöscht
            werden soll (3 Tage nach Ablauf, nur wenn nicht erledigt, #523).
        postponeCount:
          type: integer
          description: >-
            Verschiebe-Zähler (#1964): steigt bei jedem PATCH, der die Deadline auf einen
            streng späteren Zeitpunkt setzt, um genau 1. Rein informativ (Anzeige
            „N× verschoben"), kein Status-/Score-Einfluss.
        archivedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Zeitpunkt des Archivierens (#1964), `null` wenn nicht archiviert. Archivierte
            Aufgaben erscheinen weder in der Standardliste noch in der Verpasst-Auswahl,
            bleiben aber per Direktabruf (`GET /tasks/{id}`) lesbar.
        seriesId:
          type: integer
          nullable: true
          description: >-
            ID des Serien-Templates, aus dem diese Instanz generiert wurde
            (`null` ⇒ gewöhnlicher Einzel-Task oder nach Abkoppeln von einer
            gelöschten Serie), siehe Serienaufgaben (#120).
        originSeriesId:
          type: integer
          nullable: true
          description: >-
            Dauerhafte Provenienz (#553): ID der Serie, aus der dieser Task
            ursprünglich erzeugt wurde. Wird beim Generieren einmalig gesetzt und
            NIE geändert — auch beim Löschen der Serie nicht. Während `seriesId`
            die Live-Verbindung hält (und beim Abkoppeln auf null fällt), bleibt
            `originSeriesId` als Herkunftsnachweis erhalten. `null` ⇒ nie Teil
            einer Serie.
        isException:
          type: boolean
          default: false
          description: >-
            `true`, wenn diese generierte Serien-Instanz individuell geändert
            wurde — Template-Generierung lässt solche Instanzen unberührt.
        pinned:
          type: boolean
          default: false
          description: >-
            `true`, wenn die Aufgabe angepinnt ist (#1582) — angepinnte Aufgaben
            stehen unabhängig von der Sortierung über der restlichen Liste.
        pinnedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Zeitpunkt des Anpinnens (#1582), rein serverseitig abgeleitet — bestimmt
            die Reihenfolge unter mehreren angepinnten Aufgaben (zuletzt angepinnt
            zuerst). `null`, wenn die Aufgabe nicht angepinnt ist.
        userId:
          type: integer
          nullable: true
          description: >-
            Eigentümer der Aufgabe (Datenisolation #207); bei einer für ein anderes
            Gruppenmitglied angelegten Aufgabe/Instanz das Empfänger-Konto (#1213,
            #1222), `null` im Dev-Pass-Through.
        createdById:
          type: integer
          nullable: true
          description: >-
            Konto des Erstellers (#1213). Weicht bei einer Aufgabe für ein anderes
            Gruppenmitglied vom Eigentümer ab; `null` für Bestandsaufgaben ohne
            Ersteller-Eintrag.
        createdByName:
          type: string
          nullable: true
          description: >-
            Anzeigename des Erstellers (E-Mail-Fallback, #1213); synchron zu
            `createdById`, also `null` ohne Ersteller-Eintrag.
        forUserId:
          type: integer
          nullable: true
          description: >-
            Empfänger-Konto, nur gesetzt, wenn die Aufgabe aus Sicht des aufrufenden
            Erstellers für ein anderes Gruppenmitglied angelegt wurde (#1213);
            sonst `null`.
        forUserName:
          type: string
          nullable: true
          description: Anzeigename des Empfängers (E-Mail-Fallback, #1213); synchron zu `forUserId`.
        groupId:
          type: integer
          nullable: true
          description: >-
            Gruppe, an die die Aufgabe gerichtet ist (#1521). Solange `userId` `null` ist,
            sehen alle Mitglieder der Gruppe die Aufgabe; das erledigende Mitglied wird als
            `userId` eingetragen und bekommt die Gutschrift. `null` bei Einzel-Aufgaben.
        groupName:
          type: string
          nullable: true
          description: Name der adressierten Gruppe (#1521); synchron zu `groupId`.
        aiSuitability:
          type: string
          nullable: true
          enum: [draft, summary, research]
          description: >-
            KI-Eignung der Aufgabe (#2349), per Schlüsselwort-Heuristik beim Lesen berechnet
            (kein LLM, nicht gespeichert): Entwurf, Zusammenfassung oder Recherche. Nur in
            Listen-Antworten und nur für Nutzer mit Paketmerkmal `ai_assist`; sonst fehlt das Feld.
            `null` = keine Eignung.
        aiDraft:
          type: string
          nullable: true
          description: >-
            KI-Entwurf (#2350) aus `POST /tasks/{id}/ai-draft`, getrennt von `description`;
            `null` = kein Entwurf.
        pillars:
          type: array
          description: >-
            Säulen, auf die der Task einzahlt (0..n). Der `share` verteilt 100 %
            über die referenzierten Säulen; `confidence` ist die Konfidenz je Beitrag.
          items:
            $ref: '#/components/schemas/TaskPillarContribution'
        checklist:
          type: array
          description: >-
            Abhakbare Checkliste (0–20 Einträge) zum Zerlegen des Tasks in Teilschritte
            (#531). Default leer; bestehende Tasks ohne Checkliste liefern `[]`
            (rückwärtskompatibel).
          items:
            $ref: '#/components/schemas/ChecklistItem'
        categoryId:
          type: integer
          nullable: true
          description: >-
            Thematische Kategorie der Aufgabe (0..1, siehe Schema `Category`); `null`,
            wenn keine zugeordnet ist.
    TaskCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        userId:
          type: integer
          description: >-
            Optionaler Empfänger (#1213): das Konto, dem die Aufgabe gehören soll.
            Der Aufrufer muss mit ihm eine Gruppe teilen (sonst 403); ohne das Feld
            oder mit der eigenen ID gehört die Aufgabe dem Aufrufer wie bisher.
        recipientEmail:
          type: string
          description: >-
            Optionaler Empfänger per E-Mail statt userId (#1983, AK5): Ein bekanntes
            Konto wird wie userId behandelt (Shared-Group-Prüfung), eine unbekannte
            Adresse wird zum Konto angelegt, mit Herkunft delegation freigeschaltet
            und per Zugangs-Mail benachrichtigt.
        groupId:
          type: integer
          nullable: true
          description: >-
            Optionale Gruppen-Adressierung (#1521): die Aufgabe wird an alle Mitglieder der
            Gruppe gerichtet und entsteht ohne Eigentümer. Der Aufrufer muss Mitglied der
            Gruppe sein (sonst 403); zusammen mit `userId` ist das Feld ungültig (400).
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        estimatedEffort:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
          default: 0.5
        actualEffort:
          type: number
          format: float
          minimum: 0
          nullable: true
        description:
          type: string
          nullable: true
        address:
          type: string
          maxLength: 255
          nullable: true
          description: >-
            Adresse des Aufgabenorts, über die Adresssuche (Forward-Geocoding,
            OpenStreetMap Nominatim) ausgewählt. Fehlt das Feld, bleibt der Task
            ohne Ortsbezug.
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          nullable: true
          description: >-
            Breitengrad des Aufgabenorts (#1066). Wird nur bei Auswahl eines
            Adress-Vorschlags gesetzt; `null`, wenn kein Koordinaten-Bezug besteht.
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          nullable: true
          description: >-
            Längengrad des Aufgabenorts (#1066), analog `latitude`.
        deadline:
          type: string
          format: date-time
          nullable: true
        autoDeleteAfterDeadline:
          type: boolean
          description: >-
            Wenn `true`, wird die Aufgabe 3 Tage nach einer verpassten Deadline
            automatisch gelöscht (nur wenn nicht erledigt, #523).
        pillars:
          type: array
          description: >-
            Säulen, auf die der Task einzahlt (0..n). Wird das Feld weggelassen,
            bleibt der Task ohne Säulen. Bei mindestens einer Säule muss die Summe
            aller `share` 100 ergeben.
          items:
            $ref: '#/components/schemas/TaskPillarContributionInput'
        checklist:
          type: array
          description: >-
            Abhakbare Checkliste des Tasks (max. 20 Einträge, #531). Fehlt das Feld,
            bleibt die Liste leer.
          items:
            $ref: '#/components/schemas/ChecklistItem'
        categoryId:
          type: integer
          nullable: true
          description: >-
            Optionale Kategorie der Aufgabe. Muss eine Kategorie des Eigentümer-Kontos
            sein, sonst 400; `null` oder weggelassen heißt „ohne Kategorie".
        careTemplateKey:
          type: string
          description: >-
            Optionaler Stammdaten-Schlüssel der Fürsorge-Vorlage, aus der die Aufgabe entsteht
            (#1798): zählt anonym als Übernahme; die Aufgabe selbst bleibt unverändert.
    TaskUpdate:
      type: object
      description: Alle Felder optional — gesetzte Felder werden aktualisiert.
      properties:
        title:
          type: string
        userId:
          type: integer
          description: >-
            Optionaler Empfänger (#1252): übergibt die Aufgabe an das benannte
            Gruppenmitglied (Eigentümerwechsel, Aufrufer wird Ersteller). Der
            Aufrufer muss mit dem Empfänger eine Gruppe teilen (sonst 403); ohne
            das Feld oder mit der eigenen ID bleibt der Eigentümer unverändert.
            Übergabe schreibt nur die Eigentumsfelder; Abhängigkeiten, die der
            Empfänger nicht sehen kann, lehnen die Übergabe mit 409 ab.
        recipientEmail:
          type: string
          description: >-
            Optionaler Empfänger per E-Mail statt userId (#1983, AK5): Ein bekanntes
            Konto wird wie userId behandelt (Shared-Group-Prüfung), eine unbekannte
            Adresse wird zum Konto angelegt, mit Herkunft delegation freigeschaltet
            und per Zugangs-Mail benachrichtigt.
        status:
          $ref: '#/components/schemas/TaskStatus'
        completedAt:
          type: string
          format: date-time
          description: >-
            Erledigt-Zeitpunkt beim Übergang auf `Done` (Standard: jetzt). Wer eine überfällige
            Aufgabe pünktlich erledigt hat, schickt hier die Deadline und bekommt die vollen
            Punkte. Darf nicht in der Zukunft liegen (sonst `400`); ohne Übergang auf `Done`
            wirkungslos.
        priority:
          type: integer
          minimum: 1
          maximum: 5
        estimatedEffort:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
        actualEffort:
          type: number
          format: float
          minimum: 0
          nullable: true
        description:
          type: string
          nullable: true
        address:
          type: string
          maxLength: 255
          nullable: true
          description: >-
            Adresse des Aufgabenorts. Fehlt das Feld, bleibt sie unverändert;
            `null` entfernt einen bestehenden Ortsbezug.
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          nullable: true
          description: >-
            Breitengrad des Aufgabenorts (#1066). `null` entfernt den Koordinaten-Bezug;
            fehlt das Feld, bleibt er unverändert.
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          nullable: true
          description: Längengrad des Aufgabenorts (#1066), analog `latitude`.
        deadline:
          type: string
          format: date-time
          nullable: true
        autoDeleteAfterDeadline:
          type: boolean
          description: >-
            Wenn `true`, wird die Aufgabe 3 Tage nach einer verpassten Deadline
            automatisch gelöscht (nur wenn nicht erledigt, #523).
        pinned:
          type: boolean
          description: >-
            Pinnt die Aufgabe an (`true`) oder wieder ab (`false`, #1582). Der
            Server leitet `pinnedAt` daraus ab — beim Anpinnen der aktuelle
            Zeitpunkt, beim Abpinnen `null`; `pinnedAt` ist nicht direkt setzbar.
        pillars:
          type: array
          description: >-
            Ersetzt die Säulen-Beiträge des Tasks vollständig. Eine leere Liste
            entfernt alle Beiträge; bei mindestens einer Säule muss die Summe
            aller `share` 100 ergeben. Fehlt das Feld, bleiben die Beiträge unverändert.
          items:
            $ref: '#/components/schemas/TaskPillarContributionInput'
        checklist:
          type: array
          description: >-
            Ersetzt die Checklisten-Einträge vollständig (max. 20, #531). Eine leere
            Liste leert die Checkliste; fehlt das Feld, bleibt sie unverändert.
          items:
            $ref: '#/components/schemas/ChecklistItem'
        categoryId:
          type: integer
          nullable: true
          description: >-
            Setzt die Kategorie (muss dem Eigentümer-Konto gehören) oder entfernt sie
            mit `null`. Fehlt das Feld, bleibt die Zuordnung unverändert.
    DependencyInput:
      type: object
      required:
        - dependingTaskId
      properties:
        dependingTaskId:
          type: integer
          description: >-
            ID des Tasks, von dem `{id}` abhängt (Vorgänger/Prerequisite).
            Entspricht der Spalte `dependingTaskId` im Join `dependencies`.
        weight:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
          default: 1
          description: Gewicht der Abhängigkeit (0,1–1)
    TaskPillarContribution:
      type: object
      description: >-
        Beitrag eines Tasks auf eine Lebensbalance-Säule (n:m). `share` verteilt
        100 % über die Säulen eines Tasks; `confidence` ist die Konfidenz je Beitrag.
      required:
        - pillarId
        - share
        - confidence
      properties:
        pillarId:
          type: integer
          minimum: 1
          description: ID der Säule, auf die der Task einzahlt
        share:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Investitions-Anteil in % (Summe über die Säulen eines Tasks = 100)
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 100
          default: 100
          description: Konfidenz in % (0–100), wie sicher der Beitrag auf die Säule einzahlt
    TaskPillarContributionInput:
      type: object
      description: >-
        Eingabe eines Säulen-Beitrags. `confidence` ist optional (Default 100 %).
      required:
        - pillarId
        - share
      properties:
        pillarId:
          type: integer
          minimum: 1
          description: ID der Säule, auf die der Task einzahlt
        share:
          type: number
          format: float
          minimum: 5
          maximum: 80
          description: >-
            Investitions-Anteil in % — jeder Anteil zwischen 5 und 80, Summe 100
            über alle Säulen des Kontos (#2077)
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 100
          default: 100
          description: Konfidenz in % (0–100); fehlt der Wert, gilt 100 %
    ChecklistItem:
      type: object
      description: >-
        Eintrag einer abhakbaren Checkliste eines Tasks (#531). Der Titel muss
        nicht-leer (1–255 Zeichen) sein; `completed` ist optional (Default `false`).
      required:
        - id
        - title
        - completed
      properties:
        id:
          type: string
          format: uuid
          description: Stabile UUID des Eintrags.
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Bezeichnung des Eintrags (nach Trim nicht-leer).
        completed:
          type: boolean
          default: false
          description: Erledigt-Status (Default `false`).
    TaskTreeNode:
      type: object
      required:
        - id
        - title
        - priority
        - estimatedEffort
        - totalEstimatedEffort
        - value
        - status
        - dependents
      properties:
        id:
          type: integer
        title:
          type: string
        priority:
          type: integer
        estimatedEffort:
          type: number
          format: float
        totalEstimatedEffort:
          type: number
          format: float
          description: Gesamtaufwand inkl. aller transitiven Abhängigkeiten
        value:
          type: number
          format: float
          description: Wertbeitrag des Tasks
        status:
          $ref: '#/components/schemas/TaskStatus'
        progress:
          type: object
          nullable: true
          description: >-
            Fortschritt (erledigt/gesamt) inkl. des Knotens selbst und aller transitiven
            Unteraufgaben, gezählt über die UNGEFILTERTE Abhängigkeitskette — also auch über
            erledigte Unteraufgaben, die aus `dependents` ausgeblendet sind (#392). Dadurch bleibt
            die Fortschrittsanzeige (#241) korrekt, obwohl erledigte Unteraufgaben nicht mehr im
            Baum erscheinen. `null`, wenn der Task keine Unteraufgaben hat.
          required:
            - done
            - total
          properties:
            done:
              type: integer
            total:
              type: integer
        categoryId:
          type: integer
          nullable: true
          description: >-
            Thematische Kategorie der Aufgabe (0..1, siehe Schema `Category`) — trägt den
            Kategorie-Filter der Aufgabenliste. `null`, wenn keine zugeordnet ist.
        weight:
          type: number
          format: float
          nullable: true
          description: >-
            Gewicht (0,1–1) der Kante von der Elternaufgabe zu diesem Knoten — `null` bei
            Wurzelknoten, die keine Vorgänger eines anderen Tasks sind (#1429).
        dependents:
          type: array
          items:
            $ref: '#/components/schemas/TaskTreeNode'
    TaskGraph:
      type: object
      description: >-
        Der Aufgabengraph als flache Knotenliste plus Kantenliste. Jede aktive Aufgabe
        kommt genau einmal vor, auch wenn sie mehreren übergeordneten Aufgaben zuarbeitet.
        Kanten stehen nur zwischen Knoten dieser Liste — es zeigt nie eine Kante ins Leere.
      required:
        - nodes
        - edges
      properties:
        nodes:
          type: array
          description: Aktive Aufgaben, absteigend nach Wertbeitrag sortiert.
          items:
            $ref: '#/components/schemas/TaskGraphNode'
        edges:
          type: array
          description: Gewichtete Abhängigkeitskanten zwischen den Knoten.
          items:
            $ref: '#/components/schemas/TaskGraphEdge'
    TaskGraphNode:
      type: object
      description: >-
        Ein Knoten des Aufgabengraphen. Feldgleich zu `TaskTreeNode`, aber ohne
        `dependents` — die Struktur steckt in `TaskGraph.edges`, nicht im Knoten.
      required:
        - id
        - title
        - priority
        - estimatedEffort
        - totalEstimatedEffort
        - value
        - status
      properties:
        id:
          type: integer
        title:
          type: string
        priority:
          type: integer
        estimatedEffort:
          type: number
          format: float
        totalEstimatedEffort:
          type: number
          format: float
          description: Gesamtaufwand inkl. aller transitiven aktiven Unteraufgaben
        value:
          type: number
          format: float
          description: Wertbeitrag des Tasks
        status:
          $ref: '#/components/schemas/TaskStatus'
        progress:
          type: object
          nullable: true
          description: >-
            Fortschritt (erledigt/gesamt) inkl. des Knotens selbst und aller transitiven
            Unteraufgaben, gezählt über die UNGEFILTERTE Abhängigkeitskette — also auch über
            erledigte Unteraufgaben, die als Knoten nicht mehr erscheinen (#392 ∩ #241).
            `null`, wenn der Task keine Unteraufgaben hat.
          required:
            - done
            - total
          properties:
            done:
              type: integer
            total:
              type: integer
    TaskGraphEdge:
      type: object
      description: >-
        Eine gerichtete, gewichtete Abhängigkeitskante. `from` ist die Unteraufgabe
        (der Vorgänger, `dependencies.dependingTaskId`), `to` die übergeordnete Aufgabe
        (`dependencies.dependentTaskId`). Gelesen: „`from` ermöglicht `to`" bzw. „`to`
        kann erst, wenn `from` fertig ist". Die Richtung ist hier bewusst explizit
        benannt, weil das Feld `dependents` in `TaskTreeNode` historisch die *Kinder*
        meint und nicht die Dependents im Graph-Sinn (#336).
      required:
        - from
        - to
        - weight
      properties:
        from:
          type: integer
          description: ID der Unteraufgabe (Vorgänger)
        to:
          type: integer
          description: ID der übergeordneten Aufgabe
        weight:
          type: number
          format: float
          description: Kantengewicht (0,1–1), wie beim Anlegen der Abhängigkeit gesetzt
    Pillar:
      type: object
      description: Eine der fünf festen Lebensbalance-Säulen (globale Stammdaten, für alle Nutzer identisch).
      required:
        - id
        - name
        - description
        - weight
      properties:
        id:
          type: integer
        key:
          type: string
          nullable: true
          description: >-
            Stabile Kennung der Standard-Säule (z. B. koerper, sinn); null für eigene Säulen.
            Schlüssel für die Übersetzung `pillars.<key>.description`.
        name:
          type: string
          description: 'Name der Säule (z. B. Körper, Beziehungen, Sinn, Mentale Gesundheit, Wirksamkeit)'
        description:
          type: string
          description: >-
            Kurzbeschreibung der Säule (zentrale Stammdaten, für alle Nutzer identisch, nicht
            nutzereditierbar). Wird im Einstellungs-Menü angezeigt.
        weight:
          type: number
          format: float
          minimum: 0
          default: 20
          description: Prozentualer Anteil der Säule (alle Säulen summieren sich auf 100)
    Category:
      type: object
      description: >-
        Thematische Kategorie einer Aufgabe/Serie — die flache Ordnungsebene neben den
        Lebensbalance-Säulen. Höchstens eine je Aufgabe, ohne Anteil und ohne Wirkung
        auf Wert, Score oder Balance; sie dient dem Gruppieren und Filtern.
        Nutzer-eigene Stammdaten, Name pro Nutzer eindeutig.
      required:
        - id
        - name
        - color
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 40
          description: 'Name der Kategorie (nicht leer, z. B. Hausbau, Steuer, Verein)'
        color:
          $ref: '#/components/schemas/CategoryColor'
    CategoryColor:
      type: string
      description: >-
        Badge-Farbe aus der festen Palette. Bewusst keine freie Farbwahl: Die Werte
        sind auf die Design-Sprache abgestimmt, die Textfarbe rechnet `KolBadge` selbst
        aus. Spiegel von `server/src/models/categoryColors.ts`.
      enum:
        - '#b42318'
        - '#b54708'
        - '#8a6100'
        - '#1a7f37'
        - '#0e7490'
        - '#1064d0'
        - '#6941c6'
        - '#475467'
    CategoryCreate:
      type: object
      description: Eingabe zum Anlegen einer neuen Kategorie.
      required:
        - name
        - color
      properties:
        name:
          type: string
          maxLength: 40
          description: Name der Kategorie (nicht leer)
        color:
          $ref: '#/components/schemas/CategoryColor'
    CategoryUpdate:
      type: object
      description: Eingabe zum teilweisen Aktualisieren einer Kategorie. Mindestens ein Feld muss gesetzt sein.
      properties:
        name:
          type: string
          maxLength: 40
          description: Neuer Name der Kategorie (nicht leer, falls gesetzt)
        color:
          $ref: '#/components/schemas/CategoryColor'
    PillarWeightsInput:
      type: object
      description: >-
        Neue 100 %-Verteilung über die Säulen. `weights` muss genau alle
        existierenden Säulen abdecken; die Summe aller `weight` muss 100 ergeben.
      required:
        - weights
      properties:
        weights:
          type: array
          minItems: 1
          description: Gewicht je Säule (Summe = 100).
          items:
            type: object
            required:
              - id
              - weight
            properties:
              id:
                type: integer
                minimum: 1
                description: ID der Säule
              weight:
                type: number
                format: float
                minimum: 0
                description: Prozentualer Anteil der Säule
    ActivityAdvisorInput:
      type: object
      description: >-
        Eingabe für den Aktivitäten-Berater. Die optionale Frage (z. B. „Was kann
        ich am Wochenende für mich tun?") lenkt die Vorschläge; ohne Frage schlägt
        der Berater Aktivitäten über alle Säulen hinweg vor. Optional kann der Client
        die aktuelle Säulen-Verteilung (Soll vs. Ist, wie im Dashboard „Meine Themen")
        mitschicken; der Berater priorisiert dann die am stärksten unterversorgten
        (schwächsten) Säulen.
      properties:
        question:
          type: string
          maxLength: 500
          description: Optionale Frage bzw. Situationsbeschreibung des Nutzers
        distribution:
          type: array
          description: >-
            Aktuelle Säulen-Verteilung aus dem Client (Dashboard „Meine Themen"): je
            Säule ihr Soll-Anteil (`weight`, 0–100 %) und ihr Ist-Anteil
            (`actualShare`, 0–1). Der Berater richtet die Vorschläge bevorzugt auf die
            am stärksten unterversorgten Säulen aus.
          items:
            $ref: '#/components/schemas/PillarDistributionEntry'
    ActivityAdvice:
      type: object
      description: >-
        Ein Vorschlag des Aktivitäten-Beraters — eine konkrete Aktivität samt der
        Säulen, auf die sie einzahlen würde, und einer kurzen Begründung.
      required:
        - activity
        - reason
        - pillarIds
      properties:
        activity:
          type: string
          description: Kurzer, konkreter Name der vorgeschlagenen Aktivität
        reason:
          type: string
          description: Kurze Begründung, warum die Aktivität auf die genannten Säulen einzahlt
        pillarIds:
          type: array
          description: IDs der Säulen, auf die die Aktivität einzahlen würde
          items:
            type: integer
            minimum: 1
    ActivityAdvisorResult:
      type: object
      description: Ergebnis des Aktivitäten-Beraters.
      required:
        - advice
      properties:
        advice:
          type: array
          description: Vorgeschlagene Aktivitäten samt Säulen-Zuordnung
          items:
            $ref: '#/components/schemas/ActivityAdvice'
        fairUse:
          type: string
          enum: [throttled]
          description: >-
            Nur gesetzt, wenn die Anfrage über dem internen Monatsbudget lag (#1783, Fair Use):
            die nächste KI-Anfrage ist erst nach dem Drossel-Intervall möglich.
    PillarDistributionEntry:
      type: object
      description: >-
        Verteilungs-Eintrag einer Säule aus dem Client (Dashboard „Meine Themen"):
        Soll-Anteil (`weight`) und Ist-Anteil (`actualShare`).
      required:
        - pillarId
        - weight
        - actualShare
      properties:
        pillarId:
          type: integer
          minimum: 1
          description: ID der Säule
        weight:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Soll-Anteil der Säule in Prozent (0–100)
        actualShare:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Ist-Anteil der Säule (0–1), wie im Client berechnet
    SuggestPillarsInput:
      type: object
      description: Eingabe für die Säulen-Klassifikation einer Aufgabe.
      required:
        - title
      properties:
        title:
          type: string
          description: Titel der Aufgabe (Pflichtfeld, nicht leer)
        description:
          type: string
          description: Optionale ausführliche Beschreibung der Aufgabe
        context:
          type: string
          description: Optionaler Kontext, z. B. zu abhängigen Aufgaben
    PillarSuggestion:
      type: object
      description: Eine vorgeschlagene Säulen-Einzahlung mit Konfidenz und — seit #2076 — Anteil.
      required:
        - pillarId
        - confidence
      properties:
        pillarId:
          type: integer
          minimum: 1
          description: ID der Säule, auf die die Aufgabe einzahlt
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Konfidenz in % (0–100), dass die Aufgabe auf diese Säule einzahlt
        share:
          type: integer
          minimum: 5
          maximum: 80
          description: Anteil der Aufgabe in % (5–80, Summe über alle Säulen 100); optional — Alt-Antworten und Korrekturen ohne Anteil bleiben gültig
    SuggestPillarsResult:
      type: object
      description: Ergebnis der Säulen-Klassifikation.
      required:
        - suggestions
      properties:
        suggestions:
          type: array
          description: Vorgeschlagene Säulen-Einzahlungen, nach pillarId sortiert
          items:
            $ref: '#/components/schemas/PillarSuggestion'
        fairUse:
          type: string
          enum: [throttled]
          description: >-
            Nur gesetzt, wenn die Anfrage über dem internen Monatsbudget lag (#1783, Fair Use):
            die nächste KI-Anfrage ist erst nach dem Drossel-Intervall möglich.
    LektoratInput:
      type: object
      description: Eingabe des Lektorats (#680) — Text und optionale Maximallänge.
      required:
        - text
      properties:
        text:
          type: string
          description: Zu lektorierender Text (nicht leer)
        maxLength:
          type: integer
          minimum: 1
          description: Optionale Maximallänge des lektorierten Textes in Zeichen
    LektoratResult:
      type: object
      description: Ergebnis des Lektorats.
      required:
        - text
      properties:
        text:
          type: string
          description: Der lektorierte (und bei gesetztem `maxLength` gekürzte) Text
        fairUse:
          type: string
          enum: [throttled]
          description: >-
            Nur gesetzt, wenn die Anfrage über dem internen Monatsbudget lag (#1783, Fair Use):
            die nächste KI-Anfrage ist erst nach dem Drossel-Intervall möglich.
    TaskAiDraft:
      type: object
      description: Ergebnis des KI-Entwurfs (#2350).
      required:
        - aiDraft
      properties:
        aiDraft:
          type: string
          description: Der gespeicherte Entwurf.
        fairUse:
          type: string
          enum: [throttled]
          description: >-
            Nur gesetzt, wenn die Anfrage über dem internen Monatsbudget lag (#1783, Fair Use):
            die nächste KI-Anfrage ist erst nach dem Drossel-Intervall möglich.
    ParseTaskInput:
      type: object
      description: Eingabe für die Task-Schnellerfassung — frei formulierter Text (#235).
      required:
        - text
      properties:
        text:
          type: string
          maxLength: 2000
          description: Frei formulierter Text, aus dem die Task-Felder extrahiert werden (nicht leer)
    SuggestInitialTasksInput:
      type: object
      description: Eingabe für die Erststart-Vorschläge — freie Beschreibung der aktuellen Lage (#2068).
      required:
        - text
      properties:
        text:
          type: string
          maxLength: 2000
          description: Freitext, aus dem die Aufgaben-Vorschläge erzeugt werden (nicht leer)
    TaskImportMapping:
      type: object
      description: >-
        Spaltenzuordnung je Zielfeld (#1969): Name der CSV-Spalte aus der
        Header-Zeile. Ohne `mapping` gilt die Todoist-Auto-Erkennung.
      properties:
        title:
          type: string
          description: CSV-Spalte für den Aufgabentitel
        deadline:
          type: string
          description: CSV-Spalte für die Frist (ISO-Datum JJJJ-MM-TT)
        priority:
          type: string
          description: CSV-Spalte für die Priorität
        category:
          type: string
          description: CSV-Spalte für die Kategorie (Name-Match gegen Bestand)
        pillar:
          type: string
          description: CSV-Spalte für die Hauptsäule (Name-Match gegen Bestand)
    TaskImportInput:
      type: object
      description: Eingabe des CSV-Imports — Dateiinhalt als String, clientseitig gelesen (#1969).
      required:
        - csv
      properties:
        csv:
          type: string
          description: Kompletter CSV-Inhalt (RFC 4180, BOM/CRLF-tolerant, max. 10 MB)
        mapping:
          $ref: '#/components/schemas/TaskImportMapping'
    TaskImportSample:
      type: object
      description: Beispiel-Zeile der Vorschau (max. 5, je übernehmbarer Zeile).
      required:
        - row
        - title
        - deadline
        - priority
      properties:
        row:
          type: integer
          minimum: 1
          description: 1-basierte Datenzeilennummer (erste Zeile nach dem Header = 1)
        title:
          type: string
          description: Aufgabentitel der Zeile
        deadline:
          type: string
          format: date-time
          nullable: true
          description: Frist als UTC-Mitternacht oder null
        priority:
          type: integer
          minimum: 1
          maximum: 5
          description: Intern skalierte Priorität (Todoist 4 = höchste → 5)
    TaskImportRowError:
      type: object
      description: Je unlesbarer Zeile Nummer und Grund (Import bricht nicht ab).
      required:
        - row
        - reason
      properties:
        row:
          type: integer
          minimum: 1
          description: 1-basierte Datenzeilennummer
        reason:
          type: string
          description: Verständlicher Grund, warum die Zeile nicht übernommen wird
    TaskImportUnmapped:
      type: object
      description: Kategorie-/Säulenwert ohne Bestandstreffer — bleibt ohne Zuordnung.
      required:
        - row
        - field
        - value
      properties:
        row:
          type: integer
          minimum: 1
          description: 1-basierte Datenzeilennummer
        field:
          type: string
          enum:
            - category
            - pillar
          description: Zielfeld, dessen CSV-Wert keinen Bestandstreffer hatte
        value:
          type: string
          description: CSV-Wert ohne Zuordnung
    TemplatePreview:
      type: object
      description: Vorschau einer Vorlage (#1993) — legt nichts an.
      required: [slug, title, taskCount, dependencyCount, steps]
      properties:
        slug:
          type: string
        title:
          type: string
        taskCount:
          type: integer
          description: Anzahl der Aufgaben, die die Übernahme anlegt
        dependencyCount:
          type: integer
          description: Anzahl der Abhängigkeiten, die die Übernahme anlegt
        steps:
          type: array
          items:
            type: object
            required: [id, title, after]
            properties:
              id:
                type: string
                description: Stabile Kennung innerhalb der Vorlage
              title:
                type: string
              after:
                type: array
                description: Kennungen der Vorgänger-Schritte
                items:
                  type: string
    TemplateApplyResult:
      type: object
      description: Ergebnis der Vorlagen-Übernahme (#1993).
      required: [taskIds]
      properties:
        taskIds:
          type: array
          description: IDs der neu angelegten Aufgaben in Schritt-Reihenfolge
          items:
            type: integer
    TaskImportPreview:
      type: object
      description: Ergebnis der Import-Vorschau (#1969) — legt nichts an.
      required:
        - total
        - valid
        - skippedNonTask
        - samples
        - errors
        - unmapped
        - columns
      properties:
        total:
          type: integer
          description: Anzahl aller Datenzeilen
        valid:
          type: integer
          description: Anzahl übernehmbarer Aufgabenzeilen
        skippedNonTask:
          type: integer
          description: Zeilen mit TYPE != task (Todoist-Export)
        samples:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/TaskImportSample'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/TaskImportRowError'
        unmapped:
          type: array
          items:
            $ref: '#/components/schemas/TaskImportUnmapped'
        columns:
          type: array
          items:
            type: string
          description: Spaltennamen der Header-Zeile (Angebot für das Spalten-Mapping)
    TaskImportResult:
      type: object
      description: Ergebnis des Import-Aufrufs (#1969).
      required:
        - created
        - skippedNonTask
        - errors
      properties:
        created:
          type: integer
          description: Anzahl angelegter Aufgaben
        skippedNonTask:
          type: integer
          description: Zeilen mit TYPE != task (übersprungen)
        errors:
          type: array
          items:
            $ref: '#/components/schemas/TaskImportRowError'
    TaskImportAnalysis:
      type: object
      description: >-
        Bericht der Import-Analyse (#1988): Grundform (Anzahl, Zeilen ohne
        Frist, exakte Dubletten) läuft ohne KI-Kontingent;
        Abhängigkeits-Vorschläge kommen vom aktiven LLM-Provider und bleiben
        bei Fehler/Erschöpfung leer.
      required:
        - total
        - missingDeadlines
        - duplicates
        - suggestions
      properties:
        total:
          type: integer
          description: Anzahl übernehmbarer Zeilen der CSV
        missingDeadlines:
          type: array
          description: Übernommene Aufgaben ohne Frist
          items:
            type: object
            required:
              - id
              - title
            properties:
              id:
                type: integer
                description: ID der angelegten Aufgabe (0 ohne Bestands-Match zum Analyse-Zeitpunkt)
              title:
                type: string
                description: Aufgabentitel
        duplicates:
          type: array
          description: >-
            Exakte Dubletten (identisch normalisierter Titel, trim + lowercase)
            mit Beteiligung importierter Titel
          items:
            type: object
            required:
              - keepTaskId
              - duplicateTaskId
              - title
              - reason
            properties:
              keepTaskId:
                type: integer
                description: ID des verbleibenden Tasks (ältester der Titel-Gruppe)
              duplicateTaskId:
                type: integer
                description: ID der entfernten Kopie
              title:
                type: string
                description: Titel der Dublette
              reason:
                type: string
                description: Verständliche Begründung des Treffers
        suggestions:
          type: array
          description: Abhängigkeits-Vermutungen (leer bei KI-Fehler/Erschöpfung)
          items:
            type: object
            required:
              - dependentTaskId
              - dependingTaskId
              - title
              - reason
            properties:
              dependentTaskId:
                type: integer
                description: ID der übergeordneten Aufgabe (Kante beginnt hier)
              dependingTaskId:
                type: integer
                description: ID des Vorgängers
              title:
                type: string
                description: Titel der übergeordneten Aufgabe
              reason:
                type: string
                description: Begründung der Vermutung
    TaskImportMergeInput:
      type: object
      description: Zusammenführen einer exakten Dublette (#1988).
      required:
        - keepTaskId
        - duplicateTaskId
      properties:
        keepTaskId:
          type: integer
          minimum: 1
          description: ID des verbleibenden Tasks
        duplicateTaskId:
          type: integer
          minimum: 1
          description: ID der entfernten Dublette
    TaskImportMergeResult:
      type: object
      description: Ergebnis des Merges — genau ein Task bleibt übrig.
      required:
        - keptTaskId
      properties:
        keptTaskId:
          type: integer
          description: ID des verbleibenden Tasks
    SuggestInitialTaskSuggestion:
      type: object
      description: Ein Aufgaben-Vorschlag für den Erststart mit Säulen-Bezug.
      required:
        - title
        - pillarId
      properties:
        title:
          type: string
          description: Kurzer, konkreter, sofort startbarer Aufgabentitel (nicht leer)
        pillarId:
          type: integer
          minimum: 1
          description: ID einer Säule des Nutzers, zu der der Vorschlag gehört
        dependsOn:
          type: integer
          minimum: 0
          description: >-
            0-basierter Index eines anderen Vorschlags derselben Antwort, den dieser
            Vorschlag logisch voraussetzt
    SuggestInitialTasksResponse:
      type: object
      description: Bereinigte Erststart-Vorschläge (nur gültige Einträge, ursprüngliche Reihenfolge).
      required:
        - suggestions
      properties:
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/SuggestInitialTaskSuggestion'
    ParsedTask:
      type: object
      description: >-
        Aus einem Freitext extrahierte, strukturierte Task-Felder (#235). Nur `title`
        ist garantiert gesetzt; die restlichen Felder liefert das Modell nur, wenn der
        Text sie hergibt.
      required:
        - title
      properties:
        title:
          type: string
          description: Kurzer, prägnanter Titel der Aufgabe (Pflichtfeld, nicht leer)
        description:
          type: string
          description: Optionale ausführliche Beschreibung der Aufgabe
        priority:
          type: integer
          minimum: 1
          maximum: 5
          description: Optionale Priorität 1–5 (1 = niedrig, 5 = hoch)
        estimatedEffort:
          type: number
          format: float
          minimum: 0
          description: Optionaler geschätzter Aufwand in Personentagen (z. B. 0.25 ≈ 2 h)
        deadline:
          type: string
          format: date-time
          description: Optionale Deadline als ISO-8601-Datum/Zeit-String
        isSeries:
          type: boolean
          description: >-
            Optionale Serien-Erkennung (#1310): `true`, wenn der Text einen wiederkehrenden
            Termin beschreibt — das Formular startet dann im Serien-Modus.
        address:
          type: string
          description: >-
            Optionale Ortsangabe aus dem Freitext (#1310) als Adresstext; reiner Freitext,
            ohne Koordinaten (kein Geocoding im Parsing).
        checklist:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: >-
            Optionale, im Freitext aufgezählte Einzelpunkte (#1310) — je Eintrag ein
            Checklisten-Eintrag im Formular.
        categoryId:
          type: integer
          description: >-
            Optionale Kategorie: ID einer Kategorie des Nutzers, wenn der Text thematisch
            eindeutig zu einer passt. Fehlt, wenn keine passt oder keine angelegt sind.
        fairUse:
          type: string
          enum: [throttled]
          description: >-
            Nur gesetzt, wenn die Anfrage über dem internen Monatsbudget lag (#1783, Fair Use):
            die nächste KI-Anfrage ist erst nach dem Drossel-Intervall möglich.
    ParsedSearch:
      type: object
      description: >-
        Aus einer frei formulierten Suchanfrage extrahierter Filter. Beide Felder sind
        optional: `text` fehlt, wenn die Anfrage nur eine Kategorie nennt, `categoryId`
        fehlt, wenn keine Kategorie gemeint ist.
      properties:
        text:
          type: string
          description: Reiner Suchbegriff ohne den Kategorie-Anteil der Anfrage
        categoryId:
          type: integer
          description: ID der gemeinten Kategorie des Nutzers
        fairUse:
          type: string
          enum: [throttled]
          description: >-
            Nur gesetzt, wenn die Anfrage über dem internen Monatsbudget lag (#1783, Fair Use):
            die nächste KI-Anfrage ist erst nach dem Drossel-Intervall möglich.
    PillarFeedbackInput:
      type: object
      description: >-
        Eine vom Nutzer bestätigte/korrigierte Säulen-Zuordnung, die als Lern-Sample
        für nachfolgende Vorschläge gespeichert wird (Feedback-Loop, #45).
      required:
        - title
        - pillars
      properties:
        title:
          type: string
          description: Titel der Aufgabe (Pflichtfeld, nicht leer)
        description:
          type: string
          description: Optionale Beschreibung der Aufgabe
        pillars:
          type: array
          description: Die final vom Nutzer gewählten Säulen samt Konfidenz
          items:
            $ref: '#/components/schemas/PillarSuggestion'
    PillarFeedbackResult:
      type: object
      description: Ergebnis des Speicherns eines Feedback-Samples.
      required:
        - id
      properties:
        id:
          type: integer
          minimum: 1
          description: ID des gespeicherten Feedback-Samples
    ScoreEntry:
      type: object
      required:
        - taskId
        - punkte
        - pünktlich
        - zeitpunkt
      properties:
        taskId:
          type: integer
          description: ID des erledigten Tasks (genau ein Eintrag je Task).
        punkte:
          type: number
          description: Vergebene Punkte (Basis `estimatedEffort × priority`, bei Verspätung reduziert).
        pünktlich:
          type: boolean
          description: Ob der Task vor/zur Deadline (oder ganz ohne Deadline) erledigt wurde.
        zeitpunkt:
          type: string
          format: date-time
          description: Erledigungszeitpunkt.
    PillarScore:
      type: object
      required:
        - pillarId
        - punkte
      properties:
        pillarId:
          type: integer
          description: ID der Säule.
        punkte:
          type: number
          description: Summe der anteilig (nach `share`) auf diese Säule entfallenden Punkte.
    Streak:
      type: object
      required:
        - aktuell
        - best
        - letzterTag
        - wochenAusgewogen
      properties:
        aktuell:
          type: integer
          description: >-
            Kalendertage in Folge mit mindestens einer Erledigung bis heute (heute darf noch offen
            sein). Ein Ruhetag je Kalenderwoche (Mo–So) hält die Folge, zählt aber nicht mit (#1971).
            `0`, sobald der Streak gerissen ist.
        best:
          type: integer
          description: Längste je erreichte Tagesfolge (persönliche Bestmarke).
        letzterTag:
          type: string
          nullable: true
          description: Jüngster Kalendertag mit einer Erledigung (`YYYY-MM-DD`), oder `null`.
        wochenAusgewogen:
          type: integer
          description: >-
            Kalenderwochen (Mo–So) in Folge, in denen jede der drei höchstgewichteten Säulen
            mindestens eine Erledigung hat (#1971). Die laufende Woche zählt, sobald sie ausgewogen
            ist, bricht die Folge aber nicht, solange sie offen ist.
    Milestone:
      type: object
      required:
        - schluessel
        - typ
        - schwelle
        - erreicht
      properties:
        schluessel:
          type: string
          description: Eindeutiger Bezeichner der Stufe (Rendering-Key im Frontend).
        typ:
          type: string
          enum:
            - streak
            - punkte
          description: Ob die Stufe eine Streak- oder eine Punkte-Schwelle prüft.
        schwelle:
          type: number
          description: Schwellenwert der Stufe (Streak-Tage bzw. Punkte).
        erreicht:
          type: boolean
          description: >-
            Ob die Schwelle erreicht ist. Einmal erreicht bleibt der Stand erhalten (sticky),
            auch wenn die Punktesumme durch das Wieder-Oeffnen einer Aufgabe unter die Schwelle
            faellt.
    MissedTask:
      type: object
      required:
        - taskId
        - title
        - deadline
        - verpasstAm
      properties:
        taskId:
          type: integer
          description: ID der ursprünglichen (inzwischen gelöschten) Aufgabe.
        title:
          type: string
          description: Titel der Aufgabe zum Zeitpunkt der Löschung.
        deadline:
          type: string
          format: date-time
          description: Deadline der Aufgabe zum Zeitpunkt der Löschung.
        verpasstAm:
          type: string
          format: date-time
          description: Zeitpunkt, zu dem der Auto-Delete-Cron die Aufgabe gelöscht hat.
    MissedTasksSummary:
      type: object
      required:
        - anzahl
        - eintraege
      properties:
        anzahl:
          type: integer
          description: Gesamtzahl der bislang vom Auto-Delete-Cron gelöschten Aufgaben des Nutzers.
        eintraege:
          type: array
          description: Die jüngsten verpassten Aufgaben (neueste zuerst, maximal 20 Einträge).
          items:
            $ref: '#/components/schemas/MissedTask'
    PillarBalance:
      type: object
      required:
        - id
        - name
        - punkte
        - gewichtung
      properties:
        id:
          type: integer
          description: ID der Säule.
        name:
          type: string
          description: Name der Säule.
        punkte:
          type: number
          description: >-
            Roher (ungerundeter) Punktestand der Säule: der anteilig (nach `share`) auf sie
            entfallende erledigte Aufwand. Säulen ohne Beitrag erscheinen mit `0`.
        gewichtung:
          type: number
          description: Soll-Gewichtung der Säule (`Pillar.weight`, prozentualer Anteil).
    BalanceStatusPillar:
      allOf:
        - $ref: '#/components/schemas/PillarBalance'
        - type: object
          required:
            - trend
            - defizitaer
          properties:
            trend:
              type: string
              enum: [erholt, stabil, verschlechtert]
              description: >-
                Aufwandstrend der Säule: erledigter Aufwand der letzten 14 Tage gegenüber den 14 Tagen
                davor (`bewerteCareDefizit`, #1790).
            defizitaer:
              type: boolean
              description: Ob die Säule in den letzten 14 Tagen keinen erledigten Aufwand hat (Fürsorge-Defizit).
    BalanceStatus:
      type: object
      required:
        - fuellstandProzent
        - hatPunkte
        - saeulen
        - streak
        - meilensteine
      properties:
        fuellstandProzent:
          type: number
          description: >-
            Füllstand des Dashboard-Herzens in Prozent (`0`–`100`, auf eine Dezimalstelle
            gerundet), Kadenz-Modell (#1638): je Säule die Erfüllung des festen Soll-Rhythmus im
            28-Tage-Fenster (erledigte Aufgaben ÷ Rhythmus × 4 Wochen, höchstens 1). `100`, wenn
            alle Säulen im Rhythmus bedient sind; eine Säule ohne Erledigung im Fenster drückt den
            Wert, auch wenn sie früher viele Punkte gesammelt hat.
        hatPunkte:
          type: boolean
          description: >-
            Ob überhaupt Punkte vergeben sind. Unterscheidet „noch nichts erledigt" (`false`,
            Füllstand `0`) von „unausgewogen".
        saeulen:
          type: array
          description: Punktestand und Gewichtung je Säule des Nutzers, aufsteigend nach Säulen-ID.
          items:
            $ref: '#/components/schemas/BalanceStatusPillar'
        streak:
          $ref: '#/components/schemas/Streak'
        meilensteine:
          type: array
          description: Ausschließlich die **erreichten** Meilenstein-Stufen; ohne Erfolge eine leere Liste.
          items:
            $ref: '#/components/schemas/Milestone'
    BalanceHistoryEntry:
      type: object
      required:
        - tag
        - fuellstandProzent
        - hatPunkte
        - saeulen
      properties:
        tag:
          type: string
          description: Kalendertag dieses Eintrags (`YYYY-MM-DD`).
        fuellstandProzent:
          type: number
          description: >-
            Füllstand des Dashboard-Herzens zum Ende dieses Tages in Prozent, auf eine
            Dezimalstelle gerundet — dieselbe Rechnung wie `BalanceStatus.fuellstandProzent`.
        hatPunkte:
          type: boolean
          description: Ob bis zu diesem Tag überhaupt Punkte vergeben sind.
        saeulen:
          type: array
          description: Punktestand und Gewichtung je Säule zum Ende dieses Tages.
          items:
            $ref: '#/components/schemas/PillarBalance'
    MonthlyRecap:
      type: object
      description: >-
        Monatsrückblick (#1995): Säulen-Differenz des Monats, Streak zum Monatsende und die im
        Monat neu erreichten Meilensteine — ohne Aufgabeninhalte.
      required:
        - monat
        - saeulen
        - streak
        - meilensteine
      properties:
        monat:
          type: string
          description: Der angefragte Monat (`JJJJ-MM`).
        saeulen:
          type: array
          description: >-
            Punkte je Säule im Monatsfenster — Stand am Monatsende minus Stand zum
            Fenstereintritt (letzter Tag des Vormonats), eine Dezimalstelle.
          items:
            type: object
            required:
              - id
              - name
              - punkte
            properties:
              id:
                type: integer
                description: ID der Säule.
              name:
                type: string
                description: Anzeigename der Säule.
              punkte:
                type: number
                description: Punkte der Säule im Monat, eine Dezimalstelle.
        streak:
          type: integer
          description: Streak-Stand am Monatsende (Stichtag Monatsende in der Nutzerzeitzone).
        meilensteine:
          type: array
          description: Im Monat neu erreichte Meilensteine, aufsteigend nach Zeitpunkt.
          items:
            type: object
            required:
              - schluessel
              - zeitpunkt
            properties:
              schluessel:
                type: string
                description: Meilenstein-Schlüssel (`streak-<n>` / `punkte-<n>`).
              zeitpunkt:
                type: string
                format: date-time
                description: Wann die Stufe erreicht wurde (ISO-Zeitstempel).
    YearlyRecap:
      type: object
      description: >-
        Jahresrückblick (#1997): fünf Kennzahlen des Kalenderjahres — ohne Aufgabeninhalte.
      required:
        - jahr
        - erledigteAufgaben
        - stunden
        - laengsterStreak
        - staerksteSaeule
        - abgeschlosseneProjekte
      properties:
        jahr:
          type: integer
          description: Das angefragte Jahr.
        erledigteAufgaben:
          type: integer
          description: Im Jahr erledigte Aufgaben.
        stunden:
          type: number
          description: Summe von actualEffort (sonst estimatedEffort) der im Jahr erledigten Aufgaben, eine Dezimalstelle.
        laengsterStreak:
          type: integer
          description: Längste Tageskette, nur aus Erledigungen im Jahr.
        staerksteSaeule:
          type: object
          nullable: true
          description: Säule mit der größten Punkte-Differenz im Jahr; null ohne Punkte oder wenn alle Säulen gleich viele haben.
          required:
            - id
            - name
            - punkte
          properties:
            id:
              type: integer
              description: ID der Säule.
            name:
              type: string
              description: Anzeigename der Säule.
            punkte:
              type: number
              description: Punkte der Säule im Jahr, eine Dezimalstelle.
        abgeschlosseneProjekte:
          type: integer
          description: Im Jahr erledigte Oberaufgaben mit mindestens einer Unteraufgabe.
    CareVorschlag:
      type: object
      description: >-
        Konkreter Fürsorge-Vorschlag gegen ein Balance-Defizit (#1791): ein eigener offener
        Task (`typ: task`, dann ist `taskId` gesetzt) oder eine kuratierte Vorlage
        (`typ: vorlage`, dann ist `templateKey` gesetzt); für Plus und Pro zusätzlich höchstens ein
        KI-Vorschlag aus den eigenen bisherigen Aufgaben (`typ: ki`, #1804). Gehört zu genau einer Säule.
      required:
        - typ
        - titel
        - beschreibung
        - saeulenBeitraege
        - saeuleId
        - saeuleName
        - anlass
      properties:
        typ:
          type: string
          enum:
            - task
            - vorlage
            - ki
          description: Eigener Task (`task`), kuratierte Vorlage (`vorlage`) oder KI-Vorschlag (`ki`, nur Plus/Pro).
        anlass:
          type: string
          enum:
            - defizit
            - ueberlast
          description: >-
            Grund des Vorschlags (#1795): `defizit` gegen ein Balance-Defizit, `ueberlast` als
            Erholung (Pause, Körper, Mentale Gesundheit), wenn eine Säule überlastet ist.
            Erholungsvorschläge stehen vor den Defizit-Vorschlägen.
        titel:
          type: string
          description: Anzeigetitel des Vorschlags (in der angefragten Sprache).
        beschreibung:
          type: [string, 'null']
          description: Optionale Erläuterung (in der angefragten Sprache).
        saeulenBeitraege:
          type: array
          description: >-
            Säulen-Beiträge des Vorschlags — kuratierte Vorlagen zielen voll (share 100)
            auf ihre Säule, eigene Tasks bringen ihre Task-Beiträge mit.
          items:
            $ref: '#/components/schemas/CareSaeulenBeitrag'
        taskId:
          type: integer
          description: 'ID des eigenen Tasks — nur bei `typ: task`.'
        templateKey:
          type: string
          description: 'Stammdaten-Schlüssel der Vorlage — nur bei `typ: vorlage`.'
        saeuleId:
          type: integer
          description: ID der Säule, gegen deren Defizit der Vorschlag hilft.
        saeuleName:
          type: string
          description: Name dieser Säule.
    CareSaeulenBeitrag:
      type: object
      description: >-
        Säulen-Beitrag eines Fürsorge-Vorschlags (gegenüber `TaskPillarContribution` ohne
        `confidence` — die Konfidenz kennt nur der Task).
      required:
        - pillarId
        - share
      properties:
        pillarId:
          type: integer
          minimum: 1
          description: ID der Säule, auf die der Vorschlag einzahlt.
        share:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Investitions-Anteil in %.
    CareSuggestionDismissalCreate:
      type: object
      description: Ablehnung einer kuratierten Fürsorge-Vorlage über ihren Stammdaten-Schlüssel.
      required:
        - templateKey
      properties:
        templateKey:
          type: string
          minLength: 1
          description: Stammdaten-Schlüssel der abzulehnenden Vorlage.
    CareSuggestionRejectionCreate:
      type: object
      description: >-
        „Nicht jetzt" mit Grund (#1977) — genau ein Bezug (`taskId` oder `templateKey`) ist
        erforderlich; unbekannter `grund` oder fehlender/ doppelter Bezug antwortet 400.
      required:
        - grund
      properties:
        grund:
          type: string
          enum:
            - zu-gross
            - gerade-nicht-moeglich
            - keine-energie
            - warte-auf-jemanden
            - falsche-prioritaet
          description: Sprachunabhängiger Grund der Ablehnung (Anzeige-Texte aus den Locales).
        taskId:
          type: integer
          description: Eigene Aufgabe, die abgelehnt wird.
        templateKey:
          type: string
          description: Stammdaten-Schlüssel der abgelehnten Vorlage.
    CareSuggestionRejection:
      type: object
      description: Ein Eintrag der Ablehnungs-Historie (#1977).
      required:
        - grund
        - abgelehntAm
      properties:
        grund:
          type: string
          description: Sprachunabhängiger Grund der Ablehnung.
        abgelehntAm:
          type: string
          format: date-time
          description: Zeitpunkt der Entscheidung.
    SeriesRhythm:
      type: string
      enum:
        - daily
        - weekly
        - monthly
        - weekdays
        - weekend
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
        - none
      default: weekly
      description: >-
        Wiederholungsrhythmus eines Serien-Templates (striktes RRULE-Subset, #120).
        Wochentag-basierte Rhythmen (#467): `weekdays` (Mo–Fr), `weekend` (Sa+So),
        `mon`…`sun` (jeweils genau dieser Wochentag) erzeugen mehrere Termine pro Woche.
        Bei `mon`…`sun` muss `startDate` auf dem benannten Wochentag liegen, sonst 400.
        `none` (#2355, ohne Rhythmus) ist nur bei `autoCreate: false` erlaubt, sonst 400.
    Series:
      type: object
      description: >-
        Serien-Template einer wiederkehrenden Aufgabe (Habit, Konzept §4.2). Jede fällige
        Wiederholung wird als eigenständiger `Task` mit `seriesId` materialisiert.
      required:
        - id
        - title
        - rhythm
        - priority
        - estimatedEffort
        - active
        - startDate
        - autoCreate
        - pillars
      properties:
        id:
          type: integer
        title:
          type: string
        rhythm:
          $ref: '#/components/schemas/SeriesRhythm'
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: Default-Priorität künftig generierter Instanzen.
        estimatedEffort:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
          default: 0.5
          description: Default-Aufwand künftig generierter Instanzen.
        active:
          type: boolean
          default: true
          description: Inaktive Templates erzeugen keine Instanzen.
        startDate:
          type: string
          format: date-time
          description: Anker, ab dem die Serie läuft (erster fälliger Termin).
        description:
          type: string
          nullable: true
          description: Freitext-Beschreibung des Templates (optional).
        address:
          type: string
          maxLength: 255
          nullable: true
          description: >-
            Adresse des Serien-Orts, über die Adresssuche (Forward-Geocoding) ausgewählt.
            Wird beim Generieren als Snapshot auf jede Instanz vererbt. `null`, wenn
            kein Ortsbezug gesetzt ist (#1063).
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          nullable: true
          description: >-
            Breitengrad des Serien-Orts (#1066). Wird nur bei Auswahl eines
            Adress-Vorschlags gesetzt; `null`, wenn kein Koordinaten-Bezug besteht.
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          nullable: true
          description: >-
            Längengrad des Serien-Orts (#1066), analog `latitude`.
        autoDeleteAfterDeadline:
          type: boolean
          description: >-
            Wenn `true`, erben künftig generierte Instanzen diese Option und
            werden bei verpasster Deadline automatisch gelöscht (#523).
        autoCreate:
          type: boolean
          description: >-
            Wenn `false`, legen `POST /series/generate-all` und `POST /series/{id}/generate`
            keine Aufgaben an; die Serie ist eine reine Vorlage (#2355). Standard `true`.
        userId:
          type: integer
          nullable: true
          description: >-
            Eigentümer der Serie (Issue #244); bei einer Serie für ein anderes
            Gruppenmitglied (#1222) das Empfänger-Konto statt des Erstellers.
        createdById:
          type: integer
          nullable: true
          description: >-
            Konto des Erstellers (#1222, analog `Task.createdById` #1213). Weicht bei
            einer Serie für ein anderes Gruppenmitglied vom Eigentümer ab; `null` für
            Bestandsserien ohne Ersteller-Eintrag.
        createdByName:
          type: string
          nullable: true
          description: >-
            Anzeigename des Erstellers (E-Mail-Fallback, #1222); synchron zu
            `createdById`, also `null` ohne Ersteller-Eintrag.
        forUserId:
          type: integer
          nullable: true
          description: >-
            Empfänger-Konto, nur gesetzt, wenn die Serie aus Sicht des aufrufenden
            Erstellers für ein anderes Gruppenmitglied angelegt wurde (#1222); sonst `null`.
        forUserName:
          type: string
          nullable: true
          description: Anzeigename des Empfängers (E-Mail-Fallback, #1222); synchron zu `forUserId`.
        pillars:
          type: array
          description: >-
            Säulen-Vorlage des Templates (0..n). Der `share` verteilt 100 %
            über die referenzierten Säulen; `confidence` ist die Konfidenz je Beitrag.
          items:
            $ref: '#/components/schemas/TaskPillarContribution'
        categoryId:
          type: integer
          nullable: true
          description: >-
            Thematische Kategorie des Templates (0..1, siehe Schema `Category`); wird beim
            Generieren auf jede Instanz vererbt. `null`, wenn keine zugeordnet ist.
    SeriesCreate:
      type: object
      required:
        - title
        - priority
        - estimatedEffort
      properties:
        title:
          type: string
        userId:
          type: integer
          description: >-
            Optionaler Empfänger (#1222): das Konto, dem die Serie und ihre generierten
            Instanzen gehören sollen. Der Aufrufer muss mit ihm eine Gruppe teilen
            (sonst 403); ohne das Feld oder mit der eigenen ID gehört die Serie dem
            Aufrufer wie bisher.
        rhythm:
          $ref: '#/components/schemas/SeriesRhythm'
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        estimatedEffort:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
          default: 0.5
        active:
          type: boolean
          default: true
        startDate:
          type: string
          format: date-time
          description: >-
            Pflicht, außer bei `rhythm: none` (#2355): dann setzt der Server heute (UTC-Mitternacht) ein.
        description:
          type: string
          nullable: true
        address:
          type: string
          maxLength: 255
          nullable: true
          description: Adresse des Serien-Orts (optional, #1063). Fehlt das Feld, gilt `null`.
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          nullable: true
          description: >-
            Breitengrad des Serien-Orts (#1066). Wird nur bei Auswahl eines
            Adress-Vorschlags gesetzt; `null`, wenn kein Koordinaten-Bezug besteht.
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          nullable: true
          description: >-
            Längengrad des Serien-Orts (#1066), analog `latitude`.
        autoDeleteAfterDeadline:
          type: boolean
          description: >-
            Wenn `true`, erben künftig generierte Instanzen diese Option und
            werden bei verpasster Deadline automatisch gelöscht (#523).
        autoCreate:
          type: boolean
          description: >-
            Wenn `false`, legen `POST /series/generate-all` und `POST /series/{id}/generate`
            keine Aufgaben an; die Serie ist eine reine Vorlage (#2355). Standard `true`.
        pillars:
          type: array
          description: >-
            Säulen-Vorlage des Templates (0..n). Wird das Feld weggelassen,
            bleibt das Template ohne Säulen. Bei mindestens einer Säule muss die
            Summe aller `share` 100 ergeben.
          items:
            $ref: '#/components/schemas/TaskPillarContributionInput'
        categoryId:
          type: integer
          nullable: true
          description: >-
            Optionale Kategorie des Templates. Muss eine Kategorie des Eigentümer-Kontos
            sein, sonst 400; wird beim Generieren auf jede Instanz vererbt.
    SeriesUpdate:
      type: object
      description: Alle Felder optional — gesetzte Felder gelten nur für künftige Instanzen.
      properties:
        title:
          type: string
        userId:
          type: integer
          description: >-
            Optionaler Empfänger (#1252): übergibt das Serien-Template an das
            benannte Gruppenmitglied (Eigentümerwechsel, Aufrufer wird Ersteller).
            Der Aufrufer muss mit dem Empfänger eine Gruppe teilen (sonst 403);
            ohne das Feld oder mit der eigenen ID bleibt der Eigentümer
            unverändert. Bereits erzeugte Instanzen bleiben beim bisherigen
            Eigentümer (keine Kaskade des Eigentümers).
        rhythm:
          $ref: '#/components/schemas/SeriesRhythm'
        priority:
          type: integer
          minimum: 1
          maximum: 5
        estimatedEffort:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
        active:
          type: boolean
        startDate:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
        address:
          type: string
          maxLength: 255
          nullable: true
          description: >-
            Adresse des Serien-Orts (#1063). `null` entfernt einen bestehenden Ortsbezug.
            Fehlt das Feld, bleibt die Adresse unverändert.
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          nullable: true
          description: >-
            Breitengrad des Serien-Orts (#1066). `null` entfernt den Koordinaten-Bezug;
            fehlt das Feld, bleibt er unverändert.
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          nullable: true
          description: Längengrad des Serien-Orts (#1066), analog `latitude`.
        autoDeleteAfterDeadline:
          type: boolean
          description: >-
            Wenn `true`, erben künftig generierte Instanzen diese Option und
            werden bei verpasster Deadline automatisch gelöscht (#523).
        autoCreate:
          type: boolean
          description: >-
            Wenn `false`, legen `POST /series/generate-all` und `POST /series/{id}/generate`
            keine Aufgaben an; die Serie ist eine reine Vorlage (#2355). Standard `true`.
        pillars:
          type: array
          description: >-
            Ersetzt die Säulen-Vorlage des Templates vollständig. Eine leere Liste
            entfernt alle Beiträge; bei mindestens einer Säule muss die Verteilung
            alle Säulen des Kontos abdecken, jeder `share` zwischen 5 und 80 liegen
            und die Summe aller `share` 100 ergeben (#2077). Fehlt das Feld, bleibt
            die Vorlage unverändert.
          items:
            $ref: '#/components/schemas/TaskPillarContributionInput'
        categoryId:
          type: integer
          nullable: true
          description: >-
            Setzt die Kategorie des Templates (muss dem Eigentümer-Konto gehören) oder
            entfernt sie mit `null`. Fehlt das Feld, bleibt die Zuordnung unverändert.
        applyToInstances:
          type: boolean
          description: >-
            `true` überträgt die im Serie-Edit GEÄNDERTEN kaskadierbaren Felder (`title`, `priority`,
            `estimatedEffort`, `description`, `address`, `autoDeleteAfterDeadline`, `pillars`)
            zusätzlich auf alle bestehenden offenen Instanzen (inkl. `isException`; erledigte bleiben
            unverändert, #555). `rhythm`/`startDate`/`active` werden nie kaskadiert. Default `false`
            (nur Template, künftige Instanzen).
    SeriesGenerateInput:
      type: object
      required:
        - until
      properties:
        until:
          type: string
          format: date-time
          description: Letzter zu materialisierender Zeitpunkt (inklusive).
    SeriesInstanceInput:
      type: object
      properties:
        title:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 5
        estimatedEffort:
          type: number
          minimum: 0.1
          maximum: 1
        description:
          type: string
          nullable: true
        deadline:
          type: string
          format: date-time
    SeriesGenerateAllResult:
      type: object
      required:
        - created
      properties:
        created:
          type: integer
          description: Anzahl der neu materialisierten Task-Instanzen.
    MeSubscription:
      type: object
      description: Abo-Status im Vertrag von `GET /auth/me` (#1494/#1495/#1505).
      required: [provider, plan, period, status, currentPeriodEnd, pendingPlan, pendingPlanEffectiveAt, graceUntil]
      properties:
        provider:
          type: string
          enum: [paypal, google_play]
          description: >-
            Anbieter, über den das Abo läuft und verwaltet wird (#1690). Ein Nutzer hat
            höchstens ein laufendes Abo über alle Anbieter.
        plan:
          $ref: '#/components/schemas/Plan'
        period:
          type: string
          enum: [monthly, quarterly, yearly]
        status:
          type: string
          description: Abo-Status beim Anbieter (z. B. `approval_pending`, `active`, `cancelled`).
        currentPeriodEnd:
          type: string
          format: date-time
        pendingPlan:
          type: [string, 'null']
          description: >-
            Vorgemerkter Paketwechsel nach unten (#1495 AK4); wirkt erst ab
            `pendingPlanEffectiveAt`. `null` ohne anstehenden Wechsel.
        pendingPlanEffectiveAt:
          type: [string, 'null']
          format: date-time
          description: Zeitpunkt, ab dem `pendingPlan` wirkt; `null` ohne anstehenden Wechsel.
        graceUntil:
          type: [string, 'null']
          format: date-time
          description: >-
            Ende der Kulanzfrist nach Zahlungsausfall (#1505 AK6). Konstant `null`, bis
            T6e (#1506) sie befüllt.
    Me:
      type: object
      description: Antwort von `GET /auth/me` (Issue #206/#1456/#1494/#1901) — Session, Paket, Entitlements, Abo, Zustimmung.
      required: [email, displayName, avatarUrl, plan, entitlements, subscription, termsAccepted, launchBanner]
      properties:
        id:
          type: integer
          description: Fehlt im lokalen Pass-Through-Modus (synthetischer Entwicklungs-Nutzer).
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: [string, 'null']
        role:
          type: string
          enum: [admin, member, tester]
          description: Fehlt im lokalen Pass-Through-Modus.
        plan:
          $ref: '#/components/schemas/Plan'
        entitlements:
          type: object
          description: Entitlement-Map je Feature-Identifier (#1456).
          additionalProperties:
            $ref: '#/components/schemas/FeatureEntitlement'
        subscription:
          allOf:
            - $ref: '#/components/schemas/MeSubscription'
          nullable: true
          description: Abo-Status; `null` ohne Abo.
        termsAccepted:
          type: boolean
          description: >-
            `true`, wenn das Konto der aktuellen Fassung der Nutzungsbedingungen zugestimmt
            hat (#1901); im lokalen Pass-Through-Modus immer `true`.
        launchBanner:
          type: boolean
          description: >-
            `true`, wenn der Einladungs-Banner der Einführungsphase aktiv ist (#2229);
            Server-Schalter `LAUNCH_BANNER_ENABLED=true`, Default `false`.
        playAccountId:
          type: string
          description: >-
            Kontokennung, die die Android-App beim Kauf über Google Play als
            `obfuscatedAccountId` setzt (#1687, ADR 0017). Fehlt im lokalen
            Pass-Through-Modus.
    GooglePurchaseInput:
      type: object
      description: Kauf-Token aus Google Play Billing (#1687).
      required: [purchaseToken]
      properties:
        purchaseToken:
          type: string
          minLength: 1
    BillingSubscriptionInput:
      type: object
      description: Eingabe zum Anlegen/Wechseln eines Abos (#1505 AK1/AK4).
      required: [plan, period]
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        period:
          type: string
          enum: [monthly, quarterly, yearly]
        withdrawalConsent:
          type: boolean
          description: Zustimmung zum sofortigen Leistungsbeginn mit Kenntnisnahme vom Erlöschen des Widerrufsrechts (#2329, § 312f BGB). Pflicht (`true`) nur bei `POST /billing/subscriptions`, bei Wechseln ignoriert.
    BillingCancelInput:
      type: object
      description: Angaben aus dem Bestätigungsschritt der Kündigung (#2308, § 312k BGB).
      required: [kind, email]
      properties:
        kind:
          type: string
          enum: [ordinary, extraordinary]
        reason:
          type: string
          description: Pflicht bei `extraordinary`, sonst ignoriert.
        email:
          type: string
          format: email
          description: Adresse für die Kündigungsbestätigung.
    BillingApproval:
      type: object
      description: >-
        Antwort auf Anlegen/Wechseln eines Abos (#1505 AK1/AK4). `approvalUrl` fehlt beim
        Wechsel, wenn PayPal keine erneute Zustimmung verlangt.
      properties:
        approvalUrl:
          type: string
          description: Zustimmungs-URL des PayPal-Clients.
    BillingChangePreview:
      type: object
      description: >-
        Vorschau des Paketwechsels (#1913): `creditCents` ist das angerechnete Guthaben
        (0 ohne Sofort-Wechsel), `dueCents` der fällige Betrag des ersten Zyklus. `immediate`
        sagt, ob der Wechsel sofort wirkt (Upgrade/Zeitraumwechsel) oder erst zum Periodenende
        (ADR 0013) — die Oberfläche trägt bewusst keine eigene Paket-Rangfolge.
        `startsAt` nennt den Startzeitpunkt (#2049): sofort beim Upgrade, sonst das
        Periodenende (Weiterführen/Downgrade auch nach Kündigung).
        `creditCoversUntil` nennt bei einem Guthaben ab dem neuen Preis, bis wann es reicht (#2241);
        `dueCents` ist dann die Gebühr für den Rest, fällig bei der Zustimmung.
        `priceCents` ist der reguläre Katalogpreis des Ziels je Laufzeit (#2324); beim Wechsel
        zum Periodenende ist `dueCents` 0 und `currentPlan`/`currentPeriod` nennen das Paket,
        das bis dahin weiterläuft.
      required: [priceCents, creditCents, dueCents, immediate]
      properties:
        priceCents:
          type: integer
          minimum: 0
        creditCents:
          type: integer
          minimum: 0
        dueCents:
          type: integer
          minimum: 0
        immediate:
          type: boolean
        startsAt:
          type: string
          format: date-time
        creditCoversUntil:
          type: string
          format: date-time
        currentPlan:
          $ref: '#/components/schemas/Plan'
        currentPeriod:
          type: string
          enum: [monthly, quarterly, yearly]
    Invoice:
      type: object
      description: >-
        Rechnung zu einem Abrechnungszeitraum (#1505 AK5). Kein Zahlungsmittel
        (AK9) — `taxNote` trägt den §19-UStG-Hinweis; das gespeicherte PDF
        liefert `GET /billing/invoices/{id}/pdf` (#1955).
      required: [id, number, periodStart, periodEnd, amountCents, taxNote, paymentStatus]
      properties:
        id:
          type: integer
        number:
          type: string
          description: Fortlaufende Rechnungsnummer (`INV-<Jahr>-<6-stellig>`).
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        amountCents:
          type: integer
        taxNote:
          type: string
        paymentStatus:
          type: string
          enum: [paid, refunded]
          description: >-
            Echter Zahlungsstatus (#2086) — provider-neutral (`paid`/`refunded`), damit
            Google Play (#1688) dieselbe Quelle nutzen kann. `refunded` folgt einer
            nachträglichen Erstattung des Zahlungsdienstleisters.
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Fehlerbeschreibung
        code:
          type: string
          enum:
            [plan_required, quota_exhausted, ai_throttled, subscription_active, last_group_admin, paypal_unavailable]
          description: >-
            Maschinenlesbarer Grund bei paketbedingten Ablehnungen (#1456) und bei
            der abgelehnten Konto-Löschung (`DELETE /auth/me`, 409; Admin-Variante
            `DELETE /admin/users/{id}`, zusätzlich 502 `paypal_unavailable`).
            `plan_required` (403) heißt „Feature nicht im Paket",
            `quota_exhausted` (429) „Monatskontingent aufgebraucht" (seit #1783 ungenutzt),
            `ai_throttled` (429) „Fair-Use-Drossel, später erneut versuchen",
            `subscription_active` „Abo läuft noch", `last_group_admin` „letzter
            Admin einer Gruppe mit weiteren Mitgliedern". Alle übrigen Fehler
            tragen ausschließlich `message`.
        feature:
          type: string
          description: Stabiler Feature-Identifier der Ablehnung (z. B. `groups`, `ai_assist`).
        requiredPlan:
          type: string
          description: Kleinstes Paket, das das Feature enthält.
        currentPlan:
          type: string
          description: Paket des anfragenden Nutzers.
    VapidPublicKey:
      type: object
      required:
        - publicKey
      properties:
        publicKey:
          type: string
          description: Öffentlicher VAPID-Schlüssel (URL-safe Base64) für PushManager.subscribe().
    PushSubscriptionKeys:
      type: object
      required:
        - p256dh
        - auth
      properties:
        p256dh:
          type: string
          description: Öffentlicher ECDH-Schlüssel des Clients (aus PushSubscription.getKey('p256dh')).
        auth:
          type: string
          description: Auth-Secret des Clients (aus PushSubscription.getKey('auth')).
    PushSubscriptionInput:
      type: object
      required:
        - endpoint
        - keys
      description: >-
        Die vom Browser über `PushManager.subscribe().toJSON()` gelieferte
        Subscription. `endpoint` identifiziert den Push-Dienst-Kanal eindeutig;
        `keys` trägt die Verschlüsselungsschlüssel für die Payload.
      properties:
        endpoint:
          type: string
          description: Eindeutige Push-Dienst-URL dieses Clients.
        expirationTime:
          type: integer
          format: int64
          nullable: true
          description: Ablaufzeitpunkt in Epoch-Millisekunden (meist null).
        keys:
          $ref: '#/components/schemas/PushSubscriptionKeys'
    FcmTokenInput:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          maxLength: 4096
          description: FCM-Registrierungstoken des Geräts.
    PushUnsubscribeInput:
      type: object
      required:
        - endpoint
      properties:
        endpoint:
          type: string
          description: Push-Dienst-URL der abzumeldenden Subscription.
    PushSubscriptionAck:
      type: object
      required:
        - endpoint
      properties:
        endpoint:
          type: string
          description: Bestätigter Endpoint der gespeicherten bzw. entfernten Subscription.
    TestPushResult:
      type: object
      required:
        - sent
        - quote
      properties:
        sent:
          type: integer
          description: Anzahl der erfolgreich zugestellten Push-Nachrichten.
        quote:
          $ref: '#/components/schemas/Quote'
    AuthProviders:
      type: object
      required:
        - google
        - magicLink
      properties:
        google:
          type: boolean
          description: Google-OAuth ist konfiguriert.
        magicLink:
          type: boolean
          description: Magic Link per E-Mail ist konfiguriert.
    MagicLinkRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          description: Adresse, an die der Anmeldelink geht.
    MagicLinkVerifyRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Token aus dem Anmeldelink (Parameter `magic`).
    WaitlistJoinRequest:
      type: object
      description: Eintrag auf die Warteliste des Launch-Zugangs (#1982, ADR 0019).
      required: [email]
      properties:
        email:
          type: string
          description: E-Mail-Adresse; wird normalisiert (trim + lowercase) gespeichert.
        ref:
          type: string
          description: Persönlicher Empfehlungs-Code des Werbers, falls über dessen Link beigetreten.
    WaitlistJoined:
      type: object
      description: Antwort nach dem Wartelisten-Eintrag (#1982).
      required: [position, referralCode]
      properties:
        position:
          type: integer
          minimum: 1
          description: 1-basierte Position im Referral-Rang (geworbene Anmeldungen absteigend, Anmeldezeitpunkt aufsteigend).
        referralCode:
          type: string
          description: Persönlicher Empfehlungs-Code — Bestandteil des Empfehlungs-Links (`?ref=…`).
        total:
          type: integer
          minimum: 1
          description: Gesamtzahl der Einträge — Kontext für die Positions-Anzeige („Position 3 von 87“).
    TermsConsentInput:
      type: object
      description: Zustimmung zu Nutzungsbedingungen und Datenschutzerklärung (#1901).
      required: [acceptTerms, acceptPrivacy]
      properties:
        acceptTerms:
          type: boolean
          enum: [true]
        acceptPrivacy:
          type: boolean
          enum: [true]
    AppToken:
      type: object
      description: >-
        App-Token der Android-App (#2377). Authentifiziert jede Anfrage per
        `Authorization: Bearer`, sessiongleich und ohne CSRF; `POST /auth/logout` zieht es zurück.
      required: [token]
      properties:
        token:
          type: string
          description: Klartext-Token (`pp_<32 Hex>`); nur in dieser Antwort enthalten
    NativeLoginExchangeRequest:
      type: object
      required:
        - code
        - state
      properties:
        code:
          type: string
          description: Einmal-Code aus dem App Link (Parameter `code`).
        state:
          type: string
          description: Zufallswert, mit dem die App `/auth/google?client=app&state=…` gestartet hat.
    TestMailResult:
      type: object
      required:
        - sent
      properties:
        sent:
          type: boolean
          description: Ob die Testmail erfolgreich verschickt wurde.
    Quote:
      type: object
      required:
        - text
        - author
      properties:
        text:
          type: string
          description: Zitat-Text.
        author:
          type: string
          description: Urheber des Zitats.
    LlmProviderSelection:
      type: object
      required:
        - providerId
      description: >-
        Die Provider-Auswahl eines Nutzers für seine KI-Aufrufe (#1548). `providerId`
        referenziert einen eigenen (#1547) oder instanzweiten Provider; `null` = keine
        Auswahl. Wirksam (Gate- und Kontingent-Bypass auf den KI-Endpunkten) ist nur eine
        Auswahl auf einen eigenen Provider — bei instanzweiten Providern und ohne Auswahl
        läuft die Auflösung wie bisher über den instanzweit aktiven Provider.
      properties:
        providerId:
          type: [integer, 'null']
          description: ID des gewählten Providers oder null (keine Auswahl).
    LlmProvider:
      type: object
      required:
        - id
        - name
        - endpoint
        - model
        - isActive
        - kind
        - hasApiKey
        - own
      description: >-
        Ein LLM-Provider. Zwei Arten: `kind=custom` (frei anlegbar, bearbeitbar,
        löschbar; Key liegt write-only in der DB) und `kind=builtin` („Mistral“
        und „OpenRouter“ — fix, nicht lösch-/bearbeitbar; Key und Endpoint
        kommen aus den ENV-Variablen des Servers). Genau ein Provider ist
        effektiv aktiv (`isActive`): die explizite Radio-Auswahl oder — wenn
        kein Custom-Provider gewählt ist — der Built-in-Fallback (Mistral vor
        OpenRouter, nach ENV-Key-Präsenz). API-Keys werden bewusst NICHT
        zurückgegeben (Write-Only).
      properties:
        id:
          type: integer
          description: ID des Providers.
        name:
          type: string
          description: Anzeigename (z. B. "Mistral", "OpenRouter", "z.ai").
        endpoint:
          type: string
          description: >-
            Basis-URL des Providers (OpenAI-kompatibel); bei Custom-Providern kann
            auch die vollständige Chat-Completions-URL gespeichert sein (Legacy).
        model:
          type: string
          description: >-
            Effektive Modellkennung (z. B. "mistral-medium-latest"). Bei Built-ins
            der Default aus ENV/Code, solange der Nutzer keins gewählt hat; leer bei
            Custom-Providern ohne Modellwahl.
        isActive:
          type: boolean
          description: Ist dieser Provider der effektiv aktive (Radio-Button-Auswahl oder Fallback)?
        kind:
          type: string
          enum: [custom, builtin]
          description: '„custom“ = frei verwaltbar, „builtin“ = fix (Mistral/OpenRouter).'
        hasApiKey:
          type: boolean
          description: >-
            Ob ein Key vorhanden ist (Built-in: ENV-Variable gesetzt; Custom: DB-Key
            gesetzt). Signalisiert nur die Präsenz, nie den Wert.
        own:
          type: boolean
          description: >-
            Gehört diese Zeile dem abfragenden Nutzer (#1549)? `true` nur für eigene
            Custom-Provider; instanzweite Zeilen (`userId = null`, inkl. Built-ins)
            und fremde Zeilen sind `false`. Basis des UI-Markers „eigen“/„instanzweit“
            und des Free-Gates (nur eigene Custom-Provider öffnen KI-Features).
    LlmProviderInput:
      type: object
      required:
        - name
        - endpoint
        - apiKey
        - model
      description: >-
        Anlegen eines Custom-Providers: Name, Endpoint (gültige http(s)-URL),
        API-Key und Modell sind Pflicht. Das Modell ist bewusst schon beim
        Anlegen Pflicht, weil der `/models`-Endpoint nicht bei jedem Anbieter
        erreichbar/öffentlich ist — nach dem Anlegen kann es über die
        Modellliste des Providers geändert werden. Der Key wird nie
        zurückgegeben.
      properties:
        name:
          type: string
          description: Anzeigename des Providers.
        endpoint:
          type: string
          description: >-
            OpenAI-kompatible Basis-URL (http/https), z. B. https://api.mistral.ai/v1 —
            ein `/chat/completions`-Suffix wird toleriert und abgeschnitten. Interne
            Adressen (Loopback, private Netze, Link-Local) werden mit 400 abgelehnt.
        apiKey:
          type: string
          description: API-Key des Providers (Write-Only).
        model:
          type: string
          description: Modellkennung, z. B. `glm-4.7` (Pflicht — Modellliste nicht immer abrufbar).
    LlmProviderUpdate:
      type: object
      description: >-
        Bearbeiten eines Providers: alle Felder optional; der API-Key wird nur bei
        nicht-leerem String gesetzt (Bearbeiten-Dialog startet leer). Für Built-in-
        Provider ist ausschließlich `model` erlaubt (Modellwahl aus der Modellliste)
        — alles andere führt zu HTTP 400.
      properties:
        name:
          type: string
          description: Neuer Anzeigename (nur Custom-Provider).
        endpoint:
          type: string
          description: Neue Endpoint-URL (nur Custom-Provider).
        apiKey:
          type: string
          description: Neuer API-Key (nur bei Änderung senden; leer = unverändert; nur Custom-Provider).
        model:
          type: string
          description: Gewählte Modellkennung (Custom- und Built-in-Provider).
    LlmModel:
      type: object
      required:
        - id
        - name
      description: >-
        Ein verfügbares Modell eines Providers, aus dessen OpenAI-kompatibler
        `GET /models`-Antwort ausgelesen (nach `id` sortiert).
      properties:
        id:
          type: string
          description: Modellkennung (z. B. `mistral-medium-latest`).
        name:
          type: string
          description: Anzeigename — fiel der Upstream keinen, gilt die Modellkennung.
    LlmProviderTestDraft:
      type: object
      required:
        - endpoint
        - apiKey
        - model
      description: >-
        Eingabe für `POST /llm-providers/test-dry`: die Formulardaten des
        Provider-Dialogs (#1577). Leeres `apiKey` mit gesetztem `providerId`
        nutzt den gespeicherten Key des Providers (Bearbeiten-Modus,
        „leer = unverändert").
      properties:
        endpoint:
          type: string
          description: OpenAI-kompatible Basis-URL (http/https) aus dem Formular.
        apiKey:
          type: string
          description: API-Key aus dem Formular (leer = gespeicherter Key bei providerId).
        model:
          type: string
          description: Modellkennung aus dem Formular.
        providerId:
          type: integer
          description: ID des bearbeiteten Providers (optional; Besitz wird geprüft).
    LlmProviderTestResult:
      type: object
      required:
        - ok
      description: >-
        Ergebnis von `POST /llm-providers/{id}/test`: `ok=true` mit Modell,
        Latenz und Antwort-Auszug bei Erfolg; `ok=false` mit konkreter
        Fehlerursache (inkl. Upstream-Detail wie „Check your subscription“)
        bei Misserfolg. Nie den API-Key.
      properties:
        ok:
          type: boolean
          description: Hat der Test-Prompt den Provider erfolgreich durchlaufen?
        model:
          type: string
          description: Effektiv genutztes Modell (Erfolgsfall).
        latencyMs:
          type: number
          description: Round-Trip-Zeit des Test-Calls in Millisekunden (Erfolgsfall).
        sample:
          type: string
          description: Gekürzter Antwort-Text des Modells (Erfolgsfall).
        message:
          type: string
          description: Konkrete Fehlerursache bei Misserfolg (inkl. Upstream-Detail).
    LlmModels:
      type: object
      required:
        - models
      description: >-
        Antwort von `GET /llm-providers/{id}/models`: die verfügbaren Modelle des
        Providers, dynamisch aus dessen OpenAI-kompatibler `GET /models`-Antwort
        ausgelesen und nach `id` sortiert. Scheitert der Live-Abruf, kann ein
        Built-in mit Katalog (Mistral) diesen als Fallback liefern (`source:
        'fallback'`) — stabile `-latest`-Aliasse, damit die Modellwahl möglich
        bleibt (z. B. bei abgelaufenem Mistral-Abo, HTTP 402).
      properties:
        models:
          type: array
          description: Verfügbare Modelle (live geladen; im Fallback-Fall eingebauter Katalog).
          items:
            $ref: '#/components/schemas/LlmModel'
        source:
          type: string
          enum: [live, fallback]
          description: >-
            Herkunft der Liste: `live` (oder abwesend) = vom Provider geladen;
            `fallback` = eingebauter Katalog, weil der Live-Abruf scheiterte.
    NearbyTask:
      type: object
      required:
        - id
        - title
        - distanceKm
      description: >-
        Eintrag der Nearby-Liste (GET /tasks/nearby, #1066): ein offener Task mit
        Koordinaten, aufsteigend nach Distanz zur übergebenen Position (max. 10).
      properties:
        id:
          type: integer
        title:
          type: string
        distanceKm:
          type: number
          format: float
          description: Distanz zur Position in km, auf eine Nachkommastelle gerundet.
    ReverseGeocodeResponse:
      type: object
      required:
        - address
      description: >-
        Antwort von GET /reverse-geocode (Issue #866): die ermittelte Adresse
        (leer bei Fehler/Rate-Limit/Offline).
      properties:
        address:
          type: string
          description: >-
            Lesbare Adresse (z. B. "Musterstraße 1, 12345 Musterstadt").
            Leer bei Fehler/Rate-Limit/Offline — die Position wird ohne Adresse
            angezeigt.
    GeocodeSearchResult:
      type: object
      required:
        - address
        - lat
        - lon
      description: >-
        Ein Adress-Vorschlag der Adresssuche (Forward Geocoding, GET /geocode-search).
      properties:
        address:
          type: string
          description: Lesbare Adresse (Nominatim-Anzeigename).
        lat:
          type: number
          format: float
          description: Breitengrad des Vorschlags.
        lon:
          type: number
          format: float
          description: Längengrad des Vorschlags.
