openapi: 3.0.0
info:
  title: Balamentum API
  description: >-
    Vertrag für die Aufgaben-Priorisierung über einen gewichteten
    Abhängigkeitsgraphen. Aus dieser Datei werden via `openapi-typescript`
    sowohl die Server-Typen (`server/src/api.d.ts`) als auch die Client-Typen
    (`client/src/schema.d.ts`) erzeugt.
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  /tasks:
    get:
      summary: Alle Tasks auflisten
      operationId: listTasks
      responses:
        '200':
          description: Liste aller Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      summary: Neuen Task anlegen
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
  /tasks/nearby:
    get:
      summary: Offene Tasks nach Distanz zur Position (#1066)
      description: >-
        Liefert maximal 10 offene Tasks (Status Open/In process) mit Koordinaten des
        eingeloggten Nutzers, aufsteigend nach Distanz (Haversine) zur übergebenen
        Position. Auth-pflichtig und owner-scoped (Datenisolation, #207/#244).
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: float
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          schema:
            type: number
            format: float
            minimum: -180
            maximum: 180
      responses:
        '200':
          description: Nearby-Liste (ggf. leer).
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/NearbyTask'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      summary: Einen Task abrufen
      operationId: getTask
      responses:
        '200':
          description: Der angeforderte Task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Einen Task teilweise aktualisieren
      description: >-
        Ein bereits erledigter Task (`status: Done`) ist gegen inhaltliche Änderungen
        eingefroren: solange der Request den Status nicht im selben Aufruf von `Done`
        wegändert, wird er mit `409` abgelehnt (#1438). Ein reines Wiedereröffnen
        (`status`, ggf. zusammen mit inhaltlichen Feldern) bleibt möglich.
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Der aktualisierte Task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Einen Task löschen
      operationId: deleteTask
      responses:
        '204':
          description: Task wurde gelöscht
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{id}/dependencies:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      summary: Abhängigkeit (Vorgänger) zu einem Task hinzufügen
      description: >-
        Fügt dem Task `{id}` eine Abhängigkeit hinzu — den im Body angegebenen
        Task, von dem `{id}` abhängt (Vorgänger/Prerequisite). Entspricht
        `task.addDependency()`. Eine Abhängigkeit, die einen Zyklus erzeugen
        würde, wird mit `409` abgelehnt.
      operationId: addDependency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependencyInput'
      responses:
        '201':
          description: Abhängigkeit wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tasks/{id}/dependencies/{depId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - name: depId
        in: path
        required: true
        description: ID der zu entfernenden Abhängigkeit (Vorgänger-Task, von dem `{id}` abhängt)
        schema:
          type: integer
    delete:
      summary: Abhängigkeit (Vorgänger) von einem Task entfernen
      operationId: removeDependency
      responses:
        '204':
          description: Abhängigkeit wurde entfernt
        '403':
          $ref: '#/components/responses/PlanRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /pillars:
    get:
      summary: Alle Lebensbalance-Säulen auflisten
      description: >-
        Liefert die fünf festen Säulen inkl. ihres prozentualen Anteils
        (`weight`); die Gewichte summieren sich über alle Säulen auf 100.
      operationId: listPillars
      responses:
        '200':
          description: Liste aller Säulen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pillar'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Säule anlegen — gesperrt (403)
      description: >-
        Gesperrt seit #1573: Die fünf Lebensbalance-Säulen sind fest und gelten
        stets. Anlegen, Umbenennen und Löschen sind serverseitig gesperrt; der
        Endpunkt existiert weiter und antwortet immer mit 403.
      operationId: createPillar
      responses:
        '403':
          $ref: '#/components/responses/PillarsLocked'
  /pillars/{id}:
    parameters:
      - $ref: '#/components/parameters/PillarId'
    patch:
      summary: Säule aktualisieren — gesperrt (403)
      description: >-
        Gesperrt seit #1573: Die fünf Lebensbalance-Säulen sind fest und gelten
        stets. Anlegen, Umbenennen und Löschen sind serverseitig gesperrt; der
        Endpunkt existiert weiter und antwortet immer mit 403.
      operationId: updatePillar
      responses:
        '403':
          $ref: '#/components/responses/PillarsLocked'
    delete:
      summary: Säule löschen — gesperrt (403)
      description: >-
        Gesperrt seit #1573: Die fünf Lebensbalance-Säulen sind fest und gelten
        stets. Anlegen, Umbenennen und Löschen sind serverseitig gesperrt; der
        Endpunkt existiert weiter und antwortet immer mit 403.
      operationId: deletePillar
      responses:
        '403':
          $ref: '#/components/responses/PillarsLocked'
  /categories:
    get:
      summary: Alle Kategorien auflisten
      description: >-
        Liefert die thematischen Kategorien des eingeloggten Nutzers. Kategorien sind
        die flache Ordnungsebene neben den Lebensbalance-Säulen: Sie gruppieren und
        filtern, ohne in Wert-, Score- oder Balance-Berechnung einzufließen.
      operationId: listCategories
      responses:
        '200':
          description: Liste aller Kategorien des Nutzers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Neue Kategorie anlegen
      description: >-
        Legt eine Kategorie für den eingeloggten Nutzer an. Der Name ist pro Nutzer
        eindeutig (409 bei Dublette), die Farbe stammt aus der festen Palette.
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Kategorie wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    patch:
      summary: Kategorie teilweise aktualisieren
      description: >-
        Ändert Name und/oder Farbe einer Kategorie. Bei Namenskonflikt 409, bei
        unbekannter oder fremder ID 404.
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Die aktualisierte Kategorie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Kategorie löschen
      description: >-
        Löscht die Kategorie. Aufgaben und Serien bleiben erhalten und verlieren nur
        die Zuordnung (`categoryId` wird auf `null` gesetzt).
      operationId: deleteCategory
      responses:
        '204':
          description: Kategorie wurde gelöscht
        '404':
          $ref: '#/components/responses/NotFound'
  /pillars/weights:
    put:
      summary: Gewichtung (100 %-Verteilung) über alle Säulen setzen
      description: >-
        Setzt die prozentuale Verteilung über die Säulen. Der Body muss genau
        alle existierenden Säulen enthalten; die Summe der Gewichte muss 100
        ergeben und jedes Gewicht `>= 0` sein.
      operationId: setPillarWeights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PillarWeightsInput'
      responses:
        '200':
          description: Die aktualisierte Liste aller Säulen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pillar'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /lektorat:
    post:
      summary: Text lektorieren (LLM-Kaskade)
      description: >-
        Lektoriert einen frei formulierten Text (#680) — Rechtschreibung, Grammatik und
        Formulierung — und kürzt ihn auf Wunsch auf `maxLength` Zeichen. Der Aufruf läuft
        über die konfigurierte LLM-Kaskade und setzt eine Session voraus: Fehlt der Key,
        antwortet der Endpoint mit 503; bei Upstream-/Format-Fehlern mit 502.
      operationId: lektorat
      parameters:
        - name: provider
          in: query
          required: false
          description: >-
            Optionaler Provider-Pinning (#749/#951): Name eines konfigurierten
            Providers — überschreibt den aktiven Provider für diesen EINEN Aufruf.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LektoratInput'
      responses:
        '200':
          description: Lektorierter Text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LektoratResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '429':
          $ref: '#/components/responses/QuotaExhausted'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /pillars/advisor:
    post:
      summary: Aktivitäten-Berater für die Säulen (Mistral)
      description: >-
        Kleiner Berater auf Basis der Säulen: schlägt konkrete Aktivitäten vor und
        ordnet jede Aktivität den Säulen zu, auf die sie einzahlen würde. Als Rubrik
        dienen die Kurzbeschreibungen der Säulen aus den Einstellungen
        (`Pillar.description`). Optional lenkt eine frei formulierte Frage bzw.
        Situationsbeschreibung die Vorschläge; ohne Frage deckt der Berater alle
        Säulen ab. Die Beratung erfolgt über die Mistral-API (`MISTRAL_API_KEY`,
        Modell via `MISTRAL_MODEL`, Default `mistral-small-latest`). Fehlt der Key
        oder gibt es keine Säulen, antwortet der Endpoint mit 503; bei
        Upstream-/Format-Fehlern mit 502.
      operationId: advisePillarActivities
      parameters:
        - name: provider
          in: query
          required: false
          description: >-
            Optionaler Provider-Pinning (#749/#951): Name eines konfigurierten
            Providers — überschreibt den aktiven Provider für diesen EINEN Aufruf.
            Fehlt der Parameter → der aktive Provider (`llm_providers`, #951).
            Ungültiger Wert → HTTP 400.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityAdvisorInput'
      responses:
        '200':
          description: Vorgeschlagene Aktivitäten samt Säulen-Zuordnung und Begründung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityAdvisorResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '429':
          $ref: '#/components/responses/QuotaExhausted'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/suggest-pillars:
    post:
      summary: Säulen-Einzahlung per Mistral klassifizieren
      description: >-
        Schlägt anhand von Titel/Beschreibung/Kontext vor, auf welche Säulen eine
        Aufgabe einzahlt, samt Konfidenz (0–100) je Säule. Die Klassifikation
        erfolgt über die Mistral-API (`MISTRAL_API_KEY`, Modell via `MISTRAL_MODEL`,
        Default `mistral-small-latest`). Fehlt der Key oder gibt es keine Säulen,
        antwortet der Endpoint mit 503; bei Upstream-/Format-Fehlern mit 502.
      operationId: suggestPillars
      parameters:
        - name: provider
          in: query
          required: false
          description: >-
            Optionaler Provider-Pinning (#749/#951): Name eines konfigurierten
            Providers — überschreibt den aktiven Provider für diesen EINEN Aufruf.
            Fehlt der Parameter → der aktive Provider (`llm_providers`, #951).
            Ungültiger Wert → HTTP 400.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestPillarsInput'
      responses:
        '200':
          description: Vorgeschlagene Säulen-Einzahlungen mit Konfidenz
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestPillarsResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '429':
          $ref: '#/components/responses/QuotaExhausted'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/suggest-pillars/feedback:
    post:
      summary: Säulen-Korrektur als Feedback speichern
      description: >-
        Speichert eine vom Nutzer bestätigte/korrigierte Säulen-Zuordnung (Titel/
        Beschreibung + final gewählte Säulen). Die jüngsten Korrekturen fließen als
        gelernte Few-Shot-Beispiele in nachfolgende Klassifikationen ein und
        kalibrieren sie personalisiert (Feedback-Loop, siehe #45). Da es kein
        Nutzerkonzept gibt, wirkt das Feedback global.
      operationId: recordPillarFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PillarFeedbackInput'
      responses:
        '201':
          description: Das Feedback-Sample wurde gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PillarFeedbackResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/parse-search:
    post:
      summary: Gesprochene/getippte Suchanfrage in Suchbegriff und Kategorie zerlegen
      description: >-
        Trennt eine frei formulierte Suchanfrage („offene Sachen zum Hausbau") in den
        reinen Suchbegriff und die gemeinte Kategorie des Nutzers. Die Kategorien des
        eingeloggten Nutzers gibt der Server dem Modell vor; erkennt es keine, bleibt
        `categoryId` leer. Fehlt der LLM-Key, antwortet der Endpoint mit 503; bei
        Upstream-/Format-Fehlern mit 502.
      operationId: parseSearchQuery
      parameters:
        - name: provider
          in: query
          required: false
          description: >-
            Optionaler Provider-Pinning (#749/#951): Name eines konfigurierten
            Providers — überschreibt den aktiven Provider für diesen EINEN Aufruf.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseTaskInput'
      responses:
        '200':
          description: Aus der Anfrage extrahierter Suchbegriff und Kategoriefilter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsedSearch'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '429':
          $ref: '#/components/responses/QuotaExhausted'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/parse-text:
    post:
      summary: Task-Freitext per Mistral in strukturierte Felder parsen
      description: >-
        Extrahiert aus einem frei formulierten Text (Schnellerfassung, #235) die
        strukturierten Felder einer Aufgabe (Titel plus optional Beschreibung,
        Priorität, geschätzter Aufwand und Deadline). Das Parsing erfolgt über die
        Mistral-API (`MISTRAL_API_KEY`, Modell via `MISTRAL_MODEL`, Default
        `mistral-small-latest`). Fehlt der Key, antwortet der Endpoint mit 503; bei
        Upstream-/Format-Fehlern mit 502.
      operationId: parseTaskText
      parameters:
        - name: provider
          in: query
          required: false
          description: >-
            Optionaler Provider-Pinning (#749/#951): Name eines konfigurierten
            Providers — überschreibt den aktiven Provider für diesen EINEN Aufruf.
            Fehlt der Parameter → der aktive Provider (`llm_providers`, #951).
            Ungültiger Wert → HTTP 400.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseTaskInput'
      responses:
        '200':
          description: Aus dem Text extrahierte, strukturierte Task-Felder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsedTask'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '429':
          $ref: '#/components/responses/QuotaExhausted'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /health:
    get:
      summary: Liveness-Check
      description: >-
        Billiger Liveness-Check für Post-Deploy-Verifikation und Monitoring —
        robuster als der fachliche `GET /next`, da ohne Datenbank-Zugriff.
      operationId: getHealth
      responses:
        '200':
          description: Der Dienst läuft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /forest:
    get:
      summary: Aufgabenwald nach Wertschöpfung sortiert
      description: >-
        Liefert die Wurzel-Tasks (ohne Abhängigkeiten) als Bäume, absteigend
        nach Wertbeitrag sortiert (siehe `buildTaskForest`).
      operationId: getForest
      responses:
        '200':
          description: Liste der Aufgabenbäume
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskTreeNode'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /graph:
    get:
      summary: Aufgabengraph mit gewichteten Kanten
      description: >-
        Liefert die aktiven Aufgaben (`Open`/`In process`) des Nutzers als flache
        Knotenliste plus die gewichteten Kanten zwischen ihnen (siehe `buildTaskGraph`).
        Anders als `/forest` erscheint eine Aufgabe, die mehreren übergeordneten
        Aufgaben zuarbeitet, genau einmal — mit mehreren Kanten statt mehreren Kopien.
        Kennzahlen (`value`, `totalEstimatedEffort`, `progress`) sind wertgleich zu
        `/forest`.
      operationId: getTaskGraph
      responses:
        '200':
          description: Knoten und Kanten des Aufgabengraphen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskGraph'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /next:
    get:
      summary: Nächsten wichtigen Task ermitteln
      description: >-
        Liefert den Task mit höchster Priorität, dessen Abhängigkeiten alle
        abgeschlossen sind (siehe `findNextImportantTask`).
      operationId: getNextTask
      responses:
        '200':
          description: Der nächste wichtige Task oder `null`, falls keiner vorhanden ist
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/Task'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /suggestions:
    get:
      summary: '"Was ist jetzt dran?"-Vorschlagsliste'
      description: >-
        Liefert die nach Score sortierte, post-gefilterte Vorschlagsliste
        (Konzept §4.3): Priorität, Deadline-Nähe und Balance-Korrektur fließen
        ein, der Überlastungsschutz begrenzt die Liste (siehe
        `findSuggestedTasks`). Der Abhängigkeitsfilter aus `GET /next` bleibt
        vorgeschaltet.
      operationId: getSuggestions
      responses:
        '200':
          description: Nach Score sortierte Vorschlagsliste (ggf. leer)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /reverse-geocode:
    get:
      summary: Reverse Geocoding — Koordinaten → Adresse
      description: >-
        Ermittelt aus geographischen Koordinaten (lat/lon) eine lesbare Adresse
        über OpenStreetMap Nominatim (Issue #866). Bei Rate-Limit/Timeout/Offline
        wird eine leere Adresse zurückgegeben (Position anzeigen ohne Adresse).
        Rate-Limit: 1 req/sec (Nominatim-Policy).
      operationId: reverseGeocode
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: string
            pattern: '^-?\d+\.?\d*$'
          description: Breitengrad (z. B. 52.52)
        - name: lon
          in: query
          required: true
          schema:
            type: string
            pattern: '^-?\d+\.?\d*$'
          description: Längengrad (z. B. 13.405)
      responses:
        '200':
          description: Adresse (leer bei Fehler/Rate-Limit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReverseGeocodeResponse'
        '400':
          description: Ungültige Parameter (fehlend oder keine Zahl)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /geocode-search:
    get:
      summary: Adresssuche (Forward Geocoding) — Suchtext → Adress-Vorschläge
      description: >-
        Sucht Adress-Vorschläge zu einem Suchtext über OpenStreetMap Nominatim, für
        die Ortsauswahl im Task-Formular. Bei Rate-Limit/Timeout/Offline wird eine
        leere Liste zurückgegeben. Rate-Limit: 1 req/sec (Nominatim-Policy).
      operationId: geocodeSearch
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Suchtext (z. B. "Musterstraße 1 Berlin")
      responses:
        '200':
          description: Adress-Vorschläge (leer bei Fehler/Rate-Limit, max. 5 Einträge)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeocodeSearchResult'
        '400':
          description: Ungültiger oder fehlender q-Parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores:
    get:
      summary: Vergebene Gamification-Punkte je erledigtem Task
      description: >-
        Liefert je erledigtem Task einen Score-Eintrag (Konzept §4.4): beim
        Statuswechsel auf `Done` werden Punkte aus `estimatedEffort × priority`
        vergeben, pünktlich (volle) bzw. verspätet (reduzierte Punkte).
      operationId: getScores
      responses:
        '200':
          description: Liste der vergebenen Score-Einträge
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoreEntry'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores/by-pillar:
    get:
      summary: Balance-Stand — Punkte anteilig je Säule aggregiert
      description: >-
        Aggregiert die vergebenen Punkte anteilig (über `share` aus
        `task_pillars`) je Säule — der sichtbare Balance-Stand der Säulen.
      operationId: getScoresByPillar
      responses:
        '200':
          description: Punkte-Summe je Säule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PillarScore'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores/streak:
    get:
      summary: Streak — Kalendertage in Folge mit mindestens einer Erledigung
      description: >-
        Wertet die Erledigungszeitpunkte der Tasks des eingeloggten Nutzers aus
        (#1360): `aktuell` ist die ununterbrochene Tagesfolge, die auf heute oder
        gestern endet, `best` die persönliche Bestmarke. Mehrere Erledigungen am
        selben Kalendertag zählen als ein Tag.
      operationId: getStreak
      parameters:
        - name: tz
          in: query
          required: false
          description: >-
            IANA-Zeitzone (z. B. `Europe/Berlin`), die die Kalendertagsgrenze
            bestimmt. Fehlt der Wert oder ist er keine gültige Zeitzone, wertet
            der Server in seiner eigenen Zeitzone aus — kein Fehler.
          schema:
            type: string
      responses:
        '200':
          description: Aktueller Streak und Bestmarke
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Streak'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores/milestones:
    get:
      summary: Meilenstein-Badges — feste Streak- und Punkte-Stufen (#1362)
      description: >-
        Wertet Streak (gegen die Bestmarke, #1360) und die Summe der Gamification-Punkte
        (`ScoreEntry.punkte`) des eingeloggten Nutzers rückwirkend gegen feste Stufen aus. Es gibt
        keinen gespeicherten Erreicht-Zustand — die Auswertung erfolgt bei jedem Aufruf neu.
      operationId: getMilestones
      parameters:
        - name: tz
          in: query
          required: false
          description: >-
            IANA-Zeitzone (z. B. `Europe/Berlin`), die die Kalendertagsgrenze des zugrunde
            liegenden Streaks bestimmt. Fehlt der Wert oder ist er keine gültige Zeitzone, wertet
            der Server in seiner eigenen Zeitzone aus — kein Fehler.
          schema:
            type: string
      responses:
        '200':
          description: Liste der Meilenstein-Stufen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Milestone'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores/missed:
    get:
      summary: Verpasste Aufgaben — vom Auto-Delete-Cron bereinigte Aufgaben (Sichtbarkeit im Bewertungssystem)
      description: >-
        Liefert die Aufgaben des eingeloggten Nutzers, die vom Auto-Delete-Cron
        (`runDeadlineAutoDelete`, Issue #523) wegen abgelaufener Deadline hart gelöscht
        wurden — als Schnappschuss zum Löschzeitpunkt, da die Original-Aufgabe danach
        nicht mehr existiert. Rein informativ: fließt NICHT in `berechneScore`,
        `berechneStreak` oder `berechneMeilensteine` ein — keine Minuspunkte, kein
        Streak-Malus.
      operationId: getMissedTasks
      responses:
        '200':
          description: Anzahl und jüngste Einträge der verpassten Aufgaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissedTasksSummary'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores/balance:
    get:
      summary: Lebensbalance-Stand — Füllstand des Dashboard-Herzens samt Säulen, Streak und Meilensteinen (#1423)
      description: >-
        Liefert den Stand des Dashboard-Herzens für den eingeloggten Nutzer in einer Antwort:
        Gesamt-Füllstand in Prozent, je Säule ihren Punktestand (anteilig auf die Säulen verteilter
        erledigter Aufwand) samt Gewichtung, den Streak und die **erreichten** Meilenstein-Stufen.
        Gerechnet wird über Säulen und Tasks des Nutzers (`ownerScope`) — gruppengeteilte fremde
        Aufgaben zählen bewusst nicht ein, auch wenn sie in `GET /tasks` sichtbar sind.
      operationId: getBalanceStatus
      parameters:
        - name: tz
          in: query
          required: false
          description: >-
            IANA-Zeitzone (z. B. `Europe/Berlin`), die die Kalendertagsgrenze des Streaks und der
            Meilensteine bestimmt. Fehlt der Wert oder ist er keine gültige Zeitzone, wertet der
            Server in seiner eigenen Zeitzone aus — kein Fehler.
          schema:
            type: string
      responses:
        '200':
          description: Aktueller Lebensbalance-Stand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceStatus'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores/balance/history:
    get:
      summary: Verlauf der Lebensbalance über einen Zeitraum (#1424)
      description: >-
        Rekonstruiert je Kalendertag des geschlossenen Intervalls `[von, bis]` den Stand des
        Dashboard-Herzens des eingeloggten Nutzers aus den Erledigungszeitpunkten
        (`ScoreEntry.zeitpunkt`) — kumulierend, sodass ein Tag ohne Erledigung den Vortag spiegelt.
        Ist `bis` der heutige Tag, stimmt der letzte Eintrag exakt mit `GET /scores/balance` überein.
        Gerechnet wird über Säulen und Tasks des Nutzers (`ownerScope`) — gruppengeteilte fremde
        Aufgaben zählen bewusst nicht ein.
      operationId: getBalanceHistory
      parameters:
        - name: von
          in: query
          required: true
          description: Erster Tag des Zeitraums (`YYYY-MM-DD`, inklusive).
          schema:
            type: string
        - name: bis
          in: query
          required: true
          description: Letzter Tag des Zeitraums (`YYYY-MM-DD`, inklusive, höchstens 366 Tage nach `von`).
          schema:
            type: string
        - name: tz
          in: query
          required: false
          description: >-
            IANA-Zeitzone (z. B. `Europe/Berlin`), die die Kalendertagsgrenze der Erledigungen
            bestimmt. Fehlt der Wert oder ist er keine gültige Zeitzone, wertet der Server in
            seiner eigenen Zeitzone aus — kein Fehler.
          schema:
            type: string
      responses:
        '200':
          description: Verlauf der Lebensbalance, ein Eintrag je Kalendertag des Zeitraums
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BalanceHistoryEntry'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /series:
    get:
      summary: Alle Serien-Templates auflisten
      operationId: getSeries
      responses:
        '200':
          description: Liste der Serien-Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Series'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Neues Serien-Template anlegen
      operationId: createSeries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesCreate'
      responses:
        '201':
          description: Template angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /series/{id}:
    parameters:
      - $ref: '#/components/parameters/SeriesId'
    get:
      summary: Ein Serien-Template abrufen
      operationId: getSeriesById
      responses:
        '200':
          description: Das Serien-Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Serien-Template teilweise aktualisieren (gilt nur für künftige Instanzen)
      operationId: updateSeries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesUpdate'
      responses:
        '200':
          description: Aktualisiertes Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Serien-Template löschen
      operationId: deleteSeries
      parameters:
        - name: cascade
          in: query
          required: false
          description: >-
            `true` löscht zusätzlich alle generierten Instanzen (Tasks mit dieser `seriesId`).
            Default `false`: nur das Template wird entfernt; die Instanzen bleiben erhalten und
            werden von der Serie abgekoppelt (`seriesId → null`). Ihre dauerhafte Provenienz
            (`originSeriesId`) bleibt erhalten, sodass sich ehemalige Instanzen später noch
            gruppieren/filtern lassen.
          schema:
            type: boolean
      responses:
        '204':
          description: Template gelöscht
        '404':
          $ref: '#/components/responses/NotFound'
  /series/generate-all:
    post:
      summary: Fällige Instanzen aller aktiven Serien materialisieren (idempotent)
      description: >-
        Stößt die serverseitige Materialisierung an: erzeugt je fälligem Termin
        aller aktiven Serien (im Auth-Modus nur der eigenen) eine eigenständige
        `Task`-Instanz. Bereits materialisierte Termine werden übersprungen
        (keine Dubletten). Gibt die Anzahl der neu erzeugten Instanzen zurück.
      operationId: generateAllSeries
      responses:
        '200':
          description: Anzahl der neu materialisierten Instanzen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesGenerateAllResult'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /series/{id}/generate:
    parameters:
      - $ref: '#/components/parameters/SeriesId'
    post:
      summary: Fällige Instanzen bis `until` materialisieren (idempotent)
      description: >-
        Erzeugt je fälligem Termin im Fenster `[startDate, until]` genau eine
        eigenständige `Task`-Instanz mit `seriesId`. Bereits materialisierte
        Termine werden übersprungen (keine Dubletten). Gibt nur die neu
        erzeugten Instanzen zurück.
      operationId: generateSeriesInstances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesGenerateInput'
      responses:
        '201':
          description: Neu materialisierte Instanzen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /push/vapid-public-key:
    get:
      summary: Öffentlichen VAPID-Schlüssel für Web-Push abrufen
      description: >-
        Liefert den öffentlichen VAPID-Schlüssel, den das Frontend für
        `PushManager.subscribe({ applicationServerKey })` benötigt (Issue #355).
        503, wenn Web-Push serverseitig nicht konfiguriert ist (VAPID-Schlüssel
        fehlen).
      operationId: getVapidPublicKey
      responses:
        '200':
          description: Der öffentliche VAPID-Schlüssel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VapidPublicKey'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /push/subscribe:
    post:
      summary: Web-Push-Subscription des Nutzers speichern
      description: >-
        Speichert die vom Browser (`PushManager.subscribe()`) erzeugte
        Subscription unter dem eingeloggten Nutzer (Datenisolation #207).
        Idempotent: eine bereits bekannte `endpoint`-URL wird aktualisiert statt
        dupliziert. 503, wenn Web-Push nicht konfiguriert ist.
      operationId: subscribePush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionInput'
      responses:
        '201':
          description: Subscription gespeichert/aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscriptionAck'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /push/unsubscribe:
    post:
      summary: Web-Push-Subscription des Nutzers löschen
      description: >-
        Entfernt die Subscription des eingeloggten Nutzers zum angegebenen
        `endpoint`. Idempotent: unbekannter Endpoint ⇒ trotzdem 200. 503, wenn
        Web-Push nicht konfiguriert ist.
      operationId: unsubscribePush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushUnsubscribeInput'
      responses:
        '200':
          description: Subscription entfernt (oder war nicht vorhanden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscriptionAck'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /push/test:
    post:
      summary: Test-Push mit zufälligem Zitat senden
      description: >-
        Sendet einen Test-Push an alle Subscriptions des eingeloggten Nutzers.
        Das Zitat wird zufällig aus 10 fixen Lebensweisheiten gewählt. 503, wenn
        Web-Push nicht konfiguriert ist.
      operationId: sendTestPush
      tags: [push]
      responses:
        '200':
          description: Test-Push abgeschickt (auch wenn keine Subscription vorhanden, sent=0)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestPushResult'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /mail/test:
    post:
      summary: Testmail über den konfigurierten SMTP-Server versenden
      description: >-
        Sendet eine Testmail an die E-Mail-Adresse des angemeldeten Admins
        (Issue #1426). Nur für Admins (`member` → 403, keine Session → 401).
        503, wenn SMTP nicht konfiguriert ist; 502, wenn der Transport wirft.
      operationId: sendTestMail
      tags: [mail]
      responses:
        '200':
          description: Testmail abgeschickt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestMailResult'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Angemeldeter Nutzer ist kein Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /llm-providers:
    get:
      summary: Konfigurierte LLM-Provider auflisten
      description: >-
        Listet alle LLM-Provider inklusive effektiver Aktiv-Markierung — Built-ins
        (Mistral/OpenRouter) zuerst, danach die Custom-Provider. Ohne explizit
        aktiven Provider ist der Built-in-Fallback als aktiv markiert. API-Keys
        werden bewusst NICHT zurückgegeben (Write-Only).
      operationId: listLlmProviders
      tags: [llm]
      responses:
        '200':
          description: Liste aller Provider (ohne API-Keys)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LlmProvider'
    post:
      summary: Neuen Custom-Provider anlegen
      description: >-
        Legt einen neuen Custom-Provider an — inaktiv (Aktivierung über die
        Radio-Auswahl) und ohne Modell (Wahl über die Modellliste). Der Endpoint
        muss eine gültige http(s)-URL sein; andernfalls HTTP 400. Die Antwort
        enthält den Provider ohne API-Key.
      operationId: createLlmProvider
      tags: [llm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmProviderInput'
      responses:
        '201':
          description: Provider angelegt (ohne API-Key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProvider'
        '400':
          description: Ungültiger Payload (Validierung fehlgeschlagen)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /llm-providers/selection:
    get:
      summary: Gewählten LLM-Provider des Nutzers abfragen
      description: >-
        Liefert die Provider-Auswahl des eingeloggten Nutzers für seine KI-Aufrufe
        (#1548). `providerId: null` = keine Auswahl — die Auflösung fällt auf den
        instanzweit aktiven Provider zurück.
      operationId: getLlmProviderSelection
      tags: [llm]
      responses:
        '200':
          description: Aktuelle Auswahl des Nutzers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProviderSelection'
        '401':
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Provider für die KI-Aufrufe des Nutzers wählen
      description: >-
        Speichert die Provider-Auswahl des eingeloggten Nutzers (#1548): eigene oder
        instanzweite Provider-ID; `null` hebt die Auswahl auf. Nur eine Auswahl auf einen
        EIGENEN Provider ist wirksam (Gate- und Kontingent-Bypass); instanzweite Provider
        sind wählbar, wirken aber wie keine Auswahl. Eine fremde Provider-ID antwortet 404.
      operationId: setLlmProviderSelection
      tags: [llm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmProviderSelection'
      responses:
        '200':
          description: Auswahl gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProviderSelection'
        '400':
          description: Ungültiger Payload (providerId keine positive Ganzzahl/null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Provider nicht gefunden (fremde ID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /llm-providers/test-dry:
    post:
      summary: Provider-Entwurf testen (ohne Speichern)
      description: >-
        Prüft die Verbindung mit den unveränderten Formulardaten aus dem
        Anlege-/Bearbeiten-Dialog (#1577): dieselbe Test-Logik wie
        `POST /llm-providers/{id}/test`, aber mit einer Laufzeit-Konfiguration
        aus dem Request-Body statt aus einer DB-Zeile. Legt oder verändert
        keinen Provider und schreibt kein Test-Ergebnis in den Cooldown-Cache.
        Bei leerem `apiKey` mit `providerId` wird der gespeicherte Key des
        Providers genutzt; fremde oder unbekannte `providerId` antworten 404.
      operationId: testLlmProviderDraft
      tags: [llm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmProviderTestDraft'
      responses:
        '200':
          description: Testergebnis (Feld `ok` unterscheidet Erfolg/Misserfolg)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProviderTestResult'
        '400':
          description: Ungültiger Payload (endpoint/model/apiKey/providerId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Nicht angemeldet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Provider nicht gefunden (fremde providerId)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /llm-providers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Providers
        schema:
          type: integer
    put:
      summary: LLM-Provider aktualisieren
      description: >-
        Aktualisiert einen Provider. Alle Felder optional: abwesende Felder bleiben
        unverändert. Der API-Key wird nur gesetzt, wenn ein nicht-leerer String
        übergeben wird (Write-Only, Bearbeiten-Dialog startet leer). Für Built-in-
        Provider ist ausschließlich `model` erlaubt — andere Felder führen zu HTTP 400.
      operationId: updateLlmProvider
      tags: [llm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmProviderUpdate'
      responses:
        '200':
          description: Aktualisierter Provider (ohne API-Key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProvider'
        '400':
          description: Ungültiger Payload oder Built-in-Provider (nur `model` erlaubt)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Provider unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Custom-Provider löschen
      description: >-
        Löscht einen Custom-Provider (Built-ins antworten HTTP 400). War er aktiv,
        übernimmt automatisch der Built-in-Fallback. Response 204 ohne Body.
      operationId: deleteLlmProvider
      tags: [llm]
      responses:
        '204':
          description: Provider gelöscht
        '400':
          description: Built-in-Provider ist fix und nicht löschbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Provider unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /llm-providers/{id}/activate:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Providers
        schema:
          type: integer
    post:
      summary: Provider als aktiv setzen
      description: >-
        Setzt den Provider als einzigen aktiven Provider: alle anderen werden
        deaktiviert (Radio-Button-Logik) — für Custom- UND Built-in-Provider.
      operationId: activateLlmProvider
      tags: [llm]
      responses:
        '200':
          description: Aktivierter Provider (ohne API-Key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProvider'
        '404':
          description: Provider unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /llm-providers/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Providers
        schema:
          type: integer
    post:
      summary: Provider-Verbindung testen
      description: >-
        Schickt einen minimalen Test-Prompt über den Provider — mit denselben
        Parametern wie echte KI-Aufrufe (Modell, Key, Endpoint,
        JSON-Mode) — und meldet Erfolg inkl. Latenz oder die konkrete
        Fehlerursache (Auth/Modell/Abo/Netzwerk) mit vom Upstream
        gelieferter Detailmeldung. Testet den Provider unabhängig davon,
        ob er aktiv ist — so lässt sich ein neu angelegter Provider vor der
        Aktivierung prüfen.
      operationId: testLlmProvider
      tags: [llm]
      responses:
        '200':
          description: Testergebnis (Feld `ok` unterscheidet Erfolg/Misserfolg)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProviderTestResult'
        '404':
          description: Provider unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /llm-providers/{id}/models:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Providers
        schema:
          type: integer
    get:
      summary: Verfügbare Modelle eines Providers lesen
      description: >-
        Fragt die Modellliste des Providers von dessen OpenAI-kompatiblen
        `GET /models`-Endpoint ab (mit API-Key, falls vorhanden) und liefert sie
        nach `id` sortiert — die Basis für die Modell-Auswahl im Frontend. Das
        Ergebnis wird serverseitig kurz (5 min) je Provider gecacht. Ist der
        Upstream nicht erreichbar oder antwortet ungültig, folgt HTTP 502.
      operationId: listLlmProviderModels
      tags: [llm]
      responses:
        '200':
          description: Verfügbare Modelle des Providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmModels'
        '404':
          description: Provider unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/BadGateway'
  /geo-config:
    get:
      summary: Geo-Konfiguration des Users lesen
      description: >-
        Liefert die serverseitig pro User gespeicherte Geo-Konfiguration (#1098):
        Anzeige-Entfernung, Alarm-Entfernung und Aktualisierungsintervall. Ohne
        gespeicherte Werte gelten die Defaults 5 km / 1 km / 5 Minuten.
      operationId: getGeoConfig
      tags: [geo]
      responses:
        '200':
          description: Aktuelle Geo-Konfiguration (inkl. Defaults)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoConfig'
    put:
      summary: Geo-Konfiguration des Users speichern
      description: >-
        Speichert die Geo-Konfiguration (#1098). Kreuz-Schranken-Validierung:
        `alarmDistanceKm` in [1, displayDistanceKm], `displayDistanceKm` in
        [alarmDistanceKm, 50], `intervalMinutes` in [1, 60]; alle Werte ganze
        Zahlen. Verstöße → HTTP 400 ohne Persistenz.
      operationId: updateGeoConfig
      tags: [geo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoConfig'
      responses:
        '200':
          description: Gespeicherte Geo-Konfiguration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoConfig'
        '400':
          description: Ungültige Werte (Schranken verletzt)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/PlanRequired'
  /geo/position:
    post:
      summary: Positionsmeldung des Clients
      description: >-
        Meldet die aktuelle Position (#1101): der Server prüft daraufhin
        (Fire-and-forget) die offenen Aufgaben im Alarmabstand des Users und
        stößt ggf. eine gebündelte Push-Nachricht an. Wird vom Client im
        konfigurierten Intervall (`intervalMinutes`, #1098) aufgerufen.
      operationId: reportGeoPosition
      tags: [geo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lon]
              properties:
                lat:
                  type: number
                  format: double
                  description: Breitengrad (z. B. 52.52)
                lon:
                  type: number
                  format: double
                  description: Längengrad (z. B. 13.405)
      responses:
        '204':
          description: Meldung entgegengenommen (Versand läuft im Hintergrund)
        '400':
          description: Ungültige Koordinaten (keine Zahl oder außerhalb des Wertebereichs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Anmeldung erforderlich (kein anmeldefreier Pass-Through-Modus aktiv)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/PlanRequired'
  /profile:
    get:
      summary: Anzeigename, E-Mail und Avatar des Nutzers lesen
      description: >-
        Liefert den Anzeigenamen, die E-Mail-Adresse und die Avatar-URL des
        angemeldeten Nutzers (#1219). Im lokalen Pass-Through-Modus ohne
        Auth-Kontext wird der gemeinsame Entwicklungs-Nutzer bedient.
      operationId: getProfile
      tags: [profile]
      responses:
        '200':
          description: Profildaten des Nutzers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Anzeigenamen speichern
      description: >-
        Ändert ausschließlich den Anzeigenamen (#1219); die Session wird nachgezogen,
        sodass `/auth/me` sofort den neuen Namen liefert. Nach `trim()` leer oder
        länger als 60 Zeichen → HTTP 400 ohne Persistenz. `email`, `passwordHash`
        und unbekannte Felder im Body werden ignoriert.
      operationId: updateProfile
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 60
      responses:
        '200':
          description: Gespeicherte Profildaten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Ungültiger Anzeigename (leer oder länger als 60 Zeichen)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /groups:
    get:
      summary: Gruppen des angemeldeten Nutzers auflisten
      description: >-
        Listet alle Gruppen, in denen der angemeldete Nutzer Mitglied ist,
        inklusive seiner Rolle und der Mitgliederzahl (#1211).
      operationId: listGroups
      tags: [groups]
      responses:
        '200':
          description: Liste der Gruppen mit eigener Rolle
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
    post:
      summary: Neue Gruppe anlegen
      description: >-
        Legt eine Gruppe an; der Ersteller wird automatisch Mitglied mit Rolle
        `admin`. Name nach Trim nicht leer und maximal 60 Zeichen, sonst HTTP 400.
      operationId: createGroup
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInput'
      responses:
        '201':
          description: Gruppe angelegt (Ersteller ist Admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Ungültiger Payload (Name fehlt oder ist zu lang)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/PlanRequired'
  /groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Gruppe
        schema:
          type: integer
    get:
      summary: Einzelne Gruppe abrufen
      description: >-
        Liefert die Gruppe, wenn der angemeldete Nutzer Mitglied ist — sonst
        HTTP 404 (keine Existenz-Leak).
      operationId: getGroup
      tags: [groups]
      responses:
        '200':
          description: Gruppe mit Rolle des aufrufenden Nutzers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: Gruppe unbekannt oder kein Mitglied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Gruppe umbenennen oder Beschreibung ändern
      description: >-
        Nur für Admins (andere Mitglieder: HTTP 404). Abwesende Felder bleiben
        unverändert; Name nach Trim nicht leer und maximal 60 Zeichen, sonst
        HTTP 400.
      operationId: updateGroup
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdate'
      responses:
        '200':
          description: Aktualisierte Gruppe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '400':
          description: Ungültiger Payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '404':
          description: Gruppe unbekannt, kein Mitglied oder kein Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Gruppe löschen
      description: >-
        Löscht die Gruppe inklusive aller Mitglieder-Einträge (Cascade). Nur
        Admins (andere: HTTP 404). Response 204 ohne Body.
      operationId: deleteGroup
      tags: [groups]
      responses:
        '204':
          description: Gruppe gelöscht
        '403':
          $ref: '#/components/responses/PlanRequired'
        '404':
          description: Gruppe unbekannt, kein Mitglied oder kein Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/search:
    get:
      summary: Konten für eine Einladung suchen
      description: >-
        Trefferliste für den Einladungsfluss (#1212): volle E-Mail-Adresse als
        Exact-Match ODER displayName-Fragment ab 3 Zeichen. Das DTO enthält nie
        die E-Mail. Zu kurze Anfragen und Nulltreffer liefern 200 mit [].
      operationId: searchUsers
      tags: [groups]
      parameters:
        - name: query
          in: query
          required: true
          description: Volle E-Mail-Adresse oder Namensfragment ab 3 Zeichen
          schema:
            type: string
      responses:
        '200':
          description: Trefferliste (nur id und displayName)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSearchHit'
  /admin/users:
    get:
      summary: Alle Nutzer der App auflisten
      description: >-
        Rollensystem admin/member: nur für Admins (403 sonst). Liefert jeden
        registrierten Nutzer mit E-Mail, Anzeigename und aktueller Rolle.
      operationId: listAdminUsers
      tags: [admin]
      responses:
        '200':
          description: Alle Nutzer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
        '403':
          description: Angemeldeter Nutzer ist kein Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users/{id}/role:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Nutzers
        schema:
          type: integer
    patch:
      summary: Rolle eines Nutzers ändern
      description: >-
        Rollensystem admin/member/tester: nur für Admins (403 sonst). Der letzte
        verbleibende Administrator kann nicht auf `member` oder `tester`
        zurückgestuft werden (409), damit die App nie ohne Administrator dasteht.
      operationId: updateAdminUserRole
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserRoleUpdate'
      responses:
        '200':
          description: Nutzer mit aktualisierter Rolle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          description: Ungültiger Rollenwert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Angemeldeter Nutzer ist kein Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Nutzer unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Letzter verbleibender Administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/users/{id}/plan:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Nutzers
        schema:
          type: integer
    patch:
      summary: Paket eines Nutzers setzen
      description: >-
        Manuelle Paketvergabe durch einen Admin (#1456) — für Admins und Tester (#1566);
        ein Tester darf nur die eigene Id setzen (403 sonst). Bis zur Selbstbedienung
        (T7) der einzige Weg, ein Paket zu vergeben; ohne Zahlungsbezug.
      operationId: updateAdminUserPlan
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserPlanUpdate'
      responses:
        '200':
          description: Nutzer mit aktualisiertem Paket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          description: Ungültige Nutzer-Id oder ungültiger Paketwert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Angemeldeter Nutzer ist kein Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Nutzer unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/tasks/reassign-pillars:
    post:
      summary: Säulenverteilung aller Aufgaben neu berechnen (Batch)
      description: >-
        Admin-getriggert: Berechnet die Säulen-Beiträge ALLER Aufgaben (aller
        Konten, einschließlich der erledigten) anhand des Aufgabenkontexts
        (Titel/Beschreibung) per KI-Klassifikator neu und speichert sie. Status,
        Punkte und Streak bleiben unberührt — der Batch öffnet Aufgaben nur für
        die Neuberechnung ihrer Verteilung, nicht im Status-Sinn. Aufgaben ohne
        brauchbaren Vorschlag behalten ihre bisherige Zuordnung; ein Fehler bei
        einer Aufgabe reißt den Lauf nicht ab. Bewusst manuell (kein Cron), damit
        der LLM-Upstream nicht unbemerkt dauerhaft läuft.
      operationId: reassignTaskPillars
      tags: [admin]
      parameters:
        - name: provider
          in: query
          required: false
          description: >-
            Optionaler Provider-Pinning (#749/#951): Name eines konfigurierten
            Providers — überschreibt den aktiven Provider für diesen Aufruf.
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          required: false
          description: >-
            Obergrenze der in diesem Lauf verarbeiteten Aufgaben (Default 200).
            So lässt sich ein großer Bestand in mehreren Aufrufen abarbeiten,
            statt den Request bis zum offenen HTTP-Timeout laufen zu lassen —
            `remaining` in der Antwort zeigt, wie viele Aufgaben noch offen sind.
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          required: false
          description: >-
            Anzahl bereits verarbeiteter Aufgaben vorheriger Läufe derselben
            Portionierungs-Serie (Default 0) — ohne ihn träfe jeder Aufruf
            wieder dieselbe erste `limit`-Portion. Zum Fortsetzen die Summe aus
            `updated`+`failed`+`skipped` aller vorherigen Läufe übergeben.
          schema:
            type: integer
            minimum: 0
        - name: status
          in: query
          required: false
          description: >-
            Statusauswahl des Laufs (Default `all`). `open` umfasst offene UND
            in Bearbeitung befindliche Aufgaben, `done` nur erledigte.
          schema:
            $ref: '#/components/schemas/ReassignStatusFilter'
      responses:
        '200':
          description: Ergebnis des Batch-Laufs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReassignPillarsResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Angemeldeter Nutzer ist kein Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Es läuft bereits ein Batch-Lauf (prozessweites Lauf-Flag) — erst
            dessen Ende abwarten.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/reassign-pillars:
    post:
      summary: Säulenverteilung der eigenen Aufgaben neu berechnen
      description: >-
        Berechnet die Säulen-Beiträge der EIGENEN Aufgaben anhand des
        Aufgabenkontexts (Titel/Beschreibung) per KI-Klassifikator neu — das
        nutzereigene Gegenstück zum app-weiten Admin-Batch. Status, Punkte und
        Streak bleiben unberührt. Aufgaben ohne brauchbaren Vorschlag behalten
        ihre bisherige Zuordnung; ein Fehler bei einer Aufgabe reißt den Lauf
        nicht ab. Jede klassifizierte Aufgabe bucht einen Punkt des monatlichen
        KI-Kontingents — ist es mitten im Lauf aufgebraucht, endet der Lauf und
        meldet das über `quotaExhausted`.
      operationId: reassignOwnTaskPillars
      tags: [tasks]
      parameters:
        - name: provider
          in: query
          required: false
          description: Optionales Provider-Pinning (#749/#951).
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          required: false
          description: >-
            Obergrenze der in diesem Lauf verarbeiteten Aufgaben (Default 200).
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          required: false
          description: >-
            Anzahl bereits verarbeiteter Aufgaben vorheriger Läufe derselben
            Portionierungs-Serie (Default 0).
          schema:
            type: integer
            minimum: 0
        - name: status
          in: query
          required: false
          description: >-
            Statusauswahl des Laufs (Default `all`). `open` umfasst offene UND
            in Bearbeitung befindliche Aufgaben, `done` nur erledigte.
          schema:
            $ref: '#/components/schemas/ReassignStatusFilter'
      responses:
        '200':
          description: Ergebnis des Laufs über die eigenen Aufgaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnReassignPillarsResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Das Paket des Nutzers schließt die KI-Funktionen aus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Für dieses Konto läuft bereits eine Neuberechnung, oder der
            app-weite Admin-Batch ist gerade unterwegs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Monatliches KI-Kontingent aufgebraucht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /groups/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Gruppe
        schema:
          type: integer
    get:
      summary: Mitglieder einer Gruppe auflisten
      description: >-
        Jedes Mitglied (Admin oder Mitglied) sieht die Liste; fremde Gruppe 404.
      operationId: listGroupMembers
      tags: [groups]
      responses:
        '200':
          description: Mitglieder mit Anzeigename und Rolle
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupMember'
        '404':
          description: Gruppe unbekannt oder kein Mitglied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /groups/{id}/members/{userId}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Gruppe
        schema:
          type: integer
      - name: userId
        in: path
        required: true
        description: ID des zu entfernenden Kontos
        schema:
          type: integer
    patch:
      summary: Rolle eines Mitglieds ändern
      description: >-
        Nur Admins (#1221). Nicht-Mitglieder erhalten 404 (kein
        Existenz-Leak), Mitglieder ohne Adminrechte 403. Die Rückstufung des
        letzten verbleibenden Administrators wird abgelehnt (409, dieselbe
        Prüfung wie beim Entfernen).
      operationId: updateGroupMemberRole
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMemberRoleUpdate'
      responses:
        '200':
          description: Mitglied mit aktualisierter Rolle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMember'
        '400':
          description: Ungültiger Rollenwert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Mitglied ohne Adminrechte ändert eine Rolle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gruppe oder Mitglied unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Letzter Administrator der Gruppe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Mitglied entfernen oder Gruppe verlassen
      description: >-
        Admins entfernen beliebige Mitglieder, jedes Mitglied sich selbst
        (#1212 AK9). Der letzte verbleibende Admin wird nicht entfernt (409).
      operationId: removeGroupMember
      tags: [groups]
      responses:
        '204':
          description: Mitglied entfernt
        '403':
          description: Mitglied ohne Adminrechte entfernt ein fremdes Konto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gruppe oder Mitglied unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Letzter Administrator der Gruppe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /groups/{id}/tasks:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Gruppe
        schema:
          type: integer
    get:
      summary: Füreinander angelegte Aufgaben der Gruppe auflisten
      description: >-
        Offene Aufgaben, die ein Gruppenmitglied für ein anderes Mitglied
        angelegt hat (#1223). Selbst-Aufgaben und Altbestand ohne Ersteller
        bleiben privat (auch für Admins); erledigte Aufgaben erscheinen nicht.
        Reduzierter Feldsatz ohne Beschreibung, Checkliste und Ids. Fremde
        Gruppe 404, unauthentifiziert 401 (globales requireAuth).
      operationId: listGroupTasks
      tags: [groups]
      responses:
        '200':
          description: Füreinander angelegte offene Aufgaben, sortiert nach Empfänger und Fälligkeit
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupTask'
        '404':
          description: Gruppe unbekannt oder kein Mitglied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /groups/{id}/series:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Gruppe
        schema:
          type: integer
    get:
      summary: Füreinander angelegte Serien der Gruppe auflisten
      description: >-
        Serien, die ein Gruppenmitglied für ein anderes Mitglied angelegt hat
        (#1254). Selbst-Anlagen und Altbestand ohne Ersteller bleiben privat
        (auch für Admins); ruhende Serien sind enthalten und als active:false
        gekennzeichnet. Reduzierter Feldsatz ohne Beschreibung, Adresse,
        Koordinaten und Nutzer-Ids. Fremde Gruppe 404, unauthentifiziert 401
        (globales requireAuth).
      operationId: listGroupSeries
      tags: [groups]
      responses:
        '200':
          description: Füreinander angelegte Serien, sortiert nach Eigentümer und Titel
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupSeries'
        '404':
          description: Gruppe unbekannt oder kein Mitglied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /groups/{id}/invitations:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Gruppe
        schema:
          type: integer
    get:
      summary: Offene Einladungen einer Gruppe auflisten
      description: Nur Admins (andere Mitglieder 403, Nicht-Mitglieder 404).
      operationId: listGroupInvitations
      tags: [groups]
      responses:
        '200':
          description: Offene Einladungen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupInvitation'
        '403':
          description: Mitglied ohne Adminrechte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gruppe unbekannt oder kein Mitglied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Konto in die Gruppe einladen
      description: >-
        Nur Admins (andere Mitglieder 403, Nicht-Mitglieder 404). Eine zweite
        offene Einladung für dasselbe Konto und eine bestehende Mitgliedschaft
        liefern 409; nach einer Ablehnung ist eine neue Einladung möglich.
      operationId: createGroupInvitation
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupInvitationInput'
      responses:
        '201':
          description: Angelegte Einladung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupInvitation'
        '400':
          description: Ungültiger Payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Mitglied ohne Adminrechte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gruppe oder Konto unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Bereits Mitglied oder bereits eingeladen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /groups/{id}/invite-links:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Gruppe
        schema:
          type: integer
    post:
      summary: Teilbaren Einladungslink erzeugen
      description: >-
        Nur Admins (andere Mitglieder 403, Nicht-Mitglieder 404). Jeder Aufruf
        erzeugt einen neuen, anderen Token; der Link ist 7 Tage gültig und
        lässt sich jederzeit ungültig machen. Der Token wird ausschließlich in
        dieser Antwort übermittelt.
      operationId: createGroupInviteLink
      tags: [groups]
      responses:
        '201':
          description: Erzeugter Einladungslink
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupInviteLink'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Mitglied ohne Adminrechte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Gruppe unbekannt oder kein Mitglied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /plans:
    get:
      summary: Paket-Katalog öffentlich abrufen
      description: >-
        Öffentlich ohne Anmeldung (#1456): Feature-Matrix und Preise je Paket.
        Der Inhalt stammt unverändert aus der Rechte-Zentrale
        (`server/src/logics/plans.ts`) — es gibt keine zweite Kopie der Matrix.
      operationId: getPlans
      tags: [plans]
      responses:
        '200':
          description: Feature-Matrix und Preise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlansCatalog'
  /invite-links/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: Token des Einladungslinks
        schema:
          type: string
    get:
      summary: Einladungslink öffentlich abrufen
      description: >-
        Öffentlich ohne Anmeldung (#1226). Liefert ausschließlich Gruppenname
        und Anzeigename des Einladenden — keine Mitglieder, keine E-Mails.
        Unbekanntes Token 404, abgelaufenes oder widerrufenes Token 410.
      operationId: getInviteLink
      tags: [groups]
      responses:
        '200':
          description: Linkvorschau
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteLinkPreview'
        '404':
          description: Einladungslink unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Einladungslink abgelaufen oder widerrufen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /invite-links/{token}/redeem:
    parameters:
      - name: token
        in: path
        required: true
        description: Token des Einladungslinks
        schema:
          type: string
    post:
      summary: Einladungslink einlösen (Gruppe beitreten)
      description: >-
        Hinter der Anmeldung (401 ohne Session). Der Aufrufer wird Mitglied mit
        Rolle „member"; eine bestehende Mitgliedschaft — egal wie entstanden —
        liefert 409. Unbekanntes Token 404, abgelaufen/widerrufen 410.
      operationId: redeemInviteLink
      tags: [groups]
      responses:
        '200':
          description: Beigetretene Gruppe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteLinkRedeemResult'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '404':
          description: Einladungslink unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Bereits Mitglied dieser Gruppe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Einladungslink abgelaufen oder widerrufen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /invite-links/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Einladungslinks
        schema:
          type: integer
    delete:
      summary: Einladungslink ungültig machen
      description: >-
        Nur Admins der Gruppe (Mitglied 403, fremde Gruppe oder unbekannter
        Link 404). Setzt `revokedAt`; Einlösen und öffentliches GET liefern
        danach 410.
      operationId: revokeInviteLink
      tags: [groups]
      responses:
        '204':
          description: Einladungslink ungültig gemacht (kein Inhalt)
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Mitglied ohne Adminrechte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Einladungslink unbekannt oder fremde Gruppe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /invitations:
    get:
      summary: Eigene offene Einladungen auflisten
      description: Gruppenübergreifend alle offenen Einladungen des angemeldeten Kontos.
      operationId: listReceivedInvitations
      tags: [groups]
      responses:
        '200':
          description: Offene Einladungen mit Gruppen- und Einladenden-Namen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReceivedInvitation'
  /invitations/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Einladung
        schema:
          type: integer
    post:
      summary: Einladung annehmen
      description: Nur der Eingeladene selbst; legt die Mitgliedschaft mit Rolle „member" an.
      operationId: acceptInvitation
      tags: [groups]
      responses:
        '200':
          description: Beigetretene Gruppe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResult'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '404':
          description: Einladung unbekannt oder fremd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /invitations/{id}/decline:
    parameters:
      - name: id
        in: path
        required: true
        description: ID der Einladung
        schema:
          type: integer
    post:
      summary: Einladung ablehnen
      description: Nur der Eingeladene selbst; die Mitgliederliste bleibt unverändert.
      operationId: declineInvitation
      tags: [groups]
      responses:
        '200':
          description: Abgelehnte Einladung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResult'
        '404':
          description: Einladung unbekannt oder fremd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api-tokens:
    get:
      summary: Eigene API-Tokens auflisten
      description: >-
        Liefert die nicht zurückgezogenen persönlichen API-Tokens des angemeldeten
        Nutzers (#1352) — ausschließlich Metadaten, nie den Klartext oder den Hash.
      operationId: listApiTokens
      tags: [api-tokens]
      responses:
        '200':
          description: Liste der eigenen Tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiToken'
    post:
      summary: Persönlichen API-Token erzeugen
      description: >-
        Legt einen neuen persönlichen API-Token an (#1352). Der Klartext ist
        ausschließlich in dieser einen Antwort enthalten und danach nicht mehr
        abrufbar; gespeichert wird nur sein Hash.
      operationId: createApiToken
      tags: [api-tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenInput'
      responses:
        '201':
          description: Angelegter Token inklusive einmaligem Klartext
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiToken'
        '400':
          description: >-
            Ungültiger Name (leer oder länger als 60 Zeichen) oder fehlende/ungültige
            Laufzeit (expiresInDays muss 30, 90, 180 oder 365 sein, #1357)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api-tokens/{id}:
    delete:
      summary: API-Token zurückziehen
      description: >-
        Zieht einen eigenen API-Token zurück (#1352). Ab dem nächsten Aufruf wird
        jeder Request mit diesem Token mit 401 abgewiesen. Fremde oder unbekannte
        Tokens liefern 404.
      operationId: deleteApiToken
      tags: [api-tokens]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Id des zurückzuziehenden Tokens
      responses:
        '204':
          description: Token zurückgezogen
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Rechtestufe eines API-Tokens umschalten
      description: >-
        Setzt die Rechtestufe (`scope`) eines eigenen API-Tokens (#1356). Der neue Wert
        gilt sofort für denselben Token, ohne dass er neu erzeugt werden muss.
      operationId: updateApiToken
      tags: [api-tokens]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Id des umzuschaltenden Tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenScopeInput'
      responses:
        '200':
          description: Aktualisierter Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiToken'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /place-favorites:
    get:
      summary: Gespeicherte Orte auflisten
      description: >-
        Liefert die gespeicherten Orte („Standort-Favoriten") des angemeldeten Nutzers
        (#1342) — ausschließlich die eigenen Einträge.
      operationId: listPlaceFavorites
      tags: [place-favorites]
      responses:
        '200':
          description: Liste der eigenen gespeicherten Orte
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaceFavorite'
    post:
      summary: Gespeicherten Ort anlegen
      description: >-
        Legt einen gespeicherten Ort an (#1342). Koordinaten sind optional: ein Freitext-Ort
        ohne Geocoding-Treffer wird mit `latitude`/`longitude: null` gespeichert.
      operationId: createPlaceFavorite
      tags: [place-favorites]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceFavoriteInput'
      responses:
        '201':
          description: Angelegter gespeicherter Ort
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceFavorite'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/PlanRequired'
  /place-favorites/{id}:
    delete:
      summary: Gespeicherten Ort löschen
      description: >-
        Entfernt einen eigenen gespeicherten Ort endgültig (#1342). Fremde oder unbekannte
        Einträge liefern 404.
      operationId: deletePlaceFavorite
      tags: [place-favorites]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Id des gespeicherten Orts
      responses:
        '204':
          description: Gespeicherter Ort gelöscht
        '403':
          $ref: '#/components/responses/PlanRequired'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/me:
    get:
      summary: Angemeldeten Nutzer lesen
      description: >-
        Liefert Session-Daten, Paket, Entitlements und Abo-Status des angemeldeten
        Nutzers (Issue #206/#1456/#1494). Im lokalen Pass-Through-Modus (kein
        Auth-Kontext konfiguriert) antwortet ein synthetischer Entwicklungs-Nutzer
        statt 401.
      operationId: getMe
      tags: [auth]
      responses:
        '200':
          description: Aktueller Nutzer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: Anmeldung erforderlich (Auth-Kontext konfiguriert, keine Session)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/providers:
    get:
      summary: Verfügbare Anmeldewege lesen
      description: >-
        Zeigt der Login-Seite, welche Anmeldewege auf dieser Instanz konfiguriert
        sind: Google-OAuth (Client-Credentials gesetzt) und Magic Link per E-Mail
        (SMTP und `PUBLIC_BASE_URL` gesetzt). Öffentlich, ohne Session.
      operationId: getAuthProviders
      tags: [auth]
      responses:
        '200':
          description: Konfigurierte Anmeldewege
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProviders'
  /auth/magic-link:
    post:
      summary: Anmeldelink per E-Mail anfordern
      description: >-
        Verschickt einen 15 Minuten gültigen Einmal-Link an die Adresse, sofern sie
        zugelassen ist (E-Mail-Allowlist). Die Antwort ist unabhängig davon immer 202,
        damit sich zugelassene Adressen nicht ausspähen lassen. Pro Adresse gehen
        höchstens drei Links je 15 Minuten raus; weitere Anfragen werden still verworfen.
      operationId: requestMagicLink
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
      responses:
        '202':
          description: Anfrage angenommen (Mail nur bei zugelassener Adresse)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/magic-link/verify:
    post:
      summary: Anmeldelink einlösen
      description: >-
        Löst den Token aus dem Anmeldelink ein und meldet den Nutzer an. Existiert
        zur E-Mail noch kein Konto, wird es angelegt (Verknüpfung über die E-Mail wie
        beim Google-Login). Ein Token gilt genau einmal. Bewusst POST statt GET:
        Mail-Scanner rufen Links vorab auf und würden den Token sonst verbrauchen.
      operationId: verifyMagicLink
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkVerifyRequest'
      responses:
        '204':
          description: Angemeldet, Session-Cookie gesetzt
        '400':
          description: Token unbekannt, abgelaufen oder schon benutzt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /billing/subscriptions:
    post:
      summary: Abo anlegen
      description: >-
        Legt bei PayPal ein Abo zum gewählten Paket/Zeitraum an, persistiert einen
        `Subscription`-Datensatz mit Status `approval_pending` und liefert die
        Zustimmungs-URL (Issue #1505, T6d, AK1). Wirksam wird das Abo erst über das
        verifizierte Webhook-Ereignis (ADR 0013). Besteht für den Nutzer bereits ein
        laufendes oder ausstehendes Abo, antwortet die Route mit 409 (AK2).
      operationId: createBillingSubscription
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingSubscriptionInput'
      responses:
        '201':
          description: Angelegtes Abo — Zustimmungs-URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingApproval'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Es besteht bereits ein laufendes oder ausstehendes Abo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /billing/subscriptions/cancel:
    post:
      summary: Abo kündigen
      description: >-
        Ruft bei PayPal die Kündigung des eigenen Abos auf (Issue #1505, T6d, AK3).
        `plan` am Datensatz bleibt unverändert — wirksam wird die Kündigung erst
        über das Webhook-Ereignis `BILLING.SUBSCRIPTION.CANCELLED` (ADR 0013).
      operationId: cancelBillingSubscription
      tags: [billing]
      responses:
        '200':
          description: Kündigung bei PayPal ausgelöst
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /billing/subscriptions/change:
    post:
      summary: Paket wechseln
      description: >-
        Ruft bei PayPal den Wechsel des eigenen Abos auf Paket/Zeitraum auf (Issue
        #1505, T6d, AK4) und liefert, falls PayPal eine erneute Zustimmung verlangt,
        die Zustimmungs-URL. `plan` am Datensatz bleibt unverändert — wirksam wird
        der Wechsel erst über das Webhook-Ereignis (`applyPlanChange`, ADR 0013).
      operationId: changeBillingSubscription
      tags: [billing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingSubscriptionInput'
      responses:
        '200':
          description: Wechsel bei PayPal ausgelöst — Zustimmungs-URL, falls PayPal eine verlangt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingApproval'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /billing/invoices:
    get:
      summary: Eigene Rechnungen auflisten
      description: >-
        Liefert die Rechnungen des angemeldeten Nutzers (Issue #1505, T6d, AK5),
        neueste zuerst. Kein PDF, keine Zahlungsdaten (AK9).
      operationId: listBillingInvoices
      tags: [billing]
      responses:
        '200':
          description: Liste der eigenen Rechnungen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /billing/invoices/{id}:
    get:
      summary: Eigene Rechnung lesen
      description: >-
        Liefert eine einzelne Rechnung des angemeldeten Nutzers (Issue #1505, T6d,
        AK5). Fremde oder unbekannte Rechnungen liefern 404 — weder inhaltlich noch
        über den Status wird eine fremde Rechnung verraten (Muster `/api-tokens/{id}`).
      operationId: getBillingInvoice
      tags: [billing]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Id der Rechnung
      responses:
        '200':
          description: Eigene Rechnung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          description: Anmeldung erforderlich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    SeriesId:
      name: id
      in: path
      required: true
      description: ID der Serie
      schema:
        type: integer
    TaskId:
      name: id
      in: path
      required: true
      description: ID des Tasks
      schema:
        type: integer
    PillarId:
      name: id
      in: path
      required: true
      description: ID der Säule
      schema:
        type: integer
    CategoryId:
      name: id
      in: path
      required: true
      description: ID der Kategorie
      schema:
        type: integer
  responses:
    ValidationError:
      description: Ungültige Eingabe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PlanRequired:
      description: >-
        Das Paket des angemeldeten Nutzers enthält das benötigte Feature nicht (#1457).
        Body trägt zusätzlich `code: plan_required`, `feature`, `requiredPlan` und `currentPlan`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    QuotaExhausted:
      description: >-
        Das monatliche KI-Kontingent des Pakets ist aufgebraucht (#1459). Body trägt
        zusätzlich `code: quota_exhausted`, `feature: ai_assist` und `currentPlan`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ressource nicht gefunden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Konflikt — die Abhängigkeit würde einen Zyklus erzeugen
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PillarsLocked:
      description: >-
        Gesperrt (#1573): Die fünf Säulen sind fest und gelten stets. Anlegen,
        Umbenennen und Löschen sind nicht erlaubt.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Interner Serverfehler (z. B. Datenbankfehler)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: Fehler beim Upstream-Dienst (Mistral nicht erreichbar/ungültige Antwort)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Dienst nicht konfiguriert (z. B. fehlender API-Key oder keine Säulen)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Profile:
      type: object
      description: >-
        Profildaten des Nutzers (#1219): Anzeigename (selbst festlegbar),
        unveränderliche E-Mail-Adresse und optionale Avatar-URL.
      required: [displayName, email, avatarUrl]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 60
          description: Anzeigename, fällt per Default auf die E-Mail zurück
        email:
          type: string
          format: email
          description: E-Mail-Adresse (über /profile nicht änderbar)
        avatarUrl:
          type: string
          nullable: true
          description: Avatar-URL (null ohne Avatar)
    GeoConfig:
      type: object
      description: >-
        Geo-Konfiguration pro User (#1098): Anzeige-Entfernung (max. Distanz der
        Nearby-Liste), Alarm-Entfernung (ab hier Alarm) und
        Aktualisierungsintervall der Positionsermittlung. Kreuz-Schranken:
        1 <= alarmDistanceKm <= displayDistanceKm <= 50, intervalMinutes 1–60.
      required: [displayDistanceKm, alarmDistanceKm, intervalMinutes]
      properties:
        displayDistanceKm:
          type: integer
          minimum: 1
          maximum: 50
          description: Anzeige-Entfernung in km (Default 5)
        alarmDistanceKm:
          type: integer
          minimum: 1
          maximum: 50
          description: Alarm-Entfernung in km (Default 1)
        intervalMinutes:
          type: integer
          minimum: 1
          maximum: 60
          description: Aktualisierungsintervall in Minuten (Default 5)
    Group:
      type: object
      description: >-
        Gruppe mit Sicht einer Mitgliedschaft (#1211): Rolle des aufrufenden
        Nutzers und Mitgliederzahl. Beschreibung ist optional (null ohne Angabe).
      required: [id, name, description, role, memberCount]
      properties:
        id:
          type: integer
          description: ID der Gruppe
        name:
          type: string
          description: Name der Gruppe (maximal 60 Zeichen)
        description:
          type: [string, 'null']
          description: Optionale Beschreibung der Gruppe
        imageUrl:
          type: [string, 'null']
          description: >-
            https-Bildadresse des Gruppenbilds (#1225); null = kein Bild
            (Initialen aus dem Namen)
        role:
          type: string
          enum: [admin, member]
          description: Rolle des aufrufenden Nutzers in der Gruppe
        memberCount:
          type: integer
          description: Anzahl der Mitglieder der Gruppe
    GroupInput:
      type: object
      description: Payload zum Anlegen einer Gruppe (#1211).
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Name der Gruppe (nach Trim nicht leer, max. 60 Zeichen)
        description:
          type: string
          description: Optionale Beschreibung der Gruppe
    GroupUpdate:
      type: object
      description: Payload zum Bearbeiten einer Gruppe — alle Felder optional.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Neuer Name (nach Trim nicht leer, max. 60 Zeichen)
        description:
          type: string
          description: Neue Beschreibung der Gruppe
        imageUrl:
          type: [string, 'null']
          description: >-
            Neue Bildadresse (#1225) — muss beginnen mit https://, null entfernt
            das Bild; abwesendes Feld lässt es unverändert
    UserSearchHit:
      type: object
      description: Suchtreffer der Nutzersuche (#1212) — bewusst ohne E-Mail.
      required: [id, displayName]
      properties:
        id:
          type: integer
        displayName:
          type: string
    AdminUser:
      type: object
      description: Nutzer-Eintrag der Admin-Nutzerverwaltung (Rollensystem admin/member/tester).
      required: [id, email, displayName, role, plan, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, member, tester]
        plan:
          $ref: '#/components/schemas/Plan'
        createdAt:
          type: string
          format: date-time
    AdminUserRoleUpdate:
      type: object
      description: Payload zum Ändern der Rolle eines Nutzers (Rollensystem admin/member/tester).
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member, tester]
    AdminUserPlanUpdate:
      type: object
      description: Payload zum Setzen des Pakets eines Nutzers (#1456, manuelle Vergabe bis T7).
      required: [plan]
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
    ReassignStatusFilter:
      type: string
      enum: [all, open, done]
      description: >-
        Statusauswahl eines Neuberechnungs-Laufs. `open` umfasst offene UND in
        Bearbeitung befindliche Aufgaben — dieselbe Abgrenzung wie im Frontend.
    OwnReassignPillarsResult:
      type: object
      description: >-
        Ergebnis eines Laufs über die eigenen Aufgaben
        (POST /tasks/reassign-pillars).
      required: [updated, failed, skipped, remaining, quotaExhausted]
      properties:
        updated:
          type: integer
          description: Aufgaben mit erfolgreich ersetzter Säulenverteilung.
        failed:
          type: integer
          description: Aufgaben, deren Klassifikation oder Speichern fehlschlug (Lauf lief weiter).
        skipped:
          type: integer
          description: Aufgaben ohne gültigen Vorschlag — Zuordnung unverändert gelassen.
        remaining:
          type: integer
          description: >-
            Aufgaben der gewählten Statusauswahl, die dieser Lauf nicht mehr
            erreicht hat — Grundlage für den Fortschritt und den Folgeaufruf.
        quotaExhausted:
          type: boolean
          description: >-
            Der Lauf endete vorzeitig, weil das monatliche KI-Kontingent
            aufgebraucht ist. `remaining` bleibt dann bewusst > 0.
        quotaRemaining:
          type: integer
          description: Verbleibende KI-Anfragen des Monats (von der Zähler-Middleware ergänzt).
    ReassignPillarsResult:
      type: object
      description: >-
        Ergebnis des Batch-Laufs zur Neuberechnung der Säulenverteilung aller
        Aufgaben (POST /admin/tasks/reassign-pillars).
      required: [updated, failed, skipped, users, remaining]
      properties:
        updated:
          type: integer
          description: Aufgaben mit erfolgreich ersetzter Säulenverteilung.
        failed:
          type: integer
          description: Aufgaben, deren Klassifikation oder Speichern fehlschlug (Lauf lief weiter).
        skipped:
          type: integer
          description: Aufgaben ohne gültigen Vorschlag — Zuordnung unverändert gelassen.
        users:
          type: integer
          description: Konten mit verarbeiteten Aufgaben im Lauf.
        remaining:
          type: integer
          description: >-
            Noch nicht verarbeitete Aufgaben, weil `limit` erreicht wurde — 0,
            wenn der Bestand komplett durchlief. Ein erneuter Aufruf setzt den
            Batch bei den verbleibenden Aufgaben fort.
    Plan:
      type: string
      description: Buchbares Paket. Reihenfolge der Werte ist die Rangfolge (aufsteigend).
      enum: [free, pro, max, ultimate]
    FeatureEntitlement:
      type: object
      description: >-
        Auswertung eines Features für ein Paket (#1456). `allowed` ist die
        wahrheitsgemäße Paketauswertung und bleibt unabhängig vom Rollout-Schalter
        `MONETIZATION_ENFORCED` — durchgesetzt wird erst in T8.
      required: [allowed, requiredPlan]
      properties:
        allowed:
          type: boolean
        requiredPlan:
          $ref: '#/components/schemas/Plan'
        quotaRemaining:
          type: integer
          description: >-
            Nur bei `ai_assist`: Rest des monatlichen KI-Kontingents (0/60/110/200
            je Paket). Bis T4 der Startwert des Pakets, danach der tatsächliche Rest —
            dasselbe Feld beziffert das Restkontingent in LLM-Antworten.
    FeatureCatalogEntry:
      type: object
      description: Ein Feature und die Pakete, die es enthalten (#1456).
      required: [feature, allowedPlans]
      properties:
        feature:
          type: string
          enum: [groups, voice_input, ai_assist, graph_write, location_reminders, mcp_readwrite, mcp_read]
        allowedPlans:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
    PlanPrice:
      type: object
      description: >-
        Preis eines Pakets je Abrechnungszeitraum in Cent (#1494). `quarterly`/`yearly` sind der
        kaufmännisch gerundete Monatspreis mal 3×0,9 bzw. 12×0,8.
      required: [monthly, quarterly, yearly]
      properties:
        monthly:
          type: integer
        quarterly:
          type: integer
        yearly:
          type: integer
    PlansCatalog:
      type: object
      description: Feature-Matrix und Preise aller Pakete (#1456) — Antwort von `GET /plans`.
      required: [features, prices]
      properties:
        features:
          type: array
          items:
            $ref: '#/components/schemas/FeatureCatalogEntry'
        prices:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PlanPrice'
    GroupMember:
      type: object
      description: Mitglied einer Gruppe mit Anzeigename und Rolle (#1212).
      required: [userId, displayName, role]
      properties:
        userId:
          type: integer
        displayName:
          type: string
        role:
          type: string
          enum: [admin, member]
    GroupTask:
      type: object
      description: >-
        Aufgabe, die ein Gruppenmitglied für ein anderes Mitglied angelegt hat
        (#1223) — bewusst ohne Beschreibung, Checkliste und Nutzer-Ids.
      required: [id, title, deadline, status, recipientName, creatorName]
      properties:
        id:
          type: integer
        title:
          type: string
        deadline:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/TaskStatus'
        recipientName:
          type: string
          description: Anzeigename des Empfängers (Fallback E-Mail)
        creatorName:
          type: string
          description: Anzeigename des Erstellers (Fallback E-Mail)
    GroupSeries:
      type: object
      description: >-
        Serie, die ein Gruppenmitglied für ein anderes Mitglied angelegt hat
        (#1254) — bewusst ohne Beschreibung, Adresse, Koordinaten und Nutzer-Ids.
      required: [id, title, rhythm, active, ownerName, creatorName]
      properties:
        id:
          type: integer
        title:
          type: string
        rhythm:
          $ref: '#/components/schemas/SeriesRhythm'
        active:
          type: boolean
          description: false = ruhend (z. B. nach Mitgliederaustritt #1251)
        ownerName:
          type: string
          description: Anzeigename des Eigentümers (Fallback E-Mail)
        creatorName:
          type: string
          description: Anzeigename des Erstellers (Fallback E-Mail)
    GroupMemberRoleUpdate:
      type: object
      description: Payload zum Ändern der Rolle eines Mitglieds (#1221).
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]
    GroupInvitationInput:
      type: object
      description: Payload zum Einladen eines Kontos (#1212).
      required: [userId]
      properties:
        userId:
          type: integer
    GroupInvitation:
      type: object
      description: Offene Einladung aus Sicht der Gruppe (#1212).
      required: [id, groupId, userId, status]
      properties:
        id:
          type: integer
        groupId:
          type: integer
        userId:
          type: integer
        displayName:
          type: string
        status:
          type: string
          enum: [pending, accepted, declined]
    ReceivedInvitation:
      type: object
      description: Offene Einladung aus Sicht des Eingeladenen (#1212).
      required: [id, groupId, groupName, invitedByName]
      properties:
        id:
          type: integer
        groupId:
          type: integer
        groupName:
          type: string
        invitedByName:
          type: string
    InvitationResult:
      type: object
      description: Ergebnis von Annehmen/Ablehnen einer Einladung (#1212).
      required: [groupId]
      properties:
        groupId:
          type: integer
    GroupInviteLink:
      type: object
      description: >-
        Erzeugter Einladungslink (#1226). Der Token wird ausschließlich bei der
        Erzeugung übermittelt — ein späteres erneutes Auslesen ist bewusst
        nicht möglich.
      required: [id, token, expiresAt]
      properties:
        id:
          type: integer
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    InviteLinkPreview:
      type: object
      description: Öffentliche Linkpreisgabe (#1226) — nur Gruppenname und Einladender.
      required: [name, invitedByName]
      properties:
        name:
          type: string
        invitedByName:
          type: string
    InviteLinkRedeemResult:
      type: object
      description: Ergebnis des Einlösens eines Einladungslinks (#1226).
      required: [groupId]
      properties:
        groupId:
          type: integer
    ApiToken:
      type: object
      description: >-
        Persönlicher API-Token für externe Clients (#1352) — Metadaten-Sicht ohne
        Klartext und ohne Hash.
      required: [id, name, createdAt, lastUsedAt, scope, expiresAt]
      properties:
        id:
          type: integer
        name:
          type: string
          description: Frei gewählter Name zur Wiedererkennung (1–60 Zeichen)
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Zeitpunkt des letzten erfolgreichen Bearer-Requests (null, solange ungenutzt)
        scope:
          type: string
          enum: [read, readwrite]
          description: >-
            Rechtestufe des Tokens (#1356). `read` erlaubt nur lesende Requests, `readwrite`
            auch schreibende. Ein neu angelegter Token startet immer als `read`.
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Ablaufdatum des Tokens (#1357). `null` ausschließlich für Bestandstokens ohne
            Migration — neu angelegte Tokens haben immer ein Ablaufdatum.
    ApiTokenInput:
      type: object
      description: Eingabe zum Anlegen eines API-Tokens (#1352).
      required: [name, expiresInDays]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        expiresInDays:
          type: integer
          enum: [30, 90, 180, 365]
          description: >-
            Feste Laufzeit in Tagen (#1357) — Pflichtfeld, Höchstlaufzeit 365 Tage
            (12 Monate).
    ApiTokenScopeInput:
      type: object
      description: Eingabe zum Umschalten der Rechtestufe eines API-Tokens (#1356).
      required: [scope]
      properties:
        scope:
          type: string
          enum: [read, readwrite]
    CreatedApiToken:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          description: Antwort auf das Anlegen — enthält den Klartext genau einmal (#1352).
          required: [token]
          properties:
            token:
              type: string
              description: Klartext-Token (`pp_<32 Hex>`); nur in dieser Antwort enthalten
    PlaceFavorite:
      type: object
      description: >-
        Gespeicherter Ort eines Nutzers (#1342) — eine Adresse, Koordinaten optional.
        Seit #1595 ohne Anzeigenamen: die Adresse ist die Bezeichnung.
      required: [id, address, latitude, longitude]
      properties:
        id:
          type: integer
        address:
          type: string
        latitude:
          type: number
          format: float
          nullable: true
          description: Breitengrad; null bei einem Freitext-Ort ohne Geocoding-Treffer
        longitude:
          type: number
          format: float
          nullable: true
          description: Längengrad; null bei einem Freitext-Ort ohne Geocoding-Treffer
    PlaceFavoriteInput:
      type: object
      description: >-
        Eingabe zum Anlegen eines gespeicherten Orts (#1342). Eine bereits gespeicherte Adresse
        (getrimmt, Groß-/Kleinschreibung egal) legt keinen zweiten Eintrag an, sondern liefert den
        bestehenden zurück (#1595).
      required: [address]
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 255
        latitude:
          type: number
          format: float
          nullable: true
        longitude:
          type: number
          format: float
          nullable: true
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          description: Konstante Statuskennung; signalisiert einen lebenden Dienst.
    TaskStatus:
      type: string
      enum:
        - Open
        - In process
        - Done
      default: Open
      description: Bearbeitungsstatus des Tasks
    Task:
      type: object
      required:
        - id
        - title
        - status
        - priority
        - estimatedEffort
        - pillars
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        estimatedEffort:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
          default: 0.5
          description: Geschätzter Eigenaufwand in Tagen (1 Tag ≙ 14 h reguläre Wachzeit)
        actualEffort:
          type: number
          format: float
          minimum: 0
          nullable: true
        description:
          type: string
          nullable: true
        address:
          type: string
          maxLength: 255
          nullable: true
          description: >-
            Adresse des Aufgabenorts, über die Adresssuche (Forward-Geocoding,
            OpenStreetMap Nominatim) ausgewählt. `null`, wenn kein Ortsbezug gesetzt ist.
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          nullable: true
          description: >-
            Breitengrad des Aufgabenorts (#1066). Wird nur bei Auswahl eines
            Adress-Vorschlags gesetzt; `null`, wenn kein Koordinaten-Bezug besteht.
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          nullable: true
          description: >-
            Längengrad des Aufgabenorts (#1066), analog `latitude`.
        deadline:
          type: string
          format: date-time
          nullable: true
        autoDeleteAfterDeadline:
          type: boolean
          description: >-
            `true`, wenn die Aufgabe bei verpasster Deadline automatisch gelöscht
            werden soll (3 Tage nach Ablauf, nur wenn nicht erledigt, #523).
        seriesId:
          type: integer
          nullable: true
          description: >-
            ID des Serien-Templates, aus dem diese Instanz generiert wurde
            (`null` ⇒ gewöhnlicher Einzel-Task oder nach Abkoppeln von einer
            gelöschten Serie), siehe Serienaufgaben (#120).
        originSeriesId:
          type: integer
          nullable: true
          description: >-
            Dauerhafte Provenienz (#553): ID der Serie, aus der dieser Task
            ursprünglich erzeugt wurde. Wird beim Generieren einmalig gesetzt und
            NIE geändert — auch beim Löschen der Serie nicht. Während `seriesId`
            die Live-Verbindung hält (und beim Abkoppeln auf null fällt), bleibt
            `originSeriesId` als Herkunftsnachweis erhalten. `null` ⇒ nie Teil
            einer Serie.
        isException:
          type: boolean
          default: false
          description: >-
            `true`, wenn diese generierte Serien-Instanz individuell geändert
            wurde — Template-Generierung lässt solche Instanzen unberührt.
        pinned:
          type: boolean
          default: false
          description: >-
            `true`, wenn die Aufgabe angepinnt ist (#1582) — angepinnte Aufgaben
            stehen unabhängig von der Sortierung über der restlichen Liste.
        pinnedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Zeitpunkt des Anpinnens (#1582), rein serverseitig abgeleitet — bestimmt
            die Reihenfolge unter mehreren angepinnten Aufgaben (zuletzt angepinnt
            zuerst). `null`, wenn die Aufgabe nicht angepinnt ist.
        userId:
          type: integer
          nullable: true
          description: >-
            Eigentümer der Aufgabe (Datenisolation #207); bei einer für ein anderes
            Gruppenmitglied angelegten Aufgabe/Instanz das Empfänger-Konto (#1213,
            #1222), `null` im Dev-Pass-Through.
        createdById:
          type: integer
          nullable: true
          description: >-
            Konto des Erstellers (#1213). Weicht bei einer Aufgabe für ein anderes
            Gruppenmitglied vom Eigentümer ab; `null` für Bestandsaufgaben ohne
            Ersteller-Eintrag.
        createdByName:
          type: string
          nullable: true
          description: >-
            Anzeigename des Erstellers (E-Mail-Fallback, #1213); synchron zu
            `createdById`, also `null` ohne Ersteller-Eintrag.
        forUserId:
          type: integer
          nullable: true
          description: >-
            Empfänger-Konto, nur gesetzt, wenn die Aufgabe aus Sicht des aufrufenden
            Erstellers für ein anderes Gruppenmitglied angelegt wurde (#1213);
            sonst `null`.
        forUserName:
          type: string
          nullable: true
          description: Anzeigename des Empfängers (E-Mail-Fallback, #1213); synchron zu `forUserId`.
        groupId:
          type: integer
          nullable: true
          description: >-
            Gruppe, an die die Aufgabe gerichtet ist (#1521). Solange `userId` `null` ist,
            sehen alle Mitglieder der Gruppe die Aufgabe; das erledigende Mitglied wird als
            `userId` eingetragen und bekommt die Gutschrift. `null` bei Einzel-Aufgaben.
        groupName:
          type: string
          nullable: true
          description: Name der adressierten Gruppe (#1521); synchron zu `groupId`.
        pillars:
          type: array
          description: >-
            Säulen, auf die der Task einzahlt (0..n). Der `share` verteilt 100 %
            über die referenzierten Säulen; `confidence` ist die Konfidenz je Beitrag.
          items:
            $ref: '#/components/schemas/TaskPillarContribution'
        checklist:
          type: array
          description: >-
            Abhakbare Checkliste (0–20 Einträge) zum Zerlegen des Tasks in Teilschritte
            (#531). Default leer; bestehende Tasks ohne Checkliste liefern `[]`
            (rückwärtskompatibel).
          items:
            $ref: '#/components/schemas/ChecklistItem'
        categoryId:
          type: integer
          nullable: true
          description: >-
            Thematische Kategorie der Aufgabe (0..1, siehe Schema `Category`); `null`,
            wenn keine zugeordnet ist.
    TaskCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        userId:
          type: integer
          description: >-
            Optionaler Empfänger (#1213): das Konto, dem die Aufgabe gehören soll.
            Der Aufrufer muss mit ihm eine Gruppe teilen (sonst 403); ohne das Feld
            oder mit der eigenen ID gehört die Aufgabe dem Aufrufer wie bisher.
        groupId:
          type: integer
          nullable: true
          description: >-
            Optionale Gruppen-Adressierung (#1521): die Aufgabe wird an alle Mitglieder der
            Gruppe gerichtet und entsteht ohne Eigentümer. Der Aufrufer muss Mitglied der
            Gruppe sein (sonst 403); zusammen mit `userId` ist das Feld ungültig (400).
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        estimatedEffort:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
          default: 0.5
        actualEffort:
          type: number
          format: float
          minimum: 0
          nullable: true
        description:
          type: string
          nullable: true
        address:
          type: string
          maxLength: 255
          nullable: true
          description: >-
            Adresse des Aufgabenorts, über die Adresssuche (Forward-Geocoding,
            OpenStreetMap Nominatim) ausgewählt. Fehlt das Feld, bleibt der Task
            ohne Ortsbezug.
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          nullable: true
          description: >-
            Breitengrad des Aufgabenorts (#1066). Wird nur bei Auswahl eines
            Adress-Vorschlags gesetzt; `null`, wenn kein Koordinaten-Bezug besteht.
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          nullable: true
          description: >-
            Längengrad des Aufgabenorts (#1066), analog `latitude`.
        deadline:
          type: string
          format: date-time
          nullable: true
        autoDeleteAfterDeadline:
          type: boolean
          description: >-
            Wenn `true`, wird die Aufgabe 3 Tage nach einer verpassten Deadline
            automatisch gelöscht (nur wenn nicht erledigt, #523).
        pillars:
          type: array
          description: >-
            Säulen, auf die der Task einzahlt (0..n). Wird das Feld weggelassen,
            bleibt der Task ohne Säulen. Bei mindestens einer Säule muss die Summe
            aller `share` 100 ergeben.
          items:
            $ref: '#/components/schemas/TaskPillarContributionInput'
        checklist:
          type: array
          description: >-
            Abhakbare Checkliste des Tasks (max. 20 Einträge, #531). Fehlt das Feld,
            bleibt die Liste leer.
          items:
            $ref: '#/components/schemas/ChecklistItem'
        categoryId:
          type: integer
          nullable: true
          description: >-
            Optionale Kategorie der Aufgabe. Muss eine Kategorie des Eigentümer-Kontos
            sein, sonst 400; `null` oder weggelassen heißt „ohne Kategorie".
    TaskUpdate:
      type: object
      description: Alle Felder optional — gesetzte Felder werden aktualisiert.
      properties:
        title:
          type: string
        userId:
          type: integer
          description: >-
            Optionaler Empfänger (#1252): übergibt die Aufgabe an das benannte
            Gruppenmitglied (Eigentümerwechsel, Aufrufer wird Ersteller). Der
            Aufrufer muss mit dem Empfänger eine Gruppe teilen (sonst 403); ohne
            das Feld oder mit der eigenen ID bleibt der Eigentümer unverändert.
            Übergabe schreibt nur die Eigentumsfelder; Abhängigkeiten, die der
            Empfänger nicht sehen kann, lehnen die Übergabe mit 409 ab.
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          type: integer
          minimum: 1
          maximum: 5
        estimatedEffort:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
        actualEffort:
          type: number
          format: float
          minimum: 0
          nullable: true
        description:
          type: string
          nullable: true
        address:
          type: string
          maxLength: 255
          nullable: true
          description: >-
            Adresse des Aufgabenorts. Fehlt das Feld, bleibt sie unverändert;
            `null` entfernt einen bestehenden Ortsbezug.
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          nullable: true
          description: >-
            Breitengrad des Aufgabenorts (#1066). `null` entfernt den Koordinaten-Bezug;
            fehlt das Feld, bleibt er unverändert.
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          nullable: true
          description: Längengrad des Aufgabenorts (#1066), analog `latitude`.
        deadline:
          type: string
          format: date-time
          nullable: true
        autoDeleteAfterDeadline:
          type: boolean
          description: >-
            Wenn `true`, wird die Aufgabe 3 Tage nach einer verpassten Deadline
            automatisch gelöscht (nur wenn nicht erledigt, #523).
        pinned:
          type: boolean
          description: >-
            Pinnt die Aufgabe an (`true`) oder wieder ab (`false`, #1582). Der
            Server leitet `pinnedAt` daraus ab — beim Anpinnen der aktuelle
            Zeitpunkt, beim Abpinnen `null`; `pinnedAt` ist nicht direkt setzbar.
        pillars:
          type: array
          description: >-
            Ersetzt die Säulen-Beiträge des Tasks vollständig. Eine leere Liste
            entfernt alle Beiträge; bei mindestens einer Säule muss die Summe
            aller `share` 100 ergeben. Fehlt das Feld, bleiben die Beiträge unverändert.
          items:
            $ref: '#/components/schemas/TaskPillarContributionInput'
        checklist:
          type: array
          description: >-
            Ersetzt die Checklisten-Einträge vollständig (max. 20, #531). Eine leere
            Liste leert die Checkliste; fehlt das Feld, bleibt sie unverändert.
          items:
            $ref: '#/components/schemas/ChecklistItem'
        categoryId:
          type: integer
          nullable: true
          description: >-
            Setzt die Kategorie (muss dem Eigentümer-Konto gehören) oder entfernt sie
            mit `null`. Fehlt das Feld, bleibt die Zuordnung unverändert.
    DependencyInput:
      type: object
      required:
        - dependingTaskId
      properties:
        dependingTaskId:
          type: integer
          description: >-
            ID des Tasks, von dem `{id}` abhängt (Vorgänger/Prerequisite).
            Entspricht der Spalte `dependingTaskId` im Join `dependencies`.
        weight:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
          default: 1
          description: Gewicht der Abhängigkeit (0,1–1)
    TaskPillarContribution:
      type: object
      description: >-
        Beitrag eines Tasks auf eine Lebensbalance-Säule (n:m). `share` verteilt
        100 % über die Säulen eines Tasks; `confidence` ist die Konfidenz je Beitrag.
      required:
        - pillarId
        - share
        - confidence
      properties:
        pillarId:
          type: integer
          minimum: 1
          description: ID der Säule, auf die der Task einzahlt
        share:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Investitions-Anteil in % (Summe über die Säulen eines Tasks = 100)
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 100
          default: 100
          description: Konfidenz in % (0–100), wie sicher der Beitrag auf die Säule einzahlt
    TaskPillarContributionInput:
      type: object
      description: >-
        Eingabe eines Säulen-Beitrags. `confidence` ist optional (Default 100 %).
      required:
        - pillarId
        - share
      properties:
        pillarId:
          type: integer
          minimum: 1
          description: ID der Säule, auf die der Task einzahlt
        share:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Investitions-Anteil in % (Summe über die Säulen eines Tasks = 100)
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 100
          default: 100
          description: Konfidenz in % (0–100); fehlt der Wert, gilt 100 %
    ChecklistItem:
      type: object
      description: >-
        Eintrag einer abhakbaren Checkliste eines Tasks (#531). Der Titel muss
        nicht-leer (1–255 Zeichen) sein; `completed` ist optional (Default `false`).
      required:
        - id
        - title
        - completed
      properties:
        id:
          type: string
          format: uuid
          description: Stabile UUID des Eintrags.
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Bezeichnung des Eintrags (nach Trim nicht-leer).
        completed:
          type: boolean
          default: false
          description: Erledigt-Status (Default `false`).
    TaskTreeNode:
      type: object
      required:
        - id
        - title
        - priority
        - estimatedEffort
        - totalEstimatedEffort
        - value
        - status
        - dependents
      properties:
        id:
          type: integer
        title:
          type: string
        priority:
          type: integer
        estimatedEffort:
          type: number
          format: float
        totalEstimatedEffort:
          type: number
          format: float
          description: Gesamtaufwand inkl. aller transitiven Abhängigkeiten
        value:
          type: number
          format: float
          description: Wertbeitrag des Tasks
        status:
          $ref: '#/components/schemas/TaskStatus'
        progress:
          type: object
          nullable: true
          description: >-
            Fortschritt (erledigt/gesamt) inkl. des Knotens selbst und aller transitiven
            Unteraufgaben, gezählt über die UNGEFILTERTE Abhängigkeitskette — also auch über
            erledigte Unteraufgaben, die aus `dependents` ausgeblendet sind (#392). Dadurch bleibt
            die Fortschrittsanzeige (#241) korrekt, obwohl erledigte Unteraufgaben nicht mehr im
            Baum erscheinen. `null`, wenn der Task keine Unteraufgaben hat.
          required:
            - done
            - total
          properties:
            done:
              type: integer
            total:
              type: integer
        categoryId:
          type: integer
          nullable: true
          description: >-
            Thematische Kategorie der Aufgabe (0..1, siehe Schema `Category`) — trägt den
            Kategorie-Filter der Aufgabenliste. `null`, wenn keine zugeordnet ist.
        weight:
          type: number
          format: float
          nullable: true
          description: >-
            Gewicht (0,1–1) der Kante von der Elternaufgabe zu diesem Knoten — `null` bei
            Wurzelknoten, die keine Vorgänger eines anderen Tasks sind (#1429).
        dependents:
          type: array
          items:
            $ref: '#/components/schemas/TaskTreeNode'
    TaskGraph:
      type: object
      description: >-
        Der Aufgabengraph als flache Knotenliste plus Kantenliste. Jede aktive Aufgabe
        kommt genau einmal vor, auch wenn sie mehreren übergeordneten Aufgaben zuarbeitet.
        Kanten stehen nur zwischen Knoten dieser Liste — es zeigt nie eine Kante ins Leere.
      required:
        - nodes
        - edges
      properties:
        nodes:
          type: array
          description: Aktive Aufgaben, absteigend nach Wertbeitrag sortiert.
          items:
            $ref: '#/components/schemas/TaskGraphNode'
        edges:
          type: array
          description: Gewichtete Abhängigkeitskanten zwischen den Knoten.
          items:
            $ref: '#/components/schemas/TaskGraphEdge'
    TaskGraphNode:
      type: object
      description: >-
        Ein Knoten des Aufgabengraphen. Feldgleich zu `TaskTreeNode`, aber ohne
        `dependents` — die Struktur steckt in `TaskGraph.edges`, nicht im Knoten.
      required:
        - id
        - title
        - priority
        - estimatedEffort
        - totalEstimatedEffort
        - value
        - status
      properties:
        id:
          type: integer
        title:
          type: string
        priority:
          type: integer
        estimatedEffort:
          type: number
          format: float
        totalEstimatedEffort:
          type: number
          format: float
          description: Gesamtaufwand inkl. aller transitiven aktiven Unteraufgaben
        value:
          type: number
          format: float
          description: Wertbeitrag des Tasks
        status:
          $ref: '#/components/schemas/TaskStatus'
        progress:
          type: object
          nullable: true
          description: >-
            Fortschritt (erledigt/gesamt) inkl. des Knotens selbst und aller transitiven
            Unteraufgaben, gezählt über die UNGEFILTERTE Abhängigkeitskette — also auch über
            erledigte Unteraufgaben, die als Knoten nicht mehr erscheinen (#392 ∩ #241).
            `null`, wenn der Task keine Unteraufgaben hat.
          required:
            - done
            - total
          properties:
            done:
              type: integer
            total:
              type: integer
    TaskGraphEdge:
      type: object
      description: >-
        Eine gerichtete, gewichtete Abhängigkeitskante. `from` ist die Unteraufgabe
        (der Vorgänger, `dependencies.dependingTaskId`), `to` die übergeordnete Aufgabe
        (`dependencies.dependentTaskId`). Gelesen: „`from` ermöglicht `to`" bzw. „`to`
        kann erst, wenn `from` fertig ist". Die Richtung ist hier bewusst explizit
        benannt, weil das Feld `dependents` in `TaskTreeNode` historisch die *Kinder*
        meint und nicht die Dependents im Graph-Sinn (#336).
      required:
        - from
        - to
        - weight
      properties:
        from:
          type: integer
          description: ID der Unteraufgabe (Vorgänger)
        to:
          type: integer
          description: ID der übergeordneten Aufgabe
        weight:
          type: number
          format: float
          description: Kantengewicht (0,1–1), wie beim Anlegen der Abhängigkeit gesetzt
    Pillar:
      type: object
      description: Eine der fünf festen Lebensbalance-Säulen (globale Stammdaten, für alle Nutzer identisch).
      required:
        - id
        - name
        - description
        - weight
      properties:
        id:
          type: integer
        name:
          type: string
          description: 'Name der Säule (z. B. Körper, Beziehungen, Sinn, Mentale Gesundheit, Wirksamkeit)'
        description:
          type: string
          description: >-
            Kurzbeschreibung der Säule (kanonische Stammdaten, nicht nutzereditierbar).
            Wird im Einstellungs-Menü angezeigt.
        weight:
          type: number
          format: float
          minimum: 0
          default: 20
          description: Prozentualer Anteil der Säule (alle Säulen summieren sich auf 100)
    Category:
      type: object
      description: >-
        Thematische Kategorie einer Aufgabe/Serie — die flache Ordnungsebene neben den
        Lebensbalance-Säulen. Höchstens eine je Aufgabe, ohne Anteil und ohne Wirkung
        auf Wert, Score oder Balance; sie dient dem Gruppieren und Filtern.
        Nutzer-eigene Stammdaten, Name pro Nutzer eindeutig.
      required:
        - id
        - name
        - color
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 40
          description: 'Name der Kategorie (nicht leer, z. B. Hausbau, Steuer, Verein)'
        color:
          $ref: '#/components/schemas/CategoryColor'
    CategoryColor:
      type: string
      description: >-
        Badge-Farbe aus der festen Palette. Bewusst keine freie Farbwahl: Die Werte
        sind auf die Design-Sprache abgestimmt, die Textfarbe rechnet `KolBadge` selbst
        aus. Spiegel von `server/src/models/categoryColors.ts`.
      enum:
        - '#b42318'
        - '#b54708'
        - '#8a6100'
        - '#1a7f37'
        - '#0e7490'
        - '#1064d0'
        - '#6941c6'
        - '#475467'
    CategoryCreate:
      type: object
      description: Eingabe zum Anlegen einer neuen Kategorie.
      required:
        - name
        - color
      properties:
        name:
          type: string
          maxLength: 40
          description: Name der Kategorie (nicht leer)
        color:
          $ref: '#/components/schemas/CategoryColor'
    CategoryUpdate:
      type: object
      description: Eingabe zum teilweisen Aktualisieren einer Kategorie. Mindestens ein Feld muss gesetzt sein.
      properties:
        name:
          type: string
          maxLength: 40
          description: Neuer Name der Kategorie (nicht leer, falls gesetzt)
        color:
          $ref: '#/components/schemas/CategoryColor'
    PillarWeightsInput:
      type: object
      description: >-
        Neue 100 %-Verteilung über die Säulen. `weights` muss genau alle
        existierenden Säulen abdecken; die Summe aller `weight` muss 100 ergeben.
      required:
        - weights
      properties:
        weights:
          type: array
          minItems: 1
          description: Gewicht je Säule (Summe = 100).
          items:
            type: object
            required:
              - id
              - weight
            properties:
              id:
                type: integer
                minimum: 1
                description: ID der Säule
              weight:
                type: number
                format: float
                minimum: 0
                description: Prozentualer Anteil der Säule
    ActivityAdvisorInput:
      type: object
      description: >-
        Eingabe für den Aktivitäten-Berater. Die optionale Frage (z. B. „Was kann
        ich am Wochenende für mich tun?") lenkt die Vorschläge; ohne Frage schlägt
        der Berater Aktivitäten über alle Säulen hinweg vor. Optional kann der Client
        die aktuelle Säulen-Verteilung (Soll vs. Ist, wie im Dashboard „Meine Themen")
        mitschicken; der Berater priorisiert dann die am stärksten unterversorgten
        (schwächsten) Säulen.
      properties:
        question:
          type: string
          maxLength: 500
          description: Optionale Frage bzw. Situationsbeschreibung des Nutzers
        distribution:
          type: array
          description: >-
            Aktuelle Säulen-Verteilung aus dem Client (Dashboard „Meine Themen"): je
            Säule ihr Soll-Anteil (`weight`, 0–100 %) und ihr Ist-Anteil
            (`actualShare`, 0–1). Der Berater richtet die Vorschläge bevorzugt auf die
            am stärksten unterversorgten Säulen aus.
          items:
            $ref: '#/components/schemas/PillarDistributionEntry'
    ActivityAdvice:
      type: object
      description: >-
        Ein Vorschlag des Aktivitäten-Beraters — eine konkrete Aktivität samt der
        Säulen, auf die sie einzahlen würde, und einer kurzen Begründung.
      required:
        - activity
        - reason
        - pillarIds
      properties:
        activity:
          type: string
          description: Kurzer, konkreter Name der vorgeschlagenen Aktivität
        reason:
          type: string
          description: Kurze Begründung, warum die Aktivität auf die genannten Säulen einzahlt
        pillarIds:
          type: array
          description: IDs der Säulen, auf die die Aktivität einzahlen würde
          items:
            type: integer
            minimum: 1
    ActivityAdvisorResult:
      type: object
      description: Ergebnis des Aktivitäten-Beraters.
      required:
        - advice
      properties:
        advice:
          type: array
          description: Vorgeschlagene Aktivitäten samt Säulen-Zuordnung
          items:
            $ref: '#/components/schemas/ActivityAdvice'
        quotaRemaining:
          type: integer
          minimum: 0
          description: >-
            Rest des monatlichen KI-Kontingents NACH diesem Aufruf (#1459). Fehlt, wenn
            kein angemeldeter Nutzer im Spiel ist (Pass-Through-Modus).
    PillarDistributionEntry:
      type: object
      description: >-
        Verteilungs-Eintrag einer Säule aus dem Client (Dashboard „Meine Themen"):
        Soll-Anteil (`weight`) und Ist-Anteil (`actualShare`).
      required:
        - pillarId
        - weight
        - actualShare
      properties:
        pillarId:
          type: integer
          minimum: 1
          description: ID der Säule
        weight:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Soll-Anteil der Säule in Prozent (0–100)
        actualShare:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Ist-Anteil der Säule (0–1), wie im Client berechnet
    SuggestPillarsInput:
      type: object
      description: Eingabe für die Säulen-Klassifikation einer Aufgabe.
      required:
        - title
      properties:
        title:
          type: string
          description: Titel der Aufgabe (Pflichtfeld, nicht leer)
        description:
          type: string
          description: Optionale ausführliche Beschreibung der Aufgabe
        context:
          type: string
          description: Optionaler Kontext, z. B. zu abhängigen Aufgaben
    PillarSuggestion:
      type: object
      description: Eine vorgeschlagene Säulen-Einzahlung mit Konfidenz.
      required:
        - pillarId
        - confidence
      properties:
        pillarId:
          type: integer
          minimum: 1
          description: ID der Säule, auf die die Aufgabe einzahlt
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Konfidenz in % (0–100), dass die Aufgabe auf diese Säule einzahlt
    SuggestPillarsResult:
      type: object
      description: Ergebnis der Säulen-Klassifikation.
      required:
        - suggestions
      properties:
        suggestions:
          type: array
          description: Vorgeschlagene Säulen-Einzahlungen, nach pillarId sortiert
          items:
            $ref: '#/components/schemas/PillarSuggestion'
        quotaRemaining:
          type: integer
          minimum: 0
          description: >-
            Rest des monatlichen KI-Kontingents NACH diesem Aufruf (#1459). Fehlt, wenn
            kein angemeldeter Nutzer im Spiel ist (Pass-Through-Modus).
    LektoratInput:
      type: object
      description: Eingabe des Lektorats (#680) — Text und optionale Maximallänge.
      required:
        - text
      properties:
        text:
          type: string
          description: Zu lektorierender Text (nicht leer)
        maxLength:
          type: integer
          minimum: 1
          description: Optionale Maximallänge des lektorierten Textes in Zeichen
    LektoratResult:
      type: object
      description: Ergebnis des Lektorats.
      required:
        - text
      properties:
        text:
          type: string
          description: Der lektorierte (und bei gesetztem `maxLength` gekürzte) Text
        quotaRemaining:
          type: integer
          minimum: 0
          description: >-
            Rest des monatlichen KI-Kontingents NACH diesem Aufruf (#1459). Fehlt, wenn
            kein angemeldeter Nutzer im Spiel ist (Pass-Through-Modus).
    ParseTaskInput:
      type: object
      description: Eingabe für die Task-Schnellerfassung — frei formulierter Text (#235).
      required:
        - text
      properties:
        text:
          type: string
          maxLength: 2000
          description: Frei formulierter Text, aus dem die Task-Felder extrahiert werden (nicht leer)
    ParsedTask:
      type: object
      description: >-
        Aus einem Freitext extrahierte, strukturierte Task-Felder (#235). Nur `title`
        ist garantiert gesetzt; die restlichen Felder liefert das Modell nur, wenn der
        Text sie hergibt.
      required:
        - title
      properties:
        title:
          type: string
          description: Kurzer, prägnanter Titel der Aufgabe (Pflichtfeld, nicht leer)
        description:
          type: string
          description: Optionale ausführliche Beschreibung der Aufgabe
        priority:
          type: integer
          minimum: 1
          maximum: 5
          description: Optionale Priorität 1–5 (1 = niedrig, 5 = hoch)
        estimatedEffort:
          type: number
          format: float
          minimum: 0
          description: Optionaler geschätzter Aufwand in Personentagen (z. B. 0.25 ≈ 2 h)
        deadline:
          type: string
          format: date-time
          description: Optionale Deadline als ISO-8601-Datum/Zeit-String
        isSeries:
          type: boolean
          description: >-
            Optionale Serien-Erkennung (#1310): `true`, wenn der Text einen wiederkehrenden
            Termin beschreibt — das Formular startet dann im Serien-Modus.
        address:
          type: string
          description: >-
            Optionale Ortsangabe aus dem Freitext (#1310) als Adresstext; reiner Freitext,
            ohne Koordinaten (kein Geocoding im Parsing).
        checklist:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: >-
            Optionale, im Freitext aufgezählte Einzelpunkte (#1310) — je Eintrag ein
            Checklisten-Eintrag im Formular.
        categoryId:
          type: integer
          description: >-
            Optionale Kategorie: ID einer Kategorie des Nutzers, wenn der Text thematisch
            eindeutig zu einer passt. Fehlt, wenn keine passt oder keine angelegt sind.
        quotaRemaining:
          type: integer
          minimum: 0
          description: >-
            Rest des monatlichen KI-Kontingents NACH diesem Aufruf (#1459). Fehlt, wenn
            kein angemeldeter Nutzer im Spiel ist (Pass-Through-Modus).
    ParsedSearch:
      type: object
      description: >-
        Aus einer frei formulierten Suchanfrage extrahierter Filter. Beide Felder sind
        optional: `text` fehlt, wenn die Anfrage nur eine Kategorie nennt, `categoryId`
        fehlt, wenn keine Kategorie gemeint ist.
      properties:
        text:
          type: string
          description: Reiner Suchbegriff ohne den Kategorie-Anteil der Anfrage
        categoryId:
          type: integer
          description: ID der gemeinten Kategorie des Nutzers
        quotaRemaining:
          type: integer
          minimum: 0
          description: >-
            Rest des monatlichen KI-Kontingents NACH diesem Aufruf (#1459). Fehlt, wenn
            kein angemeldeter Nutzer im Spiel ist (Pass-Through-Modus).
    PillarFeedbackInput:
      type: object
      description: >-
        Eine vom Nutzer bestätigte/korrigierte Säulen-Zuordnung, die als Lern-Sample
        für nachfolgende Vorschläge gespeichert wird (Feedback-Loop, #45).
      required:
        - title
        - pillars
      properties:
        title:
          type: string
          description: Titel der Aufgabe (Pflichtfeld, nicht leer)
        description:
          type: string
          description: Optionale Beschreibung der Aufgabe
        pillars:
          type: array
          description: Die final vom Nutzer gewählten Säulen samt Konfidenz
          items:
            $ref: '#/components/schemas/PillarSuggestion'
    PillarFeedbackResult:
      type: object
      description: Ergebnis des Speicherns eines Feedback-Samples.
      required:
        - id
      properties:
        id:
          type: integer
          minimum: 1
          description: ID des gespeicherten Feedback-Samples
    ScoreEntry:
      type: object
      required:
        - taskId
        - punkte
        - pünktlich
        - zeitpunkt
      properties:
        taskId:
          type: integer
          description: ID des erledigten Tasks (genau ein Eintrag je Task).
        punkte:
          type: number
          description: Vergebene Punkte (Basis `estimatedEffort × priority`, bei Verspätung reduziert).
        pünktlich:
          type: boolean
          description: Ob der Task vor/zur Deadline (oder ganz ohne Deadline) erledigt wurde.
        zeitpunkt:
          type: string
          format: date-time
          description: Erledigungszeitpunkt.
    PillarScore:
      type: object
      required:
        - pillarId
        - punkte
      properties:
        pillarId:
          type: integer
          description: ID der Säule.
        punkte:
          type: number
          description: Summe der anteilig (nach `share`) auf diese Säule entfallenden Punkte.
    Streak:
      type: object
      required:
        - aktuell
        - best
        - letzterTag
      properties:
        aktuell:
          type: integer
          description: >-
            Kalendertage in Folge mit mindestens einer Erledigung, endend auf heute
            oder gestern. `0`, sobald der Streak gerissen ist.
        best:
          type: integer
          description: Längste je erreichte Tagesfolge (persönliche Bestmarke).
        letzterTag:
          type: string
          nullable: true
          description: Jüngster Kalendertag mit einer Erledigung (`YYYY-MM-DD`), oder `null`.
    Milestone:
      type: object
      required:
        - schluessel
        - typ
        - schwelle
        - erreicht
      properties:
        schluessel:
          type: string
          description: Eindeutiger Bezeichner der Stufe (Rendering-Key im Frontend).
        typ:
          type: string
          enum:
            - streak
            - punkte
          description: Ob die Stufe eine Streak- oder eine Punkte-Schwelle prüft.
        schwelle:
          type: number
          description: Schwellenwert der Stufe (Streak-Tage bzw. Punkte).
        erreicht:
          type: boolean
          description: Ob die Schwelle mit den aktuellen Bestandsdaten erreicht ist.
    MissedTask:
      type: object
      required:
        - taskId
        - title
        - deadline
        - verpasstAm
      properties:
        taskId:
          type: integer
          description: ID der ursprünglichen (inzwischen gelöschten) Aufgabe.
        title:
          type: string
          description: Titel der Aufgabe zum Zeitpunkt der Löschung.
        deadline:
          type: string
          format: date-time
          description: Deadline der Aufgabe zum Zeitpunkt der Löschung.
        verpasstAm:
          type: string
          format: date-time
          description: Zeitpunkt, zu dem der Auto-Delete-Cron die Aufgabe gelöscht hat.
    MissedTasksSummary:
      type: object
      required:
        - anzahl
        - eintraege
      properties:
        anzahl:
          type: integer
          description: Gesamtzahl der bislang vom Auto-Delete-Cron gelöschten Aufgaben des Nutzers.
        eintraege:
          type: array
          description: Die jüngsten verpassten Aufgaben (neueste zuerst, maximal 20 Einträge).
          items:
            $ref: '#/components/schemas/MissedTask'
    PillarBalance:
      type: object
      required:
        - id
        - name
        - punkte
        - gewichtung
      properties:
        id:
          type: integer
          description: ID der Säule.
        name:
          type: string
          description: Name der Säule.
        punkte:
          type: number
          description: >-
            Roher (ungerundeter) Punktestand der Säule: der anteilig (nach `share`) auf sie
            entfallende erledigte Aufwand. Säulen ohne Beitrag erscheinen mit `0`.
        gewichtung:
          type: number
          description: Soll-Gewichtung der Säule (`Pillar.weight`, prozentualer Anteil).
    BalanceStatus:
      type: object
      required:
        - fuellstandProzent
        - hatPunkte
        - saeulen
        - streak
        - meilensteine
      properties:
        fuellstandProzent:
          type: number
          description: >-
            Füllstand des Dashboard-Herzens in Prozent (`0`–`100`, auf eine Dezimalstelle
            gerundet): `100` bei Ist = Soll, `0`, wenn aller erledigter Aufwand an einer einzigen
            Säule hängt. Gemessen als normierte quadratische Abweichung vom Soll, große Defizite
            einzelner Säulen wiegen dabei schwerer als dünn verteilte.
        hatPunkte:
          type: boolean
          description: >-
            Ob überhaupt Punkte vergeben sind. Unterscheidet „noch nichts erledigt" (`false`,
            Füllstand `0`) von „unausgewogen".
        saeulen:
          type: array
          description: Punktestand und Gewichtung je Säule des Nutzers, aufsteigend nach Säulen-ID.
          items:
            $ref: '#/components/schemas/PillarBalance'
        streak:
          $ref: '#/components/schemas/Streak'
        meilensteine:
          type: array
          description: Ausschließlich die **erreichten** Meilenstein-Stufen; ohne Erfolge eine leere Liste.
          items:
            $ref: '#/components/schemas/Milestone'
    BalanceHistoryEntry:
      type: object
      required:
        - tag
        - fuellstandProzent
        - hatPunkte
        - saeulen
      properties:
        tag:
          type: string
          description: Kalendertag dieses Eintrags (`YYYY-MM-DD`).
        fuellstandProzent:
          type: number
          description: >-
            Füllstand des Dashboard-Herzens zum Ende dieses Tages in Prozent, auf eine
            Dezimalstelle gerundet — dieselbe Rechnung wie `BalanceStatus.fuellstandProzent`.
        hatPunkte:
          type: boolean
          description: Ob bis zu diesem Tag überhaupt Punkte vergeben sind.
        saeulen:
          type: array
          description: Punktestand und Gewichtung je Säule zum Ende dieses Tages.
          items:
            $ref: '#/components/schemas/PillarBalance'
    SeriesRhythm:
      type: string
      enum:
        - daily
        - weekly
        - monthly
        - weekdays
        - weekend
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
      default: weekly
      description: >-
        Wiederholungsrhythmus eines Serien-Templates (striktes RRULE-Subset, #120).
        Wochentag-basierte Rhythmen (#467): `weekdays` (Mo–Fr), `weekend` (Sa+So),
        `mon`…`sun` (jeweils genau dieser Wochentag) erzeugen mehrere Termine pro Woche.
        Bei `mon`…`sun` muss `startDate` auf dem benannten Wochentag liegen, sonst 400.
    Series:
      type: object
      description: >-
        Serien-Template einer wiederkehrenden Aufgabe (Habit, Konzept §4.2). Jede fällige
        Wiederholung wird als eigenständiger `Task` mit `seriesId` materialisiert.
      required:
        - id
        - title
        - rhythm
        - priority
        - estimatedEffort
        - active
        - startDate
        - pillars
      properties:
        id:
          type: integer
        title:
          type: string
        rhythm:
          $ref: '#/components/schemas/SeriesRhythm'
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: Default-Priorität künftig generierter Instanzen.
        estimatedEffort:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
          default: 0.5
          description: Default-Aufwand künftig generierter Instanzen.
        active:
          type: boolean
          default: true
          description: Inaktive Templates erzeugen keine Instanzen.
        startDate:
          type: string
          format: date-time
          description: Anker, ab dem die Serie läuft (erster fälliger Termin).
        description:
          type: string
          nullable: true
          description: Freitext-Beschreibung des Templates (optional).
        address:
          type: string
          maxLength: 255
          nullable: true
          description: >-
            Adresse des Serien-Orts, über die Adresssuche (Forward-Geocoding) ausgewählt.
            Wird beim Generieren als Snapshot auf jede Instanz vererbt. `null`, wenn
            kein Ortsbezug gesetzt ist (#1063).
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          nullable: true
          description: >-
            Breitengrad des Serien-Orts (#1066). Wird nur bei Auswahl eines
            Adress-Vorschlags gesetzt; `null`, wenn kein Koordinaten-Bezug besteht.
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          nullable: true
          description: >-
            Längengrad des Serien-Orts (#1066), analog `latitude`.
        autoDeleteAfterDeadline:
          type: boolean
          description: >-
            Wenn `true`, erben künftig generierte Instanzen diese Option und
            werden bei verpasster Deadline automatisch gelöscht (#523).
        userId:
          type: integer
          nullable: true
          description: >-
            Eigentümer der Serie (Issue #244); bei einer Serie für ein anderes
            Gruppenmitglied (#1222) das Empfänger-Konto statt des Erstellers.
        createdById:
          type: integer
          nullable: true
          description: >-
            Konto des Erstellers (#1222, analog `Task.createdById` #1213). Weicht bei
            einer Serie für ein anderes Gruppenmitglied vom Eigentümer ab; `null` für
            Bestandsserien ohne Ersteller-Eintrag.
        createdByName:
          type: string
          nullable: true
          description: >-
            Anzeigename des Erstellers (E-Mail-Fallback, #1222); synchron zu
            `createdById`, also `null` ohne Ersteller-Eintrag.
        forUserId:
          type: integer
          nullable: true
          description: >-
            Empfänger-Konto, nur gesetzt, wenn die Serie aus Sicht des aufrufenden
            Erstellers für ein anderes Gruppenmitglied angelegt wurde (#1222); sonst `null`.
        forUserName:
          type: string
          nullable: true
          description: Anzeigename des Empfängers (E-Mail-Fallback, #1222); synchron zu `forUserId`.
        pillars:
          type: array
          description: >-
            Säulen-Vorlage des Templates (0..n). Der `share` verteilt 100 %
            über die referenzierten Säulen; `confidence` ist die Konfidenz je Beitrag.
          items:
            $ref: '#/components/schemas/TaskPillarContribution'
        categoryId:
          type: integer
          nullable: true
          description: >-
            Thematische Kategorie des Templates (0..1, siehe Schema `Category`); wird beim
            Generieren auf jede Instanz vererbt. `null`, wenn keine zugeordnet ist.
    SeriesCreate:
      type: object
      required:
        - title
        - priority
        - estimatedEffort
        - startDate
      properties:
        title:
          type: string
        userId:
          type: integer
          description: >-
            Optionaler Empfänger (#1222): das Konto, dem die Serie und ihre generierten
            Instanzen gehören sollen. Der Aufrufer muss mit ihm eine Gruppe teilen
            (sonst 403); ohne das Feld oder mit der eigenen ID gehört die Serie dem
            Aufrufer wie bisher.
        rhythm:
          $ref: '#/components/schemas/SeriesRhythm'
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        estimatedEffort:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
          default: 0.5
        active:
          type: boolean
          default: true
        startDate:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
        address:
          type: string
          maxLength: 255
          nullable: true
          description: Adresse des Serien-Orts (optional, #1063). Fehlt das Feld, gilt `null`.
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          nullable: true
          description: >-
            Breitengrad des Serien-Orts (#1066). Wird nur bei Auswahl eines
            Adress-Vorschlags gesetzt; `null`, wenn kein Koordinaten-Bezug besteht.
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          nullable: true
          description: >-
            Längengrad des Serien-Orts (#1066), analog `latitude`.
        autoDeleteAfterDeadline:
          type: boolean
          description: >-
            Wenn `true`, erben künftig generierte Instanzen diese Option und
            werden bei verpasster Deadline automatisch gelöscht (#523).
        pillars:
          type: array
          description: >-
            Säulen-Vorlage des Templates (0..n). Wird das Feld weggelassen,
            bleibt das Template ohne Säulen. Bei mindestens einer Säule muss die
            Summe aller `share` 100 ergeben.
          items:
            $ref: '#/components/schemas/TaskPillarContributionInput'
        categoryId:
          type: integer
          nullable: true
          description: >-
            Optionale Kategorie des Templates. Muss eine Kategorie des Eigentümer-Kontos
            sein, sonst 400; wird beim Generieren auf jede Instanz vererbt.
    SeriesUpdate:
      type: object
      description: Alle Felder optional — gesetzte Felder gelten nur für künftige Instanzen.
      properties:
        title:
          type: string
        userId:
          type: integer
          description: >-
            Optionaler Empfänger (#1252): übergibt das Serien-Template an das
            benannte Gruppenmitglied (Eigentümerwechsel, Aufrufer wird Ersteller).
            Der Aufrufer muss mit dem Empfänger eine Gruppe teilen (sonst 403);
            ohne das Feld oder mit der eigenen ID bleibt der Eigentümer
            unverändert. Bereits erzeugte Instanzen bleiben beim bisherigen
            Eigentümer (keine Kaskade des Eigentümers).
        rhythm:
          $ref: '#/components/schemas/SeriesRhythm'
        priority:
          type: integer
          minimum: 1
          maximum: 5
        estimatedEffort:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
        active:
          type: boolean
        startDate:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
        address:
          type: string
          maxLength: 255
          nullable: true
          description: >-
            Adresse des Serien-Orts (#1063). `null` entfernt einen bestehenden Ortsbezug.
            Fehlt das Feld, bleibt die Adresse unverändert.
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          nullable: true
          description: >-
            Breitengrad des Serien-Orts (#1066). `null` entfernt den Koordinaten-Bezug;
            fehlt das Feld, bleibt er unverändert.
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          nullable: true
          description: Längengrad des Serien-Orts (#1066), analog `latitude`.
        autoDeleteAfterDeadline:
          type: boolean
          description: >-
            Wenn `true`, erben künftig generierte Instanzen diese Option und
            werden bei verpasster Deadline automatisch gelöscht (#523).
        pillars:
          type: array
          description: >-
            Ersetzt die Säulen-Vorlage des Templates vollständig. Eine leere Liste
            entfernt alle Beiträge; bei mindestens einer Säule muss die Summe aller
            `share` 100 ergeben. Fehlt das Feld, bleibt die Vorlage unverändert.
          items:
            $ref: '#/components/schemas/TaskPillarContributionInput'
        categoryId:
          type: integer
          nullable: true
          description: >-
            Setzt die Kategorie des Templates (muss dem Eigentümer-Konto gehören) oder
            entfernt sie mit `null`. Fehlt das Feld, bleibt die Zuordnung unverändert.
        applyToInstances:
          type: boolean
          description: >-
            `true` überträgt die im Serie-Edit GEÄNDERTEN kaskadierbaren Felder (`title`, `priority`,
            `estimatedEffort`, `description`, `address`, `autoDeleteAfterDeadline`, `pillars`)
            zusätzlich auf alle bestehenden offenen Instanzen (inkl. `isException`; erledigte bleiben
            unverändert, #555). `rhythm`/`startDate`/`active` werden nie kaskadiert. Default `false`
            (nur Template, künftige Instanzen).
    SeriesGenerateInput:
      type: object
      required:
        - until
      properties:
        until:
          type: string
          format: date-time
          description: Letzter zu materialisierender Zeitpunkt (inklusive).
    SeriesGenerateAllResult:
      type: object
      required:
        - created
      properties:
        created:
          type: integer
          description: Anzahl der neu materialisierten Task-Instanzen.
    MeSubscription:
      type: object
      description: Abo-Status im Vertrag von `GET /auth/me` (#1494/#1495/#1505).
      required: [plan, period, status, currentPeriodEnd, pendingPlan, pendingPlanEffectiveAt, graceUntil]
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        period:
          type: string
          enum: [monthly, quarterly, yearly]
        status:
          type: string
          description: Abo-Status bei PayPal (z. B. `approval_pending`, `active`, `cancelled`).
        currentPeriodEnd:
          type: string
          format: date-time
        pendingPlan:
          type: [string, 'null']
          description: >-
            Vorgemerkter Paketwechsel nach unten (#1495 AK4); wirkt erst ab
            `pendingPlanEffectiveAt`. `null` ohne anstehenden Wechsel.
        pendingPlanEffectiveAt:
          type: [string, 'null']
          format: date-time
          description: Zeitpunkt, ab dem `pendingPlan` wirkt; `null` ohne anstehenden Wechsel.
        graceUntil:
          type: [string, 'null']
          format: date-time
          description: >-
            Ende der Kulanzfrist nach Zahlungsausfall (#1505 AK6). Konstant `null`, bis
            T6e (#1506) sie befüllt.
    Me:
      type: object
      description: Antwort von `GET /auth/me` (Issue #206/#1456/#1494) — Session, Paket, Entitlements, Abo.
      required: [email, displayName, avatarUrl, plan, entitlements, subscription]
      properties:
        id:
          type: integer
          description: Fehlt im lokalen Pass-Through-Modus (synthetischer Entwicklungs-Nutzer).
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: [string, 'null']
        role:
          type: string
          enum: [admin, member, tester]
          description: Fehlt im lokalen Pass-Through-Modus.
        plan:
          $ref: '#/components/schemas/Plan'
        entitlements:
          type: object
          description: Entitlement-Map je Feature-Identifier (#1456).
          additionalProperties:
            $ref: '#/components/schemas/FeatureEntitlement'
        subscription:
          allOf:
            - $ref: '#/components/schemas/MeSubscription'
          nullable: true
          description: Abo-Status; `null` ohne Abo.
    BillingSubscriptionInput:
      type: object
      description: Eingabe zum Anlegen/Wechseln eines Abos (#1505 AK1/AK4).
      required: [plan, period]
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        period:
          type: string
          enum: [monthly, quarterly, yearly]
    BillingApproval:
      type: object
      description: >-
        Antwort auf Anlegen/Wechseln eines Abos (#1505 AK1/AK4). `approvalUrl` fehlt beim
        Wechsel, wenn PayPal keine erneute Zustimmung verlangt.
      properties:
        approvalUrl:
          type: string
          description: Zustimmungs-URL des PayPal-Clients.
    Invoice:
      type: object
      description: >-
        Rechnung zu einem Abrechnungszeitraum (#1505 AK5). Kein PDF, kein
        Zahlungsmittel (AK9) — `taxNote` trägt den §19-UStG-Hinweis.
      required: [id, number, periodStart, periodEnd, amountCents, taxNote]
      properties:
        id:
          type: integer
        number:
          type: string
          description: Fortlaufende Rechnungsnummer (`INV-<Jahr>-<6-stellig>`).
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        amountCents:
          type: integer
        taxNote:
          type: string
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Fehlerbeschreibung
        code:
          type: string
          enum: [plan_required, quota_exhausted]
          description: >-
            Nur bei paketbedingten Ablehnungen (#1456): maschinenlesbarer Grund.
            `plan_required` (403) heißt „Feature nicht im Paket",
            `quota_exhausted` (429) „Monatskontingent aufgebraucht". Alle übrigen
            Fehler tragen weiterhin ausschließlich `message`.
        feature:
          type: string
          description: Stabiler Feature-Identifier der Ablehnung (z. B. `groups`, `ai_assist`).
        requiredPlan:
          type: string
          description: Kleinstes Paket, das das Feature enthält.
        currentPlan:
          type: string
          description: Paket des anfragenden Nutzers.
    VapidPublicKey:
      type: object
      required:
        - publicKey
      properties:
        publicKey:
          type: string
          description: Öffentlicher VAPID-Schlüssel (URL-safe Base64) für PushManager.subscribe().
    PushSubscriptionKeys:
      type: object
      required:
        - p256dh
        - auth
      properties:
        p256dh:
          type: string
          description: Öffentlicher ECDH-Schlüssel des Clients (aus PushSubscription.getKey('p256dh')).
        auth:
          type: string
          description: Auth-Secret des Clients (aus PushSubscription.getKey('auth')).
    PushSubscriptionInput:
      type: object
      required:
        - endpoint
        - keys
      description: >-
        Die vom Browser über `PushManager.subscribe().toJSON()` gelieferte
        Subscription. `endpoint` identifiziert den Push-Dienst-Kanal eindeutig;
        `keys` trägt die Verschlüsselungsschlüssel für die Payload.
      properties:
        endpoint:
          type: string
          description: Eindeutige Push-Dienst-URL dieses Clients.
        expirationTime:
          type: integer
          format: int64
          nullable: true
          description: Ablaufzeitpunkt in Epoch-Millisekunden (meist null).
        keys:
          $ref: '#/components/schemas/PushSubscriptionKeys'
    PushUnsubscribeInput:
      type: object
      required:
        - endpoint
      properties:
        endpoint:
          type: string
          description: Push-Dienst-URL der abzumeldenden Subscription.
    PushSubscriptionAck:
      type: object
      required:
        - endpoint
      properties:
        endpoint:
          type: string
          description: Bestätigter Endpoint der gespeicherten bzw. entfernten Subscription.
    TestPushResult:
      type: object
      required:
        - sent
        - quote
      properties:
        sent:
          type: integer
          description: Anzahl der erfolgreich zugestellten Push-Nachrichten.
        quote:
          $ref: '#/components/schemas/Quote'
    AuthProviders:
      type: object
      required:
        - google
        - magicLink
      properties:
        google:
          type: boolean
          description: Google-OAuth ist konfiguriert.
        magicLink:
          type: boolean
          description: Magic Link per E-Mail ist konfiguriert.
    MagicLinkRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          description: Adresse, an die der Anmeldelink geht.
    MagicLinkVerifyRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Token aus dem Anmeldelink (Parameter `magic`).
    TestMailResult:
      type: object
      required:
        - sent
      properties:
        sent:
          type: boolean
          description: Ob die Testmail erfolgreich verschickt wurde.
    Quote:
      type: object
      required:
        - text
        - author
      properties:
        text:
          type: string
          description: Zitat-Text.
        author:
          type: string
          description: Urheber des Zitats.
    LlmProviderSelection:
      type: object
      required:
        - providerId
      description: >-
        Die Provider-Auswahl eines Nutzers für seine KI-Aufrufe (#1548). `providerId`
        referenziert einen eigenen (#1547) oder instanzweiten Provider; `null` = keine
        Auswahl. Wirksam (Gate- und Kontingent-Bypass auf den KI-Endpunkten) ist nur eine
        Auswahl auf einen eigenen Provider — bei instanzweiten Providern und ohne Auswahl
        läuft die Auflösung wie bisher über den instanzweit aktiven Provider.
      properties:
        providerId:
          type: [integer, 'null']
          description: ID des gewählten Providers oder null (keine Auswahl).
    LlmProvider:
      type: object
      required:
        - id
        - name
        - endpoint
        - model
        - isActive
        - kind
        - hasApiKey
        - own
      description: >-
        Ein LLM-Provider. Zwei Arten: `kind=custom` (frei anlegbar, bearbeitbar,
        löschbar; Key liegt write-only in der DB) und `kind=builtin` („Mistral“
        und „OpenRouter“ — fix, nicht lösch-/bearbeitbar; Key und Endpoint
        kommen aus den ENV-Variablen des Servers). Genau ein Provider ist
        effektiv aktiv (`isActive`): die explizite Radio-Auswahl oder — wenn
        kein Custom-Provider gewählt ist — der Built-in-Fallback (Mistral vor
        OpenRouter, nach ENV-Key-Präsenz). API-Keys werden bewusst NICHT
        zurückgegeben (Write-Only).
      properties:
        id:
          type: integer
          description: ID des Providers.
        name:
          type: string
          description: Anzeigename (z. B. "Mistral", "OpenRouter", "z.ai").
        endpoint:
          type: string
          description: >-
            Basis-URL des Providers (OpenAI-kompatibel); bei Custom-Providern kann
            auch die vollständige Chat-Completions-URL gespeichert sein (Legacy).
        model:
          type: string
          description: >-
            Effektive Modellkennung (z. B. "mistral-medium-latest"). Bei Built-ins
            der Default aus ENV/Code, solange der Nutzer keins gewählt hat; leer bei
            Custom-Providern ohne Modellwahl.
        isActive:
          type: boolean
          description: Ist dieser Provider der effektiv aktive (Radio-Button-Auswahl oder Fallback)?
        kind:
          type: string
          enum: [custom, builtin]
          description: '„custom“ = frei verwaltbar, „builtin“ = fix (Mistral/OpenRouter).'
        hasApiKey:
          type: boolean
          description: >-
            Ob ein Key vorhanden ist (Built-in: ENV-Variable gesetzt; Custom: DB-Key
            gesetzt). Signalisiert nur die Präsenz, nie den Wert.
        own:
          type: boolean
          description: >-
            Gehört diese Zeile dem abfragenden Nutzer (#1549)? `true` nur für eigene
            Custom-Provider; instanzweite Zeilen (`userId = null`, inkl. Built-ins)
            und fremde Zeilen sind `false`. Basis des UI-Markers „eigen“/„instanzweit“
            und des Free-Gates (nur eigene Custom-Provider öffnen KI-Features).
    LlmProviderInput:
      type: object
      required:
        - name
        - endpoint
        - apiKey
        - model
      description: >-
        Anlegen eines Custom-Providers: Name, Endpoint (gültige http(s)-URL),
        API-Key und Modell sind Pflicht. Das Modell ist bewusst schon beim
        Anlegen Pflicht, weil der `/models`-Endpoint nicht bei jedem Anbieter
        erreichbar/öffentlich ist — nach dem Anlegen kann es über die
        Modellliste des Providers geändert werden. Der Key wird nie
        zurückgegeben.
      properties:
        name:
          type: string
          description: Anzeigename des Providers.
        endpoint:
          type: string
          description: >-
            OpenAI-kompatible Basis-URL (http/https), z. B. https://api.mistral.ai/v1 —
            ein `/chat/completions`-Suffix wird toleriert und abgeschnitten.
        apiKey:
          type: string
          description: API-Key des Providers (Write-Only).
        model:
          type: string
          description: Modellkennung, z. B. `glm-4.7` (Pflicht — Modellliste nicht immer abrufbar).
    LlmProviderUpdate:
      type: object
      description: >-
        Bearbeiten eines Providers: alle Felder optional; der API-Key wird nur bei
        nicht-leerem String gesetzt (Bearbeiten-Dialog startet leer). Für Built-in-
        Provider ist ausschließlich `model` erlaubt (Modellwahl aus der Modellliste)
        — alles andere führt zu HTTP 400.
      properties:
        name:
          type: string
          description: Neuer Anzeigename (nur Custom-Provider).
        endpoint:
          type: string
          description: Neue Endpoint-URL (nur Custom-Provider).
        apiKey:
          type: string
          description: Neuer API-Key (nur bei Änderung senden; leer = unverändert; nur Custom-Provider).
        model:
          type: string
          description: Gewählte Modellkennung (Custom- und Built-in-Provider).
    LlmModel:
      type: object
      required:
        - id
        - name
      description: >-
        Ein verfügbares Modell eines Providers, aus dessen OpenAI-kompatibler
        `GET /models`-Antwort ausgelesen (nach `id` sortiert).
      properties:
        id:
          type: string
          description: Modellkennung (z. B. `mistral-medium-latest`).
        name:
          type: string
          description: Anzeigename — fiel der Upstream keinen, gilt die Modellkennung.
    LlmProviderTestDraft:
      type: object
      required:
        - endpoint
        - apiKey
        - model
      description: >-
        Eingabe für `POST /llm-providers/test-dry`: die Formulardaten des
        Provider-Dialogs (#1577). Leeres `apiKey` mit gesetztem `providerId`
        nutzt den gespeicherten Key des Providers (Bearbeiten-Modus,
        „leer = unverändert").
      properties:
        endpoint:
          type: string
          description: OpenAI-kompatible Basis-URL (http/https) aus dem Formular.
        apiKey:
          type: string
          description: API-Key aus dem Formular (leer = gespeicherter Key bei providerId).
        model:
          type: string
          description: Modellkennung aus dem Formular.
        providerId:
          type: integer
          description: ID des bearbeiteten Providers (optional; Besitz wird geprüft).
    LlmProviderTestResult:
      type: object
      required:
        - ok
      description: >-
        Ergebnis von `POST /llm-providers/{id}/test`: `ok=true` mit Modell,
        Latenz und Antwort-Auszug bei Erfolg; `ok=false` mit konkreter
        Fehlerursache (inkl. Upstream-Detail wie „Check your subscription“)
        bei Misserfolg. Nie den API-Key.
      properties:
        ok:
          type: boolean
          description: Hat der Test-Prompt den Provider erfolgreich durchlaufen?
        model:
          type: string
          description: Effektiv genutztes Modell (Erfolgsfall).
        latencyMs:
          type: number
          description: Round-Trip-Zeit des Test-Calls in Millisekunden (Erfolgsfall).
        sample:
          type: string
          description: Gekürzter Antwort-Text des Modells (Erfolgsfall).
        message:
          type: string
          description: Konkrete Fehlerursache bei Misserfolg (inkl. Upstream-Detail).
    LlmModels:
      type: object
      required:
        - models
      description: >-
        Antwort von `GET /llm-providers/{id}/models`: die verfügbaren Modelle des
        Providers, dynamisch aus dessen OpenAI-kompatibler `GET /models`-Antwort
        ausgelesen und nach `id` sortiert. Scheitert der Live-Abruf, kann ein
        Built-in mit Katalog (Mistral) diesen als Fallback liefern (`source:
        'fallback'`) — stabile `-latest`-Aliasse, damit die Modellwahl möglich
        bleibt (z. B. bei abgelaufenem Mistral-Abo, HTTP 402).
      properties:
        models:
          type: array
          description: Verfügbare Modelle (live geladen; im Fallback-Fall eingebauter Katalog).
          items:
            $ref: '#/components/schemas/LlmModel'
        source:
          type: string
          enum: [live, fallback]
          description: >-
            Herkunft der Liste: `live` (oder abwesend) = vom Provider geladen;
            `fallback` = eingebauter Katalog, weil der Live-Abruf scheiterte.
    NearbyTask:
      type: object
      required:
        - id
        - title
        - distanceKm
      description: >-
        Eintrag der Nearby-Liste (GET /tasks/nearby, #1066): ein offener Task mit
        Koordinaten, aufsteigend nach Distanz zur übergebenen Position (max. 10).
      properties:
        id:
          type: integer
        title:
          type: string
        distanceKm:
          type: number
          format: float
          description: Distanz zur Position in km, auf eine Nachkommastelle gerundet.
    ReverseGeocodeResponse:
      type: object
      required:
        - address
      description: >-
        Antwort von GET /reverse-geocode (Issue #866): die ermittelte Adresse
        (leer bei Fehler/Rate-Limit/Offline).
      properties:
        address:
          type: string
          description: >-
            Lesbare Adresse (z. B. "Musterstraße 1, 12345 Musterstadt").
            Leer bei Fehler/Rate-Limit/Offline — die Position wird ohne Adresse
            angezeigt.
    GeocodeSearchResult:
      type: object
      required:
        - address
        - lat
        - lon
      description: >-
        Ein Adress-Vorschlag der Adresssuche (Forward Geocoding, GET /geocode-search).
      properties:
        address:
          type: string
          description: Lesbare Adresse (Nominatim-Anzeigename).
        lat:
          type: number
          format: float
          description: Breitengrad des Vorschlags.
        lon:
          type: number
          format: float
          description: Längengrad des Vorschlags.
