      summary: Markteinführungs-Kennzahlen auswerten (#1989)
      description: >-
        Nur für Admins (403 sonst). Liefert je Registrierungsperiode (Kalenderwoche bzw. Monat,
        aufsteigend) die Zahl neuer Konten (ohne Admin-Konten) sowie Aktivierung (Erledigung am
        Registrierungstag), Day-7-Rückkehr (Erledigung am siebten Tag; nur Konten mit vergangenem
        Tag 7), geteilte Wochen-Karten und versandte Einladungen als Quoten. Nur Summen, keine
        Nutzer-IDs; Zellen mit weniger als 5 Nutzern werden als `unterdrueckt` ausgegeben.
      operationId: getKpis
      tags: [admin]
