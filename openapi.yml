openapi: 3.0.0
info:
  title: Priority Pilot API
  description: >-
    Vertrag für die Aufgaben-Priorisierung über einen gewichteten
    Abhängigkeitsgraphen. Aus dieser Datei werden via `openapi-typescript`
    sowohl die Server-Typen (`server/src/api.d.ts`) als auch die Client-Typen
    (`client/src/schema.d.ts`) erzeugt.
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  /tasks:
    get:
      summary: Alle Tasks auflisten
      operationId: listTasks
      responses:
        '200':
          description: Liste aller Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      summary: Neuen Task anlegen
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      summary: Einen Task abrufen
      operationId: getTask
      responses:
        '200':
          description: Der angeforderte Task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Einen Task teilweise aktualisieren
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Der aktualisierte Task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Einen Task löschen
      operationId: deleteTask
      responses:
        '204':
          description: Task wurde gelöscht
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{id}/dependencies:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      summary: Abhängigkeit (Vorgänger) zu einem Task hinzufügen
      description: >-
        Fügt dem Task `{id}` eine Abhängigkeit hinzu — den im Body angegebenen
        Task, von dem `{id}` abhängt (Vorgänger/Prerequisite). Entspricht
        `task.addDependency()`. Eine Abhängigkeit, die einen Zyklus erzeugen
        würde, wird mit `409` abgelehnt.
      operationId: addDependency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependencyInput'
      responses:
        '201':
          description: Abhängigkeit wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /tasks/{id}/dependencies/{depId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - name: depId
        in: path
        required: true
        description: ID der zu entfernenden Abhängigkeit (Vorgänger-Task, von dem `{id}` abhängt)
        schema:
          type: integer
    delete:
      summary: Abhängigkeit (Vorgänger) von einem Task entfernen
      operationId: removeDependency
      responses:
        '204':
          description: Abhängigkeit wurde entfernt
        '404':
          $ref: '#/components/responses/NotFound'
  /pillars:
    get:
      summary: Alle Lebensbalance-Säulen auflisten
      description: >-
        Liefert die fünf festen Säulen inkl. ihres prozentualen Anteils
        (`weight`); die Gewichte summieren sich über alle Säulen auf 100.
      operationId: listPillars
      responses:
        '200':
          description: Liste aller Säulen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pillar'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Neue Säule anlegen
      description: >-
        Legt eine neue Lebensbalance-Säule für den eingeloggten Nutzer an.
        Der weight startet mit 0; der Nutzer muss die Gewichte später über
        PUT /pillars/weights neu verteilen.
      operationId: createPillar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PillarCreate'
      responses:
        '201':
          description: Säule wurde angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pillar'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
  /pillars/{id}:
    parameters:
      - $ref: '#/components/parameters/PillarId'
    patch:
      summary: Säule teilweise aktualisieren
      description: >-
        Ändert name und/oder description einer Säule. Bei Namenskonflikt 409,
        bei unbekannter ID 404.
      operationId: updatePillar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PillarUpdate'
      responses:
        '200':
          description: Die aktualisierte Säule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pillar'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Säule löschen
      description: >-
        Löscht eine Säule inklusive aller Beiträge und renormiert
        die verbleibenden Anteile auf 100 %.
      operationId: deletePillar
      responses:
        '204':
          description: Säule wurde gelöscht
        '404':
          $ref: '#/components/responses/NotFound'
  /pillars/weights:
    put:
      summary: Gewichtung (100 %-Verteilung) über alle Säulen setzen
      description: >-
        Setzt die prozentuale Verteilung über die Säulen. Der Body muss genau
        alle existierenden Säulen enthalten; die Summe der Gewichte muss 100
        ergeben und jedes Gewicht `>= 0` sein.
      operationId: setPillarWeights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PillarWeightsInput'
      responses:
        '200':
          description: Die aktualisierte Liste aller Säulen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pillar'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /pillars/advisor:
    post:
      summary: Aktivitäten-Berater für die Säulen (Mistral)
      description: >-
        Kleiner Berater auf Basis der Säulen: schlägt konkrete Aktivitäten vor und
        ordnet jede Aktivität den Säulen zu, auf die sie einzahlen würde. Als Rubrik
        dienen die Kurzbeschreibungen der Säulen aus den Einstellungen
        (`Pillar.description`). Optional lenkt eine frei formulierte Frage bzw.
        Situationsbeschreibung die Vorschläge; ohne Frage deckt der Berater alle
        Säulen ab. Die Beratung erfolgt über die Mistral-API (`MISTRAL_API_KEY`,
        Modell via `MISTRAL_MODEL`, Default `mistral-small-latest`). Fehlt der Key
        oder gibt es keine Säulen, antwortet der Endpoint mit 503; bei
        Upstream-/Format-Fehlern mit 502.
      operationId: advisePillarActivities
      parameters:
        - name: provider
          in: query
          required: false
          description: >-
            Optionaler Provider-Pinning (#749/#951): Name eines konfigurierten
            Providers — überschreibt den aktiven Provider für diesen EINEN Aufruf.
            Fehlt der Parameter → der aktive Provider (`llm_providers`, #951).
            Ungültiger Wert → HTTP 400.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityAdvisorInput'
      responses:
        '200':
          description: Vorgeschlagene Aktivitäten samt Säulen-Zuordnung und Begründung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityAdvisorResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/suggest-pillars:
    post:
      summary: Säulen-Einzahlung per Mistral klassifizieren
      description: >-
        Schlägt anhand von Titel/Beschreibung/Kontext vor, auf welche Säulen eine
        Aufgabe einzahlt, samt Konfidenz (0–100) je Säule. Die Klassifikation
        erfolgt über die Mistral-API (`MISTRAL_API_KEY`, Modell via `MISTRAL_MODEL`,
        Default `mistral-small-latest`). Fehlt der Key oder gibt es keine Säulen,
        antwortet der Endpoint mit 503; bei Upstream-/Format-Fehlern mit 502.
      operationId: suggestPillars
      parameters:
        - name: provider
          in: query
          required: false
          description: >-
            Optionaler Provider-Pinning (#749/#951): Name eines konfigurierten
            Providers — überschreibt den aktiven Provider für diesen EINEN Aufruf.
            Fehlt der Parameter → der aktive Provider (`llm_providers`, #951).
            Ungültiger Wert → HTTP 400.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestPillarsInput'
      responses:
        '200':
          description: Vorgeschlagene Säulen-Einzahlungen mit Konfidenz
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestPillarsResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/suggest-pillars/feedback:
    post:
      summary: Säulen-Korrektur als Feedback speichern
      description: >-
        Speichert eine vom Nutzer bestätigte/korrigierte Säulen-Zuordnung (Titel/
        Beschreibung + final gewählte Säulen). Die jüngsten Korrekturen fließen als
        gelernte Few-Shot-Beispiele in nachfolgende Klassifikationen ein und
        kalibrieren sie personalisiert (Feedback-Loop, siehe #45). Da es kein
        Nutzerkonzept gibt, wirkt das Feedback global.
      operationId: recordPillarFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PillarFeedbackInput'
      responses:
        '201':
          description: Das Feedback-Sample wurde gespeichert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PillarFeedbackResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tasks/parse-text:
    post:
      summary: Task-Freitext per Mistral in strukturierte Felder parsen
      description: >-
        Extrahiert aus einem frei formulierten Text (Schnellerfassung, #235) die
        strukturierten Felder einer Aufgabe (Titel plus optional Beschreibung,
        Priorität, geschätzter Aufwand und Deadline). Das Parsing erfolgt über die
        Mistral-API (`MISTRAL_API_KEY`, Modell via `MISTRAL_MODEL`, Default
        `mistral-small-latest`). Fehlt der Key, antwortet der Endpoint mit 503; bei
        Upstream-/Format-Fehlern mit 502.
      operationId: parseTaskText
      parameters:
        - name: provider
          in: query
          required: false
          description: >-
            Optionaler Provider-Pinning (#749/#951): Name eines konfigurierten
            Providers — überschreibt den aktiven Provider für diesen EINEN Aufruf.
            Fehlt der Parameter → der aktive Provider (`llm_providers`, #951).
            Ungültiger Wert → HTTP 400.
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseTaskInput'
      responses:
        '200':
          description: Aus dem Text extrahierte, strukturierte Task-Felder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsedTask'
        '400':
          $ref: '#/components/responses/ValidationError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /health:
    get:
      summary: Liveness-Check
      description: >-
        Billiger Liveness-Check für Post-Deploy-Verifikation und Monitoring —
        robuster als der fachliche `GET /next`, da ohne Datenbank-Zugriff.
      operationId: getHealth
      responses:
        '200':
          description: Der Dienst läuft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /forest:
    get:
      summary: Aufgabenwald nach Wertschöpfung sortiert
      description: >-
        Liefert die Wurzel-Tasks (ohne Abhängigkeiten) als Bäume, absteigend
        nach Wertbeitrag sortiert (siehe `buildTaskForest`).
      operationId: getForest
      responses:
        '200':
          description: Liste der Aufgabenbäume
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskTreeNode'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /next:
    get:
      summary: Nächsten wichtigen Task ermitteln
      description: >-
        Liefert den Task mit höchster Priorität, dessen Abhängigkeiten alle
        abgeschlossen sind (siehe `findNextImportantTask`).
      operationId: getNextTask
      responses:
        '200':
          description: Der nächste wichtige Task oder `null`, falls keiner vorhanden ist
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/Task'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /suggestions:
    get:
      summary: '"Was ist jetzt dran?"-Vorschlagsliste'
      description: >-
        Liefert die nach Score sortierte, post-gefilterte Vorschlagsliste
        (Konzept §4.3): Priorität, Deadline-Nähe und Balance-Korrektur fließen
        ein, der Überlastungsschutz begrenzt die Liste (siehe
        `findSuggestedTasks`). Der Abhängigkeitsfilter aus `GET /next` bleibt
        vorgeschaltet.
      operationId: getSuggestions
      responses:
        '200':
          description: Nach Score sortierte Vorschlagsliste (ggf. leer)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /reverse-geocode:
    get:
      summary: Reverse Geocoding — Koordinaten → Adresse
      description: >-
        Ermittelt aus geographischen Koordinaten (lat/lon) eine lesbare Adresse
        über OpenStreetMap Nominatim (Issue #866). Bei Rate-Limit/Timeout/Offline
        wird eine leere Adresse zurückgegeben (Position anzeigen ohne Adresse).
        Rate-Limit: 1 req/sec (Nominatim-Policy).
      operationId: reverseGeocode
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: string
            pattern: '^-?\d+\.?\d*$'
          description: Breitengrad (z. B. 52.52)
        - name: lon
          in: query
          required: true
          schema:
            type: string
            pattern: '^-?\d+\.?\d*$'
          description: Längengrad (z. B. 13.405)
      responses:
        '200':
          description: Adresse (leer bei Fehler/Rate-Limit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReverseGeocodeResponse'
        '400':
          description: Ungültige Parameter (fehlend oder keine Zahl)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /geocode-search:
    get:
      summary: Adresssuche (Forward Geocoding) — Suchtext → Adress-Vorschläge
      description: >-
        Sucht Adress-Vorschläge zu einem Suchtext über OpenStreetMap Nominatim, für
        die Ortsauswahl im Task-Formular. Bei Rate-Limit/Timeout/Offline wird eine
        leere Liste zurückgegeben. Rate-Limit: 1 req/sec (Nominatim-Policy).
      operationId: geocodeSearch
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Suchtext (z. B. "Musterstraße 1 Berlin")
      responses:
        '200':
          description: Adress-Vorschläge (leer bei Fehler/Rate-Limit, max. 5 Einträge)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeocodeSearchResult'
        '400':
          description: Ungültiger oder fehlender q-Parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores:
    get:
      summary: Vergebene Gamification-Punkte je erledigtem Task
      description: >-
        Liefert je erledigtem Task einen Score-Eintrag (Konzept §4.4): beim
        Statuswechsel auf `Done` werden Punkte aus `estimatedEffort × priority`
        vergeben, pünktlich (volle) bzw. verspätet (reduzierte Punkte).
      operationId: getScores
      responses:
        '200':
          description: Liste der vergebenen Score-Einträge
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoreEntry'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /scores/by-pillar:
    get:
      summary: Balance-Stand — Punkte anteilig je Säule aggregiert
      description: >-
        Aggregiert die vergebenen Punkte anteilig (über `share` aus
        `task_pillars`) je Säule — der sichtbare Balance-Stand der Säulen.
      operationId: getScoresByPillar
      responses:
        '200':
          description: Punkte-Summe je Säule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PillarScore'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /series:
    get:
      summary: Alle Serien-Templates auflisten
      operationId: getSeries
      responses:
        '200':
          description: Liste der Serien-Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Series'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Neues Serien-Template anlegen
      operationId: createSeries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesCreate'
      responses:
        '201':
          description: Template angelegt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /series/{id}:
    parameters:
      - $ref: '#/components/parameters/SeriesId'
    get:
      summary: Ein Serien-Template abrufen
      operationId: getSeriesById
      responses:
        '200':
          description: Das Serien-Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Serien-Template teilweise aktualisieren (gilt nur für künftige Instanzen)
      operationId: updateSeries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesUpdate'
      responses:
        '200':
          description: Aktualisiertes Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Series'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Serien-Template löschen
      operationId: deleteSeries
      parameters:
        - name: cascade
          in: query
          required: false
          description: >-
            `true` löscht zusätzlich alle generierten Instanzen (Tasks mit dieser `seriesId`).
            Default `false`: nur das Template wird entfernt; die Instanzen bleiben erhalten und
            werden von der Serie abgekoppelt (`seriesId → null`). Ihre dauerhafte Provenienz
            (`originSeriesId`) bleibt erhalten, sodass sich ehemalige Instanzen später noch
            gruppieren/filtern lassen.
          schema:
            type: boolean
      responses:
        '204':
          description: Template gelöscht
        '404':
          $ref: '#/components/responses/NotFound'
  /series/generate-all:
    post:
      summary: Fällige Instanzen aller aktiven Serien materialisieren (idempotent)
      description: >-
        Stößt die serverseitige Materialisierung an: erzeugt je fälligem Termin
        aller aktiven Serien (im Auth-Modus nur der eigenen) eine eigenständige
        `Task`-Instanz. Bereits materialisierte Termine werden übersprungen
        (keine Dubletten). Gibt die Anzahl der neu erzeugten Instanzen zurück.
      operationId: generateAllSeries
      responses:
        '200':
          description: Anzahl der neu materialisierten Instanzen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesGenerateAllResult'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /series/{id}/generate:
    parameters:
      - $ref: '#/components/parameters/SeriesId'
    post:
      summary: Fällige Instanzen bis `until` materialisieren (idempotent)
      description: >-
        Erzeugt je fälligem Termin im Fenster `[startDate, until]` genau eine
        eigenständige `Task`-Instanz mit `seriesId`. Bereits materialisierte
        Termine werden übersprungen (keine Dubletten). Gibt nur die neu
        erzeugten Instanzen zurück.
      operationId: generateSeriesInstances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesGenerateInput'
      responses:
        '201':
          description: Neu materialisierte Instanzen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /push/vapid-public-key:
    get:
      summary: Öffentlichen VAPID-Schlüssel für Web-Push abrufen
      description: >-
        Liefert den öffentlichen VAPID-Schlüssel, den das Frontend für
        `PushManager.subscribe({ applicationServerKey })` benötigt (Issue #355).
        503, wenn Web-Push serverseitig nicht konfiguriert ist (VAPID-Schlüssel
        fehlen).
      operationId: getVapidPublicKey
      responses:
        '200':
          description: Der öffentliche VAPID-Schlüssel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VapidPublicKey'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /push/subscribe:
    post:
      summary: Web-Push-Subscription des Nutzers speichern
      description: >-
        Speichert die vom Browser (`PushManager.subscribe()`) erzeugte
        Subscription unter dem eingeloggten Nutzer (Datenisolation #207).
        Idempotent: eine bereits bekannte `endpoint`-URL wird aktualisiert statt
        dupliziert. 503, wenn Web-Push nicht konfiguriert ist.
      operationId: subscribePush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionInput'
      responses:
        '201':
          description: Subscription gespeichert/aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscriptionAck'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /push/unsubscribe:
    post:
      summary: Web-Push-Subscription des Nutzers löschen
      description: >-
        Entfernt die Subscription des eingeloggten Nutzers zum angegebenen
        `endpoint`. Idempotent: unbekannter Endpoint ⇒ trotzdem 200. 503, wenn
        Web-Push nicht konfiguriert ist.
      operationId: unsubscribePush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushUnsubscribeInput'
      responses:
        '200':
          description: Subscription entfernt (oder war nicht vorhanden)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscriptionAck'
        '400':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /push/test:
    post:
      summary: Test-Push mit zufälligem Zitat senden
      description: >-
        Sendet einen Test-Push an alle Subscriptions des eingeloggten Nutzers.
        Das Zitat wird zufällig aus 10 fixen Lebensweisheiten gewählt. 503, wenn
        Web-Push nicht konfiguriert ist.
      operationId: sendTestPush
      tags: [push]
      responses:
        '200':
          description: Test-Push abgeschickt (auch wenn keine Subscription vorhanden, sent=0)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestPushResult'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /llm-providers:
    get:
      summary: Konfigurierte LLM-Provider auflisten
      description: >-
        Listet alle LLM-Provider inklusive effektiver Aktiv-Markierung — Built-ins
        (Mistral/OpenRouter) zuerst, danach die Custom-Provider. Ohne explizit
        aktiven Provider ist der Built-in-Fallback als aktiv markiert. API-Keys
        werden bewusst NICHT zurückgegeben (Write-Only).
      operationId: listLlmProviders
      tags: [llm]
      responses:
        '200':
          description: Liste aller Provider (ohne API-Keys)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LlmProvider'
    post:
      summary: Neuen Custom-Provider anlegen
      description: >-
        Legt einen neuen Custom-Provider an — inaktiv (Aktivierung über die
        Radio-Auswahl) und ohne Modell (Wahl über die Modellliste). Der Endpoint
        muss eine gültige http(s)-URL sein; andernfalls HTTP 400. Die Antwort
        enthält den Provider ohne API-Key.
      operationId: createLlmProvider
      tags: [llm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmProviderInput'
      responses:
        '201':
          description: Provider angelegt (ohne API-Key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProvider'
        '400':
          description: Ungültiger Payload (Validierung fehlgeschlagen)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /llm-providers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Providers
        schema:
          type: integer
    put:
      summary: LLM-Provider aktualisieren
      description: >-
        Aktualisiert einen Provider. Alle Felder optional: abwesende Felder bleiben
        unverändert. Der API-Key wird nur gesetzt, wenn ein nicht-leerer String
        übergeben wird (Write-Only, Bearbeiten-Dialog startet leer). Für Built-in-
        Provider ist ausschließlich `model` erlaubt — andere Felder führen zu HTTP 400.
      operationId: updateLlmProvider
      tags: [llm]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmProviderUpdate'
      responses:
        '200':
          description: Aktualisierter Provider (ohne API-Key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProvider'
        '400':
          description: Ungültiger Payload oder Built-in-Provider (nur `model` erlaubt)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Provider unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Custom-Provider löschen
      description: >-
        Löscht einen Custom-Provider (Built-ins antworten HTTP 400). War er aktiv,
        übernimmt automatisch der Built-in-Fallback. Response 204 ohne Body.
      operationId: deleteLlmProvider
      tags: [llm]
      responses:
        '204':
          description: Provider gelöscht
        '400':
          description: Built-in-Provider ist fix und nicht löschbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Provider unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /llm-providers/{id}/activate:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Providers
        schema:
          type: integer
    post:
      summary: Provider als aktiv setzen
      description: >-
        Setzt den Provider als einzigen aktiven Provider: alle anderen werden
        deaktiviert (Radio-Button-Logik) — für Custom- UND Built-in-Provider.
      operationId: activateLlmProvider
      tags: [llm]
      responses:
        '200':
          description: Aktivierter Provider (ohne API-Key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProvider'
        '404':
          description: Provider unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /llm-providers/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Providers
        schema:
          type: integer
    post:
      summary: Provider-Verbindung testen
      description: >-
        Schickt einen minimalen Test-Prompt über den Provider — mit denselben
        Parametern wie echte KI-Aufrufe (Modell, Key, Endpoint,
        JSON-Mode) — und meldet Erfolg inkl. Latenz oder die konkrete
        Fehlerursache (Auth/Modell/Abo/Netzwerk) mit vom Upstream
        gelieferter Detailmeldung. Testet den Provider unabhängig davon,
        ob er aktiv ist — so lässt sich ein neu angelegter Provider vor der
        Aktivierung prüfen.
      operationId: testLlmProvider
      tags: [llm]
      responses:
        '200':
          description: Testergebnis (Feld `ok` unterscheidet Erfolg/Misserfolg)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProviderTestResult'
        '404':
          description: Provider unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /llm-providers/{id}/models:
    parameters:
      - name: id
        in: path
        required: true
        description: ID des Providers
        schema:
          type: integer
    get:
      summary: Verfügbare Modelle eines Providers lesen
      description: >-
        Fragt die Modellliste des Providers von dessen OpenAI-kompatiblen
        `GET /models`-Endpoint ab (mit API-Key, falls vorhanden) und liefert sie
        nach `id` sortiert — die Basis für die Modell-Auswahl im Frontend. Das
        Ergebnis wird serverseitig kurz (5 min) je Provider gecacht. Ist der
        Upstream nicht erreichbar oder antwortet ungültig, folgt HTTP 502.
      operationId: listLlmProviderModels
      tags: [llm]
      responses:
        '200':
          description: Verfügbare Modelle des Providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmModels'
        '404':
          description: Provider unbekannt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/BadGateway'
components:
  parameters:
    SeriesId:
      name: id
      in: path
      required: true
      description: ID der Serie
      schema:
        type: integer
    TaskId:
      name: id
      in: path
      required: true
      description: ID des Tasks
      schema:
        type: integer
    PillarId:
      name: id
      in: path
      required: true
      description: ID der Säule
      schema:
        type: integer
  responses:
    ValidationError:
      description: Ungültige Eingabe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ressource nicht gefunden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Konflikt — die Abhängigkeit würde einen Zyklus erzeugen
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Interner Serverfehler (z. B. Datenbankfehler)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: Fehler beim Upstream-Dienst (Mistral nicht erreichbar/ungültige Antwort)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Dienst nicht konfiguriert (z. B. fehlender API-Key oder keine Säulen)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          description: Konstante Statuskennung; signalisiert einen lebenden Dienst.
    TaskStatus:
      type: string
      enum:
        - Open
        - In process
        - Done
      default: Open
      description: Bearbeitungsstatus des Tasks
    Task:
      type: object
      required:
        - id
        - title
        - status
        - priority
        - estimatedEffort
        - pillars
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        estimatedEffort:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
          default: 0.5
          description: Geschätzter Eigenaufwand in Tagen (1 Tag ≙ 14 h reguläre Wachzeit)
        actualEffort:
          type: number
          format: float
          minimum: 0
          nullable: true
        description:
          type: string
          nullable: true
        address:
          type: string
          maxLength: 255
          nullable: true
          description: >-
            Adresse des Aufgabenorts, über die Adresssuche (Forward-Geocoding,
            OpenStreetMap Nominatim) ausgewählt. `null`, wenn kein Ortsbezug gesetzt ist.
        deadline:
          type: string
          format: date-time
          nullable: true
        autoDeleteAfterDeadline:
          type: boolean
          description: >-
            `true`, wenn die Aufgabe bei verpasster Deadline automatisch gelöscht
            werden soll (3 Tage nach Ablauf, nur wenn nicht erledigt, #523).
        seriesId:
          type: integer
          nullable: true
          description: >-
            ID des Serien-Templates, aus dem diese Instanz generiert wurde
            (`null` ⇒ gewöhnlicher Einzel-Task oder nach Abkoppeln von einer
            gelöschten Serie), siehe Serienaufgaben (#120).
        originSeriesId:
          type: integer
          nullable: true
          description: >-
            Dauerhafte Provenienz (#553): ID der Serie, aus der dieser Task
            ursprünglich erzeugt wurde. Wird beim Generieren einmalig gesetzt und
            NIE geändert — auch beim Löschen der Serie nicht. Während `seriesId`
            die Live-Verbindung hält (und beim Abkoppeln auf null fällt), bleibt
            `originSeriesId` als Herkunftsnachweis erhalten. `null` ⇒ nie Teil
            einer Serie.
        isException:
          type: boolean
          default: false
          description: >-
            `true`, wenn diese generierte Serien-Instanz individuell geändert
            wurde — Template-Generierung lässt solche Instanzen unberührt.
        pillars:
          type: array
          description: >-
            Säulen, auf die der Task einzahlt (0..n). Der `share` verteilt 100 %
            über die referenzierten Säulen; `confidence` ist die Konfidenz je Beitrag.
          items:
            $ref: '#/components/schemas/TaskPillarContribution'
        checklist:
          type: array
          description: >-
            Abhakbare Checkliste (0–20 Einträge) zum Zerlegen des Tasks in Teilschritte
            (#531). Default leer; bestehende Tasks ohne Checkliste liefern `[]`
            (rückwärtskompatibel).
          items:
            $ref: '#/components/schemas/ChecklistItem'
    TaskCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        estimatedEffort:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
          default: 0.5
        actualEffort:
          type: number
          format: float
          minimum: 0
          nullable: true
        description:
          type: string
          nullable: true
        address:
          type: string
          maxLength: 255
          nullable: true
          description: >-
            Adresse des Aufgabenorts, über die Adresssuche (Forward-Geocoding,
            OpenStreetMap Nominatim) ausgewählt. Fehlt das Feld, bleibt der Task
            ohne Ortsbezug.
        deadline:
          type: string
          format: date-time
          nullable: true
        autoDeleteAfterDeadline:
          type: boolean
          description: >-
            Wenn `true`, wird die Aufgabe 3 Tage nach einer verpassten Deadline
            automatisch gelöscht (nur wenn nicht erledigt, #523).
        pillars:
          type: array
          description: >-
            Säulen, auf die der Task einzahlt (0..n). Wird das Feld weggelassen,
            bleibt der Task ohne Säulen. Bei mindestens einer Säule muss die Summe
            aller `share` 100 ergeben.
          items:
            $ref: '#/components/schemas/TaskPillarContributionInput'
        checklist:
          type: array
          description: >-
            Abhakbare Checkliste des Tasks (max. 20 Einträge, #531). Fehlt das Feld,
            bleibt die Liste leer.
          items:
            $ref: '#/components/schemas/ChecklistItem'
    TaskUpdate:
      type: object
      description: Alle Felder optional — gesetzte Felder werden aktualisiert.
      properties:
        title:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          type: integer
          minimum: 1
          maximum: 5
        estimatedEffort:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
        actualEffort:
          type: number
          format: float
          minimum: 0
          nullable: true
        description:
          type: string
          nullable: true
        address:
          type: string
          maxLength: 255
          nullable: true
          description: >-
            Adresse des Aufgabenorts. Fehlt das Feld, bleibt sie unverändert;
            `null` entfernt einen bestehenden Ortsbezug.
        deadline:
          type: string
          format: date-time
          nullable: true
        autoDeleteAfterDeadline:
          type: boolean
          description: >-
            Wenn `true`, wird die Aufgabe 3 Tage nach einer verpassten Deadline
            automatisch gelöscht (nur wenn nicht erledigt, #523).
        pillars:
          type: array
          description: >-
            Ersetzt die Säulen-Beiträge des Tasks vollständig. Eine leere Liste
            entfernt alle Beiträge; bei mindestens einer Säule muss die Summe
            aller `share` 100 ergeben. Fehlt das Feld, bleiben die Beiträge unverändert.
          items:
            $ref: '#/components/schemas/TaskPillarContributionInput'
        checklist:
          type: array
          description: >-
            Ersetzt die Checklisten-Einträge vollständig (max. 20, #531). Eine leere
            Liste leert die Checkliste; fehlt das Feld, bleibt sie unverändert.
          items:
            $ref: '#/components/schemas/ChecklistItem'
    DependencyInput:
      type: object
      required:
        - dependingTaskId
      properties:
        dependingTaskId:
          type: integer
          description: >-
            ID des Tasks, von dem `{id}` abhängt (Vorgänger/Prerequisite).
            Entspricht der Spalte `dependingTaskId` im Join `dependencies`.
        weight:
          type: number
          format: float
          minimum: 0
          default: 1
          description: Gewicht der Abhängigkeit
    TaskPillarContribution:
      type: object
      description: >-
        Beitrag eines Tasks auf eine Lebensbalance-Säule (n:m). `share` verteilt
        100 % über die Säulen eines Tasks; `confidence` ist die Konfidenz je Beitrag.
      required:
        - pillarId
        - share
        - confidence
      properties:
        pillarId:
          type: integer
          minimum: 1
          description: ID der Säule, auf die der Task einzahlt
        share:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Investitions-Anteil in % (Summe über die Säulen eines Tasks = 100)
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 100
          default: 100
          description: Konfidenz in % (0–100), wie sicher der Beitrag auf die Säule einzahlt
    TaskPillarContributionInput:
      type: object
      description: >-
        Eingabe eines Säulen-Beitrags. `confidence` ist optional (Default 100 %).
      required:
        - pillarId
        - share
      properties:
        pillarId:
          type: integer
          minimum: 1
          description: ID der Säule, auf die der Task einzahlt
        share:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Investitions-Anteil in % (Summe über die Säulen eines Tasks = 100)
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 100
          default: 100
          description: Konfidenz in % (0–100); fehlt der Wert, gilt 100 %
    ChecklistItem:
      type: object
      description: >-
        Eintrag einer abhakbaren Checkliste eines Tasks (#531). Der Titel muss
        nicht-leer (1–255 Zeichen) sein; `completed` ist optional (Default `false`).
      required:
        - id
        - title
        - completed
      properties:
        id:
          type: string
          format: uuid
          description: Stabile UUID des Eintrags.
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Bezeichnung des Eintrags (nach Trim nicht-leer).
        completed:
          type: boolean
          default: false
          description: Erledigt-Status (Default `false`).
    TaskTreeNode:
      type: object
      required:
        - id
        - title
        - priority
        - estimatedEffort
        - totalEstimatedEffort
        - value
        - status
        - dependents
      properties:
        id:
          type: integer
        title:
          type: string
        priority:
          type: integer
        estimatedEffort:
          type: number
          format: float
        totalEstimatedEffort:
          type: number
          format: float
          description: Gesamtaufwand inkl. aller transitiven Abhängigkeiten
        value:
          type: number
          format: float
          description: Wertbeitrag des Tasks
        status:
          $ref: '#/components/schemas/TaskStatus'
        progress:
          type: object
          nullable: true
          description: >-
            Fortschritt (erledigt/gesamt) inkl. des Knotens selbst und aller transitiven
            Unteraufgaben, gezählt über die UNGEFILTERTE Abhängigkeitskette — also auch über
            erledigte Unteraufgaben, die aus `dependents` ausgeblendet sind (#392). Dadurch bleibt
            die Fortschrittsanzeige (#241) korrekt, obwohl erledigte Unteraufgaben nicht mehr im
            Baum erscheinen. `null`, wenn der Task keine Unteraufgaben hat.
          required:
            - done
            - total
          properties:
            done:
              type: integer
            total:
              type: integer
        dependents:
          type: array
          items:
            $ref: '#/components/schemas/TaskTreeNode'
    Pillar:
      type: object
      description: Eine der fünf festen Lebensbalance-Säulen (globale Stammdaten, für alle Nutzer identisch).
      required:
        - id
        - name
        - description
        - weight
      properties:
        id:
          type: integer
        name:
          type: string
          description: 'Name der Säule (z. B. Körper, Beziehungen, Sinn, Mentale Gesundheit, Wirksamkeit)'
        description:
          type: string
          description: >-
            Kurzbeschreibung der Säule (kanonische Stammdaten, nicht nutzereditierbar).
            Wird im Einstellungs-Menü angezeigt.
        weight:
          type: number
          format: float
          minimum: 0
          default: 20
          description: Prozentualer Anteil der Säule (alle Säulen summieren sich auf 100)
    PillarCreate:
      type: object
      description: Eingabe zum Anlegen einer neuen Säule.
      required:
        - name
      properties:
        name:
          type: string
          description: Name der Säule (nicht leer)
        description:
          type: string
          description: Optionale Kurzbeschreibung der Säule
    PillarUpdate:
      type: object
      description: Eingabe zum teilweisen Aktualisieren einer Säule. Mindestens ein Feld muss gesetzt sein.
      properties:
        name:
          type: string
          description: Neuer Name der Säule (nicht leer, falls gesetzt)
        description:
          type: string
          description: Neue Kurzbeschreibung
    PillarWeightsInput:
      type: object
      description: >-
        Neue 100 %-Verteilung über die Säulen. `weights` muss genau alle
        existierenden Säulen abdecken; die Summe aller `weight` muss 100 ergeben.
      required:
        - weights
      properties:
        weights:
          type: array
          minItems: 1
          description: Gewicht je Säule (Summe = 100).
          items:
            type: object
            required:
              - id
              - weight
            properties:
              id:
                type: integer
                minimum: 1
                description: ID der Säule
              weight:
                type: number
                format: float
                minimum: 0
                description: Prozentualer Anteil der Säule
    ActivityAdvisorInput:
      type: object
      description: >-
        Eingabe für den Aktivitäten-Berater. Die optionale Frage (z. B. „Was kann
        ich am Wochenende für mich tun?") lenkt die Vorschläge; ohne Frage schlägt
        der Berater Aktivitäten über alle Säulen hinweg vor. Optional kann der Client
        die aktuelle Säulen-Verteilung (Soll vs. Ist, wie im Dashboard „Meine Themen")
        mitschicken; der Berater priorisiert dann die am stärksten unterversorgten
        (schwächsten) Säulen.
      properties:
        question:
          type: string
          maxLength: 500
          description: Optionale Frage bzw. Situationsbeschreibung des Nutzers
        distribution:
          type: array
          description: >-
            Aktuelle Säulen-Verteilung aus dem Client (Dashboard „Meine Themen"): je
            Säule ihr Soll-Anteil (`weight`, 0–100 %) und ihr Ist-Anteil
            (`actualShare`, 0–1). Der Berater richtet die Vorschläge bevorzugt auf die
            am stärksten unterversorgten Säulen aus.
          items:
            $ref: '#/components/schemas/PillarDistributionEntry'
    ActivityAdvice:
      type: object
      description: >-
        Ein Vorschlag des Aktivitäten-Beraters — eine konkrete Aktivität samt der
        Säulen, auf die sie einzahlen würde, und einer kurzen Begründung.
      required:
        - activity
        - reason
        - pillarIds
      properties:
        activity:
          type: string
          description: Kurzer, konkreter Name der vorgeschlagenen Aktivität
        reason:
          type: string
          description: Kurze Begründung, warum die Aktivität auf die genannten Säulen einzahlt
        pillarIds:
          type: array
          description: IDs der Säulen, auf die die Aktivität einzahlen würde
          items:
            type: integer
            minimum: 1
    ActivityAdvisorResult:
      type: object
      description: Ergebnis des Aktivitäten-Beraters.
      required:
        - advice
      properties:
        advice:
          type: array
          description: Vorgeschlagene Aktivitäten samt Säulen-Zuordnung
          items:
            $ref: '#/components/schemas/ActivityAdvice'
    PillarDistributionEntry:
      type: object
      description: >-
        Verteilungs-Eintrag einer Säule aus dem Client (Dashboard „Meine Themen"):
        Soll-Anteil (`weight`) und Ist-Anteil (`actualShare`).
      required:
        - pillarId
        - weight
        - actualShare
      properties:
        pillarId:
          type: integer
          minimum: 1
          description: ID der Säule
        weight:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Soll-Anteil der Säule in Prozent (0–100)
        actualShare:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Ist-Anteil der Säule (0–1), wie im Client berechnet
    SuggestPillarsInput:
      type: object
      description: Eingabe für die Säulen-Klassifikation einer Aufgabe.
      required:
        - title
      properties:
        title:
          type: string
          description: Titel der Aufgabe (Pflichtfeld, nicht leer)
        description:
          type: string
          description: Optionale ausführliche Beschreibung der Aufgabe
        context:
          type: string
          description: Optionaler Kontext, z. B. zu abhängigen Aufgaben
    PillarSuggestion:
      type: object
      description: Eine vorgeschlagene Säulen-Einzahlung mit Konfidenz.
      required:
        - pillarId
        - confidence
      properties:
        pillarId:
          type: integer
          minimum: 1
          description: ID der Säule, auf die die Aufgabe einzahlt
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Konfidenz in % (0–100), dass die Aufgabe auf diese Säule einzahlt
    SuggestPillarsResult:
      type: object
      description: Ergebnis der Säulen-Klassifikation.
      required:
        - suggestions
      properties:
        suggestions:
          type: array
          description: Vorgeschlagene Säulen-Einzahlungen, nach pillarId sortiert
          items:
            $ref: '#/components/schemas/PillarSuggestion'
    ParseTaskInput:
      type: object
      description: Eingabe für die Task-Schnellerfassung — frei formulierter Text (#235).
      required:
        - text
      properties:
        text:
          type: string
          maxLength: 2000
          description: Frei formulierter Text, aus dem die Task-Felder extrahiert werden (nicht leer)
    ParsedTask:
      type: object
      description: >-
        Aus einem Freitext extrahierte, strukturierte Task-Felder (#235). Nur `title`
        ist garantiert gesetzt; die restlichen Felder liefert das Modell nur, wenn der
        Text sie hergibt.
      required:
        - title
      properties:
        title:
          type: string
          description: Kurzer, prägnanter Titel der Aufgabe (Pflichtfeld, nicht leer)
        description:
          type: string
          description: Optionale ausführliche Beschreibung der Aufgabe
        priority:
          type: integer
          minimum: 1
          maximum: 5
          description: Optionale Priorität 1–5 (1 = niedrig, 5 = hoch)
        estimatedEffort:
          type: number
          format: float
          minimum: 0
          description: Optionaler geschätzter Aufwand in Personentagen (z. B. 0.25 ≈ 2 h)
        deadline:
          type: string
          format: date-time
          description: Optionale Deadline als ISO-8601-Datum/Zeit-String
    PillarFeedbackInput:
      type: object
      description: >-
        Eine vom Nutzer bestätigte/korrigierte Säulen-Zuordnung, die als Lern-Sample
        für nachfolgende Vorschläge gespeichert wird (Feedback-Loop, #45).
      required:
        - title
        - pillars
      properties:
        title:
          type: string
          description: Titel der Aufgabe (Pflichtfeld, nicht leer)
        description:
          type: string
          description: Optionale Beschreibung der Aufgabe
        pillars:
          type: array
          description: Die final vom Nutzer gewählten Säulen samt Konfidenz
          items:
            $ref: '#/components/schemas/PillarSuggestion'
    PillarFeedbackResult:
      type: object
      description: Ergebnis des Speicherns eines Feedback-Samples.
      required:
        - id
      properties:
        id:
          type: integer
          minimum: 1
          description: ID des gespeicherten Feedback-Samples
    ScoreEntry:
      type: object
      required:
        - taskId
        - punkte
        - pünktlich
        - zeitpunkt
      properties:
        taskId:
          type: integer
          description: ID des erledigten Tasks (genau ein Eintrag je Task).
        punkte:
          type: number
          description: Vergebene Punkte (Basis `estimatedEffort × priority`, bei Verspätung reduziert).
        pünktlich:
          type: boolean
          description: Ob der Task vor/zur Deadline (oder ganz ohne Deadline) erledigt wurde.
        zeitpunkt:
          type: string
          format: date-time
          description: Erledigungszeitpunkt.
    PillarScore:
      type: object
      required:
        - pillarId
        - punkte
      properties:
        pillarId:
          type: integer
          description: ID der Säule.
        punkte:
          type: number
          description: Summe der anteilig (nach `share`) auf diese Säule entfallenden Punkte.
    SeriesRhythm:
      type: string
      enum:
        - daily
        - weekly
        - monthly
        - weekdays
        - weekend
        - mon
        - tue
        - wed
        - thu
        - fri
        - sat
        - sun
      default: weekly
      description: >-
        Wiederholungsrhythmus eines Serien-Templates (striktes RRULE-Subset, #120).
        Wochentag-basierte Rhythmen (#467): `weekdays` (Mo–Fr), `weekend` (Sa+So),
        `mon`…`sun` (jeweils genau dieser Wochentag) erzeugen mehrere Termine pro Woche.
        Bei `mon`…`sun` muss `startDate` auf dem benannten Wochentag liegen, sonst 400.
    Series:
      type: object
      description: >-
        Serien-Template einer wiederkehrenden Aufgabe (Habit, Konzept §4.2). Jede fällige
        Wiederholung wird als eigenständiger `Task` mit `seriesId` materialisiert.
      required:
        - id
        - title
        - rhythm
        - priority
        - estimatedEffort
        - active
        - startDate
        - pillars
      properties:
        id:
          type: integer
        title:
          type: string
        rhythm:
          $ref: '#/components/schemas/SeriesRhythm'
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
          description: Default-Priorität künftig generierter Instanzen.
        estimatedEffort:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
          default: 0.5
          description: Default-Aufwand künftig generierter Instanzen.
        active:
          type: boolean
          default: true
          description: Inaktive Templates erzeugen keine Instanzen.
        startDate:
          type: string
          format: date-time
          description: Anker, ab dem die Serie läuft (erster fälliger Termin).
        description:
          type: string
          nullable: true
          description: Freitext-Beschreibung des Templates (optional).
        autoDeleteAfterDeadline:
          type: boolean
          description: >-
            Wenn `true`, erben künftig generierte Instanzen diese Option und
            werden bei verpasster Deadline automatisch gelöscht (#523).
        pillars:
          type: array
          description: >-
            Säulen-Vorlage des Templates (0..n). Der `share` verteilt 100 %
            über die referenzierten Säulen; `confidence` ist die Konfidenz je Beitrag.
          items:
            $ref: '#/components/schemas/TaskPillarContribution'
    SeriesCreate:
      type: object
      required:
        - title
        - priority
        - estimatedEffort
        - startDate
      properties:
        title:
          type: string
        rhythm:
          $ref: '#/components/schemas/SeriesRhythm'
        priority:
          type: integer
          minimum: 1
          maximum: 5
          default: 3
        estimatedEffort:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
          default: 0.5
        active:
          type: boolean
          default: true
        startDate:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
        autoDeleteAfterDeadline:
          type: boolean
          description: >-
            Wenn `true`, erben künftig generierte Instanzen diese Option und
            werden bei verpasster Deadline automatisch gelöscht (#523).
        pillars:
          type: array
          description: >-
            Säulen-Vorlage des Templates (0..n). Wird das Feld weggelassen,
            bleibt das Template ohne Säulen. Bei mindestens einer Säule muss die
            Summe aller `share` 100 ergeben.
          items:
            $ref: '#/components/schemas/TaskPillarContributionInput'
    SeriesUpdate:
      type: object
      description: Alle Felder optional — gesetzte Felder gelten nur für künftige Instanzen.
      properties:
        title:
          type: string
        rhythm:
          $ref: '#/components/schemas/SeriesRhythm'
        priority:
          type: integer
          minimum: 1
          maximum: 5
        estimatedEffort:
          type: number
          format: float
          minimum: 0.1
          maximum: 1
        active:
          type: boolean
        startDate:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
        autoDeleteAfterDeadline:
          type: boolean
          description: >-
            Wenn `true`, erben künftig generierte Instanzen diese Option und
            werden bei verpasster Deadline automatisch gelöscht (#523).
        pillars:
          type: array
          description: >-
            Ersetzt die Säulen-Vorlage des Templates vollständig. Eine leere Liste
            entfernt alle Beiträge; bei mindestens einer Säule muss die Summe aller
            `share` 100 ergeben. Fehlt das Feld, bleibt die Vorlage unverändert.
          items:
            $ref: '#/components/schemas/TaskPillarContributionInput'
        applyToInstances:
          type: boolean
          description: >-
            `true` überträgt die im Serie-Edit GEÄNDERTEN kaskadierbaren Felder (`title`, `priority`,
            `estimatedEffort`, `description`, `autoDeleteAfterDeadline`, `pillars`) zusätzlich auf alle
            bestehenden Instanzen (inkl. `isException`). `rhythm`/`startDate`/`active` werden nie
            kaskadiert. Default `false` (nur Template, künftige Instanzen).
    SeriesGenerateInput:
      type: object
      required:
        - until
      properties:
        until:
          type: string
          format: date-time
          description: Letzter zu materialisierender Zeitpunkt (inklusive).
    SeriesGenerateAllResult:
      type: object
      required:
        - created
      properties:
        created:
          type: integer
          description: Anzahl der neu materialisierten Task-Instanzen.
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Fehlerbeschreibung
    VapidPublicKey:
      type: object
      required:
        - publicKey
      properties:
        publicKey:
          type: string
          description: Öffentlicher VAPID-Schlüssel (URL-safe Base64) für PushManager.subscribe().
    PushSubscriptionKeys:
      type: object
      required:
        - p256dh
        - auth
      properties:
        p256dh:
          type: string
          description: Öffentlicher ECDH-Schlüssel des Clients (aus PushSubscription.getKey('p256dh')).
        auth:
          type: string
          description: Auth-Secret des Clients (aus PushSubscription.getKey('auth')).
    PushSubscriptionInput:
      type: object
      required:
        - endpoint
        - keys
      description: >-
        Die vom Browser über `PushManager.subscribe().toJSON()` gelieferte
        Subscription. `endpoint` identifiziert den Push-Dienst-Kanal eindeutig;
        `keys` trägt die Verschlüsselungsschlüssel für die Payload.
      properties:
        endpoint:
          type: string
          description: Eindeutige Push-Dienst-URL dieses Clients.
        expirationTime:
          type: integer
          format: int64
          nullable: true
          description: Ablaufzeitpunkt in Epoch-Millisekunden (meist null).
        keys:
          $ref: '#/components/schemas/PushSubscriptionKeys'
    PushUnsubscribeInput:
      type: object
      required:
        - endpoint
      properties:
        endpoint:
          type: string
          description: Push-Dienst-URL der abzumeldenden Subscription.
    PushSubscriptionAck:
      type: object
      required:
        - endpoint
      properties:
        endpoint:
          type: string
          description: Bestätigter Endpoint der gespeicherten bzw. entfernten Subscription.
    TestPushResult:
      type: object
      required:
        - sent
        - quote
      properties:
        sent:
          type: integer
          description: Anzahl der erfolgreich zugestellten Push-Nachrichten.
        quote:
          $ref: '#/components/schemas/Quote'
    Quote:
      type: object
      required:
        - text
        - author
      properties:
        text:
          type: string
          description: Zitat-Text.
        author:
          type: string
          description: Urheber des Zitats.
    LlmProvider:
      type: object
      required:
        - id
        - name
        - endpoint
        - model
        - isActive
        - kind
        - hasApiKey
      description: >-
        Ein LLM-Provider. Zwei Arten: `kind=custom` (frei anlegbar, bearbeitbar,
        löschbar; Key liegt write-only in der DB) und `kind=builtin` („Mistral“
        und „OpenRouter“ — fix, nicht lösch-/bearbeitbar; Key und Endpoint
        kommen aus den ENV-Variablen des Servers). Genau ein Provider ist
        effektiv aktiv (`isActive`): die explizite Radio-Auswahl oder — wenn
        kein Custom-Provider gewählt ist — der Built-in-Fallback (Mistral vor
        OpenRouter, nach ENV-Key-Präsenz). API-Keys werden bewusst NICHT
        zurückgegeben (Write-Only).
      properties:
        id:
          type: integer
          description: ID des Providers.
        name:
          type: string
          description: Anzeigename (z. B. "Mistral", "OpenRouter", "z.ai").
        endpoint:
          type: string
          description: >-
            Basis-URL des Providers (OpenAI-kompatibel); bei Custom-Providern kann
            auch die vollständige Chat-Completions-URL gespeichert sein (Legacy).
        model:
          type: string
          description: >-
            Effektive Modellkennung (z. B. "mistral-medium-latest"). Bei Built-ins
            der Default aus ENV/Code, solange der Nutzer keins gewählt hat; leer bei
            Custom-Providern ohne Modellwahl.
        isActive:
          type: boolean
          description: Ist dieser Provider der effektiv aktive (Radio-Button-Auswahl oder Fallback)?
        kind:
          type: string
          enum: [custom, builtin]
          description: '„custom“ = frei verwaltbar, „builtin“ = fix (Mistral/OpenRouter).'
        hasApiKey:
          type: boolean
          description: >-
            Ob ein Key vorhanden ist (Built-in: ENV-Variable gesetzt; Custom: DB-Key
            gesetzt). Signalisiert nur die Präsenz, nie den Wert.
    LlmProviderInput:
      type: object
      required:
        - name
        - endpoint
        - apiKey
        - model
      description: >-
        Anlegen eines Custom-Providers: Name, Endpoint (gültige http(s)-URL),
        API-Key und Modell sind Pflicht. Das Modell ist bewusst schon beim
        Anlegen Pflicht, weil der `/models`-Endpoint nicht bei jedem Anbieter
        erreichbar/öffentlich ist — nach dem Anlegen kann es über die
        Modellliste des Providers geändert werden. Der Key wird nie
        zurückgegeben.
      properties:
        name:
          type: string
          description: Anzeigename des Providers.
        endpoint:
          type: string
          description: >-
            OpenAI-kompatible Basis-URL (http/https), z. B. https://api.mistral.ai/v1 —
            ein `/chat/completions`-Suffix wird toleriert und abgeschnitten.
        apiKey:
          type: string
          description: API-Key des Providers (Write-Only).
        model:
          type: string
          description: Modellkennung, z. B. `glm-4.7` (Pflicht — Modellliste nicht immer abrufbar).
    LlmProviderUpdate:
      type: object
      description: >-
        Bearbeiten eines Providers: alle Felder optional; der API-Key wird nur bei
        nicht-leerem String gesetzt (Bearbeiten-Dialog startet leer). Für Built-in-
        Provider ist ausschließlich `model` erlaubt (Modellwahl aus der Modellliste)
        — alles andere führt zu HTTP 400.
      properties:
        name:
          type: string
          description: Neuer Anzeigename (nur Custom-Provider).
        endpoint:
          type: string
          description: Neue Endpoint-URL (nur Custom-Provider).
        apiKey:
          type: string
          description: Neuer API-Key (nur bei Änderung senden; leer = unverändert; nur Custom-Provider).
        model:
          type: string
          description: Gewählte Modellkennung (Custom- und Built-in-Provider).
    LlmModel:
      type: object
      required:
        - id
        - name
      description: >-
        Ein verfügbares Modell eines Providers, aus dessen OpenAI-kompatibler
        `GET /models`-Antwort ausgelesen (nach `id` sortiert).
      properties:
        id:
          type: string
          description: Modellkennung (z. B. `mistral-medium-latest`).
        name:
          type: string
          description: Anzeigename — fiel der Upstream keinen, gilt die Modellkennung.
    LlmProviderTestResult:
      type: object
      required:
        - ok
      description: >-
        Ergebnis von `POST /llm-providers/{id}/test`: `ok=true` mit Modell,
        Latenz und Antwort-Auszug bei Erfolg; `ok=false` mit konkreter
        Fehlerursache (inkl. Upstream-Detail wie „Check your subscription“)
        bei Misserfolg. Nie den API-Key.
      properties:
        ok:
          type: boolean
          description: Hat der Test-Prompt den Provider erfolgreich durchlaufen?
        model:
          type: string
          description: Effektiv genutztes Modell (Erfolgsfall).
        latencyMs:
          type: number
          description: Round-Trip-Zeit des Test-Calls in Millisekunden (Erfolgsfall).
        sample:
          type: string
          description: Gekürzter Antwort-Text des Modells (Erfolgsfall).
        message:
          type: string
          description: Konkrete Fehlerursache bei Misserfolg (inkl. Upstream-Detail).
    LlmModels:
      type: object
      required:
        - models
      description: >-
        Antwort von `GET /llm-providers/{id}/models`: die verfügbaren Modelle des
        Providers, dynamisch aus dessen OpenAI-kompatibler `GET /models`-Antwort
        ausgelesen und nach `id` sortiert. Scheitert der Live-Abruf, kann ein
        Built-in mit Katalog (Mistral) diesen als Fallback liefern (`source:
        'fallback'`) — stabile `-latest`-Aliasse, damit die Modellwahl möglich
        bleibt (z. B. bei abgelaufenem Mistral-Abo, HTTP 402).
      properties:
        models:
          type: array
          description: Verfügbare Modelle (live geladen; im Fallback-Fall eingebauter Katalog).
          items:
            $ref: '#/components/schemas/LlmModel'
        source:
          type: string
          enum: [live, fallback]
          description: >-
            Herkunft der Liste: `live` (oder abwesend) = vom Provider geladen;
            `fallback` = eingebauter Katalog, weil der Live-Abruf scheiterte.
    ReverseGeocodeResponse:
      type: object
      required:
        - address
      description: >-
        Antwort von GET /reverse-geocode (Issue #866): die ermittelte Adresse
        (leer bei Fehler/Rate-Limit/Offline).
      properties:
        address:
          type: string
          description: >-
            Lesbare Adresse (z. B. "Musterstraße 1, 12345 Musterstadt").
            Leer bei Fehler/Rate-Limit/Offline — die Position wird ohne Adresse
            angezeigt.
    GeocodeSearchResult:
      type: object
      required:
        - address
        - lat
        - lon
      description: >-
        Ein Adress-Vorschlag der Adresssuche (Forward Geocoding, GET /geocode-search).
      properties:
        address:
          type: string
          description: Lesbare Adresse (Nominatim-Anzeigename).
        lat:
          type: number
          format: float
          description: Breitengrad des Vorschlags.
        lon:
          type: number
          format: float
          description: Längengrad des Vorschlags.
