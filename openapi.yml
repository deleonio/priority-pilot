      description: >-
        Setzt den Status auf `activated` (idempotent, #1982 AK3) und legt die
        DB-Zulassung (AllowedEmail, origin 'warteliste') an. Danach nimmt der
        bestehende Login-Flow die Adresse an (isDbEmailAllowed prüft die Freischaltung).
        Verschickt dazu eine Mail mit Login-Link (#2305); bei `failed` erneuter Versand
