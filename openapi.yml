              schema:
                type: object
                required: [activatedCount]
                properties:
                  activatedCount:
                    type: integer
                    minimum: 0
        '400':
          description: count fehlt oder ist keine ganze Zahl >= 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Angemeldeter Nutzer ist kein Admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/care-wirkung:
