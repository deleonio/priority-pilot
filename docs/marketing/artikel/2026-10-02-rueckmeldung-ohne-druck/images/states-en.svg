<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
	<rect width="1200" height="560" fill="#0f131a"/>
	<rect x="1" y="1" width="1198" height="558" rx="14" fill="none" stroke="#2a3140" stroke-width="2"/>
	<text x="36" y="52" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="600" fill="#e6edf3">Balamentum</text>
	<text x="1164" y="52" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#9aa4b2" text-anchor="end">The four designed states</text>
	
	<text x="60" y="118" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#9aa4b2">Feedback aimed at under 100 ms · icon and text, never color alone</text>
	<rect x="60" y="150" width="260" height="200" rx="12" fill="#161b22" stroke="#2a3140" stroke-width="2"/><circle cx="190" cy="212" r="17" fill="none" stroke="#2a3140" stroke-width="4"/>
		<path d="M 190 195 A 17 17 0 0 1 205 220" fill="none" stroke="#43d488" stroke-width="4" stroke-linecap="round"/><text x="190" y="278" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="600" fill="#e6edf3" text-anchor="middle">Loading…</text><text x="190" y="310" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9aa4b2" text-anchor="middle">skeleton over spinner</text>
	<rect x="340" y="150" width="260" height="200" rx="12" fill="#161b22" stroke="#2a3140" stroke-width="2"/><rect x="445" y="196" width="50" height="34" rx="6" fill="none" stroke="#9aa4b2" stroke-width="2.5" stroke-dasharray="6 5"/><text x="470" y="278" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="600" fill="#e6edf3" text-anchor="middle">Nothing here yet</text><text x="470" y="310" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9aa4b2" text-anchor="middle">an invitation to act</text>
	<rect x="620" y="150" width="260" height="200" rx="12" fill="#161b22" stroke="#2a3140" stroke-width="2"/><circle cx="750" cy="212" r="17" fill="none" stroke="#f0503c" stroke-width="3"/>
		<path d="M744,206 L756,218 M756,206 L744,218" stroke="#f0503c" stroke-width="3" stroke-linecap="round"/><text x="750" y="278" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="600" fill="#e6edf3" text-anchor="middle">Saving failed</text><text x="750" y="310" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9aa4b2" text-anchor="middle">cause + next step, no apology</text>
	<rect x="900" y="150" width="260" height="200" rx="12" fill="#161b22" stroke="#2a3140" stroke-width="2"/><circle cx="1030" cy="212" r="17" fill="none" stroke="#43d488" stroke-width="3"/>
		<path d="M1022,212 L1028,219 L1039,203" stroke="#43d488" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1030" y="278" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="600" fill="#e6edf3" text-anchor="middle">Saved</text><text x="1030" y="310" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9aa4b2" text-anchor="middle">quiet, one moment, then still</text>
	<text x="36" y="530" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#9aa4b2">Illustration: loading, empty, error, success — every state a view can land in is designed, not defaulted.</text>
</svg>
