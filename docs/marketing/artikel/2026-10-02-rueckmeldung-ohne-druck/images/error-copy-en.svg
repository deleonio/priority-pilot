<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
	<rect width="1200" height="480" fill="#0f131a"/>
	<rect x="1" y="1" width="1198" height="478" rx="14" fill="none" stroke="#2a3140" stroke-width="2"/>
	<text x="36" y="52" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="600" fill="#e6edf3">Balamentum</text>
	<text x="1164" y="52" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#9aa4b2" text-anchor="end">Error copy follows the review question</text>
	<rect x="60" y="140" width="520" height="220" rx="12" fill="#161b22" stroke="#2a3140" stroke-width="2"/>
	<text x="92" y="192" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#f0503c" letter-spacing="1.5">LOGS</text>
	<text x="92" y="240" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#e6edf3">“Oops! Something went wrong.”</text>
	<text x="92" y="286" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9aa4b2">no cause, no next step — the reader is left guessing</text><rect x="620" y="140" width="520" height="220" rx="12" fill="#161b22" stroke="#43d488" stroke-width="2"/>
	<text x="652" y="192" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#43d488" letter-spacing="1.5">CARES</text>
	<text x="652" y="240" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#e6edf3">“Saving failed — your changes are</text>
	<text x="652" y="270" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#e6edf3">still here. Try again?”</text>
	<text x="652" y="316" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9aa4b2">names the cause and the next step, no apology</text><text x="60" y="418" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#9aa4b2">The same rule as every care text: inform, offer a way forward, never blame.</text>
	<text x="36" y="450" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#9aa4b2">Illustration: two error messages for the same failure — one logs, one cares.</text>
</svg>
