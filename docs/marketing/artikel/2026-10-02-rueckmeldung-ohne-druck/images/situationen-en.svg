<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
	<rect width="1200" height="560" fill="#0f131a"/>
	<rect x="1" y="1" width="1198" height="558" rx="14" fill="none" stroke="#2a3140" stroke-width="2"/>
	<text x="36" y="52" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="600" fill="#e6edf3">Balamentum</text>
	<text x="1164" y="52" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#9aa4b2" text-anchor="end">Three situations, one tone</text>
	<rect x="60" y="150" width="336" height="280" rx="12" fill="#161b22" stroke="#f0503c" stroke-width="2"/><text x="88" y="196" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#f0503c" letter-spacing="1.5">DEFICIT</text><text x="88" y="238" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="600" fill="#e6edf3">Offer a small step for today</text><text x="88" y="282" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9aa4b2">“Your body could use a break. A</text><text x="88" y="310" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9aa4b2">short walk already does a lot</text><text x="88" y="338" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9aa4b2">today.”</text><rect x="432" y="150" width="336" height="280" rx="12" fill="#161b22" stroke="#efc23c" stroke-width="2"/><text x="460" y="196" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#efc23c" letter-spacing="1.5">OVERLOAD</text><text x="460" y="238" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="600" fill="#e6edf3">Give permission to cut back</text><text x="460" y="282" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9aa4b2">“Your day has limits. Pick the one</text><text x="460" y="310" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9aa4b2">thing that counts today — the rest</text><text x="460" y="338" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9aa4b2">may wait.”</text><rect x="804" y="150" width="336" height="280" rx="12" fill="#161b22" stroke="#43d488" stroke-width="2"/><text x="832" y="196" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#43d488" letter-spacing="1.5">ON TARGET</text><text x="832" y="238" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="600" fill="#e6edf3">Recognize what works</text><text x="832" y="282" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9aa4b2">“You moved things forward today. It</text><text x="832" y="310" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9aa4b2">shows — keep going at your pace.”</text><text x="60" y="478" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#9aa4b2">Verdict vocabulary — neglected, missed, failed — appears in none of them.</text>
	<text x="36" y="530" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#9aa4b2">Illustration: the care copy situations and what each one offers instead of judging.</text>
</svg>
