<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
	<rect width="1200" height="620" fill="#0f131a"/>
	<rect x="1" y="1" width="1198" height="618" rx="14" fill="none" stroke="#2a3140" stroke-width="2"/>
	<text x="36" y="52" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="600" fill="#e6edf3">Balamentum</text>
	<text x="1164" y="52" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#9aa4b2" text-anchor="end">Two loops</text>
	<text x="75" y="132" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#f0503c" letter-spacing="2">LOSS LOOP</text><rect x="75" y="150" width="240" height="76" rx="10" fill="#161b22" stroke="#f0503c" stroke-width="2"/><text x="195" y="196" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#e6edf3" text-anchor="middle">A counter collects days</text><line x1="319" y1="188" x2="337" y2="188" stroke="#9aa4b2" stroke-width="2"/><polygon points="345,188 335,183 335,193" fill="#9aa4b2"/><rect x="345" y="150" width="240" height="76" rx="10" fill="#161b22" stroke="#f0503c" stroke-width="2"/><text x="465" y="196" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#e6edf3" text-anchor="middle">One day stays empty</text><line x1="589" y1="188" x2="607" y2="188" stroke="#9aa4b2" stroke-width="2"/><polygon points="615,188 605,183 605,193" fill="#9aa4b2"/><rect x="615" y="150" width="240" height="76" rx="10" fill="#161b22" stroke="#f0503c" stroke-width="2"/><text x="735" y="182" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#e6edf3" text-anchor="middle">The chain resets</text><text x="735" y="208" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#e6edf3" text-anchor="middle">to zero</text><line x1="859" y1="188" x2="877" y2="188" stroke="#9aa4b2" stroke-width="2"/><polygon points="885,188 875,183 875,193" fill="#9aa4b2"/><rect x="885" y="150" width="240" height="76" rx="10" fill="#161b22" stroke="#f0503c" stroke-width="2"/><text x="1005" y="196" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#e6edf3" text-anchor="middle">Avoiding the app</text><path d="M1005,226 L1005,252 L195,252 L195,232" fill="none" stroke="#9aa4b2" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="195,226 190,236 200,236" fill="#9aa4b2"/><text x="75" y="342" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#43d488" letter-spacing="2">KEEPING LOOP</text><rect x="75" y="360" width="240" height="76" rx="10" fill="#161b22" stroke="#43d488" stroke-width="2"/><text x="195" y="406" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#e6edf3" text-anchor="middle">A counter collects days</text><line x1="319" y1="398" x2="337" y2="398" stroke="#9aa4b2" stroke-width="2"/><polygon points="345,398 335,393 335,403" fill="#9aa4b2"/><rect x="345" y="360" width="240" height="76" rx="10" fill="#161b22" stroke="#43d488" stroke-width="2"/><text x="465" y="406" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#e6edf3" text-anchor="middle">One day stays empty</text><line x1="589" y1="398" x2="607" y2="398" stroke="#9aa4b2" stroke-width="2"/><polygon points="615,398 605,393 605,403" fill="#9aa4b2"/><rect x="615" y="360" width="240" height="76" rx="10" fill="#161b22" stroke="#43d488" stroke-width="2"/><text x="735" y="392" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#e6edf3" text-anchor="middle">The best survives,</text><text x="735" y="418" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#e6edf3" text-anchor="middle">the count starts over</text><line x1="859" y1="398" x2="877" y2="398" stroke="#9aa4b2" stroke-width="2"/><polygon points="885,398 875,393 875,403" fill="#9aa4b2"/><rect x="885" y="360" width="240" height="76" rx="10" fill="#161b22" stroke="#43d488" stroke-width="2"/><text x="1005" y="406" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#e6edf3" text-anchor="middle">Tomorrow, no penalty</text><path d="M1005,436 L1005,462 L195,462 L195,442" fill="none" stroke="#9aa4b2" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="195,436 190,446 200,446" fill="#9aa4b2"/>
	<text x="36" y="590" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#9aa4b2">Illustration: the same trigger, two outcomes — the difference is whether the counter takes something away.</text>
</svg>
