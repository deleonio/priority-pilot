	<text x="1164" y="52" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#9aa4b2" text-anchor="end">Fünf Säulen, Ist gegen Soll</text>
	<line x1="120" y1="401.25" x2="640" y2="401.25" stroke="#2a3140" stroke-width="1.5"/><text x="106" y="408.25" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#9aa4b2" text-anchor="end">0,50</text><line x1="120" y1="282.5" x2="640" y2="282.5" stroke="#2a3140" stroke-width="1.5"/><text x="106" y="289.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#9aa4b2" text-anchor="end">1,00</text><line x1="120" y1="163.75" x2="640" y2="163.75" stroke="#2a3140" stroke-width="1.5"/><text x="106" y="170.75" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#9aa4b2" text-anchor="end">1,50</text><line x1="120" y1="282.5" x2="640" y2="282.5" stroke="#9aa4b2" stroke-width="2.2" stroke-dasharray="8 6"/><text x="640" y="268.5" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#9aa4b2" text-anchor="end">Soll (1,0)</text><rect x="150" y="246.875" width="64" height="273.125" rx="8" fill="#f0210f" fill-opacity="0.75"/><text x="182" y="230.875" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#e6edf3" text-anchor="middle">1,15</text><text x="182" y="554" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9aa4b2" text-anchor="middle"><tspan x="182" dy="0">Körper</tspan></text><rect x="262" y="365.625" width="64" height="154.375" rx="8" fill="#e7f831" fill-opacity="0.75"/><text x="294" y="349.625" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#e6edf3" text-anchor="middle">0,65</text><text x="294" y="554" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9aa4b2" text-anchor="middle"><tspan x="294" dy="0">Mentale</tspan><tspan x="294" dy="22">Gesundheit</tspan></text><rect x="374" y="199.375" width="64" height="320.625" rx="8" fill="#5af2a6" fill-opacity="0.75"/><text x="406" y="183.375" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#e6edf3" text-anchor="middle">1,35</text><text x="406" y="554" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9aa4b2" text-anchor="middle"><tspan x="406" dy="0">Beziehungen</tspan></text><rect x="486" y="306.25" width="64" height="213.75" rx="8" fill="#4324db" fill-opacity="0.75"/><text x="518" y="290.25" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#e6edf3" text-anchor="middle">0,90</text><text x="518" y="554" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9aa4b2" text-anchor="middle"><tspan x="518" dy="0">Wirksamkeit</tspan></text><rect x="598" y="413.125" width="64" height="106.875" rx="8" fill="#c22aef" fill-opacity="0.75"/><text x="630" y="397.125" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="22" fill="#e6edf3" text-anchor="middle">0,45</text><text x="630" y="554" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" fill="#9aa4b2" text-anchor="middle"><tspan x="630" dy="0">Sinn</tspan></text><text x="740" y="190" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="600" fill="#e6edf3">Die Lesart</text><text x="740" y="236" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="23" fill="#e6edf3">0,5</text><text x="800" y="236" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="23" fill="#9aa4b2">halb so viel wie nötig</text><text x="740" y="288" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="23" fill="#e6edf3">1,0</text><text x="800" y="288" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="23" fill="#9aa4b2">genau auf Ziel</text><text x="740" y="340" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="23" fill="#e6edf3">1,5</text><text x="800" y="340" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="23" fill="#9aa4b2">zieht davon</text><text x="740" y="440" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#9aa4b2">Ungedeckelt: Übererfüllung ist</text><text x="740" y="472" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#9aa4b2">genauso eine Aussage wie Rückstand.</text>
	<text x="36" y="610" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="20" fill="#9aa4b2">Illustration: die Kennzahl je Säule — Ist ÷ Soll. Demo-Daten; die gestrichelte Linie liegt bei 1,0.</text>
